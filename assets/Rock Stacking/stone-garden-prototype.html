<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Stone Garden — Petal Walk</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d100c;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;pointer-events:none;z-index:10}
.hud-box{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;color:#E8DCC8;text-align:center;line-height:1.1}
.hud-box .label{font-size:.55rem;opacity:.5;color:#4A7C35}
.hud-box .val{font-size:1.2rem}
#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#E8DCC8;letter-spacing:3px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20;text-shadow:0 0 20px rgba(74,124,53,0.5)}
#msg.show{opacity:1}
#start-overlay{position:fixed;inset:0;background:rgba(13,16,12,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#start-overlay.hidden{display:none}
#start-overlay h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:#4A7C35;letter-spacing:4px;margin-bottom:4px}
#start-overlay .sub{font-family:'Crimson Text',serif;font-style:italic;color:#E8DCC8;opacity:.6;margin-bottom:24px;font-size:.9rem}
.mode-btn{display:block;width:220px;margin:6px auto;background:rgba(26,36,22,0.8);border:1.5px solid rgba(74,124,53,0.4);color:#E8DCC8;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;padding:14px;border-radius:10px;cursor:pointer;transition:all .2s;text-align:center}
.mode-btn:active{background:rgba(74,124,53,0.3);transform:scale(0.95)}
.mode-btn .mode-sub{font-family:'Crimson Text',serif;font-size:.7rem;opacity:.6;letter-spacing:0;margin-top:2px}
.rot-btn{position:fixed;bottom:80px;width:52px;height:52px;border-radius:50%;background:rgba(26,36,22,0.7);border:1.5px solid rgba(74,124,53,0.3);color:#E8DCC8;font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;font-family:'Bebas Neue',sans-serif;transition:all .15s}
.rot-btn:active{background:rgba(74,124,53,0.4);transform:scale(0.9)}
#rot-l{left:16px}
#rot-r{right:16px}
</style>
</head>
<body>

<div id="start-overlay">
  <h1>STONE GARDEN</h1>
  <div class="sub">Stack stones in a zen garden</div>
  <button class="mode-btn" onclick="beginGame('zen')">🪨 ZEN MODE<div class="mode-sub">No fail state. Build freely. Find your peace.</div></button>
  <button class="mode-btn" onclick="beginGame('challenge')">⛰ CHALLENGE MODE<div class="mode-sub">Reach the target height. Limited lives.</div></button>
</div>

<div id="hud" style="display:none">
  <div class="hud-box"><div class="label" id="h-mode-label">HEIGHT</div><div class="val" id="h-height">0</div></div>
  <div class="hud-box"><div class="label">STONES</div><div class="val" id="h-stones">0</div></div>
  <div class="hud-box"><div class="label" id="h-right-label">BEST</div><div class="val" id="h-right-val">0</div></div>
</div>

<div id="msg"></div>
<canvas id="c"></canvas>

<div class="rot-btn" id="rot-l" style="display:none" ontouchstart="rotateStone(-1);event.preventDefault()" onmousedown="rotateStone(-1)">↺</div>
<div class="rot-btn" id="rot-r" style="display:none" ontouchstart="rotateStone(1);event.preventDefault()" onmousedown="rotateStone(1)">↻</div>

<script>
(function(){
'use strict';

// ─── CANVAS ──────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H, dpr;
var GROUND_Y;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  GROUND_Y = H * 0.85;
}
resize();
window.addEventListener('resize', resize);

// ─── PHYSICS CONSTANTS ───────────────────────────────────
var GRAVITY = 580;
var RESTITUTION = 0.12;
var FRICTION = 0.65;
var ANG_DAMP = 0.94;
var LIN_DAMP = 0.998;
var SETTLE_VEL = 0.8;
var SETTLE_ANG = 0.01;
var SETTLE_FRAMES = 40;
var SUBSTEPS = 4;

// ─── GAME STATE ──────────────────────────────────────────
var mode = 'zen'; // zen or challenge
var gameState = 'menu'; // menu, placing, dropping, settling, gameover
var stones = [];
var hoverStone = null; // the stone being positioned
var hoverX = 0;
var score = 0;
var stonesPlaced = 0;
var maxHeight = 0;
var bestHeight = 0;
var lives = 3;
var challengeLevel = 1;
var targetHeight = 0;
var toppleCount = 0;
var settleCounter = 0;
var particles = [];
var shakeX = 0, shakeY = 0;
var shakeDecay = 0;
var mossTimers = []; // per stone

// ─── STONE GENERATION ────────────────────────────────────
function makeStone(difficulty) {
  var minW, maxW, minH, maxH;
  if (difficulty <= 3) { minW = 50; maxW = 90; minH = 20; maxH = 35; }
  else if (difficulty <= 6) { minW = 35; maxW = 85; minH = 18; maxH = 40; }
  else if (difficulty <= 10) { minW = 25; maxW = 80; minH = 15; maxH = 45; }
  else if (difficulty <= 15) { minW = 20; maxW = 75; minH = 12; maxH = 50; }
  else { minW = 15; maxW = 70; minH = 10; maxH = 55; }

  var w = minW + Math.random() * (maxW - minW);
  var h = minH + Math.random() * (maxH - minH);

  // Irregular vertices (visual shape)
  var verts = [];
  var hw = w / 2, hh = h / 2;
  var numV = 6 + Math.floor(Math.random() * 3);
  for (var i = 0; i < numV; i++) {
    var a = (i / numV) * Math.PI * 2 - Math.PI / 2;
    var rx = hw * (0.7 + Math.random() * 0.35);
    var ry = hh * (0.7 + Math.random() * 0.35);
    verts.push({x: Math.cos(a) * rx, y: Math.sin(a) * ry});
  }

  // Color variation
  var gray = 90 + Math.floor(Math.random() * 40);
  var warmth = Math.floor(Math.random() * 15) - 5;
  var color = 'rgb(' + (gray + warmth) + ',' + (gray + Math.floor(warmth*0.5)) + ',' + (gray - warmth) + ')';
  var darkColor = 'rgb(' + (gray - 20 + warmth) + ',' + (gray - 20) + ',' + (gray - 20 - warmth) + ')';

  var mass = w * h * 0.01;
  var inertia = mass * (w * w + h * h) / 12;

  return {
    x: 0, y: 0,
    vx: 0, vy: 0,
    angle: 0, angVel: 0,
    w: w, h: h,
    hw: w/2, hh: h/2,
    mass: mass,
    invMass: 1 / mass,
    inertia: inertia,
    invInertia: 1 / inertia,
    verts: verts,
    color: color,
    darkColor: darkColor,
    settled: false,
    settleTimer: 0,
    mossLevel: 0, // 0-1, grows over time when settled
    isStatic: false
  };
}

// ─── OBB COLLISION (SAT) ─────────────────────────────────
function getCorners(s) {
  var c = Math.cos(s.angle), sn = Math.sin(s.angle);
  var hw = s.hw, hh = s.hh;
  return [
    {x: s.x + (-hw*c - -hh*sn), y: s.y + (-hw*sn + -hh*c)},
    {x: s.x + ( hw*c - -hh*sn), y: s.y + ( hw*sn + -hh*c)},
    {x: s.x + ( hw*c -  hh*sn), y: s.y + ( hw*sn +  hh*c)},
    {x: s.x + (-hw*c -  hh*sn), y: s.y + (-hw*sn +  hh*c)}
  ];
}

function getAxes(corners) {
  var axes = [];
  for (var i = 0; i < corners.length; i++) {
    var j = (i + 1) % corners.length;
    var edge = {x: corners[j].x - corners[i].x, y: corners[j].y - corners[i].y};
    var len = Math.sqrt(edge.x*edge.x + edge.y*edge.y);
    if (len < 0.001) continue;
    axes.push({x: -edge.y / len, y: edge.x / len});
  }
  return axes;
}

function projectOnAxis(corners, axis) {
  var min = Infinity, max = -Infinity;
  for (var i = 0; i < corners.length; i++) {
    var p = corners[i].x * axis.x + corners[i].y * axis.y;
    if (p < min) min = p;
    if (p > max) max = p;
  }
  return {min: min, max: max};
}

function satTest(stoneA, stoneB) {
  var cornersA = getCorners(stoneA);
  var cornersB = getCorners(stoneB);
  var allAxes = getAxes(cornersA).concat(getAxes(cornersB));

  var minOverlap = Infinity;
  var minAxis = null;

  for (var i = 0; i < allAxes.length; i++) {
    var ax = allAxes[i];
    var pA = projectOnAxis(cornersA, ax);
    var pB = projectOnAxis(cornersB, ax);

    var overlap = Math.min(pA.max - pB.min, pB.max - pA.min);
    if (overlap <= 0) return null; // no collision

    if (overlap < minOverlap) {
      minOverlap = overlap;
      minAxis = ax;
    }
  }

  // Ensure normal points from A to B
  var dx = stoneB.x - stoneA.x;
  var dy = stoneB.y - stoneA.y;
  if (dx * minAxis.x + dy * minAxis.y < 0) {
    minAxis = {x: -minAxis.x, y: -minAxis.y};
  }

  return {normal: minAxis, depth: minOverlap};
}

function resolveCollision(a, b, col) {
  var n = col.normal;
  var depth = col.depth;

  // Separate bodies
  var totalInvMass = (a.isStatic ? 0 : a.invMass) + (b.isStatic ? 0 : b.invMass);
  if (totalInvMass === 0) return;

  var sep = depth / totalInvMass;
  if (!a.isStatic) { a.x -= n.x * sep * a.invMass; a.y -= n.y * sep * a.invMass; }
  if (!b.isStatic) { b.x += n.x * sep * b.invMass; b.y += n.y * sep * b.invMass; }

  // Contact point (approximate: midpoint between centers projected)
  var cpx = (a.x + b.x) * 0.5;
  var cpy = (a.y + b.y) * 0.5;

  // Relative velocity at contact
  var raX = cpx - a.x, raY = cpy - a.y;
  var rbX = cpx - b.x, rbY = cpy - b.y;

  var vaX = a.vx + (-a.angVel * raY);
  var vaY = a.vy + ( a.angVel * raX);
  var vbX = b.vx + (-b.angVel * rbY);
  var vbY = b.vy + ( b.angVel * rbX);

  var relVx = vbX - vaX;
  var relVy = vbY - vaY;
  var relVn = relVx * n.x + relVy * n.y;

  if (relVn > 0) return; // separating

  var raCrossN = raX * n.y - raY * n.x;
  var rbCrossN = rbX * n.y - rbY * n.x;

  var invMassSum = (a.isStatic ? 0 : a.invMass) + (b.isStatic ? 0 : b.invMass) +
    (a.isStatic ? 0 : raCrossN * raCrossN * a.invInertia) +
    (b.isStatic ? 0 : rbCrossN * rbCrossN * b.invInertia);

  var j = -(1 + RESTITUTION) * relVn / invMassSum;

  // Normal impulse
  if (!a.isStatic) {
    a.vx -= j * n.x * a.invMass;
    a.vy -= j * n.y * a.invMass;
    a.angVel -= raCrossN * j * a.invInertia;
  }
  if (!b.isStatic) {
    b.vx += j * n.x * b.invMass;
    b.vy += j * n.y * b.invMass;
    b.angVel += rbCrossN * j * b.invInertia;
  }

  // Friction impulse (tangent)
  var tx = relVx - relVn * n.x;
  var ty = relVy - relVn * n.y;
  var tLen = Math.sqrt(tx*tx + ty*ty);
  if (tLen > 0.001) {
    tx /= tLen; ty /= tLen;
    var relVt = relVx * tx + relVy * ty;
    var raCrossT = raX * ty - raY * tx;
    var rbCrossT = rbX * ty - rbY * tx;
    var invMassT = (a.isStatic ? 0 : a.invMass) + (b.isStatic ? 0 : b.invMass) +
      (a.isStatic ? 0 : raCrossT * raCrossT * a.invInertia) +
      (b.isStatic ? 0 : rbCrossT * rbCrossT * b.invInertia);
    var jt = -relVt / invMassT;
    // Coulomb friction: clamp tangent impulse
    if (Math.abs(jt) > Math.abs(j) * FRICTION) {
      jt = (jt > 0 ? 1 : -1) * Math.abs(j) * FRICTION;
    }
    if (!a.isStatic) {
      a.vx -= jt * tx * a.invMass;
      a.vy -= jt * ty * a.invMass;
      a.angVel -= raCrossT * jt * a.invInertia;
    }
    if (!b.isStatic) {
      b.vx += jt * tx * b.invMass;
      b.vy += jt * ty * b.invMass;
      b.angVel += rbCrossT * jt * b.invInertia;
    }
  }

  // Spawn dust on significant impact
  var impactSpeed = Math.abs(relVn);
  if (impactSpeed > 60) {
    spawnDust(cpx, cpy, Math.min(impactSpeed * 0.05, 8));
    addShake(Math.min(impactSpeed * 0.015, 4));
    try { navigator.vibrate && navigator.vibrate(Math.min(Math.floor(impactSpeed * 0.08), 40)); } catch(e) {}
  }
}

function groundCollision(s) {
  if (s.isStatic) return;
  var corners = getCorners(s);
  for (var i = 0; i < corners.length; i++) {
    var cy = corners[i].y;
    if (cy > GROUND_Y) {
      var pen = cy - GROUND_Y;
      s.y -= pen;

      // Contact point relative to center
      var rx = corners[i].x - s.x;
      var ry = corners[i].y - s.y;

      // Normal impulse (ground normal is (0,-1))
      var velAtContact = s.vy + s.angVel * rx;
      if (velAtContact > 0) {
        var rCrossN = rx; // rx * (-1) cross product simplified
        var invM = s.invMass + rCrossN * rCrossN * s.invInertia;
        var j = -(1 + RESTITUTION) * velAtContact / invM;
        s.vy += j * s.invMass;
        s.angVel += rCrossN * j * s.invInertia;

        // Friction
        var velTx = s.vx - s.angVel * ry;
        var rCrossT = -ry;
        var invMT = s.invMass + rCrossT * rCrossT * s.invInertia;
        var jt = -velTx / invMT;
        if (Math.abs(jt) > Math.abs(j) * FRICTION) jt = (jt > 0 ? 1 : -1) * Math.abs(j) * FRICTION;
        s.vx += jt * s.invMass;
        s.angVel += rCrossT * jt * s.invInertia;
      }

      if (Math.abs(velAtContact) > 40) {
        spawnDust(corners[i].x, GROUND_Y, Math.min(Math.abs(velAtContact) * 0.04, 6));
        addShake(Math.min(Math.abs(velAtContact) * 0.01, 3));
        try { navigator.vibrate && navigator.vibrate(Math.min(Math.floor(Math.abs(velAtContact)*0.06),30)); } catch(e){}
      }
    }
  }
  // Keep in horizontal bounds
  if (s.x - s.hw < 0) { s.x = s.hw; s.vx = Math.abs(s.vx) * 0.3; }
  if (s.x + s.hw > W) { s.x = W - s.hw; s.vx = -Math.abs(s.vx) * 0.3; }
}

// ─── PARTICLES ───────────────────────────────────────────
function spawnDust(x, y, count) {
  for (var i = 0; i < count; i++) {
    particles.push({
      x: x + (Math.random()-0.5)*10,
      y: y + (Math.random()-0.5)*5,
      vx: (Math.random()-0.5)*60,
      vy: -20 - Math.random()*40,
      life: 0.4 + Math.random()*0.4,
      maxLife: 0.4 + Math.random()*0.4,
      size: 2 + Math.random()*3,
      color: Math.random()>0.5 ? 'rgba(160,140,110,' : 'rgba(120,110,90,'
    });
  }
}

function spawnHeightCelebration() {
  for (var i = 0; i < 12; i++) {
    particles.push({
      x: W/2 + (Math.random()-0.5)*60,
      y: GROUND_Y - maxHeight,
      vx: (Math.random()-0.5)*30,
      vy: -30 - Math.random()*50,
      life: 0.8+Math.random()*0.6,
      maxLife: 0.8+Math.random()*0.6,
      size: 2+Math.random()*3,
      color: Math.random()>0.5 ? 'rgba(212,168,67,' : 'rgba(74,124,53,'
    });
  }
}

function addShake(amount) {
  shakeDecay = Math.max(shakeDecay, amount);
}

// ─── PHYSICS STEP ────────────────────────────────────────
function physicsStep(dt) {
  var subDt = dt / SUBSTEPS;
  for (var sub = 0; sub < SUBSTEPS; sub++) {
    // Integrate
    for (var i = 0; i < stones.length; i++) {
      var s = stones[i];
      if (s.isStatic || s.settled) continue;
      s.vy += GRAVITY * subDt;
      s.vx *= LIN_DAMP;
      s.x += s.vx * subDt;
      s.y += s.vy * subDt;
      s.angVel *= ANG_DAMP;
      s.angle += s.angVel * subDt;
    }
    // Collisions
    for (i = 0; i < stones.length; i++) {
      if (stones[i].isStatic) continue;
      groundCollision(stones[i]);
      for (var j = i + 1; j < stones.length; j++) {
        var col = satTest(stones[i], stones[j]);
        if (col) resolveCollision(stones[i], stones[j], col);
      }
    }
  }

  // Settle detection
  for (i = 0; i < stones.length; i++) {
    var st = stones[i];
    if (st.isStatic || st.settled) continue;
    var speed = Math.sqrt(st.vx*st.vx + st.vy*st.vy);
    if (speed < SETTLE_VEL && Math.abs(st.angVel) < SETTLE_ANG) {
      st.settleTimer++;
      if (st.settleTimer > SETTLE_FRAMES) {
        st.settled = true;
        st.vx = 0; st.vy = 0; st.angVel = 0;
      }
    } else {
      st.settleTimer = 0;
    }
  }

  // Moss growth on settled stones
  for (i = 0; i < stones.length; i++) {
    if (stones[i].settled && stones[i].mossLevel < 1) {
      stones[i].mossLevel = Math.min(1, stones[i].mossLevel + dt * 0.06);
    }
  }

  // Update particles
  for (i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 60 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake decay
  if (shakeDecay > 0.05) {
    shakeX = (Math.random()-0.5) * shakeDecay * 2;
    shakeY = (Math.random()-0.5) * shakeDecay * 2;
    shakeDecay *= 0.85;
  } else {
    shakeX = 0; shakeY = 0; shakeDecay = 0;
  }
}

// ─── HEIGHT MEASUREMENT ──────────────────────────────────
function measureHeight() {
  var topY = GROUND_Y;
  for (var i = 0; i < stones.length; i++) {
    var s = stones[i];
    var corners = getCorners(s);
    for (var c = 0; c < corners.length; c++) {
      if (corners[c].y < topY) topY = corners[c].y;
    }
  }
  return Math.max(0, Math.round(GROUND_Y - topY));
}

function checkTopple() {
  // Check if any stone fell far below ground or off screen
  for (var i = stones.length - 1; i >= 0; i--) {
    if (stones[i].y > GROUND_Y + 100 || stones[i].x < -100 || stones[i].x > W + 100) {
      stones.splice(i, 1);
      return true;
    }
  }
  // Check if height decreased significantly (means something fell)
  var h = measureHeight();
  if (stonesPlaced > 2 && h < maxHeight * 0.5 && maxHeight > 30) {
    return true;
  }
  return false;
}

// ─── DRAWING ─────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#0d100c';
  ctx.fillRect(0, 0, W, H);

  // Zen garden sand pattern
  ctx.strokeStyle = 'rgba(60,55,45,0.08)';
  ctx.lineWidth = 1;
  for (var y = GROUND_Y + 5; y < H; y += 8) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (var x = 0; x < W; x += 3) {
      ctx.lineTo(x, y + Math.sin(x * 0.02 + y * 0.1) * 2);
    }
    ctx.stroke();
  }

  // Ground line
  ctx.strokeStyle = 'rgba(90,80,65,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();

  // Ground fill
  var grd = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  grd.addColorStop(0, 'rgba(50,45,35,0.2)');
  grd.addColorStop(1, 'rgba(30,28,22,0.3)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // Tiny pebbles
  ctx.fillStyle = 'rgba(80,75,65,0.15)';
  for (var pi = 0; pi < 20; pi++) {
    var px = (pi * 137.5) % W;
    var py = GROUND_Y + 5 + (pi * 31.7) % (H - GROUND_Y - 10);
    ctx.beginPath();
    ctx.arc(px, py, 1 + (pi % 3), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTargetLine() {
  if (mode !== 'challenge' || targetHeight <= 0) return;
  var ty = GROUND_Y - targetHeight;
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = 'rgba(212,168,67,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(20, ty);
  ctx.lineTo(W - 20, ty);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(212,168,67,0.4)';
  ctx.font = '10px "Bebas Neue", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('TARGET', W - 24, ty - 4);
}

function drawStone(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);

  // Stone body (irregular polygon)
  ctx.beginPath();
  ctx.moveTo(s.verts[0].x, s.verts[0].y);
  for (var i = 1; i < s.verts.length; i++) {
    // Smooth with quadratic curves
    var prev = s.verts[i-1];
    var curr = s.verts[i];
    var mx = (prev.x + curr.x) / 2;
    var my = (prev.y + curr.y) / 2;
    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
  }
  var last = s.verts[s.verts.length-1];
  var first = s.verts[0];
  ctx.quadraticCurveTo(last.x, last.y, (last.x+first.x)/2, (last.y+first.y)/2);
  ctx.closePath();

  // Fill with gradient for depth
  var grd = ctx.createLinearGradient(-s.hw, -s.hh, s.hw, s.hh);
  grd.addColorStop(0, s.color);
  grd.addColorStop(1, s.darkColor);
  ctx.fillStyle = grd;
  ctx.fill();

  // Subtle outline
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Inner highlight
  ctx.beginPath();
  ctx.ellipse(-s.hw*0.2, -s.hh*0.3, s.hw*0.3, s.hh*0.3, -0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();

  // Moss overlay
  if (s.mossLevel > 0) {
    ctx.globalAlpha = s.mossLevel * 0.4;
    for (var mi = 0; mi < 5; mi++) {
      var mxx = (mi * 17.3 % s.w) - s.hw;
      var myy = s.hh * 0.1 + (mi * 11.7 % (s.hh));
      ctx.fillStyle = '#3a5a2a';
      ctx.beginPath();
      ctx.ellipse(mxx, myy, 4 + mi*1.5, 2 + mi*0.8, mi*0.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawHoverStone() {
  if (!hoverStone || gameState !== 'placing') return;

  // Draw ghost guide line
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = 'rgba(232,220,200,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(hoverStone.x, hoverStone.y + hoverStone.hh);
  ctx.lineTo(hoverStone.x, GROUND_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw stone with slight transparency
  ctx.globalAlpha = 0.8;
  drawStone(hoverStone);
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var alpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawLives() {
  if (mode !== 'challenge') return;
  ctx.fillStyle = 'rgba(232,220,200,0.5)';
  ctx.font = '11px "Bebas Neue", sans-serif';
  ctx.textAlign = 'center';
  var lifeStr = '';
  for (var i = 0; i < lives; i++) lifeStr += '♥ ';
  ctx.fillText(lifeStr, W/2, H - 12);
}

function drawHeightRuler() {
  if (maxHeight < 20) return;
  ctx.fillStyle = 'rgba(74,124,53,0.15)';
  ctx.font = '8px "Courier New", monospace';
  ctx.textAlign = 'left';
  for (var h = 50; h < maxHeight + 50; h += 50) {
    var ry = GROUND_Y - h;
    if (ry < 50) break;
    ctx.fillText(h + 'px', 4, ry + 3);
    ctx.fillRect(0, ry, 14, 0.5);
  }
}

// ─── MAIN RENDER ─────────────────────────────────────────
function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawTargetLine();
  drawHeightRuler();

  for (var i = 0; i < stones.length; i++) {
    drawStone(stones[i]);
  }

  drawHoverStone();
  drawParticles();
  drawLives();

  ctx.restore();
}

// ─── GAME LOGIC ──────────────────────────────────────────
function spawnNextStone() {
  var diff = mode === 'challenge' ? challengeLevel : Math.min(20, Math.floor(stonesPlaced / 3) + 1);
  hoverStone = makeStone(diff);
  hoverStone.x = W / 2;
  hoverStone.y = 60;
  gameState = 'placing';
}

function dropStone() {
  if (!hoverStone || gameState !== 'placing') return;
  gameState = 'dropping';
  stones.push(hoverStone);
  hoverStone = null;
  settleCounter = 0;
}

function onAllSettled() {
  var h = measureHeight();
  var newRecord = false;
  if (h > maxHeight) {
    maxHeight = h;
    if (h > bestHeight) {
      bestHeight = h;
      newRecord = true;
      spawnHeightCelebration();
    }
  }
  stonesPlaced++;
  updateHUD();

  // Check topple
  if (checkTopple()) {
    toppleCount++;
    if (mode === 'challenge') {
      lives--;
      if (lives <= 0) {
        gameState = 'gameover';
        showMsg('GAME OVER', 2);
        setTimeout(function() { backToMenu(); }, 2500);
        return;
      } else {
        showMsg('TOPPLE! ' + lives + ' ♥ left', 1.2);
      }
    } else {
      showMsg('TOPPLE!', 0.8);
    }
  } else {
    if (newRecord) showMsg('NEW HEIGHT!', 1);

    // Check challenge level complete
    if (mode === 'challenge' && maxHeight >= targetHeight) {
      challengeLevel++;
      targetHeight = 80 + challengeLevel * 40;
      maxHeight = 0;
      stones = [];
      showMsg('LEVEL ' + challengeLevel + '!', 1.5);
      if (typeof window._e === 'function') window._e('milestone');
    }

    // Hash milestones
    if (stonesPlaced % 3 === 0 && typeof window._e === 'function') {
      window._e('milestone');
    }
  }

  // Spawn next
  setTimeout(function() {
    if (gameState === 'gameover') return;
    spawnNextStone();
  }, 400);
}

// ─── INPUT ───────────────────────────────────────────────
var isDragging = false;

function onDown(e) {
  e.preventDefault();
  if (gameState !== 'placing' || !hoverStone) return;
  isDragging = true;
  moveHover(e);
}

function onMove(e) {
  e.preventDefault();
  if (!isDragging || gameState !== 'placing' || !hoverStone) return;
  moveHover(e);
}

function onUp(e) {
  e.preventDefault();
  if (!isDragging) return;
  isDragging = false;
  dropStone();
}

function moveHover(e) {
  var x;
  if (e.touches && e.touches.length > 0) x = e.touches[0].clientX;
  else x = e.clientX;
  if (hoverStone) {
    hoverStone.x = Math.max(hoverStone.hw + 5, Math.min(W - hoverStone.hw - 5, x));
  }
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

window.rotateStone = function(dir) {
  if (hoverStone && gameState === 'placing') {
    hoverStone.angle += dir * 0.26; // ~15 degrees
  }
};

// ─── HUD ─────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('h-height').textContent = maxHeight;
  document.getElementById('h-stones').textContent = stonesPlaced;
  if (mode === 'zen') {
    document.getElementById('h-right-label').textContent = 'BEST';
    document.getElementById('h-right-val').textContent = bestHeight;
  } else {
    document.getElementById('h-right-label').textContent = 'LEVEL';
    document.getElementById('h-right-val').textContent = challengeLevel;
  }
}

function showMsg(text, duration) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(window._msgT);
  window._msgT = setTimeout(function() { el.classList.remove('show'); }, duration * 1000);
}

// ─── GAME LOOP ───────────────────────────────────────────
var lastTime = 0;
var running = false;

function gameLoop(ts) {
  if (!running) return;
  var dt = lastTime ? Math.min((ts - lastTime) / 1000, 0.04) : 0.016;
  lastTime = ts;

  if (gameState === 'dropping' || gameState === 'settling') {
    physicsStep(dt);

    // Check if all stones settled
    var allSettled = true;
    for (var i = 0; i < stones.length; i++) {
      if (!stones[i].settled && !stones[i].isStatic) { allSettled = false; break; }
    }

    if (allSettled && stones.length > 0) {
      settleCounter++;
      if (settleCounter > 10) {
        gameState = 'settling';
        onAllSettled();
      }
    }
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ─── START/MENU ──────────────────────────────────────────
window.beginGame = function(m) {
  mode = m;
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('rot-l').style.display = 'flex';
  document.getElementById('rot-r').style.display = 'flex';

  stones = [];
  stonesPlaced = 0;
  maxHeight = 0;
  score = 0;
  lives = 3;
  challengeLevel = 1;
  targetHeight = mode === 'challenge' ? 120 : 0;
  toppleCount = 0;
  particles = [];

  if (mode === 'challenge') {
    document.getElementById('h-mode-label').textContent = 'HEIGHT';
  } else {
    document.getElementById('h-mode-label').textContent = 'HEIGHT';
  }

  updateHUD();
  running = true;
  lastTime = 0;
  requestAnimationFrame(gameLoop);
  spawnNextStone();
};

function backToMenu() {
  running = false;
  gameState = 'menu';
  document.getElementById('start-overlay').classList.remove('hidden');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('rot-l').style.display = 'none';
  document.getElementById('rot-r').style.display = 'none';

  // Hash integration
  if (typeof window._sr === 'function') {
    window._sr('stonegarden', {
      w: maxHeight > 100,
      s: stonesPlaced,
      ht: maxHeight,
      st: stonesPlaced,
      lv: challengeLevel,
      tp: toppleCount,
      mode: mode
    });
  }
}

// Start screen idle animation
(function idle() {
  if (gameState === 'menu') {
    drawBackground();
    // Draw a few static demo stones
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#7a7a6a';
    ctx.beginPath();
    ctx.ellipse(W*0.5, GROUND_Y-15, 40, 15, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#8a8a7a';
    ctx.beginPath();
    ctx.ellipse(W*0.5+3, GROUND_Y-42, 30, 12, -0.1, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#6a6a5a';
    ctx.beginPath();
    ctx.ellipse(W*0.5-2, GROUND_Y-62, 22, 10, 0.1, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    requestAnimationFrame(idle);
  }
})();

})();
</script>
