<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Root Flow Prototype</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d100c;color:#e8dcc8;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}.wrap{max-width:420px;margin:0 auto;padding:8px;user-select:none}.hdr{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(26,31,23,.6);border:1px solid rgba(74,124,53,.15);border-radius:8px;margin-bottom:4px;font-size:13px}.hdr b{color:#D4A843}.st{text-align:center;font-size:12px;padding:3px 0;color:rgba(232,220,200,.6)}.gw{margin:8px auto;touch-action:none;-webkit-touch-callout:none;position:relative}.gr{display:grid;gap:2px;background:rgba(26,31,23,.8);border:2px solid rgba(74,124,53,.2);border-radius:8px;padding:2px}.ce{aspect-ratio:1;border-radius:4px;background:rgba(26,31,23,.4);display:flex;align-items:center;justify-content:center;position:relative}.ce.fi{opacity:.85}.dt{width:60%;height:60%;border-radius:50%;border:2px solid rgba(0,0,0,.2);z-index:5}.fb{height:8px;background:rgba(26,31,23,.5);border-radius:4px;margin:6px 0;overflow:hidden;border:1px solid rgba(74,124,53,.12)}.fi2{height:100%;border-radius:3px;transition:width .2s;background:#D4A843}.fi2.dn{background:#7AB956}.ft{text-align:center;font-size:11px;color:rgba(232,220,200,.5);margin-bottom:4px}.ct{display:flex;gap:6px;justify-content:center;padding:6px 0;flex-wrap:wrap}.bt{padding:7px 14px;background:rgba(74,124,53,.2);border:1px solid rgba(74,124,53,.3);border-radius:8px;color:#e8dcc8;font-size:12px;cursor:pointer}.bt:active{background:rgba(74,124,53,.4)}.bt.ac{background:rgba(74,124,53,.4);border-color:#7AB956}.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(26,31,23,.9);border:1px solid rgba(74,124,53,.3);border-radius:8px;padding:8px 16px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}.mb{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}.md{background:#1a1f17;border:1px solid rgba(74,124,53,.3);border-radius:14px;padding:20px;max-width:300px;text-align:center}.md h2{color:#D4A843;font-size:18px;margin-bottom:8px}.md p{font-size:13px;color:rgba(232,220,200,.7);margin:4px 0}.mbt{display:inline-block;margin:6px;padding:10px 18px;background:rgba(74,124,53,.3);border:1px solid rgba(74,124,53,.4);border-radius:8px;color:#e8dcc8;font-size:13px;cursor:pointer}</style></head><body>
<div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
var C=['#C47A7A','#4A7C35','#5B9BD5','#D4A843','#E8DCC8','#8B6914','#9B59B6','#E67E22','#2C3E50','#E74C3C'];
var SZ=6,NP=5,grid,eps,paths,drw,drwC,slv,ow,st;
function gen(sz,np){for(var a=0;a<30;a++){var g=[];for(var r=0;r<sz;r++){g[r]=[];for(var c=0;c<sz;c++)g[r][c]=0;}var ps=[];var ok=true;for(var p=0;p<np;p++){var pos=re(g,sz);if(!pos){ok=false;break;}g[pos[0]][pos[1]]=p+1;ps.push([[pos[0],pos[1]]]);}if(!ok)continue;var mx=sz*sz*20,it=0;while(he(g,sz)&&it<mx){it++;var pi=Math.floor(Math.random()*ps.length);var hd=ps[pi][ps[pi].length-1];var nb=en(g,hd[0],hd[1],sz);if(!nb.length)continue;var pk=nb[Math.floor(Math.random()*nb.length)];g[pk[0]][pk[1]]=pi+1;ps[pi].push(pk);}if(he(g,sz))continue;var v=true;for(var i=0;i<ps.length;i++)if(ps[i].length<2){v=false;break;}if(!v)continue;return{g:g,e:ps.map(function(p2,i2){return{c:i2,s:p2[0],e:p2[p2.length-1]}}),p:ps};}return null;}
function re(g,sz){var e=[];for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(g[r][c]===0)e.push([r,c]);return e.length?e[Math.floor(Math.random()*e.length)]:null;}
function he(g,sz){for(var r=0;r<sz;r++)for(var c=0;c<sz;c++)if(g[r][c]===0)return true;return false;}
function en(g,r,c,sz){var n=[];if(r>0&&g[r-1][c]===0)n.push([r-1,c]);if(r<sz-1&&g[r+1][c]===0)n.push([r+1,c]);if(c>0&&g[r][c-1]===0)n.push([r,c-1]);if(c<sz-1&&g[r][c+1]===0)n.push([r,c+1]);return n;}
function np(){var res=gen(SZ,NP);if(!res){showToast('Generating...');setTimeout(np,50);return;}eps=res.e;grid=[];for(var r=0;r<SZ;r++){grid[r]=[];for(var c=0;c<SZ;c++)grid[r][c]=0;}paths={};drw=false;drwC=-1;slv=false;ow=0;st=Date.now();rn();}
function gdc(r,c){for(var i=0;i<eps.length;i++){var ep=eps[i];if((ep.s[0]===r&&ep.s[1]===c)||(ep.e[0]===r&&ep.e[1]===c))return i;}return-1;}
function sd(r,c){if(slv)return;var dc=gdc(r,c);if(dc>=0){if(paths[dc])ep2(dc);paths[dc]=[[r,c]];grid[r][c]=dc+1;drw=true;drwC=dc;rn();return;}if(grid[r][c]>0){var pc=grid[r][c]-1;if(paths[pc]){var idx=-1;for(var i=0;i<paths[pc].length;i++)if(paths[pc][i][0]===r&&paths[pc][i][1]===c){idx=i;break;}if(idx>=0){var rm=paths[pc].splice(idx+1);rm.forEach(function(p){grid[p[0]][p[1]]=0;});drw=true;drwC=pc;rn();}}}}
function cd(r,c){if(!drw||drwC<0||slv)return;var p=paths[drwC];if(!p||!p.length)return;var l=p[p.length-1];if(Math.abs(r-l[0])+Math.abs(c-l[1])!==1)return;for(var i=0;i<p.length;i++)if(p[i][0]===r&&p[i][1]===c)return;if(grid[r][c]>0&&grid[r][c]!==drwC+1){ep2(grid[r][c]-1);ow++;}grid[r][c]=drwC+1;p.push([r,c]);rn();var ep=eps[drwC];var isE=(r===ep.e[0]&&c===ep.e[1])||(r===ep.s[0]&&c===ep.s[1]);var isNS=!(r===p[0][0]&&c===p[0][1]);if(isE&&isNS&&p.length>=2){drw=false;cw();}}
function ed(){drw=false;drwC=-1;}
function ep2(ci){if(!paths[ci])return;paths[ci].forEach(function(p){grid[p[0]][p[1]]=0;});delete paths[ci];}
function cw(){var ac=true;for(var i=0;i<eps.length;i++){if(!paths[i]||paths[i].length<2){ac=false;break;}var p=paths[i],ep=eps[i],l=p[p.length-1];var sOk=(p[0][0]===ep.s[0]&&p[0][1]===ep.s[1])||(p[0][0]===ep.e[0]&&p[0][1]===ep.e[1]);var eOk=(l[0]===ep.s[0]&&l[1]===ep.s[1])||(l[0]===ep.e[0]&&l[1]===ep.e[1]);if(!sOk||!eOk){ac=false;break;}}if(!ac)return;var fl=0;for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)if(grid[r][c]>0)fl++;if(fl<SZ*SZ)return;slv=true;var el=((Date.now()-st)/1000).toFixed(1);var tg={5:30,6:60,7:120,8:180,9:300};var s=1;if(ow===0)s=2;if(ow===0&&parseFloat(el)<=(tg[SZ]||120))s=3;setTimeout(function(){var h='<div class="mb"><div class="md"><h2>🔗 Roots Connected!</h2><p>';for(var i=0;i<3;i++)h+='<span style="color:'+(i<s?'#D4A843':'#333')+';font-size:20px">⭐</span>';h+='</p><p>Time: '+el+'s | Overwrites: '+ow+'</p><div class="mbt" onclick="this.closest(\'.mb\').remove();np()">Next Puzzle</div></div></div>';var d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d);},400);rn();}
function rp(){for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)grid[r][c]=0;paths={};ow=0;drw=false;drwC=-1;slv=false;st=Date.now();rn();}
function rn(){var fl=0;for(var r=0;r<SZ;r++)for(var c=0;c<SZ;c++)if(grid[r][c]>0)fl++;var pct=Math.round((fl/(SZ*SZ))*100);var cn=0;for(var i=0;i<eps.length;i++){if(paths[i]&&paths[i].length>=2){var p=paths[i],ep=eps[i],l=p[p.length-1];var s1=(p[0][0]===ep.s[0]&&p[0][1]===ep.s[1])||(p[0][0]===ep.e[0]&&p[0][1]===ep.e[1]);var e1=(l[0]===ep.s[0]&&l[1]===ep.s[1])||(l[0]===ep.e[0]&&l[1]===ep.e[1]);if(s1&&e1)cn++;}}var csz=Math.floor(340/SZ)-2;var h='<div class="hdr"><b>🔗 Root Flow</b><span>'+SZ+'×'+SZ+'</span></div>';h+='<div class="st">Flows: '+cn+'/'+NP+(slv?' ✅':'')+'</div>';h+='<div class="gw" style="width:'+(csz*SZ+SZ*2+4)+'px"><div class="gr" id="fg" style="grid-template-columns:repeat('+SZ+','+csz+'px)">';for(var r2=0;r2<SZ;r2++)for(var c2=0;c2<SZ;c2++){var bg='';if(grid[r2][c2]>0)bg='background:'+C[grid[r2][c2]-1]+';opacity:.7;';var dt=gdc(r2,c2);h+='<div class="ce'+(grid[r2][c2]>0?' fi':'')+'" data-r="'+r2+'" data-c="'+c2+'" style="'+bg+'">';if(dt>=0)h+='<div class="dt" style="background:'+C[dt]+';box-shadow:0 0 8px '+C[dt]+'"></div>';h+='</div>';}h+='</div></div>';h+='<div class="ft">Filled: '+pct+'%</div><div class="fb"><div class="fi2'+(pct>=100?' dn':'')+'" style="width:'+pct+'%"></div></div>';h+='<div class="ct"><div class="bt" onclick="rp()">🔄 Reset</div><div class="bt" onclick="np()">🎲 New</div></div>';h+='<div class="ct">';[5,6,7,8,9].forEach(function(s){h+='<div class="bt'+(SZ===s?' ac':'')+'" onclick="ss('+s+','+(s-1)+')">'+s+'×'+s+'</div>';});h+='</div>';document.getElementById('app').innerHTML=h;if(!slv)stt();}
function stt(){var el=document.getElementById('fg');if(!el)return;el.addEventListener('touchstart',function(e){e.preventDefault();var cl=gc(e.touches[0]);if(cl)sd(cl.r,cl.c);},{passive:false});el.addEventListener('touchmove',function(e){e.preventDefault();var cl=gc(e.touches[0]);if(cl)cd(cl.r,cl.c);},{passive:false});el.addEventListener('touchend',function(){ed();});var md2=false;el.addEventListener('mousedown',function(e){md2=true;var cl=gcm(e);if(cl)sd(cl.r,cl.c);});el.addEventListener('mousemove',function(e){if(!md2)return;var cl=gcm(e);if(cl)cd(cl.r,cl.c);});el.addEventListener('mouseup',function(){md2=false;ed();});}
function gc(t){var el=document.elementFromPoint(t.clientX,t.clientY);if(!el)return null;var c=el.closest('.ce');if(!c)return null;return{r:parseInt(c.getAttribute('data-r')),c:parseInt(c.getAttribute('data-c'))};}
function gcm(e){var el=e.target.closest('.ce');if(!el)return null;return{r:parseInt(el.getAttribute('data-r')),c:parseInt(el.getAttribute('data-c'))};}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}
window.np=np;window.rp=rp;window.ss=function(s,p){SZ=s;NP=p;np();};np();})();
</script></body></html>
