// ─── TRIE ────────────────────────────────────────────────
var TRIE_END = '$';
function buildTrie(words) {
  var root = {};
  for (var i = 0; i < words.length; i++) {
    var w = words[i].toUpperCase();
    if (w.length < 2) continue;
    var node = root;
    for (var j = 0; j < w.length; j++) {
      if (!node[w[j]]) node[w[j]] = {};
      node = node[w[j]];
    }
    node[TRIE_END] = true;
  }
  return root;
}

var wordSet = {};
function buildWordSet(words) {
  for (var i = 0; i < words.length; i++) wordSet[words[i].toUpperCase()] = true;
}

function isWord(w) { return !!wordSet[w.toUpperCase()]; }

// ─── GAME ENGINE (simplified from prototype) ─────────────
function shuffleArray(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function SimGame(d1, d2) {
  this.board = [];
  for (var r = 0; r < 15; r++) { this.board[r] = []; for (var c = 0; c < 15; c++) this.board[r][c] = null; }
  this.bag = [];
  var letters = Object.keys(TILE_DIST);
  for (var i = 0; i < letters.length; i++) for (var j = 0; j < TILE_DIST[letters[i]]; j++) this.bag.push(letters[i]);
  shuffleArray(this.bag);
  this.racks = [[], []];
  this.scores = [0, 0];
  this.diffs = [d1, d2];
  this.passes = 0;
  this.turns = 0;
  this.wordsPlayed = [[], []];
  this.errors = [];
  this.bingos = [0, 0];
  this.trie = buildTrie(WORDS);
  
  for (var p = 0; p < 2; p++) {
    while (this.racks[p].length < 7 && this.bag.length > 0) this.racks[p].push(this.bag.pop());
  }
}

SimGame.prototype.boardHasTiles = function() {
  for (var r = 0; r < 15; r++) for (var c = 0; c < 15; c++) if (this.board[r][c]) return true;
  return false;
};

SimGame.prototype.computeCrossChecks = function() {
  var checks = [];
  for (var r = 0; r < 15; r++) {
    checks[r] = [];
    for (var c = 0; c < 15; c++) {
      if (this.board[r][c]) { checks[r][c] = null; continue; }
      checks[r][c] = {h: null, v: null};
      // Vertical cross for horizontal play
      var above = '', below = '';
      var tr = r - 1;
      while (tr >= 0 && this.board[tr][c]) { above = this.board[tr][c].letter + above; tr--; }
      tr = r + 1;
      while (tr < 15 && this.board[tr][c]) { below = below + this.board[tr][c].letter; tr++; }
      if (above || below) {
        var vh = {};
        for (var li = 0; li < 26; li++) {
          var l = String.fromCharCode(65 + li);
          if (isWord(above + l + below)) vh[l] = true;
        }
        checks[r][c].h = vh;
      }
      // Horizontal cross for vertical play
      var left = '', right = '';
      var tc = c - 1;
      while (tc >= 0 && this.board[r][tc]) { left = this.board[r][tc].letter + left; tc--; }
      tc = c + 1;
      while (tc < 15 && this.board[r][tc]) { right = right + this.board[r][tc].letter; tc++; }
      if (left || right) {
        var vv = {};
        for (li = 0; li < 26; li++) {
          l = String.fromCharCode(65 + li);
          if (isWord(left + l + right)) vv[l] = true;
        }
        checks[r][c].v = vv;
      }
    }
  }
  return checks;
};

SimGame.prototype.findAnchors = function() {
  var a = [];
  if (!this.boardHasTiles()) { a.push({r:7,c:7}); return a; }
  for (var r = 0; r < 15; r++) for (var c = 0; c < 15; c++) {
    if (this.board[r][c]) continue;
    if ((r>0&&this.board[r-1][c])||(r<14&&this.board[r+1][c])||(c>0&&this.board[r][c-1])||(c<14&&this.board[r][c+1]))
      a.push({r:r,c:c});
  }
  return a;
};

SimGame.prototype.generateMoves = function(rack) {
  var cc = this.computeCrossChecks();
  var anchors = this.findAnchors();
  var moves = [];
  this._genDir(rack, cc, anchors, true, moves);
  this._genDir(rack, cc, anchors, false, moves);
  return moves;
};

SimGame.prototype._genDir = function(rack, cc, anchors, horiz, moves) {
  var dr = horiz ? 0 : 1, dc = horiz ? 1 : 0;
  var self = this;
  for (var ai = 0; ai < anchors.length; ai++) {
    var ar = anchors[ai].r, ac = anchors[ai].c;
    var limit = 0;
    var pr = ar - dr, pc = ac - dc;
    while (pr >= 0 && pc >= 0 && pr < 15 && pc < 15 && !self.board[pr][pc]) {
      var isAnch = false;
      if (horiz) { if ((pr>0&&self.board[pr-1][pc])||(pr<14&&self.board[pr+1][pc])) isAnch=true; }
      else { if ((pc>0&&self.board[pr][pc-1])||(pc<14&&self.board[pr][pc+1])) isAnch=true; }
      if (isAnch) break;
      limit++; pr -= dr; pc -= dc;
    }
    var prefixOnBoard = '';
    var cr = ar - dr, crc = ac - dc;
    while (cr >= 0 && crc >= 0 && cr < 15 && crc < 15 && self.board[cr][crc]) {
      prefixOnBoard = self.board[cr][crc].letter + prefixOnBoard;
      cr -= dr; crc -= dc;
    }
    if (prefixOnBoard) {
      var node = self.trie;
      for (var pi = 0; pi < prefixOnBoard.length; pi++) {
        if (!node[prefixOnBoard[pi]]) { node = null; break; }
        node = node[prefixOnBoard[pi]];
      }
      if (node) self._extR(ar, ac, dr, dc, node, rack.slice(), prefixOnBoard, [], cc, horiz, moves, true);
    } else {
      self._leftP(ar, ac, dr, dc, self.trie, rack.slice(), '', [], limit, cc, horiz, moves);
    }
  }
};

SimGame.prototype._leftP = function(ar, ac, dr, dc, node, rack, partial, used, limit, cc, horiz, moves) {
  this._extR(ar, ac, dr, dc, node, rack.slice(), partial, used.slice(), cc, horiz, moves, true);
  if (limit > 0) {
    var tried = {};
    for (var ri = 0; ri < rack.length; ri++) {
      var l = rack[ri];
      if (l === ' ') {
        for (var bi = 0; bi < 26; bi++) {
          var bl = String.fromCharCode(65+bi);
          if (tried['_'+bl]||!node[bl]) continue;
          tried['_'+bl]=true;
          var nr = rack.slice(); nr.splice(ri,1);
          this._leftP(ar,ac,dr,dc,node[bl],nr,partial+bl,used.concat([{letter:bl,isBlank:true}]),limit-1,cc,horiz,moves);
        }
      } else {
        if (tried[l]||!node[l]) continue;
        tried[l]=true;
        var nr2 = rack.slice(); nr2.splice(ri,1);
        this._leftP(ar,ac,dr,dc,node[l],nr2,partial+l,used.concat([{letter:l,isBlank:false}]),limit-1,cc,horiz,moves);
      }
    }
  }
};

SimGame.prototype._extR = function(r, c, dr, dc, node, rack, partial, used, cc, horiz, moves, past) {
  if (r<0||c<0||r>=15||c>=15) {
    if (node[TRIE_END]&&past&&used.length>0) this._rec(r-dr,c-dc,dr,dc,partial,used,horiz,moves);
    return;
  }
  if (this.board[r][c]) {
    var el = this.board[r][c].letter;
    if (node[el]) this._extR(r+dr,c+dc,dr,dc,node[el],rack,partial+el,used,cc,horiz,moves,true);
    return;
  }
  if (node[TRIE_END]&&past&&used.length>0) this._rec(r-dr,c-dc,dr,dc,partial,used,horiz,moves);
  var ccs = cc[r]?cc[r][c]:null;
  var crossSet = null;
  if (ccs) crossSet = horiz?ccs.h:ccs.v;
  var tried = {};
  for (var ri = 0; ri < rack.length; ri++) {
    var l = rack[ri];
    if (l === ' ') {
      for (var bi = 0; bi < 26; bi++) {
        var bl = String.fromCharCode(65+bi);
        if (tried['_'+bl]) continue;
        if (crossSet&&!crossSet[bl]) continue;
        if (!node[bl]) continue;
        tried['_'+bl]=true;
        var nr = rack.slice(); nr.splice(ri,1);
        this._extR(r+dr,c+dc,dr,dc,node[bl],nr,partial+bl,used.concat([{letter:bl,isBlank:true}]),cc,horiz,moves,true);
      }
    } else {
      if (tried[l]) continue;
      if (crossSet&&!crossSet[l]) continue;
      if (!node[l]) continue;
      tried[l]=true;
      var nr2 = rack.slice(); nr2.splice(ri,1);
      this._extR(r+dr,c+dc,dr,dc,node[l],nr2,partial+l,used.concat([{letter:l,isBlank:false}]),cc,horiz,moves,true);
    }
  }
};

SimGame.prototype._rec = function(endR, endC, dr, dc, word, used, horiz, moves) {
  var startR = endR - (word.length-1)*dr;
  var startC = endC - (word.length-1)*dc;
  var positions = [];
  var newTiles = [];
  var ti = 0;
  var cr = startR, cc2 = startC;
  for (var i = 0; i < word.length; i++) {
    positions.push({r:cr,c:cc2});
    if (!this.board[cr]||this.board[cr][cc2]===null) {
      if (ti < used.length) {
        newTiles.push({r:cr,c:cc2,letter:used[ti].letter,isBlank:used[ti].isBlank});
        ti++;
      }
    }
    cr+=dr; cc2+=dc;
  }
  if (ti !== used.length) return;
  var score = this._scoreMove(word, positions, newTiles);
  if (used.length === 7) score += BINGO_BONUS;
  moves.push({word:word,startR:startR,startC:startC,horizontal:horiz,tiles:newTiles,score:score,isBingo:used.length===7});
};

SimGame.prototype._scoreMove = function(word, positions, newTiles) {
  var self = this;
  function isNew(r,c) { for(var i=0;i<newTiles.length;i++) if(newTiles[i].r===r&&newTiles[i].c===c) return true; return false; }
  function getBlank(r,c) { for(var i=0;i<newTiles.length;i++) if(newTiles[i].r===r&&newTiles[i].c===c) return newTiles[i].isBlank; var cl=self.board[r]?self.board[r][c]:null; return cl?cl.isBlank:false; }
  
  var main = 0, wm = 1;
  for (var i = 0; i < word.length; i++) {
    var r=positions[i].r,c=positions[i].c;
    var lv = getBlank(r,c)?0:(TILE_VALUES[word[i]]||0);
    var p = PREMIUMS[r+','+c];
    if (p&&isNew(r,c)) {
      if(p==='dl') lv*=2; else if(p==='tl') lv*=3;
      else if(p==='dw') wm*=2; else if(p==='tw') wm*=3;
    }
    main += lv;
  }
  main *= wm;
  
  var cross = 0;
  var dr2 = positions.length>1?(positions[1].r-positions[0].r):0;
  var dc2 = positions.length>1?(positions[1].c-positions[0].c):0;
  
  for (var ti = 0; ti < newTiles.length; ti++) {
    var tr=newTiles[ti].r, tc=newTiles[ti].c;
    var cdr=dr2===0?1:0, cdc=dc2===0?1:0;
    var sr=tr-cdr,sc=tc-cdc;
    while(sr>=0&&sc>=0&&self.board[sr]&&self.board[sr][sc]) {sr-=cdr;sc-=cdc;}
    sr+=cdr;sc+=cdc;
    var cw='',cwp=[];
    var cr2=sr,cc2=sc;
    while(cr2>=0&&cc2>=0&&cr2<15&&cc2<15) {
      var ch=null;
      if(self.board[cr2]&&self.board[cr2][cc2]) ch=self.board[cr2][cc2].letter;
      else if(cr2===tr&&cc2===tc) ch=newTiles[ti].letter;
      else break;
      cw+=ch; cwp.push({r:cr2,c:cc2}); cr2+=cdr; cc2+=cdc;
    }
    if(cw.length<2) continue;
    var cs=0,cm=1;
    for(var ci=0;ci<cw.length;ci++){
      var pr2=cwp[ci].r,pc2=cwp[ci].c;
      var clv=(pr2===tr&&pc2===tc)?(newTiles[ti].isBlank?0:(TILE_VALUES[cw[ci]]||0)):((self.board[pr2][pc2]&&self.board[pr2][pc2].isBlank)?0:(TILE_VALUES[cw[ci]]||0));
      var cp=PREMIUMS[pr2+','+pc2];
      if(cp&&pr2===tr&&pc2===tc){if(cp==='dl')clv*=2;else if(cp==='tl')clv*=3;else if(cp==='dw')cm*=2;else if(cp==='tw')cm*=3;}
      cs+=clv;
    }
    cross+=cs*cm;
  }
  return main+cross;
};

SimGame.prototype.selectMove = function(moves, diff) {
  if (moves.length===0) return null;
  moves.sort(function(a,b){return b.score-a.score;});
  if (diff===0) {
    var f = moves.filter(function(m){return m.word.length<=5;});
    if(!f.length) f=moves;
    var bs=Math.floor(f.length*0.4);
    var pool=f.slice(bs);
    if(!pool.length) pool=f;
    return pool[Math.floor(Math.random()*pool.length)];
  } else if (diff===1) {
    var te=Math.max(1,Math.floor(moves.length*0.4));
    var p2=moves.slice(0,te);
    return p2[Math.floor(Math.random()*Math.random()*p2.length)];
  }
  return moves[0];
};

SimGame.prototype.playTurn = function(playerIdx) {
  var rack = this.racks[playerIdx];
  var diff = this.diffs[playerIdx];
  var moves = this.generateMoves(rack);
  
  if (moves.length === 0) {
    if (this.bag.length >= 7) {
      var ret = rack.splice(0, rack.length);
      for (var i = 0; i < ret.length; i++) this.bag.push(ret[i]);
      shuffleArray(this.bag);
      while (rack.length < 7 && this.bag.length > 0) rack.push(this.bag.pop());
      this.passes = 0;
      return {action:'exchange'};
    }
    this.passes++;
    return {action:'pass'};
  }
  
  var chosen = this.selectMove(moves, diff);
  if (!chosen) { this.passes++; return {action:'pass'}; }
  
  // Validate the chosen word
  if (!isWord(chosen.word)) {
    this.errors.push('AI played invalid word: ' + chosen.word);
  }
  
  // Place tiles
  for (var ti = 0; ti < chosen.tiles.length; ti++) {
    var tile = chosen.tiles[ti];
    this.board[tile.r][tile.c] = {letter:tile.letter, value:tile.isBlank?0:TILE_VALUES[tile.letter], isBlank:tile.isBlank};
    var rl = tile.isBlank ? ' ' : tile.letter;
    var ri = rack.indexOf(rl);
    if (ri >= 0) rack.splice(ri, 1);
  }
  
  this.scores[playerIdx] += chosen.score;
  this.wordsPlayed[playerIdx].push(chosen.word);
  if (chosen.isBingo) this.bingos[playerIdx]++;
  this.passes = 0;
  
  while (rack.length < 7 && this.bag.length > 0) rack.push(this.bag.pop());
  
  return {action:'play', word:chosen.word, score:chosen.score, isBingo:chosen.isBingo};
};

SimGame.prototype.isOver = function() {
  if (this.passes >= 4) return true;
  if (this.bag.length === 0 && (this.racks[0].length === 0 || this.racks[1].length === 0)) return true;
  if (this.turns > 200) return true; // safety
  return false;
};

SimGame.prototype.finalize = function() {
  for (var p = 0; p < 2; p++) {
    var deduct = 0;
    for (var i = 0; i < this.racks[p].length; i++) deduct += TILE_VALUES[this.racks[p][i]]||0;
    this.scores[p] -= deduct;
  }
};

window.runTests = function() {
  if (running) return;
  running = true;
  document.getElementById('btn-run').disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('stats').innerHTML = '';
  document.getElementById('checks').innerHTML = '';
  
  var total = parseInt(document.getElementById('count').value);
  var d1 = parseInt(document.getElementById('d1').value);
  var d2 = parseInt(document.getElementById('d2').value);
  var dNames = ['Seedling','Gardener','Botanist'];
  
  log('Starting ' + total + ' games: P1(' + dNames[d1] + ') vs P2(' + dNames[d2] + ')');
  log('Dictionary: ' + WORDS.length + ' words');
  
  buildWordSet(WORDS);
  
  var results = {
    p1Wins: 0, p2Wins: 0, ties: 0,
    p1Scores: [], p2Scores: [],
    p1Words: [], p2Words: [],
    gameLengths: [],
    errors: [],
    bingos: [0, 0],
    stalemates: 0,
    allWordsPlayed: {}
  };
  
  var completed = 0;
  
  function runBatch() {
    var batchSize = Math.min(5, total - completed);
    for (var b = 0; b < batchSize; b++) {
      var game = new SimGame(d1, d2);
      var turn = 0;
      while (!game.isOver()) {
        var pidx = turn % 2;
        game.playTurn(pidx);
        game.turns++;
        turn++;
      }
      game.finalize();
      
      results.p1Scores.push(game.scores[0]);
      results.p2Scores.push(game.scores[1]);
      results.gameLengths.push(game.turns);
      results.bingos[0] += game.bingos[0];
      results.bingos[1] += game.bingos[1];
      
      if (game.scores[0] > game.scores[1]) results.p1Wins++;
      else if (game.scores[1] > game.scores[0]) results.p2Wins++;
      else results.ties++;
      
      if (game.turns >= 200) results.stalemates++;
      
      for (var p = 0; p < 2; p++) {
        for (var wi = 0; wi < game.wordsPlayed[p].length; wi++) {
          var w = game.wordsPlayed[p][wi];
          results.allWordsPlayed[w] = (results.allWordsPlayed[w]||0)+1;
          if (p === 0) results.p1Words.push(w);
          else results.p2Words.push(w);
        }
      }
      
      if (game.errors.length > 0) {
        for (var ei = 0; ei < game.errors.length; ei++) results.errors.push(game.errors[ei]);
      }
      
      completed++;
    }
    
    var pct = Math.round(completed/total*100);
    document.getElementById('prog').style.width = pct+'%';
    document.getElementById('status').textContent = completed + '/' + total + ' games (' + pct + '%)';
    
    if (completed % 25 === 0 || completed === total) {
      log('Completed: ' + completed + '/' + total);
    }
    
    if (completed < total) {
      setTimeout(runBatch, 0);
    } else {
      showResults(results, total, d1, d2, dNames);
      running = false;
      document.getElementById('btn-run').disabled = false;
    }
  }
  
  setTimeout(runBatch, 10);
};

function avg(arr) { if (!arr.length) return 0; var s=0; for(var i=0;i<arr.length;i++) s+=arr[i]; return Math.round(s/arr.length); }
function min(arr) { if (!arr.length) return 0; var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]<m)m=arr[i]; return m; }
function max(arr) { if (!arr.length) return 0; var m=arr[0]; for(var i=1;i<arr.length;i++) if(arr[i]>m)m=arr[i]; return m; }
function stddev(arr) {
  if (arr.length<2) return 0;
  var m=avg(arr);
  var s=0; for(var i=0;i<arr.length;i++) s+=(arr[i]-m)*(arr[i]-m);
  return Math.round(Math.sqrt(s/arr.length));
}

function showResults(r, total, d1, d2, dNames) {
  var html = '';
  
  html += '<div class="stat-box"><h3>Win Rate</h3><div class="val">' + dNames[d1] + ': ' + Math.round(r.p1Wins/total*100) + '%</div>';
  html += '<div class="sub">' + r.p1Wins + 'W / ' + r.p2Wins + 'L / ' + r.ties + 'T</div></div>';
  
  html += '<div class="stat-box"><h3>P1 Score (' + dNames[d1] + ')</h3><div class="val">' + avg(r.p1Scores) + ' avg</div>';
  html += '<div class="sub">Range: ' + min(r.p1Scores) + ' – ' + max(r.p1Scores) + ' (σ ' + stddev(r.p1Scores) + ')</div></div>';
  
  html += '<div class="stat-box"><h3>P2 Score (' + dNames[d2] + ')</h3><div class="val">' + avg(r.p2Scores) + ' avg</div>';
  html += '<div class="sub">Range: ' + min(r.p2Scores) + ' – ' + max(r.p2Scores) + ' (σ ' + stddev(r.p2Scores) + ')</div></div>';
  
  html += '<div class="stat-box"><h3>Game Length</h3><div class="val">' + avg(r.gameLengths) + ' turns avg</div>';
  html += '<div class="sub">Range: ' + min(r.gameLengths) + ' – ' + max(r.gameLengths) + '</div></div>';
  
  html += '<div class="stat-box"><h3>Bingos</h3><div class="val">P1: ' + r.bingos[0] + ' / P2: ' + r.bingos[1] + '</div>';
  html += '<div class="sub">Per game: ' + (r.bingos[0]/total).toFixed(2) + ' / ' + (r.bingos[1]/total).toFixed(2) + '</div></div>';
  
  var uniqueWords = Object.keys(r.allWordsPlayed).length;
  html += '<div class="stat-box"><h3>Unique Words Played</h3><div class="val">' + uniqueWords + '</div>';
  html += '<div class="sub">of ' + WORDS.length + ' in dictionary (' + Math.round(uniqueWords/WORDS.length*100) + '%)</div></div>';
  
  document.getElementById('stats').innerHTML = html;
  
  // Validation checks
  var checks = '';
  var allOk = true;
  
  function check(name, pass, detail) {
    checks += '<div class="' + (pass?'ok':'error') + '">' + (pass?'✓':'✗') + ' ' + name;
    if (detail) checks += ' — ' + detail;
    checks += '</div>';
    if (!pass) allOk = false;
  }
  
  check('No invalid words played', r.errors.length === 0, r.errors.length > 0 ? r.errors.slice(0,5).join(', ') : '');
  check('No stalemates (200+ turns)', r.stalemates === 0, r.stalemates > 0 ? r.stalemates + ' games stalled' : '');
  check('Scores are non-negative (avg)', avg(r.p1Scores) >= 0 && avg(r.p2Scores) >= 0, '');
  check('Games complete normally', min(r.gameLengths) >= 4, 'Shortest game: ' + min(r.gameLengths) + ' turns');
  check('Higher difficulty wins more', d1 === d2 || (d1 > d2 ? r.p1Wins >= r.p2Wins : r.p2Wins >= r.p1Wins),
    'P1 (' + dNames[d1] + '): ' + r.p1Wins + 'W vs P2 (' + dNames[d2] + '): ' + r.p2Wins + 'W');
  check('Dictionary utilization > 5%', uniqueWords / WORDS.length > 0.05, Math.round(uniqueWords/WORDS.length*100) + '%');
  check('Score variance is reasonable', stddev(r.p1Scores) > 10 && stddev(r.p1Scores) < 200, 'σ = ' + stddev(r.p1Scores));
  
  // Top words
  var wordEntries = [];
  var keys = Object.keys(r.allWordsPlayed);
  for (var i = 0; i < keys.length; i++) wordEntries.push({word:keys[i], count:r.allWordsPlayed[keys[i]]});
  wordEntries.sort(function(a,b){return b.count-a.count;});
  
  checks += '<br><strong>Top 20 Most Played Words:</strong><br>';
  checks += '<table><tr><th>Word</th><th>Times</th><th>Length</th></tr>';
  for (i = 0; i < Math.min(20, wordEntries.length); i++) {
    checks += '<tr><td>' + wordEntries[i].word + '</td><td>' + wordEntries[i].count + '</td><td>' + wordEntries[i].word.length + '</td></tr>';
  }
  checks += '</table>';
  
  document.getElementById('checks').innerHTML = checks;
  
  log('--- COMPLETE ---', allOk ? 'ok' : 'error');
  log('Overall: ' + (allOk ? 'ALL CHECKS PASSED' : 'SOME CHECKS FAILED'), allOk ? 'ok' : 'error');
}

})();
</script>
</body>
</html>
