<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Alignment Tool v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d100c;color:#e8dcc8;font-family:'DM Mono',monospace;padding:0.5rem;}
h1{font-family:sans-serif;font-size:0.85rem;color:#c8a84b;margin-bottom:0.3rem;}
.tabs{display:flex;gap:4px;margin-bottom:0.4rem;flex-wrap:wrap;}
.tab{padding:6px 12px;border:1px solid rgba(122,179,86,0.2);border-radius:6px;background:rgba(26,36,22,0.6);color:#7ab356;cursor:pointer;font-size:0.65rem;font-family:sans-serif;min-height:40px;display:flex;align-items:center;}
.tab.active{background:rgba(122,179,86,0.2);border-color:#7ab356;color:#c8a84b;}

/* Card container — matches EXACT game rendering */
.card-container{
  width:92vw;max-width:460px;
  height:calc(100vh - 280px);max-height:600px;
  margin:0 auto;position:relative;
  border-radius:12px;overflow:hidden;
  background-color:#050505;
}
.card-container .card-bg{
  position:absolute;inset:0;
  background-size:96%;
  background-position:center;
  background-repeat:no-repeat;
  pointer-events:none;
}
/* Grid overlay — matches game's grid-template-rows + padding */
.card-grid{
  position:absolute;inset:0;
  display:grid;
  grid-template-rows:13% 55% 26% auto;
  padding:6% 8% 4%;
}
.grid-zone{
  border:2px dashed;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
}
.zone-name{border-color:#c8a84b;background:rgba(200,168,75,0.12);}
.zone-art{border-color:#7ab356;background:rgba(122,179,86,0.08);}
.zone-haiku{border-color:#a0c4e8;background:rgba(160,196,232,0.08);}
.zone-extra{border-color:rgba(138,145,120,0.3);background:rgba(138,145,120,0.05);}
.zone-label{
  font-family:sans-serif;font-weight:700;font-size:0.5rem;
  letter-spacing:0.06em;text-transform:uppercase;
  text-shadow:0 1px 3px rgba(0,0,0,0.9);pointer-events:none;
}
.zone-name .zone-label{color:#c8a84b;}
.zone-art .zone-label{color:#7ab356;}
.zone-haiku .zone-label{color:#a0c4e8;}
.zone-extra .zone-label{color:#8a9178;}

/* Adjust controls */
.ctrl{max-width:460px;margin:0.4rem auto;}
.ctrl label{font-family:sans-serif;font-size:0.5rem;color:#7ab356;display:block;margin:0.3rem 0 0.1rem;}
.ctrl input[type=range]{width:100%;accent-color:#7ab356;}
.val{font-size:0.45rem;color:#8a9178;text-align:right;}
.output-box{background:rgba(0,0,0,0.4);border:1px solid rgba(122,179,86,0.15);border-radius:6px;padding:0.4rem;font-size:0.45rem;color:#7ab356;white-space:pre-wrap;margin-top:0.3rem;line-height:1.4;max-height:100px;overflow-y:auto;}
.copy-btn{width:100%;padding:10px;border:1.5px solid rgba(200,168,75,0.4);border-radius:8px;background:rgba(200,168,75,0.12);color:#c8a84b;cursor:pointer;font-size:0.7rem;font-family:sans-serif;font-weight:700;min-height:48px;margin-top:0.4rem;}
.legend{display:flex;gap:8px;margin:0.3rem auto;max-width:460px;font-size:0.5rem;}
.legend span{display:flex;align-items:center;gap:3px;}
.ldot{width:10px;height:10px;border-radius:2px;border:2px dashed;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
<h1>CARD ALIGNMENT v2</h1>
<p style="font-size:0.45rem;color:#8a9178;margin-bottom:0.3rem;">Matches EXACT game rendering — background-size:96%, same grid, same padding.</p>

<div class="tabs" id="mode-tabs">
  <div class="tab active" onclick="setMode('front')">FRONTS</div>
  <div class="tab" onclick="setMode('back')">BACKS</div>
</div>
<div class="tabs" id="card-tabs"></div>

<div class="legend">
  <span><div class="ldot" style="border-color:#c8a84b;background:rgba(200,168,75,0.12);"></div> NAME</span>
  <span><div class="ldot" style="border-color:#7ab356;background:rgba(122,179,86,0.08);"></div> ART</span>
  <span><div class="ldot" style="border-color:#a0c4e8;background:rgba(160,196,232,0.08);"></div> HAIKU</span>
</div>

<div class="card-container" id="card-container">
  <div class="card-bg" id="card-bg"></div>
  <div class="card-grid" id="card-grid">
    <div class="grid-zone zone-name"><span class="zone-label">NAME</span></div>
    <div class="grid-zone zone-art"><span class="zone-label">PLANT ART</span></div>
    <div class="grid-zone zone-haiku"><span class="zone-label">HAIKU</span></div>
    <div class="grid-zone zone-extra"><span class="zone-label">FLIP HINT</span></div>
  </div>
</div>

<div class="ctrl">
  <label>GRID ROWS — Name % <span class="val" id="v-name">13</span></label>
  <input type="range" id="r-name" min="5" max="25" value="13" oninput="updateGrid()">
  <label>Art % <span class="val" id="v-art">55</span></label>
  <input type="range" id="r-art" min="30" max="70" value="55" oninput="updateGrid()">
  <label>Haiku % <span class="val" id="v-haiku">26</span></label>
  <input type="range" id="r-haiku" min="10" max="40" value="26" oninput="updateGrid()">
  <label>PADDING — Top % <span class="val" id="v-pt">6</span></label>
  <input type="range" id="r-pt" min="0" max="20" value="6" oninput="updateGrid()">
  <label>Sides % <span class="val" id="v-ps">8</span></label>
  <input type="range" id="r-ps" min="0" max="20" value="8" oninput="updateGrid()">
  <label>Bottom % <span class="val" id="v-pb">4</span></label>
  <input type="range" id="r-pb" min="0" max="15" value="4" oninput="updateGrid()">

  <div class="output-box" id="output">Adjust sliders...</div>
  <button class="copy-btn" onclick="copyAll()">COPY ALL CSS — PASTE TO CLAUDE</button>
</div>

<script>
var cards={
  front:[
    {id:'spring',label:'Spring',src:'cards/fronts/front-spring.png'},
    {id:'summer',label:'Summer',src:'cards/fronts/front-summer.png'},
    {id:'autumn',label:'Autumn',src:'cards/fronts/front-autumn.png'},
    {id:'winter',label:'Winter',src:'cards/fronts/front-winter.png'}
  ],
  back:[
    {id:'common',label:'Common',src:'cards/backs/back-common.png',bgSize:'112% 101%'},
    {id:'uncommon',label:'Uncommon',src:'cards/backs/back-uncommon.png',bgSize:'174%'},
    {id:'rare',label:'Rare',src:'cards/backs/back-rare.png',bgSize:'103% 99%'},
    {id:'epic',label:'Epic',src:'cards/backs/back-epic.png',bgSize:'172%'},
    {id:'legendary',label:'Legendary',src:'cards/backs/back-legendary.png',bgSize:'105% 101%'},
    {id:'mythic',label:'Mythic',src:'cards/backs/back-mythic.png',bgSize:'106% 94%'},
    {id:'cosmic',label:'Cosmic',src:'cards/backs/back-cosmic.png',bgSize:'146% 110%'}
  ]
};

var mode='front',currentCard=null;
var saved={};
try{saved=JSON.parse(localStorage.getItem('lw_align_v4')||'{}');}catch(e){}

function setMode(m){
  mode=m;
  document.querySelectorAll('#mode-tabs .tab').forEach(function(t){
    t.classList.toggle('active',t.textContent.toLowerCase().indexOf(m)>-1);
  });
  buildTabs();
  selectCard(cards[m][0]);
}

function buildTabs(){
  var el=document.getElementById('card-tabs');el.innerHTML='';
  cards[mode].forEach(function(c){
    var t=document.createElement('div');t.className='tab';t.textContent=c.label;
    t.onclick=function(){selectCard(c);};el.appendChild(t);
  });
}

function selectCard(c){
  currentCard=c;
  var bg=document.getElementById('card-bg');
  bg.style.backgroundImage='url('+c.src+')';
  bg.style.backgroundSize=c.bgSize||'96%';
  // Restore saved grid values or defaults
  var key=mode+'_'+c.id;
  var s=saved[key]||{name:13,art:55,haiku:26,pt:6,ps:8,pb:4};
  document.getElementById('r-name').value=s.name;
  document.getElementById('r-art').value=s.art;
  document.getElementById('r-haiku').value=s.haiku;
  document.getElementById('r-pt').value=s.pt;
  document.getElementById('r-ps').value=s.ps;
  document.getElementById('r-pb').value=s.pb;
  document.querySelectorAll('#card-tabs .tab').forEach(function(t){t.classList.toggle('active',t.textContent===c.label);});
  // Back cards show just one nameplate zone
  var grid=document.getElementById('card-grid');
  if(mode==='back'){
    grid.innerHTML='<div class="grid-zone zone-name"><span class="zone-label">NAME</span></div>';
    grid.style.display='flex';grid.style.alignItems='flex-end';grid.style.justifyContent='center';
  } else {
    grid.innerHTML='<div class="grid-zone zone-name"><span class="zone-label">NAME</span></div><div class="grid-zone zone-art"><span class="zone-label">PLANT ART</span></div><div class="grid-zone zone-haiku"><span class="zone-label">HAIKU</span></div><div class="grid-zone zone-extra"><span class="zone-label">FLIP HINT</span></div>';
    grid.style.display='grid';grid.style.alignItems='';grid.style.justifyContent='';
  }
  updateGrid();
}

function updateGrid(){
  var nm=parseInt(document.getElementById('r-name').value);
  var art=parseInt(document.getElementById('r-art').value);
  var hk=parseInt(document.getElementById('r-haiku').value);
  var pt=parseInt(document.getElementById('r-pt').value);
  var ps=parseInt(document.getElementById('r-ps').value);
  var pb=parseInt(document.getElementById('r-pb').value);
  document.getElementById('v-name').textContent=nm;
  document.getElementById('v-art').textContent=art;
  document.getElementById('v-haiku').textContent=hk;
  document.getElementById('v-pt').textContent=pt;
  document.getElementById('v-ps').textContent=ps;
  document.getElementById('v-pb').textContent=pb;

  var grid=document.getElementById('card-grid');
  if(mode==='front'){
    grid.style.gridTemplateRows=nm+'% '+art+'% '+hk+'% auto';
  }
  grid.style.padding=pt+'% '+ps+'% '+pb+'%';

  // Save
  if(currentCard){
    var key=mode+'_'+currentCard.id;
    saved[key]={name:nm,art:art,haiku:hk,pt:pt,ps:ps,pb:pb};
    localStorage.setItem('lw_align_v4',JSON.stringify(saved));
  }
  updateOutput();
}

function updateOutput(){
  if(!currentCard)return;
  var nm=document.getElementById('r-name').value;
  var art=document.getElementById('r-art').value;
  var hk=document.getElementById('r-haiku').value;
  var pt=document.getElementById('r-pt').value;
  var ps=document.getElementById('r-ps').value;
  var pb=document.getElementById('r-pb').value;
  var sel=mode==='front'
    ?'.cs-card-front[data-season="'+currentCard.id+'"]'
    :'.cs-card-back[data-tier="'+currentCard.id+'"]';
  var css=sel+'{\n  grid-template-rows:'+nm+'% '+art+'% '+hk+'% auto;\n  padding:'+pt+'% '+ps+'% '+pb+'%;\n}';
  document.getElementById('output').textContent=mode.toUpperCase()+' — '+currentCard.label+'\n'+css;
}

function copyAll(){
  var text='=== CARD ALIGNMENT v2 ===\n\n';
  // Fronts
  var defaultFront={name:13,art:55,haiku:26,pt:6,ps:8,pb:4};
  cards.front.forEach(function(c){
    var key='front_'+c.id;
    var s=saved[key]||defaultFront;
    text+='FRONT — '+c.label+'\n';
    text+='  grid-template-rows: '+s.name+'% '+s.art+'% '+s.haiku+'% auto\n';
    text+='  padding: '+s.pt+'% '+s.ps+'% '+s.pb+'%\n\n';
  });
  // Backs
  cards.back.forEach(function(c){
    var key='back_'+c.id;
    var s=saved[key]||defaultFront;
    text+='BACK — '+c.label+'\n';
    text+='  padding: '+s.pt+'% '+s.ps+'% '+s.pb+'%\n\n';
  });
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){alert('Copied! Paste to Claude.');}).catch(function(){fallback(text);});
  }else{fallback(text);}
}
function fallback(text){
  var ta=document.createElement('textarea');ta.value=text;
  ta.style.cssText='position:fixed;top:0;left:0;width:100%;height:40%;z-index:9999;font-size:11px;background:#111;color:#7ab356;padding:0.5rem;';
  document.body.appendChild(ta);ta.select();
  alert('Copy the text, then tap elsewhere to close.');
  ta.addEventListener('blur',function(){ta.remove();});
}

setMode('front');
</script>
</body>
</html>
