// ─── GO RULES ENGINE ─────────────────────────────────────
function copyBoard(b){var c=[];for(var i=0;i<b.length;i++){c[i]=b[i].slice();}return c;}

function getGroup(b,r,c,sz){
  var color=b[r][c];if(color===EMPTY)return null;
  var visited={},stones=[],liberties=0;
  var stack=[[r,c]];
  while(stack.length){
    var p=stack.pop();var pr=p[0],pc=p[1];
    var k=pr+','+pc;
    if(visited[k])continue;
    visited[k]=true;
    if(b[pr][pc]===color){
      stones.push(p);
      var nb=[[pr-1,pc],[pr+1,pc],[pr,pc-1],[pr,pc+1]];
      for(var i=0;i<nb.length;i++){
        var nr=nb[i][0],nc=nb[i][1];
        if(nr<0||nr>=sz||nc<0||nc>=sz)continue;
        var nk=nr+','+nc;
        if(visited[nk])continue;
        if(b[nr][nc]===EMPTY)liberties++;
        else if(b[nr][nc]===color)stack.push([nr,nc]);
        if(b[nr][nc]===EMPTY)visited[nk]=true; // count each liberty once
      }
    }
  }
  return{stones:stones,liberties:liberties,color:color};
}

function removeGroup(b,stones){
  for(var i=0;i<stones.length;i++) b[stones[i][0]][stones[i][1]]=EMPTY;
  return stones.length;
}

function playMove(b,r,c,color,sz){
  if(r<0||r>=sz||c<0||c>=sz)return{valid:false};
  if(b[r][c]!==EMPTY)return{valid:false};
  b[r][c]=color;
  var opp=color===BLACK?WHITE:BLACK;
  var captured=0;
  var nb=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
  for(var i=0;i<nb.length;i++){
    var nr=nb[i][0],nc=nb[i][1];
    if(nr<0||nr>=sz||nc<0||nc>=sz)continue;
    if(b[nr][nc]===opp){
      var g=getGroup(b,nr,nc,sz);
      if(g&&g.liberties===0) captured+=removeGroup(b,g.stones);
    }
  }
  // Check suicide
  var myGroup=getGroup(b,r,c,sz);
  if(myGroup&&myGroup.liberties===0){
    b[r][c]=EMPTY;return{valid:false,suicide:true};
  }
  return{valid:true,captured:captured};
}

// ─── CANVAS SETUP ────────────────────────────────────────
function initCanvas(sz){
  boardSize=sz;
  canvas=document.getElementById('c');
  ctx=canvas.getContext('2d');
  var wrap=document.querySelector('.board-wrap');
  var maxPx=Math.min(wrap.clientWidth-16, wrap.clientHeight-16, 360);
  boardPx=maxPx;
  margin=Math.floor(boardPx/(boardSize+1));
  cellSize=margin;
  var totalPx=margin*(boardSize+1);
  var dpr=window.devicePixelRatio||1;
  canvas.width=totalPx*dpr;canvas.height=totalPx*dpr;
  canvas.style.width=totalPx+'px';canvas.style.height=totalPx+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

// ─── RENDERING ───────────────────────────────────────────
function render(){
  var total=margin*(boardSize+1);
  // Board background (wood tone)
  ctx.fillStyle='#2a2418';
  ctx.fillRect(0,0,total,total);

  // Grid lines
  ctx.strokeStyle='rgba(140,120,80,0.35)';
  ctx.lineWidth=1;
  for(var i=0;i<boardSize;i++){
    var x=margin+i*cellSize, y=margin+i*cellSize;
    ctx.beginPath();ctx.moveTo(margin,y);ctx.lineTo(margin+(boardSize-1)*cellSize,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,margin);ctx.lineTo(x,margin+(boardSize-1)*cellSize);ctx.stroke();
  }

  // Star points
  ctx.fillStyle='rgba(140,120,80,0.5)';
  var stars=[];
  if(boardSize===9)stars=[[2,2],[2,6],[4,4],[6,2],[6,6]];
  else if(boardSize===7)stars=[[1,1],[1,5],[3,3],[5,1],[5,5]];
  else if(boardSize===5)stars=[[2,2]];
  for(var si=0;si<stars.length;si++){
    var sx=margin+stars[si][1]*cellSize,sy=margin+stars[si][0]*cellSize;
    ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();
  }

  // Stones
  var stoneR=cellSize*0.42;
  for(var r=0;r<boardSize;r++){
    for(var c=0;c<boardSize;c++){
      if(board[r][c]===EMPTY)continue;
      var cx2=margin+c*cellSize,cy2=margin+r*cellSize;

      if(board[r][c]===BLACK){
        // Black stone
        var bg=ctx.createRadialGradient(cx2-stoneR*0.3,cy2-stoneR*0.3,stoneR*0.1,cx2,cy2,stoneR);
        bg.addColorStop(0,'#4a4a4a');bg.addColorStop(1,'#1a1a1a');
        ctx.fillStyle=bg;
      } else {
        // White stone
        var wg=ctx.createRadialGradient(cx2-stoneR*0.3,cy2-stoneR*0.3,stoneR*0.1,cx2,cy2,stoneR);
        wg.addColorStop(0,'#ffffff');wg.addColorStop(1,'#c8c8c0');
        ctx.fillStyle=wg;
      }
      ctx.beginPath();ctx.arc(cx2,cy2,stoneR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
    }
  }

  // Last move marker
  if(moveHistory.length>0){
    var last=moveHistory[moveHistory.length-1];
    var lx=margin+last.c*cellSize,ly=margin+last.r*cellSize;
    ctx.fillStyle=last.color===BLACK?'#E8DCC8':'#1a1a1a';
    ctx.beginPath();ctx.arc(lx,ly,stoneR*0.25,0,Math.PI*2);ctx.fill();
  }
}

// ─── PUZZLE SETUP ────────────────────────────────────────
function loadPuzzle(idx){
  var p=currentPuzzles[idx];
  if(!p)return;
  boardSize=p.size;
  initCanvas(boardSize);

  board=[];
  for(var r=0;r<boardSize;r++){board[r]=[];for(var c=0;c<boardSize;c++)board[r][c]=EMPTY;}

  // Place stones
  for(var i=0;i<p.B.length;i++) board[p.B[i][0]][p.B[i][1]]=BLACK;
  for(i=0;i<p.W.length;i++) board[p.W[i][0]][p.W[i][1]]=WHITE;

  playerColor=p.player;
  puzzleSolved=false;
  moveHistory=[];
  waitingForAI=false;

  document.getElementById('goal').textContent=p.goal;
  document.getElementById('hint').textContent=p.hint;
  document.getElementById('puzzle-num').textContent=(idx+1)+'/'+currentPuzzles.length;
  setMsg('','');
  updateDots();
  render();
}

// ─── INPUT ───────────────────────────────────────────────
function onBoardClick(e){
  if(puzzleSolved||waitingForAI)return;
  var rect=canvas.getBoundingClientRect();
  var x=(e.clientX||e.touches[0].clientX)-rect.left;
  var y=(e.clientY||e.touches[0].clientY)-rect.top;
  var scale=canvas.clientWidth/(margin*(boardSize+1));
  x/=scale; y/=scale;

  var col=Math.round((x-margin)/cellSize);
  var row=Math.round((y-margin)/cellSize);

  if(row<0||row>=boardSize||col<0||col>=boardSize)return;
  if(board[row][col]!==EMPTY)return;

  // Try the move
  var savedBoard=copyBoard(board);
  var result=playMove(board,row,col,playerColor,boardSize);
  if(!result.valid){
    board=savedBoard;
    setMsg('Invalid move','wrong');
    return;
  }

  moveHistory.push({r:row,c:col,color:playerColor,savedBoard:savedBoard});
  render();

  // Check if this is the solution
  var p=currentPuzzles[puzzleIdx];
  if(p.solution.length>0 && row===p.solution[0][0] && col===p.solution[0][1]){
    // Correct!
    puzzleSolved=true;
    solvedSet[difficulty+'_'+puzzleIdx]=true;
    totalSolved++;
    setMsg('✓ CORRECT!','correct');
    updateDots();
    try{navigator.vibrate&&navigator.vibrate(30);}catch(e2){}
    if(typeof window._e==='function')window._e('milestone');
  } else {
    // Check if the move achieves the puzzle goal anyway
    var achieved=checkGoal(p);
    if(achieved){
      puzzleSolved=true;
      solvedSet[difficulty+'_'+puzzleIdx]=true;
      totalSolved++;
      setMsg('✓ CORRECT! (alternate solution)','correct');
      updateDots();
      try{navigator.vibrate&&navigator.vibrate(30);}catch(e3){}
      if(typeof window._e==='function')window._e('milestone');
    } else {
      setMsg('Try again — that doesn\'t work','wrong');
      // Auto-undo after delay
      setTimeout(function(){
        if(!puzzleSolved&&moveHistory.length>0)undoMove();
      },1200);
    }
  }
}

function checkGoal(p){
  if(p.check==='captured'){
    // Check if all white stones are gone
    for(var r=0;r<boardSize;r++)for(var c=0;c<boardSize;c++)if(board[r][c]===WHITE)return false;
    return true;
  }
  if(p.check==='dead'){
    // Check if white group has <2 eyes (simplified: count empty spaces inside)
    // For puzzles, just check if the solution move was played somewhere reasonable
    // Full life/death analysis is complex — we rely on the solution tree
    return false;
  }
  if(p.check==='alive'){
    // Check if the player's group can make two eyes
    return false;
  }
  return false;
}

canvas.addEventListener('click',onBoardClick);
canvas.addEventListener('touchstart',function(e){e.preventDefault();onBoardClick(e);},{passive:false});

// ─── CONTROLS ────────────────────────────────────────────
window.undoMove=function(){
  if(moveHistory.length===0)return;
  var last=moveHistory.pop();
  board=last.savedBoard;
  puzzleSolved=false;
  setMsg('','');
  render();
};

window.showAnswer=function(){
  var p=currentPuzzles[puzzleIdx];
  if(!p||!p.solution||p.solution.length===0)return;
  var sol=p.solution[0];
  // Flash the solution point
  var cx2=margin+sol[1]*cellSize,cy2=margin+sol[0]*cellSize;
  var stoneR=cellSize*0.42;
  var flash=0;
  var interval=setInterval(function(){
    render();
    if(flash%2===0){
      ctx.fillStyle='rgba(212,168,67,0.5)';
      ctx.beginPath();ctx.arc(cx2,cy2,stoneR+4,0,Math.PI*2);ctx.fill();
    }
    flash++;
    if(flash>5)clearInterval(interval);
  },300);
  setMsg('Hint: row '+(sol[0]+1)+', col '+(sol[1]+1),'info');
};

window.nextPuzzle=function(){
  puzzleIdx++;
  if(puzzleIdx>=currentPuzzles.length)puzzleIdx=0;
  loadPuzzle(puzzleIdx);
};

window.backToMenu=function(){
  document.getElementById('app').style.display='none';
  document.getElementById('start-overlay').classList.remove('hidden');
  if(typeof window._sr==='function'){
    window._sr('livingstones',{w:totalSolved>0,s:totalSolved,lv:difficulty,tp:currentPuzzles.length});
  }
};

function setMsg(text,cls){
  var el=document.getElementById('msg');
  el.textContent=text;
  el.className='msg-bar'+(cls?' '+cls:'');
}

function updateDots(){
  var el=document.getElementById('dots');
  var html='';
  for(var i=0;i<currentPuzzles.length;i++){
    var cls='pdot';
    if(solvedSet[difficulty+'_'+i])cls+=' solved';
    if(i===puzzleIdx)cls+=' current';
    html+='<div class="'+cls+'"></div>';
  }
  el.innerHTML=html;
}

// ─── GAME START ──────────────────────────────────────────
window.startGame=function(diff){
  difficulty=diff;
  var keys=['beginner','intermediate','advanced'];
  currentPuzzles=ALL_PUZZLES[keys[diff]];
  puzzleIdx=0;
  totalSolved=0;
  solvedSet={};
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  loadPuzzle(0);
};

})();
</script>
