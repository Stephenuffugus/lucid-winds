<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <rect width="220" height="190" fill="#f5f0e8"/>

  <!-- CAPYBARA — sitting side profile facing left -->
  <!-- Built from Illustrator reference with vector path points -->

  <!-- ═══ HIND LEG (far side, behind body) ═══ -->
  <path d="M130,145 L128,162 C128,165 131,166 133,166 L138,166 C140,166 141,164 140,162 L137,145" fill="#7A5028"/>

  <!-- ═══ BODY — large dome/hill shape ═══ -->
  <!-- The back peaks high in the center, slopes down to both sides.
       Bottom is flat (sitting on ground). Like a rounded mountain. -->
  <path d="M58,152
           C48,142 42,125 45,108
           C48,92 58,80 72,74
           C88,67 108,65 125,68
           C142,71 154,80 158,95
           C162,112 160,132 155,148
           C152,156 142,160 130,160
           L68,160
           C62,160 58,157 58,152 Z" fill="#A87848"/>

  <!-- Darker underbelly shadow -->
  <path d="M62,155 C68,160 85,163 110,163 C130,163 142,158 150,148"
        fill="none" stroke="#8A6038" stroke-width="4" opacity="0.2" stroke-linecap="round"/>

  <!-- Back ridge — subtle darker contour along top -->
  <path d="M50,112 C55,92 65,80 78,74 C95,67 112,65 128,68 C145,72 155,82 158,98"
        fill="none" stroke="#8A5830" stroke-width="1.2" opacity="0.2"/>

  <!-- ═══ FRONT LEG (far side) ═══ -->
  <path d="M82,148 L80,162 C80,165 83,166 85,166 L90,166 C92,166 93,164 92,162 L89,148" fill="#7A5028"/>

  <!-- ═══ HIND LEG (near side) ═══ -->
  <!-- Bent — sitting pose, thigh angles forward then shin goes down -->
  <path d="M125,140 C122,148 120,155 122,162 C122,165 125,166 128,166
           L135,166 C137,166 138,164 137,162 L135,148 C136,142 132,138 125,140 Z" fill="#8A6038"/>

  <!-- ═══ FRONT LEG (near side) ═══ -->
  <path d="M72,146 L70,162 C70,165 73,166 75,166 L82,166 C84,166 85,164 84,162 L80,146" fill="#8A6038"/>

  <!-- ═══ HEAD — boxy, extends left from body ═══ -->
  <!-- Flat on top, blunt at front, connects to body at neck.
       The head is LOWER than the body's back peak. -->
  <path d="M32,104
           C32,92 38,82 48,78
           L70,76
           C76,76 80,80 78,88
           C76,96 72,104 65,110
           C55,118 40,115 34,110
           C32,108 32,106 32,104 Z" fill="#B08050"/>

  <!-- Jaw/chin line — gives the head its boxy bottom edge -->
  <path d="M36,110 C42,116 55,118 65,112" fill="none" stroke="#9A7040" stroke-width="1" opacity="0.25"/>

  <!-- ═══ SNOUT/MUZZLE — dark rectangular block ═══ -->
  <!-- Prominent, squared-off, hangs down from front of head -->
  <path d="M24,98
           C24,92 28,87 34,87
           L42,87
           C44,87 45,90 44,94
           C43,100 40,106 36,108
           C30,112 25,108 24,103 Z" fill="#8A6038"/>

  <!-- Snout-to-head transition line -->
  <path d="M42,87 C44,90 44,94 43,98" fill="none" stroke="#7A5028" stroke-width="0.8" opacity="0.3"/>

  <!-- ═══ NOSE — large dark pad ═══ -->
  <path d="M26,96 C26,93 28,91 31,91 C34,91 36,93 36,96
           C36,99 34,100 31,100 C28,100 26,99 26,96 Z" fill="#3A2A18"/>
  <!-- Nostril -->
  <ellipse cx="30" cy="96" rx="1.5" ry="1.2" fill="#1A1008"/>

  <!-- ═══ EYE — small, dark, set high on head ═══ -->
  <circle cx="48" cy="88" r="2.8" fill="#2D1810"/>
  <circle cx="49" cy="87" r="0.8" fill="rgba(255,255,255,0.35)"/>

  <!-- ═══ EARS — two small rounded bumps, set far back on skull ═══ -->
  <!-- Far ear (behind) -->
  <ellipse cx="68" cy="73" rx="4.5" ry="6" fill="#8A5830"/>
  <ellipse cx="68" cy="73" rx="2.5" ry="3.5" fill="#A07040" opacity="0.3"/>
  <!-- Near ear -->
  <ellipse cx="60" cy="74" rx="4.5" ry="6" fill="#9A6840"/>
  <ellipse cx="60" cy="74" rx="2.5" ry="3.5" fill="#B08050" opacity="0.3"/>

  <!-- Brow line above eye -->
  <path d="M44,85 C46,84 50,84 52,85" fill="none" stroke="#8A5830" stroke-width="0.8" opacity="0.25"/>

  <!-- ═══ MOUTH LINE ═══ -->
  <path d="M28,104 C32,107 38,108 42,106" fill="none" stroke="#6A4828" stroke-width="1" opacity="0.3"/>

  <!-- Hooves/toes — darker tips on feet -->
  <rect x="74" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.5"/>
  <rect x="78" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.5"/>
  <rect x="84" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.4"/>
  <rect x="88" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.4"/>
  <rect x="127" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.5"/>
  <rect x="131" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.5"/>
  <rect x="133" y="164" width="3" height="3" rx="1" fill="#5A3A18" opacity="0.4"/>
</svg>
