<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Seed Toss — Petal Walk</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d100c;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;pointer-events:none;z-index:10}
.hud-box{font-family:'Bebas Neue',sans-serif;text-align:center;color:#E8DCC8;line-height:1.1}
.hud-box .label{font-size:.5rem;opacity:.4;color:#4A7C35;letter-spacing:1px}
.hud-box .val{font-size:1.2rem}
#msg{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#E8DCC8;letter-spacing:3px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20;text-shadow:0 0 20px rgba(74,124,53,0.5)}
#msg.show{opacity:1}
#wind-indicator{position:fixed;top:44px;right:14px;pointer-events:none;z-index:10;font-family:'Bebas Neue',sans-serif;font-size:.6rem;color:#5B9BD5;text-align:center;opacity:0;transition:opacity .3s}
#wind-indicator.show{opacity:.7}
#start-overlay{position:fixed;inset:0;background:rgba(13,16,12,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#start-overlay.hidden{display:none}
#start-overlay h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:#4A7C35;letter-spacing:4px;margin-bottom:4px}
#start-overlay .sub{font-family:'Crimson Text',serif;font-style:italic;color:#E8DCC8;opacity:.6;margin-bottom:24px;font-size:.9rem}
.start-btn{background:rgba(26,36,22,0.8);border:1.5px solid #4A7C35;color:#E8DCC8;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;padding:14px 40px;border-radius:10px;cursor:pointer}
.start-btn:active{background:rgba(74,124,53,0.3);transform:scale(0.95)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:#1a2416;border:1px solid rgba(74,124,53,0.3);border-radius:12px;padding:20px;max-width:280px;width:90%;text-align:center}
.modal-box h2{font-family:'Bebas Neue',sans-serif;color:#4A7C35;font-size:1.3rem;letter-spacing:2px;margin-bottom:8px}
</style>
</head>
<body>
<div id="start-overlay">
  <h1>SEED TOSS</h1>
  <div class="sub">Flick seeds into garden pots</div>
  <button class="start-btn" onclick="beginGame()">🌱 TOSS</button>
</div>
<div id="hud" style="display:none">
  <div class="hud-box"><div class="label">SCORE</div><div class="val" id="h-score">0</div></div>
  <div class="hud-box"><div class="label">STREAK</div><div class="val" id="h-streak">0</div></div>
  <div class="hud-box"><div class="label">LEVEL</div><div class="val" id="h-level">1</div></div>
  <div class="hud-box"><div class="label">SEEDS</div><div class="val" id="h-seeds">20</div></div>
</div>
<div id="msg"></div>
<div id="wind-indicator">WIND<br><span id="wind-arrow">→</span></div>
<canvas id="c"></canvas>
<div class="modal-overlay" id="gameover-modal">
  <div class="modal-box">
    <h2>GARDEN FULL</h2>
    <p id="go-text" style="font-size:.85rem;margin:8px 0;color:#E8DCC8;line-height:1.5"></p>
    <button class="start-btn" onclick="restart()" style="font-size:.9rem;padding:10px 24px">🌱 AGAIN</button>
  </div>
</div>
<script>
(function(){
'use strict';

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W,H,dpr;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();window.addEventListener('resize',resize);

// ─── CONSTANTS ───────────────────────────────────────────
var GRAVITY = 800;
var SEED_RADIUS = 8;
var GROUND_Y;
var POT_COLORS = ['#6b4a2a','#8b5a3a','#5a3a1a','#7a5a2a'];

// ─── STATE ───────────────────────────────────────────────
var score=0,streak=0,bestStreak=0,level=1,seedsLeft=20,totalMade=0,totalThrown=0;
var seed=null; // {x,y,vx,vy,active,trail:[]}
var pot=null;  // {x,y,width,height,rimWidth}
var wind=0;
var phase='ready'; // ready, aiming, flying, scored, missed
var particles=[];
var shakeX=0,shakeY=0,shakeDec=0;

// Flick tracking
var touchStart=null;
var touchHistory=[];
var aimLine=null;

// ─── POT GENERATION ──────────────────────────────────────
function generatePot(){
  GROUND_Y=H*0.88;
  var minW=50,maxW=90;
  if(level>=3){maxW=80;}
  if(level>=5){maxW=70;minW=40;}
  if(level>=8){maxW=60;minW=35;}

  var pw=minW+Math.random()*(maxW-minW);
  var ph=pw*0.7;
  // Position: center-ish with variance, farther at higher levels
  var baseX=W*0.5;
  var spread=W*0.15+level*W*0.02;
  var px=baseX+(Math.random()-0.5)*spread;
  px=Math.max(pw/2+10,Math.min(W-pw/2-10,px));
  // Height: some pots are on shelves (elevated)
  var py=GROUND_Y;
  if(level>=4&&Math.random()<0.3) py=GROUND_Y-40-Math.random()*60;

  pot={x:px,y:py,width:pw,height:ph,rimWidth:pw+12,color:POT_COLORS[Math.floor(Math.random()*POT_COLORS.length)]};

  // Wind (level 3+)
  if(level>=3){
    wind=(Math.random()-0.5)*80*Math.min(level*0.5,4);
    var wi=document.getElementById('wind-indicator');
    var wa=document.getElementById('wind-arrow');
    if(Math.abs(wind)>5){
      wi.classList.add('show');
      var strength=Math.abs(wind);
      wa.textContent=(wind>0?'→':'←')+' '+(strength>40?'STRONG':strength>20?'MED':'LIGHT');
    } else {wi.classList.remove('show');}
  } else {
    wind=0;
    document.getElementById('wind-indicator').classList.remove('show');
  }
}

function resetSeed(){
  seed={x:W/2,y:H*0.78,vx:0,vy:0,active:false,trail:[]};
  phase='ready';
}

// ─── PHYSICS ─────────────────────────────────────────────
function updateSeed(dt){
  if(!seed||!seed.active)return;

  seed.vy+=GRAVITY*dt;
  seed.vx+=wind*dt; // wind acceleration
  seed.x+=seed.vx*dt;
  seed.y+=seed.vy*dt;

  // Trail
  seed.trail.push({x:seed.x,y:seed.y,life:0.5});

  // Check pot collision
  var potLeft=pot.x-pot.width/2;
  var potRight=pot.x+pot.width/2;
  var potTop=pot.y-pot.height;
  var potRimTop=potTop-4;

  // Seed enters the pot opening
  if(seed.x>potLeft+4&&seed.x<potRight-4&&seed.y>potRimTop&&seed.y<potRimTop+20&&seed.vy>0){
    // SCORE!
    scoreSeed();return;
  }

  // Hit pot rim (bounce off)
  if(seed.y>potRimTop&&seed.y<pot.y){
    if((seed.x>potLeft-8&&seed.x<potLeft+8)||(seed.x>potRight-8&&seed.x<potRight+8)){
      seed.vx=-seed.vx*0.3;
      seed.vy=-seed.vy*0.2;
      spawnRimParticles(seed.x,seed.y);
    }
  }

  // Hit ground or off screen
  if(seed.y>GROUND_Y||seed.x<-50||seed.x>W+50||seed.y<-200){
    missSeed();
  }
}

function scoreSeed(){
  phase='scored';
  seed.active=false;
  totalMade++;

  var pts=100*level;
  streak++;
  if(streak>bestStreak)bestStreak=streak;
  var streakBonus=streak>1?(streak-1)*25:0;
  pts+=streakBonus;

  // Distance bonus
  var dist=Math.abs(seed.x-pot.x);
  if(dist<5){pts+=50;showMsg('BULLSEYE! +'+pts);}
  else if(dist<15){pts+=25;showMsg('PERFECT! +'+pts);}
  else showMsg(streak>1?streak+'x +'+pts:'NICE! +'+pts);

  score+=pts;

  // Particles
  spawnScoreParticles(pot.x,pot.y-pot.height);
  addShake(3);
  try{navigator.vibrate&&navigator.vibrate(streak>2?[15,30,15]:20);}catch(e){}

  if(typeof window._e==='function'){
    window._e('milestone');
    if(streak%5===0)window._e('milestone');
  }

  // Level up every 5 makes
  if(totalMade%5===0){level++;showMsg('LEVEL '+level+'!',true);}

  updateHUD();
  setTimeout(function(){
    if(seedsLeft>0){generatePot();resetSeed();}
    else endGame();
  },600);
}

function missSeed(){
  phase='missed';
  seed.active=false;
  streak=0;
  spawnMissParticles(seed.x,Math.min(seed.y,GROUND_Y));
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
  updateHUD();
  setTimeout(function(){
    if(seedsLeft>0){resetSeed();}
    else endGame();
  },400);
}

// ─── PARTICLES ───────────────────────────────────────────
function spawnScoreParticles(x,y){
  var colors=['#4A7C35','#D4A843','#E8DCC8','#6aaa4a'];
  for(var i=0;i<20;i++){
    var a=Math.random()*Math.PI*2;
    var speed=50+Math.random()*120;
    particles.push({x:x,y:y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-60,
      life:0.6+Math.random()*0.5,maxLife:0.6+Math.random()*0.5,
      size:2+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)]});
  }
}

function spawnMissParticles(x,y){
  for(var i=0;i<8;i++){
    particles.push({x:x+(Math.random()-0.5)*20,y:y,
      vx:(Math.random()-0.5)*40,vy:-20-Math.random()*30,
      life:0.3+Math.random()*0.2,maxLife:0.3+Math.random()*0.2,
      size:1.5+Math.random()*2,color:'rgba(160,140,110,1)'});
  }
}

function spawnRimParticles(x,y){
  for(var i=0;i<5;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*60,vy:-20-Math.random()*40,
      life:0.2+Math.random()*0.2,maxLife:0.3,size:2,color:'#8b6a3a'});
  }
}

function addShake(amt){shakeDec=Math.max(shakeDec,amt);}

// ─── INPUT ───────────────────────────────────────────────
function onDown(e){
  e.preventDefault();
  if(phase!=='ready'||!seed)return;
  var pos=getPos(e);
  // Must touch near the seed
  var dx=pos.x-seed.x,dy=pos.y-seed.y;
  if(Math.sqrt(dx*dx+dy*dy)>60)return;
  phase='aiming';
  touchStart={x:pos.x,y:pos.y,time:Date.now()};
  touchHistory=[{x:pos.x,y:pos.y,time:Date.now()}];
}

function onMove(e){
  e.preventDefault();
  if(phase!=='aiming')return;
  var pos=getPos(e);
  touchHistory.push({x:pos.x,y:pos.y,time:Date.now()});
  if(touchHistory.length>10)touchHistory.shift();
  // Move seed with finger (slight offset)
  seed.x=pos.x;
  seed.y=pos.y;
  // Aim line
  aimLine={from:pos,to:touchStart};
}

function onUp(e){
  e.preventDefault();
  if(phase!=='aiming')return;

  // Calculate flick velocity from recent touch history
  var vx=0,vy=0;
  if(touchHistory.length>=2){
    var recent=touchHistory[touchHistory.length-1];
    var older=touchHistory[Math.max(0,touchHistory.length-4)];
    var dt=(recent.time-older.time)/1000;
    if(dt>0.001){
      vx=(recent.x-older.x)/dt;
      vy=(recent.y-older.y)/dt;
    }
  }

  // Minimum flick speed
  var speed=Math.sqrt(vx*vx+vy*vy);
  if(speed<100){
    // Too gentle — reset
    resetSeed();return;
  }

  // Cap speed
  var maxSpeed=1200;
  if(speed>maxSpeed){var scale=maxSpeed/speed;vx*=scale;vy*=scale;}

  // Must be flicking upward
  if(vy>-50){resetSeed();return;}

  seed.vx=vx;
  seed.vy=vy;
  seed.active=true;
  phase='flying';
  seedsLeft--;
  totalThrown++;
  aimLine=null;
  updateHUD();
}

function getPos(e){
  if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}

canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp,{passive:false});
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);

// ─── DRAWING ─────────────────────────────────────────────
function draw(){
  ctx.save();
  ctx.translate(shakeX,shakeY);

  // Background
  ctx.fillStyle='#0d100c';ctx.fillRect(0,0,W,H);

  // Ground
  var grd=ctx.createLinearGradient(0,GROUND_Y-10,0,H);
  grd.addColorStop(0,'rgba(40,35,25,0.3)');grd.addColorStop(1,'rgba(30,28,20,0.5)');
  ctx.fillStyle=grd;ctx.fillRect(0,GROUND_Y-5,W,H-GROUND_Y+5);
  ctx.strokeStyle='rgba(80,70,50,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(W,GROUND_Y);ctx.stroke();

  // Pot
  if(pot){
    var px=pot.x,py=pot.y,pw=pot.width,ph=pot.height;
    // Pot body (trapezoid)
    ctx.fillStyle=pot.color;
    ctx.beginPath();
    ctx.moveTo(px-pw/2,py);
    ctx.lineTo(px-pw*0.35,py-ph);
    ctx.lineTo(px+pw*0.35,py-ph);
    ctx.lineTo(px+pw/2,py);
    ctx.closePath();
    ctx.fill();
    // Rim
    ctx.fillStyle='#5a3a1a';
    ctx.fillRect(px-pot.rimWidth/2,py-ph-6,pot.rimWidth,8);
    // Inner shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(px-pw*0.3,py-ph-2,pw*0.6,8);
    // Shelf line if elevated
    if(pot.y<GROUND_Y-10){
      ctx.strokeStyle='rgba(80,70,50,0.3)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,pot.y);ctx.lineTo(W,pot.y);ctx.stroke();
    }
  }

  // Seed trail
  if(seed&&seed.trail){
    for(var ti=0;ti<seed.trail.length;ti++){
      var t=seed.trail[ti];
      ctx.globalAlpha=t.life*0.4;
      ctx.fillStyle='#D4A843';
      ctx.beginPath();ctx.arc(t.x,t.y,SEED_RADIUS*t.life,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Seed
  if(seed&&phase!=='scored'){
    var sx=seed.x,sy=seed.y;
    // Outer glow
    ctx.fillStyle='rgba(212,168,67,0.1)';
    ctx.beginPath();ctx.arc(sx,sy,SEED_RADIUS+6,0,Math.PI*2);ctx.fill();
    // Seed body
    var sg=ctx.createRadialGradient(sx-2,sy-2,0,sx,sy,SEED_RADIUS);
    sg.addColorStop(0,'#e8c860');sg.addColorStop(1,'#a08030');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.arc(sx,sy,SEED_RADIUS,0,Math.PI*2);ctx.fill();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.arc(sx-2,sy-2,3,0,Math.PI*2);ctx.fill();

    // Streak fire
    if(streak>=3){
      ctx.strokeStyle='rgba(212,168,67,'+(0.3+Math.sin(Date.now()*0.01)*0.15)+')';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sx,sy,SEED_RADIUS+4+Math.sin(Date.now()*0.01)*2,0,Math.PI*2);ctx.stroke();
    }
  }

  // Aim line (ghost trajectory)
  if(phase==='aiming'&&touchHistory.length>=2){
    var recent=touchHistory[touchHistory.length-1];
    var older=touchHistory[Math.max(0,touchHistory.length-4)];
    var dt=(recent.time-older.time)/1000||0.016;
    var avx=(recent.x-older.x)/dt;
    var avy=(recent.y-older.y)/dt;
    if(Math.sqrt(avx*avx+avy*avy)>50&&avy<-50){
      ctx.setLineDash([3,5]);
      ctx.strokeStyle='rgba(212,168,67,0.15)';
      ctx.lineWidth=1;
      ctx.beginPath();
      var gx=seed.x,gy=seed.y;
      ctx.moveTo(gx,gy);
      for(var gi=0;gi<30;gi++){
        gx+=avx*0.02;gy+=avy*0.02;avy+=GRAVITY*0.02;gx+=wind*0.02*0.02;
        ctx.lineTo(gx,gy);
        if(gy>GROUND_Y+20)break;
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Wind particles
  if(Math.abs(wind)>10&&Math.random()<0.08){
    var wx=wind>0?-10:W+10;
    var wy=H*0.2+Math.random()*H*0.5;
    particles.push({x:wx,y:wy,vx:wind*0.5+(Math.random()-0.5)*10,vy:(Math.random()-0.5)*8,
      life:2+Math.random()*2,maxLife:3,size:1+Math.random(),color:'rgba(232,220,200,0.1)'});
  }

  // Particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Idle hint
  if(phase==='ready'&&totalThrown===0){
    var alpha=0.3+Math.sin(Date.now()*0.003)*0.1;
    ctx.fillStyle='rgba(232,220,200,'+alpha+')';
    ctx.font='13px "Crimson Text",serif';
    ctx.textAlign='center';
    ctx.fillText('Flick the seed upward ↑',seed.x,seed.y+30);
  }

  ctx.restore();
}

// ─── GAME LOOP ───────────────────────────────────────────
var lastTime=0;

function loop(ts){
  var dt=lastTime?Math.min((ts-lastTime)/1000,0.04):0.016;
  lastTime=ts;

  updateSeed(dt);

  // Update trail
  if(seed&&seed.trail){
    for(var ti=seed.trail.length-1;ti>=0;ti--){
      seed.trail[ti].life-=dt*2;
      if(seed.trail[ti].life<=0)seed.trail.splice(ti,1);
    }
  }

  // Update particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;
    p.life-=dt;if(p.life<=0)particles.splice(i,1);
  }

  // Shake
  if(shakeDec>0.05){
    shakeX=(Math.random()-0.5)*shakeDec*2;
    shakeY=(Math.random()-0.5)*shakeDec*2;
    shakeDec*=0.85;
  } else {shakeX=0;shakeY=0;shakeDec=0;}

  draw();
  requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('h-score').textContent=score;
  document.getElementById('h-streak').textContent=streak;
  document.getElementById('h-level').textContent=level;
  document.getElementById('h-seeds').textContent=seedsLeft;
}

function showMsg(text,isLevel){
  var el=document.getElementById('msg');
  el.textContent=text;el.classList.add('show');
  clearTimeout(window._msgT);
  window._msgT=setTimeout(function(){el.classList.remove('show');},isLevel?1500:800);
}

function endGame(){
  var accuracy=totalThrown>0?Math.round(totalMade/totalThrown*100):0;
  document.getElementById('go-text').innerHTML=
    'Score: '+score+'<br>'+
    'Seeds landed: '+totalMade+'/'+totalThrown+' ('+accuracy+'%)<br>'+
    'Best streak: '+bestStreak+'<br>'+
    'Level reached: '+level;
  document.getElementById('gameover-modal').classList.add('open');
  if(typeof window._sr==='function')window._sr('seedtoss',{w:totalMade>=10,s:score,acc:accuracy,st:bestStreak,lv:level});
}

// ─── START ───────────────────────────────────────────────
window.beginGame=function(){
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('hud').style.display='flex';
  score=0;streak=0;bestStreak=0;level=1;seedsLeft=20;totalMade=0;totalThrown=0;
  particles=[];
  GROUND_Y=H*0.88;
  generatePot();resetSeed();updateHUD();
  lastTime=0;
  requestAnimationFrame(loop);
};

window.restart=function(){
  document.getElementById('gameover-modal').classList.remove('open');
  score=0;streak=0;bestStreak=0;level=1;seedsLeft=20;totalMade=0;totalThrown=0;
  particles=[];
  generatePot();resetSeed();updateHUD();
};

})();
</script>
</body>
</html>
