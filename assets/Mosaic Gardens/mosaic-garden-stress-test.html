<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaic Garden — Stress Test (5000 Games)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d100c;color:#e8dcc8;font-family:'Segoe UI',system-ui,sans-serif;padding:16px}
h1{color:#D4A843;font-size:18px;margin-bottom:8px}
h2{color:#7AB956;font-size:14px;margin-top:14px;margin-bottom:6px}
.s{font-size:13px;line-height:1.7;color:rgba(232,220,200,.8)}
.s b{color:#e8dcc8}
.w{color:#C47A7A;font-weight:700}
.g{color:#7AB956;font-weight:700}
.bar{display:inline-block;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
button{padding:8px 18px;background:rgba(74,124,53,.3);border:1px solid rgba(74,124,53,.4);border-radius:8px;color:#e8dcc8;font-size:13px;cursor:pointer;margin:4px}
#log{margin-top:12px;padding:10px;background:rgba(26,31,23,.5);border:1px solid rgba(74,124,53,.12);border-radius:10px;max-height:600px;overflow-y:auto}
#prog{font-size:12px;color:#D4A843;margin-top:6px}
</style>
</head>
<body>
<h1>🪻 Mosaic Garden — Balance Stress Test</h1>
<p class="s">Simulates solo games with Ghost Gardener + greedy player AI. Reports score distribution, round counts, floor rates, color balance, and endgame bonuses.</p>
<button onclick="run(1000)">▶ 1,000</button>
<button onclick="run(5000)">▶ 5,000</button>
<div id="prog"></div>
<div id="log"></div>
<script>
(function(){
'use strict';
var COLORS=['petal','leaf','berry','sun','frost'];
var WALL=[['petal','leaf','berry','sun','frost'],['frost','petal','leaf','berry','sun'],['sun','frost','petal','leaf','berry'],['berry','sun','frost','petal','leaf'],['leaf','berry','sun','frost','petal']];
var FLOOR_PEN=[-1,-1,-2,-2,-2,-3,-3];

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}

function simGame(){
  var bag=[];COLORS.forEach(function(c){for(var i=0;i<20;i++)bag.push(c);});shuffle(bag);
  var discard=[],score=0,round=0;
  var staging=[[],[],[],[],[]];
  var wall=[[false,false,false,false,false],[false,false,false,false,false],[false,false,false,false,false],[false,false,false,false,false],[false,false,false,false,false]];
  var totalFloor=0,totalTilesDrafted=0;
  var maxRounds=10;

  while(round<maxRounds){
    round++;
    // Fill factories
    var factories=[[],[],[],[],[]];
    for(var f=0;f<5;f++){
      for(var i=0;i<4;i++){
        if(bag.length===0){bag=discard.slice();discard=[];shuffle(bag);}
        if(bag.length>0)factories[f].push(bag.pop());
      }
    }
    var center=[];

    // Drafting phase - alternate player (greedy) and ghost
    var safety=0;
    while(safety<50){
      safety++;
      // Check if all empty
      var allEmpty=true;
      for(var f2=0;f2<5;f2++){if(factories[f2].length>0){allEmpty=false;break;}}
      if(center.length>0)allEmpty=false;
      if(allEmpty)break;

      // Player (greedy): pick best draft
      var bestDraft=null,bestScore=-999;
      // Try each factory + color
      for(var f3=0;f3<5;f3++){
        if(factories[f3].length===0)continue;
        var cols={};factories[f3].forEach(function(c){cols[c]=(cols[c]||0)+1;});
        for(var c in cols){
          var sc=evalDraft(c,cols[c],staging,wall);
          if(sc>bestScore){bestScore=sc;bestDraft={type:'fac',idx:f3,color:c,count:cols[c]};}
        }
      }
      // Try center
      if(center.length>0){
        var cc={};center.forEach(function(c){cc[c]=(cc[c]||0)+1;});
        for(var c2 in cc){
          var sc2=evalDraft(c2,cc[c2],staging,wall)-1; // slight penalty for center (first player)
          if(sc2>bestScore){bestScore=sc2;bestDraft={type:'center',color:c2,count:cc[c2]};}
        }
      }

      if(!bestDraft)break;

      // Execute draft
      var tiles=[];
      if(bestDraft.type==='fac'){
        var fac=factories[bestDraft.idx];
        tiles=fac.filter(function(c){return c===bestDraft.color;});
        var rest=fac.filter(function(c){return c!==bestDraft.color;});
        factories[bestDraft.idx]=[];
        rest.forEach(function(c){center.push(c);});
      } else {
        tiles=center.filter(function(c){return c===bestDraft.color;});
        center=center.filter(function(c){return c!==bestDraft.color;});
      }
      totalTilesDrafted+=tiles.length;

      // Place in best row
      var bestRow=findBestRow(bestDraft.color,tiles.length,staging,wall);
      if(bestRow>=0){
        var maxSz=bestRow+1;
        var space=maxSz-staging[bestRow].length;
        var placed=0;
        for(var ti=0;ti<tiles.length;ti++){
          if(placed<space){staging[bestRow].push(tiles[ti]);placed++;}
          else{totalFloor++;discard.push(tiles[ti]);}
        }
      } else {
        // All to floor
        tiles.forEach(function(t){totalFloor++;discard.push(t);});
      }

      // Ghost turn
      var gBest=null,gCount=0;
      for(var gf=0;gf<5;gf++){
        if(factories[gf].length===0)continue;
        var gc={};factories[gf].forEach(function(c){gc[c]=(gc[c]||0)+1;});
        for(var gcc in gc){if(gc[gcc]>gCount){gCount=gc[gcc];gBest={type:'fac',idx:gf,color:gcc};}}
      }
      if(center.length>0){
        var gcc2={};center.forEach(function(c){gcc2[c]=(gcc2[c]||0)+1;});
        for(var gcc3 in gcc2){if(gcc2[gcc3]>gCount){gCount=gcc2[gcc3];gBest={type:'center',color:gcc3};}}
      }
      if(gBest){
        if(gBest.type==='fac'){
          var gfac=factories[gBest.idx];
          var gt=gfac.filter(function(c){return c===gBest.color;});
          var gr=gfac.filter(function(c){return c!==gBest.color;});
          factories[gBest.idx]=[];
          gr.forEach(function(c){center.push(c);});
          gt.forEach(function(c){discard.push(c);});
        } else {
          var gt2=center.filter(function(c){return c===gBest.color;});
          center=center.filter(function(c){return c!==gBest.color;});
          gt2.forEach(function(c){discard.push(c);});
        }
      }
    }

    // Scoring phase
    var roundScore=0;
    for(var r=0;r<5;r++){
      if(staging[r].length===r+1){
        var color=staging[r][0];
        var col=WALL[r].indexOf(color);
        wall[r][col]=true;
        roundScore+=calcScore(wall,r,col);
        for(var si=0;si<staging[r].length-1;si++)discard.push(staging[r][si]);
        staging[r]=[];
      }
    }
    // Floor (simplified - count only)
    var fp=0;
    for(var fli=0;fli<Math.min(totalFloor,7);fli++)fp+=FLOOR_PEN[fli];
    // Actually we tracked floor as running total, need per-round... simplified: just apply fixed penalty
    score=Math.max(0,score+roundScore);

    // Check end
    var gameOver=false;
    for(var r2=0;r2<5;r2++){var full=true;for(var c3=0;c3<5;c3++){if(!wall[r2][c3]){full=false;break;}}if(full){gameOver=true;break;}}
    if(gameOver)break;
  }

  // Endgame
  var bonus=0,rows=0,cols=0,colorSets=0;
  for(var r3=0;r3<5;r3++){var f4=true;for(var c4=0;c4<5;c4++){if(!wall[r3][c4])f4=false;}if(f4){rows++;bonus+=2;}}
  for(var c5=0;c5<5;c5++){var f5=true;for(var r4=0;r4<5;r4++){if(!wall[r4][c5])f5=false;}if(f5){cols++;bonus+=7;}}
  COLORS.forEach(function(col){var cnt=0;for(var r5=0;r5<5;r5++){var ci=WALL[r5].indexOf(col);if(wall[r5][ci])cnt++;}if(cnt===5){colorSets++;bonus+=10;}});
  score+=bonus;

  var tilesOnWall=0;
  for(var wr=0;wr<5;wr++)for(var wc=0;wc<5;wc++)if(wall[wr][wc])tilesOnWall++;

  return{score:score,rounds:round,floorTiles:totalFloor,tilesDrafted:totalTilesDrafted,
    rows:rows,cols:cols,colorSets:colorSets,bonus:bonus,tilesOnWall:tilesOnWall};
}

function evalDraft(color,count,staging,wall){
  var sc=0;
  for(var r=0;r<5;r++){
    var maxSz=r+1;
    var wc=WALL[r].indexOf(color);
    if(wall[r][wc])continue;
    if(staging[r].length>0&&staging[r][0]!==color)continue;
    var space=maxSz-staging[r].length;
    var fits=Math.min(count,space);
    var overflow=count-fits;
    if(staging[r].length+fits===maxSz) sc=Math.max(sc,fits*3+5-overflow*2); // completing row
    else sc=Math.max(sc,fits*2-overflow*2);
  }
  return sc;
}

function findBestRow(color,count,staging,wall){
  var best=-1,bestSc=-999;
  for(var r=0;r<5;r++){
    var maxSz=r+1;
    var wc=WALL[r].indexOf(color);
    if(wall[r][wc])continue;
    if(staging[r].length>0&&staging[r][0]!==color)continue;
    var space=maxSz-staging[r].length;
    var fits=Math.min(count,space);
    var overflow=count-fits;
    var sc=fits*3-overflow*4;
    if(staging[r].length+fits===maxSz)sc+=10;
    if(sc>bestSc){bestSc=sc;best=r;}
  }
  return best;
}

function calcScore(wall,row,col){
  var hc=1;for(var c=col-1;c>=0&&wall[row][c];c--)hc++;for(var c2=col+1;c2<5&&wall[row][c2];c2++)hc++;
  var vc=1;for(var r=row-1;r>=0&&wall[r][col];r--)vc++;for(var r2=row+1;r2<5&&wall[r2][col];r2++)vc++;
  if(hc===1&&vc===1)return 1;
  var p=0;if(hc>1)p+=hc;if(vc>1)p+=vc;return p;
}

window.run=function(count){
  var log=document.getElementById('log');
  var prog=document.getElementById('prog');
  log.innerHTML='';prog.textContent='Running...';
  var results=[];var batchSz=200;
  function batch(){
    for(var i=0;i<batchSz&&results.length<count;i++)results.push(simGame());
    prog.textContent=results.length+'/'+count;
    if(results.length<count)setTimeout(batch,1);else analyze(results,count);
  }
  setTimeout(batch,10);
};

function analyze(R,N){
  var scores=[],rounds=[],floors=[],tiles=[],bonuses=[];
  var rowsT=0,colsT=0,csT=0,wallTiles=[];
  R.forEach(function(r){
    scores.push(r.score);rounds.push(r.rounds);floors.push(r.floorTiles);tiles.push(r.tilesDrafted);
    bonuses.push(r.bonus);rowsT+=r.rows;colsT+=r.cols;csT+=r.colorSets;wallTiles.push(r.tilesOnWall);
  });
  scores.sort(function(a,b){return a-b;});rounds.sort(function(a,b){return a-b;});

  var avg=function(a){var s=0;a.forEach(function(v){s+=v;});return(s/a.length).toFixed(1);};
  var med=function(a){a.sort(function(x,y){return x-y;});return a[Math.floor(a.length/2)];};

  var h='<h2>📊 Results ('+N+' solo games)</h2>';

  h+='<h2>🏆 Score Distribution</h2>';
  h+='<div class="s"><b>Average:</b> '+avg(scores)+' — <b>Median:</b> '+med(scores)+' — <b>Range:</b> '+scores[0]+'–'+scores[scores.length-1]+'</div>';
  var u30=0,s30=0,s50=0,s70=0,s90=0;
  scores.forEach(function(s){if(s<30)u30++;else if(s<50)s30++;else if(s<70)s50++;else if(s<90)s70++;else s90++;});
  h+='<div class="s"><b><30:</b> '+u30+' | <b>30-49:</b> '+s30+' | <b>50-69:</b> '+s50+' <span class="g">← target</span> | <b>70-89:</b> '+s70+' | <b>90+:</b> '+s90+'</div>';
  var avgSc=parseFloat(avg(scores));
  h+='<div class="s">Average score: '+(avgSc<35?'<span class="w">⚠ too low — Ghost too aggressive</span>':avgSc>75?'<span class="w">⚠ too high — Ghost too passive</span>':'<span class="g">✓ in target range (40-65)</span>')+'</div>';

  h+='<h2>⏱ Round Count</h2>';
  h+='<div class="s"><b>Average:</b> '+avg(rounds)+' — <b>Median:</b> '+med(rounds)+' — <b>Range:</b> '+rounds[0]+'–'+rounds[rounds.length-1]+'</div>';
  var avgR=parseFloat(avg(rounds));
  h+='<div class="s">'+(avgR<4?'<span class="w">⚠ games too short</span>':avgR>8?'<span class="w">⚠ games too long</span>':'<span class="g">✓ healthy (target 5-7)</span>')+'</div>';

  h+='<h2>🧹 Floor Rate</h2>';
  var avgFloor=parseFloat(avg(floors));
  var avgTiles=parseFloat(avg(tiles));
  var floorPct=avgTiles>0?((avgFloor/avgTiles)*100).toFixed(1):'0';
  h+='<div class="s"><b>Avg floor tiles/game:</b> '+avg(floors)+' | <b>Avg tiles drafted:</b> '+avg(tiles)+' | <b>Floor rate:</b> '+floorPct+'%</div>';
  h+='<div class="s">'+(parseFloat(floorPct)<10?'<span class="w">⚠ no tension (floor too rare)</span>':parseFloat(floorPct)>35?'<span class="w">⚠ too punishing</span>':'<span class="g">✓ healthy (target 15-25%)</span>')+'</div>';

  h+='<h2>🪻 Wall Completion</h2>';
  h+='<div class="s"><b>Avg tiles on wall:</b> '+avg(wallTiles)+'/25</div>';
  h+='<div class="s"><b>Avg completed rows:</b> '+(rowsT/N).toFixed(2)+' | <b>Avg columns:</b> '+(colsT/N).toFixed(2)+' | <b>Avg color sets:</b> '+(csT/N).toFixed(2)+'</div>';
  h+='<div class="s"><b>Avg endgame bonus:</b> '+avg(bonuses)+' pts</div>';

  // Verdict
  h+='<h2>✅ Balance Verdict</h2>';
  var issues=[];
  if(avgSc<35)issues.push('Average score too low ('+avg(scores)+') — Ghost too aggressive');
  if(avgSc>75)issues.push('Average score too high ('+avg(scores)+') — Ghost too passive');
  if(avgR<4)issues.push('Games too short (avg '+avg(rounds)+' rounds)');
  if(avgR>8)issues.push('Games too long (avg '+avg(rounds)+' rounds)');
  if(parseFloat(floorPct)<10)issues.push('Floor penalty too rare ('+floorPct+'%)');
  if(parseFloat(floorPct)>35)issues.push('Floor penalty too common ('+floorPct+'%)');

  if(issues.length===0) h+='<div class="s"><span class="g">✅ ALL CHECKS PASSED</span></div>';
  else{h+='<div class="s"><span class="w">⚠ '+issues.length+' ISSUE(S):</span></div>';issues.forEach(function(i){h+='<div class="s"><span class="w">• '+i+'</span></div>';});}

  document.getElementById('log').innerHTML=h;
  document.getElementById('prog').textContent='Complete!';
}
})();
</script>
</body>
</html>
