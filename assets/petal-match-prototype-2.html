<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Petal Match — Petal Walk</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d100c;touch-action:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:420px;margin:0 auto;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 14px;flex-shrink:0}
.hud-box{font-family:'Bebas Neue',sans-serif;text-align:center;color:#E8DCC8}
.hud-box .label{font-size:.5rem;opacity:.4;color:#4A7C35;letter-spacing:1px}
.hud-box .val{font-size:1.2rem}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{display:block;border-radius:8px}
.msg-area{text-align:center;padding:4px 10px;min-height:24px;flex-shrink:0;font-size:.8rem;font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.msg-area.combo{color:#D4A843;font-size:1rem}
.moves-bar{width:90%;max-width:300px;height:6px;background:rgba(26,36,22,0.5);border-radius:3px;margin:4px auto;flex-shrink:0;overflow:hidden}
.moves-fill{height:100%;background:#4A7C35;transition:width .3s;border-radius:3px}
#start-overlay{position:fixed;inset:0;background:rgba(13,16,12,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#start-overlay.hidden{display:none}
#start-overlay h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:#4A7C35;letter-spacing:4px;margin-bottom:4px}
#start-overlay .sub{font-family:'Crimson Text',serif;font-style:italic;color:#E8DCC8;opacity:.6;margin-bottom:24px;font-size:.85rem}
.start-btn{background:rgba(26,36,22,0.8);border:1.5px solid #4A7C35;color:#E8DCC8;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;padding:14px 36px;border-radius:10px;cursor:pointer}
.start-btn:active{background:rgba(74,124,53,0.3);transform:scale(0.95)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal-box{background:#1a2416;border:1px solid rgba(74,124,53,0.3);border-radius:12px;padding:20px;max-width:280px;width:90%;text-align:center}
.modal-box h2{font-family:'Bebas Neue',sans-serif;color:#4A7C35;font-size:1.3rem;letter-spacing:2px;margin-bottom:8px}
</style>
</head>
<body>
<div id="start-overlay">
  <h1>PETAL MATCH</h1>
  <div class="sub">Swap petals to match three or more</div>
  <button class="start-btn" onclick="beginGame()">🌺 PLAY</button>
</div>
<div id="app" style="display:none">
  <div class="top-bar">
    <div class="hud-box"><div class="label">SCORE</div><div class="val" id="h-score">0</div></div>
    <div class="hud-box"><div class="label">LEVEL</div><div class="val" id="h-level">1</div></div>
    <div class="hud-box"><div class="label">MOVES</div><div class="val" id="h-moves">30</div></div>
  </div>
  <div class="moves-bar"><div class="moves-fill" id="moves-fill" style="width:100%"></div></div>
  <div class="msg-area" id="msg"></div>
  <div class="board-wrap"><canvas id="c"></canvas></div>
</div>
<div class="modal-overlay" id="level-modal">
  <div class="modal-box"><h2 id="lm-title">LEVEL COMPLETE</h2><p id="lm-text" style="font-size:.85rem;margin:8px 0;color:#E8DCC8"></p>
  <button class="start-btn" onclick="nextLevel()" style="font-size:.85rem;padding:10px 24px">NEXT LEVEL</button></div>
</div>
<div class="modal-overlay" id="gameover-modal">
  <div class="modal-box"><h2>NO MOVES LEFT</h2><p id="go-text" style="font-size:.85rem;margin:8px 0;color:#E8DCC8"></p>
  <button class="start-btn" onclick="restartGame()" style="font-size:.85rem;padding:10px 24px">🌺 RETRY</button></div>
</div>
<script>
(function(){
'use strict';

var ROWS=8,COLS=8,CELL,TYPES=6;
var canvas,ctx,dpr;
var grid=[];// grid[r][c] = {type, x, y, targetY, scale, alpha}
var score=0,level=1,movesLeft=30,targetScore=500;
var selected=null; // {r,c}
var animating=false;
var comboCount=0;
var particles=[];

// Botanical gem types
var GEMS=[
  {color:'#4A7C35',icon:'🌿',name:'Sage'},
  {color:'#C47A7A',icon:'🌸',name:'Rose'},
  {color:'#5B9BD5',icon:'💧',name:'Dew'},
  {color:'#D4A843',icon:'🌻',name:'Sun'},
  {color:'#9B6BA3',icon:'🍇',name:'Berry'},
  {color:'#E8DCC8',icon:'🍄',name:'Spore'}
];

function initCanvas(){
  canvas=document.getElementById('c');ctx=canvas.getContext('2d');
  dpr=window.devicePixelRatio||1;
  var maxSize=Math.min(window.innerWidth-24,window.innerHeight-200,360);
  CELL=Math.floor(maxSize/COLS);
  var total=COLS*CELL;
  canvas.width=total*dpr;canvas.height=ROWS*CELL*dpr;
  canvas.style.width=total+'px';canvas.style.height=(ROWS*CELL)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function initGrid(){
  grid=[];
  for(var r=0;r<ROWS;r++){grid[r]=[];
    for(var c=0;c<COLS;c++){
      var type;
      do{type=Math.floor(Math.random()*TYPES);}
      while((c>=2&&grid[r][c-1].type===type&&grid[r][c-2].type===type)||
            (r>=2&&grid[r-1][c].type===type&&grid[r-2][c].type===type));
      grid[r][c]={type:type,x:c*CELL,y:r*CELL,targetY:r*CELL,scale:1,alpha:1};
    }
  }
}

// ─── MATCH DETECTION ─────────────────────────────────────
function findMatches(){
  var matches=[];
  // Horizontal
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS-2;c++){
      if(grid[r][c]&&grid[r][c+1]&&grid[r][c+2]&&
         grid[r][c].type===grid[r][c+1].type&&grid[r][c].type===grid[r][c+2].type){
        var m=[{r:r,c:c},{r:r,c:c+1},{r:r,c:c+2}];
        // Extend
        var nc=c+3;
        while(nc<COLS&&grid[r][nc]&&grid[r][nc].type===grid[r][c].type){m.push({r:r,c:nc});nc++;}
        matches.push(m);c=nc-3;
      }
    }
  }
  // Vertical
  for(var c2=0;c2<COLS;c2++){
    for(var r2=0;r2<ROWS-2;r2++){
      if(grid[r2][c2]&&grid[r2+1][c2]&&grid[r2+2][c2]&&
         grid[r2][c2].type===grid[r2+1][c2].type&&grid[r2][c2].type===grid[r2+2][c2].type){
        var m2=[{r:r2,c:c2},{r:r2+1,c:c2},{r:r2+2,c:c2}];
        var nr=r2+3;
        while(nr<ROWS&&grid[nr][c2]&&grid[nr][c2].type===grid[r2][c2].type){m2.push({r:nr,c:c2});nr++;}
        matches.push(m2);r2=nr-3;
      }
    }
  }
  return matches;
}

function hasValidMove(){
  // Check if any swap creates a match
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      // Try swap right
      if(c<COLS-1){
        swap(r,c,r,c+1);
        if(findMatches().length>0){swap(r,c,r,c+1);return true;}
        swap(r,c,r,c+1);
      }
      // Try swap down
      if(r<ROWS-1){
        swap(r,c,r+1,c);
        if(findMatches().length>0){swap(r,c,r+1,c);return true;}
        swap(r,c,r+1,c);
      }
    }
  }
  return false;
}

function swap(r1,c1,r2,c2){
  var tmp=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=tmp;
}

// ─── MATCH RESOLUTION ────────────────────────────────────
function resolveMatches(callback){
  var matches=findMatches();
  if(matches.length===0){
    comboCount=0;
    callback();return;
  }
  comboCount++;
  animating=true;

  // Mark matched cells
  var toRemove={};
  var totalCleared=0;
  for(var i=0;i<matches.length;i++){
    for(var j=0;j<matches[i].length;j++){
      var m=matches[i][j];
      toRemove[m.r+','+m.c]=true;
      totalCleared++;
    }
  }

  // Score
  var pts=totalCleared*10*comboCount*level;
  score+=pts;

  if(comboCount>1){
    setMsg(comboCount+'x COMBO! +'+pts,'combo');
  } else {
    setMsg('+'+pts,'');
  }

  // Particles
  for(var key in toRemove){
    var parts=key.split(',');
    var pr=parseInt(parts[0]),pc=parseInt(parts[1]);
    var gem=grid[pr][pc];
    if(gem){
      var color=GEMS[gem.type].color;
      for(var p=0;p<4;p++){
        particles.push({
          x:pc*CELL+CELL/2,y:pr*CELL+CELL/2,
          vx:(Math.random()-0.5)*100,vy:-30-Math.random()*60,
          life:0.4+Math.random()*0.3,maxLife:0.4+Math.random()*0.3,
          size:2+Math.random()*3,color:color
        });
      }
    }
  }

  try{navigator.vibrate&&navigator.vibrate(comboCount>1?[10,20,10]:10);}catch(e){}
  if(typeof window._e==='function'&&comboCount>=2)window._e('milestone');

  // Animate removal
  for(key in toRemove){
    parts=key.split(',');pr=parseInt(parts[0]);pc=parseInt(parts[1]);
    if(grid[pr][pc])grid[pr][pc].scale=0;
  }

  setTimeout(function(){
    // Remove cells
    for(var key2 in toRemove){
      var p2=key2.split(',');grid[parseInt(p2[0])][parseInt(p2[1])]=null;
    }
    // Gravity
    for(var c=0;c<COLS;c++){
      var writeR=ROWS-1;
      for(var r=ROWS-1;r>=0;r--){
        if(grid[r][c]){
          grid[writeR][c]=grid[r][c];
          grid[writeR][c].targetY=writeR*CELL;
          if(writeR!==r)grid[r][c]=null;
          writeR--;
        }
      }
      // Fill empty top
      for(var r2=writeR;r2>=0;r2--){
        var type=Math.floor(Math.random()*TYPES);
        grid[r2][c]={type:type,x:c*CELL,y:(r2-writeR-1)*CELL,targetY:r2*CELL,scale:1,alpha:1};
      }
    }
    // Animate falling, then check for cascading matches
    setTimeout(function(){
      resolveMatches(callback);
    },250);
  },200);
}

// ─── INPUT ───────────────────────────────────────────────
var touchStartR=-1,touchStartC=-1;

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(animating)return;
  var rect=canvas.getBoundingClientRect();
  var x=e.touches[0].clientX-rect.left;
  var y=e.touches[0].clientY-rect.top;
  touchStartR=Math.floor(y/CELL);
  touchStartC=Math.floor(x/CELL);
  if(touchStartR<0||touchStartR>=ROWS||touchStartC<0||touchStartC>=COLS){touchStartR=-1;return;}
  selected={r:touchStartR,c:touchStartC};
  render();
},{passive:false});

canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  if(animating||touchStartR<0)return;
  var rect=canvas.getBoundingClientRect();
  var x=e.changedTouches[0].clientX-rect.left;
  var y=e.changedTouches[0].clientY-rect.top;
  var endR=Math.floor(y/CELL),endC=Math.floor(x/CELL);
  var dr=endR-touchStartR,dc=endC-touchStartC;

  // Determine swipe direction (must be adjacent)
  var swapR=touchStartR,swapC=touchStartC;
  if(Math.abs(dc)>Math.abs(dr)){swapC+=dc>0?1:-1;}
  else if(Math.abs(dr)>0){swapR+=dr>0?1:-1;}
  else{selected=null;render();return;} // tap without swipe

  if(swapR<0||swapR>=ROWS||swapC<0||swapC>=COLS){selected=null;render();return;}

  // Try the swap
  swap(touchStartR,touchStartC,swapR,swapC);
  if(findMatches().length>0){
    movesLeft--;
    updateHUD();
    animating=true;
    resolveMatches(function(){
      animating=false;
      selected=null;
      checkState();
      render();
    });
  } else {
    // Invalid swap — swap back
    swap(touchStartR,touchStartC,swapR,swapC);
    selected=null;
  }
  render();
},{passive:false});

// Mouse fallback
var mouseDown=false;
canvas.addEventListener('mousedown',function(e){
  if(animating)return;
  mouseDown=true;
  var rect=canvas.getBoundingClientRect();
  touchStartR=Math.floor((e.clientY-rect.top)/CELL);
  touchStartC=Math.floor((e.clientX-rect.left)/CELL);
  if(touchStartR<0||touchStartR>=ROWS||touchStartC<0||touchStartC>=COLS){touchStartR=-1;return;}
  selected={r:touchStartR,c:touchStartC};render();
});
canvas.addEventListener('mouseup',function(e){
  if(!mouseDown||animating||touchStartR<0){mouseDown=false;return;}
  mouseDown=false;
  var rect=canvas.getBoundingClientRect();
  var endR=Math.floor((e.clientY-rect.top)/CELL),endC=Math.floor((e.clientX-rect.left)/CELL);
  var dr=endR-touchStartR,dc=endC-touchStartC;
  var swapR=touchStartR,swapC=touchStartC;
  if(Math.abs(dc)>Math.abs(dr)){swapC+=dc>0?1:-1;}
  else if(Math.abs(dr)>0){swapR+=dr>0?1:-1;}
  else{selected=null;render();return;}
  if(swapR<0||swapR>=ROWS||swapC<0||swapC>=COLS){selected=null;render();return;}
  swap(touchStartR,touchStartC,swapR,swapC);
  if(findMatches().length>0){
    movesLeft--;updateHUD();animating=true;
    resolveMatches(function(){animating=false;selected=null;checkState();render();});
  } else {swap(touchStartR,touchStartC,swapR,swapC);selected=null;}
  render();
});

function checkState(){
  if(score>=targetScore){
    setTimeout(function(){
      document.getElementById('lm-title').textContent='LEVEL '+level+' COMPLETE!';
      document.getElementById('lm-text').textContent='Score: '+score+' · Moves remaining: '+movesLeft;
      document.getElementById('level-modal').classList.add('open');
    },300);
    return;
  }
  if(movesLeft<=0){
    setTimeout(function(){
      document.getElementById('go-text').textContent='Score: '+score+' · Target was '+targetScore;
      document.getElementById('gameover-modal').classList.add('open');
      if(typeof window._sr==='function')window._sr('petalmatch',{w:false,s:score,lv:level});
    },300);
    return;
  }
  if(!hasValidMove()){
    // Shuffle board
    setMsg('No moves — shuffling!','combo');
    initGrid();
  }
}

// ─── RENDERING ───────────────────────────────────────────
function render(){
  var w=COLS*CELL,h=ROWS*CELL;
  ctx.fillStyle='#0d100c';ctx.fillRect(0,0,w,h);

  // Grid bg
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      ctx.fillStyle=(r+c)%2===0?'rgba(26,36,22,0.2)':'rgba(26,36,22,0.1)';
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
  }

  // Gems
  for(r=0;r<ROWS;r++){
    for(c=0;c<COLS;c++){
      var cell=grid[r][c];if(!cell)continue;
      // Animate Y position
      if(cell.y!==cell.targetY){
        cell.y+=(cell.targetY-cell.y)*0.3;
        if(Math.abs(cell.y-cell.targetY)<0.5)cell.y=cell.targetY;
      }
      cell.x=c*CELL;
      var gem=GEMS[cell.type];
      var cx2=cell.x+CELL/2,cy2=cell.y+CELL/2;
      var sz=CELL*0.4*cell.scale;

      // Gem body
      ctx.fillStyle=gem.color;
      ctx.globalAlpha=cell.alpha;
      ctx.beginPath();
      ctx.arc(cx2,cy2,sz,0,Math.PI*2);
      ctx.fill();

      // Inner highlight
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.arc(cx2-sz*0.2,cy2-sz*0.2,sz*0.5,0,Math.PI*2);
      ctx.fill();

      // Outer glow
      ctx.strokeStyle=gem.color;
      ctx.globalAlpha=0.15*cell.alpha;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(cx2,cy2,sz+3,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=1;

      // Selection highlight
      if(selected&&selected.r===r&&selected.c===c){
        ctx.strokeStyle='#E8DCC8';
        ctx.lineWidth=2;
        ctx.strokeRect(c*CELL+2,r*CELL+2,CELL-4,CELL-4);
      }
    }
  }

  // Particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('h-score').textContent=score;
  document.getElementById('h-level').textContent=level;
  document.getElementById('h-moves').textContent=movesLeft;
  document.getElementById('moves-fill').style.width=(movesLeft/30*100)+'%';
}

function setMsg(t,cls){var el=document.getElementById('msg');el.textContent=t;el.className='msg-area'+(cls?' '+cls:'');
  if(t)setTimeout(function(){if(el.textContent===t)el.textContent='';},1500);}

// ─── ANIMATION LOOP ──────────────────────────────────────
var lastTime=0;
function loop(ts){
  var dt=lastTime?(ts-lastTime)/1000:0.016;lastTime=ts;
  // Update particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;
    p.life-=dt;if(p.life<=0)particles.splice(i,1);
  }
  render();
  requestAnimationFrame(loop);
}

// ─── GAME FLOW ───────────────────────────────────────────
window.beginGame=function(){
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  initCanvas();level=1;score=0;movesLeft=30;targetScore=500;
  initGrid();
  // Clear initial matches
  while(findMatches().length>0)initGrid();
  updateHUD();requestAnimationFrame(loop);
};

window.nextLevel=function(){
  document.getElementById('level-modal').classList.remove('open');
  level++;movesLeft=30+level*2;targetScore=500+level*300;score=0;
  initGrid();while(findMatches().length>0)initGrid();
  updateHUD();
  if(typeof window._e==='function')window._e('milestone');
};

window.restartGame=function(){
  document.getElementById('gameover-modal').classList.remove('open');
  score=0;movesLeft=30;
  initGrid();while(findMatches().length>0)initGrid();
  updateHUD();
};

})();
</script>
</body>
</html>
