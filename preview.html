<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid Winds — EA Badge Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Bebas+Neue&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d100c;--sage:#7ab356;--gold:#c8a84b;--cream:#e8dcc8;--muted:#8a9178;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0c09;color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;}

  /* Controls */
  .controls{width:92vw;max-width:460px;padding:12px 0;display:flex;flex-direction:column;gap:6px;}
  .control-row{display:flex;align-items:center;gap:8px;font-size:0.7rem;}
  .control-row label{min-width:120px;color:var(--muted);}
  .control-row input[type="range"]{flex:1;accent-color:var(--sage);}
  .control-row .val{min-width:50px;text-align:right;color:var(--sage);font-size:0.65rem;}
  .control-row select{background:#1a1d18;color:var(--cream);border:1px solid var(--muted);border-radius:4px;padding:2px 6px;font-family:'DM Mono',monospace;font-size:0.65rem;}
  .section-label{font-size:0.6rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;margin-top:6px;border-top:1px solid rgba(122,179,86,0.15);padding-top:6px;}

  /* Card container */
  .card-wrap{width:92vw;max-width:460px;height:calc(100vh - 320px);max-height:600px;position:relative;margin:0 auto;}
  .card-front{position:absolute;inset:0;display:grid;grid-template-rows:12% 55% 20% auto;border-radius:12px;overflow:visible;background-color:#050505;background-size:96%;background-position:center;background-repeat:no-repeat;padding:25% 12% 8%;border:2px solid rgba(232,160,191,0.3);box-shadow:0 0 0 3px #050505, 0 0 0 5px rgba(232,160,191,0.15);}

  .cf-name-zone{display:flex;align-items:center;justify-content:center;overflow:hidden;background:transparent;}
  .cf-art-window{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:transparent;}
  .cf-art-window svg{max-height:100%;max-width:100%;height:auto;width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));}
  .cf-haiku-zone{display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:transparent;}

  /* EA Badge — matches current carousel styles */
  .cf-ea{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;
    background:rgba(13,16,12,0.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    border:1px solid rgba(232,160,191,0.3);
    font-family:'Bebas Neue',sans-serif;color:#E8A0BF;letter-spacing:0.03em;line-height:1;}

  .cf-name{font-family:'Playfair Display',serif;font-weight:700;text-align:center;letter-spacing:0.02em;text-shadow:0 2px 8px rgba(0,0,0,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;color:#E8A0BF;}
  .cf-haiku{font-family:'Playfair Display',serif;font-style:italic;color:rgba(212,207,188,0.85);line-height:1.65;text-align:center;width:100%;}
  .cs-flip-hint{font-family:'DM Mono',monospace;font-size:0.35rem;color:rgba(122,179,86,0.35);text-align:center;position:absolute;bottom:2%;left:0;right:0;}

  /* Readout */
  .readout{width:92vw;max-width:460px;padding:8px 0;font-size:0.6rem;color:var(--muted);text-align:center;border-top:1px solid rgba(122,179,86,0.1);margin-top:8px;}
  .readout code{color:var(--sage);}
</style>
</head>
<body>

<div class="controls">
  <div class="section-label">EA Badge Position</div>
  <div class="control-row">
    <label>Top</label>
    <input type="range" id="sl-ea-top" min="0" max="80" value="12" step="1">
    <span class="val" id="v-ea-top">12px</span>
  </div>
  <div class="control-row">
    <label>Right</label>
    <input type="range" id="sl-ea-right" min="0" max="80" value="12" step="1">
    <span class="val" id="v-ea-right">12px</span>
  </div>

  <div class="section-label">EA Badge Size</div>
  <div class="control-row">
    <label>Pill width</label>
    <input type="range" id="sl-ea-w" min="20" max="80" value="48" step="1">
    <span class="val" id="v-ea-w">48px</span>
  </div>
  <div class="control-row">
    <label>Pill height</label>
    <input type="range" id="sl-ea-h" min="20" max="80" value="48" step="1">
    <span class="val" id="v-ea-h">48px</span>
  </div>
  <div class="control-row">
    <label>Font size</label>
    <input type="range" id="sl-ea-fs" min="0.6" max="3" value="1.61" step="0.01">
    <span class="val" id="v-ea-fs">1.61rem</span>
  </div>
  <div class="control-row">
    <label>Border radius</label>
    <input type="range" id="sl-ea-br" min="0" max="24" value="9" step="1">
    <span class="val" id="v-ea-br">9px</span>
  </div>

  <div class="section-label">Season</div>
  <div class="control-row">
    <label>Season</label>
    <select id="sel-season">
      <option value="spring" selected>Spring</option>
      <option value="summer">Summer</option>
      <option value="autumn">Autumn</option>
      <option value="winter">Winter</option>
    </select>
  </div>
</div>

<div class="card-wrap">
  <div class="card-front" id="card">
    <div class="cf-ea" id="ea-badge">12</div>
    <div class="cf-name-zone">
      <div class="cf-name" id="el-name">The Hollow Torrentbed</div>
    </div>
    <div class="cf-art-window">
      <svg viewBox="0 0 200 280" width="160" height="220">
        <rect x="80" y="120" width="40" height="140" rx="6" fill="#5a3a1a"/>
        <ellipse cx="100" cy="100" rx="60" ry="70" fill="#4a8c3f" opacity="0.85"/>
        <ellipse cx="80" cy="80" rx="30" ry="35" fill="#6ab04c" opacity="0.7"/>
        <ellipse cx="120" cy="75" rx="25" ry="30" fill="#7ab356" opacity="0.6"/>
        <circle cx="100" cy="60" r="12" fill="#E8A0BF" opacity="0.8"/>
        <circle cx="85" cy="90" r="6" fill="#c8a84b" opacity="0.5"/>
        <rect x="60" y="255" width="80" height="25" rx="4" fill="#8a6e3e"/>
      </svg>
    </div>
    <div class="cf-haiku-zone">
      <div class="cf-haiku" id="el-haiku">soft rain on dry leaves<br>the hollow torrent murmurs<br>roots drink deep below</div>
    </div>
    <div class="cs-flip-hint">tap to flip &#8594;</div>
  </div>
</div>

<div class="readout" id="readout"></div>

<script>
var _cb = '?v=' + Date.now();
var seasonImages = {
  spring: 'assets/card-front-spring.png' + _cb,
  summer: 'assets/card-front-summer.png' + _cb,
  autumn: 'assets/card-front-autumn.png' + _cb,
  winter: 'assets/card-front-winter.png' + _cb
};
var seasonColors = {spring:'#E8A0BF',summer:'#D4A843',autumn:'#D4842A',winter:'#A0C4E8'};
var seasonBorders = {
  spring:'rgba(232,160,191,0.3)',
  summer:'rgba(212,168,67,0.3)',
  autumn:'rgba(212,132,42,0.3)',
  winter:'rgba(160,196,232,0.3)'
};

var card = document.getElementById('card');
var eaBadge = document.getElementById('ea-badge');
var elName = document.getElementById('el-name');
var readout = document.getElementById('readout');

function update() {
  var eaTop = document.getElementById('sl-ea-top').value;
  var eaRight = document.getElementById('sl-ea-right').value;
  var eaW = document.getElementById('sl-ea-w').value;
  var eaH = document.getElementById('sl-ea-h').value;
  var eaFs = document.getElementById('sl-ea-fs').value;
  var eaBr = document.getElementById('sl-ea-br').value;
  var season = document.getElementById('sel-season').value;

  card.style.backgroundImage = "url('" + seasonImages[season] + "')";
  card.style.borderColor = seasonBorders[season];
  card.style.boxShadow = '0 0 0 3px #050505, 0 0 0 5px ' + seasonBorders[season].replace('0.3','0.15');

  elName.style.color = seasonColors[season];

  eaBadge.style.top = eaTop + 'px';
  eaBadge.style.right = eaRight + 'px';
  eaBadge.style.minWidth = eaW + 'px';
  eaBadge.style.height = eaH + 'px';
  eaBadge.style.fontSize = eaFs + 'rem';
  eaBadge.style.borderRadius = eaBr + 'px';
  eaBadge.style.borderColor = seasonBorders[season];
  eaBadge.style.color = seasonColors[season];

  document.getElementById('v-ea-top').textContent = eaTop + 'px';
  document.getElementById('v-ea-right').textContent = eaRight + 'px';
  document.getElementById('v-ea-w').textContent = eaW + 'px';
  document.getElementById('v-ea-h').textContent = eaH + 'px';
  document.getElementById('v-ea-fs').textContent = eaFs + 'rem';
  document.getElementById('v-ea-br').textContent = eaBr + 'px';

  readout.innerHTML = 'CSS: <code>top:' + eaTop + 'px; right:' + eaRight + 'px; min-width:' + eaW + 'px; height:' + eaH + 'px; font-size:' + eaFs + 'rem; border-radius:' + eaBr + 'px;</code>';
}

document.querySelectorAll('input[type=range],select').forEach(function(el) {
  el.addEventListener('input', update);
});
update();
</script>
</body>
</html>
