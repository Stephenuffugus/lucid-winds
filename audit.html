<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
<title>Lucid Winds — Trait Audit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d100c;color:#e8dcc8;font-family:'Outfit',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;font-size:1.2rem;color:#7ab356;}
  .controls{width:100%;max-width:480px;padding:12px;display:none;flex-direction:column;gap:10px;}
  .row{display:flex;gap:8px;align-items:center;}
  label{font-size:0.75rem;color:#8a9178;min-width:50px;}
  select,input[type="number"]{background:#181c16;color:#e8dcc8;border:1px solid rgba(122,179,86,0.3);border-radius:6px;padding:8px 12px;font-size:0.85rem;flex:1;min-height:48px;}
  select:focus,input:focus{outline:none;border-color:#7ab356;}
  .nav-btns{display:flex;gap:8px;}
  .nav-btns button{flex:1;min-height:48px;background:#181c16;color:#c8a84b;border:1px solid rgba(200,168,75,0.3);border-radius:6px;font-size:1rem;font-family:'Bebas Neue',sans-serif;letter-spacing:0.08em;cursor:pointer;}
  .nav-btns button:active{background:#242a1e;transform:scale(0.97);}
  .render-area{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;padding:16px;}
  .plant-frame{width:320px;height:400px;display:flex;align-items:center;justify-content:center;background:rgba(24,28,22,0.5);border:1px solid rgba(122,179,86,0.15);border-radius:12px;margin-bottom:12px;}
  .plant-frame svg{max-width:280px;max-height:360px;}
  .trait-name{font-family:'Cinzel',serif;font-size:1.1rem;color:#c8a84b;margin-bottom:4px;text-align:center;}
  .tier-badge{font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:0.1em;text-align:center;margin-bottom:8px;}
  .layer-labels{width:100%;max-width:320px;margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .layer-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(122,179,86,0.08);}
  .layer-row .lbl{font-size:0.65rem;color:#8a9178;text-transform:uppercase;letter-spacing:0.06em;}
  .layer-row .val{font-size:0.7rem;color:#e8dcc8;text-align:right;}
  .layer-row.active .lbl{color:#c8a84b;}
  .layer-row.active .val{color:#c8a84b;font-weight:600;}
  .hash-display{font-family:'DM Mono',monospace;font-size:0.45rem;color:#7ab356;opacity:0.5;margin-top:10px;text-align:center;word-break:break-all;max-width:300px;}
  #frame{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Outfit:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="loading" id="loader">Loading renderer...</div>
<div class="controls" id="controls">
  <div class="row">
    <label>Layer</label>
    <select id="layer-select">
      <option value="pot">Pot (shape)</option>
      <option value="potColor">Pot Color</option>
      <option value="stem">Stem (shape)</option>
      <option value="stemColor">Stem Color</option>
      <option value="leafType">Leaf Type</option>
      <option value="leafColor">Leaf Color</option>
      <option value="flower">Flower</option>
      <option value="flowerColor">Flower Color</option>
      <option value="base">Substrate</option>
      <option value="companion">Companion</option>
      <option value="aura">Aura</option>
      <option value="mutation">Mutation</option>
      <option value="season">Season</option>
    </select>
  </div>
  <div class="row">
    <label>Index</label>
    <input type="number" id="idx-input" value="0" min="0">
    <span id="idx-max" style="font-size:0.7rem;color:#8a9178;min-width:60px;"></span>
  </div>
  <div class="nav-btns">
    <button onclick="go(-1)">PREV</button>
    <button onclick="go(1)">NEXT</button>
  </div>
</div>
<div class="render-area" id="render-area" style="display:none;">
  <div id="layer-heading" style="font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.12em;color:#8a9178;text-align:center;margin-bottom:2px;"></div>
  <div class="trait-name" id="trait-name"></div>
  <div class="tier-badge" id="tier-badge"></div>
  <div class="plant-frame" id="plant-frame"></div>
  <div class="layer-labels" id="layer-labels"></div>
  <div class="hash-display" id="hash-display"></div>
</div>
<iframe id="frame" src="index.html?noboot=1"></iframe>
<script>
(function() {
  var frame = document.getElementById('frame');
  var win = null;
  var ready = false;
  var _origHTT = null; // original hashToTraits, saved on load

  var BASE_HASH = 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2';

  frame.onload = function() {
    win = frame.contentWindow;
    var checks = 0;
    var iv = setInterval(function() {
      checks++;
      if (win._generatePlantSVG && win.hashToTraits) {
        clearInterval(iv);
        ready = true;
        _origHTT = win.hashToTraits; // save original
        document.getElementById('loader').style.display = 'none';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('render-area').style.display = 'flex';
        render();
      }
      if (checks > 100) {
        clearInterval(iv);
        document.getElementById('loader').textContent = 'Failed to load renderer. Refresh to retry.';
      }
    }, 200);
  };

  // ── Hash position map ──
  // hb(i) reads chars[i]+chars[i+1] as a byte (0-255)
  // hc(i) reads chars[i] as a nibble (0-15)
  // Many positions OVERLAP — we must set every char explicitly.
  //
  // Char 0,1  → hb(0)  = pot         (% 60)
  // Char 1    → hc(1)  = potColor    (palette key)
  // Char 2,3  → hb(2)  = stem        (% 24)
  // Char 3    → hc(3)  = stemHeight  (22 + val*2.5)
  // Char 4,5  → hb(4)  = leafType
  // Char 5    → hc(5)  = leafCount   (4 + val%5)
  // Char 5,6  → hb(5)  = stemColor   (% 12)
  // Char 6    → hc(6)  = leafSize    (6 + val%5)
  // Char 7    → hc(7)  = leafColor[0]
  // Char 8    → hc(8)  = leafColor[1]
  // Char 9    → hc(9)  = leafColor[2]
  // Char 10   → hc(10) = hasFlower   (>4 = yes)
  // Char 11,12→ hb(11) = flower type
  // Char 12   → hc(12) = flowerColor
  // Char 13   → hc(13) = flowerSize  (4 + val%5)
  // Char 14   → hc(14) = leafSpread  (7 + val%6)
  // Char 15,16→ hb(15) = aura        (% 36)
  // Char 16,17→ hb(16) = mutation
  // Char 18,19→ hb(18) = mythic
  // Char 20,21→ hb(20) = base        (% 60)
  // Char 21,22→ hb(21) = companion   (% 82)
  // Char 22,23→ hb(22) = season      (% 4)

  // Neutral defaults for every char position (0-23, rest padded with 0)
  // These produce: pot 5, potColor sage, stem 0 (Straight), stemHeight 42,
  // leafType mid, leafCount 6, stemColor 0, leafSize 8, colors sage/pine/terra,
  // flower visible, flower 0, flowerColor sage, flowerSize 6, leafSpread 10,
  // aura 0, mutation 0, mythic 0, base 5, companion 31 (no creature), season 0
  // 24 explicit hex chars — every position documented
  // Overlap handling: shared chars get a value that works for both traits
  var NEUTRAL = [
    '0','5', // c0,c1: hb(0)=0x05→pot=5, hc(1)=5→potColor=moss
    '1','8', // c2,c3: hb(2)=0x18=24→stem=24%24=0(Straight), hc(3)=8→stemHeight=42
    '2','1', // c4,c5: hb(4)=0x21→leafType=33, hc(5)=1→leafCount=5
    '0',     // c6:    hc(6)=0→leafSize=6.  (hb(5)=0x10→stemColor=16%12=4)
    '5','3','6', // c7,c8,c9: hc(7-9)→leafColors
    '7',     // c10:   hc(10)=7→hasFlower=true
    '1','5', // c11,c12: hb(11)=0x15→flower=21, hc(12)=5→flowerColor=moss
    '4',     // c13:   hc(13)=4→flowerSize=8
    '5',     // c14:   hc(14)=5→leafSpread=12
    '0','0', // c15,c16: hb(15)=0x00→aura=0.  hb(16) shares c16.
    '0',     // c17:   hb(16)=0x00→mutation=None
    '0','0', // c18,c19: hb(18)=0x00→mythic=None
    '0',     // c20:   hb(20) high nibble → base high
    '5',     // c21:   hb(20)=0x05→base=5. hb(21) high nibble→companion high
    '1',     // c22:   hb(21)=0x51→companion=51%82=51(none). hb(22) high→season high
    '0'      // c23:   hb(22)=0x10→season=16%4=0(Spring)
  ];

  function forceHash(layer, index) {
    // Start with neutral — 64 chars, first 24 explicit, rest '0'
    var c = [];
    for (var i = 0; i < 64; i++) c[i] = i < NEUTRAL.length ? NEUTRAL[i] : '0';

    // Helper: write a 2-char hex byte at char position p
    function wb(p, v) {
      var s = ('0' + (v & 0xFF).toString(16)).slice(-2);
      c[p] = s[0]; c[p+1] = s[1];
    }

    // Apply the audited layer's value
    switch(layer) {
      case 'pot':
        // hb(0) % 60 reads chars 0,1. char 1 = potColor (hc(1)).
        // Write full byte to get the exact pot index, then accept
        // that potColor will change (it's visual-only, not structural).
        wb(0, index % 60);
        break;
      case 'potColor':
        c[1] = (index % 16).toString(16);
        break;
      case 'stem':
        // hb(2) % 24. char 3 = stemHeight.
        // To keep stemHeight stable: fix char 3, vary char 2.
        // hb(2) = char2*16 + char3_val. stemHeight = 22 + char3*2.5
        // With char3 fixed at NEUTRAL[3]='8' (=8): hb(2) = char2*16 + 8
        // stem = (char2*16 + 8) % 24
        // char2=0: 8%24=8, char2=1: 24%24=0, char2=2: 40%24=16, etc.
        // This only gives ~4 values. We need all 24.
        // Better: accept stemHeight changes, write full byte.
        wb(2, index % 24);
        break;
      case 'stemColor':
        // hb(5) % 12 reads chars 5,6.
        // char 5 is shared with leafCount (hc(5)) and leafType low nibble (hb(4)).
        // To isolate: only change char 6, keep char 5 stable.
        // hb(5) = c5*16 + c6. We need hb(5)%12 = index.
        // With c5 fixed at NEUTRAL[5]='4' (=4): hb(5) = 4*16 + c6 = 64+c6
        // stemColor = (64+c6) % 12. c6=0→4, c6=1→5, c6=2→6, ...c6=7→11, c6=8→0
        // That cycles through all 12! Just offset c6.
        // Solve: we need (64 + c6) % 12 = index → c6 = (index - 64%12 + 12) % 12 = (index - 4 + 12) % 12 = (index + 8) % 12
        c[6] = ((index + 8) % 12).toString(16);
        break;
      case 'leafType':
        // hb(4) reads chars 4,5. char 5 shared with leafCount + stemColor.
        // Only vary char 4 (high nibble) to cycle 16 leaf families. Keep char 5 stable.
        c[4] = (index % 16).toString(16);
        break;
      case 'leafColor':
        c[7] = (index % 16).toString(16);
        break;
      case 'flower':
        c[10] = 'f'; // force hasFlower = true
        // hb(11) reads chars 11,12. char 12 = flowerColor.
        // Write full byte — accept flowerColor changes to see all flowers.
        wb(11, index);
        break;
      case 'flowerColor':
        c[10] = 'f'; // force hasFlower = true
        c[12] = (index % 16).toString(16);
        break;
      case 'base':
        // hb(20) % 60. chars 20,21. char 21 also = companion high nibble.
        wb(20, index % 60);
        // Restore companion: chars 21,22 = companion byte
        // char 21 was overwritten — re-neutralize companion
        c[21] = NEUTRAL[21]; c[22] = NEUTRAL[22];
        break;
      case 'companion':
        // hb(21) % 82. chars 21,22. char 21 = base low, char 22 = season high.
        wb(21, index % 82);
        // char 22 was overwritten — restore season
        c[23] = NEUTRAL[23];
        break;
      case 'aura':
        // hb(15) % 36. chars 15,16. char 16 = mutation high nibble.
        wb(15, index % 36);
        c[16] = '0'; c[17] = '0'; // keep mutation = None
        break;
      case 'mutation':
        // hb(16). chars 16,17. char 16 also = aura low nibble.
        wb(16, index);
        // Aura uses hb(15) = chars 15,16. We changed char 16.
        // Accept aura changes when auditing mutation.
        break;
      case 'season':
        // hb(22) % 4. chars 22,23. char 22 = companion low nibble.
        wb(22, index % 4);
        break;
    }

    return c.join('');
  }

  function getMaxIndex(layer) {
    var maxes = {
      pot: 60, potColor: 16, stem: 24, stemColor: 12, leafType: 16,
      leafColor: 16, flower: 256, flowerColor: 16,
      base: 60, companion: 82, aura: 36, mutation: 256, season: 4
    };
    return maxes[layer] || 30;
  }

  // Resolve human-readable name for any trait layer
  function getLayerName(layer, traits) {
    var TB = win.TRAIT_BANK;
    if (!TB) return '?';
    try {
      switch(layer) {
        case 'pot':
          return (TB.pots && TB.pots[traits.pot]) ? (TB.pots[traits.pot].name || 'Pot #' + traits.pot) : 'Pot #' + traits.pot;
        case 'potColor':
          return traits.potColor || '?';
        case 'stem':
          var TB2 = win.TRAIT_BANK;
          return (TB2 && TB2.stems && TB2.stems[traits.stem]) ? (TB2.stems[traits.stem].name || 'Stem #' + traits.stem) : (traits.stemType || 'Stem #' + traits.stem);
        case 'stemColor':
          return 'Color #' + (traits.stemColor || 0);
        case 'leafType':
          return (TB.leaves && TB.leaves[traits.leafType]) ? (TB.leaves[traits.leafType].name || 'Leaf #' + traits.leafType) : 'Leaf #' + traits.leafType;
        case 'leafColor':
          return (traits.leafColors && traits.leafColors[0]) ? traits.leafColors[0] : '?';
        case 'flower':
          if (!traits.hasFlower) return 'None';
          var fi = traits.flower % (TB.flowers ? TB.flowers.length : 46);
          return (TB.flowers && TB.flowers[fi]) ? (TB.flowers[fi].name || 'Flower #' + fi) : 'Flower #' + fi;
        case 'flowerColor':
          return traits.flowerColor || '?';
        case 'base':
          return (TB.substrates && TB.substrates[traits.base]) ? (TB.substrates[traits.base].name || 'Substrate #' + traits.base) : 'Substrate #' + traits.base;
        case 'companion':
          return (TB.companions && TB.companions[traits.companion]) ? (TB.companions[traits.companion].name || 'Companion #' + traits.companion) : 'Companion #' + traits.companion;
        case 'aura':
          return traits.aura === 0 ? 'None' : 'Aura #' + traits.aura;
        case 'mutation':
          return traits.mutationName || 'None';
        case 'season':
          return ['Spring','Summer','Autumn','Winter'][traits.season] || '?';
        default:
          return '?';
      }
    } catch(e) { return '?'; }
  }

  // All visible layers in render order
  var allLayers = ['pot','potColor','stem','stemColor','base','leafType','leafColor','flower','flowerColor','companion','aura','mutation','season'];
  var layerLabels = {
    pot:'Pot', potColor:'Pot Color', stem:'Stem', stemColor:'Stem Color', base:'Substrate',
    leafType:'Leaf', leafColor:'Leaf Color', flower:'Flower', flowerColor:'Flower Color',
    companion:'Companion', aura:'Aura', mutation:'Mutation', season:'Season'
  };

  // Neutral trait values (from NEUTRAL hash)
  var _neutralTraits = null;

  // Overlap pin table: when auditing layer X, pin these traits to neutral
  // to prevent shared hash chars from visually corrupting the audit view.
  var OVERLAP_PINS = {
    pot:         ['potColor'],           // chars 0,1 share char 1 with potColor
    potColor:    ['pot'],                // char 1 is pot low nibble
    stem:        ['stemHeight','leafSize','leafCount'],  // chars 2,3 share; pin leaves small for visibility
    stemColor:   ['leafSize','leafType','leafCount'], // chars 5,6 shared
    leafType:    ['leafCount','stemColor'], // chars 4,5 share char 5
    leafColor:   [],
    flower:      ['flowerColor'],        // chars 11,12 share char 12
    flowerColor: ['flower'],             // char 12 is flower low nibble
    base:        ['companion'],          // chars 20,21 share char 21
    companion:   ['base','season'],      // chars 21,22 shared
    aura:        ['mutationName'],       // chars 15,16 share char 16
    mutation:    ['aura'],               // chars 16,17 share char 16
    season:      ['companion']           // chars 22,23 share char 22
  };

  function render() {
    if (!ready) return;
    var layer = document.getElementById('layer-select').value;
    var idx = parseInt(document.getElementById('idx-input').value) || 0;
    var max = getMaxIndex(layer);
    document.getElementById('idx-max').textContent = '/ ' + (max - 1);

    var hash = forceHash(layer, idx);

    // Compute neutral traits once (from the unmodified NEUTRAL hash)
    if (!_neutralTraits) {
      var nh = [];
      for (var ni = 0; ni < 64; ni++) nh[ni] = ni < NEUTRAL.length ? NEUTRAL[ni] : '0';
      _neutralTraits = _origHTT(nh.join(''));
    }

    // Install trait-pinning wrapper so _generatePlantSVG sees corrected traits
    var pins = OVERLAP_PINS[layer] || [];
    if (pins.length > 0) {
      win.hashToTraits = function(h) {
        var t = _origHTT(h);
        for (var pi = 0; pi < pins.length; pi++) {
          var k = pins[pi];
          if (_neutralTraits.hasOwnProperty(k)) t[k] = _neutralTraits[k];
        }
        return t;
      };
    } else {
      win.hashToTraits = _origHTT;
    }

    var traits, tg, svg;
    try {
      traits = win.hashToTraits(hash);
      tg = win.getTerraGrade(traits);
      svg = win._generatePlantSVG(hash, 280);
    } catch(e) {
      document.getElementById('plant-frame').innerHTML = '<div style="color:#c44;font-size:0.8rem;">Render error: ' + e.message + '</div>';
      win.hashToTraits = _origHTT; // restore on error
      return;
    }
    // Restore original after render
    win.hashToTraits = _origHTT;

    document.getElementById('plant-frame').innerHTML = svg;
    document.getElementById('layer-heading').textContent = (layerLabels[layer] || layer).toUpperCase() + '  #' + idx;
    document.getElementById('trait-name').textContent = getLayerName(layer, traits);
    document.getElementById('tier-badge').innerHTML = tg ? '<span style="color:' + tg.color + ';">' + tg.icon + ' ' + tg.name + '</span>' : '';
    document.getElementById('hash-display').textContent = hash;

    // Build all-layer label list
    var labelsHtml = '';
    for (var i = 0; i < allLayers.length; i++) {
      var k = allLayers[i];
      var isActive = (k === layer);
      var name = getLayerName(k, traits);
      labelsHtml += '<div class="layer-row' + (isActive ? ' active' : '') + '">';
      labelsHtml += '<span class="lbl">' + layerLabels[k] + '</span>';
      labelsHtml += '<span class="val">' + name + '</span>';
      labelsHtml += '</div>';
    }
    document.getElementById('layer-labels').innerHTML = labelsHtml;
  }

  window.go = function(dir) {
    var input = document.getElementById('idx-input');
    var layer = document.getElementById('layer-select').value;
    var max = getMaxIndex(layer);
    var val = (parseInt(input.value) || 0) + dir;
    if (val < 0) val = max - 1;
    if (val >= max) val = 0;
    input.value = val;
    render();
  };

  document.getElementById('layer-select').addEventListener('change', function() {
    document.getElementById('idx-input').value = 0;
    render();
  });
  document.getElementById('idx-input').addEventListener('change', render);
  document.getElementById('idx-input').addEventListener('input', render);
})();
</script>
</body>
</html>
