<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucid Winds — Leaf &amp; Stem Audit Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Courier New', monospace;
  background: #0d100c;
  color: #e8dcc8;
  min-height: 100vh;
  padding: 12px;
  padding-bottom: 140px;
}
.bg-white { background: #f5f5f5; }
.bg-gray { background: #444; }
.bg-dark { background: #0d100c; }

h1 { font-size: 18px; color: #c8a84b; margin-bottom: 8px; text-align: center; }
.controls {
  position: sticky; top: 0; z-index: 100;
  background: #1a1d18; border-bottom: 1px solid #333;
  padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.controls label { font-size: 11px; color: #8a9178; display: flex; flex-direction: column; gap: 2px; }
.controls select, .controls input[type=range], .controls button {
  background: #2a2d28; color: #e8dcc8; border: 1px solid #444;
  padding: 4px 6px; font-size: 12px; border-radius: 3px;
  font-family: inherit;
}
.controls button { cursor: pointer; padding: 6px 12px; }
.controls button:hover { background: #3a3d38; }
.controls button.active { background: #7ab356; color: #0d100c; }
.mode-tabs { display: flex; gap: 4px; }
.mode-tabs button { font-size: 11px; padding: 4px 8px; }

.grid {
  display: grid;
  gap: 8px;
  padding: 8px 0;
}
.grid-12 { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.grid-60 { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }

.cell {
  border: 1px solid #333;
  border-radius: 4px;
  padding: 4px;
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: border-color 0.2s;
}
.cell:hover { border-color: #7ab356; }
.cell.flagged { border-color: #ff4444; border-width: 2px; }
.cell.ok-marked { border-color: #7ab356; border-width: 2px; }
.cell .plant-svg { display: flex; justify-content: center; align-items: center; min-height: 120px; }
.cell .label { font-size: 10px; color: #8a9178; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .label b { color: #c8a84b; }

.cell-actions {
  display: flex; gap: 4px; justify-content: center; margin-top: 4px;
}
.cell-actions button {
  font-size: 10px; padding: 2px 8px; border: 1px solid #555;
  border-radius: 2px; cursor: pointer; font-family: inherit;
}
.btn-ok { background: #2a4a2a; color: #7ab356; }
.btn-ok:hover { background: #3a5a3a; }
.btn-flag { background: #4a2a2a; color: #ff6666; }
.btn-flag:hover { background: #5a3a3a; }

#flagged-list {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1a1d18; border-top: 1px solid #c8a84b;
  padding: 8px 12px; font-size: 11px; z-index: 200;
  display: none; max-height: 120px; overflow-y: auto;
}
#flagged-list.visible { display: block; }
#flagged-list .header { color: #c8a84b; font-weight: bold; margin-bottom: 4px; }
#flagged-list .items { color: #ff6666; }
#flagged-list button { background: #2a2d28; color: #e8dcc8; border: 1px solid #444; padding: 2px 8px; cursor: pointer; font-family: inherit; font-size: 10px; margin-left: 8px; }

.loading { text-align: center; padding: 40px; color: #8a9178; font-size: 14px; }

#game-frame { display: none; width: 0; height: 0; border: none; }

.slider-val { font-size: 10px; color: #c8a84b; min-width: 20px; text-align: center; }
</style>
</head>
<body>
<h1>LEAF &amp; STEM AUDIT TOOL</h1>

<div class="controls">
  <div class="mode-tabs">
    <button id="btn-grid" class="active" onclick="setMode('grid')">All 60 Leaves</button>
    <button id="btn-single" onclick="setMode('single')">Single Leaf Focus</button>
    <button id="btn-zoom" onclick="setMode('zoom')">Connection Closeup</button>
    <button id="btn-perleaf" onclick="setMode('perleaf')">Per-Leaf Index</button>
    <button id="btn-stems" onclick="setMode('stems')">All 24 Stems</button>
    <button id="btn-blooms" onclick="setMode('blooms')">All Blooms</button>
  </div>

  <label>Leaf Type
    <select id="sel-leaf" onchange="renderCurrent()"></select>
  </label>

  <label>Stem Shape
    <select id="sel-stem" onchange="renderCurrent()"></select>
  </label>

  <label>Leaf Size <span class="slider-val" id="val-size">7</span>
    <input type="range" id="sl-size" min="4" max="10" value="7" oninput="document.getElementById('val-size').textContent=this.value">
  </label>

  <label>Leaf Count <span class="slider-val" id="val-count">5</span>
    <input type="range" id="sl-count" min="2" max="8" value="5" oninput="document.getElementById('val-count').textContent=this.value">
  </label>

  <label>
    <span>Show Flower</span>
    <input type="checkbox" id="chk-flower" onchange="renderCurrent()">
  </label>

  <label>Flower Type
    <select id="sel-flower" onchange="document.getElementById('chk-flower').checked=true;renderCurrent()"></select>
  </label>

  <label>Background
    <select id="sel-bg" onchange="document.getElementById('render-area').className=this.value">
      <option value="bg-dark">Dark</option>
      <option value="bg-gray">Gray</option>
      <option value="bg-white">White</option>
    </select>
  </label>

  <button onclick="renderCurrent()">Render</button>
</div>

<div id="render-area" class="bg-dark">
  <div class="loading" id="loading-msg">Loading game renderer... <br>(iframe must load index.html)</div>
  <div id="grid-container" class="grid" style="display:none;"></div>
</div>

<div id="flagged-list">
  <span class="header">Flagged:</span>
  <span class="items" id="flagged-items">None</span>
  <button onclick="copyFlagged()">Copy to Clipboard</button>
  <button onclick="clearFlagged()">Clear All</button>
</div>

<iframe id="game-frame" src="index.html"></iframe>

<script>
// ES5 compatible
var LEAF_NAMES = [
  'Organic Broad','Willow','Asymmetric Lobed','Heart','Spear','Monstera','Fern','Maple',
  'Money Plant','Needle Cluster','Monstera+','Fern+','Succulent Rosette','Coral','Cactus Pad','Holly',
  'Berries','Filange','Serrated Fern','Fiddle Leaf','Palmate Fan','Needle Cluster 2','Elephant Ear','Sword Fern',
  'Clover Trefoil','Banana Leaf','Silver Dollar','Arrow Leaf','Lacecap','Curled Scroll','Feather Frond','Drip Leaf',
  'Ribbon','Snapdragon','Moth Wing','Prism Shard','Batwing Ivy','Thorn Crescent','Bell Petiole','Ghost Willow',
  'Crown Laurel','Coilspring','Kraken Frond','Lantern Pod','Coral Antler','Oracle Eye','Spiral Shell','Dagger Ivy',
  'Veil Fern','Jellyleaf','Watcher Frond','Stamen Burst','Compound Pinnate','Tendril Coil','Lily Pad','Scale Leaf',
  'Grass Blade','Venus Trap','Strap Leaf','Lace Fern'
];

var STEM_NAMES = [
  'Straight','Curve L','Curve R','S-Curve','Trunk','Braided','Zigzag','Double',
  'Cactus','Coral','Succulent','Twisted Vine','Ancient Bark','Bamboo','Hollow Trunk',
  'Vine Twist','Leaning','Kinked','Forking Y','Thin Wire','Root Pillar','Mushroom Stipe',
  'Crystal Spine','Iron Trunk'
];

var FLOWER_NAMES = [
  'Bud','Rose','Hibiscus','Lotus','Dahlia','Tulip','Spike','Mandala',
  'Bud Variant','Spike Variant','Orchid','Rose+','Carnivorous Flytrap','Pitcher Plant',
  'Cattails','Bell Flowers','Fiddlehead Fern','Chrysanthemum','Moon Orchid','Poppy',
  'Dandelion Puff','Bird of Paradise','Fire Flower','Protea','Morning Glory',
  'Sunflower','Coneflower','Snapdragon','Cherry Blossom','Stamen Cluster',
  'Trumpet Vine','Bleeding Heart','Umbel','Catkin','Sacred Lotus',
  'Dragon Arum','Titan Arum','Carrion Starfish','Passionflower','Crown Imperial',
  'Corpse Lily','Foxglove','Magnolia','Wisteria Cascade','Cactus Bloom',
  'Ghost Orchid','Peony','Lantern Bloom'
];

var STEM_COLORS = 12;
var flagged = {};
var gameWin = null;
var currentMode = 'grid';

// Populate dropdowns
(function() {
  var selLeaf = document.getElementById('sel-leaf');
  for (var i = 0; i < 60; i++) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + ': ' + (LEAF_NAMES[i] || 'Case ' + i);
    selLeaf.appendChild(opt);
  }
  var selStem = document.getElementById('sel-stem');
  for (var j = 0; j < 24; j++) {
    var opt2 = document.createElement('option');
    opt2.value = j;
    opt2.textContent = j + ': ' + (STEM_NAMES[j] || 'Case ' + j);
    selStem.appendChild(opt2);
  }
  var selFlower = document.getElementById('sel-flower');
  for (var k = 0; k < FLOWER_NAMES.length; k++) {
    var opt3 = document.createElement('option');
    opt3.value = k;
    opt3.textContent = k + ': ' + FLOWER_NAMES[k];
    selFlower.appendChild(opt3);
  }
})();

// Wait for iframe
var _retryCount = 0;
function tryConnect() {
  try {
    gameWin = document.getElementById('game-frame').contentWindow;
    if (gameWin && gameWin._generateAuditPlantSVG) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('grid-container').style.display = 'grid';
      renderCurrent();
      return;
    }
  } catch(e) { /* cross-origin or not ready */ }
  _retryCount++;
  if (_retryCount < 20) {
    setTimeout(tryConnect, 500);
  } else {
    document.getElementById('loading-msg').textContent = 'ERROR: Could not access game renderer after 10s. Check that index.html loads.';
  }
}
document.getElementById('game-frame').onload = function() { tryConnect(); };
setTimeout(tryConnect, 1000); // fallback

function setMode(mode) {
  currentMode = mode;
  var btns = document.querySelectorAll('.mode-tabs button');
  for (var i = 0; i < btns.length; i++) btns[i].className = '';
  document.getElementById('btn-' + mode).className = 'active';
  renderCurrent();
}

function getOverrides(leafType, stemType, stemColorIdx) {
  return {
    leafType: leafType,
    stem: stemType,
    stemColor: stemColorIdx || 0,
    pot: 0,
    hasFlower: document.getElementById('chk-flower').checked,
    flower: parseInt(document.getElementById('sel-flower').value),
    companion: 60,
    aura: 0,
    mutation: 0,
    leafCount: parseInt(document.getElementById('sl-count').value),
    leafSize: parseInt(document.getElementById('sl-size').value),
    stemHeight: 40,
    leafSpread: 10,
    leafColors: ['sage', 'teal', 'moss'],
    base: 0
  };
}

function renderPlant(overrides, size, zoom) {
  if (!gameWin || !gameWin._generateAuditPlantSVG) return '<div style="color:red">No renderer</div>';
  try {
    var svg = gameWin._generateAuditPlantSVG(overrides, size);
    if (zoom) {
      svg = svg.replace('viewBox="0 0 70 95"', 'viewBox="10 20 50 58"');
    }
    return svg;
  } catch(e) {
    return '<div style="color:red;font-size:10px">' + e.message + '</div>';
  }
}

function renderCurrent() {
  var container = document.getElementById('grid-container');
  container.innerHTML = '';
  if (!gameWin || !gameWin._generateAuditPlantSVG) return;

  if (currentMode === 'grid') renderGridMode(container);
  else if (currentMode === 'single') renderSingleMode(container);
  else if (currentMode === 'zoom') renderZoomMode(container);
  else if (currentMode === 'perleaf') renderPerLeafMode(container);
  else if (currentMode === 'stems') renderStemsMode(container);
  else if (currentMode === 'blooms') renderBloomsMode(container);

  updateFlaggedDisplay();
}

function renderGridMode(container) {
  container.className = 'grid grid-60';
  var stemType = parseInt(document.getElementById('sel-stem').value);
  for (var i = 0; i < 60; i++) {
    var overrides = getOverrides(i, stemType, 0);
    var html = renderPlant(overrides, 100, false);
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged['leaf-' + i] ? ' flagged' : '');
    cell.setAttribute('data-leaf', i);
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label"><b>' + i + '</b>: ' + (LEAF_NAMES[i] || 'Case ' + i) + '</div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'leaf-' + i + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'leaf-' + i + '\',this)">FLAG</button>'
      + '</div>';
    (function(idx) {
      cell.querySelector('.plant-svg').onclick = function() {
        document.getElementById('sel-leaf').value = idx;
        setMode('single');
      };
    })(i);
    container.appendChild(cell);
  }
}

function renderSingleMode(container) {
  container.className = 'grid grid-12';
  var leafType = parseInt(document.getElementById('sel-leaf').value);
  var stemType = parseInt(document.getElementById('sel-stem').value);
  for (var sc = 0; sc < STEM_COLORS; sc++) {
    var overrides = getOverrides(leafType, stemType, sc);
    var html = renderPlant(overrides, 160, false);
    var key = 'leaf-' + leafType + '-sc-' + sc;
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged[key] ? ' flagged' : '');
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label">Stem Color <b>' + sc + '</b></div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'' + key + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'' + key + '\',this)">FLAG</button>'
      + '</div>';
    container.appendChild(cell);
  }
}

function renderZoomMode(container) {
  container.className = 'grid grid-12';
  var leafType = parseInt(document.getElementById('sel-leaf').value);
  var stemType = parseInt(document.getElementById('sel-stem').value);
  for (var sc = 0; sc < STEM_COLORS; sc++) {
    var overrides = getOverrides(leafType, stemType, sc);
    var html = renderPlant(overrides, 280, true);
    var key = 'zoom-' + leafType + '-sc-' + sc;
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged[key] ? ' flagged' : '');
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label">Closeup — Color <b>' + sc + '</b></div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'' + key + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'' + key + '\',this)">FLAG</button>'
      + '</div>';
    container.appendChild(cell);
  }
}

function renderPerLeafMode(container) {
  container.className = 'grid grid-12';
  var leafType = parseInt(document.getElementById('sel-leaf').value);
  var stemType = parseInt(document.getElementById('sel-stem').value);
  var leafCount = parseInt(document.getElementById('sl-count').value);
  // First cell: all leaves (no solo) for reference
  var refOverrides = getOverrides(leafType, stemType, 0);
  var refHtml = renderPlant(refOverrides, 180, false);
  var refCell = document.createElement('div');
  refCell.className = 'cell';
  refCell.innerHTML = '<div class="plant-svg">' + refHtml + '</div>'
    + '<div class="label"><b>ALL</b> — ' + (LEAF_NAMES[leafType] || 'Case ' + leafType) + ' (' + leafCount + ' leaves)</div>';
  container.appendChild(refCell);
  // One cell per leaf index
  for (var li = 0; li < leafCount; li++) {
    var overrides = getOverrides(leafType, stemType, 0);
    overrides.soloLeafIdx = li;
    var html = renderPlant(overrides, 180, false);
    var key = 'perleaf-' + leafType + '-i' + li;
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged[key] ? ' flagged' : '');
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label">Leaf <b>#' + li + '</b></div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'' + key + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'' + key + '\',this)">FLAG</button>'
      + '</div>';
    container.appendChild(cell);
  }
}

function renderStemsMode(container) {
  container.className = 'grid grid-60';
  var leafType = parseInt(document.getElementById('sel-leaf').value);
  for (var st = 0; st < 24; st++) {
    var overrides = getOverrides(leafType, st, 0);
    var html = renderPlant(overrides, 120, false);
    var key = 'stem-' + st;
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged[key] ? ' flagged' : '');
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label"><b>' + st + '</b>: ' + (STEM_NAMES[st] || 'Case ' + st) + '</div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'' + key + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'' + key + '\',this)">FLAG</button>'
      + '</div>';
    container.appendChild(cell);
  }
}

function renderBloomsMode(container) {
  container.className = 'grid grid-60';
  var stemType = parseInt(document.getElementById('sel-stem').value);
  var leafType = parseInt(document.getElementById('sel-leaf').value);
  for (var fl = 0; fl < FLOWER_NAMES.length; fl++) {
    var overrides = getOverrides(leafType, stemType, 0);
    overrides.hasFlower = true;
    overrides.flower = fl;
    var html = renderPlant(overrides, 120, false);
    var key = 'bloom-' + fl;
    var cell = document.createElement('div');
    cell.className = 'cell' + (flagged[key] ? ' flagged' : '');
    cell.innerHTML = '<div class="plant-svg">' + html + '</div>'
      + '<div class="label"><b>' + fl + '</b>: ' + (FLOWER_NAMES[fl] || 'Case ' + fl) + '</div>'
      + '<div class="cell-actions">'
      + '<button class="btn-ok" onclick="markOk(\'' + key + '\',this)">OK</button>'
      + '<button class="btn-flag" onclick="markFlag(\'' + key + '\',this)">FLAG</button>'
      + '</div>';
    (function(idx) {
      cell.querySelector('.plant-svg').onclick = function() {
        document.getElementById('sel-flower').value = idx;
        document.getElementById('chk-flower').checked = true;
        setMode('single');
      };
    })(fl);
    container.appendChild(cell);
  }
}

function markOk(key, btn) {
  delete flagged[key];
  var cell = btn.closest('.cell');
  cell.className = 'cell ok-marked';
  updateFlaggedDisplay();
}

function markFlag(key, btn) {
  flagged[key] = true;
  var cell = btn.closest('.cell');
  cell.className = 'cell flagged';
  updateFlaggedDisplay();
}

function updateFlaggedDisplay() {
  var keys = Object.keys(flagged);
  var el = document.getElementById('flagged-list');
  var items = document.getElementById('flagged-items');
  if (keys.length > 0) {
    el.className = 'visible';
    items.textContent = keys.join(', ');
  } else {
    el.className = '';
    items.textContent = 'None';
  }
}

function copyFlagged() {
  var keys = Object.keys(flagged);
  var text = 'FLAGGED ITEMS (' + keys.length + '):\n' + keys.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  alert('Copied ' + keys.length + ' flagged items to clipboard');
}

function clearFlagged() {
  flagged = {};
  updateFlaggedDisplay();
  renderCurrent();
}
</script>
</body>
</html>
