<title>WINDUP</title>
<style>
:root{
  --velvet:#2A1D16; --velvet-lo:#1C130E; --walnut:#5A3A22; --walnut-lo:#3E2716;
  --brass:#C9A227; --brass-lo:#8E6F16; --paper:#F2E7CE; --ink:#2B1F14;
  --cream:#EFE3C8; --muted:#A2907A; --line:rgba(43,31,20,.28);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --safeR:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--velvet-lo);
  color:var(--cream);font-family:ui-rounded,'Avenir Next',system-ui,-apple-system,sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#chrome{position:absolute;top:calc(8px + var(--safeT));left:8px;right:8px;z-index:5;
  display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#chrome > *{pointer-events:auto}
.btn{min-height:48px;min-width:48px;border:2px solid var(--brass-lo);border-radius:12px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:.92rem;font-weight:700;
  letter-spacing:.04em;padding:10px 16px;box-shadow:0 2px 0 var(--brass-lo)}
.btn.big{min-height:56px;font-size:1rem}
.btn.go{background:var(--brass);border-color:#6F5610;box-shadow:0 2px 0 #6F5610;color:#2B1F14}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--muted);color:var(--cream)}
.btn.icon{padding:0;width:48px;font-size:1.15rem}
.btn[disabled]{opacity:.45}
#nameChip{flex:0 1 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spacer{flex:1 1 auto}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + var(--safeT));
  z-index:6;background:rgba(28,19,14,.86);color:var(--cream);border:1px solid var(--brass-lo);
  padding:10px 16px;border-radius:12px;font-size:.86rem;text-align:center;max-width:80%;
  opacity:0;transition:opacity 220ms ease-out;pointer-events:none}
#hint.on{opacity:1}
.screen{position:absolute;inset:0;z-index:8;background:var(--velvet);display:none;
  overflow-y:auto;padding:calc(16px + var(--safeT)) 16px calc(20px + var(--safeB))}
.screen.on{display:block}
.screen .col{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  align-items:stretch}
.title{font-size:1.6rem;font-weight:800;letter-spacing:.1em;text-align:center;color:var(--brass)}
.lede{font-size:.92rem;line-height:1.5;color:var(--cream);text-align:center;margin:0}
.tiny{font-size:.76rem;color:var(--muted);text-align:center;margin:2px 0}
.cap{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  margin:6px 0 0}
.row{display:flex;gap:8px}
.row .btn{flex:1 1 0}
input[type=text],textarea{width:100%;min-height:48px;border:2px solid var(--brass-lo);
  border-radius:12px;background:var(--paper);color:var(--ink);font-family:inherit;
  font-size:1rem;padding:10px 12px}
textarea{min-height:76px;resize:none}
#punchBar{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(28,19,14,.94);
  border-top:2px solid var(--brass-lo);padding:8px 10px calc(10px + var(--safeB));
  display:none;gap:8px}
#punchBar.on{display:flex}
#punchBar .btn{flex:1 1 0;padding:10px 6px;font-size:.84rem}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.82rem;
  z-index:40;opacity:0;pointer-events:none;transition:opacity 170ms ease-out;max-width:84%;
  text-align:center}
#toast.on{opacity:1}
body.listing #toast{top:calc(72px + var(--safeT));bottom:auto}
#testPanel{position:fixed;left:0;bottom:0;z-index:60;display:none}
/* ⛔ THE BOTTOM LEFT 120 BY 120 IS THE FLEET'S MUSIC CHIP. Centred, PUNCH's left
   edge lands at 95 px on a 320 wide phone and sits in the corner the chip owns.
   It stays bottom centre everywhere it fits and moves to the right hand corner
   on the narrowest screens, which is still nowhere near the chip. */
@media (max-width:360px){
  #btnPunch{left:auto !important;right:14px;transform:none !important}
}

<div id="wrap">
  <canvas id="stage"></canvas>

  <div id="chrome">
    <button class="btn" id="nameChip">Twinkle Twinkle</button>
    <div id="spacer"></div>
    <button class="btn icon" id="btnMenu" aria-label="Menu">&#9776;</button>
  </div>
  <div id="hint"></div>

  <button class="btn big go" id="btnPunch" style="position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safeB));z-index:6">PUNCH</button>

  <div id="punchBar">
    <button class="btn" id="btnPlay">PLAY</button>
    <button class="btn" id="btnDice">DICE</button>
    <button class="btn" id="btnClear">CLEAR</button>
    <button class="btn go" id="btnPunchDone">DONE</button>
  </div>

  <div class="screen" id="scrMenu">
    <div class="col">
      <div class="title">WINDUP</div>
      <p class="lede">Punch a song. Crank it. Give it away.</p>
      <button class="btn" id="btnShelf">THE SHELF</button>
      <button class="btn" id="btnGive">GIVE IT AWAY</button>
      <button class="btn" id="btnExport">EXPORT</button>
      <button class="btn" id="btnSound">SOUND ON</button>
      <button class="btn" id="btnMotion">MOTION ON</button>
      <button class="btn" id="btnSwing">SWING ON</button>
      <p class="tiny">Sky Wolf Studio</p>
      <button class="btn ghost" id="btnMenuClose">CLOSE</button>
    </div>
  </div>

  <div class="screen" id="scrShelf">
    <div class="col">
      <div class="title" style="font-size:1.3rem">The shelf</div>
      <div id="shelfList"></div>
      <button class="btn ghost" id="btnShelfBack">BACK</button>
    </div>
  </div>

  <div class="screen" id="scrGive">
    <div class="col">
      <div class="title" style="font-size:1.3rem">Give it away</div>
      <p class="cap">The song</p>
      <input type="text" id="giveName" maxlength="40" placeholder="Twinkle Twinkle">
      <p class="cap">A line for them</p>
      <textarea id="giveNote" maxlength="90" placeholder="Happy birthday, from me"></textarea>
      <p class="cap">The wrapping</p>
      <div class="row" id="wrapRow">
        <button class="btn" data-wrap="birthday">Birthday</button>
        <button class="btn" data-wrap="snowfall">Snowfall</button>
        <button class="btn" data-wrap="nightsky">Night Sky</button>
      </div>
      <p class="cap">Punched by</p>
      <input type="text" id="giveBy" maxlength="24" placeholder="your name">
      <button class="btn big go" id="btnShare">SHARE THE LINK</button>
      <button class="btn ghost" id="btnGiveBack">BACK</button>
    </div>
  </div>

  <div class="screen" id="scrExport">
    <div class="col">
      <div class="title" style="font-size:1.3rem">Export</div>
      <button class="btn big" id="btnExpAudio">AUDIO</button>
      <button class="btn big" id="btnExpImage">STRIP IMAGE</button>
      <button class="btn big" id="btnExpPdf">PRINTABLE STRIP</button>
      <p class="tiny">The printable strip is beta. Measure one against a real strip before you cut.</p>
      <button class="btn ghost" id="btnExportBack">BACK</button>
    </div>
  </div>

  <div class="screen" id="scrGift">
    <div class="col">
      <div class="title" style="font-size:1.3rem">For you</div>
      <p class="lede" id="giftFrom"></p>
      <p class="lede" id="giftNote"></p>
      <button class="btn big go" id="btnGiftSave">SAVE TO MY SHELF</button>
      <button class="btn" id="btnGiftOwn">MAKE YOUR OWN</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="testPanel"></div>
</div>
<script>
'use strict';
// ---- SIM_EXPORT_START ----
/* ============================ 1. CONFIG ============================ */
/* ⛔ FROZEN. A number that sounds wrong changes here and is logged in
   docs/DECISIONS.md; the structure does not change. */
var CONFIG = Object.freeze({
  GAME_ID: 'windup', SAVE_KEY: 'lw_windup_v1', SAVE_V: 1,
  /* the real fifteen note diatonic box, low at the bottom of the strip as on
     the paper: C4 up to C6 */
  ROWS: 15,
  ROW_MIDI: Object.freeze([60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81, 83, 84]),
  ROW_NAME: Object.freeze(['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'A', 'B', 'C']),
  /* ⛔ THE RETRIGGER RULE. A real tine is still moving: two holes in one row
     closer than this are refused, and eight millimetres of paper is two eighths
     at the default spacing. */
  MIN_GAP_STEPS: 2,
  STRIP_MIN_STEPS: 32, STRIP_MAX_STEPS: 512, TAIL_STEPS: 8,
  SWING: 0.12,
  /* the printable strip, in millimetres. MM_PER_STEP is the one Stephen checks
     against a real Kikkerland strip before the PDF leaves beta. */
  MM_PER_STEP: 4, PAPER_MM: 41, ROW_PITCH_MM: 2, HOLE_MM: 2.4, MARGIN_MM: 6.5,
  /* the crank */
  CRANK_R_PX: 140, CRANK_DEAD_PX: 20, MM_PER_RAD: 6, RIBBON_PULL_PX: 60,
  AUTO_BPM: 96,
  /* the voice */
  TINE_DECAY_LOW_S: 1.8, TINE_DECAY_HIGH_S: 0.8,
  DETUNE_CENTS: 3, LEVEL_JITTER_DB: 1,
  VOICES_MAX: 24, MASTER: 0.85, WET: 0.18,
  PARTIAL_A: 4.2, PARTIAL_B: 6.3, PARTIAL_A_GAIN: 0.18, PARTIAL_B_GAIN: 0.07,
  SHIMMER: 12, SHIMMER_GAIN: 0.03, SHIMMER_S: 0.3,
  CLICK_MS: 3, CLICK_HP_HZ: 4000
});

/* ============================ 2. RNG ============================ */
/* mulberry32: small, fast, and the same on every phone, which is what a gift
   link needs. */
function makeRNG(seed) {
  var a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(s) {
  var h = 2166136261, i;
  s = String(s);
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mixSeed(a, b) {
  var h = (a ^ Math.imul(b >>> 0, 2654435761)) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 1274126177) >>> 0; h ^= h >>> 16;
  return h >>> 0;
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* ============================ 3. STRIP ============================ */
/* A strip is a name, a signature and a sorted list of [step, row]. Nothing
   else: the notes come from the rows and the timing comes from the crank. */
function newStrip(over) {
  var s = { v: 1, name: 'Untitled', by: '', holes: [], wrap: 'birthday', dedication: '' }, k;
  if (over) for (k in over) s[k] = over[k];
  s.holes = sortHoles((s.holes || []).map(function (h) { return [h[0] | 0, h[1] | 0]; }));
  return s;
}
function sortHoles(holes) {
  return holes.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
}
function holesAt(strip, row) {
  var out = [], i;
  for (i = 0; i < strip.holes.length; i++) if (strip.holes[i][1] === row) out.push(strip.holes[i]);
  return out;
}
function holeIndex(strip, step, row) {
  var i;
  for (i = 0; i < strip.holes.length; i++) {
    if (strip.holes[i][0] === step && strip.holes[i][1] === row) return i;
  }
  return -1;
}

/* ============================ 4. RULES ============================ */
/* ⛔ THE REFUSAL IS PER ROW, NOT PER STRIP. A beginner's first bar is all one
   row and a whole strip rule would refuse the second note they ever punch. */
function canPunch(strip, step, row) {
  if (!(step >= 0) || step > CONFIG.STRIP_MAX_STEPS) return false;
  if (!(row >= 0) || row >= CONFIG.ROWS) return false;
  var i;
  for (i = 0; i < strip.holes.length; i++) {
    var h = strip.holes[i];
    if (h[1] !== row) continue;
    if (Math.abs(h[0] - step) < CONFIG.MIN_GAP_STEPS) return false;
  }
  return true;
}
function punch(strip, step, row) {
  if (!canPunch(strip, step, row)) return false;
  strip.holes.push([step | 0, row | 0]);
  strip.holes = sortHoles(strip.holes);
  return true;
}
function unpunch(strip, step, row) {
  var i = holeIndex(strip, step, row);
  if (i < 0) return false;
  strip.holes.splice(i, 1);
  return true;
}
/* the paper runs on past the last hole so the tines can ring out */
function stripLength(strip) {
  var last = 0, i;
  for (i = 0; i < strip.holes.length; i++) if (strip.holes[i][0] > last) last = strip.holes[i][0];
  return clamp(last + CONFIG.TAIL_STEPS, CONFIG.STRIP_MIN_STEPS, CONFIG.STRIP_MAX_STEPS);
}

/* ---- the link. step u16, row u8, base64url, under a kilobyte for 300 holes ---- */
var B64U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function bytesToB64u(b) {
  var out = '', i;
  for (i = 0; i < b.length; i += 3) {
    var n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
    out += B64U[(n >> 18) & 63] + B64U[(n >> 12) & 63];
    if (i + 1 < b.length) out += B64U[(n >> 6) & 63];
    if (i + 2 < b.length) out += B64U[n & 63];
  }
  return out;
}
function b64uToBytes(s) {
  var out = [], i, n, c = 0, bits = 0;
  for (i = 0; i < s.length; i++) {
    var v = B64U.indexOf(s.charAt(i));
    if (v < 0) continue;
    c = (c << 6) | v; bits += 6;
    if (bits >= 8) { bits -= 8; out.push((c >> bits) & 255); }
  }
  return out;
}
/* ⛔ DELTA AND ROW IN ONE BYTE. The plan asked for step u16 plus row u8 and for
   three hundred holes to fit in a kilobyte, and those two cannot both be true:
   three bytes a hole is 900 bytes of payload and base64 makes that 1204
   characters. Holes are sorted, so what a link actually needs is the GAP since
   the last one, and a gap of fourteen eighths or less and a row on a fifteen
   tine comb both fit in a nibble. Three hundred holes now cost about four
   hundred characters. The high nibble 15 escapes to a two byte gap for a rest
   longer than fourteen eighths, and the low nibble can never be 15 because the
   comb stops at row 14. */
function packStrip(strip) {
  var b = [], i, prev = 0;
  b.push(1);
  b.push(strip.holes.length & 255, (strip.holes.length >> 8) & 255);
  for (i = 0; i < strip.holes.length; i++) {
    var st = clamp(strip.holes[i][0] | 0, 0, CONFIG.STRIP_MAX_STEPS);
    var rw = clamp(strip.holes[i][1] | 0, 0, CONFIG.ROWS - 1);
    var d = st - prev;
    prev = st;
    if (d >= 0 && d <= 14) b.push((d << 4) | rw);
    else {
      if (d < 0) d = 0;
      b.push(0xF0 | rw, d & 255, (d >> 8) & 255);
    }
  }
  return bytesToB64u(b);
}
function unpackStrip(txt) {
  var b = b64uToBytes(String(txt || ''));
  if (b.length < 3 || b[0] !== 1) return null;
  var n = b[1] | (b[2] << 8), holes = [], at = 3, step = 0, i;
  if (n < 0 || n > 4096) return null;
  for (i = 0; i < n; i++) {
    if (at >= b.length) break;
    var byte = b[at++], rw = byte & 15, d = byte >> 4;
    if (d === 15) {
      if (at + 1 >= b.length) break;
      d = b[at] | (b[at + 1] << 8);
      at += 2;
    }
    step += d;
    /* ⛔ a gift link is data from a stranger: every step and row is clamped
       before anything is drawn or sounded with it. */
    holes.push([clamp(step, 0, CONFIG.STRIP_MAX_STEPS), clamp(rw, 0, CONFIG.ROWS - 1)]);
    step = clamp(step, 0, CONFIG.STRIP_MAX_STEPS);
  }
  return sortHoles(holes);
}

/* ---- the gift. A link carries the strip, who it is from, what it says and
   which paper it is wrapped in. UTF-8 is encoded by hand so that the rules stay
   free of the browser and the whole thing can be round tripped headless. ---- */
var WRAPS = Object.freeze(['birthday', 'snowfall', 'nightsky']);
function utf8Bytes(str) {
  var out = [], i, c;
  str = String(str === undefined || str === null ? '' : str);
  for (i = 0; i < str.length; i++) {
    c = str.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length) {
      var lo = str.charCodeAt(++i);
      var cp = 0x10000 + ((c - 0xD800) << 10) + (lo - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    } else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}
function utf8Str(b, from, len) {
  var out = '', i = from, end = Math.min(b.length, from + len);
  while (i < end) {
    var c = b[i++];
    if (c < 0x80) out += String.fromCharCode(c);
    else if (c < 0xE0) out += String.fromCharCode(((c & 31) << 6) | (b[i++] & 63));
    else if (c < 0xF0) out += String.fromCharCode(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
    else {
      var cp = ((c & 7) << 18) | ((b[i++] & 63) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63);
      cp -= 0x10000;
      out += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 1023));
    }
  }
  return out;
}
function putText(bytes, str, cap) {
  var t = utf8Bytes(str).slice(0, cap);
  bytes.push(t.length);
  var i;
  for (i = 0; i < t.length; i++) bytes.push(t[i]);
}
function packGift(strip) {
  var b = [2];
  var w = WRAPS.indexOf(strip.wrap);
  b.push(w < 0 ? 0 : w);
  putText(b, strip.name, 60);
  putText(b, strip.by, 40);
  putText(b, strip.dedication, 140);
  var body = b64uToBytes(packStrip(strip)), i;
  for (i = 0; i < body.length; i++) b.push(body[i]);
  return bytesToB64u(b);
}
function unpackGift(txt) {
  var b = b64uToBytes(String(txt || ''));
  if (b.length < 6 || b[0] !== 2) return null;
  var at = 1;
  var wrap = WRAPS[b[at++]] || WRAPS[0];
  function take(cap) {
    if (at >= b.length) return '';
    var n = Math.min(b[at++], cap);
    var t = utf8Str(b, at, n);
    at += n;
    return t;
  }
  var name = take(60), by = take(40), ded = take(140);
  var holes = unpackStrip(bytesToB64u(b.slice(at)));
  if (!holes) return null;
  /* ⛔ EVERY FIELD OF THIS CAME FROM A STRANGER. The holes are clamped by
     unpackStrip; the text is cut to length here and escaped where it is drawn. */
  return newStrip({ name: name || 'A song', by: by, dedication: ded, wrap: wrap, holes: holes });
}

/* ============================ 5. SEED ============================ */
/* Four bars over I vi IV V in C, one note a beat on a chord tone and a passing
   tone on some of the off beats. Rows 3 to 12, so it sits in the middle of the
   comb where the box sounds best, and it can never break the retrigger rule
   because it checks. */
var CHORDS = Object.freeze([
  Object.freeze([4, 7, 9, 11]),      /* I   G4 C5 E5 G5 */
  Object.freeze([5, 7, 9, 12]),      /* vi  A4 C5 E5 A5 */
  Object.freeze([3, 5, 7, 10, 12]),  /* IV  F4 A4 C5 F5 A5 */
  Object.freeze([4, 6, 8, 11])       /* V   G4 B4 D5 G5 */
]);
var SEED_LO = 3, SEED_HI = 12;
function nearestIn(list, want, r) {
  var best = list[0], bd = 1e9, i;
  for (i = 0; i < list.length; i++) {
    var d = Math.abs(list[i] - want) + (r ? r() * 1.4 : 0);
    if (d < bd) { bd = d; best = list[i]; }
  }
  return best;
}
function seedMelody(seed) {
  var r = makeRNG(seed >>> 0);
  var strip = newStrip({ name: 'A little one', holes: [] });
  var prev = 7, bar, beat;
  for (bar = 0; bar < 4; bar++) {
    var chord = CHORDS[bar];
    for (beat = 0; beat < 4; beat++) {
      var step = bar * 8 + beat * 2;
      var row = nearestIn(chord, prev + Math.round((r() - 0.5) * 4), r);
      row = clamp(row, SEED_LO, SEED_HI);
      if (!punch(strip, step, row)) {
        /* the rule refused it, so take the nearest chord tone that is free */
        var k;
        for (k = 0; k < chord.length; k++) {
          if (punch(strip, step, clamp(chord[k], SEED_LO, SEED_HI))) { row = chord[k]; break; }
        }
      }
      prev = row;
      /* a passing tone on about half the off beats, between this note and the
         next scale step, never in a row that would be refused */
      if (r() < 0.5) {
        var dir = r() < 0.5 ? 1 : -1;
        var pass = clamp(row + dir, SEED_LO, SEED_HI);
        if (pass !== row) punch(strip, step + 1, pass);
      }
    }
  }
  return strip;
}

/* ---- the three that come in the box ---- */
var STARTERS = Object.freeze({

/* ============================ 6. THE TINE, IN NUMBERS ============================ */
/* Everything the voice needs that is not a Web Audio node lives here, so the
   headless suite can check the shape of a note without a browser. */
function noteHz(row) {
  var midi = CONFIG.ROW_MIDI[clamp(row | 0, 0, CONFIG.ROWS - 1)];
  return 440 * Math.pow(2, (midi - 69) / 12);
}
/* ⛔ a short tine rings for less time. The low end of the comb is a long bar
   and the high end is a stub, so the decay runs from LOW at row 0 to HIGH at
   row 14, linear in row. */
function decayFor(row) {
  var t = clamp(row | 0, 0, CONFIG.ROWS - 1) / (CONFIG.ROWS - 1);
  return CONFIG.TINE_DECAY_LOW_S + (CONFIG.TINE_DECAY_HIGH_S - CONFIG.TINE_DECAY_LOW_S) * t;
}
/* ⛔ keyed by the HOLE INDEX, not by a running counter: a gift has to sound the
   same on the recipient's phone as it did on the sender's, and it will only do
   that if the jitter is a function of the strip rather than of the session. */
function jitterFor(index) {
  var r = makeRNG(mixSeed(0x57494E44, (index | 0) + 1));
  return {
    cents: (r() * 2 - 1) * CONFIG.DETUNE_CENTS,
    db: (r() * 2 - 1) * CONFIG.LEVEL_JITTER_DB
  };
}
/* ⛔ THE DECAY IS THE TIME TO A TENTH, and it has to be said out loud because
   the obvious reading is wrong. Ramped straight from its peak to the floor over
   `seconds`, a note is at eight tenths of one percent of its loudest by the
   time a second has passed: on paper it decays over 1.8 seconds and to an ear
   it is a click. A tine falls twenty decibels in `seconds` and carries on down
   the same slope, which is what leaves it still ringing, quietly, a second
   later. ENV_TAIL is how far that slope has to run to reach the floor. */
var ENV_TAIL = 3.5;
function envSeconds(seconds) { return Math.max(0.02, seconds) * ENV_TAIL; }
function dbToGain(db) { return Math.pow(10, db / 20); }
/* ⛔ AUTO_BPM IS IN QUARTER NOTES, and a step is an EIGHTH. Read as eighths a
   minute it makes every note of Twinkle a second and a quarter long, which is
   not a music box, it is a doorbell winding down. */
function stepSeconds() { return 60 / CONFIG.AUTO_BPM / 2; }
/* where the read line is, in steps, for a strip that has been advanced this far
   in millimetres. The crank and the auto play both come through here so there
   is one answer to where the paper is. */
/* ⛔ THE PAPER STARTS IN THE MARGIN, AND THE MARGIN IS PART OF THE MAPPING.
   The read line begins where the box grips the strip, which is MARGIN_MM of
   blank paper BEFORE the first hole. Two bugs live here and both were found by
   the gift gate. Start the line at exactly step zero and a hole at step zero is
   never crossed, so the first note of every song a player punches is silent.
   Start the LINE in the margin but leave this function measuring from zero and
   the line leaps the whole margin on the first frame, so the first note plays
   the instant a strip is loaded, before anybody has touched the crank. */
function leadSteps() { return CONFIG.MARGIN_MM / CONFIG.MM_PER_STEP; }
function stepAt(advanceMm) { return advanceMm / CONFIG.MM_PER_STEP - leadSteps(); }
function mmForSteps(steps) { return steps * CONFIG.MM_PER_STEP; }

/* ============================ 15. TEST ============================ */
/* The assertion harness. Shape copied from satellites/airworthy. Every
   assertion here has been watched to fail; the ones that took work are named in
   the plan's evidence ledger. */
var TEST = {
  results: [],
  assert: function (name, ok, detail) {
    this.results.push({ name: name, ok: !!ok, detail: detail || '' });
    return !!ok;
  },
  eq: function (name, got, want) {
    var ok = got === want;
    return this.assert(name, ok, ok ? '' : 'expected ' + want + ', got ' + got);
  },
  near: function (name, got, want, tol) {
    var ok = Math.abs(got - want) <= tol;
    return this.assert(name, ok, ok ? '' : 'expected ' + want + ' plus or minus ' + tol + ', got ' + got);
  },
  report: function () {
    var passed = 0, failed = 0, fails = [], i;
    for (i = 0; i < this.results.length; i++) {
      if (this.results[i].ok) passed++; else { failed++; fails.push(this.results[i]); }
    }
    return { passed: passed, failed: failed, total: this.results.length, failures: fails };
  },
  runSuite: function (n, fn, a) {
    try { fn(this, a); } catch (e) { this.assert('the ' + n + ' suite ran to the end', false, String(e && e.message || e)); }
  },
  run: function (extra) {
    this.results = [];
    this.runSuite('comb', suiteComb);
    this.runSuite('rules', suiteRules);
    this.runSuite('strip', suiteStrip);
    this.runSuite('link', suiteLink);
    this.runSuite('starters', suiteStarters);
    this.runSuite('seed', suiteSeed);
    this.runSuite('gift', suiteGift);
    this.runSuite('tine', suiteTine);
    if (extra && extra.src) this.runSuite('purity', suitePurity, extra.src);
    return this.report();
  }
};

function suiteComb(T) {
  T.eq('the comb has fifteen tines', CONFIG.ROWS, 15);
  T.eq('and fifteen notes for them', CONFIG.ROW_MIDI.length, 15);
  T.eq('and fifteen letters', CONFIG.ROW_NAME.length, 15);
  T.eq('it starts at C4', CONFIG.ROW_MIDI[0], 60);
  T.eq('and ends two octaves up', CONFIG.ROW_MIDI[14], 84);
  var i, rising = true, diatonic = true;
  for (i = 1; i < CONFIG.ROW_MIDI.length; i++) {
    if (CONFIG.ROW_MIDI[i] <= CONFIG.ROW_MIDI[i - 1]) rising = false;
    var d = CONFIG.ROW_MIDI[i] - CONFIG.ROW_MIDI[i - 1];
    if (d !== 1 && d !== 2) diatonic = false;
  }
  T.assert('every row is higher than the one below it', rising);
  T.assert('and every step is a tone or a semitone, which is what diatonic means', diatonic);
  T.near('row 0 is middle C at 261.6 Hz (' + noteHz(0).toFixed(1) + ')', noteHz(0), 261.63, 0.1);
  T.near('row 7 is the C above it (' + noteHz(7).toFixed(1) + ')', noteHz(7), 523.25, 0.1);
  T.near('and row 7 is exactly twice row 0', noteHz(7) / noteHz(0), 2, 0.001);
  T.near('row 14 is twice row 7', noteHz(14) / noteHz(7), 2, 0.001);
  /* ⛔ a row off the end of the comb must not make a note off the end of the
     world: the gift link is data from a stranger. */
  T.eq('a row below the comb is pulled onto it', noteHz(-4), noteHz(0));
  T.eq('and a row above it too', noteHz(99), noteHz(14));
}

function suiteRules(T) {
  var s = newStrip({});
  T.assert('an empty strip takes a hole anywhere', canPunch(s, 10, 5));
  punch(s, 10, 5);
  T.eq('and then it has one', s.holes.length, 1);
  /* ⛔ THE RETRIGGER RULE, which is the whole reason a music box strip is not a
     piano roll: the tine is still singing. */
  T.assert('a hole in the same row one step away is refused', !canPunch(s, 11, 5));
  T.assert('and one step the other way too', !canPunch(s, 9, 5));
  T.assert('the same hole twice is refused', !canPunch(s, 10, 5));
  T.assert('two steps away is fine', canPunch(s, 12, 5));
  T.assert('and two steps the other way', canPunch(s, 8, 5));
  /* ⛔ PER ROW, NOT PER STRIP. A beginner's first bar is all one row, and a
     whole strip rule would refuse the second note they ever punched. */
  T.assert('a hole one step away in ANOTHER row is fine', canPunch(s, 11, 6));
  T.assert('and right underneath it', canPunch(s, 10, 6));
  T.assert('a row off the comb is refused', !canPunch(s, 20, 15));
  T.assert('and a negative one', !canPunch(s, 20, -1));
  T.assert('and a step past the end of the paper', !canPunch(s, CONFIG.STRIP_MAX_STEPS + 1, 3));
  T.assert('a punch that breaks the rule changes nothing',
    !punch(s, 11, 5) && s.holes.length === 1);
  T.assert('unpunching a hole that is there works', unpunch(s, 10, 5));
  T.eq('and the strip is empty again', s.holes.length, 0);
  T.assert('unpunching one that is not there does nothing', !unpunch(s, 10, 5));
  T.assert('and now the row is free again', canPunch(s, 10, 5) && canPunch(s, 11, 5));
}

function suiteStrip(T) {
  var s = newStrip({});
  punch(s, 30, 2); punch(s, 4, 9); punch(s, 12, 0); punch(s, 4, 1);
  var sorted = true, i;
  for (i = 1; i < s.holes.length; i++) {
    if (s.holes[i][0] < s.holes[i - 1][0]) sorted = false;
    if (s.holes[i][0] === s.holes[i - 1][0] && s.holes[i][1] < s.holes[i - 1][1]) sorted = false;
  }

  T.eq('a row can be read off on its own', holesAt(s, 2).length, 1);
  T.eq('and an empty one is empty', holesAt(s, 7).length, 0);
  /* the paper runs on past the last hole so the tines can ring out */
  var short2 = newStrip({});
  punch(short2, 2, 3);

    stripLength(short2), CONFIG.STRIP_MIN_STEPS);

function suiteLink(T) {

    }
    var txt = packStrip(s), back = unpackStrip(txt);

    if (txt.length > worst) worst = txt.length;
  }

  T.assert('three hundred holes fit under a kilobyte (' + packStrip(big).length + ')',

function suiteSeed(T) {
  var n, bad = 0, low = 999, high = 0, outOfRange = 0, dull = 0;
  for (n = 0; n < 500; n++) {
    var m = seedMelody(n), fresh = newStrip({}), k, rows = {};
    for (k = 0; k < m.holes.length; k++) {
      var h = m.holes[k];
      if (h[1] < SEED_LO || h[1] > SEED_HI) outOfRange++;
      if (!punch(fresh, h[0], h[1])) bad++;
      rows[h[1]] = 1;
    }
    if (Object.keys(rows).length < 3) dull++;
    if (m.holes.length < low) low = m.holes.length;
    if (m.holes.length > high) high = m.holes.length;
  }
  T.eq('five hundred rolls of the dice are all punchable', bad, 0);
  T.eq('and all of them sit in the middle of the comb', outOfRange, 0);
  T.assert('and none of them is one note over and over (' + dull + ')', dull === 0);
  T.assert('a rolled melody is between sixteen and thirty two holes (' + low + ' to ' + high + ')',
    low >= 16 && high <= 32);
  var a = seedMelody(77), b = seedMelody(77);
  T.eq('the same roll gives the same melody', JSON.stringify(a.holes), JSON.stringify(b.holes));
  var c = seedMelody(78);
  T.assert('and a different roll gives a different one',

function suiteTine(T) {
  T.near('a tine falls to a tenth in the time the config names, and the tail is'
    + ' three and a half times that', envSeconds(1), ENV_TAIL, 1e-9);
  T.assert('a low tine rings longer than a high one ('
    + decayFor(0).toFixed(2) + ' s against ' + decayFor(14).toFixed(2) + ' s)',
    decayFor(0) > decayFor(14));
  var i, falling = true;
  for (i = 1; i < CONFIG.ROWS; i++) if (decayFor(i) > decayFor(i - 1)) falling = false;
  T.assert('and every tine up the comb rings a little less than the one below it', falling);
  T.near('the bottom of the comb is configured long decay', decayFor(0), CONFIG.TINE_DECAY_LOW_S, 1e-9);
  T.near('and the top is the short one', decayFor(14), CONFIG.TINE_DECAY_HIGH_S, 1e-9);
  /* ⛔ KEYED BY THE HOLE, NOT BY THE SESSION. A gift has to sound the same on
     the recipient's phone, and it only will if the jitter is a function of the
     strip. */
  var j1 = jitterFor(12), j2 = jitterFor(12);
  T.eq('the same hole is detuned the same way twice', j1.cents, j2.cents);
  T.eq('and levelled the same way', j1.db, j2.db);
  T.assert('a different hole is not', jitterFor(13).cents !== j1.cents);
  var worstC = 0, worstD = 0, k;
  for (k = 0; k < 400; k++) {
    var j = jitterFor(k);
    if (Math.abs(j.cents) > worstC) worstC = Math.abs(j.cents);
    if (Math.abs(j.db) > worstD) worstD = Math.abs(j.db);
  }
  T.assert('no hole is detuned further than the config allows (' + worstC.toFixed(2) + ' cents)',
    worstC <= CONFIG.DETUNE_CENTS + 1e-9);
  T.assert('and none is louder than it allows (' + worstD.toFixed(2) + ' dB)',
    worstD <= CONFIG.LEVEL_JITTER_DB + 1e-9);
  T.near('a decibel of level is about twelve percent of gain', dbToGain(1), 1.122, 0.001);
  T.near('and nothing is unity by accident', dbToGain(0), 1, 1e-9);
  /* ⛔ the tempo, asserted, because the config says 96 and a step is an EIGHTH */
  T.near('an eighth at the auto tempo is a third of a second ('
    + stepSeconds().toFixed(3) + ')', stepSeconds(), 0.3125, 1e-9);
  T.near('so a bar of four beats is two and a half seconds', stepSeconds() * 8, 2.5, 1e-9);
  T.near('the paper moves four millimetres a step', mmForSteps(1), CONFIG.MM_PER_STEP, 1e-9);
  T.near('and the read line and the paper agree once the margin has gone by',
    stepAt(mmForSteps(37 + leadSteps())), 37, 1e-9);
  T.assert('and it starts in the margin, before the first hole ('
    + leadSteps().toFixed(2) + ' eighths of blank paper)', leadSteps() > 0.5);
  T.near('a strip that has not been cranked has not reached its first hole',
    stepAt(0), -leadSteps(), 1e-9);
  T.assert('and the very first hole is still ahead of it', stepAt(0) < 0);
  /* one turn of the crank, in steps, is what makes the gesture feel right */
  T.near('one whole turn of the crank is nine and a bit steps ('
    + (2 * Math.PI * CONFIG.MM_PER_RAD / CONFIG.MM_PER_STEP).toFixed(2) + ')',
    2 * Math.PI * CONFIG.MM_PER_RAD / CONFIG.MM_PER_STEP, 9.42, 0.01);
}

/* ⛔ the SIM layer is the rules, and the rules may not know what a browser is.
   This reads the shipped text of the block, not the objects it made. */
function suitePurity(T, src) {
  var code = String(src).replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/^[ \t]*\/\/.*$/gm, ' ');
  T.assert('the rules have no document', code.indexOf('document.') < 0);
  T.assert('and no window', code.indexOf('window.') < 0);
  T.assert('and no clock', code.indexOf('Date.now') < 0 && code.indexOf('new Date') < 0);
  T.assert('and no unseeded die', code.indexOf('Math.random') < 0);
  T.assert('and no audio node', code.indexOf('createOscillator') < 0 && code.indexOf('AudioContext') < 0);
  T.assert('and the block is really in the shipped file (' + code.length + ' characters)',
    code.length > 6000);
  T.assert('and it still has the maths it is allowed', code.indexOf('Math.pow') >= 0);
}

/* ============================ 16. VOICE ============================ */
/* ⛔ THE ENGINE IS BOUND TO A CONTEXT, NOT TO THE PAGE. Every node in here is
   built on whatever context it is handed, which is the only reason
   test/tine.mjs can render a note into an OfflineAudioContext and measure it.
   An engine that reaches for a global context cannot be measured at all. */
function makeImpulse(ctx, seconds, curve) {
  var n = Math.max(1, Math.round(ctx.sampleRate * seconds));
  var buf = ctx.createBuffer(2, n, ctx.sampleRate), ch, i;
  /* seeded, so the plate is the same room on every phone */
  var r = makeRNG(0x504C4154);
  for (ch = 0; ch < 2; ch++) {
    var d = buf.getChannelData(ch);
    for (i = 0; i < n; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / n, curve);
  }
  return buf;
}
/* tanh, scaled so the loudest thing that can ever leave is 0.95 */
var _softCurve = null;
function softCurve() {
  if (_softCurve) return _softCurve;
  var n = 2048, c = new Float32Array(n), i;

  ctx.lineWidth = 2;
  ctx.stroke();
  /* the arm and its knob */
  var r = 46;
  var kx = h.x + Math.cos(a) * r, ky = h.y + Math.sin(a) * r;
  ctx.strokeStyle = '#C9A227';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(h.x, h.y);
  ctx.lineTo(kx, ky);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,190,.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(h.x, h.y - 3);
  ctx.lineTo(kx, ky - 3);
  ctx.stroke();
  var kg = ctx.createRadialGradient(kx - 5, ky - 6, 1, kx, ky, 16);
  kg.addColorStop(0, '#FFF4CE');
  kg.addColorStop(1, '#8E6F16');
  ctx.fillStyle = kg;
  ctx.beginPath();
  ctx.arc(kx, ky, 15, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,26,8,.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (G.cranking) {
    ctx.strokeStyle = 'rgba(201,162,39,.20)';
    ctx.lineWidth = 2;
    ctx.beginPath();

}
function drawScene(ctx) {

  drawCloth(ctx);
  drawPaper(ctx);
  drawBox(ctx);
  drawComb(ctx);
  drawCrank(ctx);
}

/* ============================ 18. THE CRANK ============================ */
/* ⛔ THE STRIP IS THE CLOCK. The read line moves only when this turns. Nothing
   in the player asks what time it is. */
function angleTo(x, y) {
  var h = LAY.hub;
  return Math.atan2(y - h.y, x - h.x);
}
function crankStart(x, y) {
  var h = LAY.hub, dx = x - h.x, dy = y - h.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d > h.r) return false;
  /* ⛔ a sample within the dead zone of the hub has an angle that jumps by half
     a turn when the finger crosses the centre; those samples are ignored. */
  G.cranking = true;
  G.crankPrev = d < CONFIG.CRANK_DEAD_PX ? null : angleTo(x, y);
  G.crankSpeed = 0;
  return true;
}
function crankMove(x, y, dtMs) {
  if (!G.cranking) return 0;
  var h = LAY.hub, dx = x - h.x, dy = y - h.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < CONFIG.CRANK_DEAD_PX) { G.crankPrev = null; return 0; }
  var a = angleTo(x, y);
  if (G.crankPrev === null) { G.crankPrev = a; return 0; }
  /* the unwrap, from Ripcord: the delta, not the absolute angle */
  var delta = a - G.crankPrev;
  while (delta > Math.PI) delta -= 2 * Math.PI;
  while (delta < -Math.PI) delta += 2 * Math.PI;
  G.crankPrev = a;
  G.crankAngle += delta;
  G.turned += delta;
  var mm = delta * CONFIG.MM_PER_RAD;
  G.advanceMm += mm;
  if (G.advanceMm < 0) G.advanceMm = 0;
  var rate = dtMs > 0 ? Math.abs(delta) / (dtMs / 1000) : 0;
  G.crankSpeed = G.crankSpeed + (rate - G.crankSpeed) * Math.min(1, dtMs / 120);
  /* one buzz a turn, where the phone has one */
  var turns = Math.floor(Math.abs(G.turned) / (2 * Math.PI));
  if (turns !== G.lastTurn) {
    G.lastTurn = turns;
    if (SETTINGS.motion) { try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) {} }
  }
  return delta;
}
function crankEnd() {
  G.cranking = false;
  G.crankPrev = null;
  G.crankSpeed = 0;
  bedLevel(0);
}

/* ============================ 19. THE PLAYER ============================ */
/* Fires a tine when the read line CROSSES a hole going forward. Backwards
   rewinds the paper and plays nothing, because a music box has one direction. */
function playerTick(dtMs) {
  var A = G.audio;
  var pos = stepAt(G.advanceMm);
  var from = G.readAt;
  G.readAt = pos;
  if (pos <= from) return;                    /* rewinding, or standing still */
  var strip = G.strip, i, fired = 0;
  var span = pos - from;
  for (i = 0; i < strip.holes.length; i++) {
    var st = strip.holes[i][0];
    if (st <= from || st > pos) continue;
    /* ⛔ AT THE CROSSING, not on the next frame. The fraction of this frame at
       which the line passed the hole is what keeps two holes an eighth apart
       sounding an eighth apart even at four frames a second. */
    var frac = span > 0 ? (st - from) / span : 0;
    G.lastFired.push({ step: st, row: strip.holes[i][1], at: G.readAt });
    if (G.lastFired.length > 64) G.lastFired.shift();
    flick(strip.holes[i][1]);
    if (A) tine(A, strip.holes[i][1], A.ctx.currentTime + frac * (dtMs / 1000), i);
    fired++;
  }
  return fired;
}
function flick(row) {
  G.flick[row] = 1;
}
function flickDecay(dtMs) {
  var i;
  for (i = 0; i < CONFIG.ROWS; i++) {
    if (G.flick[i] > 0) {
      G.flick[i] -= dtMs / 260;
      if (G.flick[i] < 0) G.flick[i] = 0;
    }
  }
}

/* ============================ 20. THE MECHANISM ============================ */
/* The bed under the notes: the paper dragging and the spring turning. It stops
   when the crank stops WHILE THE TINES RING ON, which is the sound of a real
   box and the whole reason the bed is a separate voice. */
function bed(A) {
  if (!A || A.bed) return A ? A.bed : null;
  var ctx = A.ctx;
  var n = Math.max(1, Math.round(ctx.sampleRate * 2));
  var buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0), i;
  var r = makeRNG(0x42454421);
  for (i = 0; i < n; i++) d[i] = r() * 2 - 1;
  var src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  var bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
  var g = ctx.createGain();
  g.gain.value = 0;
  src.connect(bp); bp.connect(g); g.connect(A.master);
  src.start();
  A.bed = { src: src, bp: bp, g: g };
  return A.bed;
}
function bedLevel(speed) {
  var A = G.audio;
  if (!A || !A.ctx) return;
  var b = bed(A);
  if (!b) return;
  var t = A.ctx.currentTime;
  b.g.gain.setTargetAtTime(clamp(speed, 0, 8) / 8 * 0.05, t, 0.08);
  b.bp.frequency.setTargetAtTime(600 + clamp(speed, 0, 8) * 90, t, 0.1);
}
/* a tick every fifteen degrees of crank, which is the pin wheel turning */
function bedTicks(delta) {
  var A = G.audio;
  if (!A || !delta) return;
  G.tickAcc += Math.abs(delta);
  var per = 15 * Math.PI / 180;
  while (G.tickAcc >= per) {
    G.tickAcc -= per;
    var t = A.ctx.currentTime + 0.002;
    var o = A.ctx.createBufferSource();
    o.buffer = clickBuffer(A);
    var hp = A.ctx.createBiquadFilter();
    hp.type = 'bandpass'; hp.frequency.value = 2200; hp.Q.value = 1.2;
    var g = A.ctx.createGain();
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(hp); hp.connect(g); g.connect(A.master);
    o.start(t);
  }
}

/* ============================ 21. THE PUNCH ============================ */
/* The strip, flat on the table, big enough to put a finger on. Rows lettered
   down the left, the red margin at the start where the paper is gripped, and a
   playhead you can drag. */
var PUN = { on: false, scroll: 0, drag: null, refused: null, refusedAt: 0, play: 0, playing: false };
function punchLayout() {
  var W = V.W, H = V.H;
  var barH = 62;
  var left = 34;
  var top = Math.max(58, V.H * 0.12);
  var bottom = H - barH - 10;
  var h = bottom - top;
  var rowH = h / CONFIG.ROWS;
  return { x: left, y: top, w: W - left - 8, h: h, rowH: rowH,
    stepPx: Math.max(22, Math.min(40, (W - left - 8) / 12)) };
}
function punchRowAt(y) {
  var P = punchLayout();
  var r = Math.floor((P.y + P.h - y) / P.rowH);
  return clamp(r, 0, CONFIG.ROWS - 1);
}
function punchStepAt(x) {
  var P = punchLayout();
  return Math.round((x - P.x) / P.stepPx + PUN.scroll);
}
function punchX(step) {
  var P = punchLayout();
  return P.x + (step - PUN.scroll) * P.stepPx;
}
function punchY(row) {
  var P = punchLayout();
  return P.y + P.h - (row + 0.5) * P.rowH;
}
function drawPunch(ctx) {
  var P = punchLayout(), strip = G.strip, i;
  ctx.fillStyle = '#241812';
  ctx.fillRect(0, 0, V.W, V.H);
  /* the paper */
  var pg = ctx.createLinearGradient(0, P.y, 0, P.y + P.h);
  pg.addColorStop(0, '#F6EDD8');
  pg.addColorStop(1, '#E7DABB');
  ctx.fillStyle = pg;
  ctx.fillRect(P.x, P.y, P.w, P.h);
  /* the rows, lettered, with the octaves picked out */
  ctx.font = '600 11px ui-rounded, system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (i = 0; i < CONFIG.ROWS; i++) {
    var y = punchY(i);
    ctx.strokeStyle = (i % 7 === 0) ? 'rgba(90,58,34,.40)' : 'rgba(90,58,34,.16)';
    ctx.lineWidth = (i % 7 === 0) ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(P.x, y);
    ctx.lineTo(P.x + P.w, y);
    ctx.stroke();
    ctx.fillStyle = (i % 7 === 0) ? '#C9A227' : 'rgba(201,162,39,.6)';
    ctx.fillText(CONFIG.ROW_NAME[i], P.x - 6, y);
  }
  /* the beats, and a heavier line every bar */
  var first = Math.floor(PUN.scroll), last = first + Math.ceil(P.w / P.stepPx) + 1;
  for (i = first; i <= last; i++) {
    if (i < 0) continue;
    var x = punchX(i);
    if (x < P.x - 2 || x > P.x + P.w) continue;
    var bar = i % 8 === 0;
    ctx.strokeStyle = bar ? 'rgba(90,58,34,.38)' : 'rgba(90,58,34,.12)';
    ctx.lineWidth = bar ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(x, P.y);
    ctx.lineTo(x, P.y + P.h);
    ctx.stroke();
  }
  /* ⛔ the red margin: the first steps are where the box grips the paper and no
     hole may go there on a real strip. */
  var mx = punchX(0);
  if (mx > P.x - 40) {
    ctx.fillStyle = 'rgba(180,60,40,.14)';
    ctx.fillRect(Math.max(P.x, mx - P.stepPx * 1.5), P.y, Math.min(P.stepPx * 1.5, mx - P.x + P.stepPx * 1.5), P.h);
    ctx.strokeStyle = 'rgba(180,60,40,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(mx, P.y);
    ctx.lineTo(mx, P.y + P.h);
    ctx.stroke();
  }
  /* the holes */
  var hr = Math.max(4, Math.min(9, P.rowH * 0.33));
  for (i = 0; i < strip.holes.length; i++) {
    var h = strip.holes[i];
    var hx = punchX(h[0]);
    if (hx < P.x - 12 || hx > P.x + P.w + 12) continue;
    var hy = punchY(h[1]);
    ctx.fillStyle = '#241812';
    ctx.beginPath();
    ctx.arc(hx, hy, hr, 0, 6.2832);
    ctx.fill();
    if (G.flick[h[1]] > 0.02 && Math.abs(h[0] - PUN.play) < 0.6) {
      ctx.strokeStyle = '#C9A227';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(hx, hy, hr + 4, 0, 6.2832);
      ctx.stroke();
    }
  }
  /* the one that was refused, and why */
  if (PUN.refused && V.t - PUN.refusedAt < 1100) {
    var rx = punchX(PUN.refused[0]), ry = punchY(PUN.refused[1]);
    ctx.strokeStyle = 'rgba(200,64,42,.95)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(rx, ry, hr + 5, 0, 6.2832);
    ctx.stroke();
  }
  /* the playhead */
  var px2 = punchX(PUN.play);
  ctx.strokeStyle = 'rgba(201,162,39,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px2, P.y - 6);
  ctx.lineTo(px2, P.y + P.h + 6);
  ctx.stroke();
  ctx.fillStyle = 'rgba(201,162,39,.9)';
  ctx.beginPath();
  ctx.moveTo(px2 - 6, P.y - 6);
  ctx.lineTo(px2 + 6, P.y - 6);
  ctx.lineTo(px2, P.y + 2);
  ctx.closePath();
  ctx.fill();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}
function punchTap(x, y) {
  var P = punchLayout();
  if (y < P.y || y > P.y + P.h || x < P.x) return;
  var step = punchStepAt(x), row = punchRowAt(y);
  if (step < 0) return;
  if (unpunch(G.strip, step, row)) {
    PUN.refused = null;
    haptic(6);
    return;
  }
  if (punch(G.strip, step, row)) {
    PUN.refused = null;
    PUN.play = step;
    /* the ghost playhead plinks the hole as it is placed, which is the whole
       reason punching is fun */
    var A = resumeAudio();
    if (A) tine(A, row, A.ctx.currentTime + 0.005, step);
    flick(row);
    haptic(8);
    saveNow();
  } else {
    PUN.refused = [step, row];
    PUN.refusedAt = V.t;
    toast('The tine is still singing.');
    haptic(18);
  }
}
function punchOpen() {
  PUN.on = true;
  PUN.scroll = 0;
  PUN.play = 0;
  el('punchBar').classList.add('on');
  el('btnPunch').hidden = true;
  el('nameChip').hidden = false;
  G.screen = 'punch';
}
function punchClose() {
  PUN.on = false;
  PUN.playing = false;
  el('punchBar').classList.remove('on');
  el('btnPunch').hidden = false;
  G.screen = 'box';
  saveNow();
}
/* auto play, the only thing in the game that runs on a clock, and it never runs
   while a finger is on the crank */
function punchPlayTick(dtMs) {
  if (!PUN.playing) return;
  var A = G.audio;
  var per = stepSeconds();
  var from = PUN.play;
  PUN.play += (dtMs / 1000) / per;
  var strip = G.strip, i, span = PUN.play - from;
  for (i = 0; i < strip.holes.length; i++) {
    var st = strip.holes[i][0];
    if (st <= from || st > PUN.play) continue;
    var frac = span > 0 ? (st - from) / span : 0;
    flick(strip.holes[i][1]);
    if (A) tine(A, strip.holes[i][1], A.ctx.currentTime + frac * (dtMs / 1000), i);
  }
  /* keep the playhead on screen */
  var P = punchLayout(), vis = P.w / P.stepPx;
  if (PUN.play > PUN.scroll + vis * 0.7) PUN.scroll = PUN.play - vis * 0.7;
  if (PUN.play > stripLength(strip)) { PUN.playing = false; PUN.play = 0; PUN.scroll = 0; }
}

function frame(ts) {
  RAF = 0;
  if (document.hidden) return;
  var dt = LAST ? Math.min(120, ts - LAST) : 16;
  LAST = ts; V.t = ts; FRAMES++;
  flickDecay(dt);
  if (GIFT.on) {
    playerTick(dt);
    drawWrapped(V.ctx);
    if (GIFT.opened >= 1) { drawScene(V.ctx); }
  } else if (PUN.on) {
    punchPlayTick(dt);
    layout();
    drawPunch(V.ctx);
  } else {
    playerTick(dt);
    drawScene(V.ctx);
  }
  RAF = requestAnimationFrame(frame);
}
function haptic(ms) {
  if (!SETTINGS.motion) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}
function hint(msg) {
  var h = el('hint');
  h.textContent = msg;
  h.classList.add('on');
  clearTimeout(hint._h);
  hint._h = setTimeout(function () { h.classList.remove('on'); }, 3200);
}
function kick() { if (!RAF && !document.hidden) RAF = requestAnimationFrame(frame); }

/* ---- audio, opened inside a gesture and never before ---- */
function audio() {
  if (G.audio) return G.audio;
  if (!SETTINGS.sound) return null;
  var C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;

}

}
function toast(msg) {

/* ============================ 23. THE SHELF ============================ */
/* The three that come in the box are put on the shelf the first time the game

  var k, order = ['twinkle', 'birthday', 'lullaby'];
  SAVE.shelf = [];
  for (k = 0; k < order.length; k++) {
    var st = newStrip(STARTERS[order[k]]);

  }
  saveNow();
}
function shelfPut(strip) {
  var i;

    if (SAVE.shelf[i].name === strip.name && !SAVE.shelf[i].starter) {
      SAVE.shelf[i] = { name: strip.name, holes: strip.holes.slice(), by: strip.by || SAVE.by || '', made: 1 };
      saveNow();
      return;
    }
  }
  SAVE.shelf.unshift({ name: strip.name, holes: strip.holes.slice(),
    by: strip.by || SAVE.by || '', made: 1 });

/* ⛔ a name can come from a gift link, which is a stranger's text */

  });
  el('wrapRow').addEventListener('click', function (e) {
    var w = e.target && e.target.getAttribute('data-wrap');
    if (!w) return;
    G.strip.wrap = w;
    markWrap(w);
  });
  el('btnShare').addEventListener('click', function () { shareGift(); });
  el('btnExport').addEventListener('click', function () { showScreen('Export'); });
  el('btnGiftSave').addEventListener('click', function () {
    shelfPut(GIFT.strip || G.strip);
    toast('On your shelf now');
    giftToBox();
  });
  el('btnGiftOwn').addEventListener('click', function () {
    giftToBox();
    punchOpen();
  });
  el('btnSound').addEventListener('click', function () {
    SETTINGS.sound = SETTINGS.sound ? 0 : 1;
    this.textContent = SETTINGS.sound ? 'SOUND ON' : 'SOUND OFF';
    if (SETTINGS.sound) resumeAudio();
    saveNow();
  });
  el('btnMotion').addEventListener('click', function () {
    SETTINGS.motion = SETTINGS.motion ? 0 : 1;
    this.textContent = SETTINGS.motion ? 'MOTION ON' : 'MOTION OFF';
    saveNow();
  });
  el('btnSwing').addEventListener('click', function () {
    SETTINGS.swing = SETTINGS.swing ? 0 : 1;
    this.textContent = SETTINGS.swing ? 'SWING ON' : 'SWING OFF';
    saveNow();
  });
  el('btnSound').textContent = SETTINGS.sound ? 'SOUND ON' : 'SOUND OFF';
  el('btnMotion').textContent = SETTINGS.motion ? 'MOTION ON' : 'MOTION OFF';
  el('btnSwing').textContent = SETTINGS.swing ? 'SWING ON' : 'SWING OFF';
  bindInput();
  /* a link opens as a parcel, not as a song */
  if (giftOpenLink(location.hash)) { kick(); }
  else if (!SAVE.seen.crankHint) { SAVE.seen.crankHint = 1; saveNow(); setTimeout(function () { hint('Turn the crank.'); }, 700); }
  /* ⛔ TEST MODE ONLY, and it was not: fifteen key buttons sat across the bottom
     third of the screen on top of the PUNCH button in the very first shot. */
  if (/[?&]keys=1/.test(location.search)) buildTestKeys();
  G.ready = true;
  kick();
  try { parent.postMessage({ sws: 'ready' }, '*'); } catch (e) {}
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js?v=' + STAMP).catch(function () {});
    });
  }
}

/* ---- giving one away ---- */
function markWrap(w) {
  var kids = el('wrapRow').children, i;
  for (i = 0; i < kids.length; i++) {
    kids[i].classList.toggle('go', kids[i].getAttribute('data-wrap') === w);
  }
}
function giftLink() {
  G.strip.name = (el('giveName').value || G.strip.name || 'A song').slice(0, 60);
  G.strip.dedication = (el('giveNote').value || '').slice(0, 140);
  G.strip.by = (el('giveBy').value || '').slice(0, 40);
  SAVE.by = G.strip.by;
  saveNow();
  el('nameChip').textContent = G.strip.name;
  var base = location.origin + location.pathname;
  return base + '#g=' + packGift(G.strip);
}
function shareGift() {
  var url = giftLink();
  var text = G.strip.by ? G.strip.by + ' punched you a song' : 'Someone punched you a song';
  if (navigator.share) {
    navigator.share({ title: G.strip.name, text: text, url: url }).catch(function () {});
    return url;
  }
  try {
    navigator.clipboard.writeText(url);
    toast('The link is copied');
  } catch (e) {
    toast('The link is in the address bar');
    try { history.replaceState(null, '', '#g=' + packGift(G.strip)); } catch (e2) {}
  }
  return url;
}

/* ============================ 22. THE GIFT ============================ */
/* ⛔ A GIFT IS OPENED, NOT LOADED. The whole point of the link is the moment
   before the song: a box on the cloth, wrapped, with a ribbon end that has to
   be pulled. Sixty pixels of real drag, because a tap would make it a dialog. */
var GIFT = { on: false, strip: null, opened: 0, pull: 0, grabbed: false };
var WRAP_ART = {
  birthday: { bg: '#B4553C', ink: '#F2E7CE', ribbon: '#E8C46A', dots: '#F2E7CE' },
  snowfall: { bg: '#2E4B63', ink: '#EAF2F8', ribbon: '#C9D8E4', dots: '#EAF2F8' },
  nightsky: { bg: '#1C2140', ink: '#DCD6F2', ribbon: '#C9A227', dots: '#F4EFC8' }
};
function giftOpenLink(hash) {
  var m = String(hash || '').match(/[#&]g=([A-Za-z0-9\-_]+)/);
  if (!m) return false;
  var st = unpackGift(m[1]);
  if (!st) return false;
  GIFT.on = true;
  GIFT.strip = st;
  GIFT.opened = 0;
  GIFT.pull = 0;
  G.strip = st;
  G.advanceMm = 0; G.readAt = -leadSteps();
  el('nameChip').textContent = st.name;
  el('nameChip').hidden = true;
  el('btnPunch').hidden = true;
  G.screen = 'gift';
  return true;
}
function drawWrapped(ctx) {
  var L = layout(), b = L.box;
  var art = WRAP_ART[GIFT.strip.wrap] || WRAP_ART.birthday;
  drawCloth(ctx);
  var open = GIFT.opened;
  /* the parcel, which slides apart as the ribbon comes off */
  var lift = open * 40;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  roundRect(ctx, b.x + 10, b.y + b.h - 4, b.w - 20, 24, 12);
  ctx.fill();
  ctx.fillStyle = art.bg;
  roundRect(ctx, b.x, b.y - lift, b.w, b.h + lift, 14);
  ctx.fill();
  ctx.save();
  roundRect(ctx, b.x, b.y - lift, b.w, b.h + lift, 14);
  ctx.clip();
  var i;
  if (GIFT.strip.wrap === 'birthday') {
    ctx.strokeStyle = 'rgba(242,231,206,.30)';
    ctx.lineWidth = 9;
    for (i = -20; i < 40; i++) {
      ctx.beginPath();
      ctx.moveTo(b.x + i * 26, b.y - lift - 10);
      ctx.lineTo(b.x + i * 26 + b.h + lift + 20, b.y + b.h + 10);
      ctx.stroke();
    }
  }
  for (i = 0; i < 90; i++) {
    var dx = b.x + noiseAt(i, 31, 3) * b.w;
    var dy = b.y - lift + noiseAt(i, 37, 5) * (b.h + lift);
    var rr = GIFT.strip.wrap === 'nightsky' ? 1 + noiseAt(i, 41, 7) * 1.6 : 2.5;
    ctx.fillStyle = art.dots;
    ctx.globalAlpha = GIFT.strip.wrap === 'nightsky' ? 0.35 + noiseAt(i, 43, 9) * 0.55 : 0.5;
    if (GIFT.strip.wrap === 'snowfall') {
      ctx.beginPath();
      ctx.arc(dx, dy, rr, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = art.dots;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(dx - 4, dy); ctx.lineTo(dx + 4, dy);
      ctx.moveTo(dx, dy - 4); ctx.lineTo(dx, dy + 4);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(dx, dy, rr, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  /* the ribbon, across and down, with its end hanging off the right */
  var slack = open * 90;
  ctx.strokeStyle = art.ribbon;
  ctx.lineWidth = 16;
  ctx.lineCap = 'butt';
  ctx.globalAlpha = 1 - open * 0.75;
  ctx.beginPath();
  ctx.moveTo(b.x - 2, b.y + b.h * 0.42 - lift);
  ctx.lineTo(b.x + b.w + 2, b.y + b.h * 0.42 - lift);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b.x + b.w * 0.62, b.y - lift - 2);
  ctx.lineTo(b.x + b.w * 0.62, b.y + b.h + 2);
  ctx.stroke();
  /* the end a thumb pulls */
  /* ⛔ THE END A THUMB PULLS HAS TO BE ON THE SCREEN. Hung off the right of a
     box that is nearly the full width, the ribbon end and the words under it
     were both past the edge of the phone, and the gate could not see it because
     the gate asked the GAME where the end was and then tapped there. */
  var ex = Math.min(V.W - 46, b.x + b.w - 30 + slack * 0.5);
  var ey = b.y + b.h * 0.42 - lift + 42 + slack * 0.5;
  GIFT.endAt = { x: ex, y: ey };
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  /* it hangs DOWN off the crossing, clear of the ribbon it came from, or it
     reads as a bulge in the ribbon rather than as a loose end */
  ctx.beginPath();
  ctx.moveTo(b.x + b.w * 0.62, b.y + b.h * 0.42 - lift + 4);
  ctx.bezierCurveTo(b.x + b.w * 0.72, ey - 26, ex - 26, ey - 22, ex, ey);
  ctx.stroke();
  ctx.fillStyle = art.ribbon;
  ctx.beginPath();
  ctx.arc(ex, ey, 12, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath();
  ctx.arc(ex + 2, ey + 3, 8, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  /* the words, and the pull */
  ctx.textAlign = 'center';
  ctx.fillStyle = '#EFE3C8';
  ctx.font = '700 20px ui-rounded, system-ui, sans-serif';
  ctx.fillText(GIFT.strip.by ? 'From ' + GIFT.strip.by : 'For you',
    V.W / 2, Math.max(70, b.y - lift - 34));
  if (!open) {
    ctx.fillStyle = 'rgba(239,227,200,.8)';
    ctx.font = '600 13px ui-rounded, system-ui, sans-serif';
    ctx.fillText('Pull the ribbon', clamp(ex, 70, V.W - 70), ey + 32);
  }
  ctx.textAlign = 'left';
}
function giftGrab(x, y) {
  if (!GIFT.on || GIFT.opened) return false;
  var e = GIFT.endAt;
  if (!e) return false;
  var d = Math.sqrt((x - e.x) * (x - e.x) + (y - e.y) * (y - e.y));
  /* a generous grab, because a ribbon end is a small thing on a phone */
  if (d > 70) return false;
  GIFT.grabbed = true;
  GIFT.pull = 0;
  GIFT.from = { x: x, y: y };
  return true;
}
function giftDrag(x, y) {
  if (!GIFT.grabbed) return;
  var dx = x - GIFT.from.x, dy = y - GIFT.from.y;
  GIFT.pull = Math.sqrt(dx * dx + dy * dy);
  GIFT.opened = clamp(GIFT.pull / CONFIG.RIBBON_PULL_PX, 0, 1);
  if (GIFT.pull >= CONFIG.RIBBON_PULL_PX) giftOpen();
}
function giftOpen() {
  if (GIFT.opened >= 1 && GIFT.done) return;
  GIFT.opened = 1;
  GIFT.grabbed = false;
  GIFT.done = 1;
  haptic(20);
  el('giftFrom').textContent = GIFT.strip.by ? 'From ' + GIFT.strip.by : 'Someone made you this';
  el('giftNote').textContent = GIFT.strip.dedication || '';
  el('scrGift').classList.add('on');
  document.body.classList.add('listing');
}
function giftToBox() {
  el('scrGift').classList.remove('on');
  document.body.classList.remove('listing');
  GIFT.on = false;
  G.screen = 'box';
  el('nameChip').hidden = false;
  el('nameChip').textContent = G.strip.name;
  el('btnPunch').hidden = false;
  hint('Turn the crank.');
}

/* ============================ 23. INPUT ============================ */
function bindInput() {
  var cv = V.cv;
  var PT = null;
  cv.addEventListener('pointerdown', function (e) {
    var x = e.clientX, y = e.clientY;
    resumeAudio();
    if (GIFT.on && !GIFT.opened) {
      if (giftGrab(x, y)) { PT = { id: e.pointerId, mode: 'ribbon' }; e.preventDefault(); }
      return;
    }
    if (PUN.on) {
      PT = { id: e.pointerId, x0: x, y0: y, x: x, y: y, scroll0: PUN.scroll, moved: 0, mode: 'punch' };
      return;
    }
    if (crankStart(x, y)) {
      PT = { id: e.pointerId, mode: 'crank', t: e.timeStamp || V.t };
      e.preventDefault();
    }
  });
  cv.addEventListener('pointermove', function (e) {
    if (!PT || PT.id !== e.pointerId) return;
    var x = e.clientX, y = e.clientY;
    if (PT.mode === 'ribbon') { giftDrag(x, y); return; }
    if (PT.mode === 'crank') {
      var now = e.timeStamp || V.t;
      var dt = Math.max(1, now - PT.t);
      PT.t = now;
      var delta = crankMove(x, y, dt);
      bedLevel(G.crankSpeed);
      bedTicks(delta);
      if (!G.firstTurn && Math.abs(G.turned) > 2 * Math.PI) {
        G.firstTurn = true;
        if (!SAVE.seen.punchHint) { SAVE.seen.punchHint = 1; hint('Now punch your own.'); saveNow(); }
      }
      return;
    }
    /* the paper scrolls under the finger */
    PT.moved += Math.abs(x - PT.x) + Math.abs(y - PT.y);
    PT.x = x; PT.y = y;
    var P = punchLayout();
    PUN.scroll = Math.max(0, PT.scroll0 - (x - PT.x0) / P.stepPx);
  });
  function up(e) {
    if (!PT || PT.id !== e.pointerId) return;
    if (PT.mode === 'crank') crankEnd();
    else if (PT.mode === 'ribbon') {
      /* let go short of the pull and the ribbon springs back */
      if (GIFT.opened < 1) { GIFT.grabbed = false; GIFT.opened = 0; GIFT.pull = 0; }
    } else if (PT.moved < 10) punchTap(PT.x, PT.y);
    PT = null;
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function () {
    if (PT && PT.mode === 'crank') crankEnd();
    PT = null;
  });
  el('btnPunch').addEventListener('click', function () { resumeAudio(); punchOpen(); });
  el('btnPunchDone').addEventListener('click', function () {
    punchClose();
    shelfPut(G.strip);
  });
  el('btnPlay').addEventListener('click', function () {
    resumeAudio();
    PUN.playing = !PUN.playing;
    if (PUN.playing) { PUN.play = 0; PUN.scroll = 0; }
    this.textContent = PUN.playing ? 'STOP' : 'PLAY';
  });
  el('btnDice').addEventListener('click', function () {
    /* a rolled melody lands after the last hole, so it adds rather than replaces */
    var at = G.strip.holes.length ? G.strip.holes[G.strip.holes.length - 1][0] + 8 : 0;
    var m = seedMelody(mixSeed(seedFromString(G.strip.name), G.strip.holes.length + at));
    var i, added = 0;
    for (i = 0; i < m.holes.length; i++) {
      if (punch(G.strip, at + m.holes[i][0], m.holes[i][1])) added++;
    }
    PUN.scroll = Math.max(0, at - 2);
    toast(added + ' more notes');
    saveNow();
  });
  el('btnClear').addEventListener('click', function () {
    if (!G.strip.holes.length) return;
    if (this.textContent === 'CLEAR') {
      this.textContent = 'SURE';
      var b = this;
      setTimeout(function () { if (b.textContent === 'SURE') b.textContent = 'CLEAR'; }, 2600);
      return;
    }
    G.strip.holes = [];
    this.textContent = 'CLEAR';
    PUN.play = 0; PUN.scroll = 0;
    saveNow();
  });
  el('nameChip').addEventListener('click', function () {
    var n = prompt('What is this one called', G.strip.name);
    if (n === null) return;
    G.strip.name = String(n).slice(0, 40) || 'Untitled';
    el('nameChip').textContent = G.strip.name;
    saveNow();
  });
}

/* ---- the hook every browser gate reads. It says WHAT happened; it never
   drives anything a thumb should. ---- */
window.WINDUP_TEST = {
  frames: function () { return FRAMES; },
  screen: function () { return G.screen; },
  state: function () { return G; },
  strip: function () { return G.strip; },
  save: function () { return SAVE; },
  settings: function () { return SETTINGS; },
  config: function () { return CONFIG; },
  /* the whole SIM layer, so a browser gate and sim.js agree by construction */
  sim: function () {
    return { newStrip: newStrip, canPunch: canPunch, punch: punch, unpunch: unpunch,
      stripLength: stripLength, packStrip: packStrip, unpackStrip: unpackStrip,
      seedMelody: seedMelody, STARTERS: STARTERS, noteHz: noteHz, decayFor: decayFor,
      jitterFor: jitterFor };
  },
  /* ⛔ the audio ENGINE BUILDER, handed out so a gate can render into an
     OfflineAudioContext. Nothing here plays into the page. */
  buildAudio: buildAudio,
  tine: tine,
  audio: function () { return G.audio; },
  voices: function () { return G.audio ? G.audio.voices.length : 0; },
  layout: function () { return LAY || layout(); },
  punchLayout: punchLayout,
  punchXY: function (step, row) { return { x: punchX(step), y: punchY(row) }; },
  fired: function () { return G.lastFired.slice(); },
  clearFired: function () { G.lastFired = []; },
  advance: function () { return G.advanceMm; },
  bedGain: function () { return (G.audio && G.audio.bed) ? G.audio.bed.g.gain.value : -1; },
  ringing: function () {
    if (!G.audio) return 0;
    var now = G.audio.ctx.currentTime, i, n = 0;
    for (i = 0; i < G.audio.voices.length; i++) if (G.audio.voices[i].until > now) n++;
    return n;
  },
  cranking: function () { return !!G.cranking; },
  readAt: function () { return G.readAt; },
  punch: function () { return PUN; },
  shelf: function () { return SAVE.shelf; },
  gift: function () { return GIFT; },
  giftLink: giftLink,
  packGift: function (st) { return packGift(st || G.strip); },
  openLink: function (h) { return giftOpenLink(h); },
  setStrip: function (holes, name) {
    G.strip = newStrip({ name: name || 'Test', holes: holes || [] });
    G.advanceMm = 0; G.readAt = -leadSteps(); G.lastFired = [];
    el('nameChip').textContent = G.strip.name;
  },
  made: function () { return G.audio ? G.audio.made : 0; }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
