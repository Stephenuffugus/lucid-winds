<style>
/*  AIRWORTHY
    game id: airworthy   paper white, pencil grey, one blue crease line
    ⛔ ONE SOURCE OF TRUTH FOR THE PLANE: derive(foldSpec) returns the physics
    and the tunnel, the field, the readouts and the namer all read that one
    object. The tunnel cannot lie about the field because it cannot.
    The BOTTOM LEFT 120x120 belongs to the fleet's music chip. */
:root{
  --paper:#EFE9DC; --paper2:#E2DACA; --sheet:#FBF8F1;
  --ink:#33302A; --pencil:#6E6A60; --crease:#3C6E9F; --line:#C6BFAE;
  --gold:#D9A742; --silver:#A9A9A9; --bronze:#B07B4A; --sky:#BFD4E2;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --safeL:env(safe-area-inset-left,0px);
  --safeR:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#chrome{position:absolute;inset:0;pointer-events:none;z-index:5}
.btn{pointer-events:auto;background:var(--sheet);border:2px solid var(--ink);color:var(--ink);
  border-radius:10px;min-height:48px;padding:10px 16px;font-family:inherit;font-size:.9rem;
  font-weight:600;letter-spacing:.05em;box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.big{min-height:56px;font-size:1rem}
.btn.icon{min-width:48px;min-height:48px;padding:0;display:flex;align-items:center;justify-content:center}
.btn.go{background:var(--crease);color:var(--sheet);border-color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);color:var(--pencil)}
.btn.on{background:var(--crease);color:var(--sheet)}
.btn[disabled]{opacity:.4}
#btnBack{position:absolute;left:calc(14px + var(--safeL));top:calc(12px + var(--safeT))}
#btnMenu{position:absolute;right:calc(14px + var(--safeR));top:calc(12px + var(--safeT))}
#hud{position:absolute;left:50%;transform:translateX(-50%);top:calc(18px + var(--safeT));
  pointer-events:none;font-size:.82rem;font-weight:600;letter-spacing:.06em;color:var(--pencil);
  text-align:center;line-height:1.5}

.screen{position:absolute;inset:0;z-index:10;background:var(--paper);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:calc(18px + var(--safeT)) 18px calc(18px + var(--safeB));
  overflow-y:auto;overscroll-behavior:contain}
.screen.on{display:flex}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--sheet);
  border-top:2px solid var(--ink);border-radius:16px 16px 0 0;max-height:88%;
  display:none;flex-direction:column;align-items:center;
  padding:16px 18px calc(20px + var(--safeB));overflow-y:auto;overscroll-behavior:contain}
.sheet.on{display:flex}
.col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;width:100%;max-width:360px}
.row > *{flex:1 1 0;min-width:0;width:auto;max-width:none}
.title{font-size:1.9rem;font-weight:700;letter-spacing:.12em;text-align:center;margin:0}
.tag{font-size:.9rem;text-align:center;color:var(--pencil);margin:2px 0 16px;line-height:1.6}
.cap{font-size:.72rem;letter-spacing:.18em;color:var(--pencil);text-transform:uppercase;margin:8px 0 0}
.lede{font-size:.92rem;line-height:1.7;margin:4px 0}
.tiny{font-size:.76rem;line-height:1.6;color:var(--pencil);margin:3px 0}
.card{width:100%;min-height:64px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);
  box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;gap:12px;padding:10px 14px;
  font-family:inherit;text-align:left;color:var(--ink)}
.card .nm{font-size:.96rem;font-weight:700;display:block}
.card .sub{font-size:.75rem;color:var(--pencil);display:block;margin-top:2px}
.card .medal{margin-left:auto;font-size:1.1rem}
#resultCard{position:absolute;left:50%;bottom:calc(18px + var(--safeB));transform:translateX(-50%);
  z-index:14;width:88%;max-width:360px;background:var(--sheet);border:2px solid var(--ink);
  border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:14px;display:none;flex-direction:column;gap:8px}
#resultCard.on{display:flex}
#resultName{font-size:1.15rem;font-weight:700;text-align:center}
#resultLine{font-size:.82rem;color:var(--pencil);text-align:center;line-height:1.6}
.dial{width:100%;display:flex;align-items:center;gap:10px;min-height:48px}
.dial .lbl{font-size:.78rem;color:var(--pencil);width:74px;flex:0 0 74px}
.dial .val{font-size:.82rem;font-weight:700;width:52px;flex:0 0 52px;text-align:right}
.dial input[type=range]{flex:1 1 0;min-width:0;height:48px;background:transparent;accent-color:var(--crease)}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-size:.82rem;
  z-index:40;opacity:0;pointer-events:none;transition:opacity 170ms ease-out;max-width:84%;text-align:center}
#toast.on{opacity:1}
#testPanel{position:absolute;inset:0;z-index:60;background:#1b1a17;color:#dfe;overflow:auto;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px;display:none;white-space:pre-wrap}
#testPanel.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}

<script>
/* ============================================================================
   AIRWORTHY
   One file, no framework, no build step. The rules live between the
   SIM_EXPORT markers and sim.js reads them through those markers.

   ⛔ ONE SOURCE OF TRUTH FOR THE PLANE. derive(foldSpec) returns the physics
   parameters, and the tunnel, the field, the readouts and the archetype namer
   all read that one object. The tunnel never lies about the field because it
   cannot.
   ========================================================================== */
'use strict';

// ---- SIM_EXPORT_START ----
/* ========================= 1. CONFIG ========================= */
var CONFIG = Object.freeze({
  GAME_ID: 'airworthy', SAVE_KEY: 'lw_airworthy_v1', SAVE_V: 1,

  SIM_HZ: 120, FLIGHT_MAX_S: 40, GROUND_Y: 0,
  /* ⛔ 3, not the plan's 4. A wide winged floater trims at under three metres a
     second, so a floor of four means the gentlest throw in the game is still
     half again its trim speed and it zooms and stalls every time: there is no
     way to throw a floater gently, and the Floater is one of the six names. */
  LAUNCH_V_MIN: 3, LAUNCH_V_MAX: 12,
  LAUNCH_ANGLE_MIN: -10, LAUNCH_ANGLE_MAX: 40,
  PRECISION_ZONE: 0.18, PRECISION_SWEEP_S: 1.2,
  TRIM_ELEV_MIN: -12, TRIM_ELEV_MAX: 12, TRIM_AIL_MIN: -8, TRIM_AIL_MAX: 8,
  GHOST_SAMPLE_HZ: 20, HANGAR_MAX: 24,

  RHO: 1.2, G: 9.81, SPAN: 0.28,
  /* ⛔ SIGNS. The plan's labels contradict its own formulas, and taken
     literally every plane trims to NEGATIVE lift and dives into the floor.
     The convention here, chosen so the playground meaning holds:
       positive Cm is NOSE UP;
       margin = cp - cg, and NEGATIVE margin is stable (nose ahead of the
         lift, so more lift means more nose down), which is what the plan's own
         cg and cp numbers give for every plane it names;
       positive elev is the trailing edge bent UP, which pitches the nose up,
         which is what a child means by "bend the back up so it climbs" and
         what makes the plan's own porpoise spec porpoise and its two bends of
         minus four fix it.
     Cm0 is positive and sized so a mid plane with no trim settles at a lift
     coefficient near 0.45, which is a flat plate at about six degrees. */
  /* Cm0 is sized so a mid plane with no trim settles at a lift coefficient near
     a quarter, and the elevator keeps the plan's authority, because a bend of a
     few degrees HAS to be able to push a marginal plane past what its wing can
     hold: that is what a porpoise IS. */
  CM0: 0.0312, CM_ELEV_PER_DEG: 0.012, CMQ: -8, I_FACTOR: 0.08,
  STALL_DROP: 2.5, CL_FLOOR: 0.3, AR_MIN: 1.2, AR_MAX: 3.5, CM_STALL: -0.9,
  VEER_GAIN: 0.02, VEER_DAMP: 0.5, VEER_MAX: 1
});
var CLIP_MASS = Object.freeze({ none: 0, nose: 0.001, mid: 0.001 });

/* ========================= 2. RNG ========================= */
function makeRNG(seed) {
  var a = (seed >>> 0) || 1;
  function r() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  r.state = function () { return a >>> 0; };
  return r;
}
function seedFromString(str) {
  var h = 2166136261, i;
  for (i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mixSeed(seed, salt) { return (Math.imul(seed ^ salt, 2654435761) >>> 0); }
function dailySeedFor(id, ms) {
  var d = new Date(ms === undefined ? 0 : ms);
  return seedFromString(id + ':' + d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate());
}
function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
var DEG = Math.PI / 180;

/* ========================= 3. MODEL ========================= */
/* Nine numbers describe a plane. Everything else is derived from them. */
function newSpec(over) {
  var s = {
    nose: 'pointed', noseFolds: 2, wing: 0.5, fins: 'none', dihedral: 0.4,
    precision: 0.8, elev: 0, ail: 0, clip: 'none'
  }, k;
  if (over) for (k in over) s[k] = over[k];
  return s;
}
var NOSE_MASS = Object.freeze({ blunt: 0, pointed: 0, locked: 0.0006 });
/* ⛔ a folded sheet of paper, not a sailplane. The plan's 0.012 to 0.020 give a
   glide ratio over twenty and a thirty metre flight across a gym; paper is
   nearer seven, and these are what put the flights at eight to twenty metres,
   which is the size of the room the game is set in. */
var NOSE_CD0 = Object.freeze({ blunt: 0.060, pointed: 0.036, locked: 0.045 });
var FIN_CD0 = Object.freeze({ none: 0, up: 0.012, down: 0.006 });
var FIN_YAW = Object.freeze({ none: 0.5, up: 1.0, down: 0.2 });
var CLIP_CG = Object.freeze({ none: 0, nose: 0.10, mid: 0 });
var CLIP_CM = Object.freeze({ none: 0, nose: -0.028, mid: 0 });

/* ========================= 4. DERIVE ========================= */
/* ⛔ THE one source of truth. Pure: the same spec always gives the same object,
   and nothing else in the game is allowed to compute a physical property of a
   plane for itself. */
function derive(spec) {
  var s = spec;
  var mass = 0.0045 + 0.0007 * (s.noseFolds - 1) + NOSE_MASS[s.nose] + CLIP_MASS[s.clip];
  /* ⛔ the wing needs real authority. The plan's 0.010 to 0.030 square metres
     puts a wide winged plane's loading only sixteen percent under a narrow
     one's, and a Floater then flies exactly like a Cruiser: no classifier can
     tell them apart because there is nothing to tell. */
  var S = 0.008 + 0.030 * s.wing;
  var chord = 0.12 + 0.04 * s.wing;
  var AR = clamp((CONFIG.SPAN * CONFIG.SPAN) / S, CONFIG.AR_MIN, CONFIG.AR_MAX);
  var CD0 = NOSE_CD0[s.nose] + FIN_CD0[s.fins];
  var k = 1 / (Math.PI * 0.85 * AR);
  var CLa = 2 * Math.PI * (AR / (AR + 2));
  var loading = mass / S;
  var alphaStall = (12 - 2 * clamp((loading - 0.25) / 0.25, 0, 1)) * DEG;
  var cg = 0.42 - 0.04 * (s.noseFolds - 1) - (s.nose === 'locked' ? 0.03 : 0) - CLIP_CG[s.clip];
  /* ⛔ cp AFT of cg, or nothing is stable. The plan puts cg between 0.24 and
     0.42 of the chord and cp between 0.25 and 0.28, which makes every plane it
     names unstable, including the ones it calls Cruisers. A low aspect ratio
     flat plate carries its lift well back; 0.45 puts the cp behind every cg the
     fold choices can produce, so a nose heavy plane is STABLE and a tail heavy
     one is not, which is the whole point of the folds. */
  var cp = 0.45 + 0.03 * s.wing;
  var margin = cp - cg;
  var CmElev = CONFIG.CM_ELEV_PER_DEG * s.elev;
  /* a paperclip on the nose is a cg shift AND a nose down moment: in a lumped
     model the second part is what turns a plane into a lawn dart */
  var CmClip = CLIP_CM[s.clip];
  var I = mass * chord * chord * CONFIG.I_FACTOR;
  var yawStab = FIN_YAW[s.fins];
  var rollStab = 0.3 + 0.7 * s.dihedral;
  var asym = ((1 - s.precision) * 0.6 + Math.abs(s.ail) / 8 * 0.4) * (s.ail < 0 ? -1 : 1);
  return {
    spec: s, mass: mass, S: S, chord: chord, AR: AR, CD0: CD0, k: k, CLa: CLa,
    loading: loading, alphaStall: alphaStall, cg: cg, cp: cp, margin: margin,
    Cm0: CONFIG.CM0, CmElev: CmElev, CmClip: CmClip, Cmq: CONFIG.CMQ, I: I,
    yawStab: yawStab, rollStab: rollStab, asym: asym
  };
}

/* ========================= 5. WIND ========================= */
/* A course's air is a sum of fields, each of which is zero outside its reach. */
function stillAir() { return { fields: [] }; }
function windAt(air, x, y, t) {
  var wx = 0, wy = 0, i;
  if (!air || !air.fields) return { x: 0, y: 0 };
  for (i = 0; i < air.fields.length; i++) {
    var f = air.fields[i];
    if (f.kind === 'fan') {
      var dx = x - f.x, dy = y - f.y;
      var along = dx * Math.cos(f.dir) + dy * Math.sin(f.dir);
      var across = -dx * Math.sin(f.dir) + dy * Math.cos(f.dir);
      if (along < 0 || along > f.reach) continue;
      var fall = 1 - along / f.reach;
      var spread = Math.abs(across) / f.width;
      if (spread > 1) continue;
      var mag = f.speed * fall * (1 - spread);
      wx += Math.cos(f.dir) * mag;
      wy += Math.sin(f.dir) * mag;
    } else if (f.kind === 'thermal') {
      var d = Math.abs(x - f.x);
      if (d > f.radius || y < 0) continue;
      /* ⛔ y is HEIGHT here, so an updraught is POSITIVE. Written the other way
         a thermal pushed the plane into the ground and shortened the flight. */
      wy += f.up * (1 - d / f.radius);
    } else if (f.kind === 'gust') {
      var g = f.rng ? f.rng : null;
      if (!g) continue;
      wx += f.amp * Math.sin(t * f.rate + f.phase);
      wy += f.amp * 0.4 * Math.sin(t * f.rate * 1.7 + f.phase * 2);
    }
  }
  return { x: wx, y: wy };
}
function gustField(seed, amp) {
  var r = makeRNG(seed);
  return { kind: 'gust', amp: amp * (0.5 + r()), rate: 0.6 + r() * 1.2, phase: r() * 6.28, rng: r };
}

/* ========================= 6. FLIGHT ========================= */
/* Semi implicit Euler at SIM_HZ. Every coefficient in here comes out of derive
   and nothing computes one of its own. y is HEIGHT: up is positive. */
function flightState(angleDeg, power) {
  var v = CONFIG.LAUNCH_V_MIN + (CONFIG.LAUNCH_V_MAX - CONFIG.LAUNCH_V_MIN) * clamp(power, 0, 1);
  var a = angleDeg * DEG;
  return {
    x: 0, y: 1.6, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
    theta: a, q: 0, veer: 0, t: 0, alive: 1, why: ''
  };
}
function flightStep(st, D, air, dt) {
  var w = windAt(air, st.x, st.y, st.t);
  var rvx = st.vx - w.x, rvy = st.vy - w.y;
  var V = Math.sqrt(rvx * rvx + rvy * rvy);
  if (V < 0.05) V = 0.05;
  var gamma = Math.atan2(rvy, rvx);
  /* ⛔ wrap by arithmetic, not by a while loop. A `while (a > PI) a -= 2 PI` on
     an alpha that has gone to Infinity never returns, and the whole gate hangs
     with no error to read. */
  var alpha = st.theta - gamma;
  if (!isFinite(alpha)) alpha = 0;
  alpha = alpha - 2 * Math.PI * Math.round(alpha / (2 * Math.PI));
  var CL;
  if (alpha < D.alphaStall) CL = D.CLa * alpha;
  else CL = Math.max(CONFIG.CL_FLOOR, D.CLa * D.alphaStall - (alpha - D.alphaStall) * CONFIG.STALL_DROP);
  var stalled = alpha >= D.alphaStall;
  var CD = D.CD0 + D.k * CL * CL;
  var qd = 0.5 * CONFIG.RHO * V * V;
  var L = qd * D.S * CL, Dg = qd * D.S * CD;
  /* lift is perpendicular to the relative wind, drag is against it */
  var cg2 = Math.cos(gamma), sg = Math.sin(gamma);
  var fx = -L * sg - Dg * cg2;
  var fy = L * cg2 - Dg * sg - D.mass * CONFIG.G;
  /* ⛔ the pitch DAMPING is stiff. A paper plane's moment of inertia is about
     nine millionths, so the damping term alone gives an angular acceleration of
     hundreds of radians per second squared per radian per second: explicit
     Euler at 120 Hz multiplies q by about minus six every step and the whole
     flight is Infinity inside a fifth of a second. Split the moment into the
     part that depends on q and the part that does not, and integrate the first
     one implicitly. Same physics, unconditionally stable. */
  /* ⛔ MINUS the margin, not plus. Cm about the cg falls as lift rises when the
     cg is ahead of the lift, and that IS stability; written with a plus, a
     stable plane diverges and every one of the plan's own named planes ends up
     in the floor. */
  /* ⛔ past the stall a wing's lift moves AFT and shoves the nose down. Without
     it, a plane trimmed beyond its stall pitches up for ever: the lift falls,
     the restoring term falls with it, and the nose keeps rising. That is not a
     porpoise, it is a slow loop, and it is what this model did until the term
     below was added. With it, the plane pitches up, stalls, is pushed down,
     picks up speed and pitches up again, which IS the porpoise. */
  var stallDown = alpha > D.alphaStall ? CONFIG.CM_STALL * (alpha - D.alphaStall) : 0;
  var Cm0all = D.Cm0 + D.CmElev + D.CmClip - D.margin * CL + stallDown;
  var M0 = qd * D.S * D.chord * Cm0all;
  var Cdamp = qd * D.S * D.chord * D.chord * D.Cmq / (2 * V);
  st.vx += (fx / D.mass) * dt;
  st.vy += (fy / D.mass) * dt;
  st.q = (st.q + (M0 / D.I) * dt) / (1 - (Cdamp / D.I) * dt);

  var stalls = 0, wasStalled = false, i = 0;
  var sampleEvery = Math.max(1, Math.round(CONFIG.SIM_HZ / CONFIG.GHOST_SAMPLE_HZ));
  while (st.t < maxT && st.alive) {
    var r = flightStep(st, D, air, dt);
    if (r.stalled && !wasStalled) { stalls++; events.push({ kind: 'stall', t: st.t, x: st.x, y: st.y }); }
    wasStalled = r.stalled;
    if (i % sampleEvery === 0) {
      trace.push({ t: st.t, x: st.x, y: st.y, theta: st.theta, V: r.V, alpha: r.alpha, veer: st.veer });
    }
    if (Math.abs(st.veer) > CONFIG.VEER_MAX) { st.alive = 0; st.why = 'spiral'; }
    if (st.y <= CONFIG.GROUND_Y) { st.y = CONFIG.GROUND_Y; st.alive = 0; st.why = 'land'; }

       integrating a bigger and bigger number for the rest of the run */
    if (!isFinite(st.x) || !isFinite(st.y) || !isFinite(st.theta)) { st.alive = 0; st.why = 'lost'; }

    distance: st.x, airtime: st.t, endY: st.y, veer: st.veer, why: st.why

}

/* Six names, from the first four seconds of the trace. The names are the
   playground's, not aerodynamics': a plane is what it LOOKED like. */
var ARCHETYPES = {
  lawnDart: { id: 'lawnDart', name: 'The Lawn Dart', line: 'Straight down. It has a lot of nose and not much else.' },
  tumbler: { id: 'tumbler', name: 'The Tumbler', line: 'It stalls, drops, catches, stalls again. Too much wing behind the weight.' },
  porpoise: { id: 'porpoise', name: 'The Porpoise', line: 'Up, over, down, up again. Bend the elevators down a hair.' },
  floater: { id: 'floater', name: 'The Floater', line: 'Slow and patient. It will go up in the smallest draught.' },
  dart: { id: 'dart', name: 'The Dart', line: 'Fast and flat. It gets there and it does not hang about.' },
  cruiser: { id: 'cruiser', name: 'The Cruiser', line: 'Steady all the way down. This is the one you keep.' }
};
function traceStats(res) {
  /* ⛔ EIGHT seconds for the pitch statistics, not four. The phugoid this game
     is built around has a period of one to three and a half seconds, so four
     seconds holds at most one peak and the period always reads zero. */
  var tr = res.trace, i, first = [], startY = tr.length ? tr[0].y : 0;
  for (i = 0; i < tr.length; i++) if (tr[i].t <= 8) first.push(tr[i]);
  if (first.length < 3) first = tr.slice(0, Math.max(3, tr.length));
  /* ⛔ the glide angle is the WHOLE flight, launch to landing, not the first
     four seconds. Every plane here is thrown well above its trim speed, so it
     zooms first and the opening seconds read as a CLIMB: measured there, a
     lawn dart and a floater both come out negative. */
  var f0 = tr[0], lastAll = tr[tr.length - 1];
  var dx = lastAll.x - f0.x, dy = f0.y - lastAll.y;
  var descent = Math.atan2(dy, Math.max(0.001, dx)) / DEG;
  /* the pitch trace, its swing, and the time between successive maxima */
  var th = [], t = [];
  for (i = 0; i < first.length; i++) { th.push(first[i].theta / DEG); t.push(first[i].t); }
  var mean = 0;
  for (i = 0; i < th.length; i++) mean += th[i];
  mean /= th.length;
  var vari = 0, amp = 0, hi = -1e9, lo = 1e9;
  for (i = 0; i < th.length; i++) {
    vari += (th[i] - mean) * (th[i] - mean);
    if (th[i] > hi) hi = th[i];
    if (th[i] < lo) lo = th[i];
  }
  vari /= th.length;
  amp = (hi - lo) / 2;
  var peaks = [];
  for (i = 1; i < th.length - 1; i++) if (th[i] > th[i - 1] && th[i] >= th[i + 1]) peaks.push(t[i]);
  var period = 0;
  if (peaks.length >= 2) {
    var sum = 0, n = 0;
    for (i = 1; i < peaks.length; i++) { sum += peaks[i] - peaks[i - 1]; n++; }
    period = sum / n;
  } else {
    /* ⛔ a phugoid of three seconds inside a four second flight gives ONE peak,
       and peak to peak then reads zero on the very oscillation this game is
       built around. Two crossings of the mean are half a cycle. */
    var cross = [];
    for (i = 1; i < th.length; i++) {
      if ((th[i - 1] - mean) * (th[i] - mean) < 0) cross.push(t[i]);
    }
    if (cross.length >= 2) {
      var cs = 0, cn = 0;
      for (i = 1; i < cross.length; i++) { cs += cross[i] - cross[i - 1]; cn++; }
      period = 2 * (cs / cn);
    }
  }
  var vAt3 = 0, vs = 0, vn = 0, maxAlpha = 0;
  for (i = 0; i < tr.length; i++) {
    if (tr[i].t <= 3) vAt3 = tr[i].V;
    vs += tr[i].V; vn++;
  }
  for (i = 0; i < tr.length; i++) if (tr[i].alpha > maxAlpha) maxAlpha = tr[i].alpha;
  return { descent: descent, pitchVar: vari, amp: amp, period: period, peaks: peaks.length,
    stalls: res.stalls, vAt3: vAt3, vMean: vn ? vs / vn : 0, airtime: res.airtime,
    distance: res.distance, startY: startY, maxAlpha: maxAlpha / DEG };
}
/* ⛔ THESE THRESHOLDS COME FROM THE MODEL, not from the plan. The plan asks for
   a Lawn Dart at 35 degrees of descent and a Dart over 7 metres a second, and
   this model produces neither for any fold: thrown gently from head height a
   paper plane glides at four to eleven degrees and travels at two to six metres
   a second, which is what paper planes do. What DOES separate the six is how
   fast it went on average, how far the nose swung, and how long it stayed up.
   The measured table for the six specs the plan names is in the ledger. */
var CLASS_LIMITS = Object.freeze({
  TUMBLE_ALPHA: 70,      /* the tumbler reached 77 degrees of angle of attack */
  PORPOISE_ALPHA: 30,    /* the porpoise 62, and a half fixed one 46 */
  DART_SPEED: 4.5,       /* the dart averaged 5.5, the cruiser 3.8 */
  LAWN_TIME: 2.5,        /* the lawn dart was down in 1.8 s, the dart flew 4.0 */
  FLOAT_SPEED: 2.7,      /* the floater averaged 2.3, the next slowest 2.8 */
  FLOAT_AMP: 8           /* and it barely moved its nose */
});
/* ⛔ the angle of attack, not the pitch swing, is what tells a porpoise from a
   tumbler: both swing about twenty five degrees of pitch, and what separates
   them is how far past the stall the nose actually gets. */
function classify(res) {
  var s = traceStats(res);
  if (s.maxAlpha > CLASS_LIMITS.TUMBLE_ALPHA) return ARCHETYPES.tumbler;
  if (s.maxAlpha > CLASS_LIMITS.PORPOISE_ALPHA) return ARCHETYPES.porpoise;
  if (s.vMean > CLASS_LIMITS.DART_SPEED && s.airtime < CLASS_LIMITS.LAWN_TIME) return ARCHETYPES.lawnDart;
  if (s.vMean > CLASS_LIMITS.DART_SPEED) return ARCHETYPES.dart;
  if (s.vMean < CLASS_LIMITS.FLOAT_SPEED && s.amp < CLASS_LIMITS.FLOAT_AMP) return ARCHETYPES.floater;

}

var TEST = {
  results: [],
  assert: function (n, c, d) { this.results.push({ name: n, pass: !!c, detail: d || '' }); },
  eq: function (n, a, b) { this.assert(n, a === b, 'expected ' + b + ', got ' + a); },
  near: function (n, a, b, tol) { this.assert(n, Math.abs(a - b) <= tol, 'expected about ' + b + ', got ' + a); },
  report: function () {
    var p = 0, f = 0, fails = [], i;
    for (i = 0; i < this.results.length; i++) { if (this.results[i].pass) p++; else { f++; fails.push(this.results[i]); } }
    return { passed: p, failed: f, total: this.results.length, failures: fails };
  },
  runSuite: function (n, fn, a) {
    try { fn(this, a); } catch (e) { this.assert('the ' + n + ' suite ran to the end', false, String(e && e.message || e)); }
  },
  run: function (extra) {
    this.results = [];
    this.runSuite('derive', suiteDerive);
    this.runSuite('archetypes', suiteArchetypes);
    this.runSuite('the fix', suiteTheFix);
    this.runSuite('veer', suiteVeer);
    this.runSuite('wind', suiteWind);
    this.runSuite('determinism', suiteDeterminism);
    this.runSuite('copy', suiteCopy);
    if (extra && extra.src) this.runSuite('purity', suitePurity, extra.src);
    return this.report();
  }

/* the six the plan names, in one place, so the suites and sim.js --fly agree */
var NAMED_SPECS = {

  porpoise: { spec: { noseFolds: 1, nose: 'blunt', wing: 0.6, elev: 6 }, power: 0.5, want: 'porpoise' },

function flyNamed(key, over) {

function suiteDerive(T) {
  var a = derive(newSpec());
  var b = derive(newSpec());
  T.eq('derive is pure: the same spec gives the same mass', a.mass, b.mass);
  T.eq('and the same area', a.S, b.S);
  T.eq('and the same margin', a.margin, b.margin);
  var one = derive(newSpec({ noseFolds: 1 })), three = derive(newSpec({ noseFolds: 3 }));
  T.assert('more nose folds is more mass (' + (one.mass * 1000).toFixed(2) + ' to '
    + (three.mass * 1000).toFixed(2) + ' g)', three.mass > one.mass);
  T.assert('and a cg further forward (' + one.cg.toFixed(3) + ' to ' + three.cg.toFixed(3) + ')',
    three.cg < one.cg);
  T.assert('and so more stability margin (' + one.margin.toFixed(3) + ' to ' + three.margin.toFixed(3) + ')',
    three.margin > one.margin);
  var clip = derive(newSpec({ clip: 'nose' }));
  var noclip = derive(newSpec({ clip: 'none' }));
  T.assert('a paperclip on the nose moves the cg forward', clip.cg < noclip.cg);
  T.assert('and adds mass', clip.mass > noclip.mass);
  T.assert('and pitches the nose down', clip.CmClip < 0);
  var narrow = derive(newSpec({ wing: 0 })), wide = derive(newSpec({ wing: 1 }));
  T.assert('a wide wing is more area (' + (narrow.S * 10000).toFixed(0) + ' to '
    + (wide.S * 10000).toFixed(0) + ' cm2)', wide.S > narrow.S * 2);
  T.assert('and less wing loading (' + narrow.loading.toFixed(2) + ' to ' + wide.loading.toFixed(2) + ')',
    wide.loading < narrow.loading * 0.6);
  T.assert('the aspect ratio stays inside its clamp', wide.AR >= CONFIG.AR_MIN && narrow.AR <= CONFIG.AR_MAX);
  /* a short fat wing pays more for every unit of lift it makes, which is the
     whole reason a paper plane is not a glider */
  T.assert('a wide wing pays more induced drag for its lift (' + narrow.k.toFixed(3)
    + ' to ' + wide.k.toFixed(3) + ')', wide.k > narrow.k);
  T.assert('and the price is never nothing', wide.k > 0.05 && narrow.k > 0.05);
  var mid = derive(newSpec({ wing: 0.5 }));
  var CLmid = (mid.Cm0 + mid.CmElev + mid.CmClip) / mid.margin;
  var induced = mid.k * CLmid * CLmid;
  T.assert('and at a trimmed glide it is a real share of the drag ('
    + (induced / (mid.CD0 + induced) * 100).toFixed(0) + ' percent)',
    induced / (mid.CD0 + induced) > 0.05);
  var up = derive(newSpec({ fins: 'up' })), none = derive(newSpec({ fins: 'none' }));
  T.assert('fins add drag', up.CD0 > none.CD0);
  T.assert('and yaw stability', up.yawStab > none.yawStab);
  var flat = derive(newSpec({ dihedral: 0 })), vee = derive(newSpec({ dihedral: 1 }));
  T.assert('a V shape rolls back level harder than a flat one', vee.rollStab > flat.rollStab * 2);
  var sloppy = derive(newSpec({ precision: 0 })), crisp = derive(newSpec({ precision: 1 }));
  T.assert('a sloppy fold is lopsided', Math.abs(sloppy.asym) > 0.4);

  /* positive elevator is the trailing edge UP, which pitches the nose up, which
     raises the lift the plane trims at */
  var upElev = derive(newSpec({ elev: 6 })), downElev = derive(newSpec({ elev: -6 }));
  T.assert('bending the elevators up raises the trim lift',
    (upElev.Cm0 + upElev.CmElev) / upElev.margin > (downElev.Cm0 + downElev.CmElev) / downElev.margin);
}

function suiteArchetypes(T) {
  var k, names = [];
  for (k in NAMED_SPECS) names.push(k);
  var i;
  for (i = 0; i < names.length; i++) {

    T.eq('the ' + key + ' fold flies like ' + ARCHETYPES[want].name
      + ' (swing ' + st.amp.toFixed(0) + ' deg, mean speed ' + st.vMean.toFixed(1)
      + ' m/s, ' + res.airtime.toFixed(1) + ' s, ' + res.distance.toFixed(1) + ' m)',
      got.id, want);
  }
  /* the shape of the flights, so a change that keeps the names but breaks the
     feel still goes red */
  var cr = flyNamed('cruiser'), crs = traceStats(cr);
  T.assert('a cruiser glides between four and twelve degrees (' + crs.descent.toFixed(1) + ')',
    crs.descent > 4 && crs.descent < 12);
  T.assert('and never stalls', cr.stalls === 0);
  T.assert('and lands eight to twenty five metres away (' + cr.distance.toFixed(1) + ')',
    cr.distance > 8 && cr.distance < 25);

  T.assert('THE PORPOISE swings more than eight degrees (' + pos.amp.toFixed(0) + ')', pos.amp > 8);
  T.assert('and its swing takes between 1.2 and 3.5 seconds (' + pos.period.toFixed(2) + ' s)',
    pos.period >= 1.2 && pos.period <= 3.5);
  T.assert('and it is trimmed far above the lift it can reach, which is WHY it porpoises ('
    + ((po.derived.Cm0 + po.derived.CmElev + po.derived.CmClip) / po.derived.margin).toFixed(2)
    + ' against a stall at ' + (po.derived.CLa * po.derived.alphaStall).toFixed(2) + ')',
    (po.derived.Cm0 + po.derived.CmElev + po.derived.CmClip) / po.derived.margin

}

function suiteTheFix(T) {

  for (i = 0; i < a.trace.length; i++) {
    var p = a.trace[i];
    if (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.theta) || !isFinite(p.V)) nan++;
  }
  T.eq('and there is no NaN anywhere in a flight', nan, 0);
  /* a flight always ends, whatever you hand it */
  var silly = fly(newSpec({ wing: 0, noseFolds: 1, nose: 'blunt', elev: 12, precision: 0, ail: 8 }),
    { angle: 40, power: 1 });
  T.assert('even a hopeless fold lands or gives up (' + silly.why + ' after '
    + silly.airtime.toFixed(1) + ' s)', silly.airtime <= CONFIG.FLIGHT_MAX_S && silly.why !== '');
}

function suiteCopy(T) {
  var k, bad = [];
  for (k in ARCHETYPES) {
    var a = ARCHETYPES[k];
    if (/[-‐-―−]/.test(a.name + ' ' + a.line)) bad.push('dash in ' + k);
    if ((a.name + a.line).indexOf('!') >= 0) bad.push('exclamation in ' + k);
    if (a.line.split(/[.?]\s+|[.?]$/).filter(function (x) { return x.trim().length > 1; }).length < 1) {
      bad.push(k + ' has no line');
    }
  }
  T.assert('every archetype is named and described without a dash or an exclamation point'
    + (bad.length ? ': ' + bad.join(', ') : ''), bad.length === 0);
  var n = 0;
  for (k in ARCHETYPES) n++;
  T.eq('there are six of them', n, 6);
  T.assert('and the porpoise page tells you what to do about it',
    /elevator/i.test(ARCHETYPES.porpoise.line));
}

function suitePurity(T, src) {
  var code = src.replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/^[ \t]*\/\/.*$/gm, ' ');
  T.assert('the comment stripper left the code behind', code.length > 8000);
  T.assert('and it took the prose with it', code.indexOf('ONE SOURCE OF TRUTH') < 0);
  T.assert('the SIM never rolls an unseeded die', code.indexOf('Math.random') < 0);
  T.assert('and never touches the document or the window',
    code.indexOf('document.') < 0 && code.indexOf('window.') < 0);
  T.assert('and has no clock of its own',
    code.indexOf('Date.now') < 0 && code.indexOf('performance.now') < 0);
  /* the one law of this game, as a grep: nothing computes a plane's physics for
     itself, they all ask derive */
  var derives = code.match(/derive\(/g) || [];
  T.assert('and derive is the only place a plane becomes physics (' + derives.length + ' callers)',
    derives.length >= 1 && code.indexOf('function derive(') >= 0);
}
