<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d2127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tarot Run: A Reading of Blades</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Forum&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TAROT RUN — THEATRICAL ART NOUVEAU
   Palette: velvet teal stage, cream cards, rose gold ornament.
   Suits get unique accents (vermilion / cobalt / silver / verdant).
   ========================================================================= */
:root{
  --bg-stage:        #0d2127;
  --bg-stage-deep:   #08161a;
  --bg-stage-rise:   #122a31;
  --velvet:          #1e3942;
  --footlight:       #d4a574;     /* rose gold */
  --footlight-glow:  #f4d8a4;
  --card-cream:      #f4ebd3;
  --card-cream-dim:  #d6c9a8;
  --ink-black:       #15121a;
  --ink-warm:        #2b1f1a;
  --ornament-gold:   #c4a572;
  --ornament-deep:   #8b6f3d;
  --aged-line:       #6b5a3d;
  --blood:           #a82736;
  --blood-bright:    #c63d4f;

  --suit-wands:      #c8443d;
  --suit-wands-deep: #7a2520;
  --suit-cups:       #3e7286;
  --suit-cups-deep:  #1f4a5c;
  --suit-swords:     #8b929b;
  --suit-swords-deep:#4a5158;
  --suit-pents:      #6a8157;
  --suit-pents-deep: #3d4f30;
  --suit-major:      #d4a574;
  --suit-major-deep: #8b6f3d;

  --font-display:    'Forum', 'Cormorant Garamond', serif;
  --font-body:       'Cormorant Garamond', 'Times New Roman', serif;
  --font-num:        'Playfair Display', 'Cormorant Garamond', serif;
  --font-mono:       'JetBrains Mono', monospace;

  --radius-card:     6px;
  --radius-soft:     3px;

  --t-fast:   180ms cubic-bezier(.4,0,.2,1);
  --t-slow:   420ms cubic-bezier(.16,1,.3,1);
  --t-reveal: 720ms cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0; height:100%;
  background: var(--bg-stage);
  color: var(--card-cream);
  font-family: var(--font-body);
  overflow:hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  font-size: 16px;
}
body{
  background:
    radial-gradient(ellipse 100% 60% at 50% 100%, rgba(212,165,116,0.13), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(31,74,92,0.20), transparent 60%),
    linear-gradient(180deg, var(--bg-stage-deep) 0%, var(--bg-stage) 30%, var(--bg-stage) 70%, var(--bg-stage-rise) 100%);
  position:relative;
}
/* Velvet grain noise overlay */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' stitchTiles='stitch' seed='3'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.65  0 0 0 0.040 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: 0.50; mix-blend-mode: overlay;
}
/* Footlight glow at bottom edge */
body::after{
  content:''; position:fixed; left:0; right:0; bottom:-60px; height:120px; pointer-events:none; z-index:1;
  background: radial-gradient(ellipse at 50% 100%, rgba(244,216,164,0.18), transparent 60%);
  filter: blur(8px);
}

#app{ position:relative; z-index:2; height:100%; width:100%; display:flex; flex-direction:column; }

/* ============== SCREEN MANAGEMENT ============== */
.screen{ display:none; position:absolute; inset:0; flex-direction:column; }
.screen.active{ display:flex; animation: screenIn var(--t-slow) ease-out; }
@keyframes screenIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* ============== TITLE SCREEN ============== */
#title-screen{ justify-content:space-between; align-items:center; padding:48px 24px 36px; text-align:center; }
.title-curtains-l, .title-curtains-r{
  position:absolute; top:0; bottom:0; width:42%; pointer-events:none; opacity:.32;
  background: repeating-linear-gradient(90deg, var(--velvet) 0 6px, var(--bg-stage-deep) 6px 14px);
  mask-image: linear-gradient(180deg, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, black 70%, transparent 100%);
}
.title-curtains-l{ left:0;  border-right: 1px solid rgba(196,165,114,0.18); transform: skewX(-3deg) translateX(-12px); }
.title-curtains-r{ right:0; border-left:  1px solid rgba(196,165,114,0.18); transform: skewX( 3deg) translateX( 12px); }

.title-mark{
  width: 220px; height: 220px; margin: 32px auto 0;
  background:
    radial-gradient(circle at center, rgba(212,165,116,0.18) 0%, transparent 60%),
    radial-gradient(circle at center, var(--ink-black) 30%, var(--bg-stage-deep) 60%, transparent 80%);
  border: 1px solid var(--ornament-gold);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  position:relative; z-index:3;
  box-shadow:
    inset 0 0 24px rgba(212,165,116,0.15),
    0 0 40px rgba(212,165,116,0.10);
}
.title-mark.placeholder::before{
  content: "✦"; font-size: 88px; color: var(--ornament-gold);
  text-shadow: 0 0 24px rgba(212,165,116,0.55);
}
.title-mark img{ width:88%; height:88%; object-fit:contain; }

.title-text{
  font-family: var(--font-display);
  font-size: 56px; line-height: 1;
  letter-spacing: 0.04em;
  color: var(--card-cream);
  text-shadow: 0 2px 8px rgba(0,0,0,0.55);
  margin: 24px 0 4px;
  position:relative; z-index:3;
}
.title-sub{
  font-family: var(--font-body); font-style:italic;
  font-size: 17px; color: var(--ornament-gold);
  letter-spacing: 0.10em; text-transform: lowercase;
  margin-bottom: 24px;
  position:relative; z-index:3;
}

.title-actions{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px; position:relative; z-index:3; }
.title-meta{
  color: var(--card-cream-dim); opacity: 0.70;
  font-size: 13px; font-style: italic;
  letter-spacing: 0.06em; position:relative; z-index:3;
  margin-top: 8px;
}

/* ============== BUTTONS ============== */
.btn{
  font-family: var(--font-display);
  font-size: 17px; letter-spacing: 0.10em;
  padding: 14px 28px;
  background: transparent;
  color: var(--card-cream);
  border: 1px solid var(--ornament-gold);
  border-radius: var(--radius-soft);
  cursor: pointer;
  text-transform: uppercase;
  position:relative;
  transition: all var(--t-fast);
  -webkit-appearance:none;
}
.btn::before, .btn::after{
  content:''; position:absolute; width:8px; height:8px;
  border: 1px solid var(--ornament-gold);
  transition: all var(--t-fast);
}
.btn::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.btn::after { bottom:-1px; right:-1px; border-left:none;  border-top:none; }
.btn:active{ background: rgba(212,165,116,0.10); transform: translateY(1px); }
.btn.primary{
  background: linear-gradient(180deg, var(--ornament-deep), var(--ornament-gold));
  color: var(--ink-black);
  border-color: var(--footlight-glow);
}
.btn.primary::before, .btn.primary::after{ border-color: var(--footlight-glow); }
.btn.danger{ border-color: var(--blood); color: var(--blood-bright); }
.btn.danger::before, .btn.danger::after{ border-color: var(--blood); }
.btn.tiny{ padding: 6px 12px; font-size: 12px; letter-spacing: 0.06em; }
.btn.dim{ opacity: 0.5; }
.rs-daily{ text-align:center; font-family:var(--font-display); letter-spacing:0.08em;
  color:var(--ornament-gold); margin-bottom:10px; font-size:15px; }
.btn.icon{ padding: 8px 12px; min-width: 40px; }
.btn:disabled{ opacity: 0.36; pointer-events: none; }

/* ============== HUD ============== */
.hud{
  display:flex; align-items:center; gap:10px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(212,165,116,0.20);
  background: linear-gradient(180deg, rgba(8,22,26,0.7), rgba(13,33,39,0.4));
  z-index:5; position:relative;
}
.hud-stat{
  display:inline-flex; align-items:center; gap:5px;
  font-family: var(--font-num);
  font-size: 13px;
  color: var(--card-cream);
  letter-spacing: 0.02em;
}
.hud-stat strong{
  font-family: var(--font-num); font-weight: 700;
  font-size: 17px; color: var(--card-cream);
}
.hud-stat .pip{ font-size: 11px; color: var(--ornament-gold); }
.hp-bar{
  flex: 1; height: 5px;
  background: var(--bg-stage-deep);
  border: 1px solid rgba(212,165,116,0.30);
  border-radius: 2px;
  overflow: hidden;
  min-width: 60px;
}
.hp-bar > div{
  height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--blood), var(--blood-bright));
  transition: width var(--t-slow);
}
.energy-cluster{
  display:inline-flex; gap:3px; align-items:center;
  font-family: var(--font-num);
  margin-left: auto;
}
.energy-pip{
  width:11px; height:11px; border-radius:50%;
  border: 1.5px solid var(--ornament-gold);
  background: radial-gradient(circle at 30% 30%, var(--footlight-glow), var(--ornament-deep));
  box-shadow: 0 0 6px rgba(212,165,116,0.55);
}
.energy-pip.spent{ background: var(--bg-stage-deep); box-shadow:none; opacity:0.5; }

/* ============== MAP / PATH SCREEN ============== */
#map-screen{ padding: 0; }
.map-header{
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgba(212,165,116,0.15);
  display:flex; align-items:center; gap:10px;
}
.map-title{
  font-family: var(--font-display); font-size: 18px;
  letter-spacing: 0.08em; color: var(--card-cream);
}
.map-body{
  flex:1; overflow-y:auto; padding: 8px 0 32px;
  position:relative;
}
.map-rooms{
  display:flex; flex-direction:column-reverse;
  gap: 14px; padding: 22px 16px;
}
.map-row{
  display:flex; justify-content:center; gap: 24px;
  position:relative;
}
.room-node{
  position:relative;
  width: 58px; height: 58px;
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(circle, var(--bg-stage-rise) 30%, var(--bg-stage-deep) 100%);
  border: 1.5px solid var(--ornament-deep);
  font-size: 22px; color: var(--card-cream-dim);
  cursor: pointer;
  transition: all var(--t-fast);
}
.room-node.combat{ border-color: var(--suit-wands); color: var(--suit-wands); }
.room-node.elite { border-color: var(--blood); color: var(--blood-bright); box-shadow: 0 0 14px rgba(168,39,54,0.35); }
.room-node.event { border-color: var(--ornament-gold); color: var(--ornament-gold); }
.room-node.treasure{ border-color: var(--footlight-glow); color: var(--footlight-glow); background: radial-gradient(circle, rgba(212,165,116,0.18), var(--bg-stage-deep)); }
.room-node.rest  { border-color: var(--suit-cups); color: var(--suit-cups); }
.room-node.boss  { border-color: var(--blood-bright); color: var(--blood-bright); width:74px; height:74px; font-size:32px;
  box-shadow: 0 0 22px rgba(198,61,79,0.45); }
/* B23 — path BEHIND: small, drained, ✓-stamped. Unmistakably spent. */
.room-node.completed{
  pointer-events:none;
  opacity: 0.6;
  transform: scale(0.74);
  filter: grayscale(1) brightness(0.7);
  border-color: var(--ornament-deep) !important;
  color: var(--suit-cups) !important;          /* the ✓ reads as cleared */
  background: radial-gradient(circle, rgba(40,52,54,0.6), var(--bg-stage-deep)) !important;
  box-shadow: none !important;
}
.room-node.completed .room-label{ opacity: 0.4; }
/* the LIVE choice: big, bright, full-colour, beckoning. */
.room-node.accessible{
  opacity: 1;
  transform: scale(1.08);
  border-width: 2.5px;
  box-shadow: 0 0 0 3px rgba(244,216,164,0.18), 0 0 20px rgba(244,216,164,0.6);
  animation: nodeBeckon 1.7s ease-in-out infinite;
}
/* path AHEAD: present but clearly untrodden — cool, dim, no ✓. */
.room-node.locked{
  pointer-events:none;
  opacity: 0.4;
  filter: saturate(0.5) brightness(0.85);
}
.room-here{
  position:absolute; top:-20px; left:50%; transform:translateX(-50%);
  font-family: var(--font-body); font-size:10px; font-style:italic;
  letter-spacing:0.04em; color: var(--footlight-glow);
  white-space:nowrap; text-shadow:0 0 6px rgba(0,0,0,0.8);
}
@keyframes currentPulse{
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes nodeBeckon{
  0%,100% { box-shadow: 0 0 8px rgba(212,165,116,0.20); }
  50% { box-shadow: 0 0 16px rgba(212,165,116,0.55); }
}
.room-label{
  position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  font-family: var(--font-body); font-style:italic;
  font-size: 11px; color: var(--card-cream-dim);
  white-space: nowrap;
}
/* connector lines */
.map-connector{
  position:absolute; top:50%; left:50%;
  width: 24px; height: 1px;
  background: linear-gradient(90deg, var(--ornament-deep), transparent);
  transform-origin: 0 0;
  pointer-events:none;
}

/* ============== COMBAT SCREEN ============== */
#combat-screen{ overflow:hidden; }
.combat-stage{
  flex: 1;
  position: relative;
  padding: 14px 16px 4px;
  display:flex; flex-direction:column;
  overflow:hidden;
  min-height: 0;
}
.reading-strip{
  display:flex; gap: 8px; justify-content:center;
  margin: 4px 0 8px;
}
.reading-card{
  width: 60px; height: 72px;
  border-radius: 4px;
  background: linear-gradient(160deg, var(--ink-black), var(--velvet));
  border: 1px solid var(--ornament-deep);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
  cursor: pointer;
  transition: all var(--t-fast);
  font-family: var(--font-body);
}
.reading-card.revealed{
  background: linear-gradient(160deg, var(--card-cream), var(--card-cream-dim));
  border-color: var(--ornament-gold);
  color: var(--ink-black);
}
.reading-card .rd-pos{
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
  font-style: italic; opacity: 0.7; margin-top: 2px;
}
.reading-card .rd-name{
  font-family: var(--font-display); font-size: 9px;
  text-align: center; line-height: 1.05;
  padding: 0 3px;
}
.reading-card.revealed .rd-pos{ color: var(--ornament-deep); }
.reading-card.fool::after, .reading-card.major::after{
  content: '✦'; position:absolute; top:2px; right:3px; font-size:8px; color: var(--ornament-gold);
}
/* B17 — The Prophecy: Past/Present/Future as a foretold suit sequence */
.reading-card .rd-glyph{ font-family: var(--font-display); font-size: 20px; line-height: 1; }
.reading-card .rd-suit{
  font-family: var(--font-display); font-size: 8px; letter-spacing: 0.04em;
  text-transform: uppercase; margin-top: 2px; opacity: 0.9; white-space: nowrap;
}
.reading-card.pf-wait{ opacity: 0.42; }
.reading-card.pf-active{
  border-color: var(--ornament-gold); color: var(--ornament-gold);
  animation: pfPulse 1.3s ease-in-out infinite;
}
.reading-card.pf-active::after{
  content: '▶'; position:absolute; top:2px; right:3px; font-size:8px; color: var(--ornament-gold);
}
.reading-card.pf-done{
  background: linear-gradient(160deg, var(--card-cream), var(--card-cream-dim));
  color: var(--ink-black); border-color: var(--ornament-gold);
}
.reading-card.pf-done .rd-pos{ color: var(--ornament-deep); }
@keyframes pfPulse{
  0%,100%{ box-shadow: 0 0 7px rgba(212,175,99,0.40); }
  50%    { box-shadow: 0 0 16px rgba(212,175,99,0.85); }
}

/* The Cut — active Reading skill (pre-combat) */
#cut-overlay{
  position:fixed; inset:0; z-index:90;
  background: radial-gradient(circle at 50% 34%, rgba(20,40,46,0.97), rgba(7,14,18,0.99));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:24px; text-align:center; font-family: var(--font-body);
  animation: cutIn 220ms ease-out;
}
#cut-overlay.out{ animation: cutOut 340ms ease-in forwards; }
@keyframes cutIn{ from{opacity:0; transform:scale(0.98)} to{opacity:1; transform:scale(1)} }
@keyframes cutOut{ from{opacity:1} to{opacity:0} }
.cut-title{
  font-family: var(--font-display); font-size:23px; letter-spacing:0.16em;
  text-transform:uppercase; color: var(--ornament-gold);
}
.cut-sub{ font-size:13px; font-style:italic; opacity:0.72; max-width:300px; line-height:1.4; }
.cut-strip{ display:flex; gap:8px; padding:18px 8px; }
.cut-slot{
  width:46px; height:70px; border-radius:5px;
  background: linear-gradient(160deg, var(--ink-black), var(--velvet));
  border:1px solid var(--ornament-deep);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size:22px; color: var(--ornament-deep);
  transition: transform 110ms ease, border-color 110ms, box-shadow 110ms;
}
.cut-slot.lit{
  transform: translateY(-9px);
  border-color: var(--ornament-gold); color: var(--ornament-gold);
  box-shadow: 0 0 18px rgba(212,175,99,0.55);
}
.cut-slot.flip{
  background: linear-gradient(160deg, var(--card-cream), var(--card-cream-dim));
  color: var(--ink-black); border-color: var(--ornament-gold);
  transform: translateY(-9px) scale(1.06);
}
.cut-btn{
  margin-top:4px; font-family: var(--font-display); font-size:18px;
  letter-spacing:0.2em; text-transform:uppercase;
  padding:14px 44px; border-radius:6px; cursor:pointer;
  background: var(--ornament-gold); color: var(--ink-black);
  border:none; transition: transform 90ms;
}
.cut-btn:active{ transform: scale(0.96); }
.cut-result{
  min-height:24px; font-family: var(--font-display); font-size:16px;
  letter-spacing:0.05em; color: var(--card-cream); max-width:320px; line-height:1.4;
}
.cut-result strong{ color: var(--ornament-gold); }

.enemy-zone{
  flex: 1;
  min-height: 0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative;
}
.enemy-portrait{
  width: 175px; height: 175px;
  background: radial-gradient(circle at 50% 40%, var(--velvet), var(--bg-stage-deep));
  border: 1px solid var(--ornament-deep);
  border-radius: 8px;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  box-shadow: 0 6px 24px rgba(0,0,0,0.45), inset 0 0 22px rgba(0,0,0,0.55);
  margin-bottom: 8px;
}
.enemy-portrait.placeholder::before{
  content: attr(data-glyph);
  font-size: 78px; color: var(--ornament-gold);
  opacity: 0.85;
  text-shadow: 0 0 18px rgba(212,165,116,0.45);
}
.enemy-portrait img{ width:100%; height:100%; object-fit:cover; border-radius:7px; }
.enemy-portrait.hit{ animation: enemyHit 280ms ease-out; }
@keyframes enemyHit{
  0% { transform: translate(0,0); filter: brightness(1); }
  20% { transform: translate(-6px, 2px); filter: brightness(1.4) saturate(1.5); }
  40% { transform: translate(5px, -3px); }
  60% { transform: translate(-3px, 1px); }
  100% { transform: translate(0,0); filter: brightness(1); }
}
/* B14 — enemy ATTACKING the player: a walked-through strike, not a flash */
.enemy-portrait.attacking{ animation: enemyAttack 440ms cubic-bezier(.5,-0.35,.3,1.4); z-index:6; }
@keyframes enemyAttack{
  0%   { transform: translate(0,0) scale(1); }
  35%  { transform: translate(0,-12px) scale(1.06); filter: brightness(1.5) saturate(1.4); }
  56%  { transform: translate(-4px,40px) scale(1.13); filter: brightness(1.8); }
  72%  { transform: translate(0,26px) scale(1.08); }
  100% { transform: translate(0,0) scale(1); filter: brightness(1); }
}
.combat-shake{ animation: shake 380ms ease-in-out; }
#strike-fx{ position:fixed; inset:0; z-index:80; pointer-events:none;
  display:flex; align-items:center; justify-content:center; }
#strike-fx .sfx-flash{ position:absolute; inset:0;
  background: radial-gradient(circle at 50% 58%, rgba(150,16,16,0) 28%, rgba(150,16,16,0.40) 100%);
  animation: sfxFlash 520ms ease-out forwards; }
#strike-fx .sfx-flash.soft{ background: radial-gradient(circle at 50% 58%, rgba(150,16,16,0) 40%, rgba(120,90,30,0.30) 100%); }
#strike-fx .sfx-slash{ position:absolute; left:50%; top:54%; width:128%; height:5px;
  background: linear-gradient(90deg, transparent, rgba(255,212,172,0.95), transparent);
  transform: translate(-50%,-50%) rotate(-17deg) scaleX(0);
  animation: sfxSlash 360ms ease-out forwards; }
#strike-fx .sfx-num{ font-family: var(--font-display); font-size:54px; font-weight:700;
  color: var(--blood-bright); text-shadow:0 2px 14px rgba(0,0,0,.85);
  animation: sfxNum 920ms ease-out forwards; }
#strike-fx .sfx-num.blocked{ color: var(--ornament-gold); font-size:32px; }
@keyframes sfxFlash{ 0%{opacity:0} 22%{opacity:1} 100%{opacity:0} }
/* B21 — Aspect detonation bloom (suit-tinted; tint set inline) */
#aspect-fx{ position:fixed; inset:0; z-index:79; pointer-events:none;
  animation: aspectBloom 760ms ease-out forwards; }
@keyframes aspectBloom{ 0%{opacity:0; transform:scale(1.06)} 26%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(1)} }
@keyframes sfxSlash{ 0%{transform:translate(-50%,-50%) rotate(-17deg) scaleX(0);opacity:0}
  42%{opacity:1} 62%{transform:translate(-50%,-50%) rotate(-17deg) scaleX(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-17deg) scaleX(1)} }
@keyframes sfxNum{ 0%{transform:translateY(22px) scale(.6);opacity:0}
  24%{transform:translateY(0) scale(1.15);opacity:1} 68%{opacity:1}
  100%{transform:translateY(-36px) scale(1);opacity:0} }
/* B14 — banish: the chosen card is destroyed on-screen (it WAS your pick) */
.card-destroy{ pointer-events:none; animation: cardDestroy 760ms ease-in forwards; }
@keyframes cardDestroy{
  0%   { transform: translateY(0) scale(1) rotate(0); filter: brightness(1); opacity:1; }
  24%  { transform: translateY(-28px) scale(1.09) rotate(-3deg); filter: brightness(1.7) saturate(1.6); }
  54%  { transform: translateY(-14px) scale(1.02) rotate(3deg); filter: brightness(2.1) sepia(.6) hue-rotate(-18deg); opacity:.9; }
  100% { transform: translateY(30px) scale(.55) rotate(9deg); filter: brightness(.15) blur(3px); opacity:0; }
}

.enemy-name{
  font-family: var(--font-display); font-size: 20px;
  letter-spacing: 0.06em; color: var(--card-cream);
  margin-bottom: 4px; text-align:center;
}
.enemy-intent{
  font-family: var(--font-body);
  letter-spacing: 0.02em;
  margin: 4px auto 8px; min-height: 18px;
  text-align:center;
}
.enemy-intent.intent-card{
  display:inline-block; padding: 6px 16px 7px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(0,0,0,0.28);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.3) inset;
}
.enemy-intent .intent-head{
  display:flex; align-items:center; justify-content:center; gap:6px;
  line-height: 1;
}
.enemy-intent .intent-icon{ font-size: 22px; }
.enemy-intent .intent-dmg{
  font-family: var(--font-display);
  font-size: 30px; font-weight: 700; line-height: 1;
}
.enemy-intent .intent-x{ font-size: 16px; opacity: 0.85; margin-left: 2px; }
.enemy-intent .intent-sub{
  font-size: 12px; font-style: italic; margin-top: 3px;
  color: var(--card-cream); opacity: 0.92;
}
.enemy-intent .intent-sub b{ font-style: normal; letter-spacing: 0.04em; }
.enemy-intent .intent-warn{ color:#ff8a7a; font-style:normal; font-weight:600; }
.enemy-intent .intent-ok{ color:#7ad6a0; font-style:normal; }
/* threat tiers */
.intent-safe   { color: var(--ornament-gold); }
.intent-safe   .intent-dmg,.intent-safe   .intent-icon{ color: var(--ornament-gold); }
.intent-danger { border-color: rgba(255,138,122,0.55) !important; }
.intent-danger .intent-dmg,.intent-danger .intent-icon{ color:#ff8a7a; }
.intent-lethal { border-color:#ff5a4a !important; background: rgba(120,20,15,0.4) !important;
  animation: intentPulse 1.1s ease-in-out infinite; }
.intent-lethal .intent-dmg,.intent-lethal .intent-icon{ color:#ff5a4a; }
@keyframes intentPulse{ 0%,100%{ box-shadow:0 0 0 1px rgba(255,90,74,0.3) inset; }
  50%{ box-shadow:0 0 14px 1px rgba(255,90,74,0.6); } }
.enemy-hp-row{ display:flex; align-items:center; gap:8px; width: 220px; }
.enemy-hp-row .hp-bar{ flex:1; }
.enemy-hp-row .hp-num{
  font-family: var(--font-num); font-size: 15px;
  color: var(--card-cream); min-width: 60px; text-align:right;
}
.enemy-block{
  display:inline-flex; align-items:center; gap:3px;
  font-family: var(--font-num); font-size: 13px;
  color: var(--suit-swords); margin-left:6px;
}

.player-status{
  display:flex; gap: 8px; justify-content:center;
  margin-top: 4px; min-height: 22px;
}
.status-pip{
  display:inline-flex; align-items:center; gap: 3px;
  padding: 2px 7px;
  background: rgba(8,22,26,0.6);
  border: 1px solid var(--ornament-deep);
  border-radius: 10px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--card-cream);
}
.status-pip.block{ border-color: var(--suit-swords); color: var(--suit-swords); }
.status-pip.buff{ border-color: var(--suit-pents); color: var(--suit-pents); }
.status-pip.debuff{ border-color: var(--blood-bright); color: var(--blood-bright); }
.status-pip.aspect{ border-color: var(--ornament-gold); color: var(--footlight-glow); }

/* damage / heal pop */
.damage-pop{
  position:fixed;
  font-family: var(--font-display); font-size: 38px;
  color: var(--blood-bright);
  text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 18px rgba(198,61,79,0.55);
  pointer-events:none;
  animation: dmgPop 900ms ease-out forwards;
  z-index: 60;
}
.damage-pop.heal{ color: var(--suit-cups); text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 18px rgba(62,114,134,0.55); }
.damage-pop.block{ color: var(--suit-swords); text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
@keyframes dmgPop{
  0% { opacity: 0; transform: translateY(0) scale(0.5); }
  18% { opacity: 1; transform: translateY(-14px) scale(1.18); }
  100% { opacity: 0; transform: translateY(-72px) scale(0.92); }
}

/* B19 — player-side juice: HUD reads YOUR state, it no longer just snaps.
   Heal/Block float off your HUD (not the enemy); the HP/Block numbers
   pulse on change; your shield SHATTERS when it's spent (was: silent
   display:none). All UI-only, rAF/DOM-guarded — engine/tests untouched. */
@keyframes hudHit  { 0%{transform:none} 28%{transform:scale(1.4); color:var(--blood-bright)} 100%{transform:none; color:var(--card-cream)} }
@keyframes hudHeal { 0%{transform:none} 28%{transform:scale(1.4); color:var(--suit-cups)}    100%{transform:none; color:var(--card-cream)} }
@keyframes hudGain { 0%{transform:none} 35%{transform:scale(1.45) translateY(-2px)}           100%{transform:none} }
#hud-hp.flash-dmg  { animation: hudHit  460ms ease-out; }
#hud-hp.flash-heal { animation: hudHeal 520ms ease-out; }
#enemy-hp.flash-dmg{ display:inline-block; animation: hudHit 420ms ease-out; }
.block-stat.gain   { animation: hudGain 420ms ease-out; }
.block-stat.broke  { animation: shake 320ms ease-in-out; }
#shield-shatter{ position:fixed; z-index:82; pointer-events:none; }
#shield-shatter .shard{
  position:absolute; left:0; top:0; width:7px; height:9px;
  background: linear-gradient(135deg, var(--suit-swords), #d2dde2);
  box-shadow: 0 0 6px rgba(120,150,165,0.75);
  animation: shardFly 560ms ease-out forwards;
}
@keyframes shardFly{
  0%  { opacity:1; transform: translate(0,0) rotate(0); }
  100%{ opacity:0; transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); }
}
/* B23 — the turn transition is now SEEN: the old hand sweeps to the
   discard pile, the new hand deals in. (Cards used to just vanish.) */
.discard-fly{
  position:fixed; z-index:76; pointer-events:none; margin:0;
  border-radius: var(--radius-soft);
  transition: transform 460ms cubic-bezier(.55,0,.7,1), opacity 460ms ease-in;
}
.hand .card.dealt{ animation: handDealIn 300ms ease-out backwards; }
@keyframes handDealIn{
  0%   { opacity:0; transform: translateY(54px) scale(0.9); }
  100% { opacity:1; transform: none; }
}
.et-disc{ font-size:11px; color: var(--footlight-glow); opacity:0.92; margin-left:4px; }

/* aspect banner */
.aspect-banner{
  position:absolute; left:50%; top:38%; transform: translate(-50%, -50%);
  padding: 10px 32px;
  background: linear-gradient(90deg, transparent, var(--ornament-deep), transparent);
  color: var(--card-cream);
  font-family: var(--font-display);
  font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
  text-shadow: 0 0 12px rgba(0,0,0,0.85);
  pointer-events:none;
  opacity: 0;
  z-index: 25;
}
.aspect-banner.show{ animation: aspectShow 1600ms ease-out forwards; }
@keyframes aspectShow{
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  20%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
}

@keyframes shake{
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px) rotate(-1deg); }
  40% { transform: translateX(4px) rotate(1deg); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* ============== HAND ============== */
.hand-zone{
  position:relative;
  padding: 8px 6px 8px;
  border-top: 1px solid rgba(212,165,116,0.15);
  background: linear-gradient(180deg, rgba(13,33,39,0.3), rgba(8,22,26,0.7));
  min-height: 200px;
  flex-shrink: 0;
}
.hand{
  display:flex; gap: 6px;
  justify-content: safe center; align-items:flex-end;
  position: relative;
  min-height: 170px;
  /* B16 — a big hand now scrolls instead of spilling off-screen */
  overflow-x: auto; overflow-y: hidden;
  padding: 24px 12px 6px;            /* headroom so the lifted card isn't clipped */
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}
.hand > .card{ flex: 0 0 auto; scroll-snap-align: center; }
.hand::-webkit-scrollbar{ height: 5px; }
.hand::-webkit-scrollbar-thumb{ background: rgba(212,165,116,0.45); border-radius: 3px; }
.hand::-webkit-scrollbar-track{ background: transparent; }
.card{
  width: 92px; min-width: 92px;
  height: 138px;
  background: linear-gradient(170deg, var(--card-cream) 0%, var(--card-cream-dim) 100%);
  border: 1px solid var(--ornament-deep);
  border-radius: var(--radius-card);
  position:relative;
  cursor: pointer;
  transition: transform var(--t-fast), box-shadow var(--t-fast), filter var(--t-fast);
  margin-left: -22px;
  padding: 6px 5px 4px;
  color: var(--ink-black);
  box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(212,165,116,0.30);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.card:first-child{ margin-left: 0; }
.card.playable:active{ transform: translateY(-6px) scale(1.02); }
.card.playable{ filter: brightness(1.04); }
.card.unplayable{ filter: brightness(0.7) grayscale(0.4); }
.card.peek-discard{ filter: brightness(0.55) grayscale(0.7); opacity:0.6;
  outline:2px solid var(--blood); outline-offset:-2px; }
.card.selected{
  transform: translateY(-18px);
  box-shadow: 0 8px 22px rgba(212,165,116,0.45), 0 0 14px rgba(212,165,116,0.30);
  z-index: 10;
}
.card.reversed{ transform: rotate(180deg); }
.card.reversed.selected{ transform: rotate(180deg) translateY(-18px); }
/* B15 — fate-reversed in hand: readable (no flip), marked by a ribbon */
.card.fate-rev{ filter: sepia(0.32) hue-rotate(-12deg) brightness(0.93); }
.card.fate-rev .card-art{ filter: grayscale(0.28); }
/* B24 — the SHADOW face: a cold inverted tint, clearly "the other half" */
.card.shadow{ filter: hue-rotate(150deg) saturate(0.7) brightness(0.92); }
.card.shadow .card-art{ filter: invert(0.08) brightness(0.85); }
.card.shadow .card-desc{ color: #cfe3e8; }
.fate-ribbon.shadow-ribbon{
  background: linear-gradient(90deg, rgba(40,86,104,0.92), rgba(28,64,82,0.92));
}
.fate-ribbon{
  position:absolute; left:0; right:0; bottom:0;
  background: linear-gradient(90deg, rgba(150,16,16,0.88), rgba(120,28,28,0.88));
  color: var(--card-cream); font-family: var(--font-display);
  font-size: 8px; letter-spacing: 0.12em; text-align:center; padding:2px 0;
  border-bottom-left-radius:7px; border-bottom-right-radius:7px; pointer-events:none;
}
.card-cost.cost-fate{ box-shadow: 0 0 9px rgba(150,16,16,0.85); }
.card-cost{
  position:absolute; top: 3px; left: 4px;
  width: 22px; height: 22px;
  background: radial-gradient(circle at 30% 30%, var(--footlight-glow), var(--ornament-gold) 60%, var(--ornament-deep));
  border: 1px solid var(--ink-warm);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-num); font-size: 14px; font-weight: 700;
  color: var(--ink-black);
  box-shadow: 0 0 6px rgba(212,165,116,0.6);
  z-index:2;
}
/* Cost inflated by the Chain tax — make the decision visible */
.card-cost.cost-taxed{
  background: radial-gradient(circle at 30% 30%, #ffd27a, #e8682f 62%, #7a1f12);
  color:#fff; border-color:#ff8a4a;
  box-shadow: 0 0 9px rgba(232,104,47,0.85);
  animation: taxPulse 1.2s ease-in-out infinite;
}
@keyframes taxPulse{ 0%,100%{ box-shadow:0 0 6px rgba(232,104,47,0.6);} 50%{ box-shadow:0 0 12px 2px rgba(232,104,47,0.95);} }
.card-art{
  width: 100%; height: 56px;
  background: linear-gradient(160deg, var(--velvet), var(--bg-stage-deep));
  border: 1px solid var(--aged-line);
  border-radius: var(--radius-soft);
  display:flex; align-items:center; justify-content:center;
  margin-top: 16px;
  position: relative;
  overflow: hidden;
}
.card-art.placeholder::before{
  content: attr(data-glyph);
  font-family: var(--font-display); font-size: 30px;
  color: var(--ornament-gold);
  opacity: 0.85;
}
.card-art img{ width:100%; height:100%; object-fit: cover; }
.card-name{
  font-family: var(--font-display);
  font-size: 10px; text-align:center;
  letter-spacing: 0.04em;
  margin-top: 4px; padding: 0 2px;
  line-height: 1.1;
  text-transform: uppercase;
  color: var(--ink-black);
  min-height: 22px;
  display:flex; align-items:center; justify-content:center;
}
.card-desc{
  font-family: var(--font-body); font-style: italic;
  font-size: 9px; line-height: 1.15;
  text-align: center;
  color: var(--ink-warm);
  padding: 0 2px;
  flex:1;
  overflow:hidden;
}
.card-suit-mark{
  position:absolute; bottom: 3px; right: 4px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.card.suit-wands{ border-color: var(--suit-wands-deep); }
.card.suit-wands .card-name{ color: var(--suit-wands-deep); }
.card.suit-wands .card-suit-mark{ color: var(--suit-wands); }
.card.suit-cups{ border-color: var(--suit-cups-deep); }
.card.suit-cups .card-name{ color: var(--suit-cups-deep); }
.card.suit-cups .card-suit-mark{ color: var(--suit-cups); }
.card.suit-swords{ border-color: var(--suit-swords-deep); }
.card.suit-swords .card-name{ color: var(--suit-swords-deep); }
.card.suit-swords .card-suit-mark{ color: var(--suit-swords); }
.card.suit-pents{ border-color: var(--suit-pents-deep); }
.card.suit-pents .card-name{ color: var(--suit-pents-deep); }
.card.suit-pents .card-suit-mark{ color: var(--suit-pents); }
.card.suit-curse{
  background: linear-gradient(170deg, #2a2630, #16131a);
  border-color: #4a4350;
  box-shadow: inset 0 0 18px rgba(0,0,0,0.6);
}
.card.suit-curse .card-name{ color: #b9a7c4; font-family: var(--font-display); }
.card.suit-curse .card-suit-mark,
.card.suit-curse .card-cost{ color: #7d6f8a; }
.card.suit-curse .card-art{ background: radial-gradient(circle at 50% 40%, #322b3a, #100d14); }
.card.suit-major{
  background: linear-gradient(170deg, #f8e9ba, #e0c87f);
  border-color: var(--ornament-gold);
  box-shadow: 0 4px 12px rgba(212,165,116,0.40), inset 0 0 0 1px var(--footlight-glow);
}
.card.suit-major .card-name{ color: var(--ink-black); font-family: var(--font-display); }
.card.suit-major .card-suit-mark{ color: var(--ornament-deep); }
.card.suit-major .card-art{
  background: linear-gradient(160deg, var(--velvet), var(--ink-black));
  border-color: var(--ornament-gold);
}

.card-pips{
  position:absolute; top: 6px; right: 4px;
  font-family: var(--font-num); font-size: 12px; font-weight: 700;
  color: inherit;
}

.hand-controls{
  display:flex; justify-content:space-between; align-items:center;
  padding: 6px 12px 0;
}
.pile-stat{
  display:flex; flex-direction:column; align-items:center;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--card-cream-dim);
  letter-spacing: 0.05em;
}
.pile-stat strong{
  font-family: var(--font-num); font-size: 16px;
  color: var(--card-cream);
}
.pile-stat.tappable{ cursor:pointer; }
.pile-stat.tappable:active{ color: var(--footlight-glow); }

/* ============== MODAL ============== */
.modal-veil{
  position: fixed; inset: 0;
  background: rgba(8,22,26,0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 50;
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-veil.active{ display:flex; animation: modalFade var(--t-slow) ease-out; }
@keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
.modal{
  background: linear-gradient(170deg, var(--bg-stage-rise) 0%, var(--bg-stage-deep) 100%);
  border: 1px solid var(--ornament-gold);
  padding: 24px 22px;
  border-radius: 8px;
  max-width: 380px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}
.modal::before, .modal::after{
  content:''; position:absolute; width:18px; height:18px;
  border: 1px solid var(--ornament-gold);
}
.modal::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.modal::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.modal-title{
  font-family: var(--font-display);
  font-size: 24px; letter-spacing: 0.06em;
  text-align: center;
  color: var(--card-cream);
  margin-bottom: 6px;
}
.modal-sub{
  font-family: var(--font-body); font-style: italic;
  font-size: 14px; text-align: center;
  color: var(--ornament-gold);
  margin-bottom: 16px;
}
.modal-body{
  color: var(--card-cream); line-height: 1.5;
  font-size: 15px;
  margin-bottom: 16px;
  text-align: center;
}
.modal-choices{ display:flex; flex-direction: column; gap: 10px; }
/* B30 — end-of-run summary (The Reckoning) */
.rs-row{ display:flex; justify-content:space-between; align-items:baseline;
  padding:5px 10px; border-bottom:1px solid rgba(212,165,116,0.14);
  font-size:14px; color:var(--card-cream); text-align:left; }
.rs-row span{ color:rgba(244,234,212,0.72); }
.rs-row b{ color:var(--ornament-gold); font-variant-numeric:tabular-nums; }
.rs-score{ margin-top:14px; text-align:center; font-family:var(--font-display);
  letter-spacing:0.08em; color:var(--card-cream); font-size:17px; }
.rs-score b{ color:var(--footlight-glow); font-size:26px; display:block; margin-top:2px; }
.rs-record{ display:inline-block; margin-top:4px; color:#ffd36a;
  text-shadow:0 0 10px rgba(255,211,106,0.6); font-size:14px; letter-spacing:0.1em; }
.rs-best{ display:inline-block; margin-top:4px; color:rgba(212,165,116,0.7); font-size:13px; }
.rs-veil{ text-align:center; margin-bottom:14px; padding:10px;
  border:1px solid var(--ornament-gold); border-radius:6px;
  background:radial-gradient(circle at 50% 0%, rgba(212,165,116,0.18), transparent 70%);
  color:#ffd36a; font-family:var(--font-display); letter-spacing:0.1em;
  text-shadow:0 0 12px rgba(255,211,106,0.5); animation: rsVeilGlow 1.4s ease-in-out infinite alternate; }
.rs-veil-sub{ margin-top:5px; font-size:12px; font-family:var(--font-body); font-style:italic;
  color:var(--card-cream); letter-spacing:0; text-shadow:none; }
@keyframes rsVeilGlow{ from{ box-shadow:0 0 6px rgba(255,211,106,0.2); } to{ box-shadow:0 0 18px rgba(255,211,106,0.5); } }
.modal-choice{
  display: flex; align-items:center; gap: 10px;
  padding: 10px 14px;
  background: rgba(13,33,39,0.5);
  border: 1px solid var(--ornament-deep);
  border-radius: var(--radius-soft);
  cursor: pointer;
  transition: all var(--t-fast);
}
.modal-choice:active{ background: rgba(212,165,116,0.10); transform: translateY(1px); }
.modal-choice .mc-icon{ font-size: 24px; color: var(--ornament-gold); }
.modal-choice .mc-text{ flex:1; }
.modal-choice .mc-text strong{ display:block; font-family: var(--font-display); font-size:14px; letter-spacing:0.04em; }

/* ===== Sky Wolf Studios embed protocol =====
   The portal (lucidwinds.com/portal/) frames games with ?embed=1 and
   listens for {sws:'ready'} and {sws:'close'}.
   Rules when embedded:
     - NEVER history.back() or navigate location — an iframe with no
       history entry goes blank (the black-screen bug).
     - The in-game back/X returns to the game's OWN menu screen.
     - Only the menu's explicit exit control calls SWS_EXIT(). */
(function(){
  var SWS_EMBED=/[?&]embed=1(&|$)/.test(location.search);
  window.SWS_EMBED=SWS_EMBED;
  window.SWS_EXIT=function(){
    if(SWS_EMBED&&parent!==window){try{parent.postMessage({sws:'close'},'*');}catch(e){} return;}
    /* Came from the arcade: step back so the portal is restored instantly
       instead of reloading a large page and losing its scroll. */
    if(document.referrer.indexOf('/portal')>=0&&history.length>1){history.back();return;}
    location.href='https://lucidwinds.com/portal/';
  };
  if(SWS_EMBED&&parent!==window){try{parent.postMessage({sws:'ready'},'*');}catch(e){}}
})();

<script>
/* =========================================================================
   TAROT RUN
   Single-file vanilla JS PWA roguelite deckbuilder.
   78 unique tarot cards, branching path, energy-based combat,
   the Reading mechanic, suit aspects, reversed cards.
   ========================================================================= */

const VERSION = 1;
const BUILD = 'B37 · DEEPER VEILS';  // visible on title; read it back to confirm you're current
const SAVE_KEY = 'tarot-run-v1';

/* ----- SEEDABLE RNG ----- */
function mulberry32(a){
  return function(){
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function strHash(s){
  let h = 1779033703 ^ s.length;
  for(let i=0;i<s.length;i++){
    h = Math.imul(h^s.charCodeAt(i), 3432918353);
    h = (h<<13)|(h>>>19);
  }
  return h >>> 0;
}
function shuffleInPlace(arr, rng){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function pickRand(arr, rng){ return arr[Math.floor(rng()*arr.length)]; }

/* =====================================================================
   1. CARDS — 78 UNIQUE TAROT CARDS
   ===================================================================== */

/* Card data model:
   {
     id:        unique string
     name:      display name (e.g. "Three of Cups")
     suit:      'wands' | 'cups' | 'swords' | 'pents' | 'major'
     arcanaNum: 0-21 for major; 1-14 for minor (Ace=1, Page=11, Knight=12, Queen=13, King=14)
     cost:      energy cost to play (0-3)
     glyph:     unicode fallback for art
     desc:      short text shown on card face
     flavor:    italic flavor text
     play:      (ctx) => { mutate combat state; return result obj }
     starter:   true → in opening deck
     rarity:    'starter' | 'common' | 'uncommon' | 'rare'
     reversedDesc:  optional flipped variant text
     reversedPlay:  optional flipped variant function
   }
*/

const SUIT_GLYPH = { wands:'⚸', cups:'☥', swords:'⚔', pents:'⛤', major:'✦', curse:'⊘' };
const SUIT_NAME  = { wands:'Wands', cups:'Cups', swords:'Swords', pents:'Pentacles', major:'Major', curse:'Curse' };

/* Minor Arcana generator. Each suit has its own theme:
   - Wands  (Fire) : attack and burn
   - Cups   (Water): heal, draw, sustain
   - Swords (Air)  : pierce (ignore block), debuff
   - Pents  (Earth): block, armor, gold

   Numerical scaling: Ace through 10 grow in power proportional to value.
   Court cards (11-14) introduce signature mechanics per suit.
*/

const COURT_NAMES = { 11:'Page', 12:'Knight', 13:'Queen', 14:'King' };
function numToRoman(n){
  return ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] || String(n);
}
function minorName(suit, n){
  if(n >= 11) return `${COURT_NAMES[n]} of ${SUIT_NAME[suit]}`;
  if(n === 1) return `Ace of ${SUIT_NAME[suit]}`;
  return `${['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'][n-1]} of ${SUIT_NAME[suit]}`;
}

/* Each suit's card factory. Returns a card def for n=1..14. */
const SUIT_FACTORIES = {

  /* ======== WANDS (Fire / Attack) ======== */
  wands: (n) => {
    const base = {
      id: `wands-${n}`, name: minorName('wands', n), suit: 'wands', arcanaNum: n,
      glyph: SUIT_GLYPH.wands, rarity: n<=3 ? 'starter' : (n<=7 ? 'common' : (n<=10 ? 'uncommon' : 'rare')),
    };
    // 1–3: clean baseline (stable early curve + regression anchor)
    if(n <= 3){ const dmg = 3 + n; const cost = n <= 2 ? 0 : 1;
      return { ...base, cost, desc: `Strike ${dmg}.`,
        flavor: ['A spark from nothing.','Tinder finds tinder.','The torch is steady.'][n-1],
        play(ctx){ return dealDamage(ctx, dmg); } };
    }
    // 4–10: the EMBER engine — lay fire, then detonate it (feeds Swords too)
    if(n === 4) return { ...base, cost:1, desc:'Strike 5. Apply 1 Ember.', flavor:'The first cinder catches.',
      play(ctx){ return combine(dealDamage(ctx,5), applyBurn(ctx,1)); } };
    if(n === 5) return { ...base, cost:1, desc:'Strike 6. If the enemy burns, draw 1.', flavor:'Read the smoke.',
      play(ctx){ const r = dealDamage(ctx,6); return (ctx.enemy.debuffs.burn>0) ? combine(r, drawCards(ctx,1)) : r; } };
    if(n === 6) return { ...base, cost:1, desc:'Strike 4. Apply 2 Ember.', flavor:'Feed it, then stand back.',
      play(ctx){ return combine(dealDamage(ctx,4), applyBurn(ctx,2)); } };
    if(n === 7) return { ...base, cost:2, desc:'Strike 8, then Strike again equal to the enemy’s Ember.', flavor:'The fire turns on its host.',
      play(ctx){ const e = ctx.enemy.debuffs.burn||0; return combine(dealDamage(ctx,8), dealDamage(ctx,e)); } };
    if(n === 8) return { ...base, cost:2, desc:'Strike 10. Apply 1 Ember.', flavor:'A measured burn.',
      play(ctx){ return combine(dealDamage(ctx,10), applyBurn(ctx,1)); } };
    if(n === 9) return { ...base, cost:2, desc:'Detonate: consume all Ember, Strike 9 + 3 per Ember consumed.', flavor:'Everything the fire was owed, at once.',
      play(ctx){ const e = ctx.enemy.debuffs.burn||0; ctx.enemy.debuffs.burn = 0; return dealDamage(ctx, 9 + 3*e); } };
    if(n === 10) return { ...base, cost:3, desc:'Strike 14. Apply 3 Ember.', flavor:'The pyre stands tall.',
      play(ctx){ return combine(dealDamage(ctx,14), applyBurn(ctx,3)); } };
    if(n === 11) return { ...base, cost: 1, desc: 'Strike 6. Draw 1.', flavor: 'The squire learns by burning.',
      play(ctx){ return combine(dealDamage(ctx, 6), drawCards(ctx, 1)); } };
    if(n === 12) return { ...base, cost: 2, desc: 'Strike 12. If enemy at full HP, +6 more.', flavor: 'Charge before the spell is named.',
      play(ctx){ const bonus = ctx.enemy.hp >= ctx.enemy.maxHp ? 6 : 0; return dealDamage(ctx, 12 + bonus); } };
    if(n === 13) return { ...base, cost: 2, desc: 'Strike 9. Apply 2 Burn.', flavor: 'Crowned in cinder.',
      play(ctx){ return combine(dealDamage(ctx, 9), applyBurn(ctx, 2)); } };
    if(n === 14) return { ...base, cost: 3, desc: 'Strike 10. +3 damage per Ember on the enemy. Gain 1 energy.', flavor: 'The pyre answers only to itself.',
      play(ctx){ const ember = ctx.enemy.debuffs.burn || 0; const r = dealDamage(ctx, 10 + 3*ember); ctx.player.energy += 1; return combine(r, {energyGained:1}); } };
  },

  /* ======== CUPS (Water / Sustain) ======== */
  cups: (n) => {
    const base = {
      id: `cups-${n}`, name: minorName('cups', n), suit: 'cups', arcanaNum: n,
      glyph: SUIT_GLYPH.cups, rarity: n<=3 ? 'starter' : (n<=7 ? 'common' : (n<=10 ? 'uncommon' : 'rare')),
    };
    // 1–3: clean baseline
    if(n <= 3){ const heal = 1 + Math.floor(n * 0.7); const cost = n <= 2 ? 0 : 1;
      return { ...base, cost, desc:`Heal ${heal}.`,
        flavor: ['A first sip.','The well remembers.','The tide turns.'][n-1],
        play(ctx){ return healPlayer(ctx, heal); } };
    }
    // 4–10: sustain that turns into PRESSURE (Ward engine + heal→damage bridge)
    if(n === 4) return { ...base, cost:1, desc:'Heal 3. Gain 4 Ward.', flavor:'Still water turns the blade.',
      play(ctx){ return combine(healPlayer(ctx,3), applyBuff(ctx,'ward',4)); } };
    if(n === 5) return { ...base, cost:1, desc:'Heal 4. Gain Resolve (block at turn end).', flavor:'Grief, made useful.',
      play(ctx){ return combine(healPlayer(ctx,4), applyBuff(ctx,'resolve',1)); } };
    if(n === 6) return { ...base, cost:1, desc:'Heal 3. Gain 5 Ward.', flavor:'The mirror holds.',
      play(ctx){ return combine(healPlayer(ctx,3), applyBuff(ctx,'ward',5)); } };
    if(n === 7) return { ...base, cost:2, desc:'Heal 5. Draw 1.', flavor:'A cup passed around.',
      play(ctx){ return combine(healPlayer(ctx,5), drawCards(ctx,1)); } };
    if(n === 8) return { ...base, cost:2, desc:'Heal 4. Gain 5 Ward. Draw 1.', flavor:'Seven faces, one will.',
      play(ctx){ return combine(healPlayer(ctx,4), applyBuff(ctx,'ward',5), drawCards(ctx,1)); } };
    // B21 — was DEAD (65 fires / 1866 fights): the binary "if healed 6+"
    // gate failed whenever you were near full HP. Now it ALWAYS strikes,
    // scaling with cumulative healing — heal→damage is a real engine.
    if(n === 9) return { ...base, cost:2, desc:'Heal 6. Strike equal to half the HP healed this combat (min 5).', flavor:'The wish, paid forward as a wound.',
      play(ctx){ const r = healPlayer(ctx,6); const dmg = Math.max(5, Math.floor((ctx.combat&&ctx.combat.healedThisCombat||0)/2)); return combine(r, dealDamage(ctx,dmg)); } };
    if(n === 10) return { ...base, cost:2, desc:'Heal 8, then Strike equal to half the HP healed this combat + half your Ward (max 22).', flavor:'The flood remembers every shore.',
      play(ctx){ const r = healPlayer(ctx,8); const dmg = Math.min(22, Math.floor((ctx.combat&&ctx.combat.healedThisCombat||0)/2) + Math.floor((ctx.player.buffs.ward||0)/2)); return combine(r, dealDamage(ctx,dmg)); } };
    if(n === 11) return { ...base, cost: 0, desc: 'Draw 2.', flavor: 'The young one offers a wave.',
      play(ctx){ return drawCards(ctx, 2); } };
    if(n === 12) return { ...base, cost: 1, desc: 'Heal 6. Gain Resolve (+block at turn end).', flavor: 'A knight returns from drowning.',
      play(ctx){ return combine(healPlayer(ctx, 6), applyBuff(ctx, 'resolve', 1)); } };
    if(n === 13) return { ...base, cost: 2, desc: 'Heal 10. Reduce next damage taken by 6.', flavor: 'The queen weeps salt and lets you live.',
      play(ctx){ return combine(healPlayer(ctx, 10), applyBuff(ctx, 'ward', 6)); } };
    if(n === 14) return { ...base, cost: 2, desc: 'Heal 10. Draw 2. If you have healed 20+ this combat, gain 2 energy.', flavor: 'The deep king pours and pours.',
      play(ctx){ const r = combine(healPlayer(ctx, 10), drawCards(ctx, 2)); if((ctx.combat && ctx.combat.healedThisCombat || 0) >= 20){ ctx.player.energy += 2; return combine(r, {energyGained:2}); } return r; } };
  },

  /* ======== SWORDS (Air / Pierce & Debuff) ======== */
  swords: (n) => {
    const base = {
      id: `swords-${n}`, name: minorName('swords', n), suit: 'swords', arcanaNum: n,
      glyph: SUIT_GLYPH.swords, rarity: n<=3 ? 'starter' : (n<=7 ? 'common' : (n<=10 ? 'uncommon' : 'rare')),
    };
    // 1–3: clean baseline
    if(n <= 3){ const pierce = 2 + Math.floor(n * 0.8); const cost = n <= 2 ? 0 : 1;
      return { ...base, cost, desc:`Pierce ${pierce}. Ignores Block.`,
        flavor: ['The first draw.','The duel begins.','A clean cut.'][n-1],
        play(ctx){ return dealPierce(ctx, pierce); } };
    }
    // 4–10: apply debuffs, then CASH THEM IN (detonates Wands’ Ember too)
    if(n === 4) return { ...base, cost:1, desc:'Pierce 4. Apply Weak 1.', flavor:'Cut the arm, not the man.',
      play(ctx){ return combine(dealPierce(ctx,4), applyDebuff(ctx,'weak',1)); } };
    if(n === 5) return { ...base, cost:1, desc:'Pierce 5. Apply Vulnerable 1.', flavor:'Open the seam.',
      play(ctx){ return combine(dealPierce(ctx,5), applyDebuff(ctx,'vulnerable',1)); } };
    if(n === 6) return { ...base, cost:1, desc:'Pierce 6. +2 damage per Ember on the enemy.', flavor:'Drive the blade through the burn.',
      play(ctx){ const e = ctx.enemy.debuffs.burn||0; return dealPierce(ctx, 6 + 2*e); } };
    if(n === 7) return { ...base, cost:2, desc:'Pierce 7. +2 damage per debuff on the enemy.', flavor:'A wound knows its kin.',
      play(ctx){ const dc = Object.entries(ctx.enemy.debuffs).filter(([k,v])=>v>0 && k!=='strength').length; return dealPierce(ctx, 7 + 2*dc); } };
    if(n === 8) return { ...base, cost:2, desc:'Pierce 7. Apply Weak 1 and Vulnerable 1.', flavor:'Both knees, then the throat.',
      play(ctx){ return combine(dealPierce(ctx,7), applyDebuff(ctx,'weak',1), applyDebuff(ctx,'vulnerable',1)); } };
    if(n === 9) return { ...base, cost:2, desc:'Pierce 12. If the enemy is Vulnerable, draw 1.', flavor:'Finish what was opened.',
      play(ctx){ const r = dealPierce(ctx,12); return (ctx.enemy.debuffs.vulnerable>0) ? combine(r, drawCards(ctx,1)) : r; } };
    if(n === 10) return { ...base, cost:3, desc:'Pierce 9. +3 damage per debuff on the enemy.', flavor:'The reckoning, itemised.',
      play(ctx){ const dc = Object.entries(ctx.enemy.debuffs).filter(([k,v])=>v>0 && k!=='strength').length; return dealPierce(ctx, 9 + 3*dc); } };
    if(n === 11) return { ...base, cost: 1, desc: 'Pierce 4. Apply Weak (1 turn).', flavor: 'Watch the eyes, not the blade.',
      play(ctx){ return combine(dealPierce(ctx, 4), applyDebuff(ctx, 'weak', 1)); } };
    if(n === 12) return { ...base, cost: 1, desc: 'Pierce 8.', flavor: 'A reckless charge, but true.',

    if(n === 13) return { ...base, cost: 2, desc: 'Pierce 6. Apply Vulnerable (1 turn).', flavor: 'She does not blink.',

  },

  /* ======== PENTACLES (Earth / Block & Wealth) ======== */
  pents: (n) => {
    const base = {
      id: `pents-${n}`, name: minorName('pents', n), suit: 'pents', arcanaNum: n,

    };

    if(n === 8) return { ...base, cost:2, desc:'Block 8. Gain 1 Plate (permanent +2 Block).', flavor:'Lay another course of stone.',
      play(ctx){ return combine(gainBlock(ctx,8), applyBuff(ctx,'plate',1)); } };
    if(n === 9) return { ...base, cost:2, desc:'Strike equal to half your Block, then Block 6.', flavor:'The estate collects its debts.',
      play(ctx){ const r = dealDamage(ctx, Math.floor(ctx.player.block / 2)); return combine(r, gainBlock(ctx,6)); } };
    if(n === 10) return { ...base, cost:2, desc:'Block 13, then Strike equal to a third of your Block.', flavor:'The keep, and the sortie.',
      play(ctx){ const b = gainBlock(ctx,13); return combine(b, dealDamage(ctx, Math.floor(ctx.player.block / 3))); } };
    if(n === 11) return { ...base, cost: 1, desc: 'Block 7. Gain 5 gold.', flavor: 'The student counts twice.',
      play(ctx){ ctx.player.gold += 5; return combine(gainBlock(ctx, 7), {goldGained:5}); } };
    if(n === 12) return { ...base, cost: 2, desc: 'Block 14.', flavor: 'A slow journey, but unbroken.',
      play(ctx){ return gainBlock(ctx, 14); } };
    if(n === 13) return { ...base, cost: 2, desc: 'Block 10. Gain 1 Plate (permanent +2 block).', flavor: 'Her court is iron.',
      play(ctx){ return combine(gainBlock(ctx, 10), applyBuff(ctx, 'plate', 1)); } };
    if(n === 14) return { ...base, cost: 3, desc: 'Block 16. Then Strike equal to half your Block.', flavor: 'The king of the deep field.',
      play(ctx){ const b = gainBlock(ctx, 16); const r = dealDamage(ctx, Math.floor(ctx.player.block / 2)); return combine(b, r); } };
  },
};

/* ===== B24 · THE SHADOW DECK =====================================
   Every Minor now has a true REVERSED face — not "cheaper/weaker"
   (that was B15's stopgap) but its INVERTED role in the suit engine,
   at the same power & cost. ONE rule the player learns: a reversed
   card does the OTHER half of its suit's combo.
     Wands  : striker  ⇄  Ember-layer / detonator
     Cups   : healer   ⇄  Ward-wall / heal→fist
     Swords : pierce   ⇄  debuff-layer / debuff-cash
     Pents  : wall     ⇄  fist
   Engine already routes card.reversedPlay/reversedDesc (playCard);
   authoring them here, data-driven, keeps it reviewable & balanced.
   Effects still get chain/study bonuses (set on ctx before the call).
================================================================= */
const _dd=(c,n)=>dealDamage(c,n), _dp=(c,n)=>dealPierce(c,n), _gb=(c,n)=>gainBlock(c,n),
      _hp=(c,n)=>healPlayer(c,n), _bn=(c,n)=>applyBurn(c,n),
      _bf=(c,k,n)=>applyBuff(c,k,n), _df=(c,k,n)=>applyDebuff(c,k,n), _dr=(c,n)=>drawCards(c,n);
const _ember = c => (c.enemy.debuffs.burn||0);
const _debs  = c => Object.entries(c.enemy.debuffs).filter(([k,v])=>v>0&&k!=='strength').length;
const _ward  = c => (c.player.buffs.ward||0);
const _healed= c => (c.combat&&c.combat.healedThisCombat||0);

// beneficial Death Major into the player's pile (a gift, not a curse).
// A curse is UNPLAYABLE dead weight: it eats a hand slot for the turn and
// can't be played, exactly like Slay the Spire's curses. `unplayable` is
// honored by playCard + renderHand; `rarity:'curse'` keeps it out of every
// reward/draft pool (those filter common/uncommon/rare). play() is a no-op
// so the test harness (which calls play on every ALL_CARDS entry) is happy.

/* =====================================================================
   2. COMBAT PRIMITIVES — the small helpers card play() functions use
   ===================================================================== */

function combine(...results){
  const out = {};
  for(const r of results){
    if(!r) continue;
    for(const k of Object.keys(r)){
      if(typeof r[k] === 'number') out[k] = (out[k]||0) + r[k];
      else out[k] = r[k];
    }
  }
  return out;
}

function dealDamage(ctx, raw){
  // fate (reversed) scales the card's own base; then study/chain/strength
  let dmg = Math.round(raw * (ctx.fateMult || 1)) + (ctx.studyBonus || 0) + (ctx.chainBonus || 0) + (ctx.reversedBonus || 0);
  if(ctx.player.buffs.strength) dmg += ctx.player.buffs.strength;
  if(ctx.enemy.debuffs.vulnerable) dmg = Math.floor(dmg * 1.5);
  if(ctx.player.debuffs.weak) dmg = Math.floor(dmg * 0.75);
  let blocked = 0;
  if(ctx.enemy.block > 0){
    blocked = Math.min(ctx.enemy.block, dmg);
    ctx.enemy.block -= blocked;
    dmg -= blocked;
  }
  ctx.enemy.hp = Math.max(0, ctx.enemy.hp - dmg);
  if(state.run && state.run.tally && dmg > state.run.tally.biggestHit) state.run.tally.biggestHit = dmg;
  return { damage: dmg, blocked };
}
function dealPierce(ctx, raw){
  // ignores enemy block; fate (reversed) scales the card's own base
  let dmg = Math.round(raw * (ctx.fateMult || 1)) + (ctx.studyBonus || 0) + (ctx.chainBonus || 0) + (ctx.reversedBonus || 0);
  if(ctx.player.buffs.strength) dmg += ctx.player.buffs.strength;
  if(ctx.enemy.debuffs.vulnerable) dmg = Math.floor(dmg * 1.5);
  if(ctx.player.debuffs.weak) dmg = Math.floor(dmg * 0.75);
  ctx.enemy.hp = Math.max(0, ctx.enemy.hp - dmg);
  if(state.run && state.run.tally && dmg > state.run.tally.biggestHit) state.run.tally.biggestHit = dmg;
  return { pierce: dmg };
}
function gainBlock(ctx, raw){
  let blk = Math.round(raw * (ctx.fateMult || 1)) + (ctx.studyBonus || 0) + (ctx.chainBonus || 0) + (ctx.reversedBonus || 0);
  if(ctx.player.buffs.plate) blk += ctx.player.buffs.plate * 2;
  if(ctx.player.debuffs.frail) blk = Math.floor(blk * 0.75);
  ctx.player.block += blk;
  return { block: blk };
}
function healPlayer(ctx, raw){
  const before = ctx.player.hp;
  ctx.player.hp = Math.min(ctx.player.maxHp, ctx.player.hp + Math.round(raw * (ctx.fateMult || 1)) + (ctx.studyBonus || 0) + (ctx.chainBonus || 0) + (ctx.reversedBonus || 0));
  const healed = ctx.player.hp - before;
  if(ctx.combat) ctx.combat.healedThisCombat = (ctx.combat.healedThisCombat || 0) + healed;
  // B35 — Pewter Chalice: a little of every heal sets into Block.
  if(healed > 0 && state.run && state.run.relics && state.run.relics.includes('pewter-chalice')) ctx.player.block += Math.floor(healed / 3);
  return { healing: healed };
}
function drawCards(ctx, n){
  let drawn = 0;
  for(let i=0;i<n;i++){
    if(ctx.player.hand.length >= 10) break; // hand cap
    if(ctx.player.draw.length === 0){
      // reshuffle discard
      if(ctx.player.discard.length === 0) break;
      ctx.player.draw = ctx.player.discard;
      ctx.player.discard = [];
      shuffleInPlace(ctx.player.draw, ctx.combat.rng);
    }
    const c = ctx.player.draw.shift();
    // THE TURN OF FATE — only Minors with a real cost can turn Reversed
    // (a 0-cost card has no discount to trade, so fate leaves it be).
    const cd = CARD_BY_ID[c.cardId];
    const fateable = cd && c.cardId && (cd.suit==='wands'||cd.suit==='cups'||cd.suit==='swords'||cd.suit==='pents') && cd.cost >= 1;
    if(!c.reversed && fateable){
      const ch = fateChanceFor();
      if(ch > 0 && ctx.combat.rng() < ch) c.reversed = true;
    }
    ctx.player.hand.push(c);
    drawn++;
  }
  return { drawn };
}
function applyBuff(ctx, key, amount){
  ctx.player.buffs[key] = (ctx.player.buffs[key]||0) + amount;
  return { buff: key };
}
function applyDebuff(ctx, key, amount){
  // Weak/Vulnerable are PRESENCE-based (any >0 = full effect); their
  // "amount" is really a DURATION that decays 1/turn. At 1 they vanished
  // before you could ever exploit them next turn — which silently broke
  // the Swords set-up→pay-off fantasy. +1 duration: live through your
  // NEXT turn so a debuff you apply is a debuff you can cash in.
  const dur = (key === 'weak' || key === 'vulnerable') ? amount + 1 : amount;
  ctx.enemy.debuffs[key] = (ctx.enemy.debuffs[key]||0) + dur;
  return { debuff: key };
}
function applyBurn(ctx, stacks){
  ctx.enemy.debuffs.burn = (ctx.enemy.debuffs.burn||0) + stacks;
  return { burn: stacks };
}
function discardChoice(ctx, n){
  return { mustDiscard: n }; // resolved at render time as a choice
}

/* veilMod — the single source of truth for the chosen run's difficulty.
   run.veil is set at run start from meta.selectedVeil (clamped to what the
   player has unlocked). Every difficulty site reads THROUGH this, so the
   ladder is honored everywhere at once. Defaults make Veil 0 byte-identical
   to the pre-Veil game (sims/old saves unaffected — no VERSION bump). */
function veilModsActive(){
  const v = (state.run && state.run.veil) || 0;
  return (VEILS[v] && VEILS[v].mods) || {};

function veilMod(key, fallback){
  const m = veilModsActive();
  return (m[key] != null) ? m[key] : fallback;
}
