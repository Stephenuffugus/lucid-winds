/* =====================================================================
   10. PENDING CHOICE RESOLVER (modal-driven for special cards)
   ===================================================================== */

function resolvePendingChoice(){
  const ctx = getCtx();
  const pc = ctx.combat.pendingChoice;
  if(!pc) return;
  if(pc.type === 'discard'){
    // pick N cards to discard
    showDiscardPicker(pc.n, () => { ctx.combat.pendingChoice = null; renderCombat(); });
  } else if(pc.type === 'lovers'){
    showModal({
      title: 'The Lovers',
      sub: 'Two paths only ever meet once.',
      choices: [
        { icon:'⛨', label:'Block 8, heal 4', onClick:()=>{ gainBlock(ctx, 8); healPlayer(ctx, 4); ctx.combat.pendingChoice = null; renderCombat(); } },
        { icon:'⚔', label:'Strike 14', onClick:()=>{ dealDamage(ctx, 14); ctx.combat.pendingChoice = null; renderCombat(); } },
      ]
    });
  } else if(pc.type === 'peek'){
    showPeekPicker(pc.n);
  } else if(pc.type === 'tutor'){
    showTutorPicker(pc.n);
  } else if(pc.type === 'resurrect'){
    showResurrectPicker();
  }
}

function showDiscardPicker(n, cb){
  // simplified: just discard random
  const ctx = getCtx();
  for(let i=0;i<n;i++){
    if(ctx.player.hand.length === 0) break;
    const idx = Math.floor(ctx.combat.rng() * ctx.player.hand.length);
    const card = ctx.player.hand.splice(idx, 1)[0];
    ctx.player.discard.push(card);
  }
  cb();
}

// B34 — a REAL scry (was a no-op). Look at the top N of the draw pile and
// discard any you don't want; the rest stay on top, in order. Honest to the
// card text and a genuine tempo/consistency tool (the Priestess's fantasy).
function showPeekPicker(n){
  const ctx = getCtx();
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  const top = ctx.player.draw.slice(0, n);
  if(!top.length){ ctx.combat.pendingChoice = null; renderCombat(); return; }
  const discardSet = new Set();
  m.innerHTML = `
    <div class="modal-title">The High Priestess</div>
    <div class="modal-sub">The top of your draw, in order. Tap any to mark it for the discard — the rest stay on top.</div>
    <div class="dv-grid" id="peek-grid"></div>
    <div class="modal-choices" id="peek-confirm"></div>`;
  const grid = m.querySelector('#peek-grid');
  top.forEach((entry, i) => {
    const card = CARD_BY_ID[entry.cardId];
    const el = renderCardElement(card, { reversed: entry.reversed });
    el.classList.add('playable');
    el.onclick = () => {
      if(discardSet.has(i)){ discardSet.delete(i); el.classList.remove('peek-discard'); }
      else { discardSet.add(i); el.classList.add('peek-discard'); }
    };
    grid.appendChild(el);
  });
  const cc = m.querySelector('#peek-confirm');
  const btn = document.createElement('div');
  btn.className = 'modal-choice';
  btn.innerHTML = `<div class="mc-icon">☽</div><div class="mc-text"><strong>Read the cards</strong><small>Discard the marked; keep the rest on top.</small></div>`;
  btn.onclick = () => {
    // splice descending so indices stay valid; discarded cards go to the pile
    Array.from(discardSet).sort((a,b) => b - a).forEach(i => {
      const removed = ctx.player.draw.splice(i, 1)[0];
      if(removed) ctx.player.discard.push(removed);
    });
    veil.classList.remove('active');
    ctx.combat.pendingChoice = null;
    renderCombat();
  };
  cc.appendChild(btn);
  veil.classList.add('active');
}

function showTutorPicker(n){
  const ctx = getCtx();
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-title">The Hierophant</div><div class="modal-sub">Choose one from your draw pile.</div><div class="dv-grid" id="tutor-grid"></div>`;
  const grid = m.querySelector('#tutor-grid');
  ctx.player.draw.forEach((entry, idx) => {
    const card = CARD_BY_ID[entry.cardId];
    const el = renderCardElement(card, { reversed: entry.reversed });
    el.classList.add('playable');
    el.onclick = () => {
      ctx.player.draw.splice(idx, 1);
      ctx.player.hand.push(entry);
      veil.classList.remove('active');
      ctx.combat.pendingChoice = null;
      renderCombat();
    };
    grid.appendChild(el);
  });
  veil.classList.add('active');
}

function showResurrectPicker(){
  const ctx = getCtx();
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-title">Judgement</div><div class="modal-sub">Return one card to your hand. It costs 0 this turn.</div><div class="dv-grid" id="rez-grid"></div>`;
  const grid = m.querySelector('#rez-grid');
  ctx.player.discard.forEach((entry, idx) => {
    const card = CARD_BY_ID[entry.cardId];
    const el = renderCardElement(card, { reversed: entry.reversed });
    el.classList.add('playable');
    el.onclick = () => {
      ctx.player.discard.splice(idx, 1);
      entry.zeroCostThisTurn = true;
      ctx.player.hand.push(entry);
      veil.classList.remove('active');
      ctx.combat.pendingChoice = null;
      renderCombat();
    };
    grid.appendChild(el);
  });
  veil.classList.add('active');
}

function renderMap(){
  const run = state.run;
  document.getElementById('map-hp').textContent = run.hp;
  document.getElementById('map-maxhp').textContent = run.maxHp;
  document.getElementById('map-gold').textContent = run.gold;
  const _act = ACTS[(run.act || 1) - 1] || ACTS[0];
  const _fl = run.path.findIndex(f => !f.completed) + 1;
  document.getElementById('map-title').textContent = `Act ${run.act || 1}/${ACTS.length} · ${_act.name} — Floor ${_fl}/15`;
  const body = document.getElementById('map-rooms');
  body.innerHTML = '';
  const nextFloor = run.path.findIndex(f => !f.completed);
  run.path.forEach((floor, fIdx) => {
    const row = document.createElement('div');
    row.className = 'map-row';
    floor.nodes.forEach((node, nIdx) => {
      const n = document.createElement('div');
      n.className = 'room-node ' + node.type;
      const isDone = floor.completed, isNext = !isDone && fIdx === nextFloor;
      if(isDone) n.classList.add('completed');
      else if(isNext) n.classList.add('accessible');
      else n.classList.add('locked');
      // glyph — B23: cleared rooms read as ✓ (path BEHIND), not a faint copy
      const glyphs = { combat:'⚔', elite:'☠', event:'❉', treasure:'◈', rest:'☾', boss:'♛', merchant:'⚖' };
      n.textContent = isDone ? '✓' : (glyphs[node.type] || '?');
      if(isNext){
        const here = document.createElement('div');
        here.className = 'room-here'; here.textContent = '▸ you are here';
        n.appendChild(here);
      }
      // label
      const lbl = document.createElement('div');
      lbl.className = 'room-label';
      const labels = {
        combat: node.enemyId ? ENEMY_BY_ID[node.enemyId].name : 'Combat',
        elite: node.enemyId ? ENEMY_BY_ID[node.enemyId].name : 'Elite',
        boss: node.enemyId ? ENEMY_BY_ID[node.enemyId].name : 'The Keeper',
        event: 'A Mystery',
        treasure: 'A Chest',
        rest: 'A Quiet Wing',
        merchant: 'The Merchant',
      };
      lbl.textContent = labels[node.type] || '';
      n.appendChild(lbl);
      n.onclick = () => selectNode(fIdx, nIdx);
      row.appendChild(n);
    });
    body.appendChild(row);
  });
}

function showCardInspect(card, entry){
  const overlay = document.getElementById('card-inspect');
  const content = document.getElementById('card-inspect-content');
  const info = document.getElementById('card-inspect-info');
  content.innerHTML = '';
  const isMinor = card.suit==='wands'||card.suit==='cups'||card.suit==='swords'||card.suit==='pents';
  const revHere = !!(entry && entry.reversed);
  const hasShadow = isMinor && revHere && !!card.reversedPlay;
  const fateRev   = isMinor && revHere && !card.reversedPlay;
  const big = renderCardElement(card, { reversed: revHere && !hasShadow, shadow: hasShadow });
  content.appendChild(big);
  // B24 — show BOTH faces so the player learns the upright⇄shadow fork.
  let fateLine = '';
  if(card.reversedPlay){
    fateLine = hasShadow
      ? `<br><small style="color:var(--blood-bright)">↻ SHADOW (drawn reversed): ${card.reversedDesc}</small><br><small style="color:var(--card-cream-dim)">Upright: ${card.desc}</small>`
      : `<br><small style="color:var(--card-cream-dim)">↻ Shadow face (if reversed): ${card.reversedDesc}</small>`;
  } else if(fateRev){
    fateLine = `<br><small style="color:var(--blood-bright)">↻ REVERSED — costs 1 less, effect ×${fateMultFor().toFixed(2)}</small>`;
  }
  info.innerHTML = `<em>${card.flavor || ''}</em>${fateLine}`;
  // In-combat hand actions: Patron Channel + the Priestess's Turn of Fate
  const inCombat = state.run && state.run.combat && state.run.combatPlayer;
  const hIdx = inCombat && entry ? state.run.combatPlayer.hand.indexOf(entry) : -1;
  if(inCombat && hIdx >= 0){
    const act = document.createElement('div');
    act.className = 'ci-actions';
    const pc = patronChannel();
    const used = state.run.combat.channeledThisTurn;
    const btns = [`<button class="ci-channel"${used?' disabled':''}>${used?'Channel spent this turn':'⟐ Channel — '+pc.label}</button>`];
    const isPriestessMinor = state.run.patron === 'priestess' && isMinor;
    const canTurn = isPriestessMinor && !state.run.combat.fateTurnedThisTurn;
    if(isPriestessMinor){
      btns.push(`<button class="ci-fate"${canTurn?'':' disabled'}>${canTurn?(entry.reversed?'↻ Right the card':'↻ Reverse the card'):'Fate turned this turn'}</button>`);
    }
    act.innerHTML = btns.join('');
    const chBtn = act.querySelector('.ci-channel');
    if(!used && chBtn) chBtn.onclick = () => channelCard(hIdx);
    const fBtn = act.querySelector('.ci-fate');
    if(canTurn && fBtn) fBtn.onclick = () => turnFate(hIdx);
    info.appendChild(act);
  }
  overlay.classList.add('active');
}

function renderCodex(){
  const body = document.getElementById('codex-body');
  body.innerHTML = '';
  ['major','wands','cups','swords','pents'].forEach(suit => {
    const section = document.createElement('div');
    section.className = 'dv-section';
    section.innerHTML = `<div class="dv-title">${SUIT_NAME[suit]} (${ALL_CARDS.filter(c=>c.suit===suit).length})</div>`;
    const grid = document.createElement('div');
    grid.className = 'dv-grid';
    ALL_CARDS.filter(c => c.suit === suit).forEach(card => {
      const seen = state.meta.discoveredCards[card.id];
      const el = renderCardElement(card, {});
      if(!seen){ el.style.filter = 'brightness(0.32) saturate(0.4)'; el.style.pointerEvents = 'none'; }
      else el.onclick = () => showCardInspect(card, { reversed: false });
      grid.appendChild(el);
    });

    body.appendChild(section);
  });

   13. SAVE / LOAD
   ===================================================================== */

function saveState(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ version: VERSION, meta: state.meta, run: state.run })); }
  catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    // B29 — meta progression (Insight, Mirror, unlocked Veils, Codex) is
    // additive and backfilled by migrateMeta, so it survives a VERSION bump.
    // Only the in-progress RUN is version-locked and discarded on mismatch.
    if(d.meta){ state.meta = d.meta; migrateMeta(); }
    if(d.version !== VERSION) return;
    if(d.run) state.run = d.run;
    migrateMeta();
  } catch(e){}
}
// Fill any meta fields missing from older saves — never bump VERSION,
// so an in-progress run is never discarded.
function migrateMeta(){
  const m = state.meta;
  if(m.insight == null) m.insight = 0;
  if(m.mirror == null) m.mirror = {};
  if(m.veil == null) m.veil = 0;
  if(m.selectedVeil == null) m.selectedVeil = 0;
  if(m.relicsFound == null) m.relicsFound = {};
  if(m.discoveredCards == null) m.discoveredCards = {};
  if(m.bestScore == null) m.bestScore = 0;     // B30
  if(m.daily == null) m.daily = {};            // B31 — { lastPlayed, lastScore, streak }
  if(m.taught == null) m.taught = {};          // B32 — which systems we've taught
}

// B32 · FIRST LIGHT — progressive disclosure. Teach each system ONCE, at
// the moment it first becomes relevant (the genre's churn killer is six
// esoteric systems dumped on you at floor 0). meta.taught[id] persists
// across runs; rAF-gated so sim/test/old-save paths never see a modal.
function teachOnce(id, cfg){
  if(typeof requestAnimationFrame !== 'function') return false;  // inert under stub DOM
  state.meta.taught = state.meta.taught || {};
  if(state.meta.taught[id]) return false;
  state.meta.taught[id] = true; saveState();
  showModal({
    title: cfg.title, sub: cfg.sub || '', body: cfg.body,
    choices: [{ icon: cfg.icon || '✦', label: cfg.label || 'I see', onClick: cfg.onClose || (()=>{}) }]
  });
  return true;
}
// Insight earned at the end of a run — you always progress, win or lose.
function awardInsight(victory){
  const run = state.run;
  const floorReached = run ? (run.floor || 0) : 0;
  const gained = 10 + floorReached * 6 + (victory ? 120 : 0);
  state.meta.insight = (state.meta.insight || 0) + gained;
  return gained;
}

function refreshTitle(){
  const meta = state.meta;
  const m = document.getElementById('title-meta');
  if(state.run){
    document.getElementById('btn-continue-run').style.display = '';
    document.getElementById('btn-new-run').textContent = 'Begin a New Reading';
  } else {
    document.getElementById('btn-continue-run').style.display = 'none';
    document.getElementById('btn-new-run').textContent = 'Begin the Reading';
  }
  const discovered = Object.keys(meta.discoveredCards||{}).length;
  const best = (meta.bestScore||0) > 0 ? ` · best ${meta.bestScore}` : '';
  m.textContent = `${discovered}/78 cards · ${meta.runsCompleted||0} crowns${best} · ${meta.insight||0} Insight · ${BUILD}`;
  // B31 — Daily button reflects today's state.
  const dailyBtn = document.getElementById('btn-daily');
  if(dailyBtn){
    const ts = todaySeed();
    const inProgress = state.run && state.run.daily && state.run.dailySeed === ts;
    const doneToday = meta.daily && meta.daily.lastSeed === ts && !inProgress;
    if(inProgress){ dailyBtn.textContent = "Resume Today's Spread"; dailyBtn.classList.remove('dim'); }
    else if(doneToday){ dailyBtn.textContent = `Daily done — ${meta.daily.lastScore||0} pts`; dailyBtn.classList.add('dim'); }
    else { dailyBtn.textContent = "Today's Spread"; dailyBtn.classList.remove('dim'); }
  }
}

function startRun(patronId, seed){
  state.run = freshRun(seed, patronId);
  saveState();
  showOpeningReading(() => { showScreen('map-screen'); renderMap(); });
}

// B33 · THE OPENING HAND — a single run-shaping choice before the first
// door, so every run starts with an identity and a plan (the genre's
// cheapest "this run feels different" lever). The three offers are picked
// DETERMINISTICALLY from the run seed, so the Daily stays fair: everyone
// faces the same opening choice. Pure additive — engine/sim untouched
// (sims start runs via freshRun(), never startRun, so they never see it).
function showOpeningReading(done){
  const run = state.run;
  const rng = mulberry32(run.rngSeed + 99991);
  const goToMap = () => { saveState(); done(); };
  const prim = (PATRONS[run.patron] && PATRONS[run.patron].primary) || 'wands';
  const addCard = (pool) => { shuffleInPlace(pool, rng); if(pool[0]) run.deck.push({ cardId: pool[0].id, reversed:false }); };
  const offers = [
    { icon:'☆', label:'The Gift', note:'A random rare card joins your deck.',
      apply:()=>{ addCard(ALL_CARDS.filter(c => c.rarity==='rare' && c.suit!=='major')); goToMap(); } },
    { icon:'⚸', label:'The Edge', note:'An uncommon card of your own suit — sharpen the engine.',
      apply:()=>{ let p = ALL_CARDS.filter(c => c.rarity==='uncommon' && c.suit===prim); if(!p.length) p = ALL_CARDS.filter(c => c.rarity==='uncommon' && c.suit!=='major'); addCard(p); goToMap(); } },
    { icon:'✦', label:'The Wild Card', note:'An uncommon card OUTSIDE your suit — a splash.',
      apply:()=>{ let p = ALL_CARDS.filter(c => c.rarity==='uncommon' && c.suit!=='major' && c.suit!==prim); if(!p.length) p = ALL_CARDS.filter(c => c.rarity==='uncommon' && c.suit!=='major'); addCard(p); goToMap(); } },
    { icon:'✎', label:'The Cull', note:'Banish a starter now — thin the deck from the first hand.',
      apply:()=>{ showBanishModal({ onDone: goToMap }); } },
    { icon:'◈', label:'The Full Purse', note:'Begin the climb with +60 gold.',
      apply:()=>{ run.gold += 60; goToMap(); } },
    { icon:'♥', label:'The Strong Heart', note:'+10 max HP for the whole climb.',
      apply:()=>{ run.maxHp += 10; run.hp += 10; goToMap(); } },
    { icon:'☽', label:"The Devil's Discount", note:'Take an Arcana boon now — but lose 7 max HP.',
      apply:()=>{ run.maxHp = Math.max(20, run.maxHp - 7); run.hp = Math.min(run.hp, run.maxHp);
        const keys = Object.keys(ARCANA_BOONS).filter(k => !run.spread.includes(k));
        const k = pickRand(keys.length ? keys : Object.keys(ARCANA_BOONS), rng); if(k) run.spread.push(k); goToMap(); } },
  ];
  shuffleInPlace(offers, rng);
  const three = offers.slice(0, 3);
  showModal({
    title: 'The Opening Reading',
    sub: 'Before the first door — set the tone of this run.',
    body: 'Take one omen into the Tower. The rest fade.',
    choices: three.map(o => ({ icon:o.icon, label:o.label, note:o.note, onClick:o.apply })),
    hideClose: true
  });
}
function choosePatron(){
  // B32 — gently steer a brand-new player to the most straightforward Patron
  // (tempo/aggression) so the first reading isn't a paralysis of choice.
  const firstRun = (state.meta.runsAttempted || 0) === 0;
  showModal({
    title: 'Who reads you?',
    sub: 'Choose your Patron. They set your hand, your gift, and your road.',
    choices: Object.values(PATRONS).map(p => ({
      icon: p.glyph,
      label: p.name + (firstRun && p.id === 'magician' ? '  ·  ★ a good first reading' : ''),
      note: p.tagline,
      onClick: () => chooseVeil(p.id)
    }))
  });
}

// B25 — after the Patron, pick which Veil to lift. Only shown once the
// player has cleared a run (meta.veil > 0); otherwise it's silent and the
// run starts at No Veil, exactly as before. This is the long-term mastery
// ladder: each clear unlocks the next, harder rung.
function chooseVeil(patronId){
  const maxVeil = state.meta.veil || 0;
  if(maxVeil <= 0){ startRun(patronId); return; }
  const choices = [];
  for(let i = 0; i <= maxVeil; i++){
    const v = VEILS[i];
    const tags = [];
    if(i === maxVeil) tags.push('highest you\'ve unlocked');
    if(i === (state.meta.selectedVeil || 0)) tags.push('last chosen');
    choices.push({
      icon: i === 0 ? '○' : '◈',
      label: v.name,
      note: v.desc + (tags.length ? `  —  ${tags.join(' · ')}` : ''),
      onClick: () => { state.meta.selectedVeil = i; saveState(); startRun(patronId); }
    });
  }
  showModal({
    title: 'Which Veil will you lift?',
    sub: 'Each Veil makes the Tower crueller — and the climb mean more. Clear a run to unlock the next.',
    choices
  });
}
document.getElementById('btn-new-run').onclick = () => {
  if(state.run && !confirm('Begin a new reading? Your current run will end.')) return;
  choosePatron();
};
document.getElementById('btn-continue-run').onclick = () => {
  if(!state.run) return;
  if(state.run.combat){
    showScreen('combat-screen');
    renderCombat();
  } else {
    showScreen('map-screen');
    renderMap();
  }
};
function showMirror(){
  const choices = Object.entries(MIRROR_TALENTS).map(([id, t]) => {
    const rank = mirrorRank(id);
    const maxed = rank >= t.max;
    const cost = maxed ? null : t.costs[rank];
    const afford = !maxed && state.meta.insight >= cost;
    const status = maxed ? 'MAX' : (afford ? `cost ${cost} Insight` : `need ${cost} Insight`);
    return {
      icon: t.glyph,
      label: `${t.name}  ·  rank ${rank}/${t.max}`,
      note: `${t.desc(rank)}  —  ${status}`,
      onClick: () => {
        if(!maxed && afford){
          state.meta.insight -= cost;
          state.meta.mirror[id] = rank + 1;
          saveState();
        }
        showMirror(); // refresh
      }
    };
  });
  choices.push({ icon:'❮', label:'Back to the title', onClick: () => { showScreen('title-screen'); refreshTitle(); } });
  showModal({
    title: 'The Mirror',
    sub: `${state.meta.insight} Insight to spend. What it grants, it grants forever.`,
    choices
  });
}
document.getElementById('btn-mirror').onclick = () => { showMirror(); };
document.getElementById('btn-codex').onclick = () => {
  renderCodex();
  showScreen('codex-screen');
};
document.getElementById('btn-codex-back').onclick = () => { showScreen('title-screen'); refreshTitle(); };
document.getElementById('btn-pile-back').onclick = () => { showScreen('combat-screen'); renderCombat(); };
document.getElementById('btn-sws-exit').onclick = () => { window.SWS_EXIT(); };
document.getElementById('btn-daily').onclick = () => {
  const seed = todaySeed();
  // Already mid-daily for today → resume it.
  if(state.run && state.run.daily && state.run.dailySeed === seed){
    showScreen(state.run.combat ? 'combat-screen' : 'map-screen');
    if(state.run.combat) renderCombat(); else renderMap();
    return;
  }
  // Already spent today's single attempt → no re-rolls; show the result.
  if(state.meta.daily && state.meta.daily.lastSeed === seed){
    const d = state.meta.daily;
    showModal({
      title: "Today's Spread is Read",
      sub: 'One reading a day. Come back tomorrow for a new tower.',
      body: `<div class="rs-daily">🔮 Daily ${seed.replace('daily-','')}</div><div class="rs-row"><span>Result</span><b>${d.lastResult==='win'?'♔ Crowned':'Fell'}</b></div><div class="rs-row"><span>Score</span><b>${d.lastScore||0}</b></div><div class="rs-row"><span>Streak</span><b>${d.streak||1}🔥</b></div>`,
      choices: [{ label:'Close', onClick:()=>{} }]
    });
    return;
  }
  // Starting the daily abandons any non-daily run in progress.
  if(state.run && !state.run.daily && !confirm("Begin today's Daily Spread? Your current run will end.")) return;
  startDailyRun(seed);
};
// B14 — walk the enemy's strike through visually. endTurn() stays fully
// synchronous (tests rely on it); this only PACES the reveal of a result
// that already happened. UI-only + rAF-guarded → engine/tests untouched.
function playStrikeFX(intent, dmg){
  const wasAttack = !!(intent && intent.type === 'attack');
  const portrait = document.getElementById('enemy-portrait');
  const screen = document.getElementById('combat-screen') || document.body;
  if(portrait){ portrait.classList.remove('attacking'); void portrait.offsetWidth; portrait.classList.add('attacking'); }
  setTimeout(() => {
    if(screen){ screen.classList.remove('combat-shake'); void screen.offsetWidth;
      if(dmg > 0) screen.classList.add('combat-shake'); }
    const fx = document.createElement('div'); fx.id = 'strike-fx';
    const soft = !(dmg > 0);
    let html = `<div class="sfx-flash${soft?' soft':''}"></div>`;
    if(dmg > 0 || wasAttack) html += `<div class="sfx-slash"></div>`;
    if(dmg > 0) html += `<div class="sfx-num">−${dmg}</div>`;
    else if(wasAttack) html += `<div class="sfx-num blocked">⛨ BLOCKED</div>`;
    fx.innerHTML = html;
    document.body.appendChild(fx);
    setTimeout(() => { fx.remove(); if(screen) screen.classList.remove('combat-shake'); }, 950);
  }, 230);
}
// B23 — capture the CURRENT hand's rendered cards BEFORE endTurn() wipes
// it, so we can fly them to the discard pile. Clones only — the real
// hand is rebuilt by endTurn→renderCombat. rAF-gated → inert in sims.
function snapshotHand(){
  const out = [];
  if(typeof requestAnimationFrame !== 'function') return out;
  document.querySelectorAll('#hand .card').forEach(el => {
    const clone = el.cloneNode(true);
    clone.onclick = null;
    out.push({ clone, rect: el.getBoundingClientRect() });
  });
  return out;
}
function sweepHandToDiscard(snap){
  if(typeof requestAnimationFrame !== 'function' || !snap.length) return;
  const pile = document.getElementById('pile-discard');
  const pr = pile ? pile.getBoundingClientRect()
    : { left: window.innerWidth/2 - 20, top: window.innerHeight - 40, width:40, height:40 };
  const tx = pr.left + pr.width/2, ty = pr.top + pr.height/2;
  snap.forEach((s, i) => {
    const c = s.clone;
    c.classList.add('discard-fly');
    c.style.left = s.rect.left + 'px'; c.style.top = s.rect.top + 'px';
    c.style.width = s.rect.width + 'px'; c.style.height = s.rect.height + 'px';
    document.body.appendChild(c);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      c.style.transitionDelay = (i * 38) + 'ms';
      const dx = tx - (s.rect.left + s.rect.width/2);
      const dy = ty - (s.rect.top + s.rect.height/2);
      c.style.transform = `translate(${dx}px,${dy}px) scale(0.26) rotate(${(i%2?1:-1)*20}deg)`;
      c.style.opacity = '0.12';
    }));
    setTimeout(() => c.remove(), 560 + i * 38);
  });
}
function dealInHand(){
  if(typeof requestAnimationFrame !== 'function') return;
  const cards = document.querySelectorAll('#hand .card');
  cards.forEach((c, i) => { c.style.animationDelay = (i * 45) + 'ms'; c.classList.add('dealt'); });
  setTimeout(() => cards.forEach(c => c.classList.remove('dealt')), 360 + cards.length * 45);
}
function endTurnWithFX(){
  const r = state.run;
  if(!r || !r.combat || !r.combatPlayer || !r.combatEnemy){ endTurn(); return; }
  // B23 — the FIRST time you'd discard unplayed cards, teach the rule once.
  const losingCards = r.combatPlayer.hand.some(c => !c.ephemeral);
  if(losingCards && !(state.meta && state.meta.taughtHandReset) && typeof requestAnimationFrame === 'function'){
    showModal({
      title: 'The Hand Resets',
      sub: 'Every turn is a fresh deal.',
      body: 'At the end of each turn your unplayed cards slide to the <b>discard pile</b> and you draw a new hand. They are <b>not lost</b> — when the draw pile runs dry it reshuffles from the discard. So spend each turn fully: a card you hold is a card wasted.',
      choices: [{ icon:'↻', label:'I understand', onClick: () => { if(state.meta) state.meta.taughtHandReset = true; saveState(); endTurnWithFX(); } }]
    });
    return;
  }
  const intent = Object.assign({}, r.combatEnemy.intent);
  const hpBefore = r.combatPlayer.hp;
  const snap = snapshotHand();              // BEFORE endTurn wipes the hand
  endTurn(); // engine resolves synchronously
  if(typeof requestAnimationFrame !== 'function') return;
  if(!state.run.combat || state.run.combatPlayer.hp <= 0 || state.run.combatEnemy.hp <= 0) return;
  sweepHandToDiscard(snap);                 // old hand flies away
  dealInHand();                             // new hand deals in
  playStrikeFX(intent, hpBefore - state.run.combatPlayer.hp);
}
document.getElementById('btn-end-turn').onclick = endTurnWithFX;
document.getElementById('btn-flee-map').onclick = () => {
  if(confirm('Leave the tower? Your run will end.')){
    state.run = null;
    saveState();
    showScreen('title-screen');
    refreshTitle();
  }
};
document.getElementById('pile-draw').onclick = () => showPile('draw');
document.getElementById('pile-discard').onclick = () => showPile('discard');
function showPile(which){
  const ctx = getCtx();
  const pile = which === 'draw' ? ctx.player.draw.slice() : ctx.player.discard.slice();
  document.getElementById('pile-title').textContent = which === 'draw' ? 'Draw Pile' : 'Discard';
  const body = document.getElementById('pile-body');
  body.innerHTML = '';
  // sort draw pile alphabetically so it doesn't leak order; show discard in order
  if(which === 'draw') pile.sort((a,b) => CARD_BY_ID[a.cardId].name.localeCompare(CARD_BY_ID[b.cardId].name));
  pile.forEach(entry => {
    const card = CARD_BY_ID[entry.cardId];
    const el = renderCardElement(card, { reversed: entry.reversed });
    el.onclick = () => showCardInspect(card, entry);
    body.appendChild(el);
  });
  showScreen('pile-screen');
}
document.getElementById('ci-close').onclick = () => {
  document.getElementById('card-inspect').classList.remove('active');
};
document.getElementById('card-inspect').onclick = (e) => {
  if(e.target.id === 'card-inspect') document.getElementById('card-inspect').classList.remove('active');
};

/* Art auto-loader */
const ART_CACHE = new Map();
function hydrateArt(){
  document.querySelectorAll('[data-art-slot]').forEach(el => {
    const slot = el.getAttribute('data-art-slot');
    if(!slot || !el.classList.contains('placeholder')) return;
    if(el.querySelector('img')) return;
    const cached = ART_CACHE.get(slot);
    if(cached === 'missing' || cached === 'pending') return;
    ART_CACHE.set(slot, 'pending');
    const img = new Image();
    img.onload = () => {
      ART_CACHE.set(slot, 'loaded');
      document.querySelectorAll(`[data-art-slot="${slot}"]`).forEach(target => {
        target.classList.remove('placeholder');
        const ix = new Image();
        ix.src = `art-slots/${slot}.png`;
        target.appendChild(ix);
      });
    };
    img.onerror = () => ART_CACHE.set(slot, 'missing');
    img.src = `art-slots/${slot}.png`;
  });
}

/* Render hook: call hydrateArt after every render */
const _origRenderHand = renderHand;
renderHand = function(){ _origRenderHand(); hydrateArt(); };
const _origRenderMap = renderMap;
renderMap = function(){ _origRenderMap(); hydrateArt(); };
const _origRenderCodex = renderCodex;
renderCodex = function(){ _origRenderCodex(); hydrateArt(); };

/* PWA install */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

loadState();
migrateMeta();   // B31 — ensure meta defaults (daily, bestScore, …) exist even for a brand-new player (no save → loadState returns early)
refreshTitle();
hydrateArt();

</script>
