  pents: ['pents-1','pents-1','pents-2','pents-3','pents-4','pents-5','pents-6',
          'pents-7','pents-9','swords-5','swords-2','cups-2','cups-1',
          'wands-4','wands-2','major-0'],
};
function buildPatronDeck(primary){
  const ids = PATRON_DECKS[primary] || PATRON_DECKS.wands;
  return ids.map(id => ({ cardId:id, reversed:false }));
}

/* ============ THE SPREAD — persistent Arcana boons ============
   Claim a Major Arcanum after an elite. It's a permanent run passive
   that fires at the start of every combat — the Hades-style choice
   that defines your build mid-run. */
const ARCANA_BOONS = {
  'major-4':  { name:'The Emperor',        glyph:'♚', desc:'Begin each combat with 12 Block.',
    start:(p)=>{ p.block += 12; } },
  'major-19': { name:'The Sun',            glyph:'☀', desc:'Begin each combat with +2 Strength.',
    start:(p)=>{ p.buffs.strength = (p.buffs.strength||0) + 2; } },
  'major-17': { name:'The Star',           glyph:'✶', desc:'Begin each combat: heal 8.',
    start:(p)=>{ p.hp = Math.min(p.maxHp, p.hp + 8); } },
  'major-2':  { name:'The High Priestess', glyph:'☽', desc:'Begin each combat with 8 Ward.',
    start:(p)=>{ p.buffs.ward = (p.buffs.ward||0) + 8; } },
  'major-3':  { name:'The Empress',        glyph:'♀', desc:'Begin each combat: 6 Block and heal 4.',
    start:(p)=>{ p.block += 6; p.hp = Math.min(p.maxHp, p.hp + 4); } },
  'major-1':  { name:'The Magician',       glyph:'☿', desc:'Gain +1 energy on turn 1 of each combat.',
    start:(p)=>{ p.energy += 1; } },
  'major-7':  { name:'The Chariot',        glyph:'⛣', desc:'Begin each combat with +1 Strength and 6 Block.',
    start:(p)=>{ p.buffs.strength = (p.buffs.strength||0) + 1; p.block += 6; } },
  'major-21': { name:'The World',          glyph:'❂', desc:'Begin each combat with +1 Strength, 6 Block, 6 Ward.',
    start:(p)=>{ p.buffs.strength = (p.buffs.strength||0) + 1; p.block += 6; p.buffs.ward = (p.buffs.ward||0) + 6; } },
};
function applyArcanaStart(player, run){
  (run.spread || []).forEach(id => {
    const b = ARCANA_BOONS[id];
    if(b && b.start) b.start(player, run);
  });
}

function freshRun(seedStr, patronId){
  const seed = strHash(seedStr || ('run-' + Date.now()));
  const rng = mulberry32(seed);

  // Generate path: act 1's 15 floors (later acts regen via enterNextAct)
  const path = generatePath(rng, 1);

  const patron = PATRONS[patronId] || PATRONS.magician;
  const deck = buildPatronDeck(patron.primary);
  shuffleInPlace(deck, rng);

  // THE VEILS — which difficulty the player chose, clamped to what they've
  // unlocked. Read the maxHp floor straight from the chosen Veil's mods so
  // the starting pool is right from frame one. Veil 0 → 60, the base game.
  const veilIdx = Math.min((state.meta.selectedVeil) || 0, (state.meta.veil) || 0);
  const baseMax = ((VEILS[veilIdx] && VEILS[veilIdx].mods && VEILS[veilIdx].mods.maxHp) || 60) + mirrorBonusMaxHp();

  return {
    seed: seedStr, rngSeed: seed,
    patron: patron.id,
    veil: veilIdx,       // B25 — the lifted Veil for THIS run (difficulty mods)
    spread: [],          // claimed Arcana boon ids (persistent run passives)
    act: 1,              // B22 — which of ACTS we're climbing (1-based)
    floor: 0,
    hp: baseMax, maxHp: baseMax,
    gold: mirrorBonusGold(),
    relics: [patron.relic],
    deck, // full owned deck (for reward display)
    path,
    currentNode: null,
    combat: null,
    // B30 — run records, scored + shown in the end-of-run summary.
    tally: { enemiesSlain:0, elitesSlain:0, bossesSlain:0, chainsDetonated:0,
             propheciesFulfilled:0, cardsPlayed:0, biggestHit:0, longestChain:0 },
    daily: false,        // B31 — set true by the Daily Spread
  };
}

// B26 — the combat roster for an act. Enemies tagged with `acts:[…]` only
// appear in those acts; untagged enemies appear in all. Within an act we
// still want early floors to draw lighter foes (by tier), but if an act has
// no enemy of the requested tier we fall back to the closest tier present,
// so every act always has a valid cast and never reaches into another act's.
function combatEnemiesFor(act, tier){
  const inAct = ENEMIES.filter(e => !e.elite && !e.boss && (e.acts ? e.acts.includes(act) : true));
  let pool = inAct.filter(e => e.tier === tier);
  if(!pool.length && inAct.length){
    const tiers = Array.from(new Set(inAct.map(e => e.tier))).sort((a,b) => a - b);
    const atOrBelow = tiers.filter(t => t <= tier);
    const target = atOrBelow.length ? atOrBelow[atOrBelow.length - 1] : tiers[0];
    pool = inAct.filter(e => e.tier === target);
  }
  if(!pool.length) pool = ENEMIES.filter(e => e.tier === tier && !e.elite && !e.boss); // global safety net
  return pool;
}
function eliteEnemiesFor(act){
  let pool = ENEMIES.filter(e => e.elite && (e.acts ? e.acts.includes(act) : true));
  if(!pool.length) pool = ENEMIES.filter(e => e.elite);
  return pool;
}

function generatePath(rng, act){
  // 15 floors. Floor 0 is start, 14 is boss. The boss is THIS act's boss.
  // Each floor has 1-2 nodes to choose from. Floor types weighted by depth.
  act = act || 1;
  const bossId = (ACTS[(act - 1)] || ACTS[0]).bossId;
  const floors = [];
  for(let i=0;i<15;i++){
    let nodes;
    if(i === 14) nodes = [{ type:'boss', enemyId: bossId }];
    else if(i === 0) nodes = [{ type:'combat', enemyId: pickRand(combatEnemiesFor(act, 1).map(e=>e.id), rng) }];
    else if(i === 4 || i === 9) nodes = [{ type:'treasure' }];
    else if(i === 6 || i === 11) nodes = [{ type:'merchant' }, { type:'rest' }];  // B20 — shop vs heal: a real choice
    else if(i === 8 || i === 12) nodes = [
      { type:'elite', enemyId: pickRand(eliteEnemiesFor(act).map(e=>e.id), rng) },
      { type:'rest' },
    ];
    else {
      const nodeCount = rng() < 0.55 ? 2 : 1;
      nodes = [];
      for(let k=0;k<nodeCount;k++){
        const roll = rng();
        let type;
        if(roll < 0.55) type = 'combat';
        else if(roll < 0.75) type = 'event';
        else if(roll < 0.88) type = 'rest';
        else if(roll < 0.94) type = 'treasure';
        else type = 'merchant';   // B20 — occasional extra shop on top of the two guaranteed
        const node = { type };
        if(type === 'combat'){
          const tier = i < 5 ? 1 : (i < 10 ? 2 : 3);
          node.enemyId = pickRand(combatEnemiesFor(act, tier).map(e=>e.id), rng);
        }
        nodes.push(node);
      }
    }
    floors.push({ index:i, nodes, completed:false, chosenNode: null });
  }
  return floors;
}

/* =====================================================================
   6. COMBAT ENGINE
   ===================================================================== */

function startCombat(enemyId){
  const run = state.run;
  const enemyDef = ENEMY_BY_ID[enemyId];
  const rng = mulberry32(run.rngSeed + run.floor * 7919);

  // THE PROPHECY — the Reading foretells a suit SEQUENCE (Past→Present→
  // Future). Fulfil it by playing minors of those suits in order (any
  // turns) for a one-time payoff. The Patron's primary suit is weighted
  // so the starter deck can realistically complete it. Ignore it freely
  // — it never punishes, it's opt-in depth.
  const PROPHECY_SUITS = ['wands','cups','swords','pents'];
  const _prim = (PATRONS[run.patron] && PATRONS[run.patron].primary) || 'wands';
  const _pool = PROPHECY_SUITS.concat([_prim, _prim]);   // bias toward your suit
  const reading = [0,1,2].map(() => _pool[Math.floor(rng() * _pool.length)]);

  // Build draw pile from owned deck
  const drawPile = run.deck.map(c => ({ cardId: c.cardId, reversed:false, studied: !!c.studied }));
  shuffleInPlace(drawPile, rng);

  const combat = {
    enemyId, rng,
    turn: 1,
    reading, // [suit,suit,suit] — the foretold Prophecy (Past/Present/Future)
    prophecyProgress: 0,   // steps fulfilled, in order
    prophecyDone: false,
    reward: null,
    log: [],
    turnCostMod: 0,
    hangedManCost: 0,
    aspectsTriggeredThisTurn: {},
    cardsPlayedThisTurn: 0,
    healedThisCombat: 0,
    chainSuit: null,         // The Chain: consecutive same-suit combo this turn
    chainCount: 0,
    firstAttackThisCombat: true,
    currentMajorCast: null,
    // pending choice modal (e.g. discard choice, lover choice)
    pendingChoice: null,
    // The Cut (active Reading skill) result. 'silent' = legacy behavior;
    // set by cutTheDeck() on the UI path only — engine/tests never change it.
    readingFortune: 'silent',
    // Patron Channel: feed 1 card/turn to your Patron so no card is ever
    // dead. UI-only (channelCard); defaults here are inert for engine/tests.
    channeledThisTurn: false,
    channelFedCount: 0,
    // The Turn of Fate — Priestess may turn one card's fate per turn.
    fateTurnedThisTurn: false,
  };

  const player = {
    energy: 3, maxEnergy: 3,
    block: 0,
    hp: run.hp, maxHp: run.maxHp,
    gold: run.gold,
    hand: [],
    draw: drawPile,
    discard: [],
    buffs: {},
    debuffs: {},
  };
  // Querent's Coin: +1 energy on turn 1
  if(run.relics.includes('querents-coin')) player.energy += 1;
  // Wax Mask: gain block at start
  if(run.relics.includes('wax-mask')) player.block += 6;
  // Fool's Feather
  if(run.relics.includes('fools-feather')) player.hand.push({ cardId:'major-0', reversed:false, ephemeral:true });
  // The Spread: persistent Arcana boons
  applyArcanaStart(player, run);
  // The Mirror: Deep Reading talent
  if(mirrorBonusWard() > 0) player.buffs.ward = (player.buffs.ward || 0) + mirrorBonusWard();

  const enemy = {
    hp: Math.round((enemyDef.hp + Math.floor(globalDepth() * 1.2)) * veilMod('enemyHp', 1)),
    maxHp: 0,
    block: 0,
    debuffs: {},
    intent: null,
    intentSeq: 0,
  };
  enemy.maxHp = enemy.hp;
  enemy.intent = chooseEnemyIntent(enemyDef, enemy, rng);
  // B35 — The Tower: a 6-damage opener struck before the first hand.
  if(run.relics.includes('the-tower')) enemy.hp = Math.max(0, enemy.hp - 6);

  // Apply reading "Past" effect (drawn but not consumed by play)
  // (The reading reveal happens in UI; effects fire when player chooses to read each card)

  run.combat = combat;
  run.combatPlayer = player;
  run.combatEnemy = enemy;

  // B37 — high Veils seed every fight with a curse in the draw pile.
  if(veilMod('startCurse', false)) player.draw.push({ cardId:'curse-doubt', reversed:false });
  // B36 — apply a Tempt-the-Tower dare to THIS fight, if accepted.
  if(run.tempt){
    if(run.tempt.mod === 'strength') enemy.debuffs.strength = (enemy.debuffs.strength || 0) + 3;
    else if(run.tempt.mod === 'drain') player.energy = Math.max(0, player.energy - 1);
    else if(run.tempt.mod === 'curse') player.draw.unshift({ cardId:'curse-doubt', reversed:false });
  }
  // initial draw 5 (The Seventh Veil: +1)
  const ctx = { player, enemy, combat, run };
  drawCards(ctx, 5 + (run.relics.includes('seventh-veil') ? 1 : 0));

  showScreen('combat-screen');
  resetCombatFXState();   // B19 — don't FX the first paint off the last fight's numbers
  renderCombat();
  // B32 — first fight ever: teach the essentials (incl. the hidden long-press verb).
  teachOnce('combatBasics', {
    title: 'The Reading Begins',
    sub: 'Spend your hand to break the keeper before it breaks you.',
    body: 'Each turn you have <b>energy</b> to play cards. The enemy shows its next move as an <b>intent</b> — block it or out-race it. Unplayed cards <b>discard</b> at end of turn, so spend fully.<br><br><b>Long-press</b> (or right-click) any card to inspect it — and to <b>Channel</b> it to your Patron once per turn instead of playing it.',
    icon: '☼', label: 'Begin'
  });
  return ctx;
}

function chooseEnemyIntent(enemyDef, enemy, rng){
  // Random, but never the same intent twice in a row — keeps the telegraph
  // meaningful and stops enemies stalling on one move.
  const intents = enemyDef.intents;
  if(intents.length <= 1) return intents[0];
  let idx;
  do { idx = Math.floor(rng() * intents.length); }
  while(intents.length > 1 && idx === enemy.lastIntentIdx);
  enemy.lastIntentIdx = idx;
  return intents[idx];
}

function getCtx(){
  return { player: state.run.combatPlayer, enemy: state.run.combatEnemy, combat: state.run.combat, run: state.run };
}

function playCard(handIdx){
  const ctx = getCtx();
  const handEntry = ctx.player.hand[handIdx];
  if(!handEntry) return;
  const card = CARD_BY_ID[handEntry.cardId];
  if(!card) return;
  // B28 — curses are unplayable dead weight; they only leave the hand at
  // the end-of-turn discard. Refuse with the standard "can't play" shake.
  if(card.unplayable){ flashUnplayable(handIdx); return; }

  // THE CHAIN — consecutive same-suit minor cards build an escalating
  // combo. Off-suit (or a gap) breaks it. Majors are wild: they neither
  // build nor break the chain. Pushing the chain costs escalating energy
  // (the "chain tax"), so a big combo is a real investment you must
  // afford and set up — not a free hand-dump.
  const MINOR = card.suit === 'wands' || card.suit === 'cups' || card.suit === 'swords' || card.suit === 'pents';
  const prospectiveChain = !MINOR ? 0
    : (ctx.combat.chainSuit === card.suit ? ctx.combat.chainCount + 1 : 1);
  const chainTax = MINOR ? chainTaxFor(prospectiveChain) : 0;

  let effectiveCost = card.cost + (ctx.combat.turnCostMod||0) + chainTax;
  // Ribbon of Fate: first card costs 0
  if(state.run.relics.includes('ribbon-of-fate') && ctx.combat.cardsPlayedThisTurn === 0) effectiveCost = 0;
  // Ace of Aces: aces cost 0
  if(state.run.relics.includes('ace-of-aces') && card.arcanaNum === 1 && card.suit !== 'major') effectiveCost = 0;
  effectiveCost = Math.max(0, effectiveCost);
  // THE TURN OF FATE — a Reversed Minor is cheaper but weaker
  const fateReversed = MINOR && handEntry.reversed && !card.reversedPlay;
  if(fateReversed) effectiveCost = Math.max(0, effectiveCost - 1);
  // B34 — Judgement's resurrected card honors its "costs 0 this turn" (the
  // flag was set but never read). Cleared on commit below.
  if(handEntry.zeroCostThisTurn) effectiveCost = 0;

  if(ctx.player.energy < effectiveCost){ flashUnplayable(handIdx); return; }

  // Check Major Arcana once-per-combat limit
  if(card.suit === 'major'){
    if(ctx.combat.currentMajorCast){ flashUnplayable(handIdx); return; }
    ctx.combat.currentMajorCast = card.id;
  }

  // Remove from hand
  ctx.player.hand.splice(handIdx, 1);
  if(handEntry.zeroCostThisTurn) handEntry.zeroCostThisTurn = false;   // B34 — one free cast, then it's spent
  ctx.player.energy -= effectiveCost;
  ctx.combat.cardsPlayedThisTurn += 1;
  if(state.run && state.run.tally) state.run.tally.cardsPlayed++;

  // Commit the chain (only now that the card is actually played)
  if(MINOR){
    ctx.combat.chainSuit = card.suit;
    ctx.combat.chainCount = prospectiveChain;
    if(state.run && state.run.tally && prospectiveChain > state.run.tally.longestChain)
      state.run.tally.longestChain = prospectiveChain;
  }
  ctx.chainBonus = MINOR ? chainBonusFor(ctx.combat.chainCount) : 0;

  // Run the card's play function (potentially reversed).
  // Studied cards get +2; the Chain bonus rides on top of every effect.
  ctx.studyBonus = handEntry.studied ? 2 : 0;
  // B34 — Broken Mirror: "Reversed cards have +1 effect" (was un-wired).
  // Rides the same additive path as study/chain in the four output helpers.
  ctx.reversedBonus = (handEntry.reversed && state.run.relics.includes('broken-mirror')) ? 1 : 0;
  if(fateReversed) ctx.fateMult = fateMultFor();
  const result = handEntry.reversed && card.reversedPlay
    ? card.reversedPlay(ctx)
    : card.play(ctx);
  ctx.fateMult = 1;
  ctx.studyBonus = 0;
  ctx.chainBonus = 0;
  ctx.reversedBonus = 0;
  // B35 — Gilded Frame: every Major you cast also raises a small guard.
  if(card.suit === 'major' && state.run.relics.includes('gilded-frame')) gainBlock(ctx, 3);
  // B35 — track the suit you're committing to, for archetype reward biasing.
  if(MINOR){ state.run.suitPlays = state.run.suitPlays || {}; state.run.suitPlays[card.suit] = (state.run.suitPlays[card.suit] || 0) + 1; }
  // Empress turns fate's downside into her blessing
  if(fateReversed && state.run.patron === 'empress') healPlayer(ctx, 3);

  // THE PROPHECY — a Minor of the next foretold suit advances the line;
  // the full Past→Present→Future sequence pays off once. It only ever
  // moves forward (off-suit never resets it) — opt-in depth, no punish.
  if(MINOR && !ctx.combat.prophecyDone &&
     ctx.combat.reading[ctx.combat.prophecyProgress] === card.suit){
    ctx.combat.prophecyProgress += 1;
    const _pb = document.getElementById('aspect-banner');
    if(ctx.combat.prophecyProgress >= 3){
      ctx.combat.prophecyDone = true;
      if(state.run && state.run.tally) state.run.tally.propheciesFulfilled++;
      healPlayer(ctx, 12);
      dealDamage(ctx, 12);
      ctx.player.maxEnergy += 1;
      ctx.player.energy += 1;
      if(_pb){ _pb.textContent = '✦ PROPHECY FULFILLED ✦';
        _pb.classList.remove('show'); void _pb.offsetWidth; _pb.classList.add('show'); }
    } else if(_pb){
      const _pos = ['Past','Present','Future'][ctx.combat.prophecyProgress - 1] || '';
      _pb.textContent = `THE READING · ${_pos} foretold ✦`;
      _pb.classList.remove('show'); void _pb.offsetWidth; _pb.classList.add('show');
    }
    if(ctx.combat.prophecyProgress === 1){
      teachOnce('prophecy', {
        title: 'The Prophecy', sub: 'The Reading foretells three suits.',
        body: 'Your Reading names a sequence — <b>Past · Present · Future</b>. Play Minors of those suits <b>in order</b> (any turns). Off-suit never resets it, so it only ever moves forward. Complete all three for a one-time payoff: <b>heal, a strike, and +1 max energy</b>.',
        icon: '☽', label: 'I\'ll follow it'
      });
    }
  }

  // Loud, legible feedback so the combo is *felt*. Chain 3 is the
  // Aspect moment — let triggerAspect own the banner there.
  if(MINOR && ctx.combat.chainCount >= 2 && ctx.combat.chainCount !== 3){
    teachOnce('chain', {
      title: 'The Chain', sub: 'Same suit, again and again.',
      body: 'Playing Minors of the <b>same suit in a row</b> builds a Chain — each link adds escalating power (<b>+3 / +6 / +10 / +15</b>). Off-suit breaks it; Majors are wild. A chain of <b>3</b> detonates that suit\'s <b>Aspect</b> — a loud payoff.',
      icon: '⛓', label: 'Keep the chain'
    });
    showChainBanner(card.suit, ctx.combat.chainCount, chainBonusFor(ctx.combat.chainCount));
  }

  // Track card discovery
  state.meta.discoveredCards[card.id] = state.meta.discoveredCards[card.id] || { name: card.name, seen: 0, played: 0 };
  state.meta.discoveredCards[card.id].played += 1;

  // Send to discard (unless ephemeral)
  if(!handEntry.ephemeral){
    ctx.player.discard.push(handEntry);
  }

  // The Chain IS the suit mechanic now (no separate Aspect Resonance):
  // a chain of exactly 3 detonates the suit's Aspect as a loud capstone,
  // on top of the smooth +2/step. One legible mechanic, one payoff moment.
  if(MINOR && ctx.combat.chainCount === 3){
    triggerAspect(card.suit);
  }

  // Silvered Tooth: first attack each combat strikes twice
  if(state.run.relics.includes('silvered-tooth') && ctx.combat.firstAttackThisCombat && result && (result.damage > 0 || result.pierce > 0)){
    ctx.combat.firstAttackThisCombat = false;
    // crude: re-apply the card's damage half (simulate "twice")
    if(result.damage > 0) dealDamage(ctx, Math.floor(result.damage * 0.7));
    if(result.pierce > 0) dealPierce(ctx, Math.floor(result.pierce * 0.7));
  }
  if(result && (result.damage > 0 || result.pierce > 0)) ctx.combat.firstAttackThisCombat = false;

  // Iron Chalice: heal triggers draw (once per turn)
  if(state.run.relics.includes('iron-chalice') && result && result.healing > 0 && !ctx.combat.chaliceUsedThisTurn){
    ctx.combat.chaliceUsedThisTurn = true;
    drawCards(ctx, 1);
  }
  // Dancer's Bell: every 3rd card → +1 energy
  if(state.run.relics.includes('dancers-bell') && ctx.combat.cardsPlayedThisTurn % 3 === 0){
    ctx.player.energy += 1;
  }
  // Sealed Letter: Major draws extra
  if(state.run.relics.includes('sealed-letter') && card.suit === 'major' && !ctx.combat.sealedLetterUsedThisCard){
    ctx.combat.sealedLetterUsedThisCard = true;
    drawCards(ctx, 1);
  }

  // Visualize
  if(result && (result.damage > 0 || result.pierce > 0)){
    showDamagePop(result.damage || result.pierce);
    document.getElementById('enemy-portrait').classList.add('hit');
    setTimeout(()=>document.getElementById('enemy-portrait').classList.remove('hit'), 280);
  }
  if(result && result.healing > 0) showDamagePop(result.healing, 'heal');
  if(result && result.block) showDamagePop(result.block, 'block');

  // Pending choices?
  if(result){
    if(result.mustDiscard) ctx.combat.pendingChoice = { type:'discard', n: result.mustDiscard };
    if(result.peekTop) ctx.combat.pendingChoice = { type:'peek', n: result.peekTop };
    if(result.tutorFromDraw) ctx.combat.pendingChoice = { type:'tutor', n: result.tutorFromDraw };
    if(result.lovers) ctx.combat.pendingChoice = { type:'lovers' };
    if(result.resurrectFromDiscard) ctx.combat.pendingChoice = { type:'resurrect', n: result.resurrectFromDiscard };
  }

  renderCombat();
  checkCombatEnd();

  if(ctx.combat.pendingChoice) resolvePendingChoice();
}

function triggerAspect(suit){
  const ctx = getCtx();
  if(state.run && state.run.tally) state.run.tally.chainsDetonated++;
  const banner = document.getElementById('aspect-banner');
  let text = '';
  // B21 — the chain-of-3 capstone hits ~1.5× harder. It's the payoff
  // for the whole Web; it should feel like a detonation, not a footnote.
  if(suit === 'wands'){
    applyBuff(ctx, 'strength', 5);
    text = 'ASPECT OF WANDS';
  } else if(suit === 'cups'){
    healPlayer(ctx, 10);
    text = 'ASPECT OF CUPS';
  } else if(suit === 'swords'){
    applyDebuff(ctx, 'vulnerable', 3);
    text = 'ASPECT OF SWORDS';
  } else if(suit === 'pents'){
    gainBlock(ctx, 16);
    text = 'ASPECT OF PENTACLES';
  } else if(suit === 'major'){
    drawCards(ctx, 3);
    text = 'GREAT ARCANA';
  }
  banner.textContent = text;
  banner.classList.remove('show'); void banner.offsetWidth;
  banner.classList.add('show');
  aspectFX(suit);
}

// B21 — the Aspect now lands with a screen punch: a suit-coloured
// full-screen bloom + shake. UI-only, rAF-guarded (inert under the
// sim/test stub DOM — same gate as the rest of the FX layer).
function aspectFX(suit){
  if(typeof requestAnimationFrame !== 'function') return;
  const tint = { wands:'232,104,47', cups:'62,114,134', swords:'150,150,165',
                  pents:'201,162,90', major:'212,165,116' }[suit] || '212,165,116';
  const screen = document.getElementById('combat-screen') || document.body;
  if(screen){ screen.classList.remove('combat-shake'); void screen.offsetWidth; screen.classList.add('combat-shake'); }
  const fx = document.createElement('div'); fx.id = 'aspect-fx';
  fx.style.background = `radial-gradient(circle at 50% 46%, rgba(${tint},0) 38%, rgba(${tint},0.42) 100%)`;
  document.body.appendChild(fx);
  setTimeout(() => { fx.remove(); if(screen) screen.classList.remove('combat-shake'); }, 760);
}

// The Chain bonus curve: the Nth same-suit card in a row adds this to
// every Strike/Pierce/Block/Heal it does. B21 — escalates STEEPLY so a
// built, well-sequenced chain massively out-performs scattershot play
// (the stress test showed mashing ≈ comboing; this makes the Web the
// reason to play). The chain TAX (chainTaxFor) stays LOCKED — we buy
// more reward, not cheaper cost.
function chainBonusFor(count){
  if(count <= 1) return 0;
  if(count === 2) return 3;
  if(count === 3) return 6;
  if(count === 4) return 10;
  return 15;                              // 2→+3, 3→+6, 4→+10, 5+→+15
}
// The Chain TAX — extra energy to extend a chain. First CHAIN_TAX_FREE
// cards are free (basic 2-combo costs nothing); pushing a BIG chain is
// the real investment decision. Capped so it bites but never bricks you.
// Single source of truth: both playCard and renderHand call this.
const CHAIN_TAX_FREE = 2;
const CHAIN_TAX_CAP  = 3;
function chainTaxFor(prospectiveChain){
  let tax = Math.max(0, Math.min(CHAIN_TAX_CAP, prospectiveChain - CHAIN_TAX_FREE));
  // B35 — Weaver's Thread: keep longer chains affordable.
  if(state.run && state.run.relics && state.run.relics.includes('weavers-thread')) tax = Math.max(0, tax - 1);
  // B37 — high Veils make the Chain a costlier commitment.
  if(prospectiveChain > 0) tax += veilMod('chainTaxPlus', 0);
  return tax;
}

/* THE TURN OF FATE — Minor cards may be drawn Reversed: a universal
   twist (−1 cost, weaker effect). VISIBLE on draw, and each Patron bends
   fate differently. Scoped to Minors so Major powers / pre-reversed
   curse cards keep their own behavior. Upright = fateMult 1.0 → the
   engine path is byte-identical for non-reversed cards (tests unaffected). */
const FATE_BASE_CHANCE = 0.22;          // base reverse chance on draw
const FATE_REVERSED_MULT = {            // how hard fate bites this Patron
  magician:0.60, priestess:0.60, empress:0.60, emperor:0.80 };
function fateMultFor(){ return FATE_REVERSED_MULT[ state.run && state.run.patron ] || 0.60; }
function fateChanceFor(){
  const pid = state.run && state.run.patron;
  let ch = pid === 'magician' ? 0 : FATE_BASE_CHANCE;   // Magician forces Upright
  if(state.run && state.run.relics && state.run.relics.includes('broken-mirror')) ch += 0.15;
  if(state.run && state.run.relics && state.run.relics.includes('loaded-dice')) ch += 0.10;   // B35
  return ch;
}
const SUIT_LABEL = { wands:'WANDS', cups:'CUPS', swords:'SWORDS', pents:'PENTACLES' };
function showChainBanner(suit, count, bonus){
  const banner = document.getElementById('aspect-banner');
  if(!banner) return;
  banner.textContent = `${SUIT_LABEL[suit]||''} CHAIN ×${count}  +${bonus}`;
  banner.classList.remove('show'); void banner.offsetWidth;
  banner.classList.add('show');
}

/* THE PATRON CHANNEL — once per turn you may feed ANY card from hand to
   your Patron instead of playing it. No card is ever dead: worst case it
   fuels your Patron's identity, and that identity differs per Patron so
   your "leftovers" play differently depending on who you are. UI-only
   (invoked from the card-inspect modal); the engine/tests never call it,
   and the combat-state defaults are inert. */
const PATRON_CHANNEL = {
  magician:  { label:'+1 energy',            apply:(ctx)=>{ ctx.player.energy += 1; } },
  priestess: { label:'Draw 1',               apply:(ctx)=>{ drawCards(ctx, 1); } },
  empress:   { label:'Heal 4 · +3 Ward',     apply:(ctx)=>{ healPlayer(ctx, 4); ctx.player.buffs.ward = (ctx.player.buffs.ward||0) + 3; } },
  emperor:   { label:'Block 6 · Plate per 3',apply:(ctx)=>{ gainBlock(ctx, 6); ctx.combat.channelFedCount = (ctx.combat.channelFedCount||0) + 1; if(ctx.combat.channelFedCount % 3 === 0) ctx.player.buffs.plate = (ctx.player.buffs.plate||0) + 1; } },
};
function patronChannel(){ return PATRON_CHANNEL[ state.run && state.run.patron ] || PATRON_CHANNEL.magician; }
function channelCard(handIdx){
  const ctx = getCtx();
  if(!ctx || !ctx.combat || ctx.combat.channeledThisTurn) return;
  const entry = ctx.player.hand[handIdx];
  if(!entry) return;
  ctx.player.hand.splice(handIdx, 1);
  if(!entry.ephemeral) ctx.player.discard.push(entry);   // stays in the deck cycle
  const pc = patronChannel();
  pc.apply(ctx);
  ctx.combat.channeledThisTurn = true;
  const banner = document.getElementById('aspect-banner');
  if(banner){ banner.textContent = `CHANNELLED  ·  ${pc.label}`;
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show'); }
  const ov = document.getElementById('card-inspect');
  if(ov) ov.classList.remove('active');
  renderCombat();
}

/* The Priestess bends fate: 1×/turn she may turn a Minor's fate
   (Reverse it for the discount, or Right a bad Reversed). UI-only. */
function turnFate(handIdx){
  const ctx = getCtx();
  if(!ctx || !ctx.combat || ctx.combat.fateTurnedThisTurn) return;
  if(!state.run || state.run.patron !== 'priestess') return;
  const entry = ctx.player.hand[handIdx];
  if(!entry) return;
  const card = CARD_BY_ID[entry.cardId];
  const isMinor = card && (card.suit==='wands'||card.suit==='cups'||card.suit==='swords'||card.suit==='pents');
  if(!isMinor) return;
  entry.reversed = !entry.reversed;
  ctx.combat.fateTurnedThisTurn = true;
  const banner = document.getElementById('aspect-banner');
  if(banner){ banner.textContent = entry.reversed ? 'FATE REVERSED' : 'FATE RIGHTED';
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show'); }
  const ov = document.getElementById('card-inspect');
  if(ov) ov.classList.remove('active');
  renderCombat();
}

function endTurn(){
  const ctx = getCtx();
  // B28 — Cups "Resolve": gain block BEFORE the enemy strikes so it can
  // actually soak the incoming hit. (It was granted AFTER the attack and
  // then immediately wiped by the block reset below — completely inert.)
  if(ctx.player.buffs.resolve){ gainBlock(ctx, 4 * ctx.player.buffs.resolve); }
  // Resolve enemy intent
  if(ctx.enemy.hp > 0){
    resolveEnemyIntent(ctx);
  }
  // End-of-turn statuses
  // Burn: deals damage
  if(ctx.enemy.debuffs.burn){
    ctx.enemy.hp = Math.max(0, ctx.enemy.hp - ctx.enemy.debuffs.burn * 3);
  }
  // Resolve Hanged Man self-damage
  if(ctx.combat.hangedManCost){
    ctx.player.hp = Math.max(1, ctx.player.hp - ctx.combat.hangedManCost);
    ctx.combat.hangedManCost = 0;
  }
  // Resolve buffs/debuffs duration (subtract 1 from temporary ones)
  decayStatus(ctx.player.buffs);
  decayStatus(ctx.player.debuffs);
  decayStatus(ctx.enemy.debuffs);

  // Reset block + per-turn. NOTE: enemy block is intentionally NOT reset
  // here — it expires at the start of the enemy's own turn (resolveEnemyIntent),
  // so it persists through the player's turn (B28).
  ctx.player.block = 0;
  ctx.combat.cardsPlayedThisTurn = 0;
  ctx.combat.chainSuit = null;
  ctx.combat.chainCount = 0;
  ctx.combat.turnCostMod = 0;
  ctx.combat.aspectsTriggeredThisTurn = {};
  ctx.combat.chaliceUsedThisTurn = false;
  ctx.combat.channeledThisTurn = false;
  ctx.combat.fateTurnedThisTurn = false;
  ctx.combat.sealedLetterUsedThisCard = false;

  ctx.combat.turn += 1;
  ctx.player.energy = ctx.player.maxEnergy;
  if(state.run.relics.includes('querents-coin') && ctx.combat.turn === 1) ctx.player.energy += 1;

  // Thurible heal at turn start
  if(state.run.relics.includes('thurible')){
    healPlayer(ctx, 2);
  }

  // Discard hand
  ctx.player.hand.forEach(c => { if(!c.ephemeral) ctx.player.discard.push(c); });
  ctx.player.hand = [];

  // Choose enemy's next intent
  if(ctx.enemy.hp > 0){
    ctx.enemy.intent = chooseEnemyIntent(ENEMY_BY_ID[ctx.combat.enemyId], ctx.enemy, ctx.combat.rng);
  }

  // Draw 5
  drawCards(ctx, 5);

  renderCombat();
  checkCombatEnd();
}

function decayStatus(map){
  // Most statuses decay 1 per turn except 'persistent' ones
  const persistent = new Set(['strength','plate','ward']);
  Object.keys(map).forEach(k => {
    if(persistent.has(k)) return;
    map[k] = Math.max(0, map[k] - 1);
    if(map[k] === 0) delete map[k];
  });
}

// --- Enemy threat tuning knobs (sweep these, not the 30 table values) ---
const ENEMY_DMG_MULT   = 0.62;  // 1.0 = raw intent table; global threat dial
const ENEMY_FLOOR_SCALE = 0.25; // bonus damage per floor climbed

// B22 — difficulty climbs CONTINUOUSLY across acts. Act 2 floor 0 is
// as hard as act 1's boss-ish depth, and keeps rising. Defaults to
// (act 1) → globalDepth === floor, so sims/tests are byte-identical.
function globalDepth(){
  const r = state.run || {};
  return ((r.act || 1) - 1) * 15 + (r.floor || 0);
}

// THE single source of truth for what one enemy hit lands for. Both combat
// resolution and the on-screen telegraph call this, so the number shown is
// always exactly the number that hits.
function scaledEnemyHit(ctx, base){
  let dmg = (base + Math.floor(globalDepth() * ENEMY_FLOOR_SCALE)) * ENEMY_DMG_MULT * veilMod('enemyDmg', 1);
  if(ctx.enemy.debuffs && ctx.enemy.debuffs.strength) dmg += ctx.enemy.debuffs.strength;
  if(ctx.enemy.debuffs && ctx.enemy.debuffs.weak) dmg *= 0.75;
  return Math.max(0, Math.round(dmg));
}

// Apply incoming damage to the player: Block soaks first, then Ward
// (a persistent shield from Cups), then HP.
function damagePlayer(ctx, amount){
  // B35 — A Circle of Salt: ward off the first hit of each combat entirely.
  if(amount > 0 && ctx.combat && !ctx.combat.saltUsed && state.run && state.run.relics && state.run.relics.includes('salt-circle')){
    ctx.combat.saltUsed = true;
    return;
  }
  let dmg = amount;
  const blocked = Math.min(ctx.player.block, dmg);
  ctx.player.block -= blocked; dmg -= blocked;
  if(dmg > 0 && ctx.player.buffs.ward){
    const warded = Math.min(ctx.player.buffs.ward, dmg);
    ctx.player.buffs.ward -= warded; dmg -= warded;
    if(ctx.player.buffs.ward <= 0) delete ctx.player.buffs.ward;
  }
  if(dmg > 0){
    ctx.player.hp = Math.max(0, ctx.player.hp - dmg);
    if(ctx.player.hp === 0 && state.run.relics.includes('forgotten-name') && !ctx.combat.forgottenUsed){
      ctx.combat.forgottenUsed = true;
      ctx.player.hp = 10;
    }
  }
}

function resolveEnemyIntent(ctx){
  const intent = ctx.enemy.intent;
  if(!intent) return;

  // B28 — the enemy's block expires at the START of its own turn (STS rule),
  // then it gains fresh block from this intent. That fresh block now PERSISTS
  // through the player's next turn (endTurn no longer zeroes it), so Guard
  // intents matter and the Swords pierce identity (dealPierce ignores block)
  // finally means something.
  ctx.enemy.block = 0;

  // Primary: damage (every modern intent is an attack)
  if(intent.type === 'attack'){
    const repeats = intent.count || 1;
    for(let i=0;i<repeats;i++) damagePlayer(ctx, scaledEnemyHit(ctx, intent.value));
  } else if(intent.type === 'block'){            // legacy standalone (unused by new data)
    ctx.enemy.block += intent.value;
  } else if(intent.type === 'debuff'){
    ctx.player.debuffs[intent.key] = (ctx.player.debuffs[intent.key]||0) + intent.value;
  } else if(intent.type === 'buff'){
    ctx.enemy.debuffs[intent.key] = (ctx.enemy.debuffs[intent.key]||0) + intent.value;
  }

  // Riders that hang off an attack so no turn is a free pass:
  if(intent.debuff){
    ctx.player.debuffs[intent.debuff.key] = (ctx.player.debuffs[intent.debuff.key]||0) + intent.debuff.value;
  }
  if(intent.buff){
    ctx.enemy.debuffs[intent.buff.key] = (ctx.enemy.debuffs[intent.buff.key]||0) + intent.buff.value;
  }
  if(intent.selfBlock){
    ctx.enemy.block += intent.selfBlock;
  }
  if(intent.special === 'copy_block'){
    ctx.enemy.block += Math.max(0, ctx.player.block);
  } else if(intent.special === 'add_curse'){
    // B28 — a REAL curse: unplayable dead weight shuffled into your pile
    // (was a beneficial Death Major — i.e. a gift). It clots a future draw.
    ctx.player.discard.push({ cardId:'curse-doubt', reversed:false, ephemeral:false });
  }
}

function checkCombatEnd(){
  const ctx = getCtx();
  if(ctx.enemy.hp <= 0){
    onCombatWin();
  } else if(ctx.player.hp <= 0){
    onCombatLoss();
  }
}

function onCombatWin(){
  const run = state.run;
  run.hp = run.combatPlayer.hp;
  // Two of Coins relic
  if(run.relics.includes('two-of-coins')) run.gold += 5;
  // Standard gold drop
  run.gold += 10 + Math.floor(run.floor * 1.5);

  // Show reward modal: 3 random cards
  const rng = run.combat.rng;
  const enemy = ENEMY_BY_ID[run.combat.enemyId];
  const isElite = enemy.elite;
  const isBoss = enemy.boss;
  if(run.tally){
    run.tally.enemiesSlain++;
    if(isElite) run.tally.elitesSlain++;
    if(isBoss) run.tally.bossesSlain++;
  }

  // B36 — the Tower's Prize: a dare survived earns a guaranteed relic.
  let temptBanner = '';
  if(run.tempt){
    const undiscovered = RELICS.filter(r => !run.relics.includes(r.id));
    if(undiscovered.length){
      const r = pickRand(undiscovered, rng);
      run.relics.push(r.id); state.meta.relicsFound[r.id] = true;
      temptBanner = `☇ The Tower's Prize — <b>${r.name}</b>`;
    } else {
      run.gold += 40; temptBanner = `☇ The Tower's Prize — <b>40 gold</b>`;
    }
    run.tempt = null;
  }

  // Reward pool tier by GLOBAL depth (B35) — so later acts draft stronger
  // (act 2 floor 0 is already deep), not reset to commons each act.
  const depth = globalDepth();
  let pool;
  if(depth < 4) pool = ALL_CARDS.filter(c => c.rarity === 'common' || c.rarity === 'uncommon');
  else if(depth < 12) pool = ALL_CARDS.filter(c => c.rarity === 'uncommon' || c.rarity === 'rare');
  else pool = ALL_CARDS.filter(c => c.rarity === 'rare');
  // Bias toward more majors for elites/bosses
  if(isElite || isBoss){
    pool = pool.concat(MAJOR_CARDS);
  }

  const offered = [];
  const candidatePool = pool.slice();
  shuffleInPlace(candidatePool, rng);
  // B35 — ARCHETYPE BIAS: once you've committed to a suit (>=3 Minors played
  // this run), lead the offering with a matching card so a build can actually
  // assemble — the "I want to draft into my engine" fantasy.
  const sp = run.suitPlays || {};
  const domSuit = ['wands','cups','swords','pents'].sort((a,b) => (sp[b]||0) - (sp[a]||0))[0];
  if((sp[domSuit] || 0) >= 3){
    const match = candidatePool.find(c => c.suit === domSuit);
    if(match) offered.push(match);
  }
  for(const c of candidatePool){
    if(offered.length >= 3) break;
    if(!offered.find(o => o.id === c.id)) offered.push(c);
  }

  showRewardModal(offered, isBoss, isElite, temptBanner);
}

// After a card reward: elites also offer an Arcanum for The Spread.
function finishReward(isElite){
  const taken = new Set(state.run.spread || []);
  const choices = Object.keys(ARCANA_BOONS).filter(id => !taken.has(id));
  if(isElite && choices.length){
    showSpreadModal(choices);
  } else {
    advanceFloor();
  }
}

function showSpreadModal(choices){
  const rng = state.run.combat ? state.run.combat.rng : mulberry32(state.run.rngSeed + state.run.floor);
  const pool = choices.slice();
  shuffleInPlace(pool, rng);
  const offered = pool.slice(0, 3);
  const have = (state.run.spread||[]).map(id => ARCANA_BOONS[id] && ARCANA_BOONS[id].name).filter(Boolean);
  showModal({
    title: 'The Spread Deepens',
    sub: have.length ? `Your Spread: ${have.join(' · ')}` : 'Claim an Arcanum — it binds to you for the whole climb.',
    choices: offered.map(id => {
      const b = ARCANA_BOONS[id];
      return { icon:b.glyph, label:b.name, note:b.desc,
        onClick: () => { (state.run.spread = state.run.spread || []).push(id); saveState(); advanceFloor(); } };
    }).concat([{ icon:'⛒', label:'Refuse the cards', note:'Take nothing. Advance.', onClick:()=>advanceFloor() }])
  });
}

function onCombatLoss(){
  showRunSummary(false);
}

/* =====================================================================
   7. PATH NAVIGATION
   ===================================================================== */

function selectNode(floorIdx, nodeIdx){
  const run = state.run;
  const floor = run.path[floorIdx];
  if(floor.completed) return;
  // Must be the next floor
  const nextFloor = run.path.findIndex(f => !f.completed);
  if(floorIdx !== nextFloor) return;
  const node = floor.nodes[nodeIdx];
  floor.chosenNode = nodeIdx;
  run.floor = floorIdx;
  run.currentNode = node;
  enterNode(node);
}

// B36 · TEMPT THE TOWER — before an elite or boss, dare a combat handicap
// for a guaranteed relic on the win. Player-authored difficulty spikes make
// the best stories ("I greeded it and it paid off"). The dare is picked
// DETERMINISTICALLY from the seed so the Daily stays fair.
function showTemptTower(node, proceed){
  const run = state.run;
  // No relic to win → no temptation; just fight.
  const anyRelicLeft = RELICS.some(r => !run.relics.includes(r.id));
  if(!anyRelicLeft){ run.tempt = null; proceed(); return; }
  const isBoss = node.type === 'boss';
  const rng = mulberry32(run.rngSeed + (run.floor + 1) * 911 + (run.act || 1) * 17);
  const dares = [
    { mod:'curse',    label:'a curse clots your opening hand' },
    { mod:'strength', label:'the keeper hits harder (+3 Strength)' },
    { mod:'drain',    label:'you start a card short (−1 energy on turn 1)' },
  ];
  const dare = pickRand(dares, rng);
  showModal({
    title: 'The Tower',
    sub: isBoss ? 'Before the keeper — dare you?' : 'A harder road pays a richer prize.',
    body: `Take on <b>${dare.label}</b> this fight. Win, and an <b>undiscovered relic</b> is yours.`,
    choices: [
      { icon:'☇', label:'Tempt the Tower', note:'Accept the dare for a guaranteed relic', onClick: () => { run.tempt = { mod: dare.mod }; proceed(); } },
      { icon:'⛒', label:'Walk the safe road', onClick: () => { run.tempt = null; proceed(); } },
    ],
    hideClose: true
  });
}

function enterNode(node){
  const run = state.run;
  if(node.type === 'elite' || node.type === 'boss'){
    // B36 — Tempt the Tower: an opt-in dare before the hard fights.
    showTemptTower(node, () => { startCombat(node.enemyId); cutTheDeck(); });
  } else if(node.type === 'combat'){
    run.tempt = null;
    startCombat(node.enemyId);
    cutTheDeck(); // active Reading skill — overlays the freshly-shown combat
  } else if(node.type === 'rest'){
    showRestModal();
  } else if(node.type === 'event'){
    showEventModal();
  } else if(node.type === 'treasure'){
    showTreasureModal();
  } else if(node.type === 'merchant'){
    showMerchantModal();
  }
}

function advanceFloor(){
  const run = state.run;
  run.path[run.floor].completed = true;
  run.combat = null;
  run.combatPlayer = null;
  run.combatEnemy = null;
  if(run.floor >= 14){
    // Boss down. More acts to climb? Descend deeper. Else the run is won.
    if((run.act || 1) < ACTS.length) enterNextAct();
    else onRunVictory();
  } else {
    saveState();
    showScreen('map-screen');
    renderMap();
  }
}

// B22 — clear an act → carry everything (deck, relics, HP, gold, the
// Spread) into a fresh, harder act with its own boss. A short interstitial
// + a partial mend (not full — the climb should still bite).
function enterNextAct(){
  const run = state.run;
  const clearedName = (ACTS[(run.act || 1) - 1] || ACTS[0]).name;
  run.act = (run.act || 1) + 1;
  run.floor = 0;
  run.path = generatePath(mulberry32(run.rngSeed + run.act * 7919), run.act);
  // Inter-act mend scales with the Veil's rest factor (0.40 base → 0.30 mend;
  // a Veil that guts rest also guts the between-act bind-up, proportionally).
  const mend = Math.floor(run.maxHp * 0.30 * (veilMod('restHeal', 0.4) / 0.4));
  run.hp = Math.min(run.maxHp, run.hp + mend);
  const nextAct = ACTS[run.act - 1];
  saveState();
  showModal({
    title: `${clearedName} — cleared`,
    sub: `Act ${run.act} of ${ACTS.length}: ${nextAct.name}`,
    body: `The way down opens. You bind your wounds (<strong>+${mend} HP</strong>) and descend — the dark gets deeper, and a new keeper waits at the bottom.`,
    choices: [
      { icon:'↡', label:`Descend into ${nextAct.name}`, onClick: () => { showScreen('map-screen'); renderMap(); } }
    ]
  });
}

// B30 · THE RECKONING — one score that values the WHOLE run (depth, kills,
// engine payoffs, survival) and rises with the Veil you dared. The summary
// closes the loop on EVERY run so even a loss is forward motion.
function computeScore(victory){
  const run = state.run; const t = (run && run.tally) || {};
  const depth = globalDepth();
  const hpPct = (run && run.maxHp) ? (run.hp / run.maxHp) : 0;
  let s = 0;
  s += depth * 100;                          // every floor climbed
  s += (t.elitesSlain||0) * 60;
  s += (t.bossesSlain||0) * 200;
  s += (t.chainsDetonated||0) * 12;          // engine payoffs
  s += (t.propheciesFulfilled||0) * 50;
  s += Math.round((t.biggestHit||0) * 1.5);
  if(victory){ s += 1500 + Math.round(hpPct * 500); }   // crown + survival
  s = Math.round(s * (1 + 0.25 * ((run && run.veil) || 0)));  // Veil multiplier
  return Math.max(0, s);
}

function showRunSummary(victory){
  const run = state.run;
  const t = (run && run.tally) || {};
  const depth = globalDepth();
  const gained = awardInsight(victory);
  state.meta.runsAttempted = (state.meta.runsAttempted || 0) + 1;
  state.meta.bestFloor = Math.max(state.meta.bestFloor || 0, depth);
  let veilLine = '';
  if(victory){
    state.meta.runsCompleted = (state.meta.runsCompleted || 0) + 1;
    // Unlock the next Veil; nudge the next run toward it (the climb pull).
    const clearedVeil = (run && run.veil) || 0;
    const before = state.meta.veil || 0;
    state.meta.veil = Math.max(before, Math.min(clearedVeil + 1, VEILS.length - 1));
    if(clearedVeil >= (state.meta.selectedVeil || 0)) state.meta.selectedVeil = state.meta.veil;
    if(state.meta.veil > before){
      veilLine = `<div class="rs-veil">✦ ${VEILS[state.meta.veil].name} UNLOCKED ✦<div class="rs-veil-sub">${VEILS[state.meta.veil].desc}</div></div>`;
    }
  }
  const score = computeScore(victory);
  const prevBest = state.meta.bestScore || 0;
  const isRecord = score > prevBest;
  if(isRecord) state.meta.bestScore = score;
  saveState();

  const rows = [];
  rows.push(['Depth reached', victory ? 'The Crown ♔' : `Floor ${depth}`]);
  rows.push(['Enemies felled', (t.enemiesSlain||0)]);
  if(t.elitesSlain) rows.push(['Elites slain', t.elitesSlain]);
  if(t.bossesSlain) rows.push(['Keepers broken', t.bossesSlain]);
  if(t.chainsDetonated) rows.push(['Aspects detonated', t.chainsDetonated]);
  if(t.propheciesFulfilled) rows.push(['Prophecies fulfilled', t.propheciesFulfilled]);
  if(t.longestChain) rows.push(['Longest chain', '×' + t.longestChain]);
  if(t.biggestHit) rows.push(['Biggest blow', t.biggestHit]);
  rows.push(['Insight earned', '+' + gained]);
  const list = rows.map(r => `<div class="rs-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  const scoreLine = `<div class="rs-score">SCORE <b>${score}</b> ${isRecord ? '<span class="rs-record">★ NEW BEST</span>' : `<span class="rs-best">best ${prevBest}</span>`}</div>`;

  // B31 — record the Daily's result (the day was locked at START; this just
  // stores the score the title screen brags with).
  const isDaily = !!(run && run.daily);
  if(isDaily){
    state.meta.daily.lastScore = score;
    state.meta.daily.lastResult = victory ? 'win' : 'loss';
    saveState();
  }

  // Inner render so the "Share" button can re-paint WITHOUT redoing any of
  // the bookkeeping above (which would double-count attempts/unlocks).
  function render(copied){
    const choices = [];
    if(isDaily){
      choices.push({ icon:'⎘', label: copied ? '✓ Copied — paste it anywhere' : 'Share this reading',
        note: copied ? '' : 'A spoiler-free result to brag with',
        onClick: () => { copyDailyShare(victory, score, depth); render(true); } });
    }
    choices.push({ label: 'Return to the Library', onClick: () => { state.run = null; saveState(); showScreen('title-screen'); refreshTitle(); } });
    showModal({
      title: victory ? 'The Crown Falls' : 'The Reading Cuts',
      sub: victory ? `You climbed the whole Tower${(run && run.veil) ? ` under ${VEILS[run.veil].name}` : ''}.` : 'Every reading teaches. Spend Insight at The Mirror.',
      body: `${isDaily ? `<div class="rs-daily">🔮 Daily Spread</div>` : ''}${veilLine}${list}${scoreLine}`,
      choices, hideClose: true
    });
  }
  render(false);
}

// ===== B31 · THE DAILY SPREAD — one shared tower a day, one attempt, a
// seed-chosen Patron, and a copyable spoiler-free brag. The daily ritual +
// score chase + the game's only word-of-mouth lever. =====
function daySeedFor(d){ return `daily-${d.getUTCFullYear()}-${d.getUTCMonth()+1}-${d.getUTCDate()}`; }
function todaySeed(){ return daySeedFor(new Date()); }
function dailyPatronFor(seed){ const ids = Object.keys(PATRONS); return ids[strHash(seed) % ids.length]; }

function copyDailyShare(victory, score, depth){
  const run = state.run;
  const seed = (run && run.dailySeed) || todaySeed();
  const date = seed.replace('daily-','');
  const patron = (run && PATRONS[run.patron]) ? PATRONS[run.patron].name : 'A Querent';
  // Spoiler-free progress bar: one block per act (cleared / in-progress / unreached).
  let bar = '';
  for(let a=0; a<ACTS.length; a++){
    const lo = a*15, hi = lo+15;
    bar += victory ? '🟪' : (depth >= hi ? '🟪' : (depth > lo ? '🟨' : '⬛'));
  }
  const streak = (state.meta.daily && state.meta.daily.streak) || 1;
  const text = [
    `🔮 Tarot Run — Daily ${date}`,
    `${patron}  ${bar}`,
    victory ? `♔ CROWNED — ${score} pts` : `Fell at floor ${depth} — ${score} pts`,
    `streak ${streak}🔥 · stephenuffugus.github.io/Tarot_Run`,
  ].join('\n');
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text); }
    else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  } catch(e){}
  return text;
}

function startDailyRun(seed){
  const pid = dailyPatronFor(seed);
  state.run = freshRun(seed, pid);
  state.run.veil = 0;                       // level playing field — always No Veil
  state.run.maxHp = 60 + mirrorBonusMaxHp();
  state.run.hp = state.run.maxHp;
  state.run.daily = true;
  state.run.dailySeed = seed;
  // Streak + LOCK: the day is claimed the moment you begin (no re-rolling).
  const d = state.meta.daily || (state.meta.daily = {});
  const yseed = daySeedFor(new Date(Date.now() - 86400000));
  if(d.lastSeed === yseed) d.streak = (d.streak || 0) + 1;
  else d.streak = 1;
  d.lastSeed = seed;
  d.lastScore = 0; d.lastResult = null;
  saveState();
  showOpeningReading(() => { showScreen('map-screen'); renderMap(); });
}

function showModal({ title, sub, body, choices, hideClose }){
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  m.innerHTML = `
    <div class="modal-title">${title || ''}</div>
    ${sub ? `<div class="modal-sub">${sub}</div>` : ''}
    ${body ? `<div class="modal-body">${body}</div>` : ''}
    <div class="modal-choices" id="modal-choices"></div>
  `;
  const choiceEl = m.querySelector('#modal-choices');
  (choices||[]).forEach(ch => {
    const b = document.createElement('div');
    b.className = 'modal-choice';
    b.innerHTML = `<div class="mc-icon">${ch.icon||'❯'}</div><div class="mc-text"><strong>${ch.label}</strong>${ch.note?`<small>${ch.note}</small>`:''}</div>`;
    b.onclick = () => { veil.classList.remove('active'); if(ch.onClick) ch.onClick(); };
    choiceEl.appendChild(b);
  });
  // SAFETY: a modal with no choices was a soft-lock (no way to close).
  // Always give an informational modal a Continue button unless the
  // caller explicitly forces a choice via hideClose + its own choices.
  if(choiceEl.children.length === 0 && !hideClose){
    const b = document.createElement('div');
    b.className = 'modal-choice';
    b.innerHTML = `<div class="mc-icon">✦</div><div class="mc-text"><strong>Continue</strong></div>`;
    b.onclick = () => { veil.classList.remove('active'); };
    choiceEl.appendChild(b);
  }
  veil.classList.add('active');
}

// B20 · THE MERCHANT — gold finally has a sink. A shop node: a small
// rotating stock (3 floor-tier cards + 1 relic), pay-gold banish (no
// HP price, unlike the Hermit's Bargain), and a paid mend. Stock and
// sold-state live in THIS closure — no run/state field, so no VERSION
// bump and nothing for migrateMeta() to worry about. Only "Leave"
// advances the floor; everything else re-renders the stall in place.
// SHOP_PRICE is a by-feel tuning dial (income ≈ 10+floor·1.5 a fight).
const SHOP_PRICE = { common:40, uncommon:60, rare:90, relic:130, banish:50, heal:45 };
function showMerchantModal(){
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  const run = state.run;
  const rng = mulberry32(run.rngSeed + run.floor * 547);

  // Floor-appropriate stock, mirroring the reward tiers; no starters.
  let pool;
  if(run.floor < 4)      pool = ALL_CARDS.filter(c => c.rarity === 'common' || c.rarity === 'uncommon');
  else if(run.floor < 9) pool = ALL_CARDS.filter(c => c.rarity === 'uncommon' || c.rarity === 'rare');
  else                   pool = ALL_CARDS.filter(c => c.rarity === 'rare');
  pool = pool.filter(c => c.rarity !== 'starter');
  const candidates = pool.slice(); shuffleInPlace(candidates, rng);
  const cardStock = [];
  for(const c of candidates){
    if(cardStock.length >= 3) break;
    if(!cardStock.find(s => s.card.id === c.id))
      cardStock.push({ card:c, price: SHOP_PRICE[c.rarity] || 60, sold:false });
  }
  const relicPool = RELICS.filter(r => !run.relics.includes(r.id));
  shuffleInPlace(relicPool, rng);
  const relicStock = relicPool.length ? { relic: relicPool[0], price: SHOP_PRICE.relic, sold:false } : null;
  const healAmt = Math.floor(run.maxHp * 0.35);
  let banishing = false;

  const leave = () => { veil.classList.remove('active'); advanceFloor(); };
  const buy = (price, apply) => { if(run.gold < price) return; run.gold -= price; apply(); render(); };

  function banishPicker(){
    m.innerHTML = `
      <div class="modal-title">Banish a Card</div>
      <div class="modal-sub">The merchant takes it off your hands — ◈ ${SHOP_PRICE.banish}.</div>
      <div class="dv-grid" id="shop-bgrid"></div>
      <div class="modal-choices"><div class="modal-choice" id="shop-bback">
        <div class="mc-icon">‹</div><div class="mc-text"><strong>Back to the stall</strong>
        <small>You haven't paid yet.</small></div></div></div>`;
    const grid = m.querySelector('#shop-bgrid');
    run.deck.forEach((entry, idx) => {
      const card = CARD_BY_ID[entry.cardId];
      const el = renderCardElement(card, { reversed: entry.reversed });
      el.classList.add('playable');
      el.onclick = () => {
        if(banishing) return; banishing = true;
        el.classList.add('card-destroy');
        grid.querySelectorAll('.card').forEach(c => { if(c!==el){ c.style.opacity='0.22'; c.style.pointerEvents='none'; } });
        setTimeout(() => { run.gold -= SHOP_PRICE.banish; run.deck.splice(idx,1); banishing = false; render(); }, 720);
      };
      grid.appendChild(el);
    });
    m.querySelector('#shop-bback').onclick = render;
  }

  function render(){
    const g = run.gold, can = p => g >= p;
    m.innerHTML = `
      <div class="modal-title">The Merchant</div>
      <div class="modal-sub">"Everything has a price — even what you'd rather forget."</div>
      <div class="shop-cards" id="shop-cards"></div>
      <div class="modal-choices" id="shop-rows"></div>
      <div class="shop-gold">your gold &nbsp;◈ <strong>${g}</strong></div>
      <div class="modal-choices"><div class="modal-choice" id="shop-leave">
        <div class="mc-icon">⛒</div><div class="mc-text"><strong>Leave the stall</strong></div></div></div>`;
    const cc = m.querySelector('#shop-cards');
    cardStock.forEach(s => {
      const slot = document.createElement('div'); slot.className = 'shop-slot';
      const el = renderCardElement(s.card, {});
      const buyable = !s.sold && can(s.price);
      if(buyable){ el.classList.add('playable'); el.onclick = () => buy(s.price, () => {
        s.sold = true;
        run.deck.push({ cardId:s.card.id, reversed:false });
        const dc = state.meta.discoveredCards;
        dc[s.card.id] = dc[s.card.id] || { name:s.card.name, seen:0, played:0 };
        dc[s.card.id].seen += 1;
      }); }
      slot.appendChild(el);
      const tag = document.createElement('div');
      tag.className = 'shop-price' + (s.sold ? ' sold' : (can(s.price) ? '' : ' poor'));
      tag.textContent = s.sold ? 'SOLD' : `◈ ${s.price}`;
      slot.appendChild(tag);
      cc.appendChild(slot);
    });
    const rows = m.querySelector('#shop-rows');
    const addRow = (icon, title, note, enabled, fn) => {
      const r = document.createElement('div');
      r.className = 'modal-choice' + (enabled ? '' : ' poor');
      r.innerHTML = `<div class="mc-icon">${icon}</div><div class="mc-text"><strong>${title}</strong><small>${note}</small></div>`;
      if(enabled) r.onclick = fn;
      rows.appendChild(r);
    };
    if(relicStock){
      const sold = relicStock.sold;
      addRow('☆', sold ? `${relicStock.relic.name} — yours` : `Relic · ${relicStock.relic.name}`,
        sold ? relicStock.relic.desc : `${relicStock.relic.desc} — ◈ ${relicStock.price}`,
        !sold && can(relicStock.price),
        () => buy(relicStock.price, () => {
          relicStock.sold = true;
          run.relics.push(relicStock.relic.id);
          state.meta.relicsFound[relicStock.relic.id] = true;
        }));
    }
    addRow('✎', 'Banish a card',
      `Remove one card from your deck — coin, not blood. — ◈ ${SHOP_PRICE.banish}`,
      can(SHOP_PRICE.banish) && run.deck.length > 1,
      banishPicker);
    const needsHeal = run.hp < run.maxHp;
    addRow('♥', 'A mended wound',
      needsHeal ? `Heal ${healAmt} HP. — ◈ ${SHOP_PRICE.heal}` : `You are already whole.`,
      needsHeal && can(SHOP_PRICE.heal),
      () => buy(SHOP_PRICE.heal, () => { run.hp = Math.min(run.maxHp, run.hp + healAmt); }));
    m.querySelector('#shop-leave').onclick = leave;
  }

  render();
  veil.classList.add('active');
}

// opts.onBanish() fires ONLY when a card is actually banished (so a caller's
// price — e.g. the Inkwell's HP cost — is paid on commit, not on open/cancel).
// B29 — DECK FLOOR: you can never banish your last card (that would leave the
// next combat with an empty draw pile → an unwinnable fight). The Merchant
// already guarded this; Rest / Inkwell / Confessional did not.
function showBanishModal(opts){
  opts = opts || {};
  const done = opts.onDone || advanceFloor;   // B33 — callers not on the map path (run start) override this
  const veil = document.getElementById('modal-veil');
  const m = document.getElementById('modal');
  const canBanish = state.run.deck.length > 1;
  m.innerHTML = `
    <div class="modal-title">Banish a Card</div>
    <div class="modal-sub">${canBanish ? 'Remove it from your deck forever.' : 'Your deck is too thin to banish another card.'}</div>
    <div class="dv-grid" id="banish-grid"></div>
    <div class="modal-choices" id="banish-cancel"></div>
  `;
  const grid = m.querySelector('#banish-grid');
  state.run.deck.forEach((entry, idx) => {
    const card = CARD_BY_ID[entry.cardId];
    const el = renderCardElement(card, { reversed: entry.reversed });
    if(!canBanish){ el.classList.add('unplayable'); grid.appendChild(el); return; }
    el.classList.add('playable');
    el.onclick = () => {
      if(m._busy) return; m._busy = true;
      // it WAS your pick — show it being destroyed so you know it worked
      el.classList.add('card-destroy');
      grid.querySelectorAll('.card').forEach(c => { if(c !== el){ c.style.opacity = '0.22'; c.style.pointerEvents = 'none'; } });
      const finish = () => {
        state.run.deck.splice(idx, 1);
        if(opts.onBanish) opts.onBanish();
        veil.classList.remove('active');
        done();
      };
      if(typeof setTimeout === 'function') setTimeout(finish, 780); else finish();
    };
    grid.appendChild(el);
  });
  const cancel = m.querySelector('#banish-cancel');
  const c = document.createElement('div');
  c.className = 'modal-choice';
  c.innerHTML = `<div class="mc-icon">⛒</div><div class="mc-text"><strong>${canBanish ? 'Never mind' : 'Leave it be'}</strong></div>`;
  c.onclick = () => { if(m._busy) return; m._busy = true; veil.classList.remove('active'); done(); };
  cancel.appendChild(c);
  m._busy = false;
  veil.classList.add('active');   // B19 — every other modal does this; banish never did → it silently never opened
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderCardElement(card, opts = {}){
  const div = document.createElement('div');
  div.className = `card suit-${card.suit}`;
  // B24 — a reversed card shows its SHADOW face (different effect text).
  const showShadow = (opts.reversed || opts.shadow) && card.reversedPlay;
  if(opts.reversed) div.classList.add('reversed');
  if(showShadow) div.classList.add('shadow');
  if(opts.studied) div.classList.add('studied');
  div.dataset.cardId = card.id;
  const cost = card.cost;
  const bodyDesc = showShadow ? card.reversedDesc : card.desc;
  div.innerHTML = `
    <div class="card-cost">${cost}</div>
    ${card.suit !== 'major' ? `<div class="card-pips">${numToRoman(card.arcanaNum) || card.arcanaNum}</div>` : `<div class="card-pips">${card.arcanaNum}</div>`}
    <div class="card-art placeholder" data-glyph="${card.glyph}" data-art-slot="card-${card.id}"></div>
    <div class="card-name">${card.name}</div>
    <div class="card-desc">${bodyDesc}</div>
    <div class="card-suit-mark">${SUIT_GLYPH[card.suit]}</div>
  `;
  return div;
}

function renderHand(){
  const handEl = document.getElementById('hand');
  handEl.innerHTML = '';
  const ctx = getCtx();
  let sawShadow = false;
  ctx.player.hand.forEach((entry, idx) => {
    const card = CARD_BY_ID[entry.cardId];
    const isMinor = card.suit==='wands'||card.suit==='cups'||card.suit==='swords'||card.suit==='pents';
    // B24 — a reversed Minor with an authored face is its SHADOW (a
    // real different effect, full cost). Legacy fate path (no authored
    // face: curses etc.) keeps B15's −1 cost / weaker behaviour.
    const hasShadow = isMinor && entry.reversed && !!card.reversedPlay;
    if(hasShadow) sawShadow = true;
    const fateRev   = isMinor && entry.reversed && !card.reversedPlay;
    // Hand stays READABLE (no 180° flip) — the face is shown by a ribbon.
    const el = renderCardElement(card, { reversed: false, shadow: hasShadow });
    if(hasShadow){
      el.classList.add('shadow');
      const rib = document.createElement('div'); rib.className = 'fate-ribbon shadow-ribbon'; rib.textContent = '↻ SHADOW';
      el.appendChild(rib);
    } else if(fateRev){
      el.classList.add('fate-rev');
      const rib = document.createElement('div'); rib.className = 'fate-ribbon'; rib.textContent = '↻ REVERSED';
      el.appendChild(rib);
    }
    // Mirror playCard's chain tax so the rising cost is VISIBLE pre-play.
    const prospect = !isMinor ? 0 : (ctx.combat.chainSuit === card.suit ? ctx.combat.chainCount + 1 : 1);
    const chainTax = isMinor ? chainTaxFor(prospect) : 0;
    let effectiveCost = card.cost + (ctx.combat.turnCostMod||0) + chainTax;
    if(state.run.relics.includes('ribbon-of-fate') && ctx.combat.cardsPlayedThisTurn === 0) effectiveCost = 0;
    if(state.run.relics.includes('ace-of-aces') && card.arcanaNum === 1 && card.suit !== 'major') effectiveCost = 0;
    effectiveCost = Math.max(0, effectiveCost);
    if(fateRev) effectiveCost = Math.max(0, effectiveCost - 1);   // legacy fate discount only
    const costEl = el.querySelector('.card-cost');
    costEl.textContent = effectiveCost;
    if(chainTax > 0 && effectiveCost > 0){ costEl.classList.add('cost-taxed'); costEl.title = `+${chainTax} chain tax`; }
    if(fateRev){ costEl.classList.add('cost-fate'); costEl.title = 'Reversed — cheaper, but weaker'; }
    else if(hasShadow){ costEl.title = 'Shadow face — a different effect, same cost'; }
    const playable = !card.unplayable && ctx.player.energy >= effectiveCost && !(card.suit === 'major' && ctx.combat.currentMajorCast);
    el.classList.add(playable ? 'playable' : 'unplayable');
    el.onclick = () => { if(playable) playCard(idx); };
    // long-press / right-click for detail
    let pressTimer = null;
    el.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => { showCardInspect(card, entry); pressTimer = null; }, 350);
    });
    el.addEventListener('touchend', () => { if(pressTimer) clearTimeout(pressTimer); });
    el.addEventListener('touchmove', () => { if(pressTimer) clearTimeout(pressTimer); });
    el.oncontextmenu = (e) => { e.preventDefault(); showCardInspect(card, entry); };
    handEl.appendChild(el);
  });
  // B32 — first time a Shadow face appears in hand, explain the orientation flip.
  if(sawShadow) teachOnce('shadow', {
    title: 'The Shadow Face', sub: 'A card drew Reversed (↻).',
    body: 'This card flipped to its <b>Shadow</b> — same cost, but its suit role <b>inverts</b> (a striker lays embers, a wall throws a fist, a healer wards…). It opens combos the upright face can\'t. Long-press to inspect <b>both</b> faces.',
    icon: '↻', label: 'Embrace it'
  });
}

// B19 — UI-only change tracking so the HUD shows ACTION instead of snapping.
// null = "no prior frame" (combat start) → never FX the first paint.
let _uiHpPrev = null, _uiBlockPrev = null, _uiEhpPrev = null;
function resetCombatFXState(){ _uiHpPrev = _uiBlockPrev = _uiEhpPrev = null; }
function pulse(id, cls){
  if(typeof requestAnimationFrame !== 'function') return;   // inert under sim/test stub DOM (B14 pattern)
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}

function renderCombat(){
  const ctx = getCtx();
  const hpEl = document.getElementById('hud-hp');
  if(_uiHpPrev !== null && ctx.player.hp !== _uiHpPrev)
    pulse('hud-hp', ctx.player.hp < _uiHpPrev ? 'flash-dmg' : 'flash-heal');
  hpEl.textContent = ctx.player.hp;
  document.getElementById('hud-hp-fill').style.width = (100 * ctx.player.hp / ctx.player.maxHp) + '%';
  const blockEl = document.getElementById('hud-block-wrap');
  if(ctx.player.block > 0){
    blockEl.style.display = '';
    document.getElementById('hud-block').textContent = ctx.player.block;
    if(_uiBlockPrev !== null && ctx.player.block > _uiBlockPrev) pulse('hud-block-wrap', 'gain');
    else if(_uiBlockPrev !== null && ctx.player.block < _uiBlockPrev) pulse('hud-block-wrap', 'broke');
  } else {
    // >0 → 0: the shield was SPENT (a hit ate it, or it expired). Was silent.
    if(_uiBlockPrev) shieldShatter();
    blockEl.style.display = 'none';
  }
  // energy
  const ec = document.getElementById('energy-cluster');
  ec.innerHTML = '';
  for(let i=0;i<ctx.player.maxEnergy + (ctx.combat.turn===1 && state.run.relics.includes('querents-coin') ? 1 : 0);i++){
    const pip = document.createElement('span');
    pip.className = 'energy-pip' + (i >= ctx.player.energy ? ' spent' : '');
    ec.appendChild(pip);
  }
  // enemy
  const enemy = ENEMY_BY_ID[ctx.combat.enemyId];
  const portrait = document.getElementById('enemy-portrait');
  portrait.setAttribute('data-glyph', enemy.glyph);
  portrait.setAttribute('data-art-slot', `enemy-${enemy.id}`);
  document.getElementById('enemy-name').textContent = enemy.name;
  if(_uiEhpPrev !== null && ctx.enemy.hp < _uiEhpPrev) pulse('enemy-hp', 'flash-dmg');
  document.getElementById('enemy-hp').textContent = ctx.enemy.hp;
  document.getElementById('enemy-maxhp').textContent = ctx.enemy.maxHp;
  document.getElementById('enemy-hp-fill').style.width = (100 * ctx.enemy.hp / ctx.enemy.maxHp) + '%';
  const blockRow = document.getElementById('enemy-block-row');
  blockRow.innerHTML = ctx.enemy.block > 0 ? `<span class="enemy-block">⛨ ${ctx.enemy.block}</span>` : '';
  // intent — a loud, TRUTHFUL telegraph (numbers shown == numbers that land)
  const intent = ctx.enemy.intent;
  const ie = document.getElementById('enemy-intent');
  if(intent){
    const RIDER = {
      weak:'they Weaken you', vulnerable:'they make you Vulnerable',
      frail:'they make you Frail', burn:'they set you Alight'
    };
    let cls = 'intent-card', head = '', sub = [];
    if(intent.type === 'attack'){
      const hit = scaledEnemyHit(ctx, intent.value); // same fn combat uses → never lies
      const hits = intent.count || 1;
      const total = hit * hits;
      const soak = ctx.player.block + (ctx.player.buffs.ward || 0);
      const lethal = total >= ctx.player.hp + soak;
      cls += lethal ? ' intent-lethal' : (total > soak ? ' intent-danger' : ' intent-safe');
      head = `<span class="intent-icon">⚔</span><span class="intent-dmg">${hit}${hits>1?`<span class="intent-x">×${hits}</span>`:''}</span>`;
      sub.push(`<b>${intent.desc}</b>`);
      sub.push(total > soak
        ? `<span class="intent-warn">${total} incoming · you stop ${soak}</span>`
        : `<span class="intent-ok">${total} incoming · fully blocked</span>`);
    } else {
      cls += ' intent-safe';
      head = `<span class="intent-icon">✦</span>`;
      sub.push(`<b>${intent.desc}</b>`);
    }
    if(intent.debuff) sub.push(`+ ${RIDER[intent.debuff.key] || intent.debuff.key} ${intent.debuff.value}`);
    if(intent.buff) sub.push(`+ they gain ${formatStatusName(intent.buff.key)} ${intent.buff.value}`);
    if(intent.selfBlock) sub.push(`+ they Guard ${intent.selfBlock}`);
    if(intent.special === 'copy_block') sub.push(`+ they mirror your Block`);
    if(intent.special === 'add_curse') sub.push(`+ a curse clots your draw`);
    ie.className = 'enemy-intent ' + cls;
    ie.innerHTML = `<div class="intent-head">${head}</div><div class="intent-sub">${sub.join(' · ')}</div>`;
  } else { ie.className = 'enemy-intent'; ie.textContent = '—'; }

  // player status pips
  const ps = document.getElementById('player-status');
  ps.innerHTML = '';
  Object.entries(ctx.player.buffs).forEach(([k,v]) => {
    if(v <= 0) return;
    const p = document.createElement('span');
    p.className = 'status-pip buff';
    p.textContent = `${formatStatusName(k)} ${v}`;
    ps.appendChild(p);
  });
  Object.entries(ctx.player.debuffs).forEach(([k,v]) => {
    if(v <= 0) return;
    const p = document.createElement('span');
    p.className = 'status-pip debuff';
    p.textContent = `${formatStatusName(k)} ${v}`;
    ps.appendChild(p);
  });
  Object.entries(ctx.enemy.debuffs).forEach(([k,v]) => {
    if(v <= 0) return;
    const p = document.createElement('span');
    p.className = 'status-pip aspect';
    p.textContent = `e: ${formatStatusName(k)} ${v}`;
    ps.appendChild(p);
  });

  // reading strip
  renderReadingStrip();

  // hand
  renderHand();

  // piles
  document.getElementById('draw-count').textContent = ctx.player.draw.length;
  document.getElementById('discard-count').textContent = ctx.player.discard.length;

  // B23 — End Turn states plainly that unplayed cards will discard
  const etb = document.getElementById('btn-end-turn');
  if(etb){
    const n = ctx.player.hand.filter(c => !c.ephemeral).length;
    etb.innerHTML = n > 0 ? `End Turn <span class="et-disc">↻ discards ${n}</span>` : 'End Turn';
  }

  // remember this frame so the next render can FX the delta
  _uiHpPrev = ctx.player.hp; _uiBlockPrev = ctx.player.block; _uiEhpPrev = ctx.enemy.hp;
}

function formatStatusName(k){
  return { strength:'Str', plate:'Plate', resolve:'Resolve', ward:'Ward', weak:'Weak', vulnerable:'Vuln', burn:'Ember', frail:'Frail', pierce_next:'Pierce' }[k] || k;
}

function renderReadingStrip(){
  const ctx = getCtx();
  const strip = document.getElementById('reading-strip');
  strip.innerHTML = '';
  const prog = ctx.combat.prophecyProgress || 0;
  const done = !!ctx.combat.prophecyDone;
  ['Past', 'Present', 'Future'].forEach((pos, i) => {
    const suit = ctx.combat.reading[i];
    const stateCls = (done || i < prog) ? 'pf-done' : (i === prog ? 'pf-active' : 'pf-wait');
    const mark = (done || i < prog) ? '✔ ' : (i === prog ? '▶ ' : '');
    const el = document.createElement('div');
    el.className = 'reading-card ' + stateCls;
    el.innerHTML =
      `<div class="rd-glyph">${SUIT_GLYPH[suit] || '✦'}</div>` +
      `<div class="rd-suit">${SUIT_NAME[suit] || suit}</div>` +
      `<div class="rd-pos">${mark}${pos}</div>`;
    el.onclick = () => {
      const seq = ctx.combat.reading.map(s => SUIT_NAME[s] || s).join('  →  ');
      showModal({
        title: done ? 'The Prophecy — fulfilled' : 'The Prophecy',
        sub: seq,
        body: done
          ? 'You walked the foretold path. Its blessing is spent for this fight.'
          : `Play a Minor of each suit <strong>in order</strong> — any turns, off-suit never resets it:<br><br>`
            + ctx.combat.reading.map((s,k)=>`${k<prog?'✔':(k===prog?'▶':'·')} <strong>${SUIT_NAME[s]||s}</strong>`).join('<br>')
            + `<br><br>Fulfil it → <strong>Heal 12 · Strike 12 · +1 max energy</strong>.<br>Ignore it freely — it never punishes.`,
      });
    };
    strip.appendChild(el);
  });
}

/* The Cut — the active Reading skill. UI-only: invoked from enterNode after
   startCombat, so the headless Node engine/tests never reach it. Guarded on
   requestAnimationFrame too. Sets combat.readingFortune + a real buff/curse;
   'silent' (the default) reproduces the legacy Reading exactly. */
function cutTheDeck(){
  if(typeof requestAnimationFrame !== 'function') return;
  const ctx = getCtx();
  if(!ctx || !ctx.combat) return;

  const ZONES = ['tower','silent','faint','strong','faint','silent','tower'];
  const N = ZONES.length;
  const floor = (state.run && state.run.floor) || 0;
  const speed = 0.0030 + floor * 0.00024; // slots/ms — deeper = faster = harder
  let pos = 0, dir = 1, frozen = false, raf = null, autoT = null;
  let last = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

  const ov = document.createElement('div');
  ov.id = 'cut-overlay';
  ov.innerHTML =
    '<div class="cut-title">The Reading</div>' +
    '<div class="cut-sub">Cut the deck. Land the bright Arcana — the Sun favors a steady hand. The Tower waits at the edges.</div>' +
    '<div class="cut-strip" id="cut-strip"></div>' +
    '<div class="cut-result" id="cut-result">&nbsp;</div>' +
    '<button class="cut-btn" id="cut-btn">Cut</button>';
  document.body.appendChild(ov);

  const strip = ov.querySelector('#cut-strip');
  const slots = [];
  for(let i=0;i<N;i++){
    const s = document.createElement('div');
    s.className = 'cut-slot';
    strip.appendChild(s); slots.push(s);
  }

  function frame(now){
    const dt = Math.min(48, now - last); last = now;
    pos += dir * speed * dt;
    if(pos >= N-1){ pos = N-1; dir = -1; }
    if(pos <= 0){ pos = 0; dir = 1; }
    const idx = Math.round(pos);
    for(let i=0;i<N;i++) slots[i].classList.toggle('lit', i === idx);
    if(!frozen) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  function dismiss(){
    if(ov._gone) return; ov._gone = true;
    if(autoT) clearTimeout(autoT);
    ov.classList.add('out');
    setTimeout(() => { ov.remove(); renderCombat(); }, 360);
  }

  function doCut(){
    if(frozen) return;
    frozen = true;
    if(raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(raf);
    const idx = Math.round(pos);
    const zone = ZONES[idx];
    const land = slots[idx];
    land.classList.remove('lit');
    land.classList.add('flip');
    const c = getCtx();
    let title, msg, glyph;
    if(zone === 'strong'){
      c.player.buffs.strength = (c.player.buffs.strength || 0) + 2;
      c.combat.readingFortune = 'strong';
      // The Sun reveals the path — a free first step of the Prophecy
      if((c.combat.prophecyProgress||0) < 1) c.combat.prophecyProgress = 1;
      title = 'The Sun'; glyph = '☉';
      msg = 'The deck favors you — +2 Strength, and the Sun reveals the Prophecy’s first step.';
    } else if(zone === 'faint'){
      c.player.buffs.strength = (c.player.buffs.strength || 0) + 1;
      c.combat.readingFortune = 'faint';
      title = 'A Faint Omen'; glyph = '✦';
      msg = 'A near cut. +1 Strength.';
    } else if(zone === 'tower'){
      c.player.debuffs.weak = (c.player.debuffs.weak || 0) + 2;
      c.combat.readingFortune = 'tower';
      title = 'The Tower'; glyph = '⚡';
      msg = 'A bad cut — the Tower falls. You start Weak 2.';
    } else {
      c.combat.readingFortune = 'silent';
      title = 'Silence'; glyph = '·';
      msg = 'The deck stays silent. Read it the old way — 1 energy a card.';
    }
    land.textContent = glyph;
    ov.querySelector('#cut-result').innerHTML = '<strong>' + title + '.</strong> ' + msg;
    const btn = ov.querySelector('#cut-btn');
    btn.textContent = 'Begin';
    btn.onclick = dismiss;
    autoT = setTimeout(dismiss, 2000);
  }

  ov.querySelector('#cut-btn').onclick = doCut;
  strip.onclick = doCut;
}

// B19 — heal/block are YOUR events: float them off your HUD, not the enemy's
// face (where they used to wrongly spawn). Damage still pops on the enemy.
function showDamagePop(amt, kind){
  if(typeof requestAnimationFrame !== 'function') return;   // inert under sim/test stub DOM
  const anchor = kind === 'heal'  ? document.getElementById('hud-hp')
               : kind === 'block' ? document.getElementById('hud-block-wrap')
               :                     document.getElementById('enemy-portrait');
  if(!anchor) return;
  const r = anchor.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'damage-pop' + (kind === 'heal' ? ' heal' : (kind === 'block' ? ' block' : ''));
  pop.textContent = (kind === 'heal' ? '+' : (kind === 'block' ? '⛨ ' : '−')) + amt;
  const onHud = kind === 'heal' || kind === 'block';
  pop.style.left = (r.left + r.width / 2 - 22 + (Math.random() * 22 - 11)) + 'px';
  // HUD sits at the very top — drop the pop just below it so its rise stays on-screen.
  pop.style.top  = (onHud ? r.bottom + 6 : r.top + r.height / 2 - 26) + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1000);
}

// B19 — your shield being spent used to be a silent display:none. Now it
// cracks: a shake on the block stat + a burst of shards. Driven from
// renderCombat's >0→0 transition so it catches BOTH a hit eating it and
// the turn-start reset — one chokepoint, no engine touch.
function shieldShatter(){
  if(typeof requestAnimationFrame !== 'function') return;   // inert under sim/test stub DOM
  const wrap = document.getElementById('hud-block-wrap');
  if(!wrap) return;
  wrap.classList.remove('broke'); void wrap.offsetWidth; wrap.classList.add('broke');
  const r = wrap.getBoundingClientRect();
  const fx = document.createElement('div'); fx.id = 'shield-shatter';
  fx.style.left = (r.left + r.width / 2) + 'px';
  fx.style.top  = (r.top  + r.height / 2) + 'px';
  for(let i = 0; i < 7; i++){
    const s = document.createElement('div'); s.className = 'shard';
    const ang = Math.PI * 2 * (i / 7) + Math.random() * 0.7;
    const dist = 24 + Math.random() * 22;
    s.style.setProperty('--sx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    s.style.setProperty('--sy', (Math.sin(ang) * dist + 6).toFixed(1) + 'px');
    s.style.setProperty('--sr', (Math.random() * 360 - 180).toFixed(0) + 'deg');
    fx.appendChild(s);
  }
  document.body.appendChild(fx);
  setTimeout(() => fx.remove(), 620);
}
