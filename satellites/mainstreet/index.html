<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MAINSTREET</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3EEE2">
<meta name="description" content="A free, offline, kid-safe investing game. Own little pieces of a town. Make a plan. See what time changes.">
<style>
/* MAINSTREET styles (M2). Paper town tokens; 48 px controls; blue up, orange down; no filters or heavy shadows. */
:root{--paper:#F3EEE2;--paper-2:#EAE3D3;--card:#FBF8F1;--ink:#2B2420;--ink-2:#5E554E;--ink-3:#8A817A;--rule:#D9D0BE;--up:#0072B2;--down:#E69F00;--up-soft:#DCEBF5;--down-soft:#FBEFD2;--soon:#0072B2;--buffer:#6A994E;--saved:#8E7CC3;--ts:1;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{font:calc(18px * var(--ts))/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 env(safe-area-inset-bottom,0px)}
#app{min-height:100%}
.screen{max-width:720px;margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:2.2em;letter-spacing:.04em}h2{font-size:1.5em}h3{font-size:1.1em;color:var(--ink-2)}
p{margin:0}
.muted{color:var(--ink-2)}.lbl{display:block;font-size:.8em;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.up{color:var(--up)}.down{color:var(--down)}
.btn{min-height:48px;min-width:48px;padding:0 18px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.big{font-size:1.1em;padding:0 24px}
.btn.small{min-height:40px;padding:0 12px;font-size:.9em}
.btn.ghost{border-color:var(--rule);background:transparent}
.btn.step{width:52px;font-size:1.4em;padding:0}
.btn.glow,.shop.glow .shop-face{outline:3px solid var(--up);outline-offset:3px}
button:focus-visible,input:focus-visible{outline:3px solid var(--up);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.actions.col{flex-direction:column;align-items:stretch}
/* R14: the Town is a long scroll and the guide says "tap Next season", so the plan tray and the Town buttons stay in view at the bottom as one block. */
.town>.town-foot{position:sticky;bottom:0;z-index:2;margin:0 -16px -32px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.town-foot .tray{position:static}
.tray.open ul{max-height:24vh;overflow:auto}
.tray-btns{display:flex;gap:6px;align-items:center}
.town-links{display:flex;gap:8px;justify-content:flex-end}
.tray[hidden],.tray ul[hidden]{display:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.banner{background:var(--down-soft);border:1px solid var(--down);border-radius:8px;padding:8px 12px}
.stamp{font-family:ui-monospace,Menlo,monospace;font-size:.75em;color:var(--ink-3)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.topbar h2{text-align:center;font-size:1.2em}
/* placeholders and art */
.ph{display:flex;align-items:center;justify-content:center;background:var(--paper-2);border:2px dashed var(--rule);border-radius:10px;color:var(--ink-3);font:.7em ui-monospace,Menlo,monospace;text-align:center;padding:4px;overflow:hidden}
.art{display:block;border-radius:10px;object-fit:contain;height:auto}
.shop-art{width:100%;aspect-ratio:1;height:auto}
.keeper-art{width:72px;height:72px;flex:none}
.goal-art{width:56px;height:56px;flex:none}
.goal-big{width:160px;height:160px;align-self:center}
.sky{width:100%;height:36px;border-radius:10px 10px 0 0;object-fit:cover}
.weather{width:100%;height:auto;max-height:120px;object-fit:contain}
.stamp-art{width:56px;height:56px;flex:none;border-radius:50%}
.stamp-art.dim{opacity:.4}
.deco-art{width:88px;height:88px}
/* home */
.home{text-align:center;padding-top:40px}
.home .tag{font-size:1.1em;color:var(--ink-2)}
.home-actions{display:flex;flex-direction:column;gap:10px;align-items:center}
.chapters{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;text-align:left}
.chapter{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.chapter .num{font-weight:700;color:var(--ink-3)}
.chapter.locked{opacity:.6}.chapter.done{border-color:var(--up)}
.home-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* town */
.town-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.town-title{display:flex;flex-direction:column}
.goal-chip{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.goal-text{flex:1;display:flex;flex-direction:column;gap:4px}
.bar{height:10px;background:var(--paper-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--soon)}
.money-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.money{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.money strong{font-size:1.25em}
.chg{font-size:.85em;font-weight:600}
.bands{display:flex;flex-wrap:wrap;gap:4px;font-size:.78em}
.band{padding:1px 6px;border-radius:6px;background:var(--paper-2)}
.band.soon{border-left:4px solid var(--soon)}.band.buffer{border-left:4px solid var(--buffer)}.band.saved{border-left:4px solid var(--saved)}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--up-soft);border:1px solid var(--up);border-radius:12px;padding:10px 14px}
.street{background:var(--paper-2);border-radius:12px;padding:0 0 12px}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.shops.one{grid-template-columns:minmax(150px,220px);justify-content:center}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:6px;text-align:center;font-size:.9em}
.tile.sel{border-color:var(--ink)}
.tile.glow{outline:3px solid var(--up);outline-offset:3px}
.tile:focus-visible{outline:3px solid var(--up)}
.tile .shop-art{width:100%}
.tile .tprice{font-variant-numeric:tabular-nums;font-weight:600}
.tile .small{font-size:.8em}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:12px;margin:0 12px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px 0}
.center{text-align:center;padding:0 12px}
.share-card{display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px;font-variant-numeric:tabular-nums}
.price,.own{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price strong{font-size:1.2em}
.steppers{display:flex;gap:8px;align-items:center}
.detail{padding:10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.keeper{display:flex;gap:10px;align-items:center}
.bubble{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;position:relative}
.share-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.share-grid i{display:block;aspect-ratio:1;background:var(--paper-2);border-radius:2px}
.share-grid i.lit{background:var(--up)}
.tray{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;bottom:8px}
.tray-head{display:flex;justify-content:space-between;align-items:center}
.tray ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tray li{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* sheets */
.sheet-back{position:fixed;inset:0;background:rgba(43,36,32,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:720px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.num-in{min-height:48px;font:inherit;padding:0 12px;border:2px solid var(--ink);border-radius:10px;width:160px}
/* plan */
.bands-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.band-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.band-ctl{display:flex;gap:6px;align-items:center}
.goal-line{display:flex;gap:12px;align-items:center}
.radio{display:block;padding:8px 0}
/* decision */
.decision{text-align:center;align-items:center}
.decision .opts{justify-content:center}
.frozen{font-size:.85em}
/* show */
.show{text-align:center}
.receipt{min-height:1.4em;font-weight:600}
.show-head{display:flex;flex-direction:column;gap:2px}
.stage{background:var(--paper-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.show-shops{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.show-shop{display:flex;flex-direction:column;gap:6px}
.mini-card{display:flex;justify-content:space-between;background:var(--card);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums}
.news{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;text-align:left}
.show .actions{justify-content:center}
/* gazette */
.masthead{border-bottom:3px double var(--ink);padding-bottom:10px;text-align:center}
.eyebrow{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.money-story{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;font-variant-numeric:tabular-nums}
.busiest{text-align:center;color:var(--ink-2)}
/* results */
.results .lead{font-size:1.2em}
.stamps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stamp-row{display:flex;gap:12px;align-items:center}
.stamp-row.coming,.stamp-row.na,.stamp-row.soFar{opacity:.55}
.decos{display:flex;gap:10px;flex-wrap:wrap}
.deco{all:unset;cursor:pointer;border:2px solid transparent;border-radius:12px;padding:4px}
.deco.chosen{border-color:var(--up)}.deco:focus-visible{outline:3px solid var(--up)}
/* intro */
.intro{text-align:center;align-items:center;padding-top:32px}
.street-preview{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.street-preview .shop-art{width:180px}
@media (max-width:420px){.money-row{grid-template-columns:1fr 1fr}.money:first-child{grid-column:1 / -1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* M3: stall, neighbors, exposure, comparison, scrapbook */
.tile.stall{border-style:dashed;grid-column:1 / -1;flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;padding:8px 12px}
.tile.stall .shop-art{width:96px;height:96px;flex:none}
.houses{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0}
.house{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;text-align:center;font-size:.85em;padding:4px;border-radius:10px}
.house:focus-visible{outline:3px solid var(--up)}
.house-art{width:64px;height:64px;flex:none}
.expo{display:flex;flex-direction:column;gap:4px}
.expo-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center;font-size:.9em}
.bar.small{height:8px}
.fill.warn{background:var(--down)}
.nbars{display:flex;gap:10px;justify-content:center;align-items:flex-end;height:84px;background:var(--card);border-radius:12px;padding:6px}
.nbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px;font-size:.75em;gap:2px}
.nbar .b{width:26px;background:var(--ink-3);border-radius:4px 4px 0 0;min-height:2px}
.nbar.you .b{background:var(--up)}
.cols{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gaz-nb{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--rule)}
.nb-money{font-variant-numeric:tabular-nums}
.chapter-btn{all:unset;cursor:pointer;display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;width:100%}
.chapter-btn:focus-visible{outline:3px solid var(--up)}
.chapter:has(.chapter-btn){display:block}
.album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.album-card{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72em;text-align:center}
.album-art{width:100%;aspect-ratio:1}
.album-card.missing{opacity:.5}
.decoder{border-collapse:collapse;width:100%}
.decoder td{padding:4px 6px;vertical-align:top;font-size:.9em;border-top:1px solid var(--rule)}
.frame-art{width:100%;height:56px}
.opts.col{flex-direction:column;align-items:stretch}
.opts.col .btn{text-align:left;padding:8px 14px;line-height:1.3}
.intro .keeper{text-align:left}
/* M4: plan controls, fee lab, time machine */
.ctl{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--rule)}
.sel{min-height:48px;font:inherit;padding:0 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.lab-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.card.lab{text-align:left}
.cost-text{font-weight:600}
.gardens{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.garden{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.garden-art{position:relative;width:100%;aspect-ratio:1}
.tree-art{width:100%;height:100%}
.ground-art{display:none}
.garden .num{font-size:1.2em;font-weight:700}
.year-ctl{display:flex;gap:8px;align-items:center}
.range{flex:1;min-height:48px;accent-color:var(--up)}
@media (max-width:420px){.lab-cards{grid-template-columns:1fr}}
/* M5: free play, read-aloud, backup, lock, recovery, debug, scrapbook pages */
.presets{display:flex;flex-direction:column;gap:6px}
.preset{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:2px solid var(--rule);border-radius:10px;cursor:pointer}
.preset.sel{border-color:var(--ink)}
.preset input{margin-top:6px}
.num-in.wide{width:100%;max-width:360px}
.read-row{display:flex;justify-content:flex-end}
.btn.read{border-style:dashed}
.banner.lock{background:var(--card);border-color:var(--ink);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.card.recovery{border-color:var(--down)}
.card.inner{background:var(--paper-2)}
.file-in{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.strip{display:flex;gap:3px;margin:4px 0;flex-wrap:wrap}
.strip i{display:block;width:14px;height:14px;border-radius:3px;background:var(--paper-2)}
.strip i.up{background:var(--up)}.strip i.down{background:var(--down)}
.stamps-row{display:flex;gap:6px;flex-wrap:wrap}
.stamp-art.small{width:40px;height:40px}
.cols.small{font-size:.9em}
.dbg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.decoder.dbg td{font-size:.8em;font-variant-numeric:tabular-nums}
.ribbon{display:flex;flex-wrap:wrap;gap:1px}
.ribbon i{display:block;width:6px;height:14px;background:var(--rule)}
.ribbon i.mB{background:var(--up)}.ribbon i.mS{background:var(--down)}
/* M7 */
[tabindex="-1"]:focus{outline:none}
.money-row{flex-wrap:wrap}
.btn.music[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input[type=range]{width:100%;max-width:320px;margin:4px 0 8px}
/* R14: the guide eyebrow, the show caption, the confirm futures, the recap */
.hint-text{display:flex;flex-direction:column;gap:2px;flex:1 1 220px}
.hint .eyebrow{color:var(--ink-2)}
.show-cap{min-height:2.9em;font-size:.95em;color:var(--ink);text-wrap:balance}
.futures{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.recap-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.recap .still{font-weight:600}
.recap-money{font-size:1.1em;font-weight:600;font-variant-numeric:tabular-nums}
.teach{background:var(--up-soft);border:1px solid var(--up);border-radius:12px;padding:10px 14px}
.recap .actions{justify-content:center}
.futures{display:flex;flex-direction:column;gap:6px}
#go{width:100%}
.chg.pill{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--paper-2);color:var(--ink)}
.chg.pill.up{background:var(--up-soft);color:var(--up)}
.chg.pill.down{background:var(--down-soft);color:var(--ink);border-left:4px solid var(--down)}
.parts span{white-space:nowrap}
</style>
</head>
