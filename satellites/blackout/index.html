function makeRNG(seed) {
  var a = seed >>> 0;

    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = function (n) { return Math.floor(r() * n); };
  r.range = function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); };
  r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
  r.shuffle = function (arr) {
    var a2 = arr.slice(), i, j, tmp;
    for (i = a2.length - 1; i > 0; i--) {
      j = Math.floor(r() * (i + 1)); tmp = a2[i]; a2[i] = a2[j]; a2[j] = tmp;
    }
    return a2;
  };
  r.weighted = function (pairs) {
    var total = 0, i, x;
    for (i = 0; i < pairs.length; i++) total += pairs[i][1];
    x = r() * total;
    for (i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
    return pairs[pairs.length - 1][0];
  };
  r.seed = seed >>> 0;
  return r;
}

function seedFromString(str) {
  var h = 0x811c9dc5, i;
  for (i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;

/* tuple index helpers: i = ((c*6 + w)*6 + r)*6 + t */
var IDX_C = [], IDX_W = [], IDX_R = [], IDX_T = [];
(function () {
  var c, w, r, t, i = 0;
  for (c = 0; c < 6; c++) for (w = 0; w < 6; w++) for (r = 0; r < 6; r++) for (t = 0; t < 6; t++) {
    IDX_C[i] = c; IDX_W[i] = w; IDX_R[i] = r; IDX_T[i] = t; i++;
  }
})();

function tupleIndex(T) { return ((T.c * 6 + T.w) * 6 + T.r) * 6 + T.t; }
function tupleFromIndex(i) { return { c: IDX_C[i], w: IDX_W[i], r: IDX_R[i], t: IDX_T[i] }; }

var WORDS = 41; // 41 * 32 = 1312 >= 1296

function bitsFull() {
  var a = new Uint32Array(WORDS), i;
  for (i = 0; i < CONFIG.TUPLES; i++) a[i >> 5] |= (1 << (i & 31));
  return a;
}
function bitsGet(a, i) { return (a[i >> 5] & (1 << (i & 31))) !== 0; }
function bitsAnd(a, b) {
  var o = new Uint32Array(WORDS), i;
  for (i = 0; i < WORDS; i++) o[i] = a[i] & b[i];
  return o;
}
function bitsCount(a) {
  var n = 0, i, x;
  for (i = 0; i < WORDS; i++) {
    x = a[i];
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    x = (x + (x >>> 4)) & 0x0f0f0f0f;
    n += (Math.imul(x, 0x01010101) >>> 24);
  }
  return n;
}
function bitsFirst(a) {
  var i, j;
  for (i = 0; i < WORDS; i++) {
    if (a[i] === 0) continue;
    for (j = 0; j < 32; j++) if (a[i] & (1 << j)) return i * 32 + j;
  }
  return -1;
}
function bitsList(a) {
  var out = [], i;
  for (i = 0; i < CONFIG.TUPLES; i++) if (bitsGet(a, i)) out.push(i);
  return out;
}

/* ================== 4. GEN: predicates, world, clues ================== */

/* The single dispatcher. Depends only on clue params and static DATA, never on
   hidden world state. That is the fairness law: anything the solver uses, the
   player can read off the clue itself. */
function cluePasses(cl, c, w, r, t) {
  var p = cl.p;
  switch (cl.ty) {
    case 1:  return !(c === p.s && t === p.t && r !== p.r);
    case 2:  return !(w === p.w && c !== p.s && r !== p.r);
    case 3:  return !(r === p.r && !SUSPECTS[c].staff);
    case 4:  return !(r === p.r && t === p.t && SUSPECTS[c][p.a] !== p.v);
    case 5:  return p.near
      ? (r === p.r || ROOMS[p.r].adj.indexOf(r) >= 0)
      : (r !== p.r && ROOMS[p.r].adj.indexOf(r) < 0);
    case 6:
      if (p.m === "exact")  return t === p.t;
      if (p.m === "not")    return t !== p.t;
      if (p.m === "before") return t < p.t;
      return t > p.t;
    case 7:  return p.no ? (WEAPONS[w].cls !== p.cls) : (WEAPONS[w].cls === p.cls);
    case 8:  return p.k === "none" ? (c !== p.s) : (p.set.indexOf(c) >= 0);
    case 9:
      if (p.t < 0) return c !== p.a && c !== p.b;
      return !(t === p.t && (c === p.a || c === p.b));
    case 10: return !(r === p.r && (p.d === "after" ? t > p.t : t < p.t));
    case 11: return t > p.lo && t < p.hi;
    case 12: return p.k === "weapon" ? (w !== p.w) : (r !== p.r);
  }
  return true;
}

function clueMask(cl) {
  var m = new Uint32Array(WORDS), i;
  for (i = 0; i < CONFIG.TUPLES; i++) {
    if (cluePasses(cl, IDX_C[i], IDX_W[i], IDX_R[i], IDX_T[i])) m[i >> 5] |= (1 << (i & 31));
  }
  return m;
}

function clueTrueOf(cl, T) { return cluePasses(cl, T.c, T.w, T.r, T.t); }

/* ---- surface text ---- */
function fillTpl(s, d) {
  return s.replace(/\{(\w+)\}/g, function (m, k) {
    return (d[k] === undefined) ? m : d[k];

}
function nameList(ids) {
  var ns = ids.map(function (i) { return SUSPECTS[i].n; });
  if (ns.length === 1) return ns[0];
  return ns.slice(0, -1).join(", ") + " and " + ns[ns.length - 1];
}
function tplBank(cl) {
  var p = cl.p;
  switch (cl.ty) {
    case 1: return TPL.a1;
    case 2: return TPL.a2;
    case 3: return TPL.a3;
    case 4: return TPL.a4;
    case 5: return p.near ? TPL.a5near : TPL.a5far;
    case 6: return TPL["a6" + p.m];
    case 7: return p.no ? TPL.a7no : TPL.a7yes;
    case 8: return p.k === "none" ? TPL.a8none : TPL.a8set;
    case 9: return p.t < 0 ? TPL.a9all : TPL.a9at;
    case 10: return p.d === "after" ? TPL.a10after : TPL.a10before;
    case 11: return TPL.a11;
    case 12: return p.k === "weapon" ? TPL.a12weapon : TPL.a12room;
  }
  return [""];
}
function clueText(cl) {
  var p = cl.p, bank = tplBank(cl), s = bank[cl.ph % bank.length], d = {};
  switch (cl.ty) {
    case 1: d = { s: SUSPECTS[p.s].n, r: ROOMS[p.r].n, t: TIMES[p.t] }; break;
    case 2: d = { w: WEAPONS[p.w].n, s: SUSPECTS[p.s].n, r: ROOMS[p.r].n }; break;
    case 3: d = { r: ROOMS[p.r].n }; break;
    case 4: d = { r: ROOMS[p.r].n, t: TIMES[p.t], d: DESCS[p.a][p.v ? 1 : 0] }; break;
    case 5: d = { r: ROOMS[p.r].n, sub: ROOMS[p.r].sub }; break;
    case 6: d = { t: TIMES[p.t] }; break;
    case 7: d = { cls: CLASSWORD[p.cls] }; break;
    case 8: d = p.k === "none" ? { s: SUSPECTS[p.s].n } : { list: nameList(p.set) }; break;
    case 9: d = { a: SUSPECTS[p.a].n, b: SUSPECTS[p.b].n, t: p.t >= 0 ? TIMES[p.t] : "" }; break;
    case 10: d = { r: ROOMS[p.r].n, t: TIMES[p.t] }; break;
    case 11: d = { lo: TIMES[p.lo], hi: TIMES[p.hi], e1: EVENTS[p.e1], e2: EVENTS[p.e2] }; break;
    case 12: d = p.k === "weapon" ? { w: WEAPONS[p.w].n } : { r: ROOMS[p.r].n }; break;
  }
  return fillTpl(s, d);
}
var TYPE_NAMES = ["", "Alibi", "Ownership", "Access", "Sighting", "Trace", "Timeline",
  "Wound", "Motive", "Company", "Empty room", "Sequence", "Object"];

/* ---- world ---- */
function stepFrom(rng, cur, avoid) {
  var opts = [cur].concat(ROOMS[cur].adj), f = [], i;
  if (avoid >= 0) {
    for (i = 0; i < opts.length; i++) if (opts[i] !== avoid) f.push(opts[i]);
    opts = f.length ? f : [cur];
  }
  return opts[rng.int(opts.length)];
}
function walkThrough(rng, room, time) {
  var a = new Array(6), i;
  a[time] = room;
  for (i = time + 1; i < 6; i++) a[i] = stepFrom(rng, a[i - 1], -1);
  for (i = time - 1; i >= 0; i--) a[i] = stepFrom(rng, a[i + 1], -1);
  return a;
}
function walkAvoid(rng, avoidTime, avoidRoom) {
  var a = new Array(6), i, start;
  do { start = rng.int(6); } while (avoidTime === 0 && start === avoidRoom);
  a[0] = start;
  for (i = 1; i < 6; i++) a[i] = stepFrom(rng, a[i - 1], i === avoidTime ? avoidRoom : -1);
  return a;
}

function genWorld(rng) {
  var r = rng.int(6);
  var pool = ROOMS[r].staffOnly ? [2, 3, 5] : [0, 1, 2, 3, 4, 5];
  var c = pool[rng.int(pool.length)];
  var truth = { c: c, w: rng.int(6), r: r, t: rng.int(6) };
  var i, s;

  var loc = [];
  for (s = 0; s < 6; s++) loc.push(null);
  loc[truth.c] = walkThrough(rng, truth.r, truth.t);
  for (s = 0; s < 6; s++) if (s !== truth.c) loc[s] = walkAvoid(rng, truth.t, truth.r);

  // an inseparable pair (non culprits) some of the time, for clue type 9
  var pairAB = null;
  if (rng() < 0.42) {
    var others = [];
    for (s = 0; s < 6; s++) if (s !== truth.c) others.push(s);
    others = rng.shuffle(others);
    pairAB = [others[0], others[1]];
    loc[others[1]] = loc[others[0]].slice();
  }

  // weapons: owner is a permutation of suspects
  var owner = rng.shuffle([0, 1, 2, 3, 4, 5]);

/* ---- clue pool ---- */
function addClue(list, seen, ty, p, ref, rng) {
  var key = ty + "|" + JSON.stringify(p);

  seen[key] = 1;
  var cl = { id: list.length, ty: ty, p: p, ref: ref || [], ph: rng.int(6) };
  list.push(cl);

}

function genCluePool(W, rng) {
  var T = W.truth, list = [], seen = {}, i, k, s, tt, rr;
  var P = CONFIG.POOL;

  // 1 alibi
  for (k = 0; k < P.alibi; k++) {
    s = rng.int(6);
    tt = rng() < 0.5 ? T.t : rng.int(6);
    addClue(list, seen, 1, { s: s, t: tt, r: W.loc[s][tt] }, [s], rng);
  }
  // 2 weapon ownership
  var ws = rng.shuffle([0, 1, 2, 3, 4, 5]);
  for (k = 0; k < P.own && k < 6; k++) {
    var wi = ws[k];
    addClue(list, seen, 2, { w: wi, s: W.owner[wi], r: W.start[wi] }, [W.owner[wi]], rng);
  }
  // 3 room access
  for (rr = 0; rr < 6; rr++) {
    if (!ROOMS[rr].staffOnly) continue;
    if (rr === T.r && !SUSPECTS[T.c].staff) continue;
    if (rng() < 0.75) addClue(list, seen, 3, { r: rr }, [], rng);
  }
  // 4 witness sighting
  for (k = 0; k < P.sight; k++) {
    if (rng() < 0.4) { rr = T.r; tt = T.t; }
    else { rr = rng.int(6); tt = rng.int(6); }
    var occ = [];
    for (s = 0; s < 6; s++) if (W.loc[s][tt] === rr) occ.push(s);
    if (!occ.length) continue;
    var who = occ[rng.int(occ.length)];
    var a = ATTRS[rng.int(3)];
    addClue(list, seen, 4, { r: rr, t: tt, a: a, v: SUSPECTS[who][a] }, [], rng);
  }
  // 5 physical trace
  var nearSet = [T.r].concat(ROOMS[T.r].adj);
  var farSet = [];
  for (rr = 0; rr < 6; rr++) {
    if (rr === T.r) continue;
    if (ROOMS[rr].adj.indexOf(T.r) >= 0) continue;
    farSet.push(rr);
  }
  for (k = 0; k < P.trace; k++) {
    if (rng() < 0.5 || !farSet.length) {
      addClue(list, seen, 5, { r: nearSet[rng.int(nearSet.length)], near: true }, [], rng);
    } else {
      addClue(list, seen, 5, { r: farSet[rng.int(farSet.length)], near: false }, [], rng);
    }
  }
  // 6 timeline
  for (k = 0; k < P.timeline; k++) {
    var m = rng.weighted([["not", 35], ["before", 25], ["after", 25], ["exact", 15]]);
    if (m === "before" && T.t >= 5) m = "not";
    if (m === "after" && T.t <= 0) m = "not";
    if (m === "not") {
      tt = rng.int(6); if (tt === T.t) tt = (tt + 1 + rng.int(5)) % 6;
      addClue(list, seen, 6, { t: tt, m: "not" }, [], rng);
    } else if (m === "before") {
      addClue(list, seen, 6, { t: rng.range(T.t + 1, 5), m: "before" }, [], rng);
    } else if (m === "after") {
      addClue(list, seen, 6, { t: rng.range(0, T.t - 1), m: "after" }, [], rng);
    } else {
      addClue(list, seen, 6, { t: T.t, m: "exact" }, [], rng);
    }
  }
  // 7 weapon trace
  var trueCls = WEAPONS[T.w].cls;
  var clsSize = 0;
  for (i = 0; i < 6; i++) if (WEAPONS[i].cls === trueCls) clsSize++;
  var otherCls = [];
  for (var key2 in CLASSWORD) if (key2 !== trueCls) otherCls.push(key2);
  for (k = 0; k < P.wtrace; k++) {
    if (clsSize >= 2 && rng() < 0.35) addClue(list, seen, 7, { cls: trueCls, no: false }, [], rng);
    else addClue(list, seen, 7, { cls: otherCls[rng.int(otherCls.length)], no: true }, [], rng);
  }
  // 8 motive
  var zeroList = [];
  for (s = 0; s < 6; s++) if (W.motive[s] === 0) zeroList.push(s);
  zeroList = rng.shuffle(zeroList);
  for (k = 0; k < zeroList.length && k < P.motive; k++) {
    addClue(list, seen, 8, { k: "none", s: zeroList[k] }, [zeroList[k]], rng);
  }
  if (rng() < 0.5) {
    var lvl = W.motive[T.c] >= 2 ? 2 : 1;
    var setL = [];
    for (s = 0; s < 6; s++) if (W.motive[s] >= lvl) setL.push(s);
    if (setL.length >= 3 && setL.length <= 5) {
      addClue(list, seen, 8, { k: "set", set: setL }, setL.slice(), rng);
    }
  }
  // 9 company
  if (W.pairAB && rng() < 0.65) {
    addClue(list, seen, 9, { a: W.pairAB[0], b: W.pairAB[1], t: -1 }, W.pairAB.slice(), rng);
  }
  for (k = 0; k < P.pair; k++) {
    tt = rng.int(6);
    var byRoom = {};
    for (s = 0; s < 6; s++) {
      var rk = W.loc[s][tt];
      if (!byRoom[rk]) byRoom[rk] = [];
      byRoom[rk].push(s);
    }
    var groups = [];
    for (var g in byRoom) if (byRoom[g].length >= 2) groups.push(byRoom[g]);
    if (!groups.length) continue;
    var grp = rng.shuffle(groups[rng.int(groups.length)]);
    addClue(list, seen, 9, { a: grp[0], b: grp[1], t: tt }, [grp[0], grp[1]], rng);
  }
  // 10 negative space
  for (k = 0; k < P.negative; k++) {
    if (rng() < 0.5) {
      rr = T.r;
      if (rng() < 0.5) {
        if (T.t >= 5) continue;
        addClue(list, seen, 10, { r: rr, t: rng.range(T.t, 5), d: "after" }, [], rng);
      } else {
        if (T.t <= 0) continue;
        addClue(list, seen, 10, { r: rr, t: rng.range(0, T.t), d: "before" }, [], rng);
      }
    } else {
      rr = rng.int(6); if (rr === T.r) rr = (rr + 1 + rng.int(5)) % 6;
      addClue(list, seen, 10, { r: rr, t: rng.int(6), d: rng() < 0.5 ? "after" : "before" }, [], rng);
    }
  }
  // 11 sequence
  if (T.t > 0 && T.t < 5) {
    for (k = 0; k < P.sequence; k++) {
      var lo = rng.range(0, T.t - 1), hi = rng.range(T.t + 1, 5);
      var e1 = rng.int(EVENTS.length), e2 = rng.int(EVENTS.length);
      if (e2 === e1) e2 = (e2 + 1) % EVENTS.length;
      addClue(list, seen, 11, { lo: lo, hi: hi, e1: e1, e2: e2 }, [], rng);
    }
  }
  // 12 object state
  for (k = 0; k < P.object; k++) {
    if (rng() < 0.55) {
      var wx = rng.int(6); if (wx === T.w) wx = (wx + 1 + rng.int(5)) % 6;
      addClue(list, seen, 12, { k: "weapon", w: wx }, [], rng);
    } else {
      var rx = rng.int(6); if (rx === T.r) rx = (rx + 1 + rng.int(5)) % 6;
      addClue(list, seen, 12, { k: "room", r: rx }, [], rng);
    }
  }
  return list;
}

/* ---- solve / minimize ---- */

  var acc = bitsFull(), i, j, x, n = 0;

}

/* ---- placement ---- */

  var press = [null, null, null, null, null, null];
  var used = {}, i, s;
  var minIds = {};
  for (i = 0; i < minimal.length; i++) minIds[minimal[i].id] = 1;

  function freeRoom() {
    var order = rng.shuffle([0, 1, 2, 3, 4, 5]), j;
    for (j = 0; j < 6; j++) if (rooms[order[j]].length < CONFIG.ROOM_SLOTS) return order[j];
    return -1;
  }
  function freeInt() {
    var order = rng.shuffle([0, 1, 2, 3, 4, 5]), j;
    for (j = 0; j < 6; j++) if (ints[order[j]] === null) return order[j];

    var b = isPhysical(cl) ? freeInt() : freeRoom();
    if (b >= 0) { if (isPhysical(cl)) ints[b] = cl.id; else rooms[b].push(cl.id); used[cl.id] = 1; return true; }
    return false;
  }

  var shuffled = rng.shuffle(minimal.slice());
  var pressPicks = [];
  var rest = [];
  for (i = 0; i < shuffled.length; i++) {
    var cl = shuffled[i];
    var canPress = cl.ref.length > 0 && pressPicks.length < CONFIG.MAX_PRESS_MINIMAL && rng() < 0.5;
    if (canPress) {
      var cand = rng.shuffle(cl.ref.slice()), placedP = false, j;
      for (j = 0; j < cand.length; j++) {
        if (press[cand[j]] === null) {
          press[cand[j]] = cl.id; used[cl.id] = 1;
          pressPicks.push({ s: cand[j], id: cl.id });
          placedP = true; break;
        }
      }
      if (placedP) continue;
    }
    rest.push(cl);
  }
  for (i = 0; i < rest.length; i++) if (!putBasic(rest[i])) return null;

  // every press gated suspect must be reachable: a basic slot must mention them
  function basicMentions(sus) {

    for (j = 0; j < 6; j++) {
      if (ints[j] !== null && pool[ints[j]].ref.indexOf(sus) >= 0) return true;
      for (k = 0; k < rooms[j].length; k++) if (pool[rooms[j][k]].ref.indexOf(sus) >= 0) return true;
    }

    var opener = null, j2;
    for (j2 = 0; j2 < pool.length; j2++) {

  for (i = 0; i < 6; i++) {
    for (k = 0; k < pl.rooms[i].length; k++) if (pl.minIds[pl.rooms[i][k]]) needRoom[i] = 1;
    if (pl.ints[i] !== null && pl.minIds[pl.ints[i]]) needInt[i] = 1;
  }
  for (i in needRoom) n += CONFIG.COST_SEARCH;
  for (i in needInt) n += CONFIG.COST_INTERVIEW;
  for (i = 0; i < pl.pressMinimal.length; i++) {
    var s = pl.pressMinimal[i].s;
    n += CONFIG.COST_PRESS;
    // unlocking clue must be visited too, if it is not already on the list
    var covered = false;
    for (j = 0; j < 6 && !covered; j++) {
      if (needInt[j] && pl.ints[j] !== null && pool[pl.ints[j]].ref.indexOf(s) >= 0) covered = true;
      if (needRoom[j]) for (k = 0; k < pl.rooms[j].length; k++)
        if (pool[pl.rooms[j][k]].ref.indexOf(s) >= 0) covered = true;

    if (covered) continue;
    var extra = false;
    for (j = 0; j < 6 && !extra; j++) {

    }
    if (!extra) for (j = 0; j < 6 && !extra; j++) {
      for (k = 0; k < pl.rooms[j].length; k++)
        if (pool[pl.rooms[j][k]].ref.indexOf(s) >= 0) { needRoom[j] = 1; extra = true; break; }
    }

function caseTitle(rng, T) {
  var noun = TITLE_NOUNS[rng.int(TITLE_NOUNS.length)];
  if (rng() < 0.5) return "The " + ROOMS[T.r].n + " " + noun;
  return "The " + TITLE_TIMEWORDS[rng.int(TITLE_TIMEWORDS.length)] + " " + noun;
}

function generateCase(seed) {
  var rng = makeRNG(seed >>> 0);
  var retries = 0, attempt, W, pool, masks, i, acc;
  for (attempt = 0; attempt < CONFIG.MAX_ATTEMPTS; attempt++) {
    W = genWorld(rng);
    pool = genCluePool(W, rng);
    masks = [];
    var allTrue = true;
    for (i = 0; i < pool.length; i++) {
      if (!clueTrueOf(pool[i], W.truth)) { allTrue = false; break; }
      masks[pool[i].id] = clueMask(pool[i]);
    }
    if (!allTrue) { retries++; continue; }
    acc = solveMask(pool, masks);
    if (bitsCount(acc) !== 1 || bitsFirst(acc) !== tupleIndex(W.truth)) { retries++; continue; }
    var minimal = minimize(pool, masks, rng);
    if (isMotiveOnly(minimal)) { retries++; continue; }
    var pl = placeClues(W, pool, minimal, rng);

      world: W,
      pool: pool,
      masks: masks,

/* ================== 5. SIM: pure state machine ================== */

function newGame(cs) {
  return {
    seed: cs.seed,
    actionsLeft: CONFIG.ACTIONS,
    searched: [], interviewed: [], pressed: [],
    found: [],
    marks: {},
    status: "play",
    acc: null,
    contraId: -1,
    stars: 0

function hasFound(st, id) { return st.found.indexOf(id) >= 0; }

        if (v === "n") continue;

        allowed.push(x);

  return 1;

  var i, id;
  for (i = 0; i < st.found.length; i++) {
    id = st.found[i];

  }
  for (i = 0; i < cs.pool.length; i++) {

function step(st, cs, act) {

  }
  switch (act.k) {
    case "search":
      if (!(act.r >= 0 && act.r < 6)) { ev.push({ e: "invalid", why: "no such room" }); break; }
      if (st.searched.indexOf(act.r) >= 0) { ev.push({ e: "invalid", why: "already searched" }); break; }
      if (st.actionsLeft < CONFIG.COST_SEARCH) { ev.push({ e: "invalid", why: "no actions left" }); break; }
      st.actionsLeft -= CONFIG.COST_SEARCH;
      st.searched.push(act.r);
      ids = cs.place.rooms[act.r];
      for (i = 0; i < ids.length; i++) if (!hasFound(st, ids[i])) { st.found.push(ids[i]); ev.push({ e: "clue", id: ids[i] }); }
      if (!ids.length) ev.push({ e: "nothing", where: "room", r: act.r });
      break;
    case "interview":
      if (!(act.s >= 0 && act.s < 6)) { ev.push({ e: "invalid", why: "no such person" }); break; }
      if (st.interviewed.indexOf(act.s) >= 0) { ev.push({ e: "invalid", why: "already spoken to" }); break; }
      if (st.actionsLeft < CONFIG.COST_INTERVIEW) { ev.push({ e: "invalid", why: "no actions left" }); break; }
      st.actionsLeft -= CONFIG.COST_INTERVIEW;
      st.interviewed.push(act.s);
      if (cs.place.ints[act.s] !== null) {
        if (!hasFound(st, cs.place.ints[act.s])) { st.found.push(cs.place.ints[act.s]); ev.push({ e: "clue", id: cs.place.ints[act.s] }); }
      } else ev.push({ e: "nothing", where: "suspect", s: act.s });
      break;
    case "press":
      if (!(act.s >= 0 && act.s < 6)) { ev.push({ e: "invalid", why: "no such person" }); break; }
      if (st.pressed.indexOf(act.s) >= 0) { ev.push({ e: "invalid", why: "already pressed" }); break; }
      if (!pressUnlocked(cs, st, act.s)) { ev.push({ e: "invalid", why: "locked" }); break; }
      if (st.actionsLeft < CONFIG.COST_PRESS) { ev.push({ e: "invalid", why: "no actions left" }); break; }
      st.actionsLeft -= CONFIG.COST_PRESS;
      st.pressed.push(act.s);
      if (cs.place.press[act.s] !== null) {
        if (!hasFound(st, cs.place.press[act.s])) { st.found.push(cs.place.press[act.s]); ev.push({ e: "clue", id: cs.place.press[act.s] }); }
        else ev.push({ e: "nothing", where: "press", s: act.s });
      } else ev.push({ e: "nothing", where: "press", s: act.s });
      break;
    case "mark":
      if (["w", "r", "t"].indexOf(act.tab) < 0) { ev.push({ e: "invalid", why: "no such tab" }); break; }
      if (!(act.row >= 0 && act.row < 6 && act.col >= 0 && act.col < 6)) { ev.push({ e: "invalid", why: "off board" }); break; }
      if (["", "y", "n", "q"].indexOf(act.v) < 0) { ev.push({ e: "invalid", why: "no such mark" }); break; }
      if (act.v === "") delete st.marks[markKey(act.tab, act.row, act.col)];
      else st.marks[markKey(act.tab, act.row, act.col)] = act.v;
      ev.push({ e: "mark" });
      break;
    case "automark":
      var cells = excludedCells(foundMask(cs, st, -1)), tabs = ["w", "r", "t"], k;
      for (k = 0; k < 3; k++) for (i = 0; i < cells[tabs[k]].length; i++) {
        var cell = cells[tabs[k]][i];
        st.marks[markKey(tabs[k], Math.floor(cell / 6), cell % 6)] = "n";
      }
      ev.push({ e: "mark" });
      break;
    case "accuse":
      if (!(act.c >= 0 && act.c < 6 && act.w >= 0 && act.w < 6 && act.r >= 0 && act.r < 6 && act.t >= 0 && act.t < 6)) {
        ev.push({ e: "invalid", why: "incomplete accusation" }); break;
      }
      st.acc = { c: act.c, w: act.w, r: act.r, t: act.t };
      if (act.c === cs.truth.c && act.w === cs.truth.w && act.r === cs.truth.r && act.t === cs.truth.t) {
        st.status = "won";
        st.stars = starsFor(st.actionsLeft);
        ev.push({ e: "won", stars: st.stars });
      } else {
        st.status = "lost";
        st.stars = 0;
        st.contraId = findContradiction(cs, st, st.acc);
        ev.push({ e: "lost", contraId: st.contraId });
      }
      break;
    default:
      ev.push({ e: "invalid", why: "unknown action" });
  }
  if (st.actionsLeft < 0) st.actionsLeft = 0;
  return { state: st, events: ev };
}

function actionsUsed(st) { return CONFIG.ACTIONS - st.actionsLeft; }

/* ================== agents (verification only) ================== */

function greedyAgent(cs, rng) {
  var st = newGame(cs);
  var cand = bitsFull(), i, j;
  function absorb(ev) {
    for (i = 0; i < ev.length; i++) if (ev[i].e === "clue") {
      var m = cs.masks[ev[i].id];
      for (j = 0; j < WORDS; j++) cand[j] &= m[j];
    }
  }
  var guard = 0;
  while (st.actionsLeft > 0 && guard++ < 200) {
    if (bitsCount(cand) === 1) break;
    var basics = [], presses = [], k;
    for (k = 0; k < 6; k++) if (st.searched.indexOf(k) < 0) basics.push({ k: "search", r: k });
    for (k = 0; k < 6; k++) if (st.interviewed.indexOf(k) < 0) basics.push({ k: "interview", s: k });
    for (k = 0; k < 6; k++) if (st.pressed.indexOf(k) < 0 && pressUnlocked(cs, st, k)) presses.push({ k: "press", s: k });
    var act = null;
    if (presses.length && st.actionsLeft >= CONFIG.COST_PRESS && rng() < CONFIG.PRESS_BIAS) act = presses[rng.int(presses.length)];
    else if (basics.length) act = basics[rng.int(basics.length)];
    else if (presses.length && st.actionsLeft >= CONFIG.COST_PRESS) act = presses[rng.int(presses.length)];
    if (!act) break;
    absorb(step(st, cs, act).events);
  }
  var list = bitsList(cand);
  var pickIdx = list.length ? list[rng.int(list.length)] : 0;
  var guess = tupleFromIndex(pickIdx);
  step(st, cs, { k: "accuse", c: guess.c, w: guess.w, r: guess.r, t: guess.t });
  return { solved: st.status === "won", actionsUsed: actionsUsed(st), remaining: list.length };
}

function perfectAgent(cs) {
  var st = newGame(cs), pl = cs.place, i, k, need = [];
  var needRoom = {}, needInt = {}, needPress = [];
  for (i = 0; i < 6; i++) {
    for (k = 0; k < pl.rooms[i].length; k++) if (pl.minIds[pl.rooms[i][k]]) needRoom[i] = 1;
    if (pl.ints[i] !== null && pl.minIds[pl.ints[i]]) needInt[i] = 1;
    if (pl.press[i] !== null && pl.minIds[pl.press[i]]) needPress.push(i);
  }
  for (i = 0; i < needPress.length; i++) {
    var s = needPress[i], found = false;
    for (k = 0; k < 6 && !found; k++) {
      if (needInt[k] && pl.ints[k] !== null && cs.pool[pl.ints[k]].ref.indexOf(s) >= 0) found = true;
      if (needRoom[k]) { var q; for (q = 0; q < pl.rooms[k].length; q++) if (cs.pool[pl.rooms[k][q]].ref.indexOf(s) >= 0) found = true; }
    }
    if (found) continue;
    for (k = 0; k < 6 && !found; k++) if (pl.ints[k] !== null && cs.pool[pl.ints[k]].ref.indexOf(s) >= 0) { needInt[k] = 1; found = true; }
    for (k = 0; k < 6 && !found; k++) { var q2; for (q2 = 0; q2 < pl.rooms[k].length; q2++) if (cs.pool[pl.rooms[k][q2]].ref.indexOf(s) >= 0) { needRoom[k] = 1; found = true; break; } }
  }
  for (i in needRoom) step(st, cs, { k: "search", r: +i });
  for (i in needInt) step(st, cs, { k: "interview", s: +i });
  for (i = 0; i < needPress.length; i++) step(st, cs, { k: "press", s: needPress[i] });
  var cand = foundMask(cs, st, -1);
  var list = bitsList(cand);
  var guess = tupleFromIndex(list.length ? list[0] : 0);
  step(st, cs, { k: "accuse", c: guess.c, w: guess.w, r: guess.r, t: guess.t });
  return { solved: st.status === "won", actionsUsed: actionsUsed(st), remaining: list.length };
}

/* string level sanity: text must render clean and never contradict the truth */
function textSanity(cs) {
  var i, problems = [];
  for (i = 0; i < cs.pool.length; i++) {
    var cl = cs.pool[i], s = clueText(cl);
    if (!clueTrueOf(cl, cs.truth)) problems.push("clue " + i + " false of truth");
    if (s.indexOf("{") >= 0 || s.indexOf("}") >= 0) problems.push("clue " + i + " unfilled slot");
    if (/[-‐-―]/.test(s)) problems.push("clue " + i + " dash in copy");
    if (s.length < 8) problems.push("clue " + i + " empty text");
    var must = clueSubjects(cl);
    for (var j = 0; j < must.length; j++) if (s.indexOf(must[j]) < 0) problems.push("clue " + i + " text drops " + must[j]);
  }
  return problems;
}
function clueSubjects(cl) {
  var p = cl.p;
  switch (cl.ty) {
    case 1: return [SUSPECTS[p.s].n, ROOMS[p.r].n, TIMES[p.t]];
    case 2: return [WEAPONS[p.w].n, SUSPECTS[p.s].n, ROOMS[p.r].n];
    case 3: return [ROOMS[p.r].n];
    case 4: return [ROOMS[p.r].n, TIMES[p.t], DESCS[p.a][p.v ? 1 : 0]];
    case 5: return [ROOMS[p.r].n, ROOMS[p.r].sub];
    case 6: return [TIMES[p.t]];
    case 7: return [CLASSWORD[p.cls]];
    case 8: return p.k === "none" ? [SUSPECTS[p.s].n] : [SUSPECTS[p.set[0]].n];
    case 9: return p.t < 0 ? [SUSPECTS[p.a].n, SUSPECTS[p.b].n] : [SUSPECTS[p.a].n, SUSPECTS[p.b].n, TIMES[p.t]];
    case 10: return [ROOMS[p.r].n, TIMES[p.t]];
    case 11: return [TIMES[p.lo], TIMES[p.hi], EVENTS[p.e1], EVENTS[p.e2]];
    case 12: return p.k === "weapon" ? [WEAPONS[p.w].n] : [ROOMS[p.r].n];
  }
  return [];
}

/* serialisation for save and resume: a case is only its seed */
function serializeState(st) {
  return {
    seed: st.seed, actionsLeft: st.actionsLeft,
    searched: st.searched.slice(), interviewed: st.interviewed.slice(), pressed: st.pressed.slice(),
    found: st.found.slice(), marks: JSON.parse(JSON.stringify(st.marks)),
    status: st.status, acc: st.acc ? { c: st.acc.c, w: st.acc.w, r: st.acc.r, t: st.acc.t } : null,
    contraId: st.contraId, stars: st.stars

}
function deserializeState(o, cs) {
  var st = newGame(cs);

  var n = function (v, d) { return (typeof v === "number" && isFinite(v)) ? v : d; };
  var arr = function (v) {
    if (!v || typeof v.length !== "number") return [];
    var out = [], i;
    for (i = 0; i < v.length; i++) if (typeof v[i] === "number" && v[i] >= 0) out.push(v[i]);
    return out;
  };
  st.actionsLeft = Math.max(0, Math.min(CONFIG.ACTIONS, n(o.actionsLeft, CONFIG.ACTIONS)));
  st.searched = arr(o.searched); st.interviewed = arr(o.interviewed); st.pressed = arr(o.pressed);
  st.found = arr(o.found).filter(function (id) { return id < cs.pool.length; });
  st.marks = {};
  if (o.marks && typeof o.marks === "object") {
    for (var k in o.marks) if (/^[wrt]:[0-5]:[0-5]$/.test(k) && ["y", "n", "q"].indexOf(o.marks[k]) >= 0) st.marks[k] = o.marks[k];
  }
  st.status = ["play", "won", "lost"].indexOf(o.status) >= 0 ? o.status : "play";
  st.acc = (o.acc && typeof o.acc === "object") ? { c: n(o.acc.c, 0), w: n(o.acc.w, 0), r: n(o.acc.r, 0), t: n(o.acc.t, 0) } : null;
  st.contraId = n(o.contraId, -1);
  st.stars = n(o.stars, 0);
  return st;
}
/* ---- save core: pure, storage free. The SAVE layer only supplies strings. ---- */
var SAVE_KEY = "lw_" + CONFIG.GAME_ID + "_v1";

function saveDefaults() {
  return {
    v: 1, gameId: CONFIG.GAME_ID,
    stats: { cases: 0, solved: 0, lost: 0, stars: 0, bestStars: 0, dailyStreak: 0, lastDaily: "" },
    unlocks: [],
    best: { fewestActions: 0 },
    settings: { sound: true, volume: 0.7, haptics: true, autoMark: false, typewriter: true, reduceMotion: false },
    archive: [],
    resume: null

}
function saveMigrate(s) {
  if (!s || typeof s !== "object") return saveDefaults();
  if (typeof s.v !== "number") s.v = 1;
  return s;
}
function saveParse(raw) {
  var d = saveDefaults();
  if (typeof raw !== "string" || !raw) return d;
  var o;
  try { o = JSON.parse(raw); } catch (e) { return d; }
  if (!o || typeof o !== "object" || o.constructor === Array) return d;
  o = saveMigrate(o);
  var out = saveDefaults(), k;
  for (k in out.stats) if (typeof (o.stats || {})[k] === typeof out.stats[k]) out.stats[k] = o.stats[k];
  for (k in out.settings) if (typeof (o.settings || {})[k] === typeof out.settings[k]) out.settings[k] = o.settings[k];
  for (k in out.best) if (typeof (o.best || {})[k] === "number") out.best[k] = o.best[k];
  if (o.archive && o.archive.constructor === Array) out.archive = o.archive.slice(0, 10);
  if (o.resume && typeof o.resume === "object") out.resume = o.resume;
  return out;
}
/* two tab law: counters ADD, bests MAX, never write a whole object you read once */
function saveMerge(disk, patch) {
  var out = saveParse(JSON.stringify(disk || {})), k;
  if (patch.addStats) for (k in patch.addStats) out.stats[k] = (out.stats[k] || 0) + patch.addStats[k];
  if (patch.maxStats) for (k in patch.maxStats) out.stats[k] = Math.max(out.stats[k] || 0, patch.maxStats[k]);
  if (patch.setStats) for (k in patch.setStats) out.stats[k] = patch.setStats[k];
  if (patch.settings) for (k in patch.settings) out.settings[k] = patch.settings[k];
  if (patch.bestLow) for (k in patch.bestLow) {
    out.best[k] = (!out.best[k]) ? patch.bestLow[k] : Math.min(out.best[k], patch.bestLow[k]);

}
function shareString(cs, st, isDaily, dayNo) {
  var head = isDaily ? ("BLACKOUT day " + dayNo) : ("BLACKOUT case " + cs.seed);
  if (st.status === "won") {
    return head + " solved in " + actionsUsed(st) + " moves, " +
      (st.stars === 3 ? "three stars" : st.stars === 2 ? "two stars" : "one star") +
      ". Try it: ?seed=" + cs.seed;
  }
  return head + " beat me in " + actionsUsed(st) + " moves. Try it: ?seed=" + cs.seed;
}
