<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>BLACKOUT</title>
<meta name="description" content="A procedural murder with a proven single answer.">
<meta name="theme-color" content="#5ad1e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLACKOUT">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b0f; --panel:#14161d; --panel2:#1b1e27; --line:#2a2f3b;
  --ink:#d8dde6; --dim:#8891a3; --accent:#5ad1e6; --warm:#e8c37a; --bad:#e8746a;
  --pad:10px;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums;
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hd{display:flex;align-items:center;gap:6px;padding:6px var(--pad);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#111319,#0c0e13)}
/* The case title is the most identity carrying string in the game, so it wraps
   and shrinks instead of truncating. Tiers are picked by titleTier() in SIM and
   gated in node against every title the generator can produce. */
.hd .ttl{flex:1;min-width:0;text-align:center;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--warm);font-weight:700;line-height:1.14;white-space:normal;overflow-wrap:break-word}
.hd .ttl.t1{font-size:12.5px;letter-spacing:.03em}
.hd .ttl.t2{font-size:11px;letter-spacing:.01em}
.hd .sub{display:block;font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--accent);opacity:.85}
.ghost{min-height:48px;min-width:48px;padding:0 8px;font-size:10px;letter-spacing:.09em;
  color:var(--dim);text-transform:uppercase;border-radius:8px;flex:0 0 auto}
.ghost:active{background:#1c2029}
.watchbar{display:flex;align-items:center;gap:10px;padding:8px var(--pad);border-bottom:1px solid var(--line);background:#0c0e13}
.watch{width:52px;height:52px;flex:0 0 52px}
.wtx{flex:1;line-height:1.15}
.wtx b{display:block;font-size:24px;font-weight:800;color:var(--ink)}
.wtx span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.wtx.low b{color:var(--warm)}
.danger{min-height:48px;padding:0 14px;border:1px solid #4a2f2c;background:#1d1416;color:#f0a79e;
  border-radius:10px;font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:700}
.danger:active{background:#2a1a1c}
main{flex:1;overflow-y:auto;padding:var(--pad) var(--pad) 20px}
.bn{display:flex;border-top:1px solid var(--line);background:#0c0e13;
  padding-bottom:env(safe-area-inset-bottom)}
.bn button{flex:1;min-height:54px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.bn button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
h2:first-child{margin-top:2px}
.brief{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--warm);
  border-radius:8px;padding:10px 12px;font-size:13.5px;color:#b9c1cf}
.brief div+div{margin-top:4px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:8px;min-height:56px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;font-weight:600}
.row .nm small{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.act{min-height:48px;min-width:48px;padding:0 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.act i{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.act:active{background:#242936}
.act.done{color:#59606e;border-style:dashed;background:transparent}
.act.lock{color:#59606e;border-color:#232733}
.act.hot{border-color:var(--accent);color:var(--accent)}
.silwrap{width:34px;height:44px;flex:0 0 34px;line-height:0}
.sil{width:34px;height:44px;display:block;opacity:.92}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tabs button.on{color:#06222a;background:var(--accent);border-color:var(--accent);font-weight:700}
/* The board is full bleed so a 52px cell has room to be 52px on a 375px phone
   instead of the 48.2px it used to squeeze into. sim.js --layout reads these
   numbers straight out of this stylesheet and fails under 50px. */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  margin-left:calc(var(--pad) * -1);margin-right:calc(var(--pad) * -1)}
.grid{display:grid;grid-template-columns:56px repeat(6,minmax(52px,1fr));min-width:368px}
.grid .hc{height:36px;display:flex;align-items:center;justify-content:center;font-size:10.5px;
  letter-spacing:.05em;color:var(--dim);border-bottom:1px solid var(--line);text-align:center;padding:0 2px;
  overflow:hidden}
.grid .rh{height:52px;display:flex;align-items:center;padding-left:6px;font-size:12px;color:#aeb6c4;
  border-top:1px solid #1e222c}
.cell{height:52px;min-width:52px;border-top:1px solid #1e222c;border-left:1px solid #1e222c;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--dim)}
.cell.y{color:var(--accent)}
.cell.n{color:#6b7382}
.cell.q{color:var(--warm)}
.cell.halo{background:rgba(90,209,230,.16);box-shadow:inset 0 0 0 1px rgba(90,209,230,.5)}
.counter{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.counter b{font-size:26px;font-weight:800;color:var(--accent)}
.counter span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.clue{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;
  min-height:48px;display:block;width:100%;text-align:left}
.clue .tag{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:2px}
.clue .tx{font-size:13.5px;color:#c8d0dd;line-height:1.4}
.clue.sel{border-color:var(--accent);background:#101a1f}
.clue.sel .tag{color:var(--accent)}
.empty{color:var(--dim);font-size:13px;padding:8px 2px}
.ov{position:fixed;inset:0;background:rgba(6,7,10,.94);z-index:40;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.ovbox{margin:auto;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px;max-height:100%;overflow-y:auto}
.ovbox h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--warm);margin-bottom:10px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.pick button{min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);
  font-size:12px;padding:2px 4px;color:#b9c1cf}
.pick button.on{background:var(--accent);color:#06222a;border-color:var(--accent);font-weight:700}
.wide{width:100%;min-height:52px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);
  color:#06222a;font-weight:800;font-size:13px;letter-spacing:.11em;text-transform:uppercase;margin-top:6px}
.wide.sec{background:transparent;color:var(--dim);border-color:var(--line);font-weight:600}
.wide[disabled]{opacity:.4}
.beat{font-size:16px;line-height:1.5;color:#dfe5ee;margin-bottom:8px}
.stamp{border:2px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 10px;margin:10px 0;
  font-size:12.5px;letter-spacing:.04em}
.stars{font-size:26px;color:var(--warm);letter-spacing:6px}
.optrow{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid #1e222c}
.optrow span{flex:1;font-size:13.5px}
.sw{min-width:64px;min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sw.on{color:#06222a;background:var(--accent);border-color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));
  background:#1d222c;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;
  font-size:13px;z-index:60;max-width:88vw;text-align:center}
.dossier{display:grid;grid-template-columns:1fr;gap:6px}
.dz{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.dz b{color:#cfd6e2}
.dz small{color:var(--dim);font-size:11.5px}
.arc{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;margin-bottom:6px;min-height:52px}
.arc .an{flex:1;font-size:13px}
.arc .an small{display:block;color:var(--dim);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fi .16s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
</style>

<body>
<div id="app"></div>
<script>
/* BLACKOUT
   game id      : blackout
   seed policy  : ?seed=<int> boots that exact case. No seed boots the daily case,
                  seedFromString(YYYY-MM-DD + "blackout"). NEW CASE draws a fresh
                  seed from the session RNG.
   moat         : every case is proven to have exactly one solution before the
                  player sees it. See GEN.generateCase and sim.js --cases=10000.
   tuning notes : CONFIG.POOL controls clue counts per type. Minimal set size is
                  measured, never clamped, so the histogram gate can actually fail.
   known gaps   : unreliable narrators (HANDOFF 4.7) are not built.
*/
// ---- SIM_EXPORT_START ----
"use strict";

/* ============================ 1. CONFIG ============================ */

var CONFIG = Object.freeze({
  GAME_ID: "blackout",
  VERSION: 1,
  N: 6,
  TUPLES: 1296,
  ACTIONS: 20,
  COST_SEARCH: 1,
  COST_INTERVIEW: 1,
  COST_PRESS: 2,
  ROOM_SLOTS: 2,
  MAX_PRESS_MINIMAL: 2,
  REACH_BOUND: 16,
  NOISE_MIN: 6,
  NOISE_MAX: 12,
  MAX_ATTEMPTS: 60,
  PRESS_BIAS: 0.06,
  PRESS_FLOOR: 12,
  STAR3: 8,
  STAR2: 4,
  MIN_SET_LO: 8,
  MIN_SET_HI: 14,
  /* Tuned by node sim.js --cases=10000, not by feel. Alibi and sighting are
     the two WEAK clue types (they cut 30 and 18 tuples of 1296); loading the
     pool with those raises the uniqueness rate and the minimal set size at
     the same time, which is exactly what the 4.8 gates ask for. */
  POOL: Object.freeze({
    alibi: 12, own: 6, access: 2, sight: 8, trace: 2, timeline: 4,
    wtrace: 3, motive: 3, pair: 3, negative: 4, sequence: 1, object: 4
  })
});

/* ---------------------------- difficulty ladder ----------------------------
   Three lengths of case. The knob is the CLUE MIX, not a multiplier: a short
   case gets strong clues (the stopped clock is allowed back in, more direct
   exclusions) so the proof collapses to five or so steps, and a long case gets
   the weak ones (alibis and sightings cut 30 and 18 tuples of 1296) so the
   proof spreads out. Action budget, noise and the reach bound follow the size
   of the proof. Every tier is swept and gated separately. */
var TIERS = {
  short: Object.freeze({
    key: "short", name: "Quick case", brief: "A short one. Fewer steps, fewer hours.",
    proof: "short", actions: 16, lo: 6, hi: 12, target: 9, noiseLo: 4, noiseHi: 8, reach: 12,
    press: 1, exact: true, roomSlots: 2,
    liar: Object.freeze({ actions: 20, lo: 12, hi: 21, target: 16, reach: 14, roomSlots: 3, noiseLo: 3, noiseHi: 7 }),
    pool: Object.freeze({
      alibi: 4, own: 6, access: 2, sight: 2, trace: 2, timeline: 4,
      wtrace: 4, motive: 2, pair: 0, negative: 4, sequence: 1, object: 8
    })
  }),
  standard: Object.freeze({
    key: "standard", name: "Standard case", brief: "The usual evening.",
    proof: "mid", actions: 20, lo: 8, hi: 14, target: 11, noiseLo: 6, noiseHi: 12, reach: 16,
    press: 2, exact: false, roomSlots: 2,
    liar: Object.freeze({ actions: 24, lo: 13, hi: 22, target: 18, reach: 16, roomSlots: 3, noiseLo: 4, noiseHi: 9 }),
    pool: Object.freeze({
      alibi: 12, own: 6, access: 2, sight: 8, trace: 2, timeline: 4,
      wtrace: 3, motive: 3, pair: 3, negative: 4, sequence: 1, object: 4
    })
  }),
  long: Object.freeze({
    key: "long", name: "Long case", brief: "A long night. More people, more talk.",
    proof: "long", actions: 25, lo: 10, hi: 17, target: 13, noiseLo: 6, noiseHi: 12, reach: 16,
    press: 2, exact: false, roomSlots: 3,
    liar: Object.freeze({ actions: 28, lo: 15, hi: 24, target: 20, reach: 16, roomSlots: 3, noiseLo: 4, noiseHi: 9 }),
    pool: Object.freeze({
      alibi: 20, own: 6, access: 2, sight: 16, trace: 2, timeline: 2,
      wtrace: 2, motive: 4, pair: 5, negative: 2, sequence: 1, object: 1
    })
  })
};
var TIER_KEYS = ["short", "standard", "long"];
function tierOf(key) { return TIERS[key] || TIERS.standard; }
/* tier plus liar resolved into one object, so nothing downstream has to ask
   twice what kind of case it is building */
function modeOf(tierKey, liar) {
  var t = tierOf(tierKey), L = t.liar;
  var M = {
    key: t.key, name: t.name, liar: !!liar, pool: t.pool, exact: t.exact, press: t.press, proof: t.proof,
    actions: t.actions, lo: t.lo, hi: t.hi, target: t.target, reach: t.reach,
    roomSlots: t.roomSlots, noiseLo: t.noiseLo, noiseHi: t.noiseHi
  };
  if (liar) {
    M.actions = L.actions; M.lo = L.lo; M.hi = L.hi; M.target = L.target;
    M.reach = L.reach; M.roomSlots = L.roomSlots; M.noiseLo = L.noiseLo; M.noiseHi = L.noiseHi;
  }
  return M;
}
function modeLabelOf(tierKey, liar) {
  return tierOf(tierKey).name + (liar ? " with a liar" : "");
}

/* ============================ 2. RNG ============================ */

function makeRNG(seed) {
  var a = seed >>> 0;
  var r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = function (n) { return Math.floor(r() * n); };
  r.range = function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); };
  r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
  r.shuffle = function (arr) {
    var a2 = arr.slice(), i, j, tmp;
    for (i = a2.length - 1; i > 0; i--) {
      j = Math.floor(r() * (i + 1)); tmp = a2[i]; a2[i] = a2[j]; a2[j] = tmp;
    }
    return a2;
  };
  r.weighted = function (pairs) {
    var total = 0, i, x;
    for (i = 0; i < pairs.length; i++) total += pairs[i][1];
    x = r() * total;
    for (i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
    return pairs[pairs.length - 1][0];
  };
  r.seed = seed >>> 0;
  return r;
}

function seedFromString(str) {
  var h = 0x811c9dc5, i;
  for (i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

function dailySeed(isoDate) { return seedFromString(isoDate + CONFIG.GAME_ID); }

/* ============================ 3. DATA ============================ */

var SUSPECTS = [
  { n: "Vance", tall: true,  staff: false, glasses: true  },
  { n: "Mira",  tall: false, staff: false, glasses: true  },
  { n: "Ellis", tall: true,  staff: true,  glasses: false },
  { n: "Odell", tall: false, staff: true,  glasses: false },
  { n: "Renna", tall: true,  staff: false, glasses: false },
  { n: "Marek", tall: false, staff: true,  glasses: true  }
];

var WEAPONS = [
  { n: "Letter Opener",     cls: "blade"  },
  { n: "Carving Knife",     cls: "blade"  },
  { n: "Iron Poker",        cls: "blunt"  },
  { n: "Brass Candlestick", cls: "blunt"  },
  { n: "Silk Cord",         cls: "cord"   },
  { n: "Bitter Tonic",      cls: "poison" }
];

var ROOMS = [
  { n: "Study",        staffOnly: false, adj: [4, 1],       sub: "ink"          },
  { n: "Library",      staffOnly: false, adj: [4, 0, 2],    sub: "paper dust"   },
  { n: "Conservatory", staffOnly: false, adj: [4, 1],       sub: "potting soil" },
  { n: "Cellar",       staffOnly: true,  adj: [5],          sub: "coal dust"    },
  { n: "Hall",         staffOnly: false, adj: [0, 1, 2, 5], sub: "floor wax"    },
  { n: "Kitchen",      staffOnly: true,  adj: [4, 3],       sub: "flour"        }
];

var TIMES = ["7pm", "8pm", "9pm", "10pm", "11pm", "midnight"];
var TIME_HEAD = ["7", "8", "9", "10", "11", "12"];
var ATTRS = ["tall", "staff", "glasses"];

// ---- COPY_START ----
var CLASSWORD = {
  blade: "a blade", blunt: "a blunt weight", cord: "a cord", poison: "poison"
};

var DESCS = {
  tall:    ["a small figure", "a tall figure"],
  glasses: ["a figure wearing no spectacles", "a figure in spectacles"],
  staff:   ["a figure in evening dress", "a figure in a service collar"]
};

var EVENTS = [
  "the dinner bell", "the second course", "the car in the drive",
  "the storm breaking", "the dog barking", "the last train",
  "the lamps going out", "the piano stopping"
];

var TITLE_NOUNS = ["Affair", "Question", "Business", "Matter", "Silence",
  "Hour", "Incident", "Problem", "Arrangement", "Debt"];
var TITLE_TIMEWORDS = ["Midnight", "Evening", "Late", "Quiet", "Long", "Last", "Cold"];

var BRIEF = [
  "One room. One hour. One hand.",
  "The killer used a weapon they own, or one kept in that room.",

var TPL = {

  ],

    case 1:  return !(c === p.s && t === p.t && r !== p.r);
    case 2:  return !(w === p.w && c !== p.s && r !== p.r);
    case 3:  return !(r === p.r && !SUSPECTS[c].staff);
    case 4:  return !(r === p.r && t === p.t && SUSPECTS[c][p.a] !== p.v);
    case 5:  return p.near
      ? (r === p.r || ROOMS[p.r].adj.indexOf(r) >= 0)
      : (r !== p.r && ROOMS[p.r].adj.indexOf(r) < 0);

      if (p.m === "not")    return t !== p.t;

function suiteGen(T, S, N) {
  N = N || 200;
  var rng = S.makeRNG(20260816), i, cs;
  var uniq = 0, retries = 0, sizes = [], motiveOnly = 0, reachBad = 0, textBad = 0;
  var trueOfTruth = 0, poolBad = 0, placeBad = 0, capBad = 0, pressBad = 0, minimalProves = 0;
  for (i = 0; i < N; i++) {
    cs = S.generateCase((rng.int(0x7ffffffe) + 1) >>> 0);
    if (!cs) continue;
    retries += cs.retries;
    var acc = S.solveMask(cs.pool, cs.masks);
    if (S.bitsCount(acc) === 1 && S.bitsFirst(acc) === S.tupleIndex(cs.truth)) uniq++;
    var mn = cs.minimal.map(function (id) { return cs.pool[id]; });
    var am = S.solveMask(mn, cs.masks);
    if (S.bitsCount(am) === 1 && S.bitsFirst(am) === S.tupleIndex(cs.truth)) minimalProves++;
    sizes.push(cs.minimal.length);
    if (S.isMotiveOnly(mn)) motiveOnly++;
    if (cs.minActions > S.CONFIG.REACH_BOUND) reachBad++;
    if (S.textSanity(cs).length) textBad++;
    var allTrue = true, j;
    for (j = 0; j < cs.pool.length; j++) if (!S.clueTrueOf(cs.pool[j], cs.truth)) allTrue = false;
    if (allTrue) trueOfTruth++;
    if (cs.pool.length < 30 || cs.pool.length > 60) poolBad++;
    for (j = 0; j < 6; j++) if (cs.place.rooms[j].length > S.CONFIG.ROOM_SLOTS) capBad++;
    if (cs.place.pressMinimal.length > S.CONFIG.MAX_PRESS_MINIMAL) pressBad++;
    // every minimal clue must actually be placed somewhere findable
    var placed = {}, ids = S.placedClueIds(cs);
    for (j = 0; j < ids.length; j++) placed[ids[j]] = 1;
    for (j = 0; j < cs.minimal.length; j++) if (!placed[cs.minimal[j]]) placeBad++;
    // a press gated minimal clue must be unlockable from a basic slot
    for (j = 0; j < cs.place.pressMinimal.length; j++) {
      var sus = cs.place.pressMinimal[j].s, opener = false, q, z;
      for (q = 0; q < 6; q++) {
        if (cs.place.ints[q] !== null && cs.pool[cs.place.ints[q]].ref.indexOf(sus) >= 0) opener = true;
        for (z = 0; z < cs.place.rooms[q].length; z++) if (cs.pool[cs.place.rooms[q][z]].ref.indexOf(sus) >= 0) opener = true;
      }
      if (!opener) pressBad++;
    }
  }
  T.eq("every generated case has exactly one solution", uniq, N);
  T.eq("the minimal set alone proves that solution", minimalProves, N);
  T.eq("every clue in the pool is true of the truth", trueOfTruth, N);
  T.assert("regeneration retry rate under 15 percent", retries / (retries + N) < 0.15,
    "rate " + (retries / (retries + N)).toFixed(4));
  sizes.sort(function (a, b) { return a - b; });
  var med = sizes[Math.floor(sizes.length / 2)];
  T.assert("minimal set median is about eleven", med >= 10 && med <= 12, "median " + med);
  var inBand = sizes.filter(function (x) { return x >= 8 && x <= 14; }).length;
  T.assert("minimal sets sit in eight to fourteen", inBand / N >= 0.93, "rate " + (inBand / N).toFixed(3));
  T.eq("no minimal set is motive only", motiveOnly, 0);
  T.eq("every minimal clue is reachable in budget", reachBad, 0);
  T.eq("no clue text contradicts the truth", textBad, 0);
  T.eq("clue pool size stays sane", poolBad, 0);
  T.eq("room slots never overfill", capBad, 0);
  T.eq("press gating stays inside its bound", pressBad, 0);
  T.eq("every minimal clue is placed somewhere", placeBad, 0);
  // the checkers themselves must be able to say yes
  T.assert("motive only checker fires on a motive only set",
    S.isMotiveOnly([clueOf(8, { k: "none", s: 1 }), clueOf(8, { k: "none", s: 2 })]));
  T.assert("motive only checker stays quiet on a mixed set",
    !S.isMotiveOnly([clueOf(8, { k: "none", s: 1 }), clueOf(6, { t: 2, m: "not" })]));
}

function suiteAgents(T, S) {

    if (gr.solved) g++;

  T.eq("perfect agent solves every case", p, n);
  T.eq("no agent ever spends over budget", over, 0);
}

function suiteStep(T, S) {
  var cs = S.generateCase(777), st = S.newGame(cs), r;
  T.eq("a fresh case starts with twenty actions", st.actionsLeft, 20);
  r = S.step(st, cs, { k: "search", r: 0 });

  r = S.step(st, cs, { k: "search", r: 0 });
  T.eq("searching twice is refused", st.actionsLeft, 19);
  T.eq("the refusal says why", r.events[0].e, "invalid");
  r = S.step(st, cs, { k: "interview", s: 0 });
  T.eq("an interview costs one action", st.actionsLeft, 18);
  r = S.step(st, cs, { k: "search", r: 99 });
  T.eq("a room that does not exist is refused", st.actionsLeft, 18);
  var locked = -1, i;
  for (i = 0; i < 6; i++) if (!S.pressUnlocked(cs, st, i)) locked = i;
  if (locked >= 0) {
    r = S.step(st, cs, { k: "press", s: locked });
    T.eq("a locked press costs nothing", st.actionsLeft, 18);
    T.eq("a locked press explains itself", r.events[0].why, "locked");
  } else { T.assert("a locked press costs nothing", true); T.assert("a locked press explains itself", true); }
  var open = -1;
  for (i = 0; i < 6; i++) if (S.pressUnlocked(cs, st, i) && st.pressed.indexOf(i) < 0) open = i;
  if (open >= 0) {
    var before = st.actionsLeft;
    S.step(st, cs, { k: "press", s: open });
    T.eq("an unlocked press costs two actions", st.actionsLeft, before - 2);
  } else T.assert("an unlocked press costs two actions", true);
  S.step(st, cs, { k: "mark", tab: "w", row: 1, col: 2, v: "n" });
  T.eq("marking is free", st.marks[S.markKey("w", 1, 2)], "n");
  var free = st.actionsLeft;
  S.step(st, cs, { k: "mark", tab: "zz", row: 1, col: 2, v: "n" });

  S.step(st, cs, { k: "mark", tab: "w", row: 1, col: 2, v: "" });
  T.eq("clearing a mark removes it", st.marks[S.markKey("w", 1, 2)], undefined);

  // stars
  T.eq("eight actions left is three stars", S.starsFor(8), 3);

  // winning

  T.eq("a correct accusation wins", w.status, "won");

  T.eq("a closed case refuses more actions", S.step(w, cs, { k: "search", r: 1 }).events[0].e, "invalid");

  // losing teaches
  var l = S.newGame(cs);
  var wrongC = (cs.truth.c + 1) % 6;
  S.step(l, cs, { k: "search", r: cs.truth.r });
  S.step(l, cs, { k: "accuse", c: wrongC, w: cs.truth.w, r: cs.truth.r, t: cs.truth.t });
  T.eq("a wrong accusation loses", l.status, "lost");

  var l2 = S.newGame(cs);

  T.assert("share string has no dash", !/[-]/.test(S.shareString(cs, w, true, 12)));
}

function suiteFuzz(T, S) {
  var rng = S.makeRNG(1010), cs = S.generateCase(24680), st = S.newGame(cs);
  var threw = null, negative = 0, badMark = 0, i, k;
  var kinds = ["search", "interview", "press", "mark", "accuse", "automark", "nonsense", null];
  for (i = 0; i < 5000; i++) {
    if (st.status !== "play") st = S.newGame(cs);
    var kind = kinds[rng.int(kinds.length)];
    var act;
    if (kind === null) act = null;
    else if (kind === "mark") act = { k: "mark", tab: rng.pick(["w", "r", "t", "zz", 7]), row: rng.int(9) - 1, col: rng.int(9) - 1, v: rng.pick(["y", "n", "q", "", "x", 3]) };
    else if (kind === "accuse") act = { k: "accuse", c: rng.int(9) - 1, w: rng.int(9) - 1, r: rng.int(9) - 1, t: rng.int(9) - 1 };
    else act = { k: kind, r: rng.int(9) - 1, s: rng.int(9) - 1 };
    try { S.step(st, cs, act); } catch (e) { if (!threw) threw = (act ? act.k : "null") + " " + e.message; }
    if (st.actionsLeft < 0) negative++;
    for (k in st.marks) if (!/^[wrt]:[0-5]:[0-5]$/.test(k) || ["y", "n", "q"].indexOf(st.marks[k]) < 0) badMark++;
  }
  T.eq("five thousand random actions throw nothing", threw, null);
  T.eq("actions left is never negative", negative, 0);
  T.eq("the board never holds an illegal mark", badMark, 0);
  T.assert("the candidate counter survives the fuzz", S.candidateCountFromMarks(st.marks) >= 0);
}

/* Regression assertions. Every one of these is a bug that actually happened
   during the build, kept as a permanent test rather than an anecdote. */
function suiteRegression(T, S) {
  // the greedy agent used to strand itself when no LIVE suspect could be
  // pressed: it had no legal action left, broke out early and guessed.
  var cs = S.generateCase(606060), rng = S.makeRNG(3), i, stalled = 0;
  for (i = 0; i < 40; i++) {
    var g = S.greedyAgent(S.generateCase((rng.int(0x7ffffffe) + 1) >>> 0), rng);
    if (g.actionsUsed < 8) stalled++;
  }
  T.le("the greedy agent does not strand itself early", stalled, 4);
  // clueSubjects once demanded that every trace clue name its substance, but
  // two of the six far phrasings do not mention it. The predicate only depends
  // on the room, so only the room is required.
  T.eq("a trace clue only has to name its room", S.clueSubjects(clueOf(5, { r: 3, near: false })).length, 1);
  // reinforcement clues must be true of the truth like any other clue
  var bad = 0;
  for (i = 0; i < 30; i++) {
    var c2 = S.generateCase((rng.int(0x7ffffffe) + 1) >>> 0), j;
    for (j = 0; j < c2.pool.length; j++) if (!S.clueTrueOf(c2.pool[j], c2.truth)) bad++;
  }
  T.eq("reinforcement never emits a false clue", bad, 0);
  // a room with one neighbour used to be able to trap a walk generator
  var rng2 = S.makeRNG(88), stuck = 0;
  for (i = 0; i < 60; i++) {
    var W = S.genWorld(rng2), s, t;
    for (s = 0; s < 6; s++) for (t = 0; t < 6; t++) if (!(W.loc[s][t] >= 0 && W.loc[s][t] < 6)) stuck++;
    for (s = 0; s < 6; s++) if (s !== W.truth.c && W.loc[s][W.truth.t] === W.truth.r) stuck++;
    if (W.loc[W.truth.c][W.truth.t] !== W.truth.r) stuck++;
    if (W.motive[W.truth.c] < 1) stuck++;
  }
  T.eq("the world always seats the killer alone at the hour", stuck, 0);
}

/* ---- unreliable narrators (HANDOFF 4.7) ---- */
function suiteLiar(T, S) {
  // the at most one violation set, on two clues with a known overlap
  var A = clueOf(12, { k: "room", r: 0 }), B = clueOf(6, { t: 0, m: "not" });
  A.id = 0; B.id = 1;
  var masks = [S.clueMask(A), S.clueMask(B)];
  T.eq("one clue alone leaves every tuple standing", S.bitsCount(S.liarMask([A], masks)), 1296);
  T.eq("two clues only exclude the tuples that break both",
    S.bitsCount(S.liarMask([A, B], masks)), 1296 - 36);
  T.eq("no clues means nothing is excluded", S.bitsCount(S.liarMask([], masks)), 1296);

  var rng = S.makeRNG(777), n = 24, i, j;
  var proved = 0, minProved = 0, noneConsistent = 0, oneFalse = 0, saidIt = 0, inProof = 0;
  var reachOk = 0, perfect = 0, truthAlwaysLive = 0, autoMarkSafe = 0, sourceOk = 0;
  for (i = 0; i < n; i++) {
    var cs = S.generateCase((rng.int(0x7ffffffe) + 1) >>> 0, { liar: true });
    if (!cs) continue;
    var ti = S.tupleIndex(cs.truth), M = S.modeOf(cs.tier, true);
    var mn = cs.minimal.map(function (id) { return cs.pool[id]; });
    if (S.liarProved(cs.pool, cs.masks, ti)) proved++;
    if (S.liarProved(mn, cs.masks, ti)) minProved++;
    if (S.bitsCount(S.solveMask(cs.pool, cs.masks)) === 0) noneConsistent++;
    var fal = S.falseClueIds(cs.pool, cs.truth);
    if (fal.length === 1 && fal[0] === cs.lie.id) oneFalse++;
    var src = S.clueSource(cs, cs.lie.id);
    if (src && src.kind === "said" && src.i === cs.lie.speaker) saidIt++;
    if (src) sourceOk++;
    if (cs.minimal.indexOf(cs.lie.id) >= 0) inProof++;
    if (cs.minActions <= M.reach) reachOk++;
    if (S.perfectAgent(cs).solved) perfect++;
    // the truth must survive every hand the player can hold, lie included
    var st = S.newGame(cs), live = true, k;
    for (k = 0; k < 6; k++) { S.step(st, cs, { k: "search", r: k }); S.step(st, cs, { k: "interview", s: k }); }
    if (!S.bitsGet(S.stateMask(cs, st, -1), ti)) live = false;
    if (live) truthAlwaysLive++;
    S.step(st, cs, { k: "automark" });
    var tr = cs.truth, safe = true;
    if (st.marks[S.markKey("w", tr.c, tr.w)] === "n") safe = false;
    if (st.marks[S.markKey("r", tr.c, tr.r)] === "n") safe = false;
    if (st.marks[S.markKey("t", tr.c, tr.t)] === "n") safe = false;
    if (safe) autoMarkSafe++;
  }
  T.eq("every liar case has one solution consistent with all but one clue", proved, n);
  T.eq("the minimal set alone still proves it", minProved, n);
  T.eq("no solution is consistent with all the clues", noneConsistent, n);
  T.eq("exactly one clue in the pool is false", oneFalse, n);
  T.eq("the lie is always something a person said", saidIt, n);
  T.eq("every placed clue has a source", sourceOk, n);
  T.eq("the lie is load bearing and stays in the proof", inProof, n);
  T.eq("a liar case is still reachable inside its budget", reachOk, n);
  T.eq("the perfect agent solves every liar case", perfect, n);
  T.eq("the truth is never crossed off by a lie", truthAlwaysLive, n);
  T.eq("auto mark never crosses the truth in a liar case", autoMarkSafe, n);
  // an honest case must contain no lie at all
  var honest = S.generateCase(4242);
  T.eq("an honest case has no false clue", S.falseClueIds(honest.pool, honest.truth).length, 0);
  T.assert("an honest case is not flagged as a liar case", !honest.liar);
  T.eq("text sanity accepts the one deliberate lie",
    S.textSanity(S.generateCase(31337, { liar: true })).length, 0);
  // the lie shapes themselves
  var rng2 = S.makeRNG(4242), shapes = {}, wrong = 0;
  for (i = 0; i < 200; i++) {
    var W = S.genWorld(rng2), lie = S.makeLie(W, rng2);
    if (!lie) { wrong++; continue; }
    if (S.clueTrueOf(lie, W.truth)) wrong++;
    if (!(lie.speaker >= 0 && lie.speaker < 6)) wrong++;
    shapes[lie.ty] = 1;
  }
  T.eq("every lie a factory makes is actually false", wrong, 0);
  T.ge("lies come in several shapes", Object.keys(shapes).length, 4);
  // a liar case resumes as a liar case
  var lc = S.generateCase(9182, { tier: "long", liar: true });
  var lst = S.newGame(lc);
  var ser = S.serializeState(lst);
  T.eq("a saved liar case remembers it is one", ser.liar, true);
  T.eq("a saved case remembers its tier", ser.tier, "long");
}

/* ---- the difficulty ladder ---- */
function suiteTiers(T, S) {
  T.eq("three tiers", S.TIER_KEYS.length, 3);
  T.assert("the ladder is ordered by budget",
    S.TIERS.short.actions < S.TIERS.standard.actions && S.TIERS.standard.actions < S.TIERS.long.actions);
  T.assert("the ladder is ordered by proof length",
    S.TIERS.short.target < S.TIERS.standard.target && S.TIERS.standard.target < S.TIERS.long.target);
  T.assert("a liar always costs more evening than an honest case of the same length",
    S.TIERS.standard.liar.actions > S.TIERS.standard.actions);
  T.eq("an unknown tier falls back to standard", S.tierOf("nonsense").key, "standard");
  T.eq("mode resolution takes the liar overrides", S.modeOf("standard", true).actions, S.TIERS.standard.liar.actions);
  T.eq("mode resolution leaves an honest case alone", S.modeOf("standard", false).actions, S.TIERS.standard.actions);
  T.assert("a liar case searches deeper rooms", S.modeOf("standard", true).roomSlots > S.modeOf("standard", false).roomSlots);
  var i, k, rng = S.makeRNG(31415);
  for (k = 0; k < S.TIER_KEYS.length; k++) {
    var key = S.TIER_KEYS[k], M = S.modeOf(key, false), n = 30;
    var inBand = 0, reachOk = 0, budgetOk = 0, unique = 0, sizes = [];
    for (i = 0; i < n; i++) {
      var cs = S.generateCase((rng.int(0x7ffffffe) + 1) >>> 0, { tier: key });
      if (!cs) continue;
      var acc = S.solveMask(cs.pool, cs.masks);
      if (S.bitsCount(acc) === 1 && S.bitsFirst(acc) === S.tupleIndex(cs.truth)) unique++;
      if (cs.minimal.length >= M.lo && cs.minimal.length <= M.hi) inBand++;
      if (cs.minActions <= M.reach) reachOk++;
      if (cs.actions === M.actions && S.newGame(cs).total === M.actions) budgetOk++;
      sizes.push(cs.minimal.length);
    }
    T.eq(key + " tier: every case has exactly one solution", unique, n);
    T.ge(key + " tier: proofs land in the band", inBand, Math.floor(n * 0.85));
    T.eq(key + " tier: every proof is reachable in budget", reachOk, n);
    T.eq(key + " tier: the budget follows the tier", budgetOk, n);
    sizes.sort(function (a, b) { return a - b; });
    var med = sizes[Math.floor(sizes.length / 2)];
    T.assert(key + " tier: median proof is near its target", Math.abs(med - M.target) <= 2, "median " + med);
  }
  // stars mean the same thing on every rung
  T.eq("three stars in a standard case", S.starsFor(8, 20), 3);
  T.eq("three stars in a short case", S.starsFor(Math.round(16 * 0.4), 16), 3);
  T.eq("one star when the evening is nearly gone", S.starsFor(1, 26), 1);
  T.eq("two stars in the middle", S.starsFor(6, 26), 2);
  T.eq("the old single argument form still works", S.starsFor(8), 3);
  // a tiered case is deterministic
  var a = S.generateCase(5150, { tier: "long", liar: true });
  var b = S.generateCase(5150, { tier: "long", liar: true });
  T.eq("same seed same tiered case", JSON.stringify(a.truth) + a.minimal.length, JSON.stringify(b.truth) + b.minimal.length);
  T.assert("a different mode on the same seed is a different case",
    S.generateCase(5150, { tier: "short" }).minimal.length !== a.minimal.length ||
    S.generateCase(5150, { tier: "short" }).pool.length !== a.pool.length);
}

  g += '<circle cx="17" cy="' + (top + hr) + '" r="' + hr + '" fill="#39414f"/>';
  g += '<path d="M17 ' + (top + hr * 2) + ' c-9 0 -12 6 -12 ' + (44 - top - hr * 2) +

/* the pocket watch: a budget you can see spend */
function watchSvg(left, total) {
  var frac = left / total, ang = -90 + (1 - frac) * 360;
  var rad = ang * Math.PI / 180, x = 26 + Math.cos(rad) * 15, y = 26 + Math.sin(rad) * 15;
  var col = left <= 4 ? "#e8c37a" : "#5ad1e6";
  var g = '<svg class="watch" viewBox="0 0 52 52" aria-hidden="true">';
  g += '<circle cx="26" cy="26" r="21" fill="#0f1218" stroke="#2a2f3b" stroke-width="2"/>';
  g += '<circle cx="26" cy="26" r="21" fill="none" stroke="' + col + '" stroke-width="2.5" ' +
       'stroke-dasharray="' + (frac * 131.9).toFixed(1) + ' 999" stroke-linecap="round" transform="rotate(-90 26 26)" opacity=".85"/>';
  for (var i = 0; i < 12; i++) {
    var a = i * 30 * Math.PI / 180;
    g += '<circle cx="' + (26 + Math.cos(a) * 16.5).toFixed(1) + '" cy="' + (26 + Math.sin(a) * 16.5).toFixed(1) + '" r="0.9" fill="#39414f"/>';
  }
  g += '<line x1="26" y1="26" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="2" stroke-linecap="round"/>';
  g += '<circle cx="26" cy="26" r="2" fill="' + col + '"/></svg>';
  return g;
}

/* ================== audio: A minor, sparse ================== */
var AUDIO = { ctx: null, master: null, bed: null, bedGain: null, on: true, vol: 0.7 };
var AMIN = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25];
function audioInit() {
  if (AUDIO.ctx || !AUDIO.on) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AUDIO.ctx = new AC();
    var comp = AUDIO.ctx.createDynamicsCompressor();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = AUDIO.vol;
    AUDIO.master.connect(comp); comp.connect(AUDIO.ctx.destination);
  } catch (e) { AUDIO.ctx = null; }
}
function pluck(freq, dur, type, gain) {
  if (!AUDIO.ctx || !AUDIO.on) return;
  try {
    var t = AUDIO.ctx.currentTime, o = AUDIO.ctx.createOscillator(), g = AUDIO.ctx.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.5));
    o.connect(g); g.connect(AUDIO.master); o.start(t); o.stop(t + (dur || 0.5) + 0.05);
  } catch (e) {}
}
function tick(edge) {
  if (!AUDIO.ctx || !AUDIO.on) return;
  try {
    var t = AUDIO.ctx.currentTime, b = AUDIO.ctx.createBufferSource(), g = AUDIO.ctx.createGain();
    var buf = AUDIO.ctx.createBuffer(1, 900, AUDIO.ctx.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < 900; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / 90);
    b.buffer = buf;
    var f = AUDIO.ctx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = edge ? 3200 : 1800; f.Q.value = 6;
    g.gain.value = edge ? 0.22 : 0.12;
    b.connect(f); f.connect(g); g.connect(AUDIO.master); b.start(t);
  } catch (e) {}
}
function pad(freqs, dur) {
  if (!AUDIO.ctx || !AUDIO.on) return;
  try {
    var t = AUDIO.ctx.currentTime, g = AUDIO.ctx.createGain(), f = AUDIO.ctx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(AUDIO.master);
    freqs.forEach(function (fr, i) {
      var o = AUDIO.ctx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = fr * (i ? 1.004 : 1);
      o.connect(f); o.start(t); o.stop(t + dur + 0.1);
    });
  } catch (e) {}
}
/* room tone: filtered noise that shifts with the room you are looking at */
function roomTone(idx) {
  audioInit();
  if (!AUDIO.ctx || !AUDIO.on) return;
  try {
    if (!AUDIO.bed) {
      var len = AUDIO.ctx.sampleRate * 2, buf = AUDIO.ctx.createBuffer(1, len, AUDIO.ctx.sampleRate);
      var d = buf.getChannelData(0), i;
      for (i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
      var src = AUDIO.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      AUDIO.bedF = AUDIO.ctx.createBiquadFilter();
      AUDIO.bedF.type = "bandpass"; AUDIO.bedF.Q.value = 1.4;
      AUDIO.bedGain = AUDIO.ctx.createGain(); AUDIO.bedGain.gain.value = 0.03;
      src.connect(AUDIO.bedF); AUDIO.bedF.connect(AUDIO.bedGain); AUDIO.bedGain.connect(AUDIO.master);
      src.start(); AUDIO.bed = src;
    }
    AUDIO.bedF.frequency.setTargetAtTime(140 + idx * 55, AUDIO.ctx.currentTime, 0.6);
  } catch (e) {}
}
function buzz(pat) {
  if (!APP || !APP.save.settings.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(pat); } catch (e) {}
}

/* ================== 8. SAVE (storage plumbing only) ================== */
function loadSave() {
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  return saveParse(raw);
}
function patchSave(patch) {
  var disk = loadSave();
  var next = saveMerge(disk, patch);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(next)); } catch (e) {}
  if (APP) APP.save = next;
  return next;
}

/* ================== boot state ================== */
function todayIso() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayNumber() { return Math.floor(Date.parse(todayIso() + "T00:00:00Z") / 86400000) - 20500; }

function startCase(seed, isDaily, keepResume) {
  var cs = generateCase(seed >>> 0);
  if (!cs) { cs = generateCase(1); }
  APP.cs = cs;
  APP.isDaily = !!isDaily;
  APP.st = newGame(cs);
  APP.selClue = -1;
  if (keepResume && keepResume.seed === cs.seed) APP.st = deserializeState(keepResume, cs);
  APP.counted = APP.st.status !== "play";
  render();
}

function persistResume() {
  if (!APP.cs) return;
  patchSave({ resume: APP.st.status === "play" ? serializeState(APP.st) : null });
}

/* ================== 7. INPUT ================== */
function doAction(act) {
  audioInit();
  var before = APP.st.found.length;
  var res = step(APP.st, APP.cs, act);
  var got = APP.st.found.length - before;
  var inv = res.events.filter(function (e) { return e.e === "invalid"; })[0];
  if (inv) { toast(invalidText(inv.why)); return; }
  tick(APP.st.actionsLeft <= 4);
  buzz(10);
  if (got > 0) { pluck(AMIN[1], 0.7); pluck(AMIN[5], 0.5, "sine", 0.08); }
  else toast(act.k === "search" ? UI.emptyRoom : UI.emptyTalk);
  persistResume();
  render();
}
function invalidText(why) {
  if (why === "locked") return UI.pressLock;
  if (why === "no actions left") return "The evening is gone.";
  if (why === "already searched") return "You have been through there.";
  if (why === "already spoken to") return "They have said their piece.";
  if (why === "already pressed") return "You have leaned on them once already.";
  return "Not that.";
}
function toast(msg) {
  var t = document.getElementById("toast");
  if (t) t.parentNode.removeChild(t);
  t = el("div", "toast", msg); t.id = "toast";
  document.body.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
}
function overlay(build) {
  var o = document.getElementById("ov");
  if (o) o.parentNode.removeChild(o);
  o = el("div", "ov fade"); o.id = "ov";
  var box = el("div", "ovbox");
  build(box, function () { if (o.parentNode) o.parentNode.removeChild(o); });
  o.appendChild(box);
  document.body.appendChild(o);
}

  var sel = { c: -1, w: -1, r: -1, t: -1 };
  overlay(function (box, close) {
    function draw() {
      clear(box);
      box.appendChild(el("h3", null, UI.accuse));
      [["c", UI.whoDidIt, SUSPECTS.map(function (x) { return x.n; })],
       ["w", UI.withWhat, WEAPONS.map(function (x) { return x.n; })],

function recordResult() {
  var won = APP.st.status === "won";
  var moves = actionsUsed(APP.st);
  var patch = {
    addStats: { cases: 1, solved: won ? 1 : 0, lost: won ? 0 : 1, stars: APP.st.stars },
    maxStats: { bestStars: APP.st.stars },
    archive: { seed: APP.cs.seed, title: APP.cs.title, won: won, moves: moves, stars: APP.st.stars },
    resume: null
  };
  if (won) patch.bestLow = { fewestActions: moves };
  if (won && APP.isDaily) {
    var s = loadSave(), y = new Date(Date.now() - 86400000);
    var yIso = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
    if (s.stats.lastDaily !== todayIso()) {
      patch.setStats = { dailyStreak: (s.stats.lastDaily === yIso ? s.stats.dailyStreak + 1 : 1), lastDaily: todayIso() };
    }
  }
  patchSave(patch);
}

  var url = location.origin + location.pathname + "?seed=" + APP.cs.seed;
  var full = txt.replace("?seed=" + APP.cs.seed, url);
  try {
    if (navigator.share) { navigator.share({ text: full }); return; }
  } catch (e) {}
  try {
    if (navigator.clipboard) { navigator.clipboard.writeText(full); toast(UI.copied); return; }
  } catch (e) {}
  toast(full);
}

function newRandomCase() {
  APP.revealShown = false;
  APP.sessionRng = APP.sessionRng || makeRNG((Date.now() ^ 0x5bd1e6) >>> 0);
  startCase((APP.sessionRng.int(0x7ffffffe) + 1) >>> 0, false, null);
  APP.tab = "case";
  render();
}

function openOptions() {
  overlay(function (box, close) {
    function draw() {
      clear(box);
      box.appendChild(el("h3", null, UI.options));
      var s = APP.save.settings;
      [["sound", UI.sound], ["haptics", UI.haptics], ["autoMark", UI.autoMark],
       ["typewriter", UI.typewriter], ["reduceMotion", UI.motion]].forEach(function (o) {
        var row = el("div", "optrow");
        row.appendChild(el("span", null, o[1]));
        var b = el("button", "sw" + (s[o[0]] ? " on" : ""), s[o[0]] ? UI.on : UI.off);
        b.onclick = function () {
          var patch = {}; patch[o[0]] = !s[o[0]];
          patchSave({ settings: patch });
          AUDIO.on = APP.save.settings.sound;
          if (o[0] === "autoMark" && patch[o[0]]) { step(APP.st, APP.cs, { k: "automark" }); persistResume(); }
          draw();
        };
        row.appendChild(b);
        box.appendChild(row);
      });
      var st = APP.save.stats;
      box.appendChild(el("h2", null, "Record"));
      box.appendChild(el("div", "dz", st.solved + " solved of " + st.cases + ", streak " + st.dailyStreak));
      var cn = el("button", "wide sec", UI.cancel);
      cn.onclick = close;
      box.appendChild(cn);
    }
    draw();
  });
}

/* ===== Sky Wolf Studios embed protocol ===== */
(function () {
  var framed = false;
  try { framed = window.parent !== window; } catch (e) { framed = true; }
  window.SWS_EXIT = function () {
    if (framed) { try { parent.postMessage({ sws: "close" }, "*"); } catch (e) {} return; }
    if (document.referrer.indexOf("/portal") >= 0 && history.length > 1) { history.back(); }
    else { location.replace("https://lucidwinds.com/portal/"); }
  };
  if (framed) {
    try { parent.postMessage({ sws: "ready" }, "*"); } catch (e) {}
    window.addEventListener("load", function () {
      try { parent.postMessage({ sws: "ready" }, "*"); } catch (e) {}
    });
  }
})();

/* ================== 10. BOOT ================== */
function boot() {
  var save = loadSave();
  APP = { save: save, tab: "case", boardTab: "w", selClue: -1, revealShown: false, cs: null, st: null };
  AUDIO.on = save.settings.sound;
  AUDIO.vol = save.settings.volume;

  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    var p = kv.split("="); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || "");
  });

  var seed, isDaily = false;
  if (q.seed && /^\d+$/.test(q.seed)) seed = parseInt(q.seed, 10) >>> 0;
  else { seed = dailySeed(todayIso()); isDaily = true; }

  startCase(seed, isDaily, save.resume && save.resume.seed === seed ? save.resume : null);

  document.addEventListener("visibilitychange", function () { if (document.hidden) persistResume(); });
  window.addEventListener("pagehide", persistResume);
  document.addEventListener("pointerdown", function once() {
    audioInit();
    document.removeEventListener("pointerdown", once);
  });

  window.__TEST__ = buildTests(window);
  if (location.search.indexOf("test=1") >= 0) {
    var T = window.__TEST__;
    T.run();
    var rep = T.report();
    var panel = el("div", "ov");
    var box = el("div", "ovbox");
    box.appendChild(el("h3", null, "PASSED " + rep.passed + " / FAILED " + rep.failed));
    box.appendChild(el("div", "dz", "total assertions " + rep.total));
    rep.failures.slice(0, 40).forEach(function (f) {
      box.appendChild(el("div", "stamp", f.name + "   " + (f.detail || "")));
    });
    var cn = el("button", "wide sec", "Close");
    cn.onclick = function () { panel.parentNode.removeChild(panel); };
    box.appendChild(cn);
    panel.appendChild(box);
    document.body.appendChild(panel);
  }

  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=1").catch(function () {});
    }
  } catch (e) {}
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
