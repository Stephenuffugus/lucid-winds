<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Create-A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a4a;--bg:#fff6e9;--pink:#ff5d73;--blue:#4d96ff;--green:#6bcb77;--yellow:#ffd93d;--purple:#9b5de5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:8px 12px;transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.4}
input,textarea{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;user-select:text;-webkit-user-select:text;width:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#home{overflow-y:auto;padding:18px 16px 40px;background:radial-gradient(circle at 12% 8%,#ffe3ec 0 60px,transparent 61px),radial-gradient(circle at 90% 20%,#dff3ff 0 80px,transparent 81px),radial-gradient(circle at 80% 85%,#e6ffe0 0 90px,transparent 91px),var(--bg)}
.logo{font-size:52px;font-weight:800;text-align:center;line-height:1;margin:10px 0 0;letter-spacing:1px}
.logo span{display:inline-block;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;font-weight:500;font-size:18px;margin:6px 0 16px}
h2{font-size:22px;margin:22px 0 8px}
#modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.55);border-radius:22px}
.mode .em{font-size:40px;text-shadow:none}
.addmode{background:#fff;color:var(--ink);text-shadow:none;border-style:dashed}
#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cre{padding:6px;display:flex;flex-direction:column;align-items:center;font-size:14px;position:relative;overflow:hidden}
.cre canvas{width:100%;aspect-ratio:1}
.cre .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cre .bd{position:absolute;top:2px;right:4px;font-size:16px}
.empty{font-weight:500;opacity:.7;grid-column:1/-1;text-align:center;padding:10px}
.wide{width:100%;margin-top:14px;font-size:17px}
.top{display:flex;gap:8px;align-items:center;padding:8px 10px;flex:none}
.top button{padding:4px 12px;font-size:20px;flex:none}
.top .ttl{flex:1;font-size:21px;line-height:1.1}
.top input{flex:1;min-width:0;padding:4px 12px;font-size:18px}
.row{display:flex;gap:6px;padding:0 10px;overflow-x:auto;flex:none;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tabs button{flex:1;padding:3px 3px;font-size:13.5px;border-radius:12px 12px 0 0;box-shadow:none;border-bottom:none;background:#efe7f7;white-space:nowrap}
.tabs button.on{background:#fff}
.grid{flex:1;overflow-y:auto;background:#fff;border-top:3px solid var(--ink);padding:10px;display:grid;gap:10px;align-content:start}
/* picker + mix */
#pgrid{grid-template-columns:repeat(3,1fr)}
.card{padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;font-size:15px;position:relative;line-height:1.15;box-shadow:0 3px 0 var(--ink)}
.card canvas{width:100%;aspect-ratio:1}
.card.on{background:#fff3b8;outline:3px solid var(--ink);outline-offset:1px}
.card .num{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid var(--ink);font-size:14px;line-height:20px;text-align:center}
.card small{font-weight:500;font-size:12px;opacity:.8}
.foot{display:flex;gap:8px;padding:8px 10px 12px;border-top:3px solid var(--ink);background:#fff;flex:none;align-items:center}
.foot .chips{flex:1;display:flex;gap:4px;align-items:center;font-size:14px;font-weight:500;min-width:0}
.foot .chips canvas{width:44px;height:44px;flex:none}
.foot button{font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5)}
#mgrid{grid-template-columns:1fr 1fr}
#mgrid .card{font-size:17px}
.big{font-size:70px;line-height:1.5}
#mpicks{align-items:center;padding-bottom:8px;font-size:15px}
#mpicks canvas{width:46px;height:46px;flex:none}
#mpicks button{margin-left:auto;padding:2px 10px;font-size:15px;flex:none}
/* workshop */
#editor{background:var(--bg)}
#saved{font-size:13px;color:#2a9d5b;opacity:0;transition:opacity .3s;flex:none;width:48px;text-align:center}
#saved.show{opacity:1}
#stage{flex:none;align-self:center;width:min(calc(100vw - 20px),37vh);aspect-ratio:1;border:3px solid var(--ink);border-radius:22px;background:radial-gradient(circle at 50% 35%,#fff 0,#e8f6ff 60%,#d5ecff 100%);box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
#ed{width:100%;height:100%;touch-action:none;display:block}
#stage button{position:absolute;padding:0 10px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
#remix{left:6px;top:6px}
#szm{right:50px;bottom:8px}#szp{right:6px;bottom:8px}
#szl{position:absolute;right:8px;bottom:40px;font-size:13px;font-weight:500;opacity:.7}
#powers{padding:8px 10px;align-items:center;font-size:14px}
#powers span{flex:none;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 9px;white-space:nowrap}
#powers span.st{background:var(--yellow)}
#tray{grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
#tray .card{font-size:12.5px}
.sw3{display:flex;width:100%;aspect-ratio:1;align-items:center;justify-content:center;gap:3px;font-size:30px}
.sw3 i{width:26%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink)}
#actions{display:flex;gap:8px;padding:8px 10px 12px;border-top:3px solid var(--ink);background:#fff;flex:none}
#actions button{flex:1;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5)}
/* play */
#play{background:#bfe8a8}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:17px}
#hud button{pointer-events:auto;padding:2px 12px;font-size:20px}
#hudL{background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:14px;padding:2px 10px;max-width:80%}
#pbar{position:absolute;left:10px;right:10px;bottom:14px;display:none;flex-direction:column;gap:8px}
#tip{background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;font-size:15px;font-weight:500;text-align:center}
#pbar .b{display:flex;gap:8px}
#pbar button{flex:1;font-size:18px}
#modal{position:fixed;inset:0;background:rgba(59,42,74,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
#mbox{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;text-align:center}
#mbox h3{margin:0 0 8px;font-size:24px}
#mbox p{font-weight:500;margin:6px 0}
#mbox .b{display:flex;gap:8px;margin-top:12px}
#mbox .b button{flex:1}
.pick{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px}
.pick button{flex:none;width:64px;height:64px;padding:2px;font-size:28px}
.pick button.on{background:var(--yellow)}
.pick canvas{width:100%;height:100%}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.grid6 button{padding:2px 0;font-size:22px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
.grid6 button.on{background:var(--yellow)}
.sw{flex:none;width:36px!important;height:36px!important;border-radius:50%;padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
#mbox img{width:236px;height:auto}
#spBtn{position:absolute;right:14px;bottom:150px;width:78px;height:78px;border-radius:50%;font-size:34px;padding:0;background:var(--yellow);display:none}
#mbox textarea{height:74px;font-size:12px;font-weight:500;word-break:break-all;resize:none}
.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="home" class="screen on">
  <div class="logo" id="logo"></div>
  <div class="sub">Mix anything with anything!</div>
  <div id="modes"></div>
  <h2>My Creations</h2>
  <div id="gallery"></div>
  <button class="wide" id="addFriend">💌 Add a friend's creation</button>
  <button class="wide" id="pediaBtn">📖 Mixipedia</button>
</div>

<div id="pick" class="screen">
  <div class="top"><button id="pBack">←</button><div class="ttl" id="pTtl">Pick up to 3 things to mix!</div></div>
  <div class="row tabs" id="ptabs"></div>
  <div class="grid" id="pgrid"></div>
  <div class="foot"><div class="chips" id="pchips"></div><button id="pGo" class="go">Mix!</button></div>
</div>

<div id="mix" class="screen">
  <div class="top"><button id="mBack">←</button><div class="ttl">How should they mix?</div></div>
  <div class="row" id="mpicks"></div>
  <div class="grid" id="mgrid"></div>
</div>

<div id="editor" class="screen">
  <div class="top">
    <button id="back">←</button>
    <input id="name" maxlength="18" placeholder="Name it!">
    <button id="reName">🎲</button>
    <span id="saved">Saved ✓</span>
    <button id="del">🗑</button>
  </div>
  <div id="stage"><canvas id="ed" width="600" height="600"></canvas>
    <button id="remix">🔀 Remix</button><span id="szl"></span><button id="szm">➖</button><button id="szp">➕</button></div>
  <div class="row" id="powers"></div>
  <div class="row tabs" id="slots"></div>
  <div class="grid" id="tray"></div>
  <div id="actions">
    <button id="bTest" style="background:var(--blue)">🧪 Test</button>
    <button id="bBattle" style="background:var(--pink)">⚔️ Battle</button>
    <button id="bShare" style="background:var(--purple)">💌 Share</button>
  </div>
</div>

<div id="play" class="screen">
  <canvas id="game"></canvas>
  <button id="spBtn">✨</button>
  <div id="hud"><div id="hudL"></div><button id="quit">✕</button></div>
  <div id="pbar"><div id="tip"></div><div class="b"><button id="pAdd">🔧 Change it</button><button id="pBattle" style="background:var(--pink);color:#fff">⚔️ Battle</button></div></div>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
function h(parent,tag,text,cls){const e=el(tag,cls);if(text!=null)e.textContent=text;parent.append(e);return e}
const INK='#3b2a4a';
const COLORS=['#ff5d73','#ff9f43','#ffd93d','#6bcb77','#2ec4b6','#4d96ff','#9b5de5','#f15bb5'];
const MODES=[
 {id:'animal',name:'Animal',emoji:'🐶',color:'#6bcb77',cat:'animal',fight:true},
 {id:'food',name:'Food',emoji:'🍩',color:'#ff9f43',cat:'food',fight:false},
 {id:'object',name:'Object',emoji:'🤖',color:'#4d96ff',cat:'object',fight:false}];

/* ================= drawing helpers ================= */
const PC={};const P=d=>PC[d]||(PC[d]=new Path2D(d));
function F(c,d,f,ns){const p=P(d);if(f){c.fillStyle=f;c.fill(p)}if(!ns)c.stroke(p)}
function E(c,x,y,rx,ry,f,rot,ns){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);if(f){c.fillStyle=f;c.fill()}if(!ns)c.stroke()}
const rrp=(x,y,w,h,r)=>`M${x+r},${y} h${w-2*r} a${r},${r} 0 0 1 ${r},${r} v${h-2*r} a${r},${r} 0 0 1 ${-r},${r} h${-(w-2*r)} a${r},${r} 0 0 1 ${-r},${-r} v${-(h-2*r)} a${r},${r} 0 0 1 ${r},${-r}Z`;
const ep=(x,y,rx,ry)=>`M${x-rx},${y} a${rx},${ry} 0 1 0 ${2*rx},0 a${rx},${ry} 0 1 0 ${-2*rx},0Z`;
const pear=(w,h)=>`M0,${-h} C${w*1.05},${-h} ${w*1.35},${h} 0,${h} C${-w*1.35},${h} ${-w*1.05},${-h} 0,${-h}Z`;
function R(c,x,y,w,hh,r,f,ns){F(c,r?rrp(x,y,w,hh,r):`M${x},${y} h${w} v${hh} h${-w}Z`,f,ns)}
function Ln(c,d,col,w){c.save();c.strokeStyle=col||INK;c.lineWidth=w||2.5;c.stroke(P(d));c.restore()}
function tube(c,d,col,w){Ln(c,d,INK,w+6);Ln(c,d,col,w)}
function both(c,fn){fn();c.save();c.scale(-1,1);fn();c.restore()}
function eyes(c,dx,y,r,a,white){
 if(a&&a.blink){both(c,()=>Ln(c,`M${-dx-r},${y} q${r},${r*.9} ${2*r},0`));return}
 [-dx,dx].forEach(x=>{if(white)E(c,x,y,r*1.75,r*1.75,'#fff');E(c,x,y,r,r*1.15,INK,0,1);E(c,x-r*.3,y-r*.4,r*.4,r*.4,'#fff',0,1)});
}
const cheeks=(c,dx,y)=>both(c,()=>E(c,-dx,y,6,4,'rgba(255,110,150,.55)',0,1));
const smile=(c,y,w)=>Ln(c,`M${-w},${y} Q0,${y+w} ${w},${y}`);
function sh(hex,f){const n=parseInt(hex.slice(1),16),t=f<0?0:255,k=Math.abs(f);const ch=s=>Math.round(((n>>s)&255)*(1-k)+t*k);return '#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1)}
function mixHex(l){let r=0,g=0,b=0;l.forEach(x=>{const n=parseInt(x.slice(1),16);r+=n>>16;g+=(n>>8)&255;b+=n&255});const k=l.length;return '#'+((1<<24)|(Math.round(r/k)<<16)|(Math.round(g/k)<<8)|Math.round(b/k)).toString(16).slice(1)}
const RB=['#ff5d73','#ffd93d','#6bcb77','#4d96ff','#9b5de5'];
const starP=(x,y,r)=>{let s='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;s+=(i?'L':'M')+(x+Math.cos(a)*q).toFixed(1)+','+(y+Math.sin(a)*q).toFixed(1)}return s+'Z'};
const STARS=[starP(-16,-12,9),starP(16,4,8),starP(-6,20,7)];
function sprinkles(c){[[-24,-18,.5,0],[2,-26,-.6,3],[24,-10,1,1],[-12,2,-.3,2],[16,14,.8,4],[-28,20,1.2,0],[0,26,.2,3],[30,-28,-.9,2],[-32,-2,.9,4]].forEach(s=>{c.save();c.translate(s[0],s[1]);c.rotate(s[2]);Ln(c,'M-5,0 h10',RB[s[3]],4.5);c.restore()})}
const paw=(c,p)=>{R(c,-9,-8,18,28,8,p.a);E(c,-2,22,13,8,p.a);Ln(c,'M-7,22 v5 M-1,23 v5',INK,2)};
const drip=col=>(c,p)=>F(c,'M-7,-8 Q-9,18 -4,26 Q0,32 4,26 Q9,18 7,-8Z',col||p.a);
const cord=(c,p)=>{tube(c,'M0,0 Q18,14 26,-4 Q30,-16 22,-22','#4a4f66',4);R(c,14,-36,16,13,3,'#dfe7ef');Ln(c,'M19,-36 v-7 M25,-36 v-7',INK,3)};
function flame(c,a,s){c.save();const k=1+Math.sin((a.t||0)*22)*.12;c.scale(s*k,s*(2-k));F(c,'M0,-10 Q20,-24 36,-6 Q25,-4 31,10 Q12,13 0,8Z','#ff7b2e');F(c,'M2,-4 Q14,-11 23,-2 Q15,0 17,6 Q8,7 2,4Z','#ffd93d',1);c.restore()}
const A=(k,ch,dmg,rate,x)=>Object.assign({k:k,ch:ch,dmg:dmg,rate:rate},x||{});

/* ================= the things you can mix ================= */
const T={
cat:{n:'Cat',cat:'animal',nm:['Cat','cat'],p:{a:'#f6a04d',b:'#fff1dc',c:'#ff8fa3'},
 head:{pw:'Scratch',atk:A('bite','💢',2,.45),d(c,p,a){both(c,()=>{F(c,'M-41,-10 L-37,-58 L-8,-33Z',p.a);F(c,'M-34,-22 L-33,-47 L-17,-33Z',p.c,1)});E(c,0,0,44,37,p.a);E(c,0,13,21,14,p.b,0,1);eyes(c,17,-4,6,a);F(c,'M-5,7 L5,7 L0,13Z',p.c);Ln(c,'M0,13 Q-6,21 -12,16 M0,13 Q6,21 12,16');Ln(c,'M-26,10 L-52,6 M-26,15 L-52,19 M26,10 L52,6 M26,15 L52,19',INK,2)}},
 body:{w:36,h:40,hp:3},legs:{pw:'Sneaky Paws',spd:4,d:paw},
 tail:{pw:'Quick Tail',spd:1,d(c,p){tube(c,'M0,0 Q32,8 34,-22 Q35,-40 20,-44',p.a,9)}},
 pat:{pw:'Tabby Stripes',pow:1,d(c,p){Ln(c,'M-44,-14 L-18,-8 M-46,4 L-20,6 M-44,22 L-20,20 M44,-14 L18,-8 M46,4 L20,6 M44,22 L20,20',sh(p.a,-.28),6)}}},
dog:{n:'Dog',cat:'animal',nm:['Dog','dog'],p:{a:'#c98a55',b:'#f7e2c4',c:'#7a4a2a'},
 head:{pw:'Big Bark',atk:A('shot','🔊',1,.5,{pierce:1}),d(c,p,a){both(c,()=>F(c,'M-32,-28 Q-60,-30 -56,8 Q-52,28 -38,6Z',p.c));E(c,0,0,42,38,p.a);E(c,0,13,20,15,p.b,0,1);eyes(c,16,-6,6,a);E(c,0,6,8,6,INK,0,1);F(c,'M-5,21 Q0,37 5,21Z','#ff8fa3');Ln(c,'M0,12 v6 M-9,18 Q0,26 9,18')}},
 body:{w:38,h:40,hp:4},legs:{pw:'Zoomies',spd:4,d:paw},
 tail:{pw:'Happy Wag',hp:1,d(c,p){tube(c,'M0,0 Q20,-4 22,-30',p.a,9)}},
 pat:{pw:'Lucky Patch',hp:1,d(c,p){E(c,18,-14,20,18,p.c,0,1);E(c,-22,22,12,10,p.c,0,1)}}},
bunny:{n:'Bunny',cat:'animal',nm:['Bun','unny'],p:{a:'#f3ece6',b:'#ffffff',c:'#ffb3c7'},
 head:{pw:'Carrot Toss',atk:A('shot','🥕',1,.4),d(c,p,a){both(c,()=>{E(c,-17,-60,12,32,p.a,-.14);E(c,-17,-58,6,22,p.c,-.14,1)});E(c,0,0,40,36,p.a);eyes(c,15,-4,6,a);F(c,'M-4,6 L4,6 L0,11Z',p.c);R(c,-6,15,12,10,2,'#fff');Ln(c,'M0,11 v14',INK,1.5);cheeks(c,25,9)}},
 body:{w:34,h:38,hp:3},legs:{pw:'Super Hop',spd:4,hop:1,d:paw},
 tail:{pw:'Fluff Ball',hp:1,d(c){E(c,12,0,13,12,'#fff')}}},
lion:{n:'Lion',cat:'animal',nm:['Li','ion'],p:{a:'#f5c04a',b:'#fde9b0',c:'#b5651d'},
 head:{pw:'ROAR',atk:A('shot','💥',2,.8,{pierce:1}),d(c,p,a){for(let i=0;i<12;i++)E(c,Math.cos(i*.524)*43,Math.sin(i*.524)*43,17,17,p.c);both(c,()=>E(c,-30,-30,11,11,p.a));E(c,0,0,38,36,p.a);E(c,0,13,18,13,p.b,0,1);eyes(c,15,-5,5.5,a);F(c,'M-6,6 L6,6 L0,13Z',p.c);Ln(c,'M0,13 Q-6,21 -12,16 M0,13 Q6,21 12,16')}},
 body:{w:42,h:42,hp:5},legs:{pw:'Pounce Paws',spd:4,d:paw},

const ALLCOMBOS=SPECIALS.map(s=>[s[0],s[1]]).concat(Object.keys(ELS).map(k=>[ELS[k].m,'4 or more '+ELS[k].i+' '+ELS[k].n+' parts, from different things']));
const ALLSAYS=['OW! It bit me back!! 😱','SPICY!! 🔥🥵','Brain freeze!! 🥶','Crunchy… is this METAL?! 😝','It\'s… furry? 😳 But yummy!','So yummy! 😋','Wheee! It\'s so fast! 💨','It flies!! ☁️','Boing boing boing! 🤸','It\'s ALIVE!! 😱💖','I love it! 💖'];
function discover(cr){const f=S.found;SLOTS.forEach(k=>{if(cr.parts[k])f.things[cr.parts[k]]=1});combos(cr).forEach(x=>{if(!f.combos[x.n]){f.combos[x.n]=1;toast('New combo: ⭐ '+x.n+'!');beep(880,.25)}})}
function kit(cr){
 const g=k=>has(cr.parts[k],k)?T[cr.parts[k]][k]:null,hd=g('head'),bd=g('body')||T.cat.body,lg=g('legs'),tl=g('tail'),bk=g('back'),pt=g('pat');
 let hp=bd.hp,spd=lg?lg.spd:1,pow=0;[tl,bk,pt].forEach(x=>{if(x){hp+=x.hp||0;spd+=x.spd||0;pow+=x.pow||0}});const list=[];
 if(hd)list.push('💥 '+hd.pw);if(tl)list.push((tl.sp?'✨ ':'')+tl.pw);if(bk)list.push(bk.pw);if(lg)list.push((lg.hop?'🦘 ':'')+lg.pw);if(pt)list.push(pt.pw);
 const cb=combos(cr);cb.forEach(x=>{hp+=x.b.hp||0;spd+=x.b.spd||0;pow+=x.b.pow||0});
 return{hp:Math.min(12,hp),spd:Math.min(9,spd),pow:pow,atk:hd?hd.atk:A('bite','💢',1,.6),sp:tl&&tl.sp?tl:null,hop:!!(lg&&lg.hop),list:list,cb:cb,el:elOf(cr),shield:!!(bk&&bk.shield)};
}
function partInfo(k,d){
 if(k==='head')return '💥'+d.atk.dmg+(d.atk.fx==='burn'?' 🔥':d.atk.fx==='slow'?' ❄️':d.atk.pierce?' ➡️':d.atk.k==='bite'?' 🦷':'');

}

function enc(cr){const m=modeOf(cr.m),builtin=MODES.some(x=>x.id===cr.m);
 return 'CA2.'+btoa(unescape(encodeURIComponent(JSON.stringify({n:cr.n,m:builtin?cr.m:{id:m.id,name:m.name,emoji:m.emoji,color:m.color,f:m.fight===false?0:1},k:cr.picks,p:cr.parts,c:cr.col,z:cr.sz}))))}
function dec(code){
 const i=code.indexOf('CA2.');if(i<0)throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(i+4).replace(/\s/g,'')))));let mid;
 if(typeof o.m==='string')mid=MODES.some(x=>x.id===o.m)?o.m:'animal';
 else{const id='c'+String(o.m.id||'x').replace(/[^a-z0-9]/gi,'').slice(0,16);mid=id;if(!S.modes.some(x=>x.id===id))S.modes.push({id:id,name:String(o.m.name||'Mystery').slice(0,14),emoji:String(o.m.emoji||'✨').slice(0,8),color:/^#[0-9a-f]{6}$/i.test(o.m.color)?o.m.color:'#9b5de5',fight:o.m.f!==0})}
 const parts={},sz={};SLOTS.forEach(k=>{const id=o.p&&o.p[k];parts[k]=has(id,k)?id:null;const z=+(o.z&&o.z[k]);if(isFinite(z)&&z)sz[k]=Math.max(.7,Math.min(1.4,z))});
 if(!parts.body)parts.body='cat';let picks=(Array.isArray(o.k)?o.k:[]).filter(x=>T[x]).slice(0,3);if(!picks.length)picks=[parts.body];
 const col=o.c==='blend'||T[o.c]?o.c:'own';
 return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),m:mid,n:String(o.n||'').slice(0,18),picks:picks,parts:parts,col:col,sz:sz,best:0,fr:1};
}

const gv=$('#game'),gc=gv.getContext('2d');let G=null,W=0,H=0;
function fit(){const d=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;gv.width=W*d;gv.height=H*d;gc.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',()=>{if(G)fit()});
function genRival(mid){const cat=modeOf(mid).cat,pool=IDS.filter(id=>!cat||T[id].cat===cat),a=rnd(pool),b=rnd(pool);return Object.assign(a===b?pure(a):rnd(MANNERS).f([a,b]),{sz:{}})}
function startPlay(kind,cr,buddy,ex){
 show('play');fit();const k=kit(cr),notes=[];
 if(ex&&ex.snack){const sk=kit(ex.snack),add=Math.min(3,Math.ceil(sk.hp/3));k.hp=Math.min(12,k.hp+add);let t='+'+add+'❤️';if(!k.atk.fx&&(sk.el==='fire'||sk.el==='ice')){k.atk=Object.assign({},k.atk,{fx:sk.el==='fire'?'burn':'slow'});t+=sk.el==='fire'?' and fire attacks 🔥':' and freezing attacks ❄️'}notes.push('Ate '+nameOf(ex.snack)+': '+t)}
 if(ex&&ex.gear){const gk=kit(ex.gear),add=Math.min(3,Math.ceil(gk.spd/2));k.spd=Math.min(10,k.spd+add);if(gk.hop)k.hop=true;notes.push('Riding '+nameOf(ex.gear)+': +'+add+'💨'+(gk.hop?' and hops 🦘':''))}
 G={kind:kind,cr:cr,k:k,p:{x:W/2,y:H*.62,tx:W/2,ty:H*.62,hp:k.hp,inv:0,face:1,cd:.4,sp:.6,sh:k.shield?1:0,hopT:2,walk:0,z:0,vz:0,mv:0},
  bud:buddy?{cr:buddy,k:kit(buddy),x:W/2-60,y:H*.62+30,cd:.8,walk:0}:null,
  en:[],sh:[],fx:[],pk:[],q:[],qt:0,wave:0,gap:1,banner:null,shake:0,last:0,T:0,stop:false,resp:0,
  deco:Array.from({length:26},()=>({x:Math.random(),y:Math.random(),e:kind!=='battle'?rnd(['🌼','🌷','🍀','🌸']):null,r:6+Math.random()*10}))};
 G.ex=ex;notes.forEach((n,i)=>G.fx.push({x:W/2,y:H*.42+i*28,vx:0,vy:-12,life:3,txt:n,g:0}));
 const sb=$('#spBtn');sb.style.display=kind!=='person'&&k.sp?'block':'none';if(k.sp){sb.textContent=k.sp.ch;sb.disabled=true;G.rdy=false}
 $('#pbar').style.display=kind==='battle'?'none':'flex';$('#pBattle').style.display=kind==='test'?'':'none';
 if(kind==='person'){G.spr=sprite(cr,260);initPerson();hud();requestAnimationFrame(loop);return}
 const rv=c=>({spr:sprite(c,120),el:elOf(c)});G.riv=[];for(let i=0;i<7;i++)G.riv.push(rv(genRival(cr.m)));
 S.creations.filter(c=>c!==cr&&c.m===cr.m).slice(0,4).forEach(c=>G.riv.push(rv(c)));
 if(kind==='test'){$('#tip').textContent=(k.sp?'Tap the round button for '+k.sp.pw+'! ':'')+'Powers: '+k.list.join(' · ');spawn('dummy')}

}

function hud(){if(!G)return;const p=G.p;$('#hudL').textContent=G.kind==='person'?'🧪 Testing '+nameOf(G.cr):G.kind==='test'?'🧪 Test  ❤️'+G.k.hp+' 💨'+G.k.spd+' 💥'+(G.k.atk.dmg+G.k.pow):'❤️'.repeat(Math.max(0,p.hp))+'🤍'.repeat(Math.max(0,G.k.hp-p.hp))+'  Wave '+G.wave}
function gp(e){const r=gv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
gv.addEventListener('pointerdown',e=>{if(!G)return;try{gv.setPointerCapture(e.pointerId)}catch(x){}const q=gp(e),p=G.p;if(G.kind==='person'){if(G.ps.ph==='say')resetPerson();return}G.down=true;p.tx=q.x;p.ty=q.y});

const ET={basic:{r:22,hp:4},fast:{r:17,hp:2,spd:100},tank:{r:30,hp:12,spd:34},boss:{r:50,hp:55,spd:28},dummy:{r:28,hp:14,spd:20}};
function spawn(type){
 const rv=rnd(G.riv),t=ET[type],sc=type==='dummy'?1:1+G.wave*.1;let x,y;
 if(type==='dummy'){x=W*(.2+Math.random()*.6);y=H*(.22+Math.random()*.2)}
 else{const s=Math.random()*4|0;x=s===0?-30:s===1?W+30:Math.random()*W;y=s===2?-30:s===3?H+30:Math.random()*H}
 G.en.push({type:type,x:x,y:y,r:t.r,hp:Math.ceil(t.hp*sc),max:Math.ceil(t.hp*sc),spd:(t.spd||52)*(1+G.wave*.02),hit:0,wob:Math.random()*7,tx:x,ty:y,slow:0,burn:0,spr:rv.spr,el:rv.el});
}
function nextWave(){
 G.wave++;G.p.sh=G.k.shield?1:0;const n=G.wave,q=[];
 if(n%5===0){q.push('boss');for(let i=0;i<n/2;i++)q.push('fast')}
 else for(let i=0;i<2+n*2;i++){const r=Math.random();q.push(n>=3&&r<.18?'tank':n>=2&&r<.45?'fast':'basic')}
 G.q=q;G.qt=.6;G.banner={t:1.6,txt:n%5===0?'Big one!':'Wave '+n};beep(440,.2,'triangle');
 if(n>1&&n%2===1)G.pk.push({x:40+Math.random()*(W-80),y:90+Math.random()*(H-200),t:0});hud();
}
function burst(x,y,ch,n){for(let i=0;i<n;i++)G.fx.push({x:x,y:y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240-60,life:.6,ch:ch})}
const say=(x,y,txt)=>G.fx.push({x:x,y:y,vx:0,vy:-50,life:1,txt:txt,g:0});
function hurt(e,d,fx){e.hp-=d;e.hit=.12;if(fx==='slow')e.slow=2.2;if(fx==='burn')e.burn=2.5}
function near(o,range){let best=null,bd=range||1e9;for(const e of G.en){const d=Math.hypot(e.x-o.x,e.y-o.y)-e.r;if(d<bd){bd=d;best=e}}return best}
function attack(o,k,slowness){
 const a=k.atk,dmg=a.dmg*(1+k.pow*.15);
 if(a.k==='bite'){const e=near(o,a.range||70);if(!e)return;hurt(e,dmg*1.5*em(k.el,e.el),a.fx);G.fx.push({x:e.x,y:e.y-e.r,vx:0,vy:-30,life:.35,ch:a.ch});if(a.range)G.fx.push({line:[o.x,o.y-50,e.x,e.y-e.r],life:.12});beep(240,.07,'square',.04)}
 else{const e=near(o);if(!e)return;const an=Math.atan2(e.y-e.r-(o.y-50),e.x-o.x);G.sh.push({x:o.x,y:o.y-50,vx:Math.cos(an)*420,vy:Math.sin(an)*420,dmg:dmg,life:1.5,ch:a.ch,fx:a.fx,pierce:a.pierce,el:k.el,seen:[]});beep(760+a.dmg*90,.05,'square',.025)}
 o.cd=a.rate*slowness;
}
function special(p,k){
 const t=k.sp,dm=1+k.pow*.15;
 if(t.sp==='slam'){if(!near(p,95))return false;G.en.forEach(e=>{const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<135+e.r){hurt(e,2.5*dm,t.ch==='🔥'?'burn':null);e.x+=(e.x-p.x)/d*70;e.y+=(e.y-p.y)/d*70}});G.fx.push({ring:1,x:p.x,y:p.y-30,r:135,life:.35})}
 else if(t.sp==='sting'){const e=near(p,230);if(!e)return false;hurt(e,6*dm);G.fx.push({line:[p.x,p.y-40,e.x,e.y-e.r],life:.18});burst(e.x,e.y-e.r,t.ch,3)}
 else{const e=near(p,280);if(!e)return false;G.en.forEach(o=>{if(Math.hypot(o.x-e.x,o.y-e.y)<100+o.r)hurt(o,4*dm)});G.fx.push({ring:1,x:e.x,y:e.y-e.r,r:100,life:.35});burst(e.x,e.y-e.r,t.ch,5)}
 say(p.x,p.y-110,t.pw.toUpperCase()+'!');beep(520,.2,'sawtooth',.06);G.shake=.12;return true;
}
function update(dt){
 G.T+=dt;if(G.kind==='person'){updPerson(dt);return}
 const p=G.p,k=G.k,test=G.kind==='test';
 let dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);p.mv=0;
 if(d>4){const s=Math.min(d,(125+k.spd*24)*dt);p.x+=dx/d*s;p.y+=dy/d*s;p.walk+=dt*14;p.mv=1;if(Math.abs(dx)>6)p.face=dx<0?-1:1}
 p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(110,Math.min(H-24,p.y));
 if(p.z>0||p.vz>0){p.z+=p.vz*dt;p.vz-=900*dt;if(p.z<=0){p.z=0;p.vz=0}}
 if(k.hop){p.hopT-=dt;if(p.hopT<=0&&near(p,90)){p.vz=430;p.hopT=2.6;say(p.x,p.y-110,'HOP!');beep(600,.15)}}
 p.inv-=dt;p.cd-=dt;if(p.cd<=0)attack(p,k,1);
 if(k.sp){p.sp-=dt;const rdy=p.sp<=0;if(rdy!==G.rdy){G.rdy=rdy;$('#spBtn').disabled=!rdy}}
 const b=G.bud;if(b){const bx=p.x-60*p.face,by=p.y+22;const m=Math.hypot(bx-b.x,by-b.y);b.x+=(bx-b.x)*Math.min(1,dt*4);b.y+=(by-b.y)*Math.min(1,dt*4);if(m>6)b.walk+=dt*14;b.cd-=dt;if(b.cd<=0)attack(b,b.k,1.6)}
 if(test){if(!G.en.length){G.resp-=dt;if(G.resp<=0)spawn('dummy')}}
 else if(G.q.length){G.qt-=dt;if(G.qt<=0){spawn(G.q.shift());G.qt=Math.max(.25,.7-G.wave*.03)}}
 else if(!G.en.length){G.gap-=dt;if(G.gap<=0){nextWave();G.gap=1.4}}
 for(const e of G.en){
  e.wob+=dt*8;e.hit-=dt;e.slow-=dt;if(e.burn>0){e.burn-=dt;e.hp-=dt*1.2}
  let tx=p.x,ty=p.y;if(e.type==='dummy'){if(Math.hypot(e.tx-e.x,e.ty-e.y)<8){e.tx=W*(.15+Math.random()*.7);e.ty=H*(.2+Math.random()*.3)}tx=e.tx;ty=e.ty}
  const ex=tx-e.x,ey=ty-e.y,eD=Math.hypot(ex,ey)||1,v=e.spd*(e.slow>0?.4:1)*dt;e.x+=ex/eD*v;e.y+=ey/eD*v;
  if(!test&&p.inv<=0&&p.z<30&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+22){if(p.sh){p.sh=0;p.inv=1;say(p.x,p.y-110,'BLOCK! 🛡️');beep(500,.15);e.x-=ex/eD*70;e.y-=ey/eD*70;continue}p.hp--;p.inv=1.3;G.shake=.3;beep(160,.25,'sawtooth',.07);burst(p.x,p.y-40,'💢',4);e.x-=ex/eD*50;e.y-=ey/eD*50;hud();if(p.hp<=0){gameOver();return}}
 }
 for(const s of G.sh){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  for(const e of G.en){if(e.hp>0&&s.seen.indexOf(e)<0&&Math.hypot(e.x-s.x,e.y-e.r-s.y)<e.r+12){const mu=em(s.el,e.el);hurt(e,s.dmg*mu,s.fx);if(mu>1&&Math.random()<.3)say(e.x,e.y-e.r*2.8,'Super!');G.fx.push({x:s.x,y:s.y,vx:0,vy:-40,life:.25,ch:'💥'});if(s.pierce)s.seen.push(e);else{s.life=0;break}}}}
 G.sh=G.sh.filter(s=>s.life>0);
 G.en=G.en.filter(e=>{if(e.hp>0)return true;burst(e.x,e.y-e.r,e.type==='boss'?'🌟':'✨',e.type==='boss'?16:6);beep(300,.14,'triangle',.06);if(test)G.resp=1.2;return false});
 for(const q of G.pk){q.t+=dt;if(Math.hypot(q.x-p.x,q.y-p.y+20)<40){q.got=1;if(p.hp<k.hp)p.hp++;beep(880,.2);burst(q.x,q.y,'💖',5);hud()}}
 G.pk=G.pk.filter(q=>!q.got);
 for(const f of G.fx){if(f.vx!=null){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g!==0)f.vy+=300*dt}f.life-=dt}G.fx=G.fx.filter(f=>f.life>0);
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 G.shake=Math.max(0,G.shake-dt);
}
function rival(e){
 const c=gc,r=e.r,sz=r*2.9,sq=1+Math.sin(e.wob)*.05,pop=e.hit>0?1.12:1;c.save();c.translate(e.x,e.y);

}

function render(){
 if(G.kind==='person'){renderPerson();return}
 const c=gc,test=G.kind==='test';c.save();
 if(G.shake>0)c.translate((Math.random()-.5)*10,(Math.random()-.5)*10);

 if(test){c.fillStyle='#bfe8a8';c.fillRect(-10,-10,W+20,H+20);c.fillStyle='#aee096';G.deco.forEach(d=>{c.beginPath();c.arc(d.x*W,d.y*H,d.r*3,0,7);c.fill()});c.font='18px serif';c.fillStyle='#000';G.deco.forEach(d=>c.fillText(d.e,d.x*W,d.y*H))}
 else{const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe0ef');g.addColorStop(1,'#d9e8ff');c.fillStyle=g;c.fillRect(-10,-10,W+20,H+20);c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=10;c.beginPath();c.ellipse(W/2,H/2,W*.44,H*.4,0,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.6)';G.deco.forEach(d=>{c.beginPath();c.arc(d.x*W,d.y*H,d.r*.5,0,7);c.fill()})}

  else if(f.ch){c.font='20px serif';c.fillText(f.ch,f.x,f.y)}}
 c.globalAlpha=1;
 if(G.banner){c.globalAlpha=Math.min(1,G.banner.t*2);c.font="800 44px 'Baloo 2',sans-serif";c.lineWidth=8;c.strokeStyle='#fff';c.strokeText(G.banner.txt,W/2,H*.3);c.fillStyle=INK;c.fillText(G.banner.txt,W/2,H*.3);c.globalAlpha=1}

function initPerson(){
 const cr=G.cr,pt=cr.parts,th=k=>has(pt[k],k)?T[pt[k]]:null,any=f=>SLOTS.some(k=>pt[k]&&f(T[pt[k]])),bd=th('body')||T.cat;
 const food=cr.m==='food'||(cr.m!=='object'&&bd.cat==='food');let act,line;
 if(food){act='eat';const hd=th('head');
  line=hd&&hd.head.atk.k==='bite'?'OW! It bit me back!! 😱':any(t=>t.id==='chili'||t.id==='dragon')?'SPICY!! 🔥🥵':any(t=>t.id==='icecream'||t.id==='penguin')?'Brain freeze!! 🥶':any(t=>t.cat==='object')?'Crunchy… is this METAL?! 😝':any(t=>t.cat==='animal')?'It\'s… furry? 😳 But yummy!':'So yummy! 😋'}
 else if(pt.legs==='car'){act='ride';line='Wheee! It\'s so fast! 💨'}
 else if(pt.legs==='rocket'||['bee','dragon','unicorn','robot','icecream'].indexOf(pt.back)>=0){act='fly';line='It flies!! ☁️'}
 else if(th('legs')&&th('legs').legs.hop){act='boing';line='Boing boing boing! 🤸'}

 else{act='toss';line='I love it! 💖'}
 G.ps={act:act,line:line,food:food,ix:W/2+30,gy:H*.6,size:Math.min(170,W*.42)};

}
function resetPerson(first){const s=G.ps;s.ph=first?'walk':'act';s.t=0;s.chomps=0;if(first)s.kx=-40;s.eat=document.createElement('canvas');s.eat.width=s.eat.height=260;s.eat.getContext('2d').drawImage(G.spr,0,0)}
function updPerson(dt){
 const s=G.ps;s.t+=dt;
 if(s.ph==='walk'){s.kx+=120*dt;if(s.kx>=s.ix-s.size*.6){s.kx=s.ix-s.size*.6;s.ph='act';s.t=0}}
 else if(s.ph==='act'){
  if(s.act==='eat'){const n=Math.min(5,Math.floor(s.t/.45));if(n>s.chomps){const c=s.eat.getContext('2d');c.globalCompositeOperation='destination-out';c.beginPath();c.arc(30+s.chomps*34,70+Math.random()*150,46,0,7);c.fill();s.chomps=n;beep(300+Math.random()*80,.07,'square',.04);for(let i=0;i<4;i++)G.fx.push({x:s.ix-s.size*.3,y:s.gy-s.size*.5,vx:(Math.random()-.5)*160,vy:-60-Math.random()*100,life:.6,ch:'🟤'})}
   if(s.t>2.8)s.ph='say'}
  else{if(s.act==='pet'&&Math.random()<dt*5)G.fx.push({x:s.ix+(Math.random()-.5)*60,y:s.gy-s.size*.8,vx:0,vy:-70,life:.8,ch:'💖',g:0});if(s.t>3.4)s.ph='say'}
  if(s.ph==='say'){s.t=0;S.found.says[s.line]=1;persist();beep(660,.18);beep(880,.25);const ch=s.line.indexOf('SPICY')>=0?'🔥':s.line.indexOf('freeze')>=0?'🧊':s.line.indexOf('OW')>=0?'💢':'⭐';for(let i=0;i<6;i++)G.fx.push({x:s.kx,y:s.gy-90,vx:(Math.random()-.5)*200,vy:-120-Math.random()*100,life:.9,ch:ch})}
 }
 for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g!==0)f.vy+=300*dt;f.life-=dt}G.fx=G.fx.filter(f=>f.life>0);
}
function kid(x,y,z,o){
 const c=gc,sw=Math.sin(o.walk||0)*9;c.save();c.translate(x,y);
 c.fillStyle='rgba(59,42,74,.18)';c.beginPath();c.ellipse(0,2,20,6,0,0,7);c.fill();c.translate(0,-z);
 c.lineCap='round';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=11;c.beginPath();c.moveTo(-7,-24);c.lineTo(-7+sw,-3);c.moveTo(7,-24);c.lineTo(7-sw,-3);c.stroke();c.strokeStyle='#4d96ff';c.lineWidth=6;c.stroke();
 const skin=o.tint||'#ffd9a8',arm=()=>{c.beginPath();if(o.arms==='up'){c.moveTo(-13,-48);c.lineTo(-20,-80);c.moveTo(13,-48);c.lineTo(20,-80)}else if(o.arms==='fwd'){c.moveTo(11,-46);c.lineTo(32,-44);c.moveTo(11,-40);c.lineTo(32,-38)}else{c.moveTo(-14,-48);c.lineTo(-20,-28);c.moveTo(14,-48);c.lineTo(20,-28)}};
 arm();c.strokeStyle=INK;c.lineWidth=11;c.stroke();arm();c.strokeStyle=skin;c.lineWidth=6;c.stroke();
 c.strokeStyle=INK;c.lineWidth=3;R(c,-14,-54,28,32,10,'#9b5de5');E(c,0,-72,20,20,skin);
 c.beginPath();c.arc(0,-76,20,Math.PI*1.05,Math.PI*1.95);c.quadraticCurveTo(0,-84,-19,-80);c.fillStyle='#6b4226';c.fill();c.stroke();
 E(c,-1,-71,2.6,2.6,INK,0,1);E(c,11,-71,2.6,2.6,INK,0,1);
 if(o.mouth==='open')E(c,6,-62,5,6,'#7a2f45',0,1);else{c.beginPath();c.arc(5,-65,6,.15*Math.PI,.85*Math.PI);c.stroke()}
 c.restore();
}
function renderPerson(){
 const c=gc,s=G.ps,t=s.t,sz=s.size;c.fillStyle='#bfe8a8';c.fillRect(0,0,W,H);c.fillStyle='#aee096';G.deco.forEach(d=>{c.beginPath();c.arc(d.x*W,d.y*H,d.r*3,0,7);c.fill()});
 c.font='18px serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';G.deco.forEach(d=>c.fillText(d.e,d.x*W,d.y*H));
 let ox=s.ix,oz=0,rot=0,kx=s.kx,kz=0,arms='down',mouth='smile',walk=0,front=false;const sayp=s.ph==='say';
 if(s.ph==='walk')walk=t*12;
 if(s.ph==='act'){
  if(s.act==='eat'){arms='fwd';mouth=(t%.45)<.22?'open':'smile'}
  if(s.act==='pet'){arms='fwd';rot=Math.sin(t*9)*.07}
  if(s.act==='ride'){ox=s.ix+Math.sin(t*1.85)*W*.3;kx=ox;kz=sz*.62;front=true;arms='up'}
  if(s.act==='fly'){const hh=Math.sin(Math.min(1,t/3.4)*Math.PI)*H*.28;oz=hh+82;ox=s.ix-30+Math.sin(t*2)*40;kx=ox;kz=hh;arms='up';walk=t*8}
  if(s.act==='boing'){kx=s.ix;oz=Math.abs(Math.sin(t*4))*110;kz=sz*.62+oz;front=true;arms='up'}
  if(s.act==='toss'){kx=s.ix;oz=82+Math.abs(Math.sin(t*2.6))*190;rot=t*5;arms='up'}
 }
 const bit=sayp&&s.line.indexOf('OW')>=0;if(bit)kz=Math.abs(Math.sin(t*9))*18;
 if(s.food){c.fillStyle='#fff';c.strokeStyle='#ff5d73';c.lineWidth=4;c.beginPath();c.ellipse(s.ix,s.gy,sz*.62,sz*.17,0,0,7);c.fill();c.stroke()}
 const item=()=>{c.save();c.translate(ox,s.gy);if(!s.food){c.fillStyle='rgba(59,42,74,.18)';c.beginPath();c.ellipse(0,2,sz*.36,sz*.09,0,0,7);c.fill()}c.translate(0,-oz-sz*.45);c.rotate(rot);if(sayp&&!s.food){const b=1+Math.sin(t*6)*.04;c.scale(b,2-b)}c.drawImage(s.food?s.eat:G.spr,-sz/2,-sz/2,sz,sz);c.restore()};
 const tint=sayp?(s.line.indexOf('SPICY')>=0?'#ff8a7a':s.line.indexOf('freeze')>=0?'#a8d8ff':null):null;
 const K=()=>kid(kx,s.gy+(front?0:6),kz,{walk:walk,arms:arms,mouth:sayp?'open':mouth,tint:tint});
 if(front){item();K()}else{K();item()}
 c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
 for(const f of G.fx){c.globalAlpha=Math.max(0,Math.min(1,f.life*2));c.font=(f.ch==='🟤'?10:22)+'px serif';c.fillText(f.ch,f.x,f.y)}c.globalAlpha=1;
 if(sayp){
  c.font="700 19px 'Baloo 2',sans-serif";const w=Math.min(W-20,c.measureText(s.line).width+28),bx=Math.max(10,Math.min(W-10-w,kx-w/2)),by=s.gy-sz-40;
  c.strokeStyle=INK;c.lineWidth=3;R(c,bx,by-22,w,44,16,'#fff');c.fillStyle=INK;c.fillText(s.line,bx+w/2,by+1,w-16);
  c.font="700 17px 'Baloo 2',sans-serif";c.globalAlpha=.6+Math.sin(t*4)*.3;c.fillText('Tap to test again!',W/2,s.gy+70);c.globalAlpha=1;
 }
}
function loop(ts){const g=G;if(!g||g.stop)return;const dt=g.last?Math.min(.033,(ts-g.last)/1000):0;g.last=ts;update(dt);if(G===g&&!g.stop){render();requestAnimationFrame(loop)}}
