<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Create-A</title>
<meta name="theme-color" content="#fff6e9">
<meta name="description" content="Mix anything with anything: a creation game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a4a;--bg:#fff6e9;--pink:#ff5d73;--blue:#4d96ff;--green:#6bcb77;--yellow:#ffd93d;--purple:#9b5de5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Baloo 2',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:8px 12px;transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.4}
input,textarea{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:#fff;user-select:text;-webkit-user-select:text;width:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#home{overflow-y:auto;padding:18px 16px 40px;background:radial-gradient(circle at 12% 8%,#ffe3ec 0 60px,transparent 61px),radial-gradient(circle at 90% 20%,#dff3ff 0 80px,transparent 81px),radial-gradient(circle at 80% 85%,#e6ffe0 0 90px,transparent 91px),var(--bg)}
#setBtn{position:absolute;top:12px;right:12px;z-index:2}
#home{position:fixed}
.logo{font-size:48px;font-weight:800;text-align:center;line-height:1;margin:10px 0 0;letter-spacing:1px}
.logo span{display:inline-block;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;font-weight:500;font-size:18px;margin:6px 0 16px}
h2{font-size:22px;margin:22px 0 8px}
#first{display:none;flex-direction:column;align-items:center;padding-top:4vh}
#first.on{display:flex}
#firstPic{width:min(78vw,340px);aspect-ratio:1;animation:bob 1.6s ease-in-out infinite}
#firstPic canvas{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-14px) rotate(1.5deg)}}
#firstGo{width:100%;min-height:84px;font-size:28px;border-radius:24px;margin-top:12px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.04)}}
#full.off{display:none}
#modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px 10px;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.55);border-radius:80px 80px 20px 20px;min-height:150px;justify-content:flex-end}
.mode canvas{width:96px;height:96px}
.mode .em{font-size:52px;line-height:96px;text-shadow:none}
.mode .ic{width:56px;height:56px;margin:20px 0}
.addmode{background:#fff;color:var(--ink);text-shadow:none;border-style:dashed}
#gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:6px 2px 4px}
.cre{position:relative;display:flex;flex-direction:column;align-items:stretch}
.cre::after{content:'';position:absolute;left:-8px;right:-8px;bottom:-9px;height:9px;background:#d9a066;border:2.5px solid var(--ink);border-radius:5px;z-index:-1}
.cre.newest{grid-column:1/-1}
.crb{padding:6px;display:flex;flex-direction:column;align-items:center;font-size:16px;position:relative;width:100%}
.crb canvas{width:100%;aspect-ratio:1}
.cre.newest .crb{flex-direction:row;align-items:center;padding:6px 10px 6px 6px;min-height:200px}
.cre.newest .crb canvas{width:56%;flex:none}
.cre.newest .crb .nm{flex:1;align-self:flex-start;margin-top:22px;white-space:normal;text-align:center;line-height:1.1}
.crb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cre.newest .crb .nm{font-size:22px}
.crb .bd{position:absolute;top:6px;right:6px}
.crb .bd .ic{width:26px;height:26px}
.crb .md{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink)}
.pa{position:absolute;right:12px;bottom:22px;width:40%;justify-content:center;min-height:52px;font-size:18px;display:flex;align-items:center;gap:6px}
.pa .ic{width:26px;height:26px}
.wide{width:100%;margin-top:14px;font-size:18px}
#home h2{display:flex;align-items:center;gap:8px}
.top{display:flex;gap:8px;align-items:center;padding:8px 10px;flex:none}
.top button{padding:4px 12px;font-size:20px;flex:none}
.top .ttl{flex:1;font-size:21px;line-height:1.1}
.top input{flex:1;min-width:0;padding:4px 12px;font-size:18px}
.row{display:flex;gap:6px;padding:0 10px;overflow-x:auto;flex:none;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tabs button{flex:1;padding:3px 3px;font-size:13.5px;border-radius:12px 12px 0 0;box-shadow:none;border-bottom:none;background:#efe7f7;white-space:nowrap}
.tabs button.on{background:#fff}
.grid{flex:1;overflow-y:auto;background:#fff;border-top:3px solid var(--ink);padding:10px;display:grid;gap:10px;align-content:start}
/* picker + mix */
#ptabs{display:flex;gap:6px;padding:0 10px;flex:none}
#ptabs button{flex:1;min-height:64px;padding:2px 4px 0;border-radius:16px 16px 0 0;box-shadow:none;border-bottom:none;background:#efe7f7;display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px}
#ptabs button.on{background:#fff}
#ptabs canvas{width:46px;height:46px;flex:none}
#pgrid{grid-template-columns:repeat(3,1fr)}
.card{padding:4px 4px 4px;display:flex;flex-direction:column;align-items:center;font-size:15px;position:relative;line-height:1.15;box-shadow:0 3px 0 var(--ink)}
.card canvas{width:100%;aspect-ratio:1}
.card.on{background:#fff3b8;outline:3px solid var(--ink);outline-offset:1px}
.card .num{position:absolute;top:-8px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid var(--ink);font-size:17px;line-height:26px;text-align:center}
.card small{font-weight:500;font-size:14px;opacity:.8}
.foot{display:flex;gap:8px;padding:8px 10px 12px;border-top:3px solid var(--ink);background:#fff;flex:none;align-items:center}
#pchips{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
.tslot{width:72px;height:72px;border-radius:50%;border:3px dashed #c8b8da;flex:none;display:flex;align-items:center;justify-content:center;background:#fbf7ff}
.tslot.full{border:3px solid var(--ink);background:#fff3b8}
.tslot canvas{width:92%;height:92%}
.tslot.pop{animation:popin .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes popin{0%{transform:scale(.2) translateY(-60px)}100%{transform:none}}
.foot button{font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5);min-height:64px;padding:8px 16px}
#mgrid{grid-template-columns:1fr 1fr}
#mgrid .card{font-size:18px}
#mgrid .ic.dice{width:62%;height:auto;aspect-ratio:1;margin:19%}
#mpicks{display:flex;gap:4px;align-items:center;padding:0 10px 8px;font-size:15px;flex:none}
#mpicks canvas{width:64px;height:64px;flex:none}
#mpicks .pl{font-size:22px}
#mpicks button{margin-left:auto}
/* the reveal */
#reveal{position:fixed;inset:0;z-index:15;display:none;background:radial-gradient(circle at 50% 45%,#fff8d6 0,#ffd9ec 55%,#d9c6ff 100%)}
#reveal.on{display:block}
#rv{width:100%;height:100%;display:block}
#rvBan{position:absolute;left:0;right:0;top:12%;text-align:center;opacity:0;pointer-events:none}
#rvBan.on{opacity:1;animation:ban .55s cubic-bezier(.3,1.7,.5,1)}
#rvBan small{display:block;font-size:24px}
#rvBan b{display:inline-block;font-size:50px;line-height:1.05;color:#fff;text-shadow:2.5px 0 var(--ink),-2.5px 0 var(--ink),0 2.5px var(--ink),0 -2.5px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 6px 0 var(--ink);padding:0 12px;word-break:break-word}
@keyframes ban{0%{transform:scale(.3) rotate(-8deg)}100%{transform:none}}
/* everything answers the finger */
button{touch-action:manipulation}
button.pressed,button:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 var(--ink)}
.screen.enter{animation:scr .16s ease-out}
@keyframes scr{from{opacity:0;transform:translateY(10px)}}
#modal.on #mbox{animation:mbx .2s cubic-bezier(.3,1.5,.5,1)}
@keyframes mbx{from{transform:scale(.85);opacity:0}}
.toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;margin-top:10px;font-size:20px;justify-content:flex-start}
.toggle .ic{width:36px;height:36px}
.toggle .sw{margin-left:auto;width:64px;height:36px;border-radius:99px;background:#d9cfe6;border:3px solid var(--ink);position:relative;flex:none}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.toggle.on .sw{background:var(--green)}.toggle.on .sw::after{left:29px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* icons + shared */
.ic{width:24px;height:24px;display:block;flex:none;overflow:visible}
.icw{display:inline-flex;flex:none}
.ib{width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:28px;line-height:1;flex:none;font-weight:800}
.ib .ic{width:28px;height:28px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:48px;padding:4px 10px;font-size:15px;flex:none}
.tb .ic{width:24px;height:24px}
/* workshop */
#editor{background:var(--bg)}
#editor .top{padding:8px 10px}
.namebox{flex:1;min-width:0;position:relative}
.namebox input{height:48px;font-size:19px;padding:4px 40px 4px 12px}
#saved{position:absolute;right:10px;top:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#saved.show{opacity:1}
#stage{flex:none;margin:0 10px;height:clamp(250px,44vh,440px);border:3px solid var(--ink);border-radius:22px;background:radial-gradient(circle at 50% 38%,#fff 0,#e8f6ff 58%,#d5ecff 100%);box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
#ed{width:100%;height:100%;touch-action:none;display:block}
#stage .sm{position:absolute;padding:2px 10px 2px 6px;font-size:15px;border-radius:14px;box-shadow:0 3px 0 var(--ink);background:rgba(255,255,255,.94)}
#undo{left:8px;top:8px}#remix{right:8px;top:8px}#del{left:8px;bottom:10px}
#undo:disabled{opacity:.35}
#szbox{position:absolute;right:8px;bottom:10px;display:flex;gap:8px}
#szbox .ib{background:rgba(255,255,255,.94);box-shadow:0 3px 0 var(--ink);border-radius:14px}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:15px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 12px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#hint.gone{opacity:0}
#stickers{position:absolute;left:8px;top:66px;display:flex;flex-direction:column;gap:7px;pointer-events:none;align-items:flex-start;max-width:44%}
.sticker{background:var(--yellow);border:2.5px solid var(--ink);border-radius:12px;padding:1px 9px 1px 4px;font-size:14px;line-height:1.5;display:flex;gap:3px;align-items:center;box-shadow:0 2px 0 var(--ink);transform:rotate(-4deg);white-space:nowrap}
.sticker:nth-child(2n){transform:rotate(3deg)}
.sticker .ic{width:18px;height:18px}
.sticker.new{animation:stk .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes stk{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(-4deg)}}
#stats{display:flex;gap:6px;align-items:center;padding:10px 10px 2px;flex:none}
.elb{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;flex:none}
.elb .ic{width:28px;height:28px}
.srow{flex:1;display:flex;align-items:center;gap:2px;min-width:0;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:3px 5px;height:48px}
.srow .ics{display:flex;flex-wrap:wrap;flex:1;min-width:0;align-content:center;gap:1px 0}
.srow .ics .ic{width:15px;height:15px}
.srow b{font-size:14px;opacity:.6;flex:none;font-weight:700}
#slots{display:flex;gap:4px;padding:8px 10px 0;flex:none}
.slot{flex:1;min-width:0;padding:3px 0 1px;display:flex;flex-direction:column;align-items:center;border-radius:14px 14px 0 0;border-bottom:none;box-shadow:none;background:#efe7f7;min-height:64px}
.slot.on{background:#fff}
.slot .sp{width:38px;height:38px;display:block}
.slot .sp canvas,.slot .sp .ic{width:100%;height:100%}
.slot .sl{font-size:clamp(12px,3.5vw,14px);line-height:1.1;white-space:nowrap;letter-spacing:-.4px}
#tray{grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
#tray .card{font-size:14px;padding:4px 4px 6px}
#tray .pic{width:100%;aspect-ratio:1;display:block}
#tray .pic canvas,#tray .pic .ic{width:100%;height:100%}
#tray .pic .ic{padding:18%}
#tray .nm{font-size:14px;line-height:1.15;text-align:center}
#tray .fx{position:absolute;top:4px;right:4px;background:#fff;border:2.5px solid var(--ink);border-radius:99px;display:flex;align-items:center;padding:1px 6px 1px 2px;gap:1px}
#tray .fx .ic{width:24px;height:24px}
#tray .fx b{font-size:14px;line-height:1}
#tray.slide{animation:slideup .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes slideup{from{transform:translateY(60px);opacity:.2}}
.sw3{display:flex;width:100%;aspect-ratio:1;align-items:center;justify-content:center;gap:3px}
.sw3 i{width:26%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink)}
#actions{display:flex;gap:8px;padding:8px 10px 12px;border-top:3px solid var(--ink);background:#fff;flex:none}
#actions button{flex:1;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5);min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px}
#actions .ic{width:28px;height:28px}
/* play */
#play{background:#bfe8a8}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:17px;gap:8px}
#hud button{pointer-events:auto}
#hudL{background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:48px;max-width:calc(100% - 60px)}
#hudL .ic{width:22px;height:22px}
#hudL b{font-size:16px;margin-right:4px}
#hudL .hh{display:flex;flex-wrap:wrap;max-width:200px}
#hudL .wv{display:flex;align-items:center;gap:4px;font-size:17px;margin-right:4px}
#pbar{position:absolute;left:10px;right:10px;bottom:14px;display:none;flex-direction:column;gap:8px}
#tip{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;font-size:15px;font-weight:500;text-align:center}
#pbar .b{display:flex;gap:8px}
#pbar button{flex:1;font-size:18px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px}
#pbar .ic{width:26px;height:26px}
#spBtn{position:absolute;right:16px;bottom:28px;width:100px;height:100px;border-radius:50%;padding:7px;display:none;align-items:center;justify-content:center;background:conic-gradient(var(--yellow) calc(var(--p,0)*360deg),#d9cfe6 0);box-shadow:0 5px 0 var(--ink)}
#spBtn.lift{bottom:104px}
#spBtn #spPic{width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:.55;transition:opacity .2s}
#spBtn #spPic canvas{width:80%;height:80%}
#spBtn.rdy #spPic{opacity:1;background:#fff6c8}
#spBtn.rdy{animation:rdy 1s ease-in-out infinite}
@keyframes rdy{50%{transform:scale(1.07)}}
/* battle setup + game over */
.bhero{width:180px;display:block;margin:-6px auto 0}
.bstats{display:flex;justify-content:center;align-items:center;gap:4px;margin:2px 0 10px}
.bstats .ic{width:24px;height:24px}.bstats b{font-size:18px;margin-right:8px}
.bslots{display:flex;gap:10px;justify-content:center}
.bslot{flex:1;max-width:110px;aspect-ratio:.85;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative;border-style:dashed;background:#fbf7ff}
.bslot.on{border-style:solid;background:#fff3b8}
.bslot.off{opacity:.45}
.bslot .ic{width:46px;height:46px}
.bslot canvas{width:100%;flex:1;min-height:0;object-fit:contain}
.bslot .plus{position:absolute;top:2px;right:8px;font-size:24px;font-weight:800}
.bslot .bl{font-size:15px}
.bigstart{width:100%;margin-top:14px;font-size:24px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px}
.bigstart .ic{width:34px;height:34px}
.bchoose{position:absolute;inset:0;background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bpick{aspect-ratio:1;padding:4px;display:flex;align-items:center;justify-content:center}
.bpick.on{background:var(--yellow)}
.bpick canvas{width:100%;height:100%}.bpick .ic{width:50%;height:50%}
#mbox .tb{flex:1}
#mbox .col{flex-direction:column}
.big2{min-height:56px;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
.big2 .ic{width:28px;height:28px}
#mbox button .ic{display:inline-block;vertical-align:middle;margin-right:4px}
.overcard{width:200px!important;border-radius:14px}
.ostars{display:flex;justify-content:center;gap:6px;margin-top:6px}.ostars .ic{width:40px;height:40px}.ostars .dim{opacity:.25}
.owave{font-size:20px;margin:2px 0!important}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#modal{position:fixed;inset:0;background:rgba(59,42,74,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
#mbox{position:relative;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;text-align:center}
#mbox h3{margin:0 0 8px;font-size:24px}
#mbox p{font-weight:500;margin:6px 0}
#mbox h3 .ic{display:inline-block;width:30px;height:30px;vertical-align:-5px;margin-right:6px}#mbox p .ic{width:20px;height:20px}#mbox .ic.dim{opacity:.3}
#mbox .b{display:flex;gap:8px;margin-top:12px}
#mbox .b button{flex:1}
.pick{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px}
.pick button{flex:none;width:64px;height:64px;padding:2px;font-size:28px}
.pick button.on{background:var(--yellow)}
.pick canvas{width:100%;height:100%}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.grid6 button{padding:2px 0;font-size:22px;min-height:48px;border-radius:12px;box-shadow:0 2px 0 var(--ink)}
.grid6 button.on{background:var(--yellow)}
.sw{flex:none;width:48px!important;height:48px!important;border-radius:50%;padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
#mbox img{width:236px;height:auto}
#mbox .cardimg{width:min(100%,300px);display:block;margin:0 auto;border-radius:18px}
#mbox textarea{margin-top:10px}
#spBtn{position:absolute;right:14px;bottom:150px;width:78px;height:78px;border-radius:50%;font-size:34px;padding:0;background:var(--yellow);display:none}
#mbox textarea{height:74px;font-size:12px;font-weight:500;word-break:break-all;resize:none}
.go{background:var(--green);color:#fff;text-shadow:0 2px 0 rgba(59,42,74,.5)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.on{opacity:1}

<body>

<div id="home" class="screen on">
  <button id="setBtn" class="ib" aria-label="Settings"></button>
  <div class="logo" id="logo"></div>
  <div class="sub">Mix anything with anything!</div>
  <div id="first"><div id="firstPic"></div><button id="firstGo" class="go">Make your first mix!</button></div>
  <div id="full">
    <h2>My toybox</h2>
    <div id="gallery"></div>
    <h2>Make something new</h2>
    <div id="modes"></div>
    <button class="wide tb" id="addFriend">Add a friend's creation</button>
    <button class="wide tb" id="pediaBtn">Mixipedia</button>
  </div>
</div>

<div id="pick" class="screen">
  <div class="top"><button id="pBack" class="ib" aria-label="Back"></button><div class="ttl" id="pTtl">Pick up to 3 things!</div></div>
  <div id="ptabs"></div>
  <div class="grid" id="pgrid"></div>
  <div class="foot"><div id="pchips"></div><button id="pGo" class="go">Mix!</button></div>
</div>

<div id="mix" class="screen">
  <div class="top"><button id="mBack" class="ib" aria-label="Back"></button><div class="ttl">How should they mix?</div></div>
  <div id="mpicks"></div>
  <div class="grid" id="mgrid"></div>
</div>

<div id="reveal"><canvas id="rv"></canvas><div id="rvBan"><small>It is a</small><b id="rvName"></b></div></div>

<div id="editor" class="screen">
  <div class="top">
    <button id="back" class="ib" aria-label="Home"></button>
    <div class="namebox"><input id="name" maxlength="18" placeholder="Name it!"><span id="saved"></span></div>
    <button id="reName" class="tb">Name</button>
  </div>
  <div id="stage"><canvas id="ed"></canvas><div id="stickers"></div><div id="hint">Tap a part to change it!</div>
    <button id="undo" class="tb sm">Undo</button><button id="remix" class="tb sm">Remix</button><button id="del" class="tb sm">Delete</button>
    <div id="szbox"><button id="szm" class="ib" aria-label="Smaller">&minus;</button><button id="szp" class="ib" aria-label="Bigger">+</button></div></div>
  <div id="stats"></div>
  <div id="slots"></div>
  <div class="grid" id="tray"></div>
  <div id="actions">
    <button id="bTest" style="background:var(--blue)">Test</button>
    <button id="bBattle" style="background:var(--pink)">Battle</button>
    <button id="bShare" style="background:var(--purple)">Share</button>
  </div>
</div>

<div id="play" class="screen">
  <canvas id="game"></canvas>
  <button id="spBtn" aria-label="Special"><span id="spPic"></span></button>
  <div id="hud"><div id="hudL"></div><button id="quit" class="ib" aria-label="Pause"></button></div>
  <div id="pbar"><div id="tip"></div><div class="b"><button id="pAdd">Change it</button><button id="pBattle" style="background:var(--pink);color:#fff">Battle</button></div></div>
</div>

<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

 const sc=Math.min(w/300,hh/420)*1.05;
 // the creature hops out: rises from the cloud with a squash
 const k=Math.min(1,Math.max(0,(t-.2)/.45)),ease=1-Math.pow(1-k,3),hop=rm?0:Math.sin(Math.min(1,Math.max(0,(t-.2)/.7))*Math.PI)*90,sq=rm?1:1+Math.sin(Math.min(1,k)*Math.PI)*.12;
 c.fillStyle='rgba(59,42,74,.15)';c.beginPath();c.ellipse(cx,gy,80*sc*ease,12*sc,0,0,7);c.fill();
 if(k>0){c.save();c.translate(cx,gy-hop);c.scale(sc*ease/sq,sc*ease*sq);drawCreature(c,RV.cr,{t:t,blink:(t%3)<.12,lw:4});c.restore()}
 // the poof
 const pk=Math.min(1,t/.6);if(pk<1){c.globalAlpha=1-pk;c.strokeStyle=INK;c.lineWidth=3;RV.puffs.forEach(p=>{const r=(40+pk*150)*p.r,x=cx+Math.cos(p.a)*r,y=gy-110*sc+Math.sin(p.a)*r*.7;c.fillStyle='#fff';c.beginPath();c.arc(x,y,p.s*(1-pk*.5),0,7);c.fill();c.stroke()});c.globalAlpha=1}
}
