      }
    }
    var summary = { won: won, depth: q.depth, renown: gained, salvage: salvage, deaths: q.deaths.slice(),
      drops: q.dropLog.slice(), sealRepeats: q.sealRepeats, results: q.results.length, traitOffers: traitOffers };
    state.pendingTraits = traitOffers;
    state.pendingDrops = q.drops.slice();
    state.lastQuest = summary;
    state.quest = null;
    ev(state, 'questEnd', { won: won, renown: gained, deaths: q.deaths.length });
    return summary;
  }

  function takeTrait(state, charId, traitId) {                                           // R2.5
    var ch = byId(state, charId);
    if (!ch) return { ok: false, reason: 'no character' };
    if (ch.traits.indexOf(traitId) >= 0) return { ok: false, reason: 'already owned' };
    ch.traits.push(traitId);
    state.pendingTraits = (state.pendingTraits || []).filter(function (t) { return t.charId !== charId; });
    ev(state, 'trait', { id: charId, trait: traitId });
    return { ok: true };
  }

  function equip(state, rng, ch, item) {                                                 // R6.6, R6.7
    var old = ch.gear[item.slot] || null;
    if (old) { state.account.renown += B.SALVAGE[old.rarity]; state.account.renownLifetime += B.SALVAGE[old.rarity]; }
    ch.gear[item.slot] = item;                                                            // R6.3: never retargeted
    ev(state, 'equip', { id: ch.id, item: item.name, slot: item.slot, replaced: old ? old.name : null });
    return { ok: true, salvaged: old ? B.SALVAGE[old.rarity] : 0 };
  }

  function applyDrop(state, rng, item, charId) {                                          // R6.7
    if (!charId) {
      state.account.renown += B.SALVAGE[item.rarity];
      state.account.renownLifetime += B.SALVAGE[item.rarity];
      ev(state, 'salvage', { item: item.name, renown: B.SALVAGE[item.rarity] });
      return { ok: true, renown: B.SALVAGE[item.rarity] };
    }
    if (charId === 'shelf') {                                                             // R6.7: a Ward may go to the shelf
      if (item.slot !== 'sigilWard') return { ok: false, reason: 'not a Ward' };
      if (state.account.wardShelf.length >= state.account.wardShelfSlots) return { ok: false, reason: 'no shelf slot' };
      state.account.wardShelf.push(item);
      return { ok: true, shelved: true };
    }
    var ch = byId(state, charId);
    if (!ch) return { ok: false, reason: 'no character' };
    return equip(state, rng, ch, item);
  }

  /* R5.10: replacement mid quest, Depth I to IV only */
  function canReplace(state) {
    var q = state.quest;
    if (!q) return false;
    if (B.REPLACEMENT_DEPTHS.indexOf(q.depth) < 0) return false;                          // Depth V: neither
    return livingParty(state).length < B.PARTY_SIZE;
  }
  function replace(state, rng, opts) {
    opts = opts || {};
    var q = state.quest;
    if (!canReplace(state)) return { ok: false, reason: 'no replacement at this Depth' };
    var ch = null;
    if (opts.recruit) {
      /* R8.0b: every RENOWN price in R8.1 is multiplied by the price index, the mid quest Recruit included, or
       * the 25 Renown that brakes the Recruit farms erodes to nothing exactly where the farm is richest.
       * R8.0: the roster count is LIVING characters only. */
      var living = state.roster.filter(function (c) { return c.alive; }).length;
      if (living >= state.account.rosterSlots) return { ok: false, reason: 'roster full' };
      var cost = price(state, B.HALL.recruit);
      if (state.account.renown < cost) return { ok: false, reason: 'cannot pay' };
      state.account.renown -= cost;
      ch = newCharacter(rng, state.account, opts);
      ch.calling = opts.calling || ch.dealt[0].calling;
      state.roster.push(ch);
    } else {
      ch = byId(state, opts.charId);
      if (!ch || !ch.alive || ch.deployed || !canDeploy(ch)) return { ok: false, reason: 'not deployable' };
    }
    ch.deployed = true;
    ch.armorPool = effArmor(ch, null, q);
    ch.unkillableUsed = false;
    q.party.push(ch.id);
    ev(state, 'replacement', { id: ch.id, recruited: !!opts.recruit });
    return { ok: true, id: ch.id };
  }

  /* R2.6: retire needs a quest survived; a character with none is DISMISSED */
  function retire(state, charId) {
    var ch = byId(state, charId);
    if (!ch) return { ok: false, reason: 'no character' };
    if (ch.deployed && state.quest) return { ok: false, reason: 'on a quest' };
    if (ch.questsSurvived < 1) return { ok: false, reason: 'no quest survived, dismiss instead' };
    /* R2.6 CORRECTED (audit): the flat 2 plus Traits paid 3 Marrow for a character retired after ONE quest,
     * six times the design's own rate, so the fastest Marrow in the game was to recruit and retire rookies and
     * never risk anyone. Under the vest a retirement pays its Traits alone; the veteran's six is untouched. */
    var marrow = ch.questsSurvived >= B.RETIRE_VESTING ? B.RETIRE_MARROW + ch.traits.length : ch.traits.length;
    state.account.marrow += marrow;
    var legacy = { id: 'L' + (state.account.legacies.length + 1), calling: ch.calling, charName: ch.name,
      diedAt: 'the Hall', depth: 0, consecrated: false, retired: true };
    state.account.legacies.push(legacy);
    state.account.wall.unshift({ name: ch.name, origin: ch.origin, calling: ch.calling,
      quests: ch.questsSurvived, depth: 0, cause: 'retired after ' + ch.questsSurvived + ' quests', retired: true });
    var gear = stripGear(ch);
    state.pendingDrops = (state.pendingDrops || []).concat(gear);                          // R2.6 to the drop screen
    state.roster = state.roster.filter(function (c) { return c.id !== ch.id; });
    ev(state, 'retire', { id: ch.id, marrow: marrow, traits: ch.traits.length });
    return { ok: true, marrow: marrow, legacy: legacy.id, gear: gear };
  }
  function dismiss(state, charId) {                                                        // R2.6: 0 Marrow, no Legacy, no wall line
    var ch = byId(state, charId);
    if (!ch) return { ok: false, reason: 'no character' };
    if (ch.deployed && state.quest) return { ok: false, reason: 'on a quest' };
    var gear = stripGear(ch);
    state.pendingDrops = (state.pendingDrops || []).concat(gear);
    state.roster = state.roster.filter(function (c) { return c.id !== ch.id; });
    ev(state, 'dismiss', { id: ch.id });
    return { ok: true, marrow: 0, legacy: null, gear: gear };
  }

  /* ---- the Hall (R8.1, R8.2). Every purchase refuses when it cannot pay. ---- */
  /* R8.0b THE PRICE INDEX (audit). Every Hall price is multiplied by PRICE_INDEX[deepest Depth ever completed]
   * and rounded to the nearest 5, because income multiplies twice over with Depth while every price the spec
   * prints is a constant. Set the row to all ones to get the spec's printed prices back. */
  function price(state, base) {
    var d = Math.max(1, Math.min(B.PRICE_INDEX.length, state.account.deepestCompleted || 1));
    return Math.round(base * B.PRICE_INDEX[d - 1] / 5) * 5;
  }
  function pay(state, cost) {
    if (state.account.renown < cost) return false;
    state.account.renown -= cost; return true;
  }
  function payMarrow(state, cost) {
    if (state.account.marrow < cost) return false;
    state.account.marrow -= cost; return true;
  }
  var hall = {
    reforge: function (state, rng, charId, slot, affixIdx) {                              // R6.9

      if (!item) return { ok: false, reason: 'no relic there' };
      var line = item.affixes[affixIdx];
      if (!line) return { ok: false, reason: 'no such line' };
      if (item.unique && affixIdx >= item.affixes.length) return { ok: false, reason: 'never the unique' };
      if (!pay(state, price(state, B.HALL.reforge))) return { ok: false, reason: 'cannot pay' };
      /* R6.9: another valid affix of the same points, stat retargeted freely; a retarget of the SAME key counts

      var used = {}, sigs = {}, i;
      for (i = 0; i < item.affixes.length; i++) {
        if (i === affixIdx) continue;
        var o = item.affixes[i];
        if (B.AFFIXES[o.key] && B.AFFIXES[o.key].statTarget) used[famKey(o.key)] = (used[famKey(o.key)] || []).concat([o.stat]);
        else used[o.key] = (used[o.key] || 0) + 1;
        if (o.sigil) sigs[o.sigil] = 1;
      }
      var keys = Object.keys(B.AFFIXES).filter(function (k) {
        var d = B.AFFIXES[k];
        if (d.slots.indexOf(item.slot) < 0 || d.pts !== line.pts) return false;
        if (d.statTarget) return (used[famKey(k)] || []).length < STATS.length;
        if (d.sigilTarget) return Object.keys(sigs).length < SIGILS.length;
        if (TWICE_OK[k]) return (used[k] || 0) < TWICE_OK[k];
        return !used[k];
      }).sort();
      if (!keys.length) return { ok: true, changed: false, fixed: true };
      var key = keys[rng.int(keys.length)], def = B.AFFIXES[key], eff = clone(def.eff), stat = null, sigil = null, j;
      if (def.statTarget) {
        var freeS = STATS.filter(function (x) { return (used[famKey(key)] || []).indexOf(x) < 0; });
        stat = freeS[rng.int(freeS.length)];
        for (j = 0; j < eff.length; j++) if (eff[j].stat === '*') eff[j].stat = stat;
      }
      if (def.sigilTarget) {
        var freeG = SIGILS.filter(function (x) { return !sigs[x]; });
        sigil = freeG[rng.int(freeG.length)];
        for (j = 0; j < eff.length; j++) if (eff[j].sigil === '*') eff[j].sigil = sigil;
      }
      item.affixes[affixIdx] = { key: key, pts: def.pts, stat: stat, sigil: sigil, eff: eff };
      item.name = nameRelic(rng, item.slot, item.affixes, item.unique);
      return { ok: true, changed: true, key: key };
    },
    commission: function (state, rng, slot) {                                             // R6.10
      if (!pay(state, price(state, B.HALL.commission))) return { ok: false, reason: 'cannot pay' };
      var d = unlockedDepths(state).slice(-1)[0] || 1, out = [];
      for (var i = 0; i < 3; i++) out.push(newRelic(rng, d, { slot: slot }));
      return { ok: true, offers: out };
    },
    /* R8.1 Recruit, and R8.0 THE STRAY (audit, a blocker: without it the game soft locks). Whenever the roster
     * holds no deployable character and Renown is under the Recruit price, the button reads TAKE IN A STRAY and
     * costs 0, one at a time. A first quest wipe otherwise ends the account at the spec's own 8 percent wipe rate.
     * A stray is unproven, so its own death pays no Marrow (R8.5) and it cannot be farmed.
     * The roster count is LIVING characters only (R8.0). */
    recruitCost: function (state) {
      var cost = price(state, B.HALL.recruit);
      var deployable = state.roster.filter(canDeploy).length;
      if (deployable === 0 && state.account.renown < cost) return 0;                       // TAKE IN A STRAY
      return cost;
    },
    isStray: function (state) { return hall.recruitCost(state) === 0; },
    recruit: function (state, rng, opts) {
      var living = state.roster.filter(function (c) { return c.alive; }).length;
      if (living >= state.account.rosterSlots) return { ok: false, reason: 'roster full' };
      var cost = hall.recruitCost(state);
      if (cost > 0 && !pay(state, cost)) return { ok: false, reason: 'cannot pay' };

    redeal: function (state, rng, charId) {                                               // R8.1

    mend: function (state) {                                                              // R8.1, R8.3

  /* ================= SIM.policy: the reasonable player, inside the engine =================
   * Not an AI. One legible player, so a balance number measured by the harness means something.
   *
   *  assign  enumerate every legal assignment of the living party to this stage's open slots
   *          (a Relay takes two different bodies; one body may double only when the stage needs
   *          more bodies than the party has, R5.6). Score an assignment as the sum over its
   *          checks of P(pass) x the slot's Renown minus P(fail) x strainOnFail x a danger weight
   *          of 1 + 3 x strain / max(1, toughness - 1), so a hurt character is worth less
   *          everywhere and worth nothing on a slot that would kill them. Among the assignments
   *          that bench the most strained living character, keep the highest score.
   *  boss    each character goes to the unbroken Aspect that maximises P(pass) x expected damage,
   *          reading the Aspects with the fewest hit points first, and an Aspect already projected
   *          dead this round is worth a quarter, so the party does not all pile onto one card.
   *  push    Push when it raises P(pass) by at least 0.15 and leaves Strain <= Toughness - 2.
   *  vault   Vault and Open take the character's highest die.
   *  trait   a fixed priority list, best first.
   *  drop    equip a drop that beats the worn item's points, otherwise take the Renown.
   *  hall    Mend when a deployed character sits at Toughness - 1 and Renown >= 20; Recruit while
   *          fewer than three characters can deploy; retire at effective Toughness <= 1 once a

  var TRAIT_PRIORITY = ['ironlung', 'steady', 'bulwark', 'unkillable', 'ninthHour', 'surehanded',

  /* R5.3 / R5.8 / R9.2: the policy scores from what the PLAYER can see. Under Blindness (a WITS failure the
   * stage before) or the blindfold Sigil the TN is hidden, and the honest estimate is the pass probability
   * averaged over the PUBLISHED prior for that shape, never the true number. Resolution still uses the true TN;
   * only the scoring changes. Gate TNs are rolled from GATE_TN_WEIGHTS; every other shape's TN is printed in
   * R5.5, so those stay exact; the Aspect prior is the TN spread of the authored bosses. */
  var _bossTnPrior = null;
  function tnPrior(shape) {
    if (shape === 'gate') return B.GATE_TN_WEIGHTS;
    if (shape !== 'boss') return null;
    if (!_bossTnPrior) {
      var w = {}, bs = (DATA.bosses || []), i, j;
      for (i = 0; i < bs.length; i++) for (j = 0; j < bs[i].aspects.length; j++) {

  /* Every roll time field checkContext produced, so the estimator and the resolver read the same context. */
  function probOpts(o) {
    return { surgeMinus: o.surgeMinus, floor: o.floor, flat: o.flat, push: o.push, twice: o.twice,
      reroll1s: o.reroll1s, noSurge: o.noSurge, surgeOnce: o.surgeOnce };
  }
  function probFor(state, ch, stat, tn, shape, opts) {
    opts = opts || {};
    var o = checkContext(state, ch, { stat: stat, tn: tn, shape: shape, boss: !!opts.boss,
      push: !!opts.push, twice: !!opts.twice, firstOfStage: !!opts.firstOfStage, lastOfStage: !!opts.lastOfStage });
    var po = probOpts(o);
    if (!tnVisible(state, ch)) {

        var tot = 0, acc = 0;
        for (var k in prior) if (prior.hasOwnProperty(k)) { tot += prior[k]; acc += prior[k] * passProb(o.die, +k, po); }
        if (tot > 0) return acc / tot;

    var t = effToughness(ch);

    return best;

    var po = probOpts(o), e = 1, j;

          var p0 = probFor(state, ch3, st3, s3.tns[k], s3.shape);

    },
    /* R5.10 (Depth I to IV): at a stage end with fewer than three living deployed, bring in a reserve or pay the

  "lines": {
    "origins": {
      "hearthborn": {
        "name": "Hearthborn",
        "blurb": "Raised where the fire never dies, you carry two more Toughness and your bench eases the sorest ally by one."
      },
      "ashwalker": {
        "name": "Ashwalker",
        "blurb": "Out of the burned places you always carry something, a fresh relic at the start of every quest."
      },
      "fenwise": {
        "name": "Fenwise",
        "blurb": "Marsh raised and quick to read the reeds, your WITS die surges on its top face and the face beneath it."
      },
      "ironbound": {
        "name": "Ironbound",
        "blurb": "Rust rings your wrists, so you carry one more Armor and every floor on your gear reads one higher."
      },
      "straycall": {
        "name": "Straycall",
        "blurb": "Called in from the cold with no name, you roll MIGHT and GRACE one rung higher and NERVE one rung lower."
      },
      "lanternborn": {
        "name": "Lanternborn",
        "blurb": "Born under a lantern that never gutters, you see hidden numbers, and once a stage you look ahead."
      },
      "saltblood": {
        "name": "Saltblood",
        "blurb": "Brine in your veins keeps you standing, and your first Push each stage costs you no Strain."
      },
      "unmarked": {
        "name": "Unmarked",
        "blurb": "No mark, no clan, no grave dug for you yet, so a fifth die rolls at creation and replaces your lowest stat."
      }
    },
    "callings": {
      "vanguard": {
        "name": "Vanguard",
        "blurb": "You go down the rope first, so your MIGHT floor is half its die, four at best, and Strikes land one less."
      },
      "cutpurse": {
        "name": "Cutpurse",
        "blurb": "Quick fingers in the dark, your first GRACE check each stage rolls twice and keeps the higher."
      },
      "scholar": {
        "name": "Scholar",
        "blurb": "You read the failures like tide marks, so after an ally fails this stage you add two to your next check."
      },
      "zealot": {
        "name": "Zealot",
        "blurb": "The hurt is your hymn, and while you carry two or more Strain every check you make adds two."
      },
      "warden": {
        "name": "Warden",
        "blurb": "You keep the watch while the others sleep in the wet, and your bench clears three Strain instead of one."
      },
      "gambler": {
        "name": "Gambler",
        "blurb": "Bone dice in a horn cup, once a stage you redraw one check, yours or an ally's, and the new result stands."
      },
      "herald": {
        "name": "Herald",

/* ============================== VIEW ============================== */
/* P0 paints the title and the how screen. Every later screen is added here.
   DOM, not canvas: the layout gate measures real rectangles.               */
var VIEW = (function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var current = null;

  function show(id) {
    var all = document.querySelectorAll('.screen'), i;
    for (i = 0; i < all.length; i++) all[i].classList.remove('on');
    var el = $('scr-' + id);
    if (el) { el.classList.add('on'); el.scrollTop = 0; }
    current = id;
    return el;
  }
  function screen() { return current; }

  /* Every player string comes out of DATA.lines, which is the only place one
     lives (R10.7), so the copy law scan reads one bank instead of grepping. */
  function line(path, fallback) {
    var parts = path.split('.'), o = MD.data().lines, i;
    for (i = 0; i < parts.length; i++) { if (!o) break; o = o[parts[i]]; }
    return (typeof o === 'string') ? o : (fallback || '');
  }
  function ui(key) { var u = MD.data().lines.ui || {}; return u[key] || key; }

  function paintTitle(hasSave) {
    $('titleLine').textContent = line('cards.title');
    $('btnBegin').textContent = hasSave ? ui('CONTINUE') : ui('BEGIN');
    $('btnHow').textContent = ui('HOW');
    $('btnGotIt').textContent = ui('GOT IT');
  }
  function paintHow() {
    var host = $('howLines'), lines = MD.data().lines.how || [], i;
    host.textContent = '';
    for (i = 0; i < lines.length; i++) {
      var row = document.createElement('div'); row.className = 'howline';
      var n = document.createElement('div'); n.className = 'n'; n.textContent = String(i + 1);
      var p = document.createElement('p'); p.textContent = lines[i];
      row.appendChild(n); row.appendChild(p); host.appendChild(row);
    }
  }
  function setToggle(id, on) { $(id).classList.toggle('on', !!on); }

  return { show: show, screen: screen, line: line, ui: ui,
    paintTitle: paintTitle, paintHow: paintHow, setToggle: setToggle, $: $ };
})();

/* ============================== SAVE ============================== */
/* Read, modify, write on EVERY write. Two tabs share one localStorage, and a
   blob loaded at boot and written back wholesale lets the second tab stamp its
   stale snapshot over the first tab's work; a lifetime total then goes
   BACKWARDS, which is the one thing a lifetime total must never do.
   ⛔ Unknown top level fields are PRESERVED. A save rebuilt from a whitelist of
   known fields deletes everything it has not heard of, which cost this fleet a
   journal and a medal table in one afternoon.
   ⛔ The wall and the legacies live in their OWN key: they grow without limit and
   the main key is rewritten at every step transition.                        */
var SAVE = (function () {
  'use strict';
  var KEY = 'lw_marrowdeep_v1', HALL_KEY = 'lw_marrowdeep_v1_hall', V = 1;

  function blank() {
    return { v: V, seq: 0, account: null, roster: [], relics: {}, quest: null,
      pending: null, recent: [], sound: 1, motion: 1, seen: { how: 0, legacies: [] } };
  }
  function blankHall() { return { v: V, wall: [], legacies: [] }; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function readRaw(k, mk) {
    var raw = lsGet(k); if (!raw) return mk();
    var got; try { got = JSON.parse(raw); } catch (e) { return mk(); }
    if (!got || typeof got !== 'object') return mk();
    /* the blank supplies what is missing, `got` supplies what is there, and a
       field neither of us knows about still survives the round trip */
    var out = mk(), key;
    for (key in got) if (Object.prototype.hasOwnProperty.call(got, key)) out[key] = got[key];
    return out;
  }
  function read() { return readRaw(KEY, blank); }
  function readHall() { return readRaw(HALL_KEY, blankHall); }

  function write(mut) {
    var s = read();
    mut(s);
    var cur = read();
    s.seq = Math.max(s.seq | 0, cur.seq | 0) + 1;
    if (s.account && cur.account) {                       /* counters only ever go up */
      s.account.renownLifetime = Math.max(s.account.renownLifetime | 0, cur.account.renownLifetime | 0);
      s.account.questsCompleted = Math.max(s.account.questsCompleted | 0, cur.account.questsCompleted | 0);
    }
    lsSet(KEY, JSON.stringify(s));
    return s;
  }
  function writeHall(mut) {
    var h = readHall(); mut(h);
    var cur = readHall(), seen = {}, i, merged = [];
    var all = h.wall.concat(cur.wall);                    /* union on id, newest first */
    for (i = 0; i < all.length; i++) if (all[i] && !seen[all[i].id]) { seen[all[i].id] = 1; merged.push(all[i]); }
    merged.sort(function (a, b) { return (b.t | 0) - (a.t | 0); });
    h.wall = merged;
    lsSet(HALL_KEY, JSON.stringify(h));
    return h;
  }
  function wipe() { lsSet(KEY, JSON.stringify(blank())); lsSet(HALL_KEY, JSON.stringify(blankHall())); }
  function exists() { return !!lsGet(KEY); }

  return { read: read, write: write, readHall: readHall, writeHall: writeHall,
    blank: blank, wipe: wipe, exists: exists, KEY: KEY, HALL_KEY: HALL_KEY };
})();

// ---- TEST_EXPORT_START ----
/* The in page assertion harness. `?test=1` runs it into a panel; sim.js runs the
   same source in Node. Nothing here touches the DOM.                          */
var TEST = (function () {
  'use strict';
  var fails = [], count = 0, groups = {};
  function note(group, ok, label, detail) {
    count++;
    groups[group] = groups[group] || { n: 0, bad: 0 };
    groups[group].n++;
    if (!ok) { groups[group].bad++; fails.push(label + (detail ? '   ' + detail : '')); }
  }
  function ok(group, cond, label, detail) { note(group, !!cond, label, detail); }
  function eq(group, a, b, label) { note(group, a === b, label, '[got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b) + ']'); }
  function near(group, a, b, tol, label) { note(group, Math.abs(a - b) <= tol, label, '[got ' + a + ' want ' + b + ' +/- ' + tol + ']'); }
  function throws(group, fn, label) {
    var threw = false; try { fn(); } catch (e) { threw = true; }
    note(group, threw, label, '[did not throw]');
  }
  function report() { return { count: count, fails: fails.slice(), groups: groups }; }
  function reset() { fails = []; count = 0; groups = {}; }
  return { ok: ok, eq: eq, near: near, throws: throws, report: report, reset: reset };
})();
// ---- TEST_EXPORT_END ----

/* ============================== BOOT ============================== */
var STAMP = '20260908a';

var BOOT = (function () {
  'use strict';
  var framed = false;
  try { framed = window.parent !== window; } catch (e) { framed = true; }

  function tellArcade() { try { parent.postMessage({ sws: 'ready' }, '*'); } catch (e) {} }

  function start() {
    var save = SAVE.read();
    MD.setData(DATA_BANKS);
    VIEW.paintTitle(!!save.account);
    VIEW.paintHow();
    VIEW.setToggle('btnSound', save.sound !== 0);
    VIEW.setToggle('btnMotion', save.motion !== 0);
    VIEW.show('title');

    VIEW.$('btnHow').addEventListener('click', function () { VIEW.show('how'); });
    VIEW.$('btnGotIt').addEventListener('click', function () {
      SAVE.write(function (s) { s.seen.how = 1; });
      VIEW.show('title');
    });
    VIEW.$('btnSound').addEventListener('click', function () {
      var s = SAVE.write(function (s) { s.sound = s.sound === 0 ? 1 : 0; });
      VIEW.setToggle('btnSound', s.sound !== 0);
    });
    VIEW.$('btnMotion').addEventListener('click', function () {
      var s = SAVE.write(function (s) { s.motion = s.motion === 0 ? 1 : 0; });
      VIEW.setToggle('btnMotion', s.motion !== 0);
    });
    /* P0 stops at the title. BEGIN reaches creation in P1; until then it says so
       rather than doing nothing, because a dead control is worse than a plain one. */
    VIEW.$('btnBegin').addEventListener('click', function () { VIEW.show('how'); });

    /* ⛔ Readiness is POSITIVE and DOM shaped. Fathom's gates wait on a render
       loop frame counter; this game is DOM with CSS animations and has no such
       loop, so that wait would hang for its full timeout on a page that booted
       perfectly. `ready` goes true only once the title's own nodes are in the
       document and one of them has a real rectangle. */
    var mark = VIEW.$('titleMark');
    MD_DEV.ready = !!(mark && mark.getBoundingClientRect().width > 1);
    tellArcade();
  }

  window.MD_DEV = {
    stamp: STAMP,
    ready: false,
    screen: function () { return VIEW.screen(); },
    save: function () { return SAVE.read(); },
    hall: function () { return SAVE.readHall(); },
    data: function () { return MD.data(); },
    balance: function () { return MD.BALANCE; },
    /* a gate may SEED (an input) but never SET (a state): a fixture is written to
       storage and the page RELOADS into it, which is the path a player takes */
    fixture: function (save, hall) {
      try {
        localStorage.setItem(SAVE.KEY, JSON.stringify(save));
        if (hall) localStorage.setItem(SAVE.HALL_KEY, JSON.stringify(hall));
      } catch (e) {}
      location.reload();
    },
    wipe: function () { SAVE.wipe(); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
  window.addEventListener('load', function () {
    tellArcade();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=' + STAMP).catch(function () {});
    }
  });
  return { framed: framed };
})();
</script>
