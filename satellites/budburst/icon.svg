<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1c2614"/>
      <stop offset="100%" stop-color="#0d100c"/>
    </radialGradient>
    <radialGradient id="p0" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#f2a3b8"/><stop offset="55%" stop-color="#e0728f"/><stop offset="100%" stop-color="#a83f5a"/></radialGradient>
    <radialGradient id="p1" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#f2d488"/><stop offset="55%" stop-color="#e2b23c"/><stop offset="100%" stop-color="#9a7614"/></radialGradient>
    <radialGradient id="p2" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#b6e08c"/><stop offset="55%" stop-color="#7ab356"/><stop offset="100%" stop-color="#3f6f22"/></radialGradient>
    <radialGradient id="p3" cx="38%" cy="34%" r="70%"><stop offset="0%" stop-color="#a3d8ec"/><stop offset="55%" stop-color="#4fb0d8"/><stop offset="100%" stop-color="#1f6f92"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- burst rays -->
  <g stroke="#c8a84b" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="150" x2="256" y2="96"/>
    <line x1="362" y1="256" x2="416" y2="256"/>
    <line x1="150" y1="256" x2="96" y2="256"/>
    <line x1="332" y1="180" x2="372" y2="140"/>
    <line x1="180" y1="180" x2="140" y2="140"/>
  </g>
  <!-- cluster of buds bursting into bloom -->
  <circle cx="200" cy="300" r="58" fill="url(#p2)" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
  <circle cx="312" cy="300" r="58" fill="url(#p3)" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
  <circle cx="256" cy="216" r="66" fill="url(#p0)" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
  <circle cx="256" cy="356" r="50" fill="url(#p1)" stroke="rgba(0,0,0,.2)" stroke-width="4"/>
  <!-- flower glyph on the top bud -->
  <g fill="rgba(0,0,0,.3)" transform="translate(256,216)">
    <circle cx="0" cy="-26" r="15"/><circle cx="25" cy="-8" r="15"/><circle cx="15" cy="21" r="15"/><circle cx="-15" cy="21" r="15"/><circle cx="-25" cy="-8" r="15"/>
    <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,.5)"/>
  </g>
  <!-- specular highlights -->
  <ellipse cx="238" cy="196" rx="20" ry="12" fill="rgba(255,255,255,.35)"/>
</svg>
