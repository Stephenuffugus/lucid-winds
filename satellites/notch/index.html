<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notch</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../math/core/core.css?v=20260916e">
<link rel="manifest" href="./manifest.webmanifest?v=20260916e">
<style>
  body { background: #2a2119; color: #efe3cf; overflow-x: hidden; }
  main { max-width: 520px; margin: 0 auto; padding: 64px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* the bench: square, never wider than the screen or 420 px; the whole of it takes the drag */
  #bench { display: block; width: min(100%, 420px); aspect-ratio: 1 / 1; touch-action: none; cursor: grab; border-radius: 10px; }
  #bench:active { cursor: grabbing; }
  #bench:focus-visible { outline: 3px solid #d9a45b; outline-offset: 4px; }
  #controls { width: min(100%, 420px); display: flex; justify-content: space-between; align-items: center; min-height: 64px; }
  #aside, #next { min-width: 64px; min-height: 64px; background: #3a2c20; border: 2px solid #6b5238; color: #efe3cf; }
  #aside svg { display: block; }
  #aside[hidden], #next[hidden] { display: inline-flex; visibility: hidden; }
  #first[hidden], #play[hidden] { display: none; }
  #first { position: fixed; inset: 0; z-index: 30; background: #2a2119; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  /* the wordless loop: a piece turns into its notch and drops */
  .loop { position: relative; width: 160px; height: 120px; border-radius: 10px; background: #5a4330; overflow: hidden; }
  .loop i { position: absolute; left: 50px; top: 30px; width: 60px; height: 40px; background: #1b140e; clip-path: polygon(0 0, 100% 0, 100% 50%, 34% 50%, 34% 100%, 0 100%); }
  .loop b { position: absolute; left: 50px; top: 30px; width: 60px; height: 40px; background: #c89a63; clip-path: polygon(0 0, 100% 0, 100% 50%, 34% 50%, 34% 100%, 0 100%); animation: seat 4s infinite; transform-origin: 30% 40%; }
  @keyframes seat { 0%, 15% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
  @media (prefers-reduced-motion: reduce) { .loop b { animation: none; } }
  .doors { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-inline: 16px; }
  .door.lw-btn { min-width: 72px; min-height: 72px; padding: 8px; background: #3a2c20; border: 2px solid #6b5238; }
  .door svg { display: block; }
  .door.lw-btn[hidden] { display: none; }
  /* FIND (3.10): the piece above, the carving's regions below as buttons, three to a row */
  #find { width: min(100%, 420px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #find[hidden] { display: none; }
  body[data-mode="find"] #bench, body[data-mode="find"] #aside { display: none; }
  #target { display: block; padding: 6px; border-radius: 8px; background: #3a2c20; }
  #panel { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; border-radius: 10px; background: #5a4330; box-sizing: border-box; }
  #panel .region.lw-btn { min-height: 88px; padding: 4px; display: flex; align-items: center; justify-content: center; background: #4a3726; border: 2px solid #6b5238; }
  #panel .region svg { display: block; width: 100%; max-width: 88px; height: auto; }
  #panel .region[aria-pressed="true"] { box-shadow: inset 0 0 0 3px #efe3cf; }
  #panel .region.is-piece { border-color: #d9a45b; box-shadow: 0 0 0 3px #d9a45b; }
  #panel .region[aria-pressed="true"].is-piece { box-shadow: inset 0 0 0 3px #efe3cf, 0 0 0 3px #d9a45b; }
  /* the village, after a clean session */
  #shelf { position: fixed; inset: 0; z-index: 25; background: #2a2119; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-inline: 16px; }
  #shelf[hidden] { display: none; }
  .shelf-frame { max-width: 100%; padding: 8px; border: 3px solid #6b5238; background: #5a4330; box-sizing: border-box; }
  #shelf-canvas { display: block; max-width: 100%; image-rendering: pixelated; }
  #shelf-go { min-width: 64px; min-height: 64px; font-size: var(--type-26); background: #3a2c20; border: 2px solid #6b5238; color: #efe3cf; }
  @media (max-height: 600px) { main { padding-top: 56px; gap: 8px; } #bench { width: min(100%, 320px); } }
</style>
</head>
<body>
<div id="first">
  <div class="loop" aria-hidden="true"><i></i><b></b></div>
  <div class="doors">
    <button id="start" class="lw-btn door" type="button"></button>
    <button id="start-find" class="lw-btn door" type="button"></button>
  </div>
</div>
<main id="play">
  <svg id="bench" tabindex="0" role="img"></svg>
  <section id="find" hidden>
    <div id="target" role="img"></div>
    <div id="panel"></div>
  </section>
  <div id="controls">
    <button id="aside" class="lw-btn" type="button"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect x="4" y="26" width="32" height="6" fill="#6b5238"/><path d="M12 8h16v8h-8v8h-8z" fill="#c89a63"/></svg></button>
    <button id="next" class="lw-btn" type="button" hidden>&#10132;</button>
  </div>
</main>
<script type="module" src="./main.js?v=20260916e"></script>
</body>
</html>
