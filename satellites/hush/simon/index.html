<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hush says</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../math/core/core.css?v=20260916d">
<style>
  body { background: #f3e3c6; color: #2b2a26; overflow-x: hidden; }
  main { max-width: 720px; margin: 0 auto; padding: 72px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  /* one command, as large as the room needs to read it */
  #say { font-size: var(--type-26); min-height: 1.4em; color: #5f7d4a; }
  #command { font-size: clamp(2.2rem, 11vw, 5rem); line-height: 1.1; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }
  #how { font-size: var(--type-20); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .row .lw-btn { min-width: 112px; min-height: 64px; padding: 8px 18px; font-size: var(--type-20); }
  .row .lw-btn[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <p id="how"></p>
  <p id="say" aria-live="polite"></p>
  <div id="command" aria-live="polite"></div>
  <div class="row">
    <button id="simon-go" class="lw-btn" type="button"></button>
    <button id="again" class="lw-btn" type="button" hidden></button>
    <button id="home" class="lw-btn" type="button"></button>
  </div>
</main>
<script type="module" src="./main.js?v=20260916d"></script>
</body>
