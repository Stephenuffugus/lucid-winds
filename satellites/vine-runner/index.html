<script>
/* ============================================================
   VINE RUNNER — Sonic-2-special-stage-style botanical halfpipe
   ------------------------------------------------------------
   ART IMPORT: paste your rendered image URLs (or base64 data
   URIs) into the ART object below. Any slot left as "" keeps
   its built-in placeholder. Transparent PNGs, rear-view for
   the runner. Frame arrays animate in order, ~10fps.
   ============================================================ */
const ART = {
  runnerRun:  ["art/run.png"],   // ChatGPT art, magenta knocked out (2026-07-03)
  runnerLeanL: "art/lean-l.png",
  runnerLeanR: "art/lean-r.png",
  runnerJump:  "art/jump.png",
  runnerHit:   "art/hit.png",
  seed:        ["art/seed.png"],
  thorn:       "art/thorn.png",
  boostDew:    "art/boost.png",
  gateBloom:   "art/bloom.png",
  bgVista:     "art/vista.png",
  hudSeed:     "art/hud-seed.png",
  titleLogo:   "art/title.png",  // NEW — title screen logo
  leaf:        "art/leaf.png",   // NEW — vitality pip icon
};

// ---- character skins ------------------------------------------------
// Each skin is the SAME 5 motion poses (Stephen reuses the runner prompts so
// every skin animates identically). Default = the base art/ folder.
// TO ADD A SKIN: drop 5 knocked-out PNGs in art/skins/<id>/ named
//   run.png · lean-l.png · lean-r.png · jump.png · hit.png
// then add ONE line to SKINS below. That's the whole wiring. Missing poses fall
// back to the default skin, so a partial skin still plays.
// Ordered by unlock level — a growth ladder that mirrors climbing the tower.
// unlock = the best LEVEL you must reach (0 = always available).
const SKINS = [
  { id:"sprout", name:"Sprout", dir:"art",              unlock:0  },
  { id:"bud",    name:"Bud",    dir:"art/skins/bud",    unlock:10 },  // Stephen art 2026-07-03
  { id:"flower", name:"Flower", dir:"art/skins/flower", unlock:25 },  // Stephen art 2026-07-03
  // { id:"...", name:"...",   dir:"art/skins/...",    unlock:40 },   // ← add more, ordered by unlock
];
let skinIdx = 0;
try{ var _sk=localStorage.getItem('vine-runner-skin');
  if(_sk!=null){ for(var _i=0;_i<SKINS.length;_i++) if(SKINS[_i].id===_sk){ skinIdx=_i; break; } }
}catch(e){}
function curSkin(){ return SKINS[skinIdx] || SKINS[0]; }
function skinUnlocked(s){ return bestStage >= (s.unlock||0); }     // bestStage = best LEVEL reached (persisted)
function setSkin(d){                                               // cycle, skipping still-locked skins
  var n=skinIdx;
  for(var g=0; g<SKINS.length; g++){
    n=(n+d+SKINS.length)%SKINS.length;
    if(skinUnlocked(SKINS[n])){ skinIdx=n; break; }
  }
  try{ localStorage.setItem('vine-runner-skin', curSkin().id); }catch(e){}
  if(typeof beep==="function") beep(720,0.06,"sine",0.05);
}
function nextLockedSkin(){ for(var i=0;i<SKINS.length;i++) if(!skinUnlocked(SKINS[i])) return SKINS[i]; return null; }
// returns a skin that JUST unlocked (once), else null — drives the reward toast
function checkUnlock(){
  var count=0; for(var i=0;i<SKINS.length;i++) if(skinUnlocked(SKINS[i])) count++;
  var seen=1; try{ seen=parseInt(localStorage.getItem('vine-runner-unlockseen')||'1',10)||1; }catch(e){}
  if(count>seen){ try{ localStorage.setItem('vine-runner-unlockseen', String(count)); }catch(e){} return SKINS[count-1]; }
  return null;
}
const _POSE_FILE = { run:"run.png", run2:"run-2.png", leanL:"lean-l.png", leanR:"lean-r.png", jump:"jump.png", hit:"hit.png" };
function skinPose(pose){
  var s=curSkin(), f=_POSE_FILE[pose];
  var im=img(s.dir+"/"+f);
  if(im) return im;
  // Base-skin fallback for missing poses — EXCEPT run2: mixing another
  // character's second run frame into this skin's stride would flicker
  // between two different characters. A skin without run-2.png uses the
  // mirror-step instead (drawRunner).
  if(pose!=="run2" && s.dir!=="art"){ im=img("art/"+f); if(im) return im; }
  return null;
}

// ---- image loader -------------------------------------------------
const IMG = {};
function img(src){
  if(!src) return null;
  if(IMG[src]) return IMG[src].complete && IMG[src].naturalWidth ? IMG[src] : null;
  const im = new Image(); im.crossOrigin = "anonymous"; im.src = src; IMG[src] = im;
  return null;
}
function frameOf(arr, t, fps){ // returns loaded Image or null
  if(!arr || !arr.length) return null;
  return img(arr[Math.floor(t*fps) % arr.length]);
}

// ---- canvas -------------------------------------------------------
const cv = document.getElementById('game');
const cx2d = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx2d.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

// ---- palette ------------------------------------------------------
const C = {
  bgTop:"#04120A", bgBot:"#0B2415",
  ringDark:"#173D22", ringMid:"#245C33", ringLite:"#3D8A50",
  rib:"#2F7040", glow:"#B4E36A",
  seed:"#FFD75E", seedCore:"#FFF3C0",
  thorn:"#C0402F", thornDark:"#7A2418",
  cream:"#F2F0DC", pink:"#E86FA4",
  runner:"#8CCB5E", runnerDark:"#4E8A3A", leaf:"#5FAE49",
};

// ---- stage themes: 6 gardens, each with its own vine + atmosphere ----
const THEMES=[
 {name:"VERDANT VINE", hue:140, nodeHue:100, sat:42, bgTop:"#04120A", bgMid:"#0A2A16", bgBot:"#0B2415", glow:"#B4E36A", spore:"#CFEFA8", vista:"212,240,150"},
 {name:"SUNSET IVY",   hue:32,  nodeHue:48,  sat:52, bgTop:"#170D03", bgMid:"#33200A", bgBot:"#291505", glow:"#FFC86B", spore:"#FFE0A8", vista:"255,205,130"},
 {name:"MOONFLOWER",   hue:252, nodeHue:280, sat:44, bgTop:"#0A0716", bgMid:"#171034", bgBot:"#120B28", glow:"#B9A6FF", spore:"#D9CFFF", vista:"190,170,255"},
 {name:"ROSE BRAMBLE", hue:332, nodeHue:352, sat:46, bgTop:"#160308", bgMid:"#33101C", bgBot:"#270A14", glow:"#FF9EC4", spore:"#FFD3E3", vista:"255,170,200"},
 {name:"FROST FERN",   hue:187, nodeHue:165, sat:46, bgTop:"#03141A", bgMid:"#0A2C33", bgBot:"#082530", glow:"#9FE8FF", spore:"#D3F5FF", vista:"170,230,255"},
 {name:"GOLDEN ROOT",  hue:78,  nodeHue:58,  sat:44, bgTop:"#10120A", bgMid:"#262B0E", bgBot:"#1D220B", glow:"#E2E86F", spore:"#F0F5B8", vista:"230,240,150"},
];
// 100-level tower: the 6 hand-tuned palettes cycle so EVERY level is a new colour
// (the clearest "you levelled up" signal), and each full pass up the tower drifts
// the tube hue so level 7's VERDANT isn't identical to level 1's — colour keeps
// evolving all the way to the top.
function theme(){
  var base = THEMES[(stage-1)%THEMES.length];
  var loop = Math.floor((stage-1)/THEMES.length);      // 0,1,2… each lap up the tower
  var drift = ((loop*29) % 62) - 31;                    // -31..+31° tube-hue rotation per lap
  return { name:base.name, sat:base.sat,
           hue:base.hue+drift, nodeHue:base.nodeHue+drift,
           bgTop:base.bgTop, bgMid:base.bgMid, bgBot:base.bgBot,
           glow:base.glow, spore:base.spore, vista:base.vista };
}
var TOWER_MAX = 100;
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }

// ---- tuning -------------------------------------------------------
const FOV       = 370;      // projection focal length (lower = deeper perspective)
const R         = () => Math.min(W*0.46, H*0.62);  // tube radius on screen
const ASPECT    = 0.86;     // vertical squash of the tube
const FAR       = 3000;     // draw distance
const RING_GAP  = 170;      // world units between vine bands
// --- steering: target angular VELOCITY, critically damped (research-backed
//     rewrite 2026-07-03). Input sets a target; angV eases toward it with a
//     framerate-independent exp smoother. No acceleration/whip/pendulum stack —
//     that second-order model was the floaty, imprecise feel. ---
const TURN_V_MAX   = 5.6;   // max angular velocity from full input (rad/s)
const STEER_LAMBDA = 16;    // how fast angV eases to target (higher = snappier, ~0.14s)
const CAM_LAMBDA   = 7;     // camera roll — deliberately slower than the player
const PIPE_G_IDLE  = 1.2;   // gentle settle to the bottom ONLY when not steering (whisper)
const ANGV_MAX     = 9.0;   // safety clamp
const STEER_DZ     = 0.06;  // dead zone
const JUMP_V    = 560;      // px/s (in radius-space)
const GRAV      = 1500;
const HIT_ARC   = 0.34;     // collision arc tolerance (generous)
const HIT_Z     = 55;

// vine curvature (screen-space amplitude in px, by world z)
function curveX(z){ return Math.sin(z*0.00115)*180 + Math.sin(z*0.00043+1.7)*300; }
function curveY(z){ return Math.sin(z*0.00089+2.4)*95; }

// ---- game state ---------------------------------------------------
let state="title";            // title | play | gate | over | clear
let playerZ=0, speed=600, baseSpeed=600;
let spores=[];
for(let i=0;i<70;i++) spores.push({z:Math.random()*FAR, ang:Math.random()*6.283, rf:0.25+Math.random()*0.65});
let ang=0, angV=0, h=0, vh=0, grounded=true;
let inv=0, hitFlash=0, animT=0, elapsed=0, freezeT=0, levelFlash=0;
// steering sensitivity — player-tunable on the pause screen, persisted
let sens=(()=>{ try{ const s=parseFloat(localStorage.getItem('vine-runner-sens')); return (s>=0.5&&s<=1.8)?s:1; }catch(e){ return 1; } })();
function setSens(d){ sens=Math.max(0.5,Math.min(1.8, Math.round((sens+d)*100)/100)); try{localStorage.setItem('vine-runner-sens', sens);}catch(e){} if(typeof beep==="function") beep(660,0.05,"sine",0.05); }
// ONE layout used by both drawPause and the tap handler so hit zones always match
// the drawn buttons (the old mismatch + tap-anywhere-resume made +/- feel broken).
function pauseLayout(){ return {
  resume:{x:W/2, y:H*0.37, w:200, h:56},
  minus: {x:W/2-108, y:H*0.55, r:30},
  plus:  {x:W/2+108, y:H*0.55, r:30},
  sound: {x:W/2, y:H*0.67, r:34},
  exit:  {x:W/2, y:H*0.79, w:200, h:48},
}; }
function inRect(x,y,r){ return Math.abs(x-r.x)<=r.w/2 && Math.abs(y-r.y)<=r.h/2; }
function pauseTap(x,y){
  var L=pauseLayout();
  if(inRect(x,y,L.resume)){ state="play"; return true; }
  if(Math.hypot(x-L.minus.x,y-L.minus.y)<L.minus.r+10){ setSens(-0.15); return true; }
  if(Math.hypot(x-L.plus.x, y-L.plus.y) <L.plus.r+10){ setSens(0.15);  return true; }
  if(Math.hypot(x-L.sound.x,y-L.sound.y)<L.sound.r+10){ muted=!muted;   return true; }
  if(inRect(x,y,L.exit)){ if(window.SWS_EXIT) window.SWS_EXIT(); return true; }
  return false;   // tap elsewhere does NOTHING — resume is the explicit button only
}
// level-complete celebration: the run PAUSES at the bloom and waits for the player
// to press NEXT LEVEL, so the next level never starts before they're ready.
function gateBtn(){ return {x:W/2, y:H*0.72, w:230, h:62}; }
function advanceLevel(){ if(state==="gate") nextStage(); }   // victory (L100) handled at gate entry
let seeds=0, quota=20, stage=1, gateZ=10500;
let objects=[], particles=[], floats=[];
let spawnedZ=800, bannerT=0, bannerMsg="", shake=0, gateT=0, overT=0, clearT=0;
let steerT=0, steerDir=0, loopIdx=0;
let combo=0, comboT=0, bestCombo=0;
let boostT=0, slowT=0, speedNow=600;
let camA=0;   // camera roll — tracks the player so the WORLD rotates, not the sprite
// bestStage = best LEVEL ever reached; loaded on boot so skin unlocks persist.
let bestStage=(function(){ try{ var b=JSON.parse(localStorage.getItem('vine-runner-best')||'{}'); return Math.max(1, b.stage||1); }catch(e){ return 1; } })();
if(!skinUnlocked(SKINS[skinIdx])) skinIdx=0;          // safety: never boot into a locked skin
let endless=false, muted=false, totalSeeds=0;
function saveBest(){ try{ var b=JSON.parse(localStorage.getItem('vine-runner-best')||'{}'); b.stage=Math.max(b.stage||0,bestStage); b.combo=Math.max(b.combo||0,bestCombo); localStorage.setItem('vine-runner-best', JSON.stringify(b)); }catch(e){} }
let overUnlock=null;   // skin that just unlocked this run → celebrated on the over/clear screen
// vitality: forgiving health so flow isn't broken by seed-count fail-walls.
// Thorns cost a leaf; collecting seeds slowly regrows one. Run out = wilt.
const VIT_MAX=3, VIT_REGEN=40;
let vitality=VIT_MAX, vitMark=0;

function wrapA(a){ a=(a+Math.PI)%(Math.PI*2); if(a<0)a+=Math.PI*2; return a-Math.PI; }

// ---- portal integration: emits game events to a parent frame ------
function portalEvent(ev){
  try{
    var payload={game:"vine-runner", event:ev, stage:stage,
        seeds:seeds, quota:quota, bestCombo:bestCombo, bestStage:bestStage,
        distance:Math.floor(playerZ/100)};
    // ALWAYS deliver to this window too — the vendored earn bridge listens
    // here; posting only to the parent starved it of every event (audit
    // 2026-07-03: the game paid zero sunbeams in every configuration).
    try{ window.postMessage(payload, "*"); }catch(e2){}
    if(window.parent && window.parent!==window)
      window.parent.postMessage(payload, "*");
  }catch(e){}
}

function resetRun(full){
  playerZ=0; ang=0; angV=0; h=0; vh=0; grounded=true; inv=0; hitFlash=0;
  objects=[]; particles=[]; floats=[]; spawnedZ=800; elapsed=0;
  steerT=0; steerDir=0; loopIdx=0; combo=0; comboT=0; boostT=0; slowT=0; camA=0;
  shake=0; freezeT=0;
  if(full){ stage=1; baseSpeed=600; bestCombo=0; endless=false; }
  speed=baseSpeed; speedNow=baseSpeed; seeds=0;
  vitality=VIT_MAX; vitMark=0;
}

// pre-generate the entire stage, count what's actually there,
// and demand 2/3 of it — difficulty is now consistent by construction
function buildStage(){
  objects=[]; spawnedZ=800;
  var L = Math.min(stage, TOWER_MAX);                    // level 1..100
  // levels are bite-sized and roughly even in TIME — length grows a little to keep
  // pace as the vine speeds up the higher you climb.
  gateZ = 11200 + L*128;                                 // ~11.3k (L1) → ~24k (L100) ≈ 21-22s/level (Stephen 2026-07-03: levels were far too short)
  baseSpeed = 540 + (L-1)*5.6;                           // 540 (L1) → ~1094 (L100): faster + faster
  var density = 1 - Math.min(0.36, (L-1)*0.006);         // patterns pack tighter across the tower
  while(spawnedZ < gateZ - 700){
    spawnPattern(spawnedZ);
    spawnedZ += (500 + Math.random()*360) * density;     // tighter packing (2026-07-03 difficulty bump)
  }
  // patterns can extend up to ~1200 past their start; anything that spilled
  // into the final corridor (or past the bloom) is dropped so the last 700
  // units are a guaranteed clean glide, and quota math only counts what is
  // actually collectible (audit 2026-07-03).
  objects = objects.filter(o=>o.z <= gateZ-700);
  speed = baseSpeed; speedNow = baseSpeed;
  totalSeeds = objects.filter(o=>o.type==="seed").length;
  quota = Math.max(10, Math.round(totalSeeds*0.66));
}

function startGame(full){
  resetRun(full); buildStage(); state="play";
  bannerMsg="LEVEL "+stage+" \u00b7 "+theme().name; bannerT=2.0; levelFlash=0.6;
}
function nextStage(){
  stage++; bestStage=Math.max(bestStage,stage);          // baseSpeed now derives from level in buildStage
  resetRun(false); buildStage(); state="play";
  bannerMsg="LEVEL "+stage+" \u00b7 "+theme().name; bannerT=2.0; levelFlash=0.6;
}

// ---- spawner ------------------------------------------------------
function spawnPattern(z){
  const diff = Math.min(1, (stage-1)/34);        // ramps hazard density across the tower (max ~L35)
  const r = Math.random();
  const a0 = (Math.random()*2-1)*1.3;
  const thornP = 0.18 + diff*0.20;               // hazard share grows with stage (bumped 2026-07-03: too easy)

  if(r < 0.06){                                  // dew boost pod
    objects.push({z, ang:(Math.random()*2-1)*1.2, h:0, type:"boost"}); return;
  }
  if(r < 0.06 + thornP){                         // hazards (scaled by stage)
    const hr = Math.random();
    if(hr < 0.42){                               // thorn cluster with one gap
      const gap = Math.floor(Math.random()*3)-1;
      for(let i=-1;i<=1;i++) if(i!==gap) objects.push({z, ang:i*0.72, h:0, type:"thorn"});
    } else if(hr < 0.72){                         // gauntlet — staggered thorns, thread between
      const s = Math.random()<0.5? -1:1;
      for(let i=0;i<3;i++) objects.push({z:z+i*230, ang:s*(i%2?0.85:-0.85)*(0.5+diff*0.35), h:0, type:"thorn"});
    } else {                                      // pinch — thorn walls with a seed reward in the gap
      for(let i=0;i<2;i++) objects.push({z, ang:(i?1:-1)*(0.95-diff*0.22), h:0, type:"thorn"});
      objects.push({z, ang:0, h:0, type:"seed"});
    }
    return;
  }

  const sr = Math.random();                       // seed shapes
  if(sr < 0.13){                                  // tight trio (magnet-friendly)
    for(let i=-1;i<=1;i++) objects.push({z, ang:a0*0.4+i*0.30, h:0, type:"seed"});
  } else if(sr < 0.28){                            // staircase sweep — hold one way through it
    const dir = Math.random()<0.5? -1:1;
    for(let i=0;i<5;i++) objects.push({z:z+i*RING_GAP, ang:a0*0.4 + dir*(i-2)*0.26, h:0, type:"seed"});
  } else if(sr < 0.43){                            // chicane — S-weave (rewards the snappy steering)
    for(let i=0;i<7;i++) objects.push({z:z+i*130, ang:a0*0.3 + Math.sin(i*0.9)*(0.7+diff*0.25), h:0, type:"seed"});
  } else if(sr < 0.55){                            // straight line down the vine
    for(let i=0;i<5;i++) objects.push({z:z+i*RING_GAP, ang:a0, h:0, type:"seed"});
  } else if(sr < 0.68){                            // jump rhythm — alternating high/low rows
    for(let i=0;i<6;i++) objects.push({z:z+i*RING_GAP, ang:a0*0.5, h: i%2?150:0, type:"seed"});
  } else if(sr < 0.80){                            // high wall arc — whip up the pipe
    const side = Math.random()<0.5? -1:1;
    for(let i=0;i<5;i++) objects.push({z:z+i*RING_GAP, ang:side*(1.4+i*0.26), h:0, type:"seed"});
  } else if(sr < 0.92){                            // full spiral — loop it for the speed surge
    for(let i=0;i<12;i++) objects.push({z:z+i*110, ang:-Math.PI + i*(Math.PI*2/11), h:0, type:"seed"});
  } else {                                         // floating row — jump for these
    for(let i=0;i<4;i++) objects.push({z:z+i*RING_GAP, ang:a0*0.5, h:120, type:"seed"});
  }
}
// (stage layouts are pre-generated in buildStage — no streaming spawner)

// ---- input --------------------------------------------------------
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
let usingTouch = IS_TOUCH;   // last-input-wins: touch laptops get whichever they used last
let stickX=0, stickActive=false, stickOrigin=null, stickPos=null, stickId=null;
let jumpQueue=0, jumpHeld=false, jumpId=null;
const keys={};
function skinChoices(){ var n=0; for(var i=0;i<SKINS.length;i++) if(skinUnlocked(SKINS[i])) n++; return n; }
window.addEventListener('keydown',e=>{ keys[e.code]=true; usingTouch=false;
  if(state==="title" && skinChoices()>1){
    if(e.code==="ArrowLeft"){ setSkin(-1); return; }
    if(e.code==="ArrowRight"){ setSkin(1); return; }
  }
  if(e.code==="Space"||e.code==="ArrowUp"){ press(); e.preventDefault(); }
  if(e.code==="KeyP" && (state==="play"||state==="pause")) state = state==="play"? "pause":"play";
  if(e.code==="KeyM") muted=!muted;
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==="Space"||e.code==="ArrowUp") jumpHeld=false; });

function press(){
  if(state==="title"){ startGame(true); return; }
  // over/clear ignore taps for a beat so a queued gameplay tap can't skip the
  // recap / unlock toast / TOWER CLEARED moment (audit 2026-07-03).
  if(state==="over"){ if(overT>0.6) startGame(true); return; }
  if(state==="clear"){ if(clearT>0.6){ endless=true; nextStage(); } return; }
  if(state==="gate"){ if(gateT>0.7) advanceLevel(); return; }   // matches the button's full fade-in
  if(state==="pause"){ state="play"; return; }
  jumpQueue=0.12; jumpHeld=true;
}

cv.addEventListener('touchstart',e=>{
  e.preventDefault(); usingTouch=true;
  for(const t of e.changedTouches){
    // pause button — hit radius matches the drawn 20px (+2 slack) so steer
    // drags starting near the corner don't false-pause
    if(state==="play" && Math.hypot(t.clientX-36, t.clientY-92)<22){ state="pause"; return; }
    if(state==="pause"){ pauseTap(t.clientX, t.clientY); return; }
    if(state==="gate"){ if(gateT>0.7 && inRect(t.clientX,t.clientY,gateBtn())) advanceLevel(); return; }  // only the button advances
    if(state==="title" && skinChoices()>1){               // character arrows before start-tap
      if(Math.hypot(t.clientX-(W/2-96), t.clientY-H*0.545)<42){ setSkin(-1); return; }
      if(Math.hypot(t.clientX-(W/2+96), t.clientY-H*0.545)<42){ setSkin(1);  return; }
    }
    if(state!=="play"){ press(); return; }
    if(t.clientX < W*0.5 && stickId===null){
      stickId=t.identifier; stickActive=true;
      stickOrigin={x:t.clientX,y:t.clientY}; stickPos={...stickOrigin};
    } else if(jumpId===null && Math.hypot(t.clientX-W*0.85, t.clientY-H*0.82)<90){
      // only the jump button jumps — generous 90px hit zone around it
      jumpId=t.identifier; press();
    }
  }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===stickId && stickOrigin){
      stickPos={x:t.clientX,y:t.clientY};
      stickX=Math.max(-1,Math.min(1,(stickPos.x-stickOrigin.x)/44));  // shorter throw (was 55) → more responsive stick
    }
  }
},{passive:false});
function endTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier===stickId){ stickId=null; stickActive=false; stickX=0; }
    if(t.identifier===jumpId){ jumpId=null; jumpHeld=false; }
  }
}
cv.addEventListener('touchend',endTouch); cv.addEventListener('touchcancel',endTouch);
cv.addEventListener('mousedown',e=>{
  usingTouch=false;
  if(state==="play" && Math.hypot(e.clientX-36, e.clientY-92)<28){ state="pause"; return; }  // clickable pause on desktop
  if(state==="pause"){ pauseTap(e.clientX, e.clientY); return; }
  if(state==="gate"){ if(gateT>0.7 && inRect(e.clientX,e.clientY,gateBtn())) advanceLevel(); return; }
  press();
});
cv.addEventListener('mouseup',()=>jumpHeld=false);

// ---- audio (tiny synth) -------------------------------------------
let AC=null;
function beep(f,dur,type,vol){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sCollect=()=>{ const p=Math.min(combo,14); beep(760+p*46,0.08,"square",0.05); setTimeout(()=>beep(1120+p*60,0.11,"square",0.045),45); };
const sJump   =()=> beep(300,0.18,"triangle",0.07);
const sHit    =()=>{ beep(140,0.3,"sawtooth",0.09); beep(90,0.4,"sawtooth",0.07); };
const sGate   =()=>{ [660,830,990,1320].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"square",0.06),i*110)); };
const sBoost  =()=>{ [420,640,900,1250].forEach((f,i)=>setTimeout(()=>beep(f,0.10,"sawtooth",0.05),i*45)); };

// ---- projection ---------------------------------------------------
function proj(zRel, a, height){
  const s = FOV/(FOV+Math.max(zRel,-FOV*0.6));
  const wz = playerZ + zRel;
  const dx = (curveX(wz)-curveX(playerZ)) * s;
  const dy = (curveY(wz)-curveY(playerZ)) * s;
  const r  = Math.max(R() - (height||0), 20);
  const ra = a - camA;   // camera-relative angle: player reads as "bottom"
  return {
    x: W/2 + dx + Math.sin(ra)*r*s,
    y: H*0.40 + dy + Math.cos(ra)*r*s*ASPECT,
    s: s,
    cx: W/2 + dx,
    cy: H*0.40 + dy
  };
}

// ---- update -------------------------------------------------------
function update(dt){
  if(state!=="play") return;
  elapsed+=dt; animT+=dt;
  if(inv>0) inv-=dt;
  if(hitFlash>0) hitFlash-=dt;
  if(levelFlash>0) levelFlash-=dt;
  if(shake>0) shake-=dt;
  if(jumpQueue>0) jumpQueue-=dt;

  // --- steering: input sets a TARGET angular velocity; ease toward it ---
  let kx = (keys["ArrowLeft"]||keys["KeyA"]? -1:0)+(keys["ArrowRight"]||keys["KeyD"]? 1:0);
  let steer = stickActive? stickX : kx;
  if(Math.abs(steer)<STEER_DZ) steer=0;                       // dead zone
  else steer = Math.sign(steer)*Math.pow(Math.abs(steer),1.3); // mild curve: fine near centre, full at the edges
  // keep turn rate roughly constant in TRACK-DISTANCE so the tube doesn't feel to
  // narrow at speed (a touch more turn authority as you go faster)
  const spd01 = Math.max(0, Math.min(0.55, (speed-600)/1700));
  const targetV = steer * TURN_V_MAX * sens * (0.8 + spd01);
  const kEase = 1 - Math.exp(-STEER_LAMBDA*dt);                // framerate-independent critical damping
  angV += (targetV - angV) * kEase;
  if(steer===0) angV += -Math.sin(ang)*PIPE_G_IDLE*dt;        // whisper settle to the bottom only when idle
  angV  = Math.max(-ANGV_MAX, Math.min(ANGV_MAX, angV));
  ang  += angV*dt;
  camA += ((ang + angV*0.05)-camA)*(1 - Math.exp(-CAM_LAMBDA*dt)); // rolls a beat behind you, with a slight look-ahead lead in the turn direction

  // full-loop detection — loops pay SPEED, not seeds (seeds come from seeds)
  const li = Math.floor((ang+Math.PI)/(Math.PI*2));
  if(li!==loopIdx){
    if(grounded){
      boostT=Math.max(boostT,1.25); combo+=2; comboT=1.25; sBoost();
      bannerMsg="FULL LOOP! SPEED SURGE"; bannerT=1.0;
      burst({z:playerZ+60, ang:ang, h:h}, C.glow, 16);
    }
    loopIdx=li;
  }

  // jump
  if(jumpQueue>0 && grounded){ vh=JUMP_V; grounded=false; jumpQueue=0; sJump(); }
  if(!grounded){
    h+=vh*dt;
    vh-= GRAV*dt*(jumpHeld&&vh>0?0.62:1);   // hold jump = float a touch higher
    if(h<=0){ h=0; vh=0; grounded=true; }
  }

  // --- forward velocity: ramp + combo momentum + dew boosts ---
  if(boostT>0) boostT-=dt;
  if(slowT>0)  slowT-=dt;
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
  const comboSpd = Math.min(combo*9, 210);
  const target = baseSpeed + Math.min(elapsed*9, 300) + comboSpd
               + (boostT>0? 340:0) - (slowT>0? 200:0);
  speedNow += (target - speedNow)*Math.min(1, dt*3.2);   // eased mach ramp
  speed = speedNow;
  playerZ += speed*dt;

    // (distance checkpoints removed 2026-07-03 — the instant 'not enough seeds' game
  //  overs broke the flow. Failure now comes only from running out of vitality on
  //  thorns; reaching the bloom always advances. See vitality + gate below.)

  // seed magnet — a light assist so whip-speed grabs stay smooth, but you have to
  // actually steer onto the seed now (tighter than before, and it narrows as you
  // climb the tower so high levels demand real precision).
  var magArc = 0.50 - Math.min(0.22, (stage-1)*0.003);   // 0.50 (L1) → 0.28 (L100)
  for(const o of objects){
    if(o.type!=="seed") continue;
    const dz=o.z-playerZ;
    if(dz>-10 && dz<118){
      const da=wrapA(ang-o.ang);
      if(Math.abs(da)<magArc && Math.abs((o.h||0)-h)<82){
        o.ang += da*Math.min(1,dt*9);
        o.h = (o.h||0)+(h-(o.h||0))*Math.min(1,dt*6);
      }
    }
  }

  // ambient spores fly past — free speed + depth read
  for(const sp of spores){
    sp.z -= speed*dt*0.92; sp.ang += dt*0.15;
    if(sp.z<10){ sp.z += FAR; sp.ang=Math.random()*6.283; sp.rf=0.25+Math.random()*0.65; }
  }

  // collisions
  for(const o of objects){
    if(o.dead) continue;
    const dz = o.z - playerZ;
    if(dz < -HIT_Z){ o.dead = true; continue; }
    if(Math.abs(dz) < HIT_Z){
      let da = Math.abs(wrapA(o.ang - ang));
      const dh = Math.abs((o.h||0) - h);
      if(da < HIT_ARC && dh < 72){
        if(o.type==="seed"){
          o.dead=true; seeds++; sCollect();
          combo++; comboT=1.25; bestCombo=Math.max(bestCombo,combo);
          burst(o, C.seed, 10);
          floats.push({z:dz, ang:o.ang, h:(o.h||0)+40, t:0.8,
                       txt: combo>=3? "x"+combo : "+1"});
          // seeds slowly regrow a lost leaf — keeps the run forgiving
          if(vitality<VIT_MAX && seeds-vitMark>=VIT_REGEN){ vitality++; vitMark=seeds; bannerMsg="LEAF REGROWN"; bannerT=0.9; }
        } else if(o.type==="boost"){
          o.dead=true; boostT=1.7; sBoost();
          burst(o, "#9FE8FF", 14);
          bannerMsg="DEW BOOST!"; bannerT=0.8;
        } else if(o.type==="thorn" && inv<=0){
          o.dead=true; sHit();
          vitality--; vitMark=seeds;                 // thorn costs a leaf
          const lost = Math.min(seeds, 3); seeds -= lost;
          combo=0; comboT=0; slowT=1.0;
          inv=1.4; hitFlash=0.4; shake=0.5; freezeT=0.055;   // brief hit-stop for impact
          angV += (ang>=o.ang? 5:-5);
          burst(o, C.thorn, 12);
          for(let i=0;i<lost;i++)  // scattered seeds fly away, Sonic-style
            particles.push({x:0,y:0,o:o,vx:(Math.random()*2-1)*260,vy:-Math.random()*340-80,
                            t:1.1, col:C.seed, seedFly:true, sx:null, sy:null});
          if(vitality<=0){ state="over"; overT=0; bannerT=0; bannerMsg="THE VINE WILTED..."; bestStage=Math.max(bestStage,stage); saveBest(); overUnlock=checkUnlock(); portalEvent("gameover"); return; }
        }
      } else if(o.type==="thorn" && !o.grazed && inv<=0 && da<HIT_ARC*2.6 && dh<90){
        // near-miss graze — skill reward, no punishment (Subway-Surfers style)
        o.grazed=true;
        combo++; comboT=1.25; bestCombo=Math.max(bestCombo,combo);
        floats.push({z:dz, ang:o.ang, h:(o.h||0)+44, t:0.7, txt:"NICE!"});
        beep(1200,0.07,"square",0.045);
      }
    }
  }
  objects = objects.filter(o=>!o.dead);

  // gate — reaching the bloom ALWAYS advances now (no seed-count fail). Hitting
  // the quota just makes it a fuller bloom (bonus feel), never a wall.
  if(playerZ >= gateZ){
    if(stage>=TOWER_MAX && !endless){        // top of the tower → victory screen
      state="clear"; clearT=0; bannerT=0; bestStage=TOWER_MAX+1; saveBest(); overUnlock=checkUnlock(); portalEvent("victory"); sGate(); return;
    }
    portalEvent("stageclear");               // (victory is its own event — no stacking)
    state="gate"; gateT=0; bannerMsg = seeds>=quota? "FULL BLOOM!" : "BLOOM OPENED!"; sGate();
  }

  // particles / floats
  for(const p of particles){ p.t-=dt;
    if(p.seedFly){ p.vy+=900*dt; p.ox=(p.ox||0)+p.vx*dt; p.oy=(p.oy||0)+p.vy*dt; }
    else { p.ox=(p.ox||0)+p.vx*dt; p.oy=(p.oy||0)+p.vy*dt; }
  }
  particles = particles.filter(p=>p.t>0);
  for(const f of floats){ f.t-=dt; f.h+=60*dt; }
  floats = floats.filter(f=>f.t>0);
}

function burst(o,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=90+Math.random()*160;
    particles.push({o:o, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0.5+Math.random()*0.3, col:col});
  }
}

// gate intermission timer
function updateGate(dt){ gateT+=dt; }   // celebration animates; advance ONLY on NEXT LEVEL / space

// ---- rendering ----------------------------------------------------
function draw(){
  const g = cx2d;
  // sky / interior gradient
  const T = theme();
  const grad = g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,T.bgTop); grad.addColorStop(0.55,T.bgMid); grad.addColorStop(1,T.bgBot);
  g.fillStyle=grad; g.fillRect(0,0,W,H);

  g.save();
  if(shake>0) g.translate((Math.random()*2-1)*shake*22,(Math.random()*2-1)*shake*22);

  // vanishing point glow (or bgVista art)
  const vp = proj(FAR*0.92, 0, R());
  const vista = img(Array.isArray(ART.bgVista)? ART.bgVista[(stage-1)%THEMES.length] : ART.bgVista);
  if(vista){
    const vw = R()*1.4;
    g.globalAlpha=0.9;
    g.drawImage(vista, vp.cx-vw/2, vp.cy-vw/2, vw, vw);
    g.globalAlpha=1;
  } else {
    const rg = g.createRadialGradient(vp.cx,vp.cy,4, vp.cx,vp.cy, R()*0.8);
    rg.addColorStop(0,"rgba("+T.vista+",0.85)");
    rg.addColorStop(0.4,"rgba("+T.vista+",0.28)");
    rg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=rg; g.beginPath(); g.arc(vp.cx,vp.cy,R()*0.8,0,7); g.fill();
  }

  // vine tube: lit checkerboard (bands × sectors) — depth AND roll in one read
  const firstRing = Math.ceil(playerZ/RING_GAP)*RING_GAP;
  const bands=[];
  for(let wz=firstRing; wz<playerZ+FAR; wz+=RING_GAP) bands.push(wz);
  for(let i=bands.length-1;i>=0;i--){
    const wz   = bands[i];
    const zRel = wz-playerZ;
    const s1 = FOV/(FOV+zRel);
    const s2 = FOV/(FOV+Math.max(zRel-RING_GAP,-FOV*0.5));
    const p  = proj(zRel-RING_GAP*0.5, 0, 0);
    const rMid  = R()*(s1+s2)*0.5;
    const thick = R()*(s2-s1)*1.15;
    const idx  = Math.round(wz/RING_GAP);
    const node = idx%6===0;
    const fog  = Math.max(0, Math.min(1, 1.25 - (zRel/FAR)*1.35));
    const wob  = 1 + Math.sin(wz*0.031)*0.02;
    g.lineWidth = thick;
    g.globalAlpha = fog;
    for(let k=0;k<8;k++){
      // interior lighting: brightest at the running lane, dim overhead
      const midRel = (k+0.5)*Math.PI/4 - camA;
      const light  = 0.45 + 0.55*Math.max(0, Math.cos(midRel));
      const checker= (idx+k)%2;
      const Lg = node? (checker?34:26)*light + 8 : (checker?26:17)*light + 4;
      g.strokeStyle = "hsl("+(node?T.nodeHue:T.hue)+", "+(node?T.sat+8:T.sat)+"%, "+Lg.toFixed(1)+"%)";
      const t1 = Math.PI/2 - (k*Math.PI/4 - camA);
      g.beginPath();
      g.ellipse(p.cx, p.cy, rMid*wob, rMid*ASPECT*wob, 0, t1-Math.PI/4-0.02, t1+0.02);
      g.stroke();
    }
    // running-lane seam highlight
    g.strokeStyle = node? T.glow : hexA(T.glow,0.4);
    g.lineWidth = Math.max(1,(node?6:2.5)*((s1+s2)*0.5));
    g.beginPath();
    g.ellipse(p.cx, p.cy, rMid*wob, rMid*ASPECT*wob, 0, Math.PI*0.3, Math.PI*0.7);
    g.stroke();
  }
  g.globalAlpha=1;

  // ambient spores drifting past the camera
  g.fillStyle=T.spore;
  for(const sp of spores){
    if(sp.z<10||sp.z>FAR) continue;
    const p = proj(sp.z, sp.ang, R()*(1-sp.rf));
    g.globalAlpha = 0.10 + Math.max(0,1-sp.z/FAR)*0.42;
    g.beginPath(); g.arc(p.x, p.y, 1.2+2.6*p.s, 0, 7); g.fill();
  }
  g.globalAlpha=1;

  // objects far -> near, with fog + alignment shadows for depth ordering
  const objs=[...objects].sort((a,b)=>(b.z-playerZ)-(a.z-playerZ));
  for(const o of objs){
    const zRel=o.z-playerZ;
    if(zRel<-40||zRel>FAR) continue;
    const p=proj(zRel,o.ang,o.h||0);
    const fog=Math.max(0.15, Math.min(1, 1.3 - (zRel/FAR)*1.5));
    const aligned = Math.abs(wrapA(o.ang-ang)) < HIT_ARC*1.1;
    const ps=proj(zRel,o.ang,0);
    // contact shadow — gold when you're lined up, red warning under thorns
    g.globalAlpha=(aligned?0.55:0.34)*fog;
    g.fillStyle = aligned? (o.type==="thorn"? "rgba(255,70,45,0.9)":"rgba(255,215,94,0.9)") : "#000";
    g.beginPath(); g.ellipse(ps.x, ps.y, (aligned?48:40)*p.s, (aligned?16:13)*p.s, 0, 0, 7); g.fill();
    // dotted tether pins floating pickups to their band
    if((o.h||0)>0){
      g.globalAlpha=0.35*fog;
      g.strokeStyle="#CFEFA8"; g.lineWidth=1.5; g.setLineDash([4,7]);
      g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(ps.x,ps.y); g.stroke();
      g.setLineDash([]);
    }
    g.globalAlpha=fog;
    // hazard telegraph — a pulsing red halo gives thorns reaction time at speed
    if(o.type==="thorn" && zRel>180 && zRel<1500){
      const pulse=0.5+0.5*Math.sin(animT*9 + o.z*0.01);
      g.globalAlpha=fog*(0.22+pulse*0.26)*Math.min(1,(1500-zRel)/750);
      g.fillStyle="#E0402F";
      g.beginPath(); g.arc(p.x, p.y, (24+8*pulse)*p.s, 0, 7); g.fill();
      g.globalAlpha=fog;
    }
    if(o.type==="seed") drawSeed(g,p,zRel);
    else if(o.type==="boost") drawBoost(g,p);
    else drawThorn(g,p);
    g.globalAlpha=1;
  }

  // gate bloom on approach
  const gz = gateZ - playerZ;
  if(gz>-60 && gz<FAR) drawGateBloom(g, proj(gz,0,0), gz);

  // (checkpoint arches removed with the checkpoint mechanic)

  // particles
  for(const p of particles){
    const base = p.o? proj(p.o.z-playerZ, p.o.ang, p.o.h||0) : null;
    const px=(base?base.x:W/2)+(p.ox||0), py=(base?base.y:H/2)+(p.oy||0);
    g.globalAlpha=Math.max(0,p.t*1.6);
    g.fillStyle=p.col;
    g.beginPath(); g.arc(px,py, p.seedFly?6:3.2, 0, 7); g.fill();
  }
  g.globalAlpha=1;

  // +1 floats
  g.font="700 16px 'Titan One', 'Arial Black', sans-serif";
  g.textAlign="center";
  for(const f of floats){
    const p=proj(f.z, f.ang, f.h);
    g.globalAlpha=Math.min(1,f.t*2);
    g.fillStyle=C.seedCore; g.fillText(f.txt, p.x, p.y);
  }
  g.globalAlpha=1;

  // player
  drawRunner(g);

  // speed streaks — radial motion lines that intensify with velocity + boost
  const spd01 = Math.max(0, Math.min(1,(speed-640)/560));
  if(spd01>0 && (state==="play"||state==="gate")){
    g.lineWidth=2;
    g.strokeStyle = boostT>0? "rgba(159,232,255,"+(0.18+spd01*0.34)+")"
                            : hexA(T.glow, 0.07+spd01*0.28);
    const n = 14 + Math.floor(spd01*8);
    for(let i=0;i<n;i++){
      const aa=(i/n)*Math.PI*2 + i*0.618;
      const r1=R()*(0.5+((animT*(4+spd01*7)+i*0.37)%1)*0.85);
      const len=44+150*spd01;
      const x0=W/2+Math.cos(aa)*r1,          y0=H*0.40+Math.sin(aa)*r1*ASPECT;
      const x1=W/2+Math.cos(aa)*(r1+len),    y1=H*0.40+Math.sin(aa)*(r1+len)*ASPECT;
      g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke();
    }
  }

  g.restore();

  // speed vignette — screen edges darken (blue while boosting) as you go faster
  const vg01 = Math.min(1, spd01*0.85 + (boostT>0?0.4:0));
  if(vg01>0.03){
    const vg=g.createRadialGradient(W/2,H*0.44,Math.min(W,H)*0.30, W/2,H*0.44,Math.max(W,H)*0.62);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,(boostT>0?"rgba(24,84,116,":"rgba(4,18,10,")+(0.10+vg01*0.34)+")");
    g.fillStyle=vg; g.fillRect(0,0,W,H);
  }

  // level-change bloom — the whole screen pulses in the new garden's colour so a
  // level-up reads instantly (pairs with the tube recolouring to a fresh palette).
  if(levelFlash>0){
    var lf = Math.min(1, levelFlash/0.6);
    var lg=g.createRadialGradient(W/2,H*0.44,0, W/2,H*0.44,Math.max(W,H)*0.7);
    lg.addColorStop(0, hexA(T.glow, 0.34*lf));
    lg.addColorStop(0.5, hexA(T.glow, 0.14*lf));
    lg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle=lg; g.fillRect(0,0,W,H);
  }

  drawHUD(g);
  if(state==="play" && usingTouch) drawControls(g);  // on-screen stick/jump only during live play
  if(state==="title") drawTitle(g);
  if(state==="over") drawOver(g);
  if(state==="pause") drawPause(g);
  if(state==="gate") drawGate(g);
  if(state==="clear") drawClear(g);
  if(bannerT>0 && state==="play"){
    var bf=Math.min(46,W*0.08);
    g.font="900 "+bf+"px 'Titan One','Arial Black',sans-serif";
    g.textAlign="center";
    // fit long banners on narrow screens
    while(bf>18 && g.measureText(bannerMsg).width > W-24){ bf-=2; g.font="900 "+bf+"px 'Titan One','Arial Black',sans-serif"; }
    g.fillStyle=C.pink; g.globalAlpha=Math.min(1,bannerT);
    g.fillText(bannerMsg, W/2, H*0.30);
    g.globalAlpha=1;
  }
}

function drawSeed(g,p,zRel){
  const bob = Math.sin(animT*4 + zRel*0.02)*5*p.s;
  const sz = 54*p.s;
  const y  = p.y+bob;
  const im = frameOf(ART.seed, animT, 8) || img(ART.seed[0]);
  // glow halo
  const rg=g.createRadialGradient(p.x,y,1,p.x,y,sz*1.7);

function drawGateBloom(g,p,gz){

function drawRunner(g){
  if(inv>0 && Math.floor(animT*14)%2===0) return;  // damage blink
  const p = proj(60, ang, h);
  const sz = 66*p.s;
  const lean = Math.max(-1,Math.min(1, angV*0.35 + (stickActive?stickX*0.4:0)));
  // shadow on the pipe surface
  const ps = proj(60, ang, 0);
  g.globalAlpha=0.35*(1-Math.min(h/220,0.8));
  g.fillStyle="#000";
  g.beginPath(); g.ellipse(ps.x, ps.y, sz*0.7, sz*0.22, 0, 0, 7); g.fill();
  g.globalAlpha=1;

  let im=null;
  if(hitFlash>0) im=skinPose("hit");
  else if(!grounded) im=skinPose("jump");
  else if(lean<-0.55) im=skinPose("leanL");
  else if(lean> 0.55) im=skinPose("leanR");
  var flip=false;
  if(!im){                                           // run cycle at ~9fps: use run-2.png when it exists,
    var striding=(state==="play"||state==="title");  // no jogging-in-place under pause/gate/over overlays
    var stepB=striding && Math.floor(animT*9)%2===1; // otherwise MIRROR the run frame for the opposite step
    var im2=stepB? skinPose("run2") : null;          // (the pose is asymmetric, so the flip reads as a stride)
    im = im2 || skinPose("run");
    flip = stepB && !im2;
  }

  g.save();
  g.translate(p.x, p.y - sz*0.55);
  // camera rolls with the player, so the sprite stays near-upright;
  // rotation is just steering lean + a touch of camera lag
  g.rotate(lean*0.5 + (ang-camA)*0.9);
  if(im){ if(flip) g.scale(-1,1); g.drawImage(im,-sz,-sz,sz*2,sz*2); g.restore(); return; }

  // ---- placeholder sprout, rear view ----
  const run = grounded? Math.sin(animT*14):0;
  // feet
  g.fillStyle=C.runnerDark;
  g.beginPath(); g.ellipse(-sz*0.28, sz*0.55+run*sz*0.08, sz*0.16, sz*0.10,0,0,7); g.fill();
  g.beginPath(); g.ellipse( sz*0.28, sz*0.55-run*sz*0.08, sz*0.16, sz*0.10,0,0,7); g.fill();
  // body
  g.fillStyle=C.runner;
  g.beginPath(); g.ellipse(0, sz*0.12, sz*0.42, sz*0.5,0,0,7); g.fill();
  // back stripe
  g.fillStyle=C.runnerDark;
  g.beginPath(); g.ellipse(0, sz*0.12, sz*0.13, sz*0.44,0,0,7); g.fill();
  // head
  g.fillStyle=C.runner;
  g.beginPath(); g.arc(0,-sz*0.42, sz*0.30, 0, 7); g.fill();
  // sprout leaves on head
  g.fillStyle=C.leaf;
  g.beginPath(); g.ellipse(-sz*0.16,-sz*0.72, sz*0.2, sz*0.09, -0.7+run*0.1,0,7); g.fill();
  g.beginPath(); g.ellipse( sz*0.16,-sz*0.72, sz*0.2, sz*0.09,  0.7-run*0.1,0,7); g.fill();
  g.strokeStyle=C.runnerDark; g.lineWidth=sz*0.05;
  g.beginPath(); g.moveTo(0,-sz*0.66); g.lineTo(0,-sz*0.78); g.stroke();
  // arms pumping
  g.fillStyle=C.runner;
  g.beginPath(); g.ellipse(-sz*0.46, sz*0.05+run*sz*0.12, sz*0.11, sz*0.2, 0.3,0,7); g.fill();
  g.beginPath(); g.ellipse( sz*0.46, sz*0.05-run*sz*0.12, sz*0.11, sz*0.2,-0.3,0,7); g.fill();
  g.restore();
}

function drawHUD(g){
  const T=theme();
  g.textAlign="left";
  g.font="900 22px 'Titan One','Arial Black',sans-serif";
  // seed counter + vitality leaves in one chip
  g.fillStyle="rgba(4,18,10,0.6)";
  roundRect(g, 14, 14, 178, 44, 22); g.fill();
  const hs=img(ART.hudSeed);
  if(hs) g.drawImage(hs, 22, 20, 32, 32);
  else { g.fillStyle=C.seed; g.beginPath(); g.ellipse(38,36,11,15,0.3,0,7); g.fill(); }
  g.fillStyle=C.cream;
  g.fillText(""+seeds, 58, 44);
  // vitality leaves (right side of the chip) — sprite if available, else procedural
  const leafImg=img(ART.leaf);
  for(let i=0;i<VIT_MAX;i++){
    const lx=118+i*22, ly=36;
    g.globalAlpha = i<vitality? 1 : 0.25;
    if(leafImg){
      g.drawImage(leafImg, lx-12, ly-12, 24, 24);
    } else {
      g.fillStyle = i<vitality? T.glow : C.cream;
      g.beginPath(); g.ellipse(lx, ly, 6.5, 10, -0.5, 0, 7); g.fill();
      g.globalAlpha = i<vitality? 0.5 : 0.15; g.strokeStyle="#0B2415"; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(lx-4,ly+4); g.lineTo(lx+3,ly-4); g.stroke();
    }
  }
  g.globalAlpha=1;

  // pause button (play only) \u2014 hit region matches (36,92) in the input handlers
  if(state==="play"){
    g.globalAlpha=0.45; g.fillStyle="rgba(4,18,10,0.7)";
    g.beginPath(); g.arc(36,92,20,0,7); g.fill();
    g.globalAlpha=0.85; g.fillStyle=C.cream;
    g.fillRect(29,84,5,16); g.fillRect(38,84,5,16);
    g.globalAlpha=1;
  }

  // stage progress bar \u2192 the bloom. On narrow screens the centered bar
  // collided with the seed chip (left) and LEVEL text (right) — below ~560px
  // it gets its own row under the chip instead (audit 2026-07-03).
  if(state==="play"||state==="gate"){
    const narrow = W<560;
    const bw = narrow? Math.min(W-128,280) : Math.min(W*0.34,250);
    const bx = W/2-bw/2, by = narrow? 64 : 14;
    g.fillStyle="rgba(4,18,10,0.55)";
    roundRect(g,bx,by,bw,9,4); g.fill();
    g.fillStyle=hexA(T.glow,0.95);
    roundRect(g,bx+1,by+1,(bw-2)*Math.min(1,playerZ/gateZ),7,3); g.fill();
    g.fillStyle=C.pink;
    g.beginPath(); g.arc(bx+bw, by+4.5, 6, 0, 7); g.fill();
  }

  // stage + distance + garden name
  g.textAlign="right";
  g.font="900 16px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.cream; g.globalAlpha=0.85;
  g.fillText(stage>TOWER_MAX? ("ENDLESS · LV "+stage) : ("LEVEL "+stage+"/"+TOWER_MAX), W-16, 32);
  g.font="900 10px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=T.glow;
  g.fillText(T.name, W-16, 46);
  g.font="900 14px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.cream;
  g.fillText(Math.floor(playerZ/100)+"m", W-16, 64);
  g.globalAlpha=1;
  // speed meter — little vine bar
  const sp01 = Math.max(0,Math.min(1,(speed-420)/900));
  g.fillStyle="rgba(4,18,10,0.6)";
  roundRect(g, W-116, 72, 100, 10, 5); g.fill();
  g.fillStyle = boostT>0? "#9FE8FF" : T.glow;
  roundRect(g, W-114, 74, 96*sp01, 6, 3); g.fill();
  // combo readout
  if(combo>=3 && state==="play"){
    g.textAlign="center";
    g.font="900 "+(24+Math.min(combo,20))+"px 'Titan One','Arial Black',sans-serif";
    g.fillStyle=C.seed; g.globalAlpha=0.9;
    g.fillText("COMBO x"+combo, W/2, H*0.20);
    g.globalAlpha=1;
  }
  // bloom-ahead cue \u2014 positive, no quota pressure
  if(state==="play" && gateZ-playerZ<2200){
    const msg="BLOOM AHEAD";
    g.textAlign="center";
    g.font="900 13px 'Titan One','Arial Black',sans-serif";
    const tw=g.measureText(msg).width;
    const py=Math.max(150, H*0.24);   // below the combo readout (H*0.20)
    g.fillStyle="rgba(4,18,10,0.5)";
    roundRect(g, W/2-tw/2-12, py, tw+24, 26, 13); g.fill();
    g.fillStyle=C.pink;
    g.fillText(msg, W/2, py+17);
  }
}

  g.fillText(stage+1>TOWER_MAX? ("UP NEXT · ENDLESS LV "+(stage+1)+" · "+nextName) : ("UP NEXT · LEVEL "+(stage+1)+"/"+TOWER_MAX+" · "+nextName), W/2, H*0.62);

  g.globalAlpha=rdy;
  g.fillStyle=hexA(T.glow,0.94); roundRect(g, gl.x-gl.w/2, gl.y-gl.h/2, gl.w, gl.h, 30); g.fill();

  g.fillText("NEXT LEVEL  ▶", gl.x, gl.y+8);
  g.globalAlpha=1;
  if(rdy>=1){ g.font="700 11px sans-serif"; g.fillStyle="rgba(242,240,220,0.4)";
    g.fillText(usingTouch?"tap the button when you're ready":"press space when you're ready", W/2, gl.y+gl.h/2+20); }
}
function drawClear(g){
  g.fillStyle="rgba(4,18,10,0.72)"; g.fillRect(0,0,W,H);
  g.textAlign="center";
  const pulse=1+Math.sin(animT*3)*0.04;
  g.save(); g.translate(W/2,H*0.34); g.scale(pulse,pulse);
  g.font="900 "+Math.min(52,W*0.10)+"px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.pink; g.fillText("TOWER CLEARED!", 0, 0);
  g.restore();
  g.font="900 18px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.cream;
  g.fillText("all 100 levels climbed", W/2, H*0.43);
  g.fillText("best combo x"+bestCombo, W/2, H*0.49);
  if(overUnlock){                                      // unlock earned on the victory run
    var vpulse=1+Math.sin(animT*6)*0.06;
    g.save(); g.translate(W/2,H*0.545); g.scale(vpulse,vpulse);
    g.font="900 17px 'Titan One','Arial Black',sans-serif"; g.fillStyle="#E8C86B";
    g.fillText("★ NEW RUNNER: "+overUnlock.name.toUpperCase()+" ★", 0, 0); g.restore();
    g.font="900 18px 'Titan One','Arial Black',sans-serif";
  }
  g.fillStyle=C.glow;
  if(Math.floor(animT*2)%2===0) g.fillText("TAP FOR THE ENDLESS GARDEN", W/2, H*0.60);
}

function drawOver(g){
  g.fillStyle="rgba(4,18,10,0.7)"; g.fillRect(0,0,W,H);
  g.textAlign="center";
  g.font="900 "+Math.min(44,W*0.09)+"px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.thorn; g.fillText(bannerMsg, W/2, H*0.40);
  g.font="900 "+Math.min(20,W*0.046)+"px 'Titan One','Arial Black',sans-serif";
  g.fillStyle=C.cream;
  g.fillText(seeds+" seeds  ·  level "+Math.min(stage,TOWER_MAX)+"/"+TOWER_MAX+"  ·  combo x"+bestCombo, W/2, H*0.48);
  g.font="900 15px 'Titan One','Arial Black',sans-serif";
  g.fillStyle="rgba(242,240,220,0.7)";
  g.fillText(bestStage>TOWER_MAX? "best: tower cleared" : "best: level "+Math.min(bestStage,TOWER_MAX)+"/"+TOWER_MAX, W/2, H*0.54);
  if(overUnlock){                                      // reward moment — a new runner just unlocked
    var pulse=1+Math.sin(animT*6)*0.06;
    g.save(); g.translate(W/2,H*0.605); g.scale(pulse,pulse);
    g.font="900 17px 'Titan One','Arial Black',sans-serif"; g.fillStyle=C.gold||"#E8C86B";
    g.fillText("★ NEW RUNNER: "+overUnlock.name.toUpperCase()+" ★", 0, 0); g.restore();
    g.font="700 12px sans-serif"; g.fillStyle="rgba(242,240,220,0.6)";
    g.fillText("pick it on the title screen", W/2, H*0.635);
    g.fillStyle=C.glow;
    if(Math.floor(animT*2)%2===0) g.fillText("TAP TO REPLANT", W/2, H*0.69);
  } else {
    g.fillStyle=C.glow;
    if(Math.floor(animT*2)%2===0) g.fillText("TAP TO REPLANT", W/2, H*0.60);
  }
}

function roundRect(g,x,y,w,hh,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+hh,r); g.arcTo(x+w,y+hh,x,y+hh,r);
  g.arcTo(x,y+hh,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

// ---- main loop ----------------------------------------------------
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000, 1/30); last=now;
  animT+=state==="play"?0:dt;
  if(freezeT>0){ freezeT-=dt; }                 // hit-stop: freeze the sim for a beat
  else if(state==="play") update(dt);
  if(state==="gate") updateGate(dt);
  if(state==="over") overT+=dt;
  if(state==="clear") clearT+=dt;
  if(bannerT>0 && state==="play") bannerT-=dt;  // real-time decay (was 1/60 per frame)
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
portalEvent("ready");
</script>
<!-- ══════════════════════════════════════════════════════════════════════
     LUCID WINDS BRIDGE (re-apply on re-vendor). Vendored same-origin. The game
     already posts {game:'vine-runner', event, ...} to window.parent; top-level
     that's this window, so we listen here. Adds: Sunbeam earn (stageclear/
     victory, daily-capped), best-run persistence, SWS_EXIT + a corner button,
     and the SDK. Game body above is byte-identical to the source.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  "use strict";
  var EMBED=/[?&]embed=1(&|$)/.test(location.search);
  window.SWS_EMBED=EMBED;
  // Exit lives on the game's PAUSE screen (see drawPause + the pause tap handler)
  // to avoid colliding with the game's own HUD. SWS_EXIT is the escape.
  window.SWS_EXIT=function(){
    // the portal frames with ?embed=1 but the main app frames WITHOUT it —
    // detect framing directly so exit never loads the portal inside a frame.
    if(parent!==window){try{parent.postMessage({sws:'close'},'*');}catch(e){}return;}
    location.href='/portal/';
  };
  if(EMBED&&parent!==window){try{parent.postMessage({sws:'ready'},'*');}catch(e){}}

  // ── Sunbeam earn — stage clears / victory. Sky Wolf earn standard: 30/day/game
  //    (=1 plant), floor 1 per clear. See SUNBEAM_EARN_POLICY.md.
  var DAYK='vr_sb_day';
  function today(){ return Math.floor(Date.now()/86400000); }
  function earnedToday(){ try{ var s=JSON.parse(localStorage.getItem(DAYK)||'{}'); return s.d===today()?(s.n||0):0; }catch(e){ return 0; } }
  function bank(n){ try{ localStorage.setItem(DAYK, JSON.stringify({d:today(), n:earnedToday()+n})); }catch(e){} }
  var runEarned=0;                                    // per-run cap 12 (policy) — one tower climb can't cap the day
  function award(n){
    n=Math.min(n, Math.max(0, 30-earnedToday()), Math.max(0, 12-runEarned));
    if(n<=0) return; runEarned+=n; bank(n);
    if(window.Sunbeam&&Sunbeam.earn) Sunbeam.earn(n,'vine-runner:run').catch(function(){});
  }
  window.addEventListener('message', function(e){
    var d=e&&e.data; if(!d||d.game!=='vine-runner') return;
    if(d.event==='gameover') runEarned=0;             // fresh run resets the per-run allowance
    // persist best run (the game keeps no storage of its own)
    try{
      var bs=JSON.parse(localStorage.getItem('vine-runner-best')||'{}');
      if((d.bestStage||0)>(bs.stage||0)) bs.stage=d.bestStage;
      if((d.bestCombo||0)>(bs.combo||0)) bs.combo=d.bestCombo;
      localStorage.setItem('vine-runner-best', JSON.stringify(bs));
    }catch(_){}
    if(d.event==='stageclear') award(Math.max(1, Math.floor((d.seeds||0)/16)));  // levels are ~2x longer now; /16 spreads the 12/run cap over ~4-6 clears
    else if(d.event==='victory'){ runEarned=0; award(6); }                       // victory bonus exempt from the per-run cap (still inside 30/day)
  });

  var s=document.createElement('script');
  s.src='/sunbeam-sdk.js?v=5';
  s.onload=function(){ try{ if(window.Sunbeam) Sunbeam.init({gameId:'vine-runner'}).catch(function(){}); }catch(e){} };
  s.onerror=function(){};
  document.head.appendChild(s);
})();
</script>
