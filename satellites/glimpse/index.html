<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glimpse</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../math/core/core.css?v=20260916c">
<link rel="manifest" href="./manifest.webmanifest?v=20260916c">
<style>
  body { background: #10161f; color: #e9eef2; overflow-x: hidden; }
  main { max-width: 480px; margin: 0 auto; padding: 64px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* the meadow: a square field, never wider than the screen or 360 px */
  #meadow-wrap { position: relative; width: min(100%, 360px); }
  #meadow { display: block; width: 100%; aspect-ratio: 1 / 1; border: 3px solid #26323f; border-radius: 6px; box-sizing: border-box; background: #10161f; image-rendering: pixelated; }
  #truth { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: var(--type-34); font-variant-numeric: tabular-nums lining-nums; color: #e9eef2; pointer-events: none; }
  #truth[hidden] { display: none; }
  /* the pads: at most four to a row (3.6), each a numeral and its dot pattern (GL7) */
  #pads { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 124px; }
  .pad-row { display: flex; gap: 8px; }
  .pad.lw-btn { width: 56px; min-width: 56px; min-height: 56px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #1a2330; border: 2px solid #3a4a5c; color: #e9eef2; font-variant-numeric: tabular-nums lining-nums; font-size: var(--type-20); line-height: 1; }
  .pad[aria-disabled="true"] { opacity: 0.35; }
  .pad[aria-pressed="true"] { box-shadow: inset 0 0 0 3px #e9eef2; }
  .pad canvas { display: block; }
  #controls { width: 100%; display: flex; justify-content: flex-end; min-height: 56px; }
  #next { min-width: 64px; min-height: 56px; }
  #next[hidden] { display: inline-flex; visibility: hidden; }
  #first[hidden], #play[hidden] { display: none; }
  #first { position: fixed; inset: 0; z-index: 30; background: #10161f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  /* the wordless loop: three fireflies blink on and off, grass stirs, three dots light on a pad */
  .loop { position: relative; width: 220px; height: 120px; border-radius: 8px; background: #10161f; border: 3px solid #26323f; overflow: hidden; }
  .loop i { position: absolute; top: 44px; width: 16px; height: 16px; background: #6fb7ff; box-shadow: 0 0 0 4px #2d5b86; animation: blink 4s infinite; }
  .loop i:nth-child(1) { left: 56px; } .loop i:nth-child(2) { left: 100px; top: 70px; } .loop i:nth-child(3) { left: 146px; top: 36px; }
  .loop b { position: absolute; inset: 0; background: repeating-linear-gradient(135deg, #1f3526 0 6px, #2f4d36 6px 10px); opacity: 0; animation: stir 4s infinite; }
  @keyframes blink { 0%, 10% { opacity: 0; } 15%, 30% { opacity: 1; } 35%, 100% { opacity: 0; } }
  @keyframes stir { 0%, 33% { opacity: 0; } 35%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .loop i, .loop b { animation: none; } }
  /* the four doors, a picture each; a link that names a mode shows its one door */
  .doors { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-inline: 16px; }
  .door.lw-btn { min-width: 64px; min-height: 64px; padding: 6px; background: #1a2330; border: 2px solid #3a4a5c; }
  .door canvas { display: block; }
  body[data-fixed] #start-groups, body[data-fixed] #start-frame, body[data-fixed] #start-spread { display: none; }
  /* the field journal, after a run */
  #shelf { position: fixed; inset: 0; z-index: 25; background: #10161f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-inline: 16px; }
  #shelf[hidden] { display: none; }
  .shelf-frame { max-width: 100%; padding: 8px; border: 3px solid #3a4a5c; background: #1a2330; box-sizing: border-box; }
  #shelf-canvas { display: block; max-width: 100%; image-rendering: pixelated; }
  #shelf-go { min-width: 64px; min-height: 64px; font-size: var(--type-26); }
  @media (max-height: 600px) { main { padding-top: 56px; gap: 8px; } #meadow-wrap { width: min(100%, 260px); } }
</style>
</head>
<body>
<div id="first">
  <div class="loop" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <div class="doors">
    <button id="start" class="lw-btn door" type="button"></button>
    <button id="start-groups" class="lw-btn door" type="button"></button>
    <button id="start-frame" class="lw-btn door" type="button"></button>
    <button id="start-spread" class="lw-btn door" type="button"></button>
  </div>
</div>
<main id="play">
  <div id="meadow-wrap">
    <canvas id="meadow"></canvas>
    <div id="truth" aria-live="polite" hidden></div>
  </div>
  <div id="pads"></div>
  <div id="controls">
    <button id="next" class="lw-btn" type="button" hidden>&#10132;</button>
  </div>
</main>
<script type="module" src="./main.js?v=20260916c"></script>
</body>
</html>
