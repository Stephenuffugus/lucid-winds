<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make a link for your class</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../core/core.css?v=20260915c">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; display: flex; flex-direction: column; gap: var(--space-4); }
  h1 { font-size: var(--type-26); margin: 0; }
  .lede { margin: 0; color: var(--ink-soft); }
  .cfg-row { display: flex; flex-direction: column; gap: var(--space-2); }
  .cfg-row > span { font-size: var(--type-14); color: var(--ink-soft); }
  #fields { display: flex; flex-direction: column; gap: var(--space-4); }
  #game, #link, .cfg-control { width: 100%; box-sizing: border-box; background: var(--paper); }
  #link { font-size: var(--type-14); }
  #open { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; color: var(--ink); text-decoration: none; }
  .cfg-control[aria-invalid="true"] { border-style: dashed; }
</style>
</head>
<body>
<main>
  <h1>Make a link for your class</h1>
  <p class="lede">Choose a game and how it starts, then bookmark or share the link.</p>
  <label class="cfg-row"><span>Game</span><select id="game" class="lw-btn"></select></label>
  <div id="fields"></div>
  <label class="cfg-row"><span>Link</span><input id="link" class="lw-btn" type="text" readonly></label>
  <a id="open" class="lw-btn" href="../core/demo/">Open the game</a>
</main>
<script type="module" src="./config.js?v=20260915c"></script>
</body>
</html>
