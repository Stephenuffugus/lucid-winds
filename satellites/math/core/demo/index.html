<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core demo</title>
<!-- ⛔ no icon declared means Chrome asks the server root for /favicon.ico, and the layout gate's first clean run
     was red at every size on that 404. A game declares its own icon; the demo declares an empty one. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../core.css?v=20260915c">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px 32px; }
  .sample { font-size: var(--type-20); margin: 0; color: var(--ink-soft); }
  .demo-flash, .demo-mask { position: fixed; left: 50%; top: 40%; width: 120px; height: 80px; margin-left: -60px; z-index: 40; }
  .demo-flash { display: flex; gap: 12px; align-items: center; justify-content: center; }
  .demo-flash i { width: 18px; height: 18px; background: var(--ink); border-radius: 3px; }
  .demo-mask { background: repeating-linear-gradient(45deg, var(--ink) 0 4px, var(--paper) 4px 8px); }
  .demo-flash[hidden], .demo-mask[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <p class="sample" id="sample">3/4 1/8 0.496 12 + 5</p>
  <div class="lw-target" id="target" aria-live="polite"></div>
  <div id="stage"></div>
</main>
<div class="demo-flash" id="flash" hidden><i></i><i></i><i></i></div>
<div class="demo-mask" id="mask" hidden></div>
<script type="module">
/* The dummy game every CORE browser gate drives (plans/math/HANDOFF-CORE.md P1, P2).
   No child is sent here; it exists so the reveal, the settings, the audio and the
   flash are proven against something before SPAN depends on them. One round: a
   fraction, an unmarked line, a stone, the reveal. `?seed=` replays a run. */
import { settings, store, tokens, SETTINGS_DEFAULTS, numberline, reveal, audio, schedule, rng, lineGeometry,
  toNormalized, fromNormalized, parseConfig, COPY } from '../core.js?v=20260915c';

const SCHEMA = { v: 1, fresh: () => ({ v: 1, collect: [], adapt: {}, settings: Object.assign({}, SETTINGS_DEFAULTS) }) };
tokens.inject({ accent: '#2f5f86' });

/* two voices, each setting every gain it makes: a wooden tock when the stone is set
   down, and one soft two note chime when the truth shows, the same on every path */
audio.define({
  place: {
    build(ac, out, t, rand) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.2);
      const len = Math.floor(ac.sampleRate * 0.06), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), ng = ac.createGain();
      src.buffer = buf;
      lp.type = 'lowpass'; lp.frequency.value = 900;
      ng.gain.setValueAtTime(0.12, t);
      src.connect(lp); lp.connect(ng); ng.connect(out);
      src.start(t); src.stop(t + 0.07);
    }
  },
  reveal: {
    build(ac, out, t) {
      [[523.25, 0], [659.25, 0.12]].forEach(([f, dt]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t + dt);
        g.gain.setValueAtTime(0.0001, t + dt);
        g.gain.exponentialRampToValueAtTime(0.16, t + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.9);
        o.connect(g); g.connect(out);
        o.start(t + dt); o.stop(t + dt + 0.95);
      });
    }
  }
});
/* the loudest a round can be, faster than a hand can play it */
const LOUD = seconds => {
  const p = [];
  for (let t = 0.1; t < seconds; t += 0.6) p.push([t, 'place']);
  for (let t = 0.4; t < seconds; t += 1.2) p.push([t, 'reveal']);
  return p;
};

const panel = settings.mount({ gameId: 'demo', schema: SCHEMA, onChange: s => audio.setMuted(s.muted) });
audio.setMuted(panel.get().muted);

const cfg = parseConfig(location.search, { seed: { type: 'int', min: 1, max: 2147483647, default: 20260915 } });
const r = rng(cfg.seed);
const stage = document.getElementById('stage'), targetEl = document.getElementById('target');
const DENOMS = [2, 3, 4, 5, 6, 8], TOLERANCE = 0.05;
const results = [];
let round = null, line = null, lastReveal = null;

function newRound() {
  if (line) line.destroy();
  stage.querySelectorAll('.lw-mark-learner, .lw-mark-truth, .lw-gap, .lw-caption').forEach(e => e.remove());
  const d = DENOMS[r.int(DENOMS.length)], n = 1 + r.int(d - 1);
  round = { target: { n, d }, value: n / d, geom: lineGeometry(r), tolerance: TOLERANCE };
  targetEl.textContent = n + '/' + d;
  lastReveal = null;
  line = numberline.create({ container: stage, geom: round.geom, onCommit: commit });
}
function commit(value) {
  const err = Math.abs(value - round.value);
  const correct = err <= round.tolerance, near = correct && err > round.tolerance * 0.25;
  const caption = (near ? COPY.nearPrefix : '') + round.target.n + '/' + round.target.d + COPY.isHere;
  const result = { value, correct, near, caption, truthAt: null };
  results.push(result);
  /* A1: one sound for the event of placing, never one per anything counted */
  audio.play('place');
  lastReveal = reveal.show({ container: stage, geom: round.geom, learner: value, truth: round.value, correct, near, caption,
    /* A1: one chime for the event of the truth showing, the same on every path */
    onTruth: () => audio.play('reveal'),
    onDone: st => { result.truthAt = st.truthAt; } });
}
newRound();

/* the flash, for test/schedule.mjs: three squares for a stated time, then a mask.
   `injectDelayMs` holds the show frame busy, the slow render S2 must not count. */
const flashEl = document.getElementById('flash'), maskEl = document.getElementById('mask');
function flashOnce({ durationMs, masked = true, injectDelayMs = 0, onPainted }) {
  return schedule.flash({
    durationMs,
    onShow: () => {
      flashEl.hidden = false;
      if (injectDelayMs) { const until = performance.now() + injectDelayMs; while (performance.now() < until) { /* a slow render */ } }
    },
    onHide: () => { flashEl.hidden = true; },
    onMasked: masked ? () => { maskEl.hidden = false; } : undefined,
    onPainted
  }).then(f => { maskEl.hidden = true; return f; });
}

window.CORE_DEMO = {
  ready: true, settings: panel, store, schema: SCHEMA, gameId: 'demo',
  round: () => round,
  results,
  revealDone: () => !!(lastReveal && lastReveal.done),
  next: () => newRound(),
  pixelFor: x => fromNormalized(x, round.geom, stage.getBoundingClientRect().width),
  valueAt: px => { const b = stage.getBoundingClientRect(); return Math.min(1, Math.max(0, toNormalized(px - b.left, round.geom, b.width))); },
  stoneValue: () => line.value(),
  audio: {
    sounded: () => audio.log.slice(),
    clear: () => { audio.log.length = 0; },
    renderLoud: (seconds, master) => audio.renderLoud(LOUD(seconds), seconds, master)
  },
  flash: opts => flashOnce(opts),
  /* a response a fixed time after the page learns the paint, measured both ways */
  flashRT: ({ durationMs, respondAfterMs, injectDelayMs }) => {
    let answered;
    const responded = new Promise(res => { answered = res; });
    const done = flashOnce({ durationMs, injectDelayMs, onPainted: (shownAt, requestedAt) => {
      setTimeout(() => { const now = performance.now(); answered({ rtPaint: now - shownAt, rtRequest: now - requestedAt }); }, respondAfterMs);
    } });
    return Promise.all([responded, done]).then(([rt]) => rt);
  }
};
</script>
</body>
</html>
