<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TUMBLE</title>
<meta name="description" content="Dig through a warm pile of laundry, find every sock's twin, and toss the pairs into the basket.">
<meta name="theme-color" content="#2a2320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs"
  }
}
</script>
<script>
  // Sky Wolf Studio workbench gate: only on the live domain, so a stranger never lands on an unfinished build.
  if (/(^|\.)lucidwinds\.com$/.test(location.hostname)) {
    var gs = document.createElement('script'); gs.src = '/dev-gate.js'; document.head.appendChild(gs);
  }
</script>
<style>
  :root {
    --cream: #f6eddc; --paper: #fbf5e9; --ink: #4a3a2c; --ink-soft: #6f5b49;
    --sage: #8fa58a; --sage-deep: #5f7a5a; --clay: #d08a5c; --butter: #f2d58e;
    --night: #2a2320; --shadow: rgba(40, 26, 14, 0.28);
    --ui: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* bottom, right of the shake button: the top belongs to the pairs and odd chips */
  #debug { position: absolute; left: 66px; right: 8px; bottom: calc(8px + var(--sab)); margin: 0; padding: 5px 8px; font: 10px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #e9ffe0; background: rgba(0,0,0,0.5); border-radius: 6px; pointer-events: none; z-index: 50; white-space: pre-wrap; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #4a3b30 0%, #2a2320 70%); color: var(--cream); z-index: 40; transition: opacity 0.5s ease; }
  #boot h1 { font-family: var(--display); font-weight: 700; font-size: 3rem; letter-spacing: 0.08em; margin: 0; }
  #boot p { margin: 0; font-size: 1rem; opacity: 0.85; }
  #boot.gone { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
  .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(246,237,220,0.2); border-top-color: var(--butter); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  #fileNote { display: none; position: absolute; inset: 0; z-index: 60; background: var(--night); color: var(--cream); padding: 28px; font-size: 1.05rem; line-height: 1.5; }
  #fileNote code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" aria-label="The folding table"></canvas>
  <div id="boot" role="status"><h1>TUMBLE</h1><div class="spin"></div><p id="bootMsg">Warming up the dryer</p></div>
  <div id="fileNote">
    <h2 style="font-family: var(--display)">TUMBLE needs a tiny local server</h2>
    <p>Browsers refuse to load JavaScript modules from a <code>file://</code> page, so opening this file directly cannot work. From this folder, run <code>python3 -m http.server 8080</code> and open <code>http://localhost:8080/</code>.</p>
  </div>
</div>
<script>
  if (location.protocol === 'file:') document.getElementById('fileNote').style.display = 'block';
</script>
<script type="module">
  // bumped together with VERSION in sw.js and src/config.js (tests/sw.test.mjs checks all three)
  const TUMBLE_VERSION = '20260923f';
  const params = new URLSearchParams(location.search);
  const root = document.getElementById('app');
  const msg = document.getElementById('bootMsg');
  try {
    // imported here, not statically, so a CDN that cannot be reached shows a message instead of a spinner forever
    let App;
    try { ({ App } = await import('./src/app.js')); } catch (e) {
      const retry = document.createElement('button');
      retry.textContent = 'Try again';
      retry.style.cssText = 'min-height:48px;padding:10px 22px;margin-top:14px;border:none;border-radius:16px;font:inherit;font-weight:800;background:#5f7a5a;color:#fff';
      retry.addEventListener('click', () => location.reload());
      document.querySelector('#boot .spin').remove();
      msg.textContent = 'The game could not load its parts. Check the connection and try again.';
      msg.after(retry);
      throw e;
    }
    const app = new App(root, params);
    window.TUMBLE = app;
    await app.boot((m) => { msg.textContent = m; });
    window.TUMBLE_DEV = app.devApi();
    document.getElementById('boot').classList.add('gone');
    const game = app.game;
    if (params.has('smoke')) {
      const n = parseInt(params.get('smoke') || '43', 10);
      game.render.setView('table', true);
      game.smokePile(Math.max(1, Math.min(200, n)), parseInt(params.get('seed') || '1', 10));
    } else if (params.has('load')) {
      // dev and gate entry: straight into a Load, skipping the room
      game.render.setView('table', true);
      app.start({ mode: params.get('load') || 'laundry', sub: params.get('sub') || undefined, size: params.get('size') || 'regular', daily: params.has('daily'), tier: params.has('tier') ? parseInt(params.get('tier'), 10) : undefined, seed: params.get('seed') || undefined });
    } else {
      game.render.setView('room', true);
      app.showRoom();
      app.firstTen();          // DESIGN-T2 7.2, once per install, and a tap ends it
    }
    // service worker: a versioned URL, registered every launch, so a new deploy always reaches the phone
    // (a bare sw.js is pinned at the edge for days). When a new version finishes installing under an older one,
    // the player is told once; the next launch runs it.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !params.has('nosw')) {
      navigator.serviceWorker.register('sw.js?v=' + TUMBLE_VERSION).then((reg) => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) app.ui.hint('A new version of TUMBLE is ready. Close it and open it again to get it.', 5000);
          });
        });
      }).catch((e) => console.warn('TUMBLE: service worker not registered', e.message));
    }
  } catch (err) {
    console.error(err);
    if (!document.querySelector('#boot button')) {
      const gl = /webgl/i.test(String(err && err.message));
      msg.textContent = gl ? 'This browser could not start 3D graphics. Turn on hardware acceleration in its settings, or try another browser.' : 'Something went wrong starting the game. Try again, and if it keeps happening, close the tab and open TUMBLE fresh.';
      const b = document.createElement('button');
      b.textContent = 'Try again';
      b.style.cssText = 'min-height:48px;padding:10px 22px;margin-top:14px;border:none;border-radius:16px;font:inherit;font-weight:800;background:#5f7a5a;color:#fff';
      b.addEventListener('click', () => location.reload());
      const sp = document.querySelector('#boot .spin');
      if (sp) sp.remove();
      msg.after(b);
    }
  }
</script>
</body>
</html>
