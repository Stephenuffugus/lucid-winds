<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Span screener</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../math/core/core.css?v=20260915h">
<link rel="manifest" href="../manifest.webmanifest?v=20260915h">
<style>
  body { background: #efe6d2; color: #2b2620; overflow-x: hidden; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
  #equation { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--type-48); min-height: 96px; font-variant-numeric: tabular-nums lining-nums; }
  #equation .side { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
  #choices { display: flex; gap: 24px; }
  .choice { min-width: 96px; min-height: 72px; }
  .choice svg { display: block; margin: 0 auto; pointer-events: none; }
  #first, #done { position: fixed; inset: 0; z-index: 30; background: #efe6d2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-inline: 16px; }
  #first[hidden], #done[hidden], #result[hidden], #play[hidden] { display: none; }
  #start { min-width: 56px; min-height: 56px; }
  #teacher { min-height: 56px; font-size: var(--type-16); touch-action: none; user-select: none; -webkit-user-select: none; }
  #result { font-size: var(--type-20); line-height: 1.6; text-align: center; font-variant-numeric: tabular-nums lining-nums; }
  .stone-mark { width: 96px; height: 64px; background: #8c8272; border: 3px solid #4f483e; border-radius: 10px; }
</style>
</head>
<body>
<div id="first"><button id="start" class="lw-btn" type="button">&#9654;</button></div>
<main id="play">
  <div id="equation" aria-live="polite"></div>
  <div id="choices">
    <button id="same" class="lw-btn choice" type="button"><svg viewBox="0 0 40 28" width="44" height="31" aria-hidden="true"><rect x="2" y="6" width="36" height="5" rx="1.5" fill="currentColor"/><rect x="3" y="11" width="12" height="16" fill="currentColor"/><rect x="25" y="11" width="12" height="16" fill="currentColor"/></svg></button>
    <button id="apart" class="lw-btn choice" type="button"><svg viewBox="0 0 40 28" width="44" height="31" aria-hidden="true"><rect x="2" y="5" width="36" height="5" rx="1.5" fill="currentColor" transform="rotate(-12 38 10)"/><rect x="3" y="18" width="12" height="9" fill="currentColor"/><rect x="25" y="10" width="12" height="17" fill="currentColor"/></svg></button>
  </div>
</main>
<section id="done" hidden>
  <div class="stone-mark" aria-hidden="true"></div>
  <button id="teacher" class="lw-btn" type="button"></button>
  <div id="result" hidden></div>
</section>
<script type="module" src="./screen.js?v=20260915h"></script>
</body>
</html>
