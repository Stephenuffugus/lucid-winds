<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Span</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../math/core/core.css?v=20260915d">
<style>
  body { background: #efe6d2; color: #2b2620; overflow-x: hidden; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 12px 24px; display: flex; flex-direction: column; gap: 12px; }
  #equation { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--type-34); min-height: 64px; font-variant-numeric: tabular-nums; }
  #equation .term[data-blank] { min-width: 56px; min-height: 56px; box-sizing: border-box; padding: 0 8px; border: 3px solid #2b2620; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
  /* a side never breaks across lines; RELATIONAL's five three digit numbers are set a size down to hold one line */
  #equation .side { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  body[data-mode="relational"] #equation, body[data-mode="relational"] #equation .side { gap: 4px; }
  body[data-mode="relational"] #equation { font-size: var(--type-26); }
  body[data-mode="relational"] #equation .term[data-blank] { min-width: 44px; min-height: 44px; padding: 0 6px; }
  @media (max-width: 399px) { body[data-mode="relational"] #equation { font-size: var(--type-20); } }
  #canyon { position: relative; height: clamp(280px, 50vh, 420px); border-radius: 16px; background: linear-gradient(#cfdde3, #cfdde3 55%, #a38b6c 55%, #6f5c46); overflow: hidden; outline-offset: 4px; }
  .pier { position: absolute; bottom: 0; width: 30%; background: #8c8272; border: 3px solid #4f483e; border-bottom: 0; box-sizing: border-box; border-radius: 6px 6px 0 0; }
  #pier-left { left: 12%; }
  #pier-right { right: 12%; }
  /* the chosen pier is shown to a keyboard, which chose it; a thumb never did */
  #canyon:focus-visible .pier.selected { outline: 3px dashed #2b2620; outline-offset: 3px; }
  #stack { position: absolute; width: 30%; height: 36px; box-sizing: border-box; background: #8c8272; border: 3px solid #4f483e; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: var(--type-20); font-variant-numeric: tabular-nums; color: #2b2620; }
  #span { position: absolute; left: 12%; right: 12%; height: 10px; background: #4a3f33; border-radius: 4px; transform-origin: center; transition: none; }
  #span[hidden], #stack[hidden] { display: none; }
  #shortfall { position: absolute; width: 30%; height: 0; background: rgba(43, 38, 32, 0.22); opacity: 0; box-sizing: border-box; }
  #caption { position: absolute; left: 8px; right: 8px; top: 10px; text-align: center; font-size: var(--type-20); opacity: 0; text-wrap: balance; }
  .dust { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #d8ccb4; pointer-events: none; }
  /* three fixed places, so nothing a thumb just used moves when next appears: the supply, the lay control or the two
     choices in the middle, next on the right, its place kept while it is hidden */
  #controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  #supply { grid-column: 1; justify-self: start; }
  #lay, #choices { grid-column: 2; justify-self: center; }
  #next { grid-column: 3; justify-self: end; }
  #supply .stone-source, #lay, #next, #start, #again { min-width: 56px; min-height: 56px; }
  #supply .stone-source { width: 72px; height: 56px; border-radius: 12px; background: #8c8272; border: 3px solid #4f483e; touch-action: none; cursor: grab; }
  /* RELATIONAL: a stone 1, a slab 10 and a block 100, the numeral on each; the other modes keep the one stone */
  #supply { display: flex; gap: 8px; }
  body:not([data-mode="relational"]) #supply .stone-source:not([data-value="1"]) { display: none; }
  body[data-mode="relational"] #supply .stone-source { width: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: var(--type-20); font-variant-numeric: tabular-nums lining-nums; color: #2b2620; }
  body[data-mode="relational"] #controls { grid-template-columns: auto 1fr auto; }
  @media (max-width: 359px) {
    body[data-mode="relational"] #supply { grid-column: 1 / -1; justify-self: center; }
    body[data-mode="relational"] #lay, body[data-mode="relational"] #next { grid-row: 2; }
  }
  @media (max-height: 600px) { main { padding-top: 56px; padding-bottom: 12px; } }
  #lay svg, .choice svg { display: block; margin: 0 auto; pointer-events: none; }
  #lay[aria-disabled="true"] { opacity: 0.5; }
  /* TRUE OR NOT: two choices in place of the supply and the lay control; the chosen one keeps its mark, one look on every path */
  #choices { display: none; gap: 12px; }
  body[data-mode="judge"] #choices { display: flex; }
  body[data-mode="judge"] #supply, body[data-mode="judge"] #lay { display: none; }
  .choice { min-width: 72px; min-height: 56px; }
  .choice[aria-pressed="true"] { box-shadow: inset 0 0 0 3px #2b2620; }
  .choice[aria-disabled="true"]:not([aria-pressed="true"]) { opacity: 0.5; }
  #first[hidden], #play[hidden] { display: none; }
  #next[hidden] { display: inline-flex; visibility: hidden; }
  #first { position: fixed; inset: 0; z-index: 30; background: #efe6d2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  /* the wordless loop: a span tilts on uneven piers and slides off, a stone drops onto the short pier, the pier takes
     it, the span comes down flat */
  .loop { position: relative; width: 240px; height: 140px; border-radius: 12px; overflow: hidden; background: linear-gradient(#cfdde3, #cfdde3 55%, #a38b6c 55%, #6f5c46); }
  .loop i { position: absolute; bottom: 0; width: 64px; background: #8c8272; border: 3px solid #4f483e; border-bottom: 0; box-sizing: border-box; border-radius: 4px 4px 0 0; }
  .loop i:nth-child(1) { left: 36px; height: 80px; }
  .loop i:nth-child(2) { right: 36px; height: 56px; animation: grow 5s infinite; }
  .loop s { position: absolute; right: 36px; bottom: 56px; width: 64px; height: 24px; box-sizing: border-box; background: #8c8272; border: 3px solid #4f483e; border-radius: 4px; opacity: 0; animation: drop 5s infinite; }
  .loop b { position: absolute; left: 36px; right: 36px; bottom: 80px; height: 8px; background: #4a3f33; border-radius: 3px; transform-origin: left bottom; animation: settle 5s infinite; }
  @keyframes grow { 0%, 50% { height: 56px; } 51%, 100% { height: 80px; } }
  @keyframes drop { 0%, 34% { transform: translateY(-70px); opacity: 0; } 35% { transform: translateY(-70px); opacity: 1; } 44%, 50% { transform: translateY(0); opacity: 1; } 51%, 100% { transform: translateY(0); opacity: 0; } }
  @keyframes settle { 0%, 16% { transform: rotate(8.2deg); opacity: 1; } 29% { transform: translate(70px, 70px) rotate(35deg); opacity: 0; } 30%, 57% { transform: translateY(-16px); opacity: 0; } 58% { transform: translateY(-16px); opacity: 1; } 64%, 100% { transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .loop i, .loop s, .loop b { animation: none; } .loop i:nth-child(2) { height: 80px; } }
  /* the viaduct: the arches earned so far, receding into haze, and start for the next run */
  #viaduct { position: fixed; inset: 0; z-index: 25; background: #efe6d2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding-inline: 16px; }
  #viaduct[hidden] { display: none; }
  #viaduct .sky { position: relative; width: min(100%, 520px); height: 180px; border-radius: 16px; overflow: hidden; background: linear-gradient(#cfdde3, #dfe6e4 60%, #a38b6c 60%, #6f5c46); }
  #viaduct .sky::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(239, 230, 210, 0) 45%, rgba(223, 230, 228, 0.85)); pointer-events: none; }
  #arches { position: absolute; left: 16px; right: 0; bottom: 40%; display: flex; align-items: flex-end; }
  .arch { position: relative; flex: none; margin-right: -4px; background: #8c8272; border: 2px solid #4f483e; border-bottom: 0; box-sizing: border-box; }
  .arch::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 0; height: 60%; background: #cfdde3; border-radius: 50% 50% 0 0 / 70% 70% 0 0; }
  .ghost { position: fixed; width: 56px; height: 40px; border-radius: 10px; background: #8c8272; border: 3px solid #4f483e; pointer-events: none; z-index: 40; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="first">
  <div class="loop" aria-hidden="true"><i></i><i></i><s></s><b></b></div>
  <button id="start" class="lw-btn" type="button">&#9654;</button>
</div>
<section id="viaduct" hidden>
  <div class="sky" aria-hidden="true"><div id="arches"></div></div>
  <button id="again" class="lw-btn" type="button">&#9654;</button>
</section>
<main id="play">
  <div id="equation" aria-live="polite"></div>
  <div id="canyon" tabindex="0">
    <div id="pier-left" class="pier"></div>
    <div id="pier-right" class="pier"></div>
    <div id="stack" hidden></div>
    <div id="shortfall"></div>
    <div id="span" data-tilt="0" hidden></div>
    <div id="caption"></div>
  </div>
  <div id="controls">
    <div id="supply">
      <div class="stone-source" data-value="1" role="button" tabindex="-1"></div>
      <div class="stone-source" data-value="10" role="button" tabindex="-1"></div>
      <div class="stone-source" data-value="100" role="button" tabindex="-1"></div>
    </div>
    <button id="lay" class="lw-btn" type="button"><svg viewBox="0 0 40 28" width="36" height="25" aria-hidden="true"><rect x="2" y="2" width="36" height="5" rx="1.5" fill="currentColor"/><rect x="2" y="15" width="12" height="12" rx="1.5" fill="currentColor"/><rect x="26" y="15" width="12" height="12" rx="1.5" fill="currentColor"/></svg></button>
    <div id="choices">
      <button id="same" class="lw-btn choice" type="button" aria-pressed="false"><svg viewBox="0 0 40 28" width="36" height="25" aria-hidden="true"><rect x="2" y="6" width="36" height="5" rx="1.5" fill="currentColor"/><rect x="3" y="11" width="12" height="16" fill="currentColor"/><rect x="25" y="11" width="12" height="16" fill="currentColor"/></svg></button>
      <button id="apart" class="lw-btn choice" type="button" aria-pressed="false"><svg viewBox="0 0 40 28" width="36" height="25" aria-hidden="true"><rect x="2" y="5" width="36" height="5" rx="1.5" fill="currentColor" transform="rotate(-12 38 10)"/><rect x="3" y="18" width="12" height="9" fill="currentColor"/><rect x="25" y="10" width="12" height="17" fill="currentColor"/></svg></button>
    </div>
    <button id="next" class="lw-btn" type="button" hidden>&#10132;</button>
  </div>
</main>
<script type="module" src="./main.js?v=20260915d"></script>
</body>
</html>
