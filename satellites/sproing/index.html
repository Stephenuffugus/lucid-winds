<style>
:root{
  --bg:#0d100c; --bg2:#141a12; --sage:#7ab356; --deep:#3f6b34; --gold:#c8a84b;
  --cream:#e8dcc8; --muted:#8a9178; --bark:#6b4a2b; --pink:#e58fa0; --ink:#12160f;
  --pan:#0a0d09ee; --line:#2a331f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
html,body{height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--cream); user-select:none; -webkit-user-select:none}
#wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 80% at 50% 0%, #101610 0%, #05070a 70%, #000 100%)}
#stage{position:relative; flex:none; width:540px; height:960px; transform-origin:center center;
  background:#0b0f0b; overflow:hidden; box-shadow:0 0 60px #000a}
canvas#game{position:absolute; inset:0; width:540px; height:960px; display:block; touch-action:none}

/* ---------- screens ---------- */
.screen{position:absolute; inset:0; display:none; flex-direction:column; z-index:20;
  background:linear-gradient(180deg,#0e140d 0%, #0b0f0b 100%)}
.screen.on{display:flex}
.pad{padding:22px; flex:1; display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch}
.center{align-items:center; justify-content:center; text-align:center}

.brandmark{font-weight:800; letter-spacing:1px; color:var(--sage);
  text-shadow:0 2px 0 #0006; display:flex; align-items:baseline; gap:8px}
.title-word{font-size:62px; line-height:1; color:var(--sage);
  text-shadow:0 3px 0 #14200f, 0 0 26px #7ab35644}
.title-sub{color:var(--gold); font-size:15px; letter-spacing:3px; margin-top:8px; text-transform:uppercase}
.ribbon{margin-top:14px; color:var(--cream); font-size:14px; opacity:.85}
.ribbon b{color:var(--gold)}

/* buttons — fleet touch law: 72 stage px min on the scaled 540x960 stage (renders 52 at 390w) */
.btn{display:flex; align-items:center; justify-content:center; gap:10px;
  min-height:72px; width:100%; border:1px solid var(--line); border-radius:16px;
  background:linear-gradient(180deg,#1a2415,#121a0f); color:var(--cream);
  font-size:19px; font-weight:700; letter-spacing:.5px; cursor:pointer;
  transition:transform .06s ease, filter .12s ease}
.btn:active{transform:translateY(2px) scale(.99); filter:brightness(1.12)}
.btn.primary{background:linear-gradient(180deg,#7ab356,#5c8f3f); color:#0c1207; border-color:#8fd06a;
  box-shadow:0 4px 0 #3f6b34, 0 8px 20px #0006}
.btn.gold{background:linear-gradient(180deg,#d8b84f,#b2913a); color:#241c07; border-color:#e6cd6a; box-shadow:0 4px 0 #7a5f1f}
.btn.ghost{background:#0f150c; color:var(--muted)}
.btn.sm{min-height:72px; font-size:16px}
.row{display:flex; gap:12px; width:100%}
.row>.btn{flex:1}
.stack{display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px}

.icobtn{width:56px; height:56px; border-radius:14px; border:1px solid var(--line); position:relative;
  background:#0f150ccc; color:var(--cream); font-size:22px; display:flex; align-items:center; justify-content:center; cursor:pointer}
.icobtn::after{content:''; position:absolute; inset:-8px}
.icobtn:active{filter:brightness(1.2)}

/* ---------- in-run HUD ---------- */
#hud{position:absolute; inset:0; z-index:15; pointer-events:none; display:none}
#hud.on{display:block}
#alt{position:absolute; top:16px; left:0; right:0; text-align:center;
  font-size:44px; font-weight:800; color:var(--cream); text-shadow:0 2px 8px #000c, 0 0 2px #000}
#alt small{font-size:18px; color:var(--gold); font-weight:700}
#chain{position:absolute; top:70px; left:50%; transform:translateX(-50%);
  background:#c8a84bdd; color:#241c07; font-weight:800; font-size:16px; padding:4px 14px; border-radius:20px;
  opacity:0; transition:opacity .2s}
#coinbar{position:absolute; top:18px; right:14px; background:#0a0d09cc; border:1px solid var(--line);
  border-radius:14px; padding:6px 12px; font-weight:800; color:var(--gold); font-size:16px; display:flex; align-items:center; gap:6px}
#pausebtn{position:absolute; top:16px; left:14px; pointer-events:auto}
#mutebtn{position:absolute; top:96px; left:14px; pointer-events:auto; width:56px; height:56px; font-size:19px}

/* ---------- studio ---------- */
.hdr{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.hdr h2{font-size:20px; color:var(--sage); font-weight:800}
.studio-wrap{flex:1; display:flex; flex-direction:column; align-items:center; padding:12px; gap:12px; overflow-y:auto}
#drawpad{width:420px; height:420px; max-width:440px; max-height:440px;

    linear-gradient(180deg,#f4efe2,#e7dcc6); touch-action:none; image-rendering:auto; box-shadow:inset 0 0 30px #0002}
.tools{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; max-width:520px}
.swatches{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; max-width:520px}
.sw{width:60px; height:60px; border-radius:12px; border:3px solid #0000; cursor:pointer; box-shadow:0 1px 3px #0006; position:relative}
.sw::after{content:''; position:absolute; inset:-6px}
.sw.sel{border-color:var(--gold); transform:scale(1.06)}
.tool{width:60px; height:60px; border-radius:14px; border:1px solid var(--line); background:#0f150c;
  color:var(--cream); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative}
.tool::after{content:''; position:absolute; inset:-6px}
.tool.sel{background:#25341c; border-color:var(--gold)}
.tool small{position:absolute; bottom:2px; right:4px; font-size:9px; color:var(--muted)}
.brushdot{border-radius:50%; background:var(--cream)}

/* ---------- gallery / shop grids ---------- */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:460px; margin:0 auto}
.cell{background:#0f150c; border:1px solid var(--line); border-radius:16px; padding:8px; display:flex;

.cell canvas{width:88px; height:88px; background:#10160e; border-radius:12px}
.cell .nm{font-size:12px; color:var(--cream); text-align:center; min-height:34px; display:block; line-height:1.3}
.cell .price{font-size:12px; color:var(--gold); font-weight:700}
.cell .mini{display:flex; gap:8px; width:100%}
.cell .mini button{flex:1; min-height:64px; padding:0 4px; border-radius:10px; border:1px solid var(--line); background:#141c10; color:var(--cream); font-size:12px; font-weight:700; cursor:pointer; position:relative}
.cell .mini button::after{content:''; position:absolute; left:-4px; right:-4px; top:-4px; bottom:-4px}
.cell.equipped{border-color:var(--sage); box-shadow:0 0 0 2px #7ab35633}
.tag{position:absolute; font-size:10px; padding:2px 6px; border-radius:8px; font-weight:800}
.rar-Common{color:#cfe0b8} .rar-Rare{color:#8fd0ff} .rar-Epic{color:#e6a3ff}
.rar-Signature{color:var(--gold)} .rar-Unlock{color:#ffd27a}
.shoptabs{display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 0; max-width:460px; margin:0 auto; width:100%}
.shoptab{flex:1 1 30%; min-height:72px; border:1px solid var(--line); border-radius:12px 12px 0 0; background:#0f150c; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer}
.shoptab.sel{background:#25341c; color:var(--cream); border-color:var(--gold); border-bottom-color:#25341c}
.grid.list{grid-template-columns:1fr}
.uprow{background:#0f150c; border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; align-items:center; gap:12px; text-align:left}
.uprow .ic{font-size:26px; width:34px; text-align:center; flex:none}
.uprow .body{flex:1; min-width:0}
.uprow .body .n{font-weight:700; font-size:15px; color:var(--cream)}
.uprow .body .d{font-size:12px; color:var(--muted)}
.uprow .pips{margin-top:5px; letter-spacing:3px; color:var(--gold); font-size:13px}
.uprow button{min-height:72px; min-width:82px; flex:none; border-radius:12px; border:1px solid var(--line); background:#141c10; color:var(--cream); font-weight:700; font-size:13px; cursor:pointer}
.uprow button.max{color:var(--sage); border-color:var(--sage); background:#182210}
.uprow.done{border-color:var(--sage); box-shadow:0 0 0 1px #7ab35633}
.trailprev{width:88px; height:56px; border-radius:12px; background:#10160e; display:flex; align-items:center; justify-content:center; overflow:hidden}

/* ---------- settings ---------- */
.set-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 4px; border-bottom:1px solid #1c2416; width:100%; max-width:440px}
.set-row .lab{font-size:15px; color:var(--cream)}
.seg{display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.seg button{min-height:72px; min-width:72px; background:#0f150c; color:var(--muted); border:0; font-size:13px; font-weight:700; cursor:pointer; padding:0 10px}
.seg button.sel{background:var(--sage); color:#0c1207}
input[type=range]{width:150px; height:72px; accent-color:var(--sage)}

/* ---------- modal ---------- */
#modal{position:absolute; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:#000a; padding:24px}
#modal.on{display:flex}
.card{background:linear-gradient(180deg,#18210f,#0e140c); border:1px solid var(--line); border-radius:20px; padding:22px; max-width:360px; text-align:center}
.card h3{color:var(--sage); font-size:20px; margin-bottom:10px}
.card p{color:var(--cream); font-size:14px; line-height:1.5; opacity:.9; margin-bottom:16px}

.muted{color:var(--muted)} .gold{color:var(--gold)} .small{font-size:13px}
#buildstamp{position:absolute; left:10px; bottom:8px; font-size:10px; color:#3a4a30; z-index:30}
.spacer{flex:1}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){ .btn{transition:none} }
</style>

<script>
/* ============================================================================
   SPROING — botanical vertical jumper (Sky Wolf Studios satellite)
   Single self-contained file · Canvas2D + WebAudio + localStorage · zero assets
   ============================================================================ */
(function(){
'use strict';
var BUILD='v1.0.0';

/* ---------- constants (from locked design spec) ---------- */
var VW=540, VH=960, DT=1/60, MAXACC=0.05;
var GRAV=2200, HOP=1150, SPRING=1850, MEGA=2350, MAXFALL=1500, MAXHORIZ=680;
var LOCK=432;                 // camera lock line (45% of 960)
var PX_PER_M=10;              // 1 metre = 10 logical px
var DEATH_MARGIN=8;

var PAL={ bg:'#0d100c', sage:'#7ab356', deep:'#3f6b34', gold:'#c8a84b', cream:'#e8dcc8',
  muted:'#8a9178', bark:'#6b4a2b', pink:'#e58fa0', ink:'#12160f', coral:'#e8823a', sky:'#7aa6d6' };

/* ---------- drop-in ART loader (Sunlit Vector Garden pack) -----------------
   Preloads each PNG/JPG once, keyed folder/name; every draw site tries the
   sprite when ready and falls through to the original procedural draw when the
   image is missing. Skins only the WORLD (bg / platforms / critters / pickups /
   powerups) — the climber, beanstalk and studio cosmetics stay procedural. */
var ART_VER='sproart1';
var ART={};
function _artExt(folder){ return folder==='bg'?'jpg':'png'; }
function artLoad(folder,name){ var k=folder+'/'+name; if(ART[k]) return ART[k];
  var o={img:new Image(),ready:false};
  o.img.onload=function(){ o.ready=(o.img.naturalWidth>0); };
  o.img.src='assets/'+folder+'/'+name+'.'+_artExt(folder)+'?v='+ART_VER;
  ART[k]=o; return o; }
function artOK(folder,name){ var o=ART[folder+'/'+name]; return !!(o&&o.ready&&o.img.complete&&o.img.naturalWidth>0); }
/* draw sprite centred at (cx,cy) to a target WIDTH (height keeps aspect); optional h-flip. */
function drawArt(g,folder,name,cx,cy,drawW,flip){ var o=ART[folder+'/'+name]; if(!o||!o.ready) return false;
  var im=o.img, iw=im.naturalWidth, ih=im.naturalHeight; if(!iw||!ih) return false;
  var h=drawW*ih/iw; g.save(); g.translate(cx,cy); if(flip) g.scale(-1,1);

}

  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||0.3,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

    case 'spring': blip(300,0.15,'sine',0.32,null,180); break;
    case 'mega': blip(240,0.22,'sawtooth',0.3,null,520); break;
    case 'coin': { var cc=arg||0; blip(1318*Math.pow(SEMI,Math.min(cc,6)),0.07,'square',0.18); setTimeout(function(){blip(1760,0.06,'square',0.15);},55); break; }
    case 'power': blip(400,0.1,'sawtooth',0.2); setTimeout(function(){blip(600,0.1,'sawtooth',0.2);},70); setTimeout(function(){blip(900,0.12,'sawtooth',0.2);},140); break;
    case 'hit': blip(200,0.18,'sine',0.3,null,120); noise(0.12,0.15,500); buzz(30); break;
    case 'fall': blip(500,0.5,'sine',0.28,null,90); setTimeout(function(){noise(0.1,0.2,300);},480); break;
    case 'crumble': noise(0.18,0.18,2200); break;

    var octave=Math.min(3, Math.floor((game?game.meters:0)/700)); // rises as you climb

/* --- bake a 128 source canvas → outlined 96 sprite (auto-contrast) --- */
function alphaBBox(data,w,h){
  var x0=w,y0=h,x1=-1,y1=-1;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){ if(data[(y*w+x)*4+3]>8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0) return null; return {x0:x0,y0:y0,x1:x1,y1:y1,w:x1-x0+1,h:y1-y0+1};
}
function bakeDoodleSprite(src128){
  var sctx=src128.getContext('2d');
  var img; try{ img=sctx.getImageData(0,0,128,128); }catch(e){ return null; }
  var bb=alphaBBox(img.data,128,128); if(!bb||bb.w<8||bb.h<8) return null;
  // mean luminance of opaque px → outline color
  var lum=0,cnt=0,d=img.data;

  // fit bbox into 76 box centered, feet at content bottom
  var fit=76/Math.max(bb.w,bb.h);
  var dw=bb.w*fit, dh=bb.h*fit;
  var content=mkCanvas(SPR,SPR), cc=content.getContext('2d');
  var dx=(SPR-dw)/2, dy=(SPR-dh)/2;
  cc.imageSmoothingEnabled=true;
  cc.drawImage(src128, bb.x0,bb.y0,bb.w,bb.h, dx,dy,dw,dh);
  var footY=Math.min(SPR-2, dy+dh);

  var sil=mkCanvas(SPR,SPR), sc=sil.getContext('2d');
  sc.drawImage(content,0,0); sc.globalCompositeOperation='source-in'; sc.fillStyle=outCol; sc.fillRect(0,0,SPR,SPR);

  var out=mkCanvas(SPR,SPR), o=out.getContext('2d');
  var shad=mkCanvas(SPR,SPR), shc=shad.getContext('2d');
  shc.drawImage(content,0,0); shc.globalCompositeOperation='source-in'; shc.fillStyle='rgba(0,0,0,.32)'; shc.fillRect(0,0,SPR,SPR);

  for(var k=0;k<offs.length;k++) o.drawImage(sil,offs[k][0],offs[k][1]);
  o.drawImage(content,0,0);
  return {cv:out, footY:footY, top:dy};
}

  cc.drawImage(big, bb.x0,bb.y0,bb.w,bb.h, dx,dy,dw,dh);
  var footY=Math.min(SPR-2,dy+dh);

}

var curSprite=bakeSkinFallback();            // baked {cv,footY} used in-game/preview
var skinCache={};                            // id -> baked sprite

function isUnlocked(def){
  if(def.rarity!=='Unlock') return owned.indexOf(def.id)>=0;
  if(def.unlock==='alt3000') return best>=3000;
  if(def.unlock==='streak7') return (LS.getJSON(K.streak,{count:0}).count||0)>=7;
  return false;
}
function bakeSkinFallback(){ return bakeDoodleSprite(defaultDoodle128()); }
function bakedSkin(id){ if(skinCache[id]) return skinCache[id]; var d=skinDef(id); if(!d) return null; var s=bakeSkinSprite(d); skinCache[id]=s; return s; }

function loadDoodleSprite(png,cb){
  var img=new Image();
  img.onload=function(){ var c=mkCanvas(128,128); c.getContext('2d').drawImage(img,0,0,128,128); var s=bakeDoodleSprite(c); cb(s||bakeSkinFallback()); };
  img.onerror=function(){ cb(bakeSkinFallback()); };
  img.src=png;
}
// Overlay the equipped accessory onto a fresh copy (never mutate the cached base).
function compositeSprite(base){
  if(!base) return base;
  if(!accEquip || accEquip==='none') return base;
  var c=mkCanvas(SPR,SPR), g=c.getContext('2d'); g.drawImage(base.cv,0,0);
  drawAccessory(g, accEquip, SPR/2, (base.top!=null?base.top:14));
  return {cv:c, footY:base.footY, top:base.top};
}
function applyEquip(){
  var gen=++equipGen;
  if(equip.type==='skin'){ var s=bakedSkin(equip.id); curSprite=compositeSprite(s||bakeSkinFallback()); afterEquip(); }
  else if(equip.type==='doodle' && sketchbook[equip.index] && sketchbook[equip.index].png){
    curSprite=compositeSprite(bakeSkinFallback()); afterEquip();     // show default until async bake lands
    loadDoodleSprite(sketchbook[equip.index].png,function(s){ if(gen===equipGen){ curSprite=compositeSprite(s); afterEquip(); } });
  } else { equip={type:'default'}; curSprite=compositeSprite(bakeSkinFallback()); afterEquip(); }
}
function setEquip(spec){ equip=spec; LS.setJSON(K.equip,equip); applyEquip(); }
function afterEquip(){ renderTitlePreview(); }

function renderTitlePreview(){
  var c=$('titlepreview'); if(!c||!curSprite) return; var g=c.getContext('2d');
  g.clearRect(0,0,120,120); g.save(); g.translate(12,12); g.scale(120/SPR,120/SPR); g.drawImage(curSprite.cv,0,0); g.restore();
}

/* ============================ DRAW STUDIO ================================= */
var pad, padCtx, sBrush=1, sColor=DRAW_PALETTE[0][0], sTool='brush', sMirror=true;
var undoStack=[], redoStack=[], editingIndex=null, painting=false, lastPX=0, lastPY=0, studioInit=false;

function initStudio(){
  if(studioInit) return; studioInit=true;
  pad=$('drawpad'); padCtx=pad.getContext('2d');
  // brush tools
  var bt=$('brushtools'); bt.innerHTML='';
  BRUSH_SIZES.forEach(function(sz,i){
    var b=document.createElement('div'); b.className='tool'+(i===sBrush?' sel':''); b.dataset.brush=i;
    var d=document.createElement('div'); d.className='brushdot'; var px=Math.max(4,sz); d.style.width=px+'px'; d.style.height=px+'px'; b.appendChild(d);
    b.onclick=function(){ sTool='brush'; sBrush=i; refreshTools(); sfx('ui'); };
    bt.appendChild(b);
  });
  var er=toolBtn('🩹','eraser',function(){ sTool='eraser'; refreshTools(); });
  var fl=toolBtn('🪣','fill',function(){ sTool='fill'; refreshTools(); });
  bt.appendChild(er); bt.appendChild(fl);
  // act tools
  var at=$('acttools'); at.innerHTML='';
  at.appendChild(toolBtn('🪞','mirror',function(){ sMirror=!sMirror; refreshTools(); }));
  at.appendChild(toolBtn('↶','undo',function(){ doUndo(); }));
  at.appendChild(toolBtn('↷','redo',function(){ doRedo(); }));
  at.appendChild(toolBtn('🗑','clear',function(){ confirmClear(); }));
  // swatches
  var sw=$('swatches'); sw.innerHTML='';
  DRAW_PALETTE.forEach(function(p){ var e=document.createElement('div'); e.className='sw'+(p[0]===sColor?' sel':''); e.style.background=p[0]; e.title=p[1]; e.dataset.col=p[0];
    e.onclick=function(){ sColor=p[0]; if(sTool==='eraser') sTool='brush'; refreshTools(); sfx('ui'); }; sw.appendChild(e); });
  // pointer paint
  pad.addEventListener('pointerdown',padDown,{passive:false});
  pad.addEventListener('pointermove',padMove,{passive:false});
  window.addEventListener('pointerup',padUp,{passive:false});
  pad.addEventListener('pointercancel',padUp,{passive:false});
}
function toolBtn(label,key,fn){ var b=document.createElement('div'); b.className='tool'; b.dataset.tk=key; b.textContent=label; b.onclick=function(){ fn(); sfx('ui'); }; return b; }
function refreshTools(){
  var bt=$('brushtools').children; for(var i=0;i<bt.length;i++){ var el=bt[i]; if(el.dataset.brush!=null) el.classList.toggle('sel',sTool==='brush'&&+el.dataset.brush===sBrush); if(el.dataset.tk==='eraser') el.classList.toggle('sel',sTool==='eraser'); if(el.dataset.tk==='fill') el.classList.toggle('sel',sTool==='fill'); }
  var at=$('acttools').children; for(var j=0;j<at.length;j++){ if(at[j].dataset.tk==='mirror') at[j].classList.toggle('sel',sMirror); }
  var sw=$('swatches').children; for(var k=0;k<sw.length;k++) sw[k].classList.toggle('sel',sw[k].dataset.col===sColor&&sTool!=='eraser');
}
function padPos(e){ var r=pad.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*128, y:(e.clientY-r.top)/r.height*128 }; }
function pushUndo(){ try{ undoStack.push(padCtx.getImageData(0,0,128,128)); if(undoStack.length>12) undoStack.shift(); redoStack.length=0; }catch(e){} }
function doUndo(){ if(!undoStack.length) return; try{ redoStack.push(padCtx.getImageData(0,0,128,128)); padCtx.putImageData(undoStack.pop(),0,0); }catch(e){} sfx('ui'); }
function doRedo(){ if(!redoStack.length) return; try{ undoStack.push(padCtx.getImageData(0,0,128,128)); padCtx.putImageData(redoStack.pop(),0,0); }catch(e){} sfx('ui'); }
function confirmClear(){ modal('<h3>Clear drawing?</h3><p>This wipes the canvas.</p><div class="row"><button class="btn sm ghost" id="mx1">Keep</button><button class="btn sm" id="mx2">Clear</button></div>');
  tap('mx1',closeModal); tap('mx2',function(){ pushUndo(); padCtx.clearRect(0,0,128,128); closeModal(); }); }
function dab(x,y){
  padCtx.save();
  var r=BRUSH_SIZES[sBrush]/2;
  if(sTool==='eraser'){ padCtx.globalCompositeOperation='destination-out'; padCtx.fillStyle='#000'; }
  else padCtx.fillStyle=sColor;
  padCtx.beginPath(); padCtx.arc(x,y,r,0,7); padCtx.fill();
  if(sMirror){ padCtx.beginPath(); padCtx.arc(127-x,y,r,0,7); padCtx.fill(); }
  padCtx.restore();
}
function strokeTo(x,y){ var dx=x-lastPX, dy=y-lastPY, dist=Math.hypot(dx,dy), step=Math.max(1,BRUSH_SIZES[sBrush]/3), n=Math.ceil(dist/step);
  for(var i=1;i<=n;i++) dab(lastPX+dx*i/n, lastPY+dy*i/n); lastPX=x; lastPY=y; }
function padDown(e){ e.preventDefault(); ensureAudio(); var p=padPos(e); try{ pad.setPointerCapture(e.pointerId); }catch(_){}
  if(sTool==='fill'){ pushUndo(); floodFill(p.x|0,p.y|0); return; }
  pushUndo(); painting=true; lastPX=p.x; lastPY=p.y; dab(p.x,p.y); }
function padMove(e){ if(!painting) return; e.preventDefault(); var p=padPos(e); strokeTo(p.x,p.y); }
function padUp(){ painting=false; }
function floodFill(sx,sy){
  if(sx<0||sy<0||sx>=128||sy>=128) return;
  var img; try{ img=padCtx.getImageData(0,0,128,128); }catch(e){ return; } var d=img.data;
  function at(x,y){ return (y*128+x)*4; }
  var si=at(sx,sy), tr=d[si],tg=d[si+1],tb=d[si+2],ta=d[si+3];
  var col=hexToRgb(sColor); if(!col) return;
  if(Math.abs(tr-col.r)<4&&Math.abs(tg-col.g)<4&&Math.abs(tb-col.b)<4&&ta>250) return;
  var tol=32, seen=new Uint8Array(128*128), st=[sx,sy];
  function match(i){ return Math.abs(d[i]-tr)<=tol&&Math.abs(d[i+1]-tg)<=tol&&Math.abs(d[i+2]-tb)<=tol&&Math.abs(d[i+3]-ta)<=tol; }
  while(st.length){ var y=st.pop(),x=st.pop(); if(x<0||y<0||x>=128||y>=128) continue; var idx=y*128+x; if(seen[idx]) continue; var i=idx*4; if(!match(i)) continue; seen[idx]=1;
    d[i]=col.r; d[i+1]=col.g; d[i+2]=col.b; d[i+3]=255;
    st.push(x+1,y,x-1,y,x,y+1,x,y-1);
    if(sMirror){ var mx=127-x, mi=(y*128+mx)*4; d[mi]=col.r; d[mi+1]=col.g; d[mi+2]=col.b; d[mi+3]=255; seen[y*128+mx]=1; }
  }
  padCtx.putImageData(img,0,0);
}
function hexToRgb(h){ if(h[0]!=='#') return null; if(h.length===4) h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3]; var n=parseInt(h.slice(1),16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function loadPadFromPng(png){ var img=new Image(); img.onload=function(){ padCtx.clearRect(0,0,128,128); padCtx.drawImage(img,0,0,128,128); }; img.src=png; }
function paintedPx(){ try{ var d=padCtx.getImageData(0,0,128,128).data,c=0; for(var i=3;i<d.length;i+=4) if(d[i]>8) c++; return c; }catch(e){ return 999; } }
function saveEquip(){
  var px=paintedPx(); var img; try{ img=padCtx.getImageData(0,0,128,128); }catch(e){ img=null; }
  var bb=img?alphaBBox(img.data,128,128):null;
  if(px<20||!bb||bb.w<8||bb.h<8){
    modal('<h3>Add a few more strokes!</h3><p>Your climber needs a little more to it. Draw some more, or start from the example.</p><div class="row"><button class="btn sm ghost" id="mx1">Keep drawing</button><button class="btn sm" id="mx2">Use example</button></div>');
    tap('mx1',closeModal); tap('mx2',function(){ pushUndo(); drawDefaultDoodle(padCtx); closeModal(); }); return;
  }
  var png=pad.toDataURL('image/png');
  if(editingIndex!=null && sketchbook[editingIndex]) sketchbook[editingIndex]={png:png};
  else { sketchbook.push({png:png}); if(sketchbook.length>9) sketchbook.shift(); editingIndex=sketchbook.length-1; }
  LS.setJSON(K.book,sketchbook);
  setEquip({type:'doodle',index:editingIndex});
  sfx('best'); LS.set(K.bounce,'1');
  if(onboarding){ onboarding=false; startRun(); } else toTitle();
}
function openStudio(index){
  initStudio(); refreshTools();
  editingIndex = (index==null?null:index);
  if(index!=null && sketchbook[index]) loadPadFromPng(sketchbook[index].png);
  else padCtx.clearRect(0,0,128,128);
  undoStack.length=0; redoStack.length=0;
  show('s-studio');
}

function renderGallery(){
  var g=$('gal-grid'); g.innerHTML='';
  sketchbook.forEach(function(slot,i){
    var cell=document.createElement('div'); cell.className='cell'+(equip.type==='doodle'&&equip.index===i?' equipped':'');
    var cv=document.createElement('canvas'); cv.width=88; cv.height=88; var im=new Image(); im.onload=function(){ cv.getContext('2d').drawImage(im,4,4,80,80); }; im.src=slot.png;
    cell.appendChild(cv);
    var nm=document.createElement('div'); nm.className='nm'; nm.textContent='Doodle '+(i+1); cell.appendChild(nm);
    var m1=document.createElement('div'); m1.className='mini';
    m1.appendChild(mini('Equip',function(){ setEquip({type:'doodle',index:i}); renderGallery(); }));
    m1.appendChild(mini('Edit',function(){ openStudio(i); }));
    cell.appendChild(m1);
    var m2=document.createElement('div'); m2.className='mini';
    m2.appendChild(mini('Del',function(){ delDoodle(i); }));
    m2.appendChild(mini('↗',function(){ dlPng(slot.png,'sproing-doodle-'+(i+1)+'.png'); }));
    cell.appendChild(m2);
    g.appendChild(cell);
  });
  if(sketchbook.length<9){
    var neu=document.createElement('div'); neu.className='cell'; neu.style.justifyContent='center'; neu.style.minHeight='150px';
    neu.innerHTML='<div style="font-size:34px;color:var(--sage)">＋</div><div class="nm">New drawing</div>';
    neu.onclick=function(){ sfx('ui'); openStudio(null); }; g.appendChild(neu);
    var imp=document.createElement('div'); imp.className='cell'; imp.style.justifyContent='center'; imp.style.minHeight='150px';
    imp.innerHTML='<div style="font-size:30px;color:var(--gold)">⤓</div><div class="nm">Import PNG</div>';
    imp.onclick=function(){ sfx('ui'); importPng(); }; g.appendChild(imp);
  }
}
function mini(label,fn){ var b=document.createElement('button'); b.textContent=label; b.onclick=function(e){ e.stopPropagation(); sfx('ui'); fn(); }; return b; }
function delDoodle(i){ modal('<h3>Delete this doodle?</h3><p>It will be removed from your sketchbook.</p><div class="row"><button class="btn sm ghost" id="mx1">Keep</button><button class="btn sm" id="mx2">Delete</button></div>');
  tap('mx1',closeModal); tap('mx2',function(){ sketchbook.splice(i,1); LS.setJSON(K.book,sketchbook);
    if(equip.type==='doodle'){ if(equip.index===i) setEquip({type:'default'}); else if(equip.index>i) setEquip({type:'doodle',index:equip.index-1}); }
    closeModal(); renderGallery(); }); }
function dlPng(png,name){ try{ var a=document.createElement('a'); a.href=png; a.download=name; a.click(); }catch(e){} }
function importPng(){ var inp=document.createElement('input'); inp.type='file'; inp.accept='image/png,image/*';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){
    var img=new Image(); img.onload=function(){ var c=mkCanvas(128,128), cc=c.getContext('2d');
      var s=Math.min(108/img.width,108/img.height); var w=img.width*s,h=img.height*s; cc.drawImage(img,(128-w)/2,(128-h)/2,w,h);
      sketchbook.push({png:c.toDataURL('image/png')}); if(sketchbook.length>9) sketchbook.shift(); LS.setJSON(K.book,sketchbook); renderGallery(); };
    img.src=rd.result; }; rd.readAsDataURL(f); }; inp.click(); }

var shopTab='skins';
function openShop(tab){ shopTab=tab||shopTab||'skins'; renderShop(); show('s-shop'); }
function renderShop(){
  refreshCoinUI();
  var TABS=[['skins','Skins'],['hats','Hats'],['trails','Trails'],['themes','Sky'],['upgrades','Perks'],['goals','Goals']];
  var tb=$('shop-tabs'); tb.innerHTML='';
  TABS.forEach(function(t){ var b=document.createElement('button'); b.className='shoptab'+(shopTab===t[0]?' sel':''); b.style.fontSize='12px'; b.style.minHeight='72px'; b.textContent=t[1]; b.onclick=function(){ shopTab=t[0]; sfx('ui'); renderShop(); }; tb.appendChild(b); });
  var titles={skins:'Skin Shop',hats:'Hats & Accessories',trails:'Trails',themes:'Sky Themes',upgrades:'Upgrades',goals:'Goals'}; $('shop-title').textContent=titles[shopTab]||'Shop';
  var g=$('shop-grid'); g.innerHTML=''; g.classList.toggle('list', shopTab==='upgrades'||shopTab==='goals');
  if(shopTab==='skins') renderSkins(g);
  else if(shopTab==='hats') renderHats(g);
  else if(shopTab==='trails') renderTrails(g);
  else if(shopTab==='themes') renderThemes(g);
  else if(shopTab==='upgrades') renderUpgrades(g);
  else renderGoals(g);
}
function renderHats(g){
  ACCESSORIES.forEach(function(a){
    var cell=document.createElement('div'); cell.className='cell'; var eq=accEquip===a.id; if(eq) cell.classList.add('equipped');
    var cv=document.createElement('canvas'); cv.width=88; cv.height=88; var c=cv.getContext('2d');
    c.fillStyle='#7ab356'; c.strokeStyle=PAL.ink; c.lineWidth=3; c.beginPath(); c.arc(44,56,21,0,7); c.fill(); c.stroke();
    c.fillStyle='#fff'; c.beginPath(); c.arc(37,55,5,0,7); c.arc(51,55,5,0,7); c.fill(); c.fillStyle=PAL.ink; c.beginPath(); c.arc(38,56,2.4,0,7); c.arc(52,56,2.4,0,7); c.fill();
    drawAccessory(c, a.id, 44, 35);
    cell.appendChild(cv);
    var nm=document.createElement('div'); nm.className='nm'; nm.textContent=a.name; cell.appendChild(nm);
    var have=accOwned.indexOf(a.id)>=0 || a.cost===0;
    var m=document.createElement('div'); m.className='mini';
    if(have) m.appendChild(mini(eq?'Worn':'Wear',function(){ if(!eq){ equipAcc(a.id); renderShop(); } }));
    else { var buy=mini('🪙 '+a.cost,function(){ buyAcc(a); }); if(coins<a.cost) buy.style.opacity='.55'; m.appendChild(buy); }
    cell.appendChild(m); g.appendChild(cell);
  });
}
function equipAcc(id){ accEquip=id; LS.set(K.acc,id); applyEquip(); }
function buyAcc(a){ if(coins<a.cost){ notEnough(a.cost,a.name); return; } confirmBuy(a.name,a.cost,function(){ if(spendCoins(a.cost)){ accOwned.push(a.id); LS.setJSON(K.accs,accOwned); equipAcc(a.id); sfx('best'); renderShop(); } }); }
function renderThemes(g){
  THEMES.forEach(function(t){
    var cell=document.createElement('div'); cell.className='cell'; var eq=themeEquip===t.id; if(eq) cell.classList.add('equipped');
    var cv=document.createElement('canvas'); cv.width=88; cv.height=88; var c=cv.getContext('2d');
    var SK=(t.id==='default')?BIOME_SKY:(THEME_SKY[t.id]||BIOME_SKY);
    var grd=c.createLinearGradient(0,0,0,88); grd.addColorStop(0,SK[1][0]); grd.addColorStop(1,SK[3][1]); c.fillStyle=grd; c.fillRect(0,0,88,88);
    c.strokeStyle='rgba(63,107,52,.75)'; c.lineWidth=9; c.lineCap='round'; c.beginPath(); c.moveTo(44,0); for(var y=0;y<=88;y+=8) c.lineTo(44+Math.sin(y*0.1)*11,y); c.stroke();
    cell.appendChild(cv);
    var nm=document.createElement('div'); nm.className='nm'; nm.textContent=t.name; cell.appendChild(nm);
    var have=themesOwned.indexOf(t.id)>=0 || t.cost===0;
    var m=document.createElement('div'); m.className='mini';
    if(have) m.appendChild(mini(eq?'Active':'Use',function(){ if(!eq){ equipTheme(t.id); renderShop(); } }));
    else { var buy=mini('🪙 '+t.cost,function(){ buyTheme(t); }); if(coins<t.cost) buy.style.opacity='.55'; m.appendChild(buy); }

function equipTheme(id){ themeEquip=id; LS.set(K.theme,id); }
function buyTheme(t){ if(coins<t.cost){ notEnough(t.cost,t.name); return; } confirmBuy(t.name,t.cost,function(){ if(spendCoins(t.cost)){ themesOwned.push(t.id); LS.setJSON(K.themes,themesOwned); equipTheme(t.id); sfx('best'); renderShop(); } }); }
function notEnough(cost,name){ modal('<h3>Not enough coins</h3><p>You need <b class="gold">'+cost+'</b> 🪙 for '+name+'. Keep climbing to earn more!</p><button class="btn sm primary" id="mx1">OK</button>'); tap('mx1',closeModal); }
// "Are you sure?" gate before any coin purchase (Stephen 2026-07-08). Callers
// pass the affordable branch as onYes; the coins<cost check stays upstream so
// an unaffordable tap still shows notEnough with no confirm.
function confirmBuy(name,cost,onYes){ modal('<h3>Buy '+name+'?</h3><p>This spends <b class="gold">'+cost+'</b> 🪙 from your wallet.</p><div class="row"><button class="btn sm ghost" id="mx1">Cancel</button><button class="btn sm" id="mx2">Buy</button></div>'); tap('mx1',closeModal); tap('mx2',function(){ closeModal(); onYes(); }); }
function renderSkins(g){
  SKIN_DEFS.forEach(function(def){

function biomeIdx(m){ return Math.max(0,Math.min(5,Math.floor(m/500))); }

// Seeded generation stream (used ONLY by world-gen so Level/Daily layouts are
// deterministic). Cosmetic randomness stays on Math.random so it can't desync it.
var RNG=Math.random;
function srand(seed){ var s=(seed>>>0)||1; return function(){ s=(s+0x6D2B79F5)|0; var t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function grnd(a,b){ return a+RNG()*(b-a); }
function gpick(arr){ return arr[(RNG()*arr.length)|0]; }

function levelDef(idx){
  var world=Math.floor(idx/PER_WORLD), lw=idx%PER_WORLD;
  var targetM=100 + world*80 + lw*10;                     // 100m .. ~1200m
  var mod=LEVEL_MODS[(idx*3+world*2)%LEVEL_MODS.length];
  if(world===0 && lw<2) mod=LEVEL_MODS[0];                // gentle intro
  var seed=((idx+1)*2654435761)>>>0;
  return {idx:idx, world:world, lw:lw, targetM:targetM, starCoins:Math.round(targetM*0.16), mod:mod, seed:seed};
}
var levelProg=LS.getJSON(K.levels,{stars:{}, unlocked:0});   // unlocked = highest playable idx
/* {"stars":7} passes the object check but is not a MAP, and this file is strict mode,
   so levelProg.stars[idx]=n on a number throws inside the clear handler. Insist on the
   inner shape too — the outer type check is not enough on a nested structure. */
if(!levelProg.stars||typeof levelProg.stars!=='object'||Object.prototype.toString.call(levelProg.stars)==='[object Array]') levelProg.stars={};
if(!(levelProg.unlocked>=0)) levelProg.unlocked=0;
/* ⛔ Two tabs clobber: this was written wholesale from a boot snapshot, so the tab that
   saved last erased the other's stars and unlocks. Stars MAX per level, unlocked MAX. */
function saveLevelProg(){
  var disk=LS.getJSON(K.levels,null);
  if(disk&&disk.stars&&typeof disk.stars==='object'){
    for(var k in disk.stars){ if(!(levelProg.stars[k]>disk.stars[k])) levelProg.stars[k]=disk.stars[k]; }
    if(disk.unlocked>levelProg.unlocked) levelProg.unlocked=disk.unlocked;
  }
  LS.setJSON(K.levels,levelProg);
}
function levelStars(idx){ return levelProg.stars[idx]||0; }
function levelUnlocked(idx){ return idx<=(levelProg.unlocked||0); }
function totalStars(){ var t=0; for(var k in levelProg.stars) t+=levelProg.stars[k]; return t; }
function dailySeed(){ var d=dayStr(),h=5381; for(var i=0;i<d.length;i++) h=((h*33)^d.charCodeAt(i))>>>0; return h||1; }

var curMode='endless', curLevelIdx=0;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// The guaranteed climb path only ever uses SOLID landable types (broad/drifting/
// mushroom/fiddlehead) so there is always a clearable route up.
function pickPathType(m){ var b=biomeFor(m), r=RNG();
  if(r<b.wFidd*0.6) return 'fiddlehead';
  if(r<b.wFidd*0.6+0.05) return 'mushroom';
  if(r<b.wFidd*0.6+0.05+Math.min(b.wMove,0.26)) return 'drifting';
  return 'broad';
}
// Tricky/timing types (crumble/dewy/dandelion/thorn) live ONLY on optional decoys.
function pickDecoyType(m){ var b=biomeFor(m), r=RNG();
  if(r<b.wCrumble) return 'crumble';
  if(r<b.wCrumble+b.wDewy) return 'dewy';
  if(r<b.wCrumble+b.wDewy+b.wDand) return 'dandelion';
  if(biomeIdx(m)>=4 && r<b.wCrumble+b.wDewy+b.wDand+0.14) return 'thornleaf';
  if(r<b.wCrumble+b.wDewy+b.wDand+0.30) return 'mushroom';
  return 'broad';
}
var SOLID={broad:1,drifting:1,mushroom:1,fiddlehead:1};
function platWidth(t){ return t==='mushroom'?58:(t==='fiddlehead'?48:(t==='broad'?92:78)); }

function generateUp(){
  var guard=0, MAXREACH=195;   // every path gap stays < a normal hop's rise (~300px) with margin → always clearable
  var pestMul=game.pestMul||1, coinMul=game.coinMul||1, hazMul=game.hazMul||1;
  var charmF=(RNG===Math.random)?(1-0.12*upLvl('charm')):1;   // per-player upgrade kept OUT of the seeded stream (Daily/Level stay identical for everyone)
  while(game.topGenY > game.camY-360 && guard++<200){
    // biome/difficulty by the GENERATION height (pure function of the seed) — NOT the
    // player's live position, which varies with skill/powerups/device aspect and would desync a seed.
    var m=Math.max(0,Math.floor((game.startY-game.topGenY)/PX_PER_M)), b=biomeFor(m);
    var gap=grnd(b.gapMin, Math.min(b.gapMax+(game.gapAdd||0), MAXREACH));
    var type=pickPathType(m);
    var ny=game.topGenY-gap;
    var nx=clamp(game.lastPathX+grnd(-180,180),46,VW-46);
    var p={x:nx,y:ny,w:platWidth(type),type:type,vx:(type==='drifting'?grnd(38,78)*(RNG()<.5?-1:1):0),dir:1,
      alive:true, crumbling:false, crumbleT:0, born:game.t, thorn:0, trapT:grnd(0,2.2), trapOpen:false};
    game.platforms.push(p);
    game.topGenY=ny; game.lastPathX=nx; game.lastPathY=ny;
    if(RNG()<0.35*coinMul) game.coins.push({x:nx,y:ny-24,r:10,got:false,gold:false});
    if(RNG()<0.22*coinMul){ var ax=clamp(nx+grnd(-90,90),30,VW-30); for(var c=0;c<4;c++) game.coins.push({x:ax+(c-1.5)*22, y:ny+gap*0.5-Math.abs(c-1.5)*14, r:9, got:false, gold:false}); }
    if(RNG()<0.02*coinMul) game.coins.push({x:clamp(nx+grnd(-40,40),30,VW-30),y:ny-40,r:13,got:false,gold:true});
    // pest on the path platform (avoidable by landing position / mid-air dodge) — NEVER a flytrap here
    if(RNG()<b.pest*pestMul){ var pe=gpick(b.pests); if(pe==='flytrap') pe=gpick(['aphid','snail','beetle']); spawnPest(pe,p); }
    // DECOY: an OPTIONAL side platform where the tricky/timing types (and flytraps) live
    if(RNG()<0.55){ var dt=pickDecoyType(m); var dx=clamp(nx+grnd(120,205)*(RNG()<.5?-1:1),46,VW-46);
      var dp={x:dx,y:ny+grnd(-30,26),w:platWidth(dt),type:dt,vx:(dt==='drifting'?grnd(38,78):0),dir:1,alive:true,crumbling:false,crumbleT:0,born:game.t,thorn:0,trapT:grnd(0,2.2),trapOpen:false};
      game.platforms.push(dp);
      if(biomeIdx(m)>=4 && RNG()<0.12*pestMul) spawnPest('flytrap',dp);
    }
    if(m-game.lastPowM >= b.powInt*charmF){ game.lastPowM=m; game.powerups.push({x:clamp(nx+grnd(-80,80),40,VW-40),y:ny-grnd(30,80),r:16,id:powForBiome(m),got:false}); }
    if(b.haz.length && m-game.lastHazM > 110 && RNG()<0.45*hazMul){ game.lastHazM=m; spawnHazard(gpick(b.haz),ny,gap); }
  }
}
function spawnPest(type,p){
  if(type==='flytrap'){ p.type='flytrap'; p.trapT=grnd(0,2); p.trapOpen=false; p.w=78; return; }
  var pe={type:type,x:p.x,y:p.y-18,r:15,vx:0,leaf:p,phase:RNG()*6,alive:true};
  if(type==='aphid'){ pe.vx=25*(RNG()<.5?-1:1); pe.y=p.y-20; }
  else if(type==='snail'){ pe.y=p.y-12; pe.vx=18*(RNG()<.5?-1:1); }
  else if(type==='beetle'){ pe.y=p.y-12; pe.vx=55*(RNG()<.5?-1:1); }
  else if(type==='wasp'){ pe.leaf=null; pe.x=RNG()<.5?-20:VW+20; pe.baseY=p.y-46; pe.y=pe.baseY; pe.vx=150*(pe.x<0?1:-1); }
  else if(type==='spider'){ pe.leaf=null; pe.x=p.x+grnd(-30,30); pe.threadY=p.y-40; pe.y=p.y-40; pe.phase=RNG()*6; pe.bottom=p.y+90; pe.top=p.y-70; pe.pauseT=0; }
  game.pests.push(pe);
}
function spawnHazard(type,ny,gap){
  if(type==='wind'){ game.hazards.push({type:'wind',y0:ny-40,y1:ny-40-grnd(180,300),dir:(RNG()<.5?-1:1),push:120}); }
  else if(type==='seed'){ for(var i=0;i<2;i++) game.hazards.push({type:'seed',x:grnd(40,VW-40),y:ny-grnd(0,120),vy:grnd(120,180),phase:RNG()*6,stun:false}); }
  else if(type==='bramble'){ game.hazards.push({type:'bramble',y:ny-gap*0.5,phase:RNG()*3,ext:0}); }
  else if(type==='haze'){ game.hazards.push({type:'haze',y0:ny+20,y1:ny-160}); }
}

function landFx(pl){ var col=pl.type==='mushroom'?PAL.pink:(pl.type==='fiddlehead'?PAL.deep:PAL.sage); burst(game.player.x,pl.y,pl.type==='mushroom'?12:6,col,pl.type==='mushroom'?260:160); }

function gainCoins(n){ n=Math.round(n*(game.luckyMult||1)); game.coinsRun+=n; return n; }
function chainMultVal(){ var c=game.chain; return c>=35?4:(c>=20?3:(c>=10?2:(c>=5?1.5:1))); }
function updateChainTier(){ var m=chainMultVal(); var pill=$('chain'); if(pill){ pill.textContent='x'+m + (game.chain>=5?' · '+game.chain:''); pill.style.opacity=game.chain>=5?'1':'0'; } }

/* ---------- powerups ---------- */
function applyPowerup(id){
  var p=game;
  switch(id){
    case 'dandelion_parachute': p.parachuteT=5; break;
    case 'nectar_magnet': p.magnetT=8; break;
    case 'bubble_shield': p.shield=true; break;
    case 'propeller_seed': p.propellerT=4; addTrauma(0.4); break;
    case 'spring_roots': p.springHops=5; break;
    case 'giant_leaf': p.giant=3; break;
    case 'shrink_bud': p.shrinkT=6; p.player.scale=0.55; break;
    case 'pollen_jetpack': p.jetpackT=3.5; addTrauma(0.5); break;
    case 'slow_time_honey': p.slowT=5; break;
    case 'ghost_spores': p.ghostT=4; break;
  }
  stats.powerups=(stats.powerups||0)+1;
  sfx('power'); addFloat(p.player.x,p.player.y-60, powName(id), PAL.cream); buzz(20);
}
function powName(id){ var d=id.replace(/_/g,' '); return d.replace(/\b\w/g,function(c){return c.toUpperCase();}); }

function applyHit(cause){
  if(game.ghostT>0||game.invulnT>0) return;
  if(game.shield){ game.shield=false; game.invulnT=0.7; addTrauma(0.3); sfx('hit'); addFloat(game.player.x,game.player.y-50,'Shielded!',PAL.sky); return; }
  die(cause);
}
function die(cause){ if(!game||!game.running) return;
  if(game.zen){ sturdySave(); return; }                                   // Zen: never die
  if(cause==='fall' && upLvl('sturdy')>0 && !game.usedSturdy){ game.usedSturdy=true; sturdySave(); return; }
  game.running=false; game.dead=true; game.cause=cause||'fall'; addTrauma(0.8); sfx(cause==='fall'?'fall':'hit'); buzz(60); setTimeout(onGameOver,120); }
function sturdySave(){ var p=game.player; p.y=game.camY+VH-150; p.x=VW/2; p.vy=-1950; p.vx=0; game.q=-0.3; game.chain=1; updateChainTier();
  game.platforms.push({x:VW/2,y:p.y+44,w:110,type:'broad',vx:0,dir:1,alive:true,born:game.t});
  game.pests=game.pests.filter(function(pe){ return (pe.y-game.camY)<VH-210; });
  game.invulnT=1.1; sfx('updraft'); addTrauma(0.5); addFloat(VW/2,p.y-40,'🛡️ Sturdy Roots!',PAL.sage); buzz(30); }

/* ---------- main update ---------- */
function updateGame(dt){
  var p=game.player, slow=game.slowT>0?0.45:1;
  // resolve steer axis (keyboard overrides tilt; tilt off in pure-drag mode)
  var kA=(INP.keyL?-1:0)+(INP.keyR?1:0);
  INP.tiltInput = kA!==0?kA : ((SET.steer==='drag')?0:(INP.tiltAxis||0));
  // ---- steering ----
  var steerMul=game.hopSteerMul;
  if(game.stunT>0){ p.vx*=Math.exp(-9*dt); }
  else if(INP.dragX!=null){ var ss=SET.steerSens||1; var desired=clamp((INP.dragX-p.x)*12*ss,-MAXHORIZ,MAXHORIZ); p.vx=desired*steerMul; }
  else { var ti=INP.tiltInput, ss2=SET.steerSens||1, sc=(game.parachuteT>0?2:1)*steerMul; if(ti!==0){ p.vx+=ti*3200*ss2*sc*dt; p.vx=clamp(p.vx,-MAXHORIZ*sc,MAXHORIZ*sc); } else p.vx*=Math.exp(-9*dt); }
  // wind push
  for(var h=0;h<game.hazards.length;h++){ var hz=game.hazards[h]; if(hz.type==='wind' && p.y<=hz.y0 && p.y>=hz.y1){ p.vx=clamp(p.vx+hz.dir*hz.push*dt*6,-MAXHORIZ,MAXHORIZ); } }
  // ---- vertical ----
  if(game.jetpackT>0) p.vy=-1500;
  else if(game.propellerT>0) p.vy=-820;
  else { p.vy+=GRAV*dt; if(game.parachuteT>0) p.vy=Math.min(p.vy,240); p.vy=Math.min(p.vy,MAXFALL); }
  // integrate
  var prevFeet=p.y;
  p.y+=p.vy*dt; p.x+=p.vx*dt;
  if(p.x<0) p.x+=VW; else if(p.x>=VW) p.x-=VW;
  // squash spring
  game.qv+=(-520*game.q-20*game.qv)*dt; game.q+=game.qv*dt;
  // ---- landing (swept) ----
  if(p.vy>0 && game.jetpackT<=0 && game.propellerT<=0){
    var hw=p.w*p.scale/2;
    for(var i=0;i<game.platforms.length;i++){ var pl=game.platforms[i]; if(!pl.alive) continue;
      if(pl.type==='dandelion' && pl.faded) continue;
      var top=pl.y;
      if(prevFeet<=top+LANDTOL && p.y>=top-LANDTOL){
        var dx=Math.abs(p.x-pl.x); dx=Math.min(dx,VW-dx);
        if(dx<=pl.w/2+hw*0.5){ onLand(pl); break; }
      }
    }
  }
  // ---- camera / altitude ----
  var lockOff=(game.jetpackT>0||game.propellerT>0)?300:LOCK;
  if(p.y-game.camY<lockOff) game.camY=Math.min(game.camY,p.y-lockOff);
  if(p.y<game.bestY){ game.bestY=p.y; game.maxRise=game.startY-game.bestY; var nm=Math.floor(game.maxRise/PX_PER_M);
    if(nm>game.meters){ game.meters=nm; onMilestone(); } }
  // ---- level goal reached? ----
  if(game.targetM>0 && game.meters>=game.targetM && !game.won){ game.won=true; onLevelClear(); return; }
  // ---- death ----
  if((p.y-game.camY)>VH+DEATH_MARGIN){ die('fall'); return; }
  // ---- timers ----
  var T=['parachuteT','magnetT','propellerT','shrinkT','jetpackT','slowT','ghostT','invulnT','stunT','nearMissCd','trauma'];
  for(var t=0;t<T.length;t++){ if(game[T[t]]>0){ game[T[t]]=Math.max(0,game[T[t]]-dt); } }
  if(game.shrinkT<=0 && p.scale!==1) p.scale=1;
  if(game.trauma<0) game.trauma=0;
  // ---- generate + cull ----
  generateUp();
  cull();
  // ---- entities ----
  updateEntities(dt,slow);
  updatePests(dt,slow);
  updateHazards(dt,slow);
  var _mr=game.magnetT>0?220:(game.passiveMag||0); if(_mr>0) pullCoins(dt,_mr);
  collectItems();
  // cosmetic trail
  if(trailEquip!=='none' && !reduceMotion()){ game.trailT=(game.trailT||0)-dt; if(game.trailT<=0){ game.trailT=0.045;
    var td=trailDef(trailEquip); var col=td.col==='rainbow'?('hsl('+Math.round((game.t*120)%360)+',80%,66%)'):td.col;
    game.particles.push({x:p.x+rnd(-7,7),y:p.y-6,vx:rnd(-14,14),vy:rnd(-6,10),life:0.5,max:0.5,col:col,size:rnd(2,4.5),t:1}); } }
  refreshHUD();
}

function onLand(pl){
  var p=game.player;
  if(pl.type==='flytrap' && pl.trapOpen){ applyHit('flytrap'); return; }
  if(pl.type==='thornleaf' && pl.thornUp){ applyHit('thorn'); return; }
  // leaf-sitter pests, resolved by where you land: aphid = stomp for coins,
  // beetle = hurt only if you land ON its horn (land elsewhere on the leaf to pass),
  // snail = safe shell bounce (harmless obstacle).
  for(var _pi=0;_pi<game.pests.length;_pi++){ var _pe=game.pests[_pi]; if(!_pe.alive||_pe.leaf!==pl) continue;
    var _dx=Math.abs(p.x-_pe.x); _dx=Math.min(_dx,VW-_dx);
    if(_pe.type==='aphid'){ if(_dx<_pe.r+14){ _pe.alive=false; stats.aphids=(stats.aphids||0)+1; var _ag=gainCoins(2); addFloat(_pe.x,_pe.y-18,'+'+_ag+' 🪙',PAL.gold); burst(_pe.x,_pe.y,6,PAL.sage,150); sfx('stomp'); } }
    else if(_pe.type==='beetle'){ if(_dx<_pe.r+8){ applyHit('beetle'); return; } }
  }
  var imp=HOP; if(pl.type==='mushroom') imp=SPRING; else if(pl.type==='fiddlehead') imp=MEGA;
  var mul=1; if(game.springHops>0){ mul=1.6; game.springHops--; } if(game.shrinkT>0) mul*=1.1;
  p.y=pl.y; p.vy=-imp*mul; game.q=-0.42; game.qv=0;
  if(pl.y<game.launchY-1) game.chain++;
  else if(pl.y>game.launchY+1){ if(game.chain>=5) sfx('chainbreak'); game.chain=1; }
  game.launchY=pl.y; updateChainTier();
  if(game.chain>(stats.maxChain||1)) stats.maxChain=game.chain;
  game.hopSteerMul=(pl.type==='dewy')?0.4:1;
  sfx(pl.type==='mushroom'?'spring':(pl.type==='fiddlehead'?'mega':'hop'),Math.min(game.chain,12));
  landFx(pl);
  if(pl.type==='mushroom'||pl.type==='fiddlehead') addTrauma(0.35);
  if(pl.type==='crumble'){ pl.crumbling=true; pl.crumbleT=0.18; }
  if(pl.type==='dandelion' && pl.fadeT==null) pl.fadeT=0.7;  // arm blow-away ON CONTACT (not at spawn) — keeps it solid+climbable until landed
  if(game.giant>0){ game.giant--; game.platforms.push({x:p.x,y:pl.y+rnd(64,92),w:96,type:'broad',vx:0,dir:1,alive:true,born:game.t}); }
  buzz(8);
}

function onMilestone(){
  var m=game.meters;
  if(m>0 && m-game.lastMilestoneM>=250){ game.lastMilestoneM=Math.floor(m/250)*250; var k=Math.min(game.lastMilestoneM/250,12); var reward=8+2*k;
    var _mr=gainCoins(reward); addFloat(game.player.x,game.player.y-70,'+'+_mr+' 🪙 '+game.lastMilestoneM+'m',PAL.gold); sfx('best'); }
  if(best>0 && game.maxRise>0 && Math.floor(game.startY-game.bestY)===Math.floor(best*PX_PER_M)){ /* passing best line handled visually */ }
}

/* ---------- entities ---------- */
function cull(){
  var lim=game.camY+VH+340;
  game.platforms=game.platforms.filter(function(pl){ return pl.alive && pl.y<lim; });
  game.pests=game.pests.filter(function(pe){ return pe.alive && pe.y<lim+80; });
  game.coins=game.coins.filter(function(c){ return !c.got && c.y<lim; });
  game.powerups=game.powerups.filter(function(pu){ return !pu.got && pu.y<lim; });
  game.hazards=game.hazards.filter(function(hz){ return (hz.y0!=null?hz.y0:hz.y)<lim; });
}
function updateEntities(dt,slow){
  var i;
  for(i=0;i<game.platforms.length;i++){ var pl=game.platforms[i];
    if(pl.type==='drifting'){ pl.x+=pl.vx*dt*slow; if(pl.x<pl.w/2){ pl.x=pl.w/2; pl.vx*=-1; } else if(pl.x>VW-pl.w/2){ pl.x=VW-pl.w/2; pl.vx*=-1; } }
    if(pl.crumbling){ pl.crumbleT-=dt; if(pl.crumbleT<=0){ pl.alive=false; if(!reduceMotion()) burst(pl.x,pl.y,6,PAL.gold,120); sfx('crumble'); } }
    if(pl.type==='dandelion'){ if(!pl.faded && pl.fadeT!=null){ pl.fadeT-=dt; if(pl.fadeT<=0){ pl.faded=true; pl.alive=false; } } }
    if(pl.type==='thornleaf'){ var ph=(game.t+pl.trapT)% 1.4; pl.thornUp = ph>0.9; pl.thornTele = ph>0.6 && ph<=0.9; }
    if(pl.type==='flytrap'){ pl.trapT-=dt*slow; if(pl.trapT<=0){ pl.trapOpen=!pl.trapOpen; pl.trapT=pl.trapOpen?0.9:1.3; } }
  }
  for(i=game.particles.length-1;i>=0;i--){ var pa=game.particles[i]; pa.life-=dt; if(pa.life<=0){ game.particles.splice(i,1); continue; } if(!pa.t) pa.vy+=600*dt; pa.x+=pa.vx*dt; pa.y+=pa.vy*dt; }
  for(i=game.floats.length-1;i>=0;i--){ var fl=game.floats[i]; fl.life-=dt; fl.y-=30*dt; if(fl.life<=0) game.floats.splice(i,1); }
}
function updatePests(dt,slow){
  var p=game.player, hw=p.w*p.scale/2;
  for(var i=0;i<game.pests.length;i++){ var pe=game.pests[i]; if(!pe.alive) continue; var dts=dt*slow;
    if(pe.type==='aphid'||pe.type==='snail'||pe.type==='beetle'){
      if(pe.leaf&&pe.leaf.alive){ pe.x+=pe.vx*dts; var lo=pe.leaf.x-pe.leaf.w/2+8, hi=pe.leaf.x+pe.leaf.w/2-8; if(pe.x<lo){pe.x=lo;pe.vx*=-1;} else if(pe.x>hi){pe.x=hi;pe.vx*=-1;} pe.y=pe.leaf.y-(pe.type==='aphid'?20:12); } else pe.alive=false;
    } else if(pe.type==='wasp'){ pe.x+=pe.vx*dts; pe.y=pe.baseY+Math.sin(game.t*6+pe.phase)*8; if(pe.x<-40||pe.x>VW+40) pe.alive=false; }
    else if(pe.type==='spider'){ pe.phase+=dt*slow*(Math.PI*2/1.2); var s=(Math.sin(pe.phase)+1)/2; pe.y=pe.top+(pe.bottom-pe.top)*s; pe.atBottom = s>0.92; }
    // MID-AIR pests only (wasp flies, spider yo-yos). Leaf-sitters (aphid/snail/
    // beetle) are resolved in onLand by WHERE you land, so you can't be killed
    // from below after bouncing off their leaf.
    if(pe.type==='wasp'||pe.type==='spider'){
      var dx=Math.abs(p.x-pe.x); dx=Math.min(dx,VW-dx); var dy=p.y-pe.y; var dist=Math.hypot(dx,dy);
      var stompable=(pe.type==='spider'&&pe.atBottom);
      if(dist < pe.r+hw*0.7){
        var feetAbove = (p.y - p.vy*dt) <= pe.y-2;
        if(stompable && p.vy>0 && feetAbove){ pe.alive=false; p.vy=-HOP*0.95; game.q=-0.3; sfx('stomp'); var _sg=gainCoins(2); addFloat(pe.x,pe.y-20,'+'+_sg+' 🪙',PAL.gold); burst(pe.x,pe.y,6,PAL.sage,150); }
        else applyHit(pe.type);
      } else if(dist<pe.r+hw*0.7+40 && !pe.nearMissed && game.nearMissCd<=0){ pe.nearMissed=true; var _nm=gainCoins(1); addFloat(p.x,p.y-40,'Close! +'+_nm,PAL.cream); game.nearMissCd=0.4; }
    }
  }
}
function updateHazards(dt,slow){
  var p=game.player, hw=p.w*p.scale/2;
  for(var i=0;i<game.hazards.length;i++){ var hz=game.hazards[i];
    if(hz.type==='seed'){ hz.y+=hz.vy*dt*slow; hz.phase+=dt*8; var dx=Math.abs(p.x-hz.x); dx=Math.min(dx,VW-dx);
      if(dx<hw+12 && Math.abs(p.y-hz.y)<18 && game.stunT<=0){ game.stunT=0.4; p.vy=Math.max(p.vy,120); sfx('hit'); addFloat(p.x,p.y-30,'Stunned!',PAL.coral); } }
    else if(hz.type==='bramble'){ hz.phase+=dt*slow; var cyc=(game.t*0.5+hz.phase)%2; hz.ext = cyc<1 ? Math.min(1,cyc*3) : Math.max(0,1-(cyc-1)*3);
      if(hz.ext>0.6 && Math.abs(p.y-hz.y)<14) applyHit('bramble'); }
  }
}
function pullCoins(dt,rad){ var p=game.player; for(var i=0;i<game.coins.length;i++){ var c=game.coins[i]; if(c.got) continue; var dx=p.x-c.x, dy=p.y-40-c.y, d=Math.hypot(dx,dy); if(d<rad){ c.x+=dx/d*Math.min(d,420)*dt*2; c.y+=dy/d*Math.min(d,420)*dt*2; } } }
function collectItems(){
  var p=game.player, hw=p.w*p.scale/2, cx=p.x, cy=p.y-p.h*p.scale*0.5;
  for(var i=0;i<game.coins.length;i++){ var c=game.coins[i]; if(c.got) continue; var dx=Math.abs(cx-c.x); dx=Math.min(dx,VW-dx); if(dx<c.r+hw && Math.abs(cy-c.y)<c.r+30){ c.got=true; var got=gainCoins(Math.round((c.gold?10:1)*chainMultVal())); sfx('coin',0); burst(c.x,c.y,c.gold?10:5,PAL.gold,140); addFloat(c.x,c.y-10,'+'+got,PAL.gold); } }
  for(var j=0;j<game.powerups.length;j++){ var pu=game.powerups[j]; if(pu.got) continue; var pdx=Math.abs(cx-pu.x); pdx=Math.min(pdx,VW-pdx); if(pdx<pu.r+hw && Math.abs(cy-pu.y)<pu.r+30){ pu.got=true; applyPowerup(pu.id); } }
}

/* ---------- rendering ---------- */
var BIOME_SKY=[['#2b3350','#dd9866'],['#3a5a7a','#a9d08a'],['#5a9ad0','#c6e6f4'],['#7ab0e0','#eaf3fb'],['#3a2a5a','#c07a5a'],['#05060c','#0d1428']];
function lerp(a,b,t){ return a+(b-a)*t; }
function hx(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function lerpCol(a,b,t){ var A=hx(a),B=hx(b); return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'; }
function skyPair(m){ var SK=(themeEquip&&themeEquip!=='default'&&THEME_SKY[themeEquip])?THEME_SKY[themeEquip]:BIOME_SKY; var f=Math.min(m,3000)/500, i=Math.min(4,Math.floor(f)), t=f-i; var a=SK[i], b=SK[Math.min(5,i+1)]; return [lerpCol(a[0],b[0],t),lerpCol(a[1],b[1],t)]; }

function renderGame(){
  var g=GC; g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,VW,VH);
  // sky
  if(SET.highContrast){ g.fillStyle='#0a0d0a'; g.fillRect(0,0,VW,VH); }
  else {
    // biome background art (skip when a cosmetic THEME_SKY is equipped); gradient fallback
    var usedBg=false;
    if(!(themeEquip&&themeEquip!=='default')) usedBg=drawBiomeBg(g,game.meters);
    if(!usedBg){ var pr=skyPair(game.meters), grd=g.createLinearGradient(0,0,0,VH); grd.addColorStop(0,pr[0]); grd.addColorStop(1,pr[1]); g.fillStyle=grd; g.fillRect(0,0,VW,VH); }
  }
  // stars (upper biomes)
  if(!SET.highContrast && game.meters>1800 && !reduceMotion()){ g.fillStyle='rgba(255,240,190,.8)'; for(var s=0;s<40;s++){ var sx=(s*137)%VW, sy=((s*89 - game.camY*0.25)%VH+VH)%VH; g.globalAlpha=0.4+0.4*Math.sin(game.t*2+s); g.fillRect(sx,sy,2,2); } g.globalAlpha=1; }
  // shake
  var shx=0,shy=0; if(game.trauma>0){ var tr=game.trauma*game.trauma; shx=(Math.random()*2-1)*14*tr; shy=(Math.random()*2-1)*14*tr; }
  g.save(); g.translate(shx,shy);
  var cam=game.camY;
  drawBeanstalk(g,cam);
  var i;
  // hazards behind
  for(i=0;i<game.hazards.length;i++) drawHazard(g,game.hazards[i],cam);
  // best line
  if(best>0){ var by=(game.startY-best*PX_PER_M)-cam; if(by>-20&&by<VH){ g.strokeStyle='rgba(200,168,75,.7)'; g.lineWidth=2; g.setLineDash([8,8]); g.beginPath(); g.moveTo(0,by); g.lineTo(VW,by); g.stroke(); g.setLineDash([]); g.fillStyle=PAL.gold; g.font='bold 12px sans-serif'; g.fillText('BEST '+best+'m',10,by-6); } }
  // platforms
  for(i=0;i<game.platforms.length;i++){ var pl=game.platforms[i]; var sy=pl.y-cam; if(sy<-40||sy>VH+40) continue; drawPlatform(g,pl,sy); }
  // coins
  for(i=0;i<game.coins.length;i++){ var c=game.coins[i]; if(c.got) continue; var cy=c.y-cam; if(cy<-20||cy>VH+20) continue; drawCoin(g,c.x,cy,c.r,c.gold); }
  // powerups
  for(i=0;i<game.powerups.length;i++){ var pu=game.powerups[i]; if(pu.got) continue; var py=pu.y-cam; if(py<-30||py>VH+30) continue; drawPowerup(g,pu.x,py,pu.id); }
  // pests
  for(i=0;i<game.pests.length;i++){ var pe=game.pests[i]; if(!pe.alive) continue; var pey=pe.y-cam; if(pey<-40||pey>VH+40) continue; drawPest(g,pe,pey); }
  // particles
  for(i=0;i<game.particles.length;i++){ var pa=game.particles[i]; var a=pa.life/pa.max; g.globalAlpha=Math.max(0,a); g.fillStyle=pa.col; g.fillRect(pa.x-pa.size/2,(pa.y-cam)-pa.size/2,pa.size,pa.size); } g.globalAlpha=1;
  // player (+ wrap ghost)
  drawPlayer(g,cam,0); var pw=SPR*0.72*game.player.scale/2; if(game.player.x<pw) drawPlayer(g,cam,VW); else if(game.player.x>VW-pw) drawPlayer(g,cam,-VW);
  // floats
  g.textAlign='center'; g.font='bold 15px sans-serif';
  for(i=0;i<game.floats.length;i++){ var fl=game.floats[i]; g.globalAlpha=Math.max(0,fl.life/0.9); g.fillStyle=fl.col; g.fillText(fl.txt,fl.x,fl.y-cam); } g.globalAlpha=1; g.textAlign='left';
  // pollen haze overlay
  for(i=0;i<game.hazards.length;i++){ var hz=game.hazards[i]; if(hz.type==='haze'){ var y0=hz.y0-cam; g.fillStyle='rgba(230,220,140,.16)'; g.fillRect(0,Math.min(y0,VH-140),VW,140); } }
  g.restore();
}

function drawBeanstalk(g,cam){
  g.strokeStyle='rgba(63,107,52,.55)'; g.lineCap='round';
  g.beginPath();

/* ============================ LOOP & RUN CONTROL ========================= */
var lastTs=0, onboarding=false;
function loop(ts){
  requestAnimationFrame(loop);
  if(!game) return;
  if(lastTs===0) lastTs=ts;
  var dt=(ts-lastTs)/1000; lastTs=ts; if(dt>MAXACC) dt=MAXACC; if(dt<0) dt=0;
  if(game.running && !game.paused && curScreen===null){
    game.acc+=dt;
    var steps=0;
    while(game.acc>=DT && steps<6){ game.t+=DT; updateGame(DT); game.acc-=DT; steps++; if(!game.running) break; }
    if(game.acc>0.2) game.acc=0;
  }
  if(curScreen===null) renderGame();   // pause screen is opaque; countdown runs with curScreen===null
}
function refreshHUD(){
  var a=$('alt'); if(a){ if(game && game.targetM>0) a.innerHTML=game.meters+'<small>/'+game.targetM+'m</small>'; else a.innerHTML=(game?game.meters:0)+'<small>m</small>'; }
  /* ⛔ CLASS 9 (a stated promise that is not true). Zen is deathless practice and
     commitRun() deliberately banks NOTHING from it, but the HUD counted coins up all
     the same and the pause panel printed the same total, so the game told the player
     they had earned coins the wallet was never going to receive. The economy is
     correct (a deathless mode must not pay); the READOUT was the lie. Say practice.
     Fixed 2026-08-16 — do NOT "fix" this by banking Zen coins. */
  var c=$('coinrun'); if(c) c.textContent=(game&&game.zen)?'practice':(game?game.coinsRun:0);
  var mb=$('mutebtn'); if(mb) mb.textContent=SET.muted?'🔇':'🔊';
}

  newGame({mode:curMode, levelIdx:curLevelIdx});

/* ---------- daily / streak ---------- */
function dayStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterdayStr(){ var d=new Date(Date.now()-86400000); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
var ST=LS.getJSON(K.streak,{count:0,last:'',firstDaily:'',saveFreeDay:'',bonus:0});
function saveST(){ LS.setJSON(K.streak,ST); }
function updateStreak(){ var d=dayStr(); if(ST.last===d) return; if(ST.last===yesterdayStr()) ST.count=(ST.count||0)+1; else { ST.count=1; ST.bonus=0; } ST.last=d; saveST(); }
function firstDailyRun(m){ if(m<100) return false; var d=dayStr(); if(ST.firstDaily===d) return false; ST.firstDaily=d; saveST(); return true; }
function streakBonusOnce(){ var c=ST.count||0, tier=c>=14?14:(c>=7?7:(c>=3?3:0)); if(tier===0||ST.bonus>=tier) return 0; ST.bonus=tier; saveST(); return tier===14?5:(tier===7?3:2); }
function canFreeSave(){ return ST.saveFreeDay!==dayStr(); }
function useFreeSave(){ ST.saveFreeDay=dayStr(); saveST(); }

/* ---------- sunbeam earn (host-owns-rate; 30/day helper) ---------- */
function earnSunbeams(m){
  if(m<60) return 0;                      // anti-idle floor gate
  var base=clamp(Math.floor(m/250),1,12); // perf-scaled, run cap 12
  var prev=game?(game.sunBaseEmitted||0):0;
  var inc=Math.max(0, base-prev); if(game) game.sunBaseEmitted=Math.max(base, prev); // emit base ONCE per physical run (survives Dandelion Save)
  var extra=0; if(firstDailyRun(m)) extra+=3; extra+=streakBonusOnce(); // firstDaily/streak are already once-per-day/milestone
  var total=inc+extra; if(total<=0) return 0;
  var granted=0; try{ if(window._sbCapEarn) granted=window._sbCapEarn(total,'sproing:run_end')||0; }catch(e){}
  return granted;                          // post-cap actual (display honesty)
}

function starRow(n){ var s=''; for(var i=0;i<3;i++) s+='<span style="font-size:46px;line-height:1;color:'+(i<n?'#f2d24b':'#2a331f')+';text-shadow:'+(i<n?'0 0 10px #f2d24b66':'none')+'">★</span>'; return s; }
function onLevelClear(){
  if(!game) return; game.running=false; commitRun();
  var L=game.level, idx=L.idx;
  var flawless=!game.usedSave && !game.usedSturdy;
  var stars=1; if(game.coinsRun>=L.starCoins) stars=2; if(stars===2 && flawless) stars=3;
  var prev=levelStars(idx), best2=Math.max(prev,stars);
  levelProg.stars[idx]=best2;
  if(idx+1<LEVEL_COUNT && idx+1>(levelProg.unlocked||0)) levelProg.unlocked=idx+1;
  saveLevelProg();
  var reward=(prev===0 ? 40+L.world*8 : 5) + Math.max(0,best2-prev)*30;   // flat completion bonus only on FIRST clear (+5 token replay); star bonus only on improvement
  addCoins(reward);
  updateStreak();
  if(!game.runCounted){ stats.runs=(stats.runs||0)+1; game.runCounted=true; }
  if(game.meters>(stats.maxAlt||0)) stats.maxAlt=game.meters; saveStats();
  checkAch();
  var sunLc=earnSunbeams(Math.max(game.meters, L.targetM||0)); if(sunLc>0) toast('☀ +'+sunLc+' sunbeams');   // adventure clears earn too (was endless/daily-death only); once-per-run + 30/day capped
  $('le-title').textContent='World '+(L.world+1)+' · Level '+(L.lw+1);
