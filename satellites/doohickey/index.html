/* ========================= 17D. AUDIO ========================= */
/* Synthesised, no files, opened inside the first pointerdown because a context
   made before a gesture stays suspended on a real phone and every scheduled
   note lands in silence with no error. The clack ladder is the joke: each
   domino in a run is a step higher, and the ladder resets after a second of
   quiet, so a long cascade sounds like a run up the keys. */
var AUDIO = {
  ac: null, master: null, stream: null, on: true,
  step: 0, lastClack: 0,
  LADDER: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31],
  open: function () {
    if (this.ac || !this.on) return this.ac;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    this.ac = new C();
    this.master = this.ac.createGain();
    this.master.gain.value = 0.6;
    /* a limiter, so a twelve domino run does not clip */
    var comp = this.ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 12; comp.attack.value = 0.003;
    this.master.connect(comp);
    comp.connect(this.ac.destination);
    this.comp = comp;
    return this.ac;
  },
  resume: function () {
    var ac = this.open();
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  },
  env: function (node, t, a, d, peak) {
    var g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    node.connect(g); g.connect(this.master);
    return g;
  },
  tone: function (freq, t, a, d, peak, type) {
    var o = this.ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    this.env(o, t, a, d, peak);
    o.start(t); o.stop(t + a + d + 0.05);
    return o;
  },
  noise: function (t, dur, freq, q, peak) {
    var n = Math.max(1, Math.round(this.ac.sampleRate * dur));
    var buf = this.ac.createBuffer(1, n, this.ac.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    var src = this.ac.createBufferSource();
    src.buffer = buf;
    var bp = this.ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    src.connect(bp);
    this.env(bp, t, 0.004, dur, peak);
    src.start(t); src.stop(t + dur + 0.02);
  },
  play: function (what, arg) {
    var ac = this.on ? this.open() : null;
    if (!ac) return;
    if (ac.state === 'suspended') return;
    var t = ac.currentTime;
    if (what === 'clack') {
      /* the ladder */
      if (t - this.lastClack > 1) this.step = 0;
      this.lastClack = t;
      var semis = this.LADDER[Math.min(this.LADDER.length - 1, this.step)];
      this.step++;
      var f = 196 * Math.pow(2, semis / 12);
      this.tone(f, t, 0.004, 0.09, 0.14, 'triangle');
      this.noise(t, 0.05, f * 2.2, 6, 0.08);
    } else if (what === 'tick') {
      this.noise(t, 0.035, 900 + Math.min(2600, (arg || 100) * 4), 8, 0.05);
    } else if (what === 'ding') {
      this.tone(1318.5, t, 0.004, 1.1, 0.20, 'sine');
      this.tone(1975.5, t, 0.004, 0.8, 0.09, 'sine');
      this.tone(2637.0, t, 0.004, 0.5, 0.05, 'sine');
    } else if (what === 'thunk') {
      this.tone(90, t, 0.005, 0.16, 0.22, 'sine');
      this.noise(t, 0.09, 320, 3, 0.10);
    } else if (what === 'squeak') {
      var o = this.ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(1400, t + 0.16);
      this.env(o, t, 0.01, 0.16, 0.05);
      o.start(t); o.stop(t + 0.2);
    } else if (what === 'pop') {
      this.noise(t, 0.06, 1600, 2, 0.16);
      this.tone(220, t, 0.003, 0.07, 0.10, 'square');
    } else if (what === 'mrrp') {
    var mo = this.ac.createOscillator();
    mo.type = 'sawtooth';
    mo.frequency.setValueAtTime(360, t);
    mo.frequency.exponentialRampToValueAtTime(520, t + 0.12);
    mo.frequency.exponentialRampToValueAtTime(300, t + 0.34);
    var lp = this.ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1400;
    mo.connect(lp);
    this.env(lp, t, 0.03, 0.34, 0.09);
    mo.start(t); mo.stop(t + 0.4);
  } else if (what === 'boing') {
      var b = this.ac.createOscillator();
      b.type = 'sine';
      b.frequency.setValueAtTime(180, t);
      b.frequency.exponentialRampToValueAtTime(760, t + 0.12);
      b.frequency.exponentialRampToValueAtTime(240, t + 0.3);
      this.env(b, t, 0.006, 0.3, 0.14);
      b.start(t); b.stop(t + 0.36);
    } else if (what === 'click') {
      this.noise(t, 0.02, 2400, 10, 0.06);
    } else if (what === 'whirr') {
      this.noise(t, 0.5, 420, 1.2, 0.02);
    }
  },
  /* the film needs the same audio the player hears */
  tapStream: function () {
    var ac = this.open();
    if (!ac || this.stream) return this.stream;
    var dest = ac.createMediaStreamDestination();
    this.comp.connect(dest);
    this.stream = dest.stream;
    return this.stream;
  }
};
function soundFromContact(a, b, approach) {
  if (!AUDIO.on) return;
  var kinds = [a.kind, b.kind];
  if (kinds.indexOf('bell') >= 0 && approach > CONFIG.BELL_SPEED) { AUDIO.play('ding'); return; }
  if (kinds.indexOf('domino') >= 0 && approach > 60) { AUDIO.play('clack'); return; }
  if (kinds.indexOf('balloon') >= 0 && approach > 60) { AUDIO.play('squeak'); return; }
  if (kinds.indexOf('bucket') >= 0 && approach > 120) { AUDIO.play('thunk'); return; }
  if (kinds.indexOf('spring') >= 0 && approach > 60) { AUDIO.play('boing'); return; }
  if (kinds.indexOf('switchPlate') >= 0 && approach > 40) { AUDIO.play('click'); return; }
  if (kinds.indexOf('cat') >= 0 && approach > 60) { AUDIO.play('mrrp'); return; }
  if (kinds.indexOf('marble') >= 0 && approach > 80) AUDIO.play('tick', approach);
}

/* ========================= 17E. SHARE AND FILM ========================= */
/* A machine is a level id and seven bytes a part, base64url in the fragment.
   Opening one loads the level with the machine already on the board. */
function b64u(bytes) {
  var bin = '', i;
  for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(str) {
  try {
    var b = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
    var out = [], i;
    for (i = 0; i < b.length; i++) out.push(b.charCodeAt(i));
    return out;
  } catch (e) { return null; }
}
function shareLink() {
  var id = G.levelId >= 0 ? G.levelId : 99;
  return location.origin + location.pathname + '#m=' + b64u(packMachine(id, G.machine));
}
function copyLink() {
  var link = shareLink();
  if (navigator.share) {
    navigator.share({ title: 'DOOHICKEY', text: 'Here is a thing I built.', url: link })
      .catch(function () { fallbackCopy(link); });
    return;
  }
  fallbackCopy(link);
}
function fallbackCopy(link) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(function () { toast('The link is on the clipboard.'); },
      function () { toast(link); });
  } else toast(link);
}
function importFromHash() {
  var h = location.hash || '';
  if (h.indexOf('#m=') !== 0) return false;
  var bytes = unb64u(h.slice(3));
  if (!bytes) return false;
  var got = unpackMachine(bytes);
  if (!got) return false;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (got.levelId === 99) { openSandbox(0); G.machine = got.machine; }
  else if (got.levelId >= 0 && got.levelId < LEVELS.length) {
    startLevel(got.levelId);
    G.machine = got.machine;
  } else return false;
  machineChanged();
  toast('Somebody built this. Press GO.');
  return true;
}

var FILM = { rec: null, chunks: [], on: false };
var FILM_MIME = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
function startFilm() {
  if (FILM.on) return false;
  if (!V.cv.captureStream || typeof MediaRecorder === 'undefined') {
    toast('This browser will not film.');
    return false;
  }
  var stream = V.cv.captureStream(30), i, a = AUDIO.tapStream();
  if (a) { var tr = a.getAudioTracks(); for (i = 0; i < tr.length; i++) stream.addTrack(tr[i]); }
  var mime = '';
  for (i = 0; i < FILM_MIME.length; i++) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(FILM_MIME[i])) { mime = FILM_MIME[i]; break; }
  }
  try { FILM.rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (e) { toast('This browser will not film.'); return false; }
  FILM.chunks = [];
  FILM.rec.ondataavailable = function (e) { if (e.data && e.data.size) FILM.chunks.push(e.data); };
  /* ⛔ the blob arrives in onstop, never after stop() returns */
  FILM.rec.onstop = function () {
    FILM.on = false;
    var blob = new Blob(FILM.chunks, { type: FILM.rec.mimeType || 'video/webm' });
    FILM.blob = blob;
    offerFilm(blob);
  };
  FILM.rec.start();
  FILM.on = true;
  setTimeout(function () { stopFilm(); }, 30000);
  return true;
}
function stopFilm() {
  if (!FILM.on || !FILM.rec) return;
  try { FILM.rec.stop(); } catch (e) { FILM.on = false; }
}
function offerFilm(blob) {
  var name = 'doohickey.' + ((blob.type.indexOf('mp4') >= 0) ? 'mp4' : 'webm');
  var file = null;
  try { file = new File([blob], name, { type: blob.type }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], text: 'My doohickey.' }).catch(function () {});
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  toast('The film is in your downloads.');
}

/* ========================= 18. EDITOR ========================= */
/* The genre's scar is a touch editor that fails silently: you drop a part, it
   does not go where you meant, and the machine quietly does not work. So the
   ghost is red on a real overlap test, the snap is visible, and every handle is
   48 px ABOVE the finger rather than under it. */
var SEL = -1, GHOST = null, DRAG = null, LP = 0, PRESS = null;
var POINTERS = {}, PINCH = null;
var UNDO = [], REDO = [];

function snapshot() { return JSON.stringify(G.machine.parts); }
function pushUndo() {
  UNDO.push(snapshot());
  if (UNDO.length > CONFIG.UNDO_MAX) UNDO.shift();
  REDO.length = 0;
  refreshEditChrome();
}
function applyParts(json) {
  G.machine.parts = JSON.parse(json);
  machineChanged(); refreshEditChrome();
}
function undo() {
  if (!UNDO.length) return false;
  REDO.push(snapshot());
  applyParts(UNDO.pop());
  SEL = -1; hideHandles();
  return true;
}
function redo() {
  if (!REDO.length) return false;
  UNDO.push(snapshot());
  applyParts(REDO.pop());
  SEL = -1; hideHandles();
  return true;
}
function refreshEditChrome() {
  el('btnUndo').disabled = !UNDO.length;
  el('btnRedo').disabled = !REDO.length;
}

function snapPos(x, y) {
  if (SAVE.settings.freePlace) return { x: Math.round(x), y: Math.round(y) };
  var c = CONFIG.CELL;
  return { x: Math.round(x / c) * c, y: Math.round(y / c) * c };
}
function snapRot(rot) {
  /* free placement means free POSITION and the fine rotation grid; it never
     means an angle a share link cannot carry */
  if (SAVE.settings.freePlace) return onRotGrid(rot);
  var d = CONFIG.ROT_DETENT_DEG * DEG;
  return onRotGrid(Math.round(rot / d) * d);
}
/* ⛔ a real separating axis test through the ENGINE'S OWN collide, not a
   bounding box. A box test says a tilted plank overlaps things it does not
   touch, and the player learns to distrust the red. */
function ghostOverlaps(part, ignoreIndex) {
  var m = newMachine(), i, k;
  for (i = 0; i < G.machine.parts.length; i++) {
    if (i === ignoreIndex) continue;
    m.parts.push(G.machine.parts[i]);
  }
  var w = buildWorld(G.level, m);
  var before = w.bodies.length;
  PARTS[part.type].make(w, part.x, part.y, part.rot || 0);
  for (i = 0; i < w.bodies.length; i++) w.bodies[i].updateAABB();
  for (i = before; i < w.bodies.length; i++) {
    for (k = 0; k < before; k++) {
      var man = PHYS.collide(w.bodies[i], w.bodies[k]);
      /* touching is not overlapping: a domino STANDS on the floor */
      if (man && man.penetration > 1.5) return true;
    }
  }
  return false;
}
function inBounds(part) {
  var p = PARTS[part.type], half = Math.max(p.w || 20, p.h || 20) / 2;
  return part.x > half * 0.4 && part.x < CONFIG.SCENE_W - half * 0.4
    && part.y > half * 0.4 && part.y < CONFIG.SCENE_H - half * 0.4;
}
function partAt(wx2, wy2) {
  var i, best = -1, bd = 1e9;
  for (i = G.machine.parts.length - 1; i >= 0; i--) {
    var p = G.machine.parts[i], def = PARTS[p.type];
    var reach = Math.max(def.w || 24, def.h || 24) / 2 + 8;
    var d = len2(p.x - wx2, p.y - wy2);
    if (d < reach && d < bd) { bd = d; best = i; }
  }
  return best;
}
function hideHandles() { el('handles').classList.remove('on'); }
function showHandles() {
  if (SEL < 0 || G.running) { hideHandles(); return; }
  var p = G.machine.parts[SEL];
  var h = el('handles');
  h.classList.add('on');
  /* ⛔ 72 px ABOVE the part, clamped inside the viewport. Under the finger is
     under the thumb, and a thumb hides what it is pressing. */
  var px = sx(p.x), py = sy(p.y) - 72;
  var w = h.offsetWidth || 216, hh = h.offsetHeight || 48;
  h.style.left = Math.round(clamp(px - w / 2, 8, V.W - w - 8)) + 'px';
  h.style.top = Math.round(clamp(py - hh / 2, 8, V.H - hh - 90)) + 'px';
}
function buildHandles() {
  el('handles').innerHTML =
    '<button class="btn icon" id="hRot" aria-label="Turn it">&#8635;</button>'
    + '<button class="btn icon" id="hFlip" aria-label="Flip it">&#8646;</button>'
    + '<button class="btn icon" id="hDup" aria-label="One more">&#43;</button>'
    + '<button class="btn icon" id="hDel" aria-label="Take it away">&#215;</button>';
  el('hRot').addEventListener('click', function () {
    if (SEL < 0) return;
    pushUndo();
    var p = G.machine.parts[SEL];
    p.rot = snapRot(p.rot + CONFIG.ROT_DETENT_DEG * DEG);
    rebuildPreview(); showHandles(); haptic(8);
  });
  el('hFlip').addEventListener('click', function () {
    if (SEL < 0) return;
    pushUndo();
    var p = G.machine.parts[SEL];
    p.flip = p.flip ? 0 : 1;
    p.rot = snapRot(-p.rot);
    rebuildPreview(); showHandles(); haptic(8);
  });
  el('hDup').addEventListener('click', function () {
    if (SEL < 0) return;
    var p = G.machine.parts[SEL];
    if (trayLeft(p.type) <= 0) { toast('There are no more of those in the tray.'); return; }
    var copy = { type: p.type, x: p.x + CONFIG.CELL, y: p.y, rot: p.rot, flip: p.flip };
    if (!inBounds(copy) || ghostOverlaps(copy, -1)) { toast('There is no room beside it.'); return; }
    pushUndo();
    G.machine.parts.push(copy);
    SEL = G.machine.parts.length - 1;
    machineChanged(); showHandles(); haptic(8);
  });
  el('hDel').addEventListener('click', function () {
    if (SEL < 0) return;
    pushUndo();
    G.machine.parts.splice(SEL, 1);
    SEL = -1;
    machineChanged(); hideHandles(); haptic(10);
  });
}

/* ---- the tray, dragged out ---- */
function trayPointerDown(e, type) {
  if (G.running) return;
  if (trayLeft(type) <= 0) { toast('The tray is out of those.'); return; }
  var w = { x: unsx(e.clientX), y: unsy(e.clientY) };
  GHOST = { type: type, x: w.x, y: w.y, rot: 0, flip: 0, from: -1, ok: false, id: e.pointerId };
  updateGhost(e.clientX, e.clientY);
}
function updateGhost(px, py) {
  if (!GHOST) return;
  var w = { x: unsx(px), y: unsy(py) };
  var snapped = snapPos(w.x, w.y);
  GHOST.x = snapped.x; GHOST.y = snapped.y;
  GHOST.ok = inBounds(GHOST) && !ghostOverlaps(GHOST, GHOST.from);
}
function dropGhost() {
  if (!GHOST) return;
  var g = GHOST;
  GHOST = null;
  if (!g.ok) {
    if (g.from >= 0) { toast('It does not fit there.'); }
    else toast('It does not fit there.');
    return;
  }
  pushUndo();
  if (g.from >= 0) {
    var p = G.machine.parts[g.from];
    p.x = g.x; p.y = g.y;
    SEL = g.from;
  } else {
    G.machine.parts.push({ type: g.type, x: g.x, y: g.y, rot: g.rot, flip: g.flip });
    SEL = G.machine.parts.length - 1;
  }
  machineChanged(); showHandles();
  haptic(8);
}
function returnToTray(index) {
  pushUndo();
  G.machine.parts.splice(index, 1);
  SEL = -1;
  machineChanged(); hideHandles();
  toast('Back in the tray.');
}

/* ---- the board's own pointers ---- */
function bindEditor() {
  var cv = V.cv;
  buildHandles();
  cv.addEventListener('pointerdown', function (e) {
    /* ⛔ the context is opened HERE, inside a gesture. Made any earlier it
       stays suspended on a phone and every note lands in silence. */
    AUDIO.resume();
    POINTERS[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(POINTERS).length === 2 && !GHOST) { startPinch(); return; }
    if (G.running) { stopRun(); return; }
    if (el('winCard').classList.contains('on')) return;
    PRESS = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, id: e.pointerId };
    var w = { x: unsx(e.clientX), y: unsy(e.clientY) };
    var hit = partAt(w.x, w.y);
    if (hit >= 0) {
      SEL = hit;
      showHandles();
      DRAG = { index: hit, ox: G.machine.parts[hit].x - w.x, oy: G.machine.parts[hit].y - w.y };
    } else {
      SEL = -1; hideHandles();
    }
  });
  cv.addEventListener('pointermove', function (e) {
    if (POINTERS[e.pointerId]) { POINTERS[e.pointerId].x = e.clientX; POINTERS[e.pointerId].y = e.clientY; }
    if (PINCH) { movePinch(); return; }
    if (GHOST) { updateGhost(e.clientX, e.clientY); return; }
    if (!PRESS) return;
    PRESS.moved = Math.max(PRESS.moved, len2(e.clientX - PRESS.x, e.clientY - PRESS.y));
    if (DRAG && PRESS.moved > CONFIG.TAP_SLOP) {
      var p = G.machine.parts[DRAG.index];
      GHOST = { type: p.type, x: p.x, y: p.y, rot: p.rot, flip: p.flip, from: DRAG.index, ok: true, id: e.pointerId };
      DRAG = null;
      hideHandles();
      updateGhost(e.clientX, e.clientY);
    }
  });
  function up(e) {
    delete POINTERS[e.pointerId];
    if (PINCH && Object.keys(POINTERS).length < 2) PINCH = null;
    if (GHOST && GHOST.id === e.pointerId) {
      /* dragged off the sheet: it goes back in the tray */
      var w = { x: unsx(e.clientX), y: unsy(e.clientY) };
      var off = w.x < 0 || w.x > CONFIG.SCENE_W || w.y < 0 || w.y > CONFIG.SCENE_H;
      var from = GHOST.from;
      if (off && from >= 0) { GHOST = null; returnToTray(from); }
      else if (off) { GHOST = null; }
      else dropGhost();
    }
    DRAG = null; PRESS = null;
    clearTimeout(LP);
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function (e) {
    delete POINTERS[e.pointerId];
    GHOST = null; DRAG = null; PRESS = null; PINCH = null;
  });
  el('btnUndo').addEventListener('click', function () { if (!undo()) toast('Nothing to undo.'); });
  el('btnRedo').addEventListener('click', function () { if (!redo()) toast('Nothing to redo.'); });
}
/* two fingers: a pinch is a zoom and a pan at once */
function pointerPair() {
  var ks = Object.keys(POINTERS);
  if (ks.length < 2) return null;
  return [POINTERS[ks[0]], POINTERS[ks[1]]];
}
function startPinch() {
  var pr = pointerPair();
  if (!pr) return;
  var d = len2(pr[0].x - pr[1].x, pr[0].y - pr[1].y);
  if (d < CONFIG.PINCH_MIN_D) return;
  PINCH = { d0: d, zoom0: V.zoom, cx0: (pr[0].x + pr[1].x) / 2, cy0: (pr[0].y + pr[1].y) / 2,
    camX0: V.camX, camY0: V.camY };
  GHOST = null; DRAG = null; PRESS = null;
  hideHandles();
}
function movePinch() {
  var pr = pointerPair();
  if (!pr || !PINCH) return;
  var d = len2(pr[0].x - pr[1].x, pr[0].y - pr[1].y);
  if (d < 1) return;
  V.zoom = clamp(PINCH.zoom0 * (d / PINCH.d0), CONFIG.ZOOM_MIN, CONFIG.ZOOM_MAX);
  var cx = (pr[0].x + pr[1].x) / 2, cy = (pr[0].y + pr[1].y) / 2;
  V.camX = PINCH.camX0 - (cx - PINCH.cx0) / (V.k * V.zoom);
  V.camY = PINCH.camY0 - (cy - PINCH.cy0) / (V.k * V.zoom);
}

/* the ghost, and the selection ring, drawn over the board */
function drawGhost(ctx) {
  if (!GHOST) return;
  var w = buildWorld({ scene: [], fixed: [], bonus: [] },
    withParts([{ type: GHOST.type, x: GHOST.x, y: GHOST.y, rot: GHOST.rot }]));
  var i;
  ctx.save();
  ctx.globalAlpha = 0.72;
  for (i = 0; i < w.bodies.length; i++) {
    var b = w.bodies[i];
    bodyOutline(ctx, b, 1);
    ctx.fillStyle = GHOST.ok ? 'rgba(78,154,82,.42)' : 'rgba(216,80,60,.42)';
    ctx.fill();
    ctx.strokeStyle = GHOST.ok ? '#4E9A52' : '#D8503C';
    ctx.lineWidth = Math.max(2, ss(3));
    ctx.stroke();
  }
  ctx.restore();
  /* the cell it will land in, so the snap is visible rather than a surprise */
  if (!SAVE.settings.freePlace) {
    ctx.strokeStyle = GHOST.ok ? 'rgba(78,154,82,.7)' : 'rgba(216,80,60,.7)';
    ctx.lineWidth = Math.max(1, ss(1.5));
    ctx.strokeRect(sx(GHOST.x - CONFIG.CELL / 2), sy(GHOST.y - CONFIG.CELL / 2), ss(CONFIG.CELL), ss(CONFIG.CELL));
  }
}
function drawSelection(ctx) {
  if (SEL < 0 || G.running || SEL >= G.machine.parts.length) return;
  var p = G.machine.parts[SEL], def = PARTS[p.type];
  var r = Math.max(def.w || 24, def.h || 24) / 2 + 8;
  ctx.strokeStyle = '#E8B33C';
  ctx.lineWidth = Math.max(2, ss(3));
  ctx.setLineDash([ss(6), ss(5)]);
  ctx.beginPath();
  ctx.arc(sx(p.x), sy(p.y), ss(r), 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]);
}

window.DOOHICKEY_TEST = {
  state: function () { return G; },
  view: function () { return V; },
  frames: function () { return FRAMES; },
  start: function (id) { startLevel(id); },
  place: function (parts) {
    var i;
    for (i = 0; i < parts.length; i++) {
      G.machine.parts.push({ type: parts[i].type, x: parts[i].x, y: parts[i].y, rot: parts[i].rot || 0, flip: 0 });
    }
    machineChanged();
    return G.machine.parts.length;
  },
  solution: function () {
    G.machine = machineFromSolution(G.level);
    machineChanged();
    return G.machine.parts.length;
  },
  go: function () { goRun(); },
  stop: function () { stopRun(); },
  advance: function (secs) {
    var i, n = Math.round(secs * CONFIG.PHYS_HZ);
    for (i = 0; i < n; i++) {
      G.world.step(1 / CONFIG.PHYS_HZ);
      G.runT += 1 / CONFIG.PHYS_HZ;
      touchedBonus(G.world, G.level, G.touched);
      if (!G.result && bellRung(G.world)) {
        var res = { goal: true, goalAt: G.runT, bonus: G.touched, allBonus: true }, k;
        for (k = 0; k < G.touched.length; k++) if (!G.touched[k]) res.allBonus = false;
        G.result = { stars: starsFor(G.level, G.machine, res), at: G.runT, parts: G.machine.parts.length };
        onWin();
      }
    }
    return G.runT;
  },
  toScreen: function (x, y) { return { x: sx(x), y: sy(y) }; },
  toWorld: function (px, py) { return { x: unsx(px), y: unsy(py) }; },
  screen: function () { return G.screen; },
  showScreen: function (n) { showScreen(n); },
  select: function () { return SEL; },
  ghost: function () { return GHOST; },
  undoDepth: function () { return UNDO.length; },
  redoDepth: function () { return REDO.length; },
  trayLeft: function (t) { return trayLeft(t); },
  parts: function () { return G.machine.parts; },
  overlaps: function (p) { return ghostOverlaps(p, -1); },
  result: function () { return G.result; },
  replaying: function () { return !!REPLAY; },
  confetti: function () { return CONFETTI.length; },
  tape: function () { return TAPE.length; },
  sandbox: function (slot) { openSandbox(slot); },
  slots: function () { return SAVE.sandbox || [null, null, null]; },
  link: function () { return shareLink(); },
  importHash: function (h) {
    try { history.replaceState(null, '', location.pathname + h); } catch (e) {}
    return importFromHash();
  },
  audio: function () { return AUDIO; },
  film: function () { return FILM; },
  startFilm: function () { return startFilm(); },
  stopFilm: function () { stopFilm(); },
  save: function () { return SAVE; }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
