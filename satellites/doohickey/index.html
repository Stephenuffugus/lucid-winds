<style>
/*  DOOHICKEY
    game id: doohickey   cream paper, saturated primaries, fat outlines
    ⛔ DETERMINISM IS LAW. Nothing in the SIM export may call Math.random or a
    transcendental: a shared machine has to run the same on the other phone or
    the link is a lie. tools/lint.mjs greps for it.
    The BOTTOM LEFT 120x120 belongs to the fleet's music chip. */
:root{
  --paper:#F4EBD3; --paper2:#EADFC0; --ink:#2C2418; --line:#C9B98E;
  --red:#D8503C; --blue:#3D6FB4; --yellow:#E8B33C; --green:#4E9A52; --plum:#8A5A9B;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --safeL:env(safe-area-inset-left,0px);
  --safeR:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:ui-rounded,"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#chrome{position:absolute;inset:0;pointer-events:none;z-index:5}
.btn{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);color:var(--ink);
  border-radius:14px;min-height:48px;padding:10px 16px;font-family:inherit;font-size:.92rem;
  font-weight:700;letter-spacing:.06em;box-shadow:0 3px 0 var(--ink);text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.big{min-height:56px;font-size:1rem;padding:12px 22px}
.btn.icon{min-width:48px;min-height:48px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.btn.go{background:var(--green);color:#FFF7E4;border-color:var(--ink)}
.btn.stop{background:var(--red);color:#FFF7E4}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);color:#6B5C42}
.btn[disabled]{opacity:.42}
/* ⛔ NOT the bottom right corner, and NOT the bottom centre either. In
   landscape the scene is 16:9 and so is the screen, so every button sits ON the
   board and the only question is what it covers. The bottom right holds the
   bell in four levels out of six; the bottom centre holds the floor, which is
   where dominoes and bells live. The top centre is sky in every level, so both
   GO and STOP live there. */
#btnGo{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(10px + var(--safeT));min-width:120px}
#btnGo:active{transform:translateX(-50%) translateY(2px)}
/* ⛔ NOT the bottom right corner. That is where a level's bell tends to sit,
   and a button over the goal hides the one thing the player is watching. A run
   stops on a tap anywhere, so this only has to be findable, not enormous. */
#btnStop{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + var(--safeT));min-width:104px}
#btnStop:active{transform:translateX(-50%) translateY(2px)}
#btnUndo{position:absolute;left:calc(14px + var(--safeL));top:calc(12px + var(--safeT))}
#btnRedo{position:absolute;left:calc(70px + var(--safeL));top:calc(12px + var(--safeT))}
#btnMenu{position:absolute;right:calc(14px + var(--safeR));top:calc(12px + var(--safeT))}
#partCount{position:absolute;left:calc(14px + var(--safeL));top:calc(70px + var(--safeT));
  pointer-events:none;font-size:.82rem;font-weight:700;letter-spacing:.08em;color:#6B5C42}
#tray{position:absolute;left:0;right:0;bottom:0;height:76px;pointer-events:auto;
  background:var(--paper2);border-top:3px solid var(--ink);
  display:flex;gap:8px;align-items:center;overflow-x:auto;overflow-y:hidden;
  padding:6px calc(120px + var(--safeR)) calc(6px + var(--safeB)) calc(126px + var(--safeL))}
#tray[hidden]{display:none}
/* ⛔ in portrait the tray CANNOT be a scrolling row along the bottom: with five
   part types it scrolls straight into the bottom left 120 by 120, which belongs
   to the fleet's music chip. Below the letterboxed scene, wrapped into rows,
   clear of that corner. */
@media (orientation:portrait){
  #tray{top:auto;bottom:calc(136px + var(--safeB));height:auto;max-height:150px;
    flex-wrap:wrap;justify-content:flex-start;overflow-x:hidden;overflow-y:auto;
    border-bottom:3px solid var(--ink);
    padding:8px calc(12px + var(--safeR)) 8px calc(12px + var(--safeL))}
}
.tile{flex:0 0 auto;width:56px;height:56px;border:3px solid var(--ink);border-radius:12px;
  background:var(--paper);position:relative;padding:0;font-family:inherit}
.tile canvas{width:100%;height:100%;display:block;border-radius:9px}
.tile .n{position:absolute;right:-4px;top:-6px;min-width:22px;height:22px;border-radius:11px;
  background:var(--ink);color:var(--paper);font-size:.7rem;font-weight:700;line-height:22px;text-align:center}
.tile.out{opacity:.35}
.tile.on{background:var(--yellow)}
#handles{position:absolute;pointer-events:auto;display:none;gap:6px;z-index:8}
#handles.on{display:flex}
#handles .btn{min-width:48px;min-height:48px;padding:0;font-size:1rem}

.screen{position:absolute;inset:0;z-index:10;background:var(--paper);display:none;
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(18px + var(--safeT)) 18px calc(18px + var(--safeB));
  overflow-y:auto;overscroll-behavior:contain}
.screen.on{display:flex}
/* a column that centres with justify-content clips its top when it is taller than the
   phone and no scroll can reach it (the level list at 667x375 began 16 px above the edge).
   Two empty flex items with auto margins centre what fits and give way when it does not. */
.screen::before,.screen::after{content:'';flex:0 0 0;min-height:0;margin:auto 0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--paper);
  border-top:3px solid var(--ink);border-radius:18px 18px 0 0;max-height:88%;
  display:none;flex-direction:column;align-items:center;
  padding:18px 18px calc(20px + var(--safeB));overflow-y:auto;overscroll-behavior:contain}
.sheet.on{display:flex}
.col{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.row{display:flex;gap:10px;width:100%;max-width:360px}
.row > *{flex:1 1 0;min-width:0;width:auto;max-width:none}
.title{font-size:2rem;font-weight:800;letter-spacing:.10em;text-align:center;margin:0 0 2px}
.tag{font-size:.92rem;text-align:center;color:#6B5C42;margin:0 0 18px;line-height:1.6}
.cap{font-size:.74rem;letter-spacing:.18em;color:#6B5C42;text-transform:uppercase;margin:10px 0 2px}
.lede{font-size:.94rem;line-height:1.7;margin:6px 0}
.tiny{font-size:.78rem;line-height:1.6;color:#6B5C42;margin:4px 0}
.card{width:100%;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);
  box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:12px;padding:10px 14px;
  font-family:inherit;text-align:left;color:var(--ink)}
.card .nm{font-size:.98rem;font-weight:700;display:block}
.card .sub{font-size:.76rem;color:#6B5C42;display:block;margin-top:2px}
.card .stars{margin-left:auto;font-size:1rem;letter-spacing:.1em;color:var(--yellow)}
.card.locked{opacity:.45;box-shadow:none}
/* the replay is the point of the win screen, so in landscape the card takes one
   side and leaves the board visible beside it rather than sitting on top of it */
#winCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:14;
  width:86%;max-width:340px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 5px 0 var(--ink);padding:18px;display:none;flex-direction:column;gap:10px;align-items:stretch}
@media (orientation:landscape){
  #winCard{left:calc(16px + var(--safeL));transform:translateY(-50%);width:44%;max-width:320px}
}
#winCard.on{display:flex}
#winStars{font-size:2rem;text-align:center;letter-spacing:.14em;color:var(--yellow)}
#winLine{text-align:center;font-size:.9rem;color:#6B5C42}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.84rem;
  z-index:40;opacity:0;pointer-events:none;transition:opacity 170ms ease-out;max-width:84%;text-align:center}
#toast.on{opacity:1}
#testPanel{position:absolute;inset:0;z-index:60;background:#161208;color:#dfe;overflow:auto;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px;display:none;white-space:pre-wrap}
#testPanel.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>

<script>
/* ============================================================================
   DOOHICKEY
   One file, no framework, no build step. The rules live between the
   SIM_EXPORT markers and sim.js reads them through those markers, so the
   headless runner and the thumb play the same game.

   ⛔ DETERMINISM IS LAW (the design's words). Inside the SIM export there is
   no Math.random, no Date, no document, and no transcendental Math call:
   sin, cos and atan2 come from DMATH, which is built from + - * / and
   Math.sqrt only. A machine shared by link has to run the same on the other
   person's phone, and a domino run is chaotic enough that one bit of drift in
   the last place becomes a different fall.
   ========================================================================== */
'use strict';

// ---- SIM_EXPORT_START ----
/* ========================= 1. CONFIG ========================= */
var CONFIG = Object.freeze({
  GAME_ID: 'doohickey', SAVE_KEY: 'lw_doohickey_v1', SAVE_V: 1,

  SCENE_W: 768, SCENE_H: 432, CELL: 24, ROT_DETENT_DEG: 15,
  PHYS_HZ: 120, ITERATIONS: 10, GRAVITY: 900, SLEEP_V: 2, SLEEP_S: 0.5,
  BODY_MAX: 120, CONSTRAINT_MAX: 40, UNDO_MAX: 20, RUN_MAX_S: 45,

  MARBLE_R: 9, MARBLE_MASS: 1, MARBLE_REST: 0.35, MARBLE_FRICTION: 0.25,
  /* the plan's 10 wide jammed at the 0.55 spacing (67 of 100 trials): the gap
     is only 7.6 units and a leaning domino could not reach the next. 8 is
     100 of 100 at all three spacings with the plan's friction untouched, and
     it is what a domino looks like. */
  DOMINO_W: 8, DOMINO_H: 32, DOMINO_MASS: 0.6, DOMINO_REST: 0.05, DOMINO_FRICTION: 0.45,
  PLANK_L: 96, PLANK_T: 8, SEESAW_L: 144,
  FAN_RANGE: 220, FAN_HALF_ANGLE_DEG: 18, FAN_FORCE: 2600, FAN_MIN_DIST: 20,
  BALLOON_R: 14, BALLOON_LIFT: 1.6, STRING_L: 60,
  BUCKET_W: 44, BUCKET_H: 36, BELL_R: 16, BELL_SPEED: 40, SPRING_REST: 1.4,

  TAP_SLOP: 10, PINCH_MIN_D: 30, ZOOM_MIN: 0.6, ZOOM_MAX: 2.2,
  BAUMGARTE: 0.2, ALLOWED_PEN: 0.5
});

/* ========================= 2. RNG ========================= */
/* Seeded, in the sim, for jitter in the domino trials and nothing else. */
function makeRNG(seed) {
  var a = (seed >>> 0) || 1;
  function r() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  r.state = function () { return a >>> 0; };
  return r;
}
function seedFromString(str) {
  var h = 2166136261, i;
  for (i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mixSeed(seed, salt) { return (Math.imul(seed ^ salt, 2654435761) >>> 0); }

/* ========================= 3. DMATH ========================= */
/* Copied from satellites/keepsies/src/core/dmath.js, whose header explains
   why it exists: ECMAScript does not specify the last bit of Math.sin, and a
   domino run turns one bit into a different fall. Built from + - * / and
   Math.sqrt only. */
var DPI = 3.141592653589793, DHALF_PI = 1.5707963267948966;
var TWO_PI_HI = 6.28125, TWO_PI_MID = 0.001935307179586477,
  TWO_PI_LO = -7.471323344099423e-20, INV_TWO_PI = 0.15915494309189535;
var SIXTH_PI = 0.5235987755982989, SQRT3 = 1.7320508075688772,
  TAN_TWELFTH_PI = 0.26794919243112270;
var S1 = -0.16666666666666666, S2 = 0.008333333333333333, S3 = -0.0001984126984126984,
  S4 = 2.7557319223985893e-06, S5 = -2.505210838544172e-08, S6 = 1.6059043836821613e-10,
  S7 = -7.647163731819816e-13, S8 = 2.8114572543455206e-15, S9 = -8.22063524662433e-18;
var C1 = -0.5, C2 = 0.041666666666666664, C3 = -0.001388888888888889,
  C4 = 2.48015873015873e-05, C5 = -2.755731922398589e-07, C6 = 2.08767569878681e-09,
  C7 = -1.1470745597729725e-11, C8 = 4.779477332387385e-14, C9 = -1.5619206968586225e-16;
function dreduce(x) {
  var k = Math.floor(x * INV_TWO_PI + 0.5);
  return ((x - k * TWO_PI_HI) - k * TWO_PI_MID) - k * TWO_PI_LO;
}
function sinCore(r) {
  var z = r * r;
  return r * (1 + z * (S1 + z * (S2 + z * (S3 + z * (S4 + z * (S5 + z * (S6 + z * (S7 + z * (S8 + z * S9)))))))));
}
function cosCore(r) {
  var z = r * r;
  return 1 + z * (C1 + z * (C2 + z * (C3 + z * (C4 + z * (C5 + z * (C6 + z * (C7 + z * (C8 + z * C9))))))));
}
function dsin(x) {
  var r = dreduce(x);
  if (r > DHALF_PI) r = DPI - r;
  else if (r < -DHALF_PI) r = -DPI - r;
  return sinCore(r);
}
function dcos(x) {
  var r = dreduce(x), flip = 1;
  if (r > DHALF_PI) { r = DPI - r; flip = -1; }
  else if (r < -DHALF_PI) { r = -DPI - r; flip = -1; }
  return flip * cosCore(r);
}
function atanSmall(t) {
  var z = t * t;
  return t * (1 + z * (-0.3333333333333333 + z * (0.2 + z * (-0.14285714285714285 + z * (0.1111111111111111
    + z * (-0.09090909090909091 + z * (0.07692307692307693 + z * (-0.06666666666666667
      + z * (0.058823529411764705 + z * -0.05263157894736842)))))))));
}
function datan(x) {
  var neg = x < 0, a = neg ? -x : x, big = false, r;
  if (a > 1) { a = 1 / a; big = true; }
  if (a > TAN_TWELFTH_PI) r = SIXTH_PI + atanSmall((a * SQRT3 - 1) / (SQRT3 + a));
  else r = atanSmall(a);
  if (big) r = DHALF_PI - r;
  return neg ? -r : r;
}
function datan2(y, x) {
  if (x === 0) { if (y > 0) return DHALF_PI; if (y < 0) return -DHALF_PI; return 0; }
  var a = datan(y / x);
  if (x > 0) return a;
  return y >= 0 ? a + DPI : a - DPI;
}
function len2(x, y) { return Math.sqrt(x * x + y * y); }
var DEG = 0.017453292519943295;

/* ========================= 4. VECTORS ========================= */
/* Copied with the engine from satellites/burr-blast/index.html. */
function v(x,y){ return {x:x,y:y}; }
function vadd(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
function vsub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
function vmul(a,s){ return {x:a.x*s, y:a.y*s}; }
function vdot(a,b){ return a.x*b.x + a.y*b.y; }
function vcross(a,b){ return a.x*b.y - a.y*b.x; }          /* scalar z of 2D cross */
function vcrossSV(s,a){ return {x:-s*a.y, y:s*a.x}; }       /* scalar x vector */
function vlen(a){ return Math.sqrt(a.x*a.x + a.y*a.y); }
function vlen2(a){ return a.x*a.x + a.y*a.y; }
function vnorm(a){ var l=vlen(a); return l>1e-9 ? {x:a.x/l, y:a.y/l} : {x:0,y:0}; }
function vperp(a){ return {x:-a.y, y:a.x}; }
/* ⛔ the DMATH pair here, not the built in one. This is the single place the
   engine reached for a transcendental and it is the one that matters: every
   polygon vertex in the world goes through this function every step, and the
   built in version is allowed to differ in its last bit between engines. */
function vrot(a,ang){ var c=dcos(ang), s=dsin(ang); return {x:a.x*c - a.y*s, y:a.x*s + a.y*c}; }
function clamp(x,lo,hi){ return x<lo?lo:(x>hi?hi:x); }
/* ========================= 5. PHYS ========================= */
/* The sequential impulse engine from satellites/burr-blast/index.html, copied
   whole, with section 3.4 of the plan applied: vrot goes through DMATH. What
   is added below it, and is NOT in Burr Blast: PinJoint, Rope, the fan cone,
   the balloon's buoyancy, a fixed iteration order, and stateHash. */
var PHYS = (function(){

  var _idc = 1;

  /* ---- Body factory ---- */
  function Body(opts){
    this.id = _idc++;
    this.shape = opts.shape;                 // 'circle' | 'poly'
    this.pos = v(opts.x||0, opts.y||0);
    this.vel = v(0,0);
    this.angle = opts.angle||0;
    this.angVel = 0;
    this.force = v(0,0);
    this.torque = 0;
    this.isStatic = !!opts.isStatic;
    this.restitution = (opts.restitution!=null)?opts.restitution:0.1;
    this.friction = (opts.friction!=null)?opts.friction:0.5;
    this.radius = Math.max(0.5, opts.radius||0);   // circle (floor avoids degenerate 0-mass anchors)
    this.verts = opts.verts||null;           // poly local verts (CCW)
    this.normals = null;                     // poly face normals (local)
    this.w = opts.w||0; this.h = opts.h||0;  // render helpers for boxes
    // mass / inertia
    var density = (opts.density!=null)?opts.density:1;
    this.mat = opts.mat||'wood';
    this._computeMass(density);
    if(this.isStatic){ this.invMass=0; this.invInertia=0; this.mass=Infinity; this.inertia=Infinity; }
    // sleeping
    this.awake = true; this.sleepTime = 0; this.canSleep = (opts.canSleep!=null)?opts.canSleep:true;
    if(this.isStatic){ this.awake=false; }
    // game-layer fields (physics ignores these except reporting)
    this.dead = false;
    this.game = opts.game || {};             // { hp, kind, isPest, ... }
    if(this.verts) this._buildNormals();
    this._aabb = {minx:0,miny:0,maxx:0,maxy:0};
    this.updateAABB();
  }

  Body.prototype._computeMass = function(density){
    if(this.shape==='circle'){
      var r=this.radius; var m=Math.PI*r*r*density;
      this.mass=m; this.invMass=m>0?1/m:0;
      var I=m*r*r*0.5; this.inertia=I; this.invInertia=I>0?1/I:0;
    } else {
      // polygon mass + inertia about centroid (verts assumed centered near origin)
      var area=0, I=0, vs=this.verts, n=vs.length;
      var cx=0, cy=0;
      for(var i=0;i<n;i++){
        var p1=vs[i], p2=vs[(i+1)%n];
        var cr=vcross(p1,p2);
        area += cr*0.5;
        cx += (p1.x+p2.x)*cr; cy += (p1.y+p2.y)*cr;
        var intx2 = p1.x*p1.x + p1.x*p2.x + p2.x*p2.x;
        var inty2 = p1.y*p1.y + p1.y*p2.y + p2.y*p2.y;
        I += (0.25/3.0)*cr*(intx2+inty2);
      }
      area=Math.abs(area);
      var m=area*density;
      this.mass=m; this.invMass=m>0?1/m:0;
      I=Math.abs(I)*density;
      this.inertia=I; this.invInertia=I>0?1/I:0;
    }
    // guard degenerate (near-zero-area) dynamic bodies from becoming immovable anchors
    if(this.mass>0 && this.mass<0.02){ this.mass=0.02; this.invMass=50; }
    if(this.inertia>0 && this.inertia<0.02){ this.inertia=0.02; this.invInertia=50; }
  };

  Body.prototype._buildNormals = function(){
    var vs=this.verts, n=vs.length, ns=[];
    for(var i=0;i<n;i++){
      var e=vsub(vs[(i+1)%n], vs[i]);
      ns.push(vnorm(v(e.y, -e.x)));   // outward normal for CCW winding
    }
    this.normals=ns;
  };

  /* world-space vertex i */
  Body.prototype.wvert = function(i){ return vadd(this.pos, vrot(this.verts[i], this.angle)); };
  Body.prototype.wnorm = function(i){ return vrot(this.normals[i], this.angle); };

  Body.prototype.updateAABB = function(){
    var a=this._aabb;
    if(this.shape==='circle'){
      a.minx=this.pos.x-this.radius; a.maxx=this.pos.x+this.radius;
      a.miny=this.pos.y-this.radius; a.maxy=this.pos.y+this.radius;
    } else {
      var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      for(var i=0;i<this.verts.length;i++){
        var p=this.wvert(i);
        if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x;
        if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y;
      }
      a.minx=minx;a.miny=miny;a.maxx=maxx;a.maxy=maxy;
    }
  };

  Body.prototype.applyImpulse = function(imp, contact){
    if(this.invMass===0) return;
    this.vel = vadd(this.vel, vmul(imp, this.invMass));
    this.angVel += this.invInertia * vcross(vsub(contact, this.pos), imp);
  };

  Body.prototype.wake = function(){ if(this.isStatic)return; this.awake=true; this.sleepTime=0; };

  /* box helper: centered w x h poly */
  function boxVerts(w,h){
    var hw=w/2, hh=h/2;
    return [ v(-hw,-hh), v(hw,-hh), v(hw,hh), v(-hw,hh) ];  // CCW in screen coords (y-down): actually see note
  }

  /* ---------- collision manifolds ---------- */
  // returns {normal, penetration, contacts:[...], count} in world space, or null
  function collide(a,b){
    if(a.shape==='circle' && b.shape==='circle') return circleCircle(a,b);
    if(a.shape==='circle' && b.shape==='poly')   return circlePoly(a,b,false);
    if(a.shape==='poly'   && b.shape==='circle'){ var m=circlePoly(b,a,true); return m; }
    return polyPoly(a,b);
  }

  function circleCircle(a,b){
    var d=vsub(b.pos,a.pos); var dist=vlen(d); var r=a.radius+b.radius;
    if(dist>=r) return null;
    var n = dist>1e-9 ? vmul(d,1/dist) : v(0,-1);
    var pen = r-dist;
    var contact = vadd(a.pos, vmul(n, a.radius - pen*0.5));
    return { normal:n, penetration:pen, contacts:[contact], count:1 };
  }

  // circle (c) vs poly (p). flip=true means original call was poly,circle so
  // normal must point from A(poly) to B(circle) = -n. We compute n from poly->circle.
  function circlePoly(c,p,flip){
    // transform circle center into poly local space
    var local = vrot(vsub(c.pos, p.pos), -p.angle);
    var vs=p.verts, ns=p.normals, n=vs.length;
    var sep=-1e9, best=0;
    for(var i=0;i<n;i++){
      var s=vdot(ns[i], vsub(local, vs[i]));
      if(s>c.radius) return null;
      if(s>sep){ sep=s; best=i; }
    }
    var va=vs[best], vb=vs[(best+1)%n];
    var normalLocal, contactLocal, pen;
    if(sep < 1e-6){
      // center inside poly
      normalLocal = ns[best];
      pen = c.radius - sep;
      contactLocal = vsub(local, vmul(normalLocal, c.radius));
    } else {
      // determine voronoi region of the closest edge
      var d1=vdot(vsub(local,va), vsub(vb,va));
      var d2=vdot(vsub(local,vb), vsub(va,vb));
      if(d1<=0){
        var dva=vsub(local,va); if(vlen2(dva)>c.radius*c.radius) return null;
        normalLocal = vlen2(dva)>1e-9 ? vnorm(dva) : ns[best];   // guard exact-vertex zero normal
        pen=c.radius-vlen(dva); contactLocal=va;
      } else if(d2<=0){
        var dvb=vsub(local,vb); if(vlen2(dvb)>c.radius*c.radius) return null;
        normalLocal = vlen2(dvb)>1e-9 ? vnorm(dvb) : ns[best];
        pen=c.radius-vlen(dvb); contactLocal=vb;
      } else {
        normalLocal=ns[best]; pen=c.radius-sep;
        contactLocal=vsub(local, vmul(normalLocal, c.radius));
      }
    }
    // to world
    var worldN = vrot(normalLocal, p.angle);         // points poly -> circle
    var worldC = vadd(p.pos, vrot(contactLocal, p.angle));
    // collide(a,b) with a=circle,b=poly (flip=false): normal must point A->B = circle->poly = -worldN
    // with flip=true a=poly,b=circle: normal A->B = poly->circle = worldN
    var normal = flip ? worldN : vmul(worldN,-1);
    return { normal:normal, penetration:pen, contacts:[worldC], count:1 };
  }

  /* ---- poly-poly via SAT + reference/incident clipping (box2d-lite) ---- */
  function findAxisOfLeastPenetration(a,b){
    var best=-1e9, idx=0;
    for(var i=0;i<a.verts.length;i++){
      var nW=a.wnorm(i);
      var vW=a.wvert(i);
      // support point of b along -nW
      var s=support(b, vmul(nW,-1));
      var d=vdot(nW, vsub(s, vW));
      if(d>best){ best=d; idx=i; }
    }
    return {sep:best, idx:idx};
  }
  function support(body, dir){
    var best=-1e9, bp=null;
    for(var i=0;i<body.verts.length;i++){
      var p=body.wvert(i); var d=vdot(p,dir);
      if(d>best){ best=d; bp=p; }
    }
    return bp;
  }
  function polyPoly(a,b){
    var pa=findAxisOfLeastPenetration(a,b);
    if(pa.sep>=0) return null;
    var pb=findAxisOfLeastPenetration(b,a);
    if(pb.sep>=0) return null;
    var refBody,incBody,refIdx,flip;
    if(pa.sep >= pb.sep - 0.0005){ refBody=a; incBody=b; refIdx=pa.idx; flip=false; }
    else { refBody=b; incBody=a; refIdx=pb.idx; flip=true; }

    var refNorm=refBody.wnorm(refIdx);
    // incident face: the incident poly's face most anti-parallel to refNorm
    var incN=incBody.verts.length, incIdx=0, minDot=1e9;
    for(var i=0;i<incN;i++){ var d=vdot(incBody.wnorm(i), refNorm); if(d<minDot){ minDot=d; incIdx=i; } }
    var inc1=incBody.wvert(incIdx), inc2=incBody.wvert((incIdx+1)%incN);

    // reference edge endpoints
    var r1=refBody.wvert(refIdx), r2=refBody.wvert((refIdx+1)%refBody.verts.length);
    var refDir=vnorm(vsub(r2,r1));
    // clip incident segment to the side planes of the reference face
    var cp=[inc1,inc2];
    cp=clipSeg(cp, vmul(refDir,-1), -vdot(refDir,r1));
    if(cp.length<2) return null;
    cp=clipSeg(cp, refDir, vdot(refDir,r2));
    if(cp.length<2) return null;
    // keep points below the reference face (penetrating)
    var refFaceN=refNorm;
    var frontOffset=vdot(refFaceN, r1);
    var contacts=[], pens=[];
    for(var k=0;k<cp.length;k++){
      var sepp=vdot(refFaceN, cp[k]) - frontOffset;
      if(sepp<=0){ contacts.push(cp[k]); pens.push(-sepp); }
    }
    if(contacts.length===0) return null;
    var pen=0; for(var q=0;q<pens.length;q++) pen+=pens[q]; pen/=pens.length;
    // normal must point from A to B
    var normal = flip ? vmul(refNorm,-1) : refNorm;
    return { normal:normal, penetration:pen, contacts:contacts, count:contacts.length };
  }
  function clipSeg(seg, n, offset){
    var out=[];
    var d1=vdot(n,seg[0])-offset;
    var d2=vdot(n,seg[1])-offset;
    if(d1<=0) out.push(seg[0]);
    if(d2<=0) out.push(seg[1]);
    if(d1*d2<0){
      var t=d1/(d1-d2);
      out.push(vadd(seg[0], vmul(vsub(seg[1],seg[0]), t)));
    }
    return out;
  }

  /* ---------------- World ---------------- */
  function World(opts){
    this.constraints = [];
    this.forces = [];
    opts=opts||{};
    this.gravity = v(0, opts.gravity!=null?opts.gravity:1800);
    this.bodies = [];
    this.iterations = opts.iterations||10;
    this.onContact = null;   // callback(a,b,impulseMag,contactPt)
    this._slop = 0.05;
    this._warm = {};         // per-pair impulse cache for warm-starting the solver
  }
  World.prototype.add = function(body){ this.bodies.push(body); return body; };
  World.prototype.remove = function(body){
    var i=this.bodies.indexOf(body); if(i>=0) this.bodies.splice(i,1);
  };

  World.prototype.step = function(dt){
    var bodies=this.bodies, i, n=bodies.length;
    // purge dead
    for(i=n-1;i>=0;i--){ if(bodies[i].dead) bodies.splice(i,1); }
    n=bodies.length;

    // ADDED for Doohickey: field forces (a fan's cone, a balloon's buoyancy)
    // are applied into body.force BEFORE the integrate, in creation order.
    if(this.forces) for(var ff=0; ff<this.forces.length; ff++) this.forces[ff](this, dt);

    // integrate forces
    for(i=0;i<n;i++){
      var bd=bodies[i];
      if(bd.isStatic || !bd.awake) continue;
      bd.vel = vadd(bd.vel, vmul(vadd(this.gravity, vmul(bd.force, bd.invMass)), dt));
      bd.angVel += bd.torque*bd.invInertia*dt;
      // damping (mild — keeps stacks calm)
      bd.vel = vmul(bd.vel, 1/(1+dt*0.15));
      bd.angVel *= 1/(1+dt*0.4);
    }

    // broadphase + narrowphase (O(n^2) with an AABB early-out; profiling showed the solver
    // over actual contacts — not pair enumeration — is the real cost at fort densities, so a
    // spatial hash gave no speedup. Keep forts to a few dozen dynamic blocks instead.)
    for(i=0;i<n;i++) bodies[i].updateAABB();
    var manifolds=[];
    for(i=0;i<n;i++){
      var A=bodies[i];
      for(var j=i+1;j<n;j++){
        var B=bodies[j];
        if(A.invMass===0 && B.invMass===0) continue;
        if(!A.awake && !B.awake) continue;
        if(!aabbOverlap(A._aabb,B._aabb)) continue;
        var m=collide(A,B);
        if(m){ m.a=A; m.b=B; manifolds.push(m); prestep(m,this,dt); }
      }
    }

    // solve velocity constraints (warm-started via cache seeded in prestep)
    // ADDED for Doohickey: joints solve inside the same loop as the contacts,
    // in creation order, after them. A seesaw is a plank pinned to the scene
    // and a balloon is a body on a rope, so both have to hold while the
    // contacts around them are still being resolved.
    var cons = this.constraints;
    for(var it=0; it<this.iterations; it++){
      for(var k=0;k<manifolds.length;k++) solveManifold(manifolds[k]);
      if(cons) for(var cj=0;cj<cons.length;cj++) cons[cj].solve(dt);
    }
    // write accumulated impulses back for next-frame warm start (purges untouched pairs)
    var warmNew={};
    for(var w=0;w<manifolds.length;w++){ var mf0=manifolds[w], arr=[];
      for(var ci=0;ci<mf0._c.length;ci++) arr.push(mf0._c[ci].pn);
      warmNew[mf0._key]=arr; }
    this._warm=warmNew;

    // integrate velocities into positions
    for(i=0;i<n;i++){
      var b2=bodies[i];
      if(b2.isStatic || !b2.awake) continue;
      b2.pos = vadd(b2.pos, vmul(b2.vel, dt));
      b2.angle += b2.angVel*dt;
      b2.force=v(0,0); b2.torque=0;
    }

    // positional correction — a SEPARATE position-only pass (no velocity change) so the
    // Baumgarte bias never inflates restitution; this is what makes contacts thud + settle.
    for(var pc=0;pc<manifolds.length;pc++) positionalCorrection(manifolds[pc], this);

    // report contact impulses to game layer + wake pairs
    if(this.onContact){
      for(var c=0;c<manifolds.length;c++){
        var mf=manifolds[c];
        // report by CLOSING SPEED (0 at rest) so resting support never reads as a hit
        if(mf._approach>36){
          this.onContact(mf.a, mf.b, mf._approach, mf._impulse, mf.contacts[0]);
        }
      }
    }

    // sleeping
    this._updateSleep(dt);
  };

  function aabbOverlap(a,b){ return a.minx<=b.maxx && a.maxx>=b.minx && a.miny<=b.maxy && a.maxy>=b.miny; }

  function prestep(m,world,dt){
    var a=m.a,b=m.b, t=vperp(m.normal);
    m.e=Math.min(a.restitution,b.restitution);
    m.df=Math.sqrt(a.friction*b.friction);
    m._impulse=0;
    m._approach=0;      // fastest closing speed among contacts (0 at rest)
    m._c=[];
    m._key = (a.id<b.id ? a.id+'_'+b.id : b.id+'_'+a.id);
    var cached = world._warm[m._key];
    // wake sleeping bodies that are being touched by an awake body
    if(a.awake && !b.awake) b.wake();
    if(b.awake && !a.awake) a.wake();
    for(var i=0;i<m.contacts.length;i++){
      var cp=m.contacts[i];
      var ra=vsub(cp,a.pos), rb=vsub(cp,b.pos);
      var rnA=vcross(ra,m.normal), rnB=vcross(rb,m.normal);
      var kn=a.invMass+b.invMass + a.invInertia*rnA*rnA + b.invInertia*rnB*rnB;
      var rtA=vcross(ra,t), rtB=vcross(rb,t);
      var kt=a.invMass+b.invMass + a.invInertia*rtA*rtA + b.invInertia*rtB*rtB;
      var rv=vsub( vadd(b.vel, vcrossSV(b.angVel,rb)), vadd(a.vel, vcrossSV(a.angVel,ra)) );
      var vn=vdot(rv,m.normal);
      if(-vn > m._approach) m._approach = -vn;   // closing speed for damage gauge
      // restitution ONLY (no Baumgarte here — penetration is fixed by positionalCorrection)
      var restBias = (vn < -200) ? -m.e*vn : 0;
      // warm start the NORMAL impulse only (order-insensitive for a stack). Warm-starting
      // friction too kicks tall stacks sideways when the contact-point order swaps frames.
      var pn0=0;
      if(cached && cached[i]!=null) pn0=cached[i];
      a.applyImpulse(vmul(m.normal,-pn0), cp);
      b.applyImpulse(vmul(m.normal, pn0), cp);
      m._c.push({ ra:ra, rb:rb, mn:kn>0?1/kn:0, mt:kt>0?1/kt:0, pn:pn0, pt:0, bias: restBias });
    }
  }

  // position-only de-penetration (Randy-Gaul style): keeps restitution honest + stacks stable
  function positionalCorrection(m, world){
    var a=m.a, b=m.b;
    var corr = Math.min(m.penetration, 12) - world._slop;
    if(corr<=0) return;
    var im = a.invMass + b.invMass; if(im<=0) return;
    var scalar = (corr / im) * 0.4;                 // 40% per step
    var moveA = Math.min(scalar*a.invMass, 4), moveB = Math.min(scalar*b.invMass, 4);
    if(a.invMass>0) a.pos = vsub(a.pos, vmul(m.normal, moveA));
    if(b.invMass>0) b.pos = vadd(b.pos, vmul(m.normal, moveB));
  }

  function solveManifold(m){
    var a=m.a,b=m.b, n=m.normal, t=vperp(n);
    for(var i=0;i<m._c.length;i++){
      var c=m._c[i];
      // normal impulse
      var rv=vsub( vadd(b.vel, vcrossSV(b.angVel,c.rb)), vadd(a.vel, vcrossSV(a.angVel,c.ra)) );
      var vn=vdot(rv,n);
      var dPn=c.mn*(-(vn) + c.bias);
      var newPn=Math.max(c.pn+dPn,0);
      dPn=newPn-c.pn; c.pn=newPn;
      var Pn=vmul(n,dPn);
      a.applyImpulse(vmul(Pn,-1), vadd(a.pos,c.ra));
      b.applyImpulse(Pn, vadd(b.pos,c.rb));
      m._impulse += Math.abs(dPn);
      // friction impulse
      rv=vsub( vadd(b.vel, vcrossSV(b.angVel,c.rb)), vadd(a.vel, vcrossSV(a.angVel,c.ra)) );
      var vt=vdot(rv,t);
      var dPt=c.mt*(-vt);
      var maxPt=m.df*c.pn;
      var oldPt=c.pt;
      c.pt=clamp(oldPt+dPt, -maxPt, maxPt);
      dPt=c.pt-oldPt;
      var Pt=vmul(t,dPt);
      a.applyImpulse(vmul(Pt,-1), vadd(a.pos,c.ra));
      b.applyImpulse(Pt, vadd(b.pos,c.rb));
    }
  }

  World.prototype._updateSleep = function(dt){
    // hysteresis: settle below 12 px/s, only fully wake above 20 px/s — stops solver
    // jitter from repeatedly crossing a single threshold and never letting a stack rest.
    var sleepLo=12*12, wakeHi=20*20, angLo=0.14*0.14;
    for(var i=0;i<this.bodies.length;i++){
      var b=this.bodies[i];
      if(b.isStatic) continue;
      if(!b.canSleep){ b.awake=true; continue; }
      if(vlen2(b.vel)>wakeHi || b.angVel*b.angVel>0.6*0.6){
        b.sleepTime=0; b.awake=true;
      } else if(vlen2(b.vel)<sleepLo && b.angVel*b.angVel<angLo){
        b.sleepTime+=dt;
        if(b.sleepTime>0.6){ b.awake=false; b.vel=v(0,0); b.angVel=0; }
      } else {
        b.awake=true; b.sleepTime=0;
      }
    }
  };

  return {
    Body:Body, World:World, boxVerts:boxVerts,
    v:v, vadd:vadd, vsub:vsub, vmul:vmul, vlen:vlen, vnorm:vnorm, vdot:vdot,
    collide:collide
  };
})();

/* ---- ADDED FOR DOOHICKEY: constraints, field forces, and the hash ---- */
/* Burr Blast has no joints. A seesaw is a plank pinned to the scene, a balloon
   is a body on a rope, and a bucket hangs on one, so Doohickey needs two.
   Both are solved by impulse inside the iteration loop, in creation order. */

/* A point to point joint. The anchor is given in world space at build time and
   remembered as a local offset in each body. */
function PinJoint(a, b, anchorX, anchorY) {
  this.a = a; this.b = b;
  this.la = vrot(vsub(v(anchorX, anchorY), a.pos), -a.angle);
  this.lb = b ? vrot(vsub(v(anchorX, anchorY), b.pos), -b.angle) : v(anchorX, anchorY);
  this.px = 0; this.py = 0;
}
PinJoint.prototype.solve = function (dt) {
  var a = this.a, b = this.b;
  var ra = vrot(this.la, a.angle), rb = b ? vrot(this.lb, b.angle) : v(0, 0);
  var pa = vadd(a.pos, ra), pb = b ? vadd(b.pos, rb) : this.lb;
  var va = vadd(a.vel, vcrossSV(a.angVel, ra));
  var vb = b ? vadd(b.vel, vcrossSV(b.angVel, rb)) : v(0, 0);
  var rv = vsub(vb, va);
  /* the 2x2 effective mass of the pair at the anchor */
  var ima = a.invMass, imb = b ? b.invMass : 0;
  var iia = a.invInertia, iib = b ? b.invInertia : 0;
  var k11 = ima + imb + iia * ra.y * ra.y + iib * rb.y * rb.y;
  var k12 = -iia * ra.x * ra.y - iib * rb.x * rb.y;
  var k22 = ima + imb + iia * ra.x * ra.x + iib * rb.x * rb.x;
  var det = k11 * k22 - k12 * k12;
  if (det > -1e-12 && det < 1e-12) return;
  var inv = 1 / det;
  /* Baumgarte: pull the anchors back together over time rather than snapping */
  var ex = (pb.x - pa.x) * CONFIG.BAUMGARTE / dt;
  var ey = (pb.y - pa.y) * CONFIG.BAUMGARTE / dt;
  var bx = -(rv.x + ex), by = -(rv.y + ey);
  var ix = inv * (k22 * bx - k12 * by);
  var iy = inv * (-k12 * bx + k11 * by);
  var P = v(ix, iy);
  a.wake(); if (b) b.wake();
  a.applyImpulse(vmul(P, -1), pa);
  if (b) b.applyImpulse(P, pb);
};

/* A rope. An INEQUALITY: it pulls when it is longer than maxLen and does
   nothing at all when it is slack. ⛔ solved as an equality it becomes a rod
   and a balloon pushes its cargo down. */
function Rope(a, b, maxLen) {
  this.a = a; this.b = b; this.maxLen = maxLen;
}
Rope.prototype.solve = function (dt) {
  var a = this.a, b = this.b;
  var d = vsub(b.pos, a.pos);
  var dist = vlen(d);
  /* ⛔ there is ONE guard here on purpose. An early `if (dist <= maxLen) return`
     says the same thing as the clamp at the bottom, and with the inequality
     written in two places a mutation of either one changes nothing at all, so
     no gate can ever see it. The clamp alone is a complete rope: when the rope
     is slack the bias is negative and large, the impulse comes out positive,
     and the clamp puts it back to zero. */
  if (dist < 1e-9) return;
  var n = vmul(d, 1 / dist);
  var rv = vdot(vsub(b.vel, a.vel), n);
  var bias = (dist - this.maxLen) * CONFIG.BAUMGARTE / dt;
  var im = a.invMass + b.invMass;
  if (im < 1e-12) return;
  var j = -(rv + bias) / im;
  if (j > 0) j = 0;            /* THE INEQUALITY: it only ever pulls */
  var P = vmul(n, j);
  a.wake(); b.wake();
  a.vel = vsub(a.vel, vmul(P, a.invMass));
  b.vel = vadd(b.vel, vmul(P, b.invMass));
};

/* A fan blows every awake body inside a cone. The force falls as 1 over the
   distance with a floor, so a body sitting on the grille is not launched. */
function fanForce(fan) {
  return function (world, dt) {
    if (!fan.on) return;
    var dir = vrot(v(1, 0), fan.angle), i;
    var cosHalf = dcos(CONFIG.FAN_HALF_ANGLE_DEG * DEG);
    for (i = 0; i < world.bodies.length; i++) {
      var b = world.bodies[i];
      if (b.isStatic || !b.awake) continue;
      var to = vsub(b.pos, fan.pos);
      var dist = vlen(to);
      if (dist > CONFIG.FAN_RANGE || dist < 1e-6) continue;
      var u = vmul(to, 1 / dist);
      if (vdot(u, dir) < cosHalf) continue;
      var mag = CONFIG.FAN_FORCE * b.mass / (dist < CONFIG.FAN_MIN_DIST ? CONFIG.FAN_MIN_DIST : dist);
      b.force = vadd(b.force, vmul(dir, mag));
    }
  };
}
/* A balloon pulls up with a multiple of its own weight while it is inflated. */
function buoyancy(balloon) {
  return function () {
    if (balloon.popped || balloon.isStatic) return;
    balloon.force = vadd(balloon.force,
      v(0, -CONFIG.GRAVITY * CONFIG.BALLOON_LIFT * balloon.mass));
  };
}

/* FNV-1a over every body's position, velocity, angle and spin, rounded to a
   millionth, in id order. Two runs of the same machine must give one hash. */
function stateHash(world) {
  var h = 2166136261, i, k, b, nums;
  var list = world.bodies.slice().sort(function (x, y) { return x.id - y.id; });
  for (i = 0; i < list.length; i++) {
    b = list[i];
    nums = [b.pos.x, b.pos.y, b.vel.x, b.vel.y, b.angle, b.angVel];
    for (k = 0; k < nums.length; k++) {
      var q = Math.round(nums[k] * 1e6) | 0;
      h ^= (q & 255); h = Math.imul(h, 16777619);
      h ^= ((q >> 8) & 255); h = Math.imul(h, 16777619);
      h ^= ((q >> 16) & 255); h = Math.imul(h, 16777619);
      h ^= ((q >> 24) & 255); h = Math.imul(h, 16777619);
    }
  }
  return (h >>> 0).toString(16);
}

/* ========================= 7. MACHINE ========================= */
/* The edit state and the seven bytes a part costs in a share link. */
function newMachine() { return { parts: [] }; }
function cloneMachine(m) {
  var out = { parts: [] }, i;
  for (i = 0; i < m.parts.length; i++) {
    var p = m.parts[i];
    out.parts.push({ type: p.type, x: p.x, y: p.y, rot: p.rot, flip: p.flip || 0 });
  }
  return out;
}
/* ⛔ ONE rotation grid for the whole game. A share link carries one byte of
   rotation, and if the board can hold an angle the byte cannot, then the
   machine you send is not the machine that arrives, and a domino run is chaotic
   enough to end differently. 240 steps of 1.5 degrees fit in a byte AND make
   every 15 degree detent exact, so the dial lands on 10 of them at a time and
   free placement lands on one of them too. */
var ROT_STEPS = 240, ROT_STEP_DEG = 360 / ROT_STEPS;
function detentIndex(rot) {
  var n = Math.round((rot / DEG) / ROT_STEP_DEG);
  n = n % ROT_STEPS; if (n < 0) n += ROT_STEPS;
  return n;
}
function detentAngle(i) { return i * ROT_STEP_DEG * DEG; }
/* the angle any part in this game is allowed to hold */
function onRotGrid(rot) { return detentAngle(detentIndex(rot)); }
function packMachine(levelId, m) {
  var bytes = [levelId & 255, m.parts.length & 255], i;
  for (i = 0; i < m.parts.length; i++) {
    var p = m.parts[i];
    var x = Math.round(p.x) & 65535, y = Math.round(p.y) & 65535;
    bytes.push(PART_ORDER.indexOf(p.type) & 255);
    bytes.push(x & 255, (x >> 8) & 255);
    bytes.push(y & 255, (y >> 8) & 255);
    bytes.push(detentIndex(p.rot) & 255);
    bytes.push((p.flip ? 1 : 0) & 255);
  }
  return bytes;
}
function unpackMachine(bytes) {
  if (!bytes || bytes.length < 2) return null;
  var levelId = bytes[0], n = bytes[1], m = newMachine(), i, o = 2;
  if (bytes.length < 2 + n * 7) return null;
  for (i = 0; i < n; i++) {
    var type = PART_ORDER[bytes[o]];
    if (!type) return null;
    m.parts.push({
      type: type,
      x: bytes[o + 1] | (bytes[o + 2] << 8),
      y: bytes[o + 3] | (bytes[o + 4] << 8),
      rot: detentAngle(bytes[o + 5]),
      flip: bytes[o + 6] ? 1 : 0
    });
    o += 7;
  }
  return { levelId: levelId, machine: m };
}

/* ========================= 9. SIM ========================= */
/* buildWorld is pure over (level, machine): the same pair always gives the same
   bodies in the same order with the same ids. runMachine steps it at a fixed
   rate and reports what happened. */
function buildWorld(level, machine) {
  /* ⛔ the world takes gravity as a NUMBER (it makes the vector itself). Passed
     a vector it read {x,y} as a scalar and every body integrated to NaN on the
     first step, silently: no error, just a marble at NaN. */

  var made = [], i;

function suiteDMath(T) {
  var i, worstS = 0, worstC = 0, worstA = 0;
  for (i = -40; i <= 40; i++) {
    var x = i * 0.37;
    worstS = Math.max(worstS, Math.abs(dsin(x) - Math.sin(x)));
    worstC = Math.max(worstC, Math.abs(dcos(x) - Math.cos(x)));
  }
  T.assert('the deterministic sine matches the built in one to a millionth of a millionth ('
    + worstS.toExponential(1) + ')', worstS < 1e-12);
  T.assert('and so does the cosine (' + worstC.toExponential(1) + ')', worstC < 1e-12);
  for (i = 0; i < 60; i++) {
    var a = (i / 60) * 6.2 - 3.1;
    var y = dsin(a), x2 = dcos(a);
    worstA = Math.max(worstA, Math.abs(datan2(y, x2) - Math.atan2(y, x2)));
  }
  T.assert('and atan2 agrees on every quadrant (' + worstA.toExponential(1) + ')', worstA < 1e-11);
  T.near('sine of nothing is nothing', dsin(0), 0, 1e-15);
  T.near('cosine of nothing is one', dcos(0), 1, 1e-15);
  T.near('and a quarter turn is one', dsin(DHALF_PI), 1, 1e-12);
  T.eq('atan2 straight up is a quarter turn', datan2(1, 0), DHALF_PI);
  T.eq('atan2 of nothing at all is nothing', datan2(0, 0), 0);
  T.near('the length of a three four five triangle is five', len2(3, 4), 5, 1e-15);
  /* the same call twice is the same bits, which is the whole point */
  T.eq('the same angle gives the same bits twice', dsin(1.234567) === dsin(1.234567), true);
}

/* ========================= 16. VIEW ========================= */
/* Canvas 2D, DPR aware, the 768 by 432 scene letterboxed into whatever the
   phone is. Cream paper, fat outlines, saturated primaries. Squash, puffs and
   motion lines are RENDER ONLY: the sim never sees them, so a machine looks
   different on two phones and runs identically on both. */
var V = { cv: null, ctx: null, W: 0, H: 0, dpr: 1, k: 1, ox: 0, oy: 0, t: 0, zoom: 1, camX: 384, camY: 216 };

function sx(x) { return V.ox + (x - V.camX) * V.k * V.zoom + V.W / 2; }

function unsx(px) { return (px - V.W / 2 - V.ox) / (V.k * V.zoom) + V.camX; }

function fitCanvas() {
  var cv = V.cv, r = cv.getBoundingClientRect();
  /* ⛔ measure the element. innerHeight lies about the browser chrome. */
  V.W = Math.max(1, Math.round(r.width));
  V.H = Math.max(1, Math.round(r.height));
  V.dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(V.W * V.dpr);
  cv.height = Math.round(V.H * V.dpr);
  /* ⛔ canvas.width CLEARS the context, so the transform is set after it */
  V.ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  /* landscape: the tray is a dock along the bottom and the scene sits above it.
     portrait: the scene letterboxes to the width and there is room to spare, so
     the scene is nudged up out of the tray's way rather than shrunk. */
  var portrait = V.H > V.W;
  var trayH = TRAY_SHOWING ? (portrait ? 0 : 76) : 0;
  V.k = Math.min(V.W / CONFIG.SCENE_W, (V.H - trayH) / CONFIG.SCENE_H);
  V.ox = 0;
  V.oy = portrait && TRAY_SHOWING ? -Math.min(110, (V.H - CONFIG.SCENE_H * V.k) / 2 - 10) : -trayH / 2;

/* ---- the paper ---- */
function drawPaper(ctx) {
  ctx.fillStyle = PAPER;

  var x0 = sx(0), y0 = sy(0), w = ss(CONFIG.SCENE_W), h = ss(CONFIG.SCENE_H);
  ctx.fillStyle = '#FBF4E2';
  ctx.fillRect(x0, y0, w, h);
  ctx.strokeStyle = 'rgba(201,185,142,.55)';
  ctx.lineWidth = 1;
  var g, step = CONFIG.CELL;
  ctx.beginPath();
  for (g = step; g < CONFIG.SCENE_W; g += step) { ctx.moveTo(sx(g), y0); ctx.lineTo(sx(g), y0 + h); }
  for (g = step; g < CONFIG.SCENE_H; g += step) { ctx.moveTo(x0, sy(g)); ctx.lineTo(x0 + w, sy(g)); }
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(2, ss(3));
  ctx.strokeRect(x0, y0, w, h);

/* ---- one body, drawn from the geometry the sim built ---- */
function bodyOutline(ctx, b, squash) {
  var i;

    var r = ss(b.radius);
    ctx.save();
    ctx.translate(sx(b.pos.x), sy(b.pos.y));
    ctx.rotate(b.angle);
    ctx.scale(1 / squash, squash);
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.restore();
  } else {
    for (i = 0; i < b.verts.length; i++) {
      var p = vadd(b.pos, vrot(b.verts[i], b.angle));
      if (i === 0) ctx.moveTo(sx(p.x), sy(p.y)); else ctx.lineTo(sx(p.x), sy(p.y));
    }
    ctx.closePath();

}
var PART_COLOUR = {
  marble: '#3D6FB4', plank: '#8A5A9B', domino: '#D8503C', seesaw: '#4E9A52',
  fan: '#3D6FB4', balloon: '#D8503C', cargo: '#8A5A9B', bell: '#E8B33C',
  bucket: '#8A5A9B', bucketWall: '#8A5A9B', scene: '#B9A87C',
  spring: '#4E9A52', switchPlate: '#E8B33C', cat: '#8A5A9B'
};
function drawBody(ctx, b) {
  var col = PART_COLOUR[b.kind] || '#9A8B72';
  /* squash and stretch: a fast body is a little longer along its travel. It is
     drawn, never simulated. */
  var sp = vlen(b.vel);
  var squash = REDUCED ? 1 : 1 + Math.min(0.18, sp / 2600);
  ctx.save();
  bodyOutline(ctx, b, squash);
  ctx.fillStyle = b.kind === 'scene' ? '#D9C9A0' : col;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(1.5, ss(b.kind === 'scene' ? 2.5 : 3));
  ctx.stroke();
  ctx.restore();
  /* the marks that make a part readable at a glance */
  if (b.kind === 'marble') {
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(sx(b.pos.x) - ss(b.radius * 0.3), sy(b.pos.y) - ss(b.radius * 0.34), ss(b.radius * 0.32), 0, 6.2832);
    ctx.fill();
  } else if (b.kind === 'domino') {
    /* pips, not a stripe: a line across the narrow way turns a row of these
       into a picket fence and you cannot tell one from the next */
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    var pi;
    for (pi = -1; pi <= 1; pi += 2) {
      var pp = vadd(b.pos, vrot(v(0, pi * CONFIG.DOMINO_H * 0.22), b.angle));
      ctx.beginPath();
      ctx.arc(sx(pp.x), sy(pp.y), Math.max(1, ss(1.9)), 0, 6.2832);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = Math.max(0.8, ss(1.2));
    var la = vadd(b.pos, vrot(v(-CONFIG.DOMINO_W * 0.32, 0), b.angle));
    var lb = vadd(b.pos, vrot(v(CONFIG.DOMINO_W * 0.32, 0), b.angle));
    ctx.beginPath(); ctx.moveTo(sx(la.x), sy(la.y)); ctx.lineTo(sx(lb.x), sy(lb.y)); ctx.stroke();
  } else if (b.kind === 'bell') {
    /* a dome with a lip and a clapper, so it reads as the thing you are aiming

    ctx.bezierCurveTo(bx - r, by - r * 0.9, bx + r, by - r * 0.9, bx + r, by + r * 0.62);
    ctx.closePath();

    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.5, ss(3));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx - r * 1.12, by + r * 0.62);
    ctx.lineTo(bx + r * 1.12, by + r * 0.62);
    ctx.stroke();
    ctx.fillStyle = INK;

    ctx.arc(bx, by + r * 0.9, Math.max(1.5, r * 0.2), 0, 6.2832);
    ctx.fill();

    ctx.strokeStyle = INK;

      ctx.beginPath();

      ctx.lineTo(sx(b.pos.x + dcos(ang) * 13), sy(b.pos.y + dsin(ang) * 13));

      g2.addColorStop(0, 'rgba(61,111,180,.16)');
      g2.addColorStop(1, 'rgba(61,111,180,0)');

      ctx.lineTo(sx(b.pos.x + dcos(b.angle + half) * CONFIG.FAN_RANGE),

    }
    ctx.stroke();

    ctx.fillStyle = b.pressed ? '#4E9A52' : 'rgba(44,36,24,.25)';
    ctx.beginPath();

    ctx.fill();
    ctx.strokeStyle = 'rgba(44,36,24,.55)';
    ctx.lineWidth = Math.max(0.8, ss(1.4));

    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, ss(2.2));

function drawRopes(ctx, world) {

    var c = world.constraints[i];

    ctx.beginPath();
    ctx.moveTo(sx(c.a.pos.x), sy(c.a.pos.y));
    ctx.lineTo(sx(c.b.pos.x), sy(c.b.pos.y));
    ctx.stroke();
  }
  for (i = 0; i < world.constraints.length; i++) {
    var p = world.constraints[i];
    if (!(p instanceof PinJoint)) continue;
    var at = p.b ? vadd(p.b.pos, vrot(p.lb, p.b.angle)) : p.lb;
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(sx(at.x), sy(at.y), Math.max(2, ss(3.5)), 0, 6.2832); ctx.fill();
  }
}
/* motion lines behind anything travelling fast, and dust where it lands */
var PUFFS = [];
function puff(x, y, n) {
  var i;
  if (REDUCED) return;
  for (i = 0; i < n && PUFFS.length < 60; i++) {
    PUFFS.push({ x: x, y: y, vx: (Math.random() - 0.5) * 40, vy: -10 - Math.random() * 30,
      r: 2 + Math.random() * 4, life: 420, max: 420 });
  }
}
function stepPuffs(dt) {
  var i;
  for (i = PUFFS.length - 1; i >= 0; i--) {
    var p = PUFFS[i];
    p.x += p.vx * dt * 0.001; p.y += p.vy * dt * 0.001; p.vy += dt * 0.04;
    p.life -= dt;
    if (p.life <= 0) PUFFS.splice(i, 1);
  }
}
function drawPuffs(ctx) {
  var i;
  for (i = 0; i < PUFFS.length; i++) {
    var p = PUFFS[i];
    ctx.fillStyle = 'rgba(140,124,92,' + (p.life / p.max * 0.4).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), ss(p.r), 0, 6.2832); ctx.fill();
  }
}
function drawStreaks(ctx, world) {
  var i;
  if (REDUCED) return;
  ctx.strokeStyle = 'rgba(44,36,24,.22)';
  ctx.lineCap = 'round';
  for (i = 0; i < world.bodies.length; i++) {
    var b = world.bodies[i];
    if (b.isStatic) continue;
    var sp = vlen(b.vel);
    if (sp < 300) continue;
    var back = vmul(vnorm(b.vel), -Math.min(34, sp * 0.05));
    ctx.lineWidth = Math.max(1, ss(2));
    ctx.beginPath();
    ctx.moveTo(sx(b.pos.x), sy(b.pos.y));
    ctx.lineTo(sx(b.pos.x + back.x), sy(b.pos.y + back.y));
    ctx.stroke();
  }
}
/* the bonus stars, and whether they have been touched */
function drawBonus(ctx, level, touched) {
  var i, k;
  for (i = 0; i < level.bonus.length; i++) {
    var p = level.bonus[i], on = touched && touched[i];
    ctx.save();
    ctx.translate(sx(p.x), sy(p.y));
    ctx.rotate(REDUCED ? 0 : V.t * 0.0008);
    ctx.beginPath();
    for (k = 0; k < 10; k++) {
      var rr = ss(k % 2 ? 5 : 11);
      var a = k * 0.6283 - 1.5708;
      if (k === 0) ctx.moveTo(dcos(a) * rr, dsin(a) * rr);
      else ctx.lineTo(dcos(a) * rr, dsin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = on ? '#E8B33C' : 'rgba(232,179,60,.22)';
    ctx.fill();
    ctx.strokeStyle = on ? INK : 'rgba(44,36,24,.35)';
    ctx.lineWidth = Math.max(1.2, ss(2.2));
    ctx.stroke();
    ctx.restore();
  }
}
/* the camera: on GO it eases toward the moving mass and zooms in a little */
function cameraTarget(world) {
  var i, wx2 = 0, wy2 = 0, mass = 0, maxSp = 0;
  for (i = 0; i < world.bodies.length; i++) {
    var b = world.bodies[i];
    if (b.isStatic || !b.awake) continue;
    var sp = vlen(b.vel), w2 = b.mass * (1 + sp * sp * 0.0002);
    wx2 += b.pos.x * w2; wy2 += b.pos.y * w2; mass += w2;
    if (sp > maxSp) maxSp = sp;
  }
  if (mass <= 0) return { x: CONFIG.SCENE_W / 2, y: CONFIG.SCENE_H / 2, zoom: 1 };
  var z = 1 + Math.min(0.5, maxSp / 1400);
  return { x: wx2 / mass, y: wy2 / mass, zoom: clamp(z, 1, CONFIG.ZOOM_MAX) };
}
function easeCamera(world, dt) {
  if (REDUCED) { V.camX = CONFIG.SCENE_W / 2; V.camY = CONFIG.SCENE_H / 2; V.zoom = 1; return; }
  var t = cameraTarget(world), u = Math.min(1, dt * 0.0022);
  V.camX += (t.x - V.camX) * u;
  V.camY += (t.y - V.camY) * u;
  V.zoom += (t.zoom - V.zoom) * u;
  /* never show the player the outside of the sheet */
  var halfW = V.W / (2 * V.k * V.zoom), halfH = V.H / (2 * V.k * V.zoom);
  V.camX = clamp(V.camX, Math.min(CONFIG.SCENE_W / 2, halfW), Math.max(CONFIG.SCENE_W / 2, CONFIG.SCENE_W - halfW));
  V.camY = clamp(V.camY, Math.min(CONFIG.SCENE_H / 2, halfH), Math.max(CONFIG.SCENE_H / 2, CONFIG.SCENE_H - halfH));
}
function resetCamera() { V.camX = CONFIG.SCENE_W / 2; V.camY = CONFIG.SCENE_H / 2; V.zoom = 1; }

var REDUCED = false, TRAY_SHOWING = false;
function drawScene(ctx, world, level, touched) {
  drawPaper(ctx);
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx(0), sy(0), ss(CONFIG.SCENE_W), ss(CONFIG.SCENE_H));
  ctx.clip();
  drawBonus(ctx, level, touched);
  drawStreaks(ctx, world);
  var i;
  for (i = 0; i < world.bodies.length; i++) if (world.bodies[i].kind === 'scene') drawBody(ctx, world.bodies[i]);
  drawRopes(ctx, world);
  for (i = 0; i < world.bodies.length; i++) if (world.bodies[i].kind !== 'scene') drawBody(ctx, world.bodies[i]);
  drawPuffs(ctx);
  drawConfetti(ctx);
  ctx.restore();
}

/* GO copies the machine and runs the copy, so the run can never edit the board */
function goRun() {
  if (G.running) return;
  if (!G.machine.parts.length) { toast('Put something on the board first.'); return; }
  G.running = true;
  G.result = null;
  G.runT = 0;
  ACC = 0;
  TAPE.length = 0; REPLAY = null; CONFETTI.length = 0;
  G.world = buildWorld(G.level, cloneMachine(G.machine));
  /* dust where things actually hit, not on a timer. The sim reports the
     impulse; the view decides whether it was worth a puff. */
  /* ⛔ the callback is (a, b, approachSpeed, impulse, point), five arguments,
     not four. Read the engine rather than the plan's one line summary of it. */
  G.world.onContact = function (a, b, approach, impulse, pt) {
    if (approach > 90 && pt) puff(pt.x, pt.y, approach > 320 ? 3 : 1);
    soundFromContact(a, b, approach);
  };

  G.touched = [];
  for (i = 0; i < G.level.bonus.length; i++) G.touched.push(0);

  haptic(10);
}
function stopRun() {
  if (!G.running) return;

  REPLAY = null;

  rebuildPreview();
  resetCamera();
  showScreen('Build');
  renderTray();
}
function tickRun(dt) {
  var step = 1 / CONFIG.PHYS_HZ, guard = 0;
  ACC += Math.min(0.25, dt / 1000);
  while (ACC >= step && guard < 12) {
    G.world.step(step);
    tapeFrame(G.world);
    G.runT += step;
    touchedBonus(G.world, G.level, G.touched);
    if (!G.result && bellRung(G.world)) {
      var m = G.machine, res = { goal: true, goalAt: G.runT, bonus: G.touched, allBonus: true }, i;
      for (i = 0; i < G.touched.length; i++) if (!G.touched[i]) res.allBonus = false;
      G.result = { stars: starsFor(G.level, m, res), at: G.runT, parts: m.parts.length };
      onWin();
    }
    ACC -= step;
    guard++;

  if (G.runT > CONFIG.RUN_MAX_S && !G.result) { toast('It ran out of time. Have another go.'); stopRun(); }
}

    if (REPLAY) { stepReplay(dt); easeCamera(G.world, dt); }
    else { tickRun(dt); easeCamera(G.world, dt); }

  stepPuffs(dt);
  stepConfetti(dt);

/* ========================= 17B. THE WIN ========================= */
/* The last three seconds, kept as poses and played back at a third speed behind
   the card. It is a RECORDING, not a re-simulation: re-running would be exact
   too, but this costs nothing and cannot drift from what the player saw. */
var TAPE = [], TAPE_MAX = Math.round(3 * CONFIG.PHYS_HZ), REPLAY = null;
function tapeFrame(world) {
  var i, poses = [];
  for (i = 0; i < world.bodies.length; i++) {
    var b = world.bodies[i];
    poses.push(b.pos.x, b.pos.y, b.angle);
  }
  TAPE.push(poses);
  if (TAPE.length > TAPE_MAX) TAPE.shift();
}
function startReplay() {
  if (!TAPE.length) return;
  REPLAY = { i: 0, acc: 0, poses: TAPE.slice() };
}
function stepReplay(dt) {
  if (!REPLAY) return;
  REPLAY.acc += dt;
  var per = 1000 / (CONFIG.PHYS_HZ * 0.34);
  while (REPLAY.acc >= per) {
    REPLAY.acc -= per;
    REPLAY.i++;
    if (REPLAY.i >= REPLAY.poses.length) REPLAY.i = 0;
  }
  var poses = REPLAY.poses[REPLAY.i], i;
  for (i = 0; i < G.world.bodies.length && i * 3 + 2 < poses.length; i++) {
    G.world.bodies[i].pos = v(poses[i * 3], poses[i * 3 + 1]);
    G.world.bodies[i].angle = poses[i * 3 + 2];
  }
}
var CONFETTI = [];
function confetti(n) {
  if (REDUCED) return;
  var i, cols = ['#D8503C', '#3D6FB4', '#E8B33C', '#4E9A52', '#8A5A9B'];
  for (i = 0; i < n; i++) {
    CONFETTI.push({
      x: CONFIG.SCENE_W * (0.2 + Math.random() * 0.6), y: -10 - Math.random() * 60,
      vx: (Math.random() - 0.5) * 90, vy: 40 + Math.random() * 120,
      rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 6,
      w: 5 + Math.random() * 5, h: 8 + Math.random() * 6,
      col: cols[i % cols.length], life: 3600
    });
  }
}
function stepConfetti(dt) {
  var i;
  for (i = CONFETTI.length - 1; i >= 0; i--) {
    var c = CONFETTI[i];
    c.x += c.vx * dt * 0.001; c.y += c.vy * dt * 0.001;
    c.vy += dt * 0.22; c.rot += c.spin * dt * 0.001;
    c.life -= dt;
    if (c.life <= 0 || c.y > CONFIG.SCENE_H + 40) CONFETTI.splice(i, 1);
  }
}
function drawConfetti(ctx) {
  var i;

    var c = CONFETTI[i];
    ctx.save();
    ctx.translate(sx(c.x), sy(c.y));
    ctx.rotate(c.rot);

/* ========================= 17C. THE SANDBOX ========================= */

   par, nothing to win: it is a table with a box of bits on it. */
var SANDBOX_LEVEL = {

    spring: 2, switchPlate: 2, cat: 1 },

};
