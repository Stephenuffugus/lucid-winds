<style>
*{margin:0;padding:0;box-sizing:border-box}

#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

.dishBtn span{display:block;font-size:10px;opacity:.6;margin-top:3px;letter-spacing:.05em}

.blob:before,.blob:after{content:"";position:absolute;top:28px;width:8px;height:8px;border-radius:50%;background:#1c1e24}

@keyframes wob{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.94)}60%{transform:scale(.96,1.05)}}

<script>
(() => {
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   TOFU — "You have no properties of your own. You become what you soak in."
   Single-file vanilla HTML/CSS/JS. No build. No network. No API.
   Sections: 0 util · 1 CONFIG · 2 LEVELS · 3 assets · 4 state · 5 physics
             6 entities · 7 particles/toasts · 8 render · 9 input · 10 UI/flow
   Tuning knobs live in CFG. Levels are ASCII — edit them freely.
   ═══════════════════════════════════════════════════════════════════ */

// ───────────────────────────── 0. UTIL ─────────────────────────────
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const EPS = 1e-3;
const qs = new URLSearchParams(location.search);
const DEV = qs.has('dev');

// ───────────────────────────── 1. CONFIG ───────────────────────────
const CFG = {
  gravity: 38, runSpeed: 6.5, accelGround: 48, accelAir: 26, jumpV: 13,
  coyote: 0.1, jumpBuffer: 0.12, maxFall: 30,
  water:  { gravityMul: 0.3, drag: 2.6, swimV: 6.5, swimCooldown: 0.22, buoyancy: 42 },
  soak:   { waterSoften: 0.32, waterRinse: 0.3, soy: 0.5, soySalting: 0.12, brine: 0.5, press: 0.45, pressWring: 0.25 },
  heat:   { gain: 0.9, loss: 0.7, fryAt: 0.35, burnAt: 1.2, soggyTime: 6 },   // full-speed pan crossing ≈0.46s → fried; ~1.3s → burnt
  cold:   { gain: 0.65, loss: 0.5, frozenTime: 8, thawedTime: 12, thawInLiquid: 4, thawOnPan: 6 },
  thresholds: { silken: 0.3, firm: 0.75, flavor: 0.6, stinkClean: 0.2, stinkScare: 0.4 },
  smashSpeed: 2.5,
  eye:  { range: 9, halfAngle: 20, open: 2.6, closed: 1.0, fill: 4, drain: 3, visLimit: 0.45 },   // fill 4/s → ~0.25s in view gets you caught
  chop: { patrol: 2.4, chase: 4.0, flee: 5.5, senseRange: 6, fleeRange: 5 },
  tile: { min: 30, max: 60 },
  blob: { points: 16 },
};
const TH = CFG.thresholds;

// ───────────────────────────── 2. LEVELS ───────────────────────────
// Legend:  # wall   . empty   ~ water   s soy   f brine   * freezer   o hot pan
//          k knife  g grate   c cracked block   b bowl   p start   d shadow
//          < eye looking left   > eye looking right   x chopsticks
// Recipes: PLAIN SILKEN FIRM FRIED FROZEN SOY STINKY (bowl also demands stink<0.2 unless STINKY)
const LEVELS = [
{ dish: 'PLATED', sub: 'Tofu, as it comes. Nothing added.', recipe: ['PLAIN'],
  hint: 'Left side: drag to move. Right side: JUMP. Reach the bowl as you are.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#...................b......#',
  '#..................####....#',
  '#..............##..........#',
  '#.p........##..##..........#',
  '############################']},
{ dish: 'HIYAYAKKO', sub: 'Chilled silken tofu. Soft enough to slip through anything.', recipe: ['SILKEN'],
  hint: 'Soak in water to go SILKEN. Silken slips through grates, but can barely jump.',
  map: [
  '############################',
  '#................g.........#',
  '#................g.........#',
  '#................g.........#',
  '#................g.........#',
  '#................g.........#',
  '#.p..............g.........#',
  '#####............g.........#',
  '#####............g.........#',
  '#####~~~~~~~~~~~~g......b..#',
  '############################']},
{ dish: 'DOUGAN', sub: 'Pressed tofu. Dense, firm, springy.', recipe: ['FIRM'],
  hint: 'Hold SQUEEZE to press the water out. FIRM tofu jumps high.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..................b.......#',
  '#.................##########',
  '#.................##########',
  '#.p...............##########',
  '############################']},
{ dish: 'AGEDASHI', sub: 'Fried crisp outside. Don’t linger in the pan.', recipe: ['FRIED'],
  hint: 'Run across the hot pan to puff up. FRIED tofu floats and bounces. Stay too long and you burn.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........ooooo...........#',
  '#.p........#####........b..#',
  '#################~~~~~~~####',
  '#################~~~~~~~####',
  '#################~~~~~~~####',
  '############################']},
{ dish: 'KORI DOFU', sub: 'Frozen tofu. Hard as a brick, for a while.', recipe: ['FROZEN'],
  hint: 'Stand in the freezer. FROZEN tofu smashes cracked blocks and shrugs off knives. It thaws, so move.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..............c...........#',
  '#..............c...........#',
  '#..............c...........#',
  '#..............c...........#',
  '#.p...***......c.kkk....b..#',
  '############################']},
{ dish: 'BRAISED', sub: 'Soy dark and firm.', recipe: ['SOY', 'FIRM'],
  hint: 'Soak in soy to go dark. Dark tofu hides in shadow. Eyes blink. Cross the light when they do. Salt firms you up.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#..........................#',
  '#.................#........#',
  '#.......dddd..ddd.<........#',
  '#.p.....dddd..ddd.......b..#',
  '#####sss####################',
  '############################']},
{ dish: 'CHOU DOUFU', sub: 'Stinky tofu. An acquired taste.', recipe: ['STINKY'],
  hint: 'Soak in the brine. Chopsticks won’t touch STINKY tofu. Water rinses the stink off, so mind the puddle.',
  map: [
  '############################',
  '#..........................#',
  '#..........................#',

  '#..........................#',
  '#..........................#',
  '#.p..ff........x...~~~..b..#',
  '############################']},
{ dish: 'CHEF’S SPECIAL', sub: 'Fried, soy dark, and served under watch.', recipe: ['FRIED', 'SOY'],
  hint: 'Everything you’ve learned. Thawed tofu is SPONGY: it soaks twice as fast.',
  map: [
  '################################',
  '#..........#...................#',
  '#..........#...................#',
  '#..........#...................#',
  '#..........#...................#',
  '#..........#...................#',
  '#..........#...................#',
  '#..........#...###..........#..#',
  '#..........c..........ddd..d<..#',
  '#.p..***...c...ooo....ddd..d.b.#',
  '############sss#################',
  '################################']},
];

// ───────────────────────────── 3. ASSETS ───────────────────────────
// Optional art. Everything below is drawn procedurally if the PNG is missing.
// Drop files named like these into ./assets/ and they take over (see ASTRA_ASSETS.md).
const ASSET_FILES = [
  'tofu_plain','tofu_silken','tofu_firm','tofu_fried','tofu_frozen','tofu_spongy','tofu_puddle',
  'face_neutral','face_happy','face_strain','face_hot','face_cold','face_sneak','face_dead',
  'tile_wall','tile_wall_top','tile_crack','tile_grate','tile_knife','water_body','water_surface_4f',
  'pool_soy','pool_brine','pool_brine_bubbles_4f','floor_freezer','pan_slab','pan_glow_3f','bowl','bowl_ring',
  'eye_block_3f','shadow_tile','bg_counter','chopsticks_patrol_4f','chopsticks_chase_4f','chopsticks_flee_4f',
  'btn_jump','btn_squeeze','wordmark'
];
const ART_V = 1; // bump with every art change so the host's hard cache never serves old art
const HI = (typeof devicePixelRatio === 'number' ? devicePixelRatio : 1) >= 2; // @2x only on dense screens
const assetUrl = name => 'assets/' + name + (HI ? '@2x' : '') + '.png?v=' + ART_V;
const IMG = {}, WANT = {}, FILE_OF = {};
for (const name of ASSET_FILES) FILE_OF[name.replace(/_\d+f$/, '')] = name;
function loadAsset(key) { // each asset on its first use; the drawn fallback stands in meanwhile
  if (WANT[key]) return; WANT[key] = 1;
  const name = FILE_OF[key]; if (!name || typeof Image === 'undefined') return;
  const m = name.match(/_(\d+)f$/); const frames = m ? +m[1] : 1;
  const img = new Image();
  img.onload = () => { IMG[key] = { img, frames, fw: img.naturalWidth / frames, fh: img.naturalHeight }; onAsset(key); };
  img.onerror = () => {};
  img.src = assetUrl(name);
}
function loadAssets() { loadAsset('btn_jump'); loadAsset('btn_squeeze'); }
const spr = key => { if (!WANT[key]) loadAsset(key); return IMG[key] || null; };
function drawSpr(s, x, y, w, h, frame = 0) { const f = Math.floor(frame) % s.frames; ctx.drawImage(s.img, f * s.fw, 0, s.fw, s.fh, x, y, w, h); }
function onAsset(key) {
  const art = (b, k) => { b.style.backgroundImage = 'url(' + assetUrl(k) + ')'; b.style.backgroundSize = '100% 100%'; b.style.borderColor = 'transparent'; b.textContent = ''; };
  if (key === 'btn_jump') art(jumpBtn, 'btn_jump');
  if (key === 'btn_squeeze') art(pressBtn, 'btn_squeeze');
  if (key === 'wordmark' && mode === 'title') showTitle();
}

// ───────────────────────────── 4. STATE ────────────────────────────
const canvas = $('#c'), ctx = canvas.getContext('2d');
const hudEl = $('#hud'), overlay = $('#overlay'), card = $('#card');
const jumpBtn = $('#jumpBtn'), pressBtn = $('#pressBtn'), menuBtn = $('#menuBtn'), hintEl = $('#hint');
const el = { dishName: $('#dishName'), dishSub: $('#dishSub'), chips: $('#chips'), stateMain: $('#stateMain'), stateTags: $('#stateTags'), barFirm: $('#barFirm'), barFlav: $('#barFlav'), barFlavLabel: $('#barFlavLabel') };

let dpr = 1, mode = 'title', world = null, cardLevel = 0;
let animT = 0, levelTime = 0, deaths = 0, spotted = 0, rejectCd = 0, grateOpen = false, recipeOk = false;
const cam = { x: 0, y: 0, ts: 40, ox: 0, oy: 0 };
const P = {};             // the tofu
const parts = [], toasts = [];
let progress = 0, best = {}, muted = false;
try { progress = +localStorage.getItem('tofu.progress') || 0; best = JSON.parse(localStorage.getItem('tofu.best') || '{}'); muted = localStorage.getItem('tofu.mute') === '1'; } catch (e) {}
function save() { try { localStorage.setItem('tofu.progress', progress); localStorage.setItem('tofu.best', JSON.stringify(best)); localStorage.setItem('tofu.mute', muted ? '1' : '0'); } catch (e) {} }

function loadLevel(i) {
  const L = LEVELS[i]; const H = L.map.length; const W = Math.max(...L.map.map(r => r.length));
  world = { idx: i, L, W, H, grid: L.map.map(r => r.padEnd(W, '#').split('')), eyes: [], chops: [], bowl: null, spawn: { x: 1, y: 1 }, zones: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = world.grid[y][x];
    if (ch === 'p') { world.spawn = { x, y }; world.grid[y][x] = '.'; }
    else if (ch === '<' || ch === '>') world.eyes.push({ x: x + 0.5, y: y + 0.5, dir: ch === '<' ? -1 : 1, t: rnd(3), open: true, seeing: false });
    else if (ch === 'x') { world.chops.push({ x: x + 0.5, y: y + 1 - 0.55, dir: -1, hw: 0.28, hh: 0.55, mode: 'patrol', anim: 0 }); world.grid[y][x] = '.'; }
    else if (ch === 'b') world.bowl = { x, y };
    if ('sf*o~'.includes(ch)) world.zones.push({ x, y, ch });
  }
  parts.length = 0; toasts.length = 0; spotted = 0; levelTime = 0; deaths = 0; rejectCd = 0;
  resetPlayer(); layout(null);
}
function resetPlayer() {
  Object.assign(P, { x: world.spawn.x + 0.5, y: world.spawn.y + 0.5, vx: 0, vy: 0, hw: 0.4, hh: 0.4,
    f: 0.5, soy: 0, stink: 0, heat: 0, cold: 0, fried: false, soggy: 0, frozen: false, frozenT: 0, thawed: false, thawedT: 0,
    onGround: false, coyote: 0, jumpBuf: 0, swimCd: 0, face: 1, dead: false, deadT: 0, sx: 1, sy: 1, inWater: false, zone: '.', pressing: false, happyT: 0 });
  P.jig = Array.from({ length: CFG.blob.points }, () => ({ ox: 0, oy: 0, vx: 0, vy: 0 }));
  updateDims(true);
}
function updateDims(snap) {
  let w = lerp(0.95, 0.76, P.f), h = lerp(0.6, 0.84, P.f);
  if (P.fried) { w = Math.min(1, w * 1.2); h = Math.min(1, h * 1.25); }
  if (P.frozen) { w = 0.8; h = 0.8; }
  const bottom = P.y + P.hh; P.hw = w / 2; P.hh = h / 2;
  if (!snap) { P.y = bottom - P.hh; unstick(); }

    else if (p.shape === 'o') { ctx.lineWidth = 0.02; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke(); }
    else if (p.shape === 'w') { ctx.lineWidth = 0.035; ctx.beginPath(); for (let i = 0; i <= 4; i++) { const y = p.y - i * p.r * 0.5, x = p.x + Math.sin(i * 1.6 + animT * 6) * p.r * 0.5; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawToasts() {
  ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.font = '800 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of toasts) {
    const k = t.t / t.dur, a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
    const sx = cam.ox + t.x * cam.ts, sy = cam.oy + (t.y - k * 0.6) * cam.ts, w = ctx.measureText(t.text).width + 18;
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(10,11,16,0.8)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(sx - w / 2, sy - 15, w, 30, 8) : ctx.rect(sx - w / 2, sy - 15, w, 30); ctx.fill();
    ctx.fillStyle = '#f3efe6'; ctx.fillText(t.text, sx, sy);
  }
  ctx.restore();
}

// ───────────────────────────── 9. INPUT & AUDIO ────────────────────
const input = { move: 0, press: false, jumpQueued: false, keys: {} };
const stick = { id: null, startX: 0, x: 0 };
canvas.addEventListener('pointerdown', e => {
  SFX.unlock(); if (mode !== 'play') return;
  if (e.clientX < innerWidth * 0.5) { if (stick.id === null) { stick.id = e.pointerId; stick.startX = stick.x = e.clientX; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} } }
  else input.jumpQueued = true;
});
canvas.addEventListener('pointermove', e => { if (e.pointerId === stick.id) stick.x = e.clientX; });
const endStick = e => { if (e.pointerId === stick.id) stick.id = null; };
canvas.addEventListener('pointerup', endStick); canvas.addEventListener('pointercancel', endStick);
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); SFX.unlock(); input.jumpQueued = true; });
pressBtn.addEventListener('pointerdown', e => { e.preventDefault(); SFX.unlock(); input.press = true; pressBtn.classList.add('on'); try { pressBtn.setPointerCapture(e.pointerId); } catch (err) {} });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) pressBtn.addEventListener(ev, () => { input.press = false; pressBtn.classList.remove('on'); });
menuBtn.addEventListener('click', () => { if (mode === 'play') showPaused(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); input.keys[k] = true;
  if (k === ' ' || k === 'w' || k === 'arrowup') { input.jumpQueued = true; e.preventDefault(); }
  if (k === 's' || k === 'arrowdown' || k === 'shift') input.press = true;
  if (k === 'r' && mode === 'play') restartLevel();
  if (k === 'escape') { if (mode === 'play') showPaused(); else if (mode === 'paused') resume(); }
  if (k === 'n' && mode === 'play') nextLevel();
  if (k === 'm') { toggleMute(); if (mode !== 'play') refreshCard(); }
  if (mode === 'card' && (k === ' ' || k === 'enter')) startLevel(cardLevel);
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); input.keys[k] = false; if (k === 's' || k === 'arrowdown' || k === 'shift') input.press = false; });
function pollInput() {
  if (stick.id !== null) { let dx = (stick.x - stick.startX) / 42; if (dx > 1) { stick.startX = stick.x - 42; dx = 1; } if (dx < -1) { stick.startX = stick.x + 42; dx = -1; } input.move = Math.abs(dx) < 0.12 ? 0 : dx; }
  else input.move = ((input.keys.arrowright || input.keys.d) ? 1 : 0) - ((input.keys.arrowleft || input.keys.a) ? 1 : 0);
}
const SFX = (() => {
  let ac = null, lastPress = 0;
  const get = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f0, f1, dur, type = 'sine', vol = 0.12) { if (muted) return; try { const a = get(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime; o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02); } catch (e) {} }
  function noise(dur, vol = 0.1, freq = 1000) { if (muted) return; try { const a = get(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start(); } catch (e) {} }
  return {
    unlock: () => { try { get(); } catch (e) {} },
    jump: () => tone(260, 540, 0.1, 'square', 0.05), land: () => tone(140, 90, 0.08, 'sine', 0.08), swim: () => tone(300, 200, 0.1, 'sine', 0.05),
    fry: () => noise(0.35, 0.12, 2200), freeze: () => tone(1100, 1900, 0.25, 'sine', 0.07), smash: () => noise(0.22, 0.25, 420),
    served: () => { tone(523, 523, 0.12, 'triangle'); setTimeout(() => tone(659, 659, 0.12, 'triangle'), 120); setTimeout(() => tone(784, 1046, 0.3, 'triangle'), 240); },
    dead: () => tone(300, 70, 0.4, 'sawtooth', 0.08), reject: () => tone(220, 170, 0.18, 'triangle', 0.08),
    press: () => { const t = performance.now(); if (t - lastPress > 180) { lastPress = t; tone(170, 120, 0.07, 'sine', 0.035); } },
  };
})();
function toggleMute() { muted = !muted; save(); }

// ───────────────────────────── 10. UI & FLOW ───────────────────────
const RECIPE_LABEL = { PLAIN: 'PLAIN', SILKEN: 'SILKEN', FIRM: 'FIRM', FRIED: 'FRIED', FROZEN: 'FROZEN', SOY: 'SOY DARK', STINKY: 'STINKY', RINSE: 'RINSE' };
let lastChips = '', lastState = '', lastTags = '';
function hud() {
  if (mode !== 'play' && mode !== 'served') { hudEl.classList.add('hidden'); return; } hudEl.classList.remove('hidden');
  const st = stateLabel(); if (st.main !== lastState) { el.stateMain.textContent = st.main; lastState = st.main; }
  const tg = st.tags.join(' · '); if (tg !== lastTags) { el.stateTags.textContent = tg; lastTags = tg; }
  el.barFirm.style.width = (P.f * 100) + '%';
  const flav = [['SOY', P.soy, '#4a2a12'], ['STINK', P.stink, '#7fbf5f'], ['HEAT', P.heat, '#ff7a1e'], ['COLD', P.cold, '#aadcff']].sort((a, b) => b[1] - a[1])[0];
  el.barFlav.style.width = (clamp(flav[1], 0, 1) * 100) + '%'; el.barFlav.style.background = flav[2]; el.barFlavLabel.textContent = flav[1] > 0.02 ? flav[0] : 'FLAVOR';
  const rc = recipeCheck(); const html = rc.items.map(i => `<span class="chip ${i.ok ? 'ok' : i.r === 'RINSE' ? 'bad' : ''}">${RECIPE_LABEL[i.r]}${i.ok ? '' : ' ·'}</span>`).join('');
  if (html !== lastChips) { el.chips.innerHTML = html; lastChips = html; }
}
function recipeChips(L) { return L.recipe.map(r => `<span class="chip">${RECIPE_LABEL[r]}</span>`).join(''); }
function showTitle() {
  mode = 'title'; overlay.classList.remove('hidden'); if (!world) loadLevel(0);
  const wm = spr('wordmark') ? `<img class="wordmark" src="${assetUrl('wordmark')}" alt="TOFU">` : `<div class="blob"></div><h1>TOFU</h1>`;
  card.innerHTML = `<div class="eyebrow">LUCID WINDS · TEST KITCHEN</div>${wm}
    <p class="tag">You have no properties of your own.<br>You become what you soak in.</p>
    <p class="sub">Every level is a recipe. You are the ingredient.</p>
    <div class="grid">${LEVELS.map((L, i) => { const locked = i > progress && !DEV; const done = i < progress; return `<button class="dishBtn ${locked ? 'locked' : ''} ${done ? 'done' : ''}" data-act="pick" data-i="${i}" ${locked ? 'disabled' : ''}><b>${L.dish}${locked ? ' · LOCKED' : ''}</b><span>arrive: ${L.recipe.map(r => RECIPE_LABEL[r]).join(' + ')}</span>${best[i] ? `<em>best ${best[i]}s</em>` : ''}</button>`; }).join('')}</div>
    <div class="row"><button class="act" data-act="pick" data-i="${Math.min(progress, LEVELS.length - 1)}">${progress ? 'CONTINUE' : 'START'}</button><button class="act ghost" data-act="mute">${muted ? 'SOUND OFF' : 'SOUND ON'}</button></div>
    <p class="land">Best played sideways. Turn your phone for a wider kitchen.</p>
    <p class="foot">Touch: drag on the left side to move, tap JUMP, hold SQUEEZE.<br>Keys: arrows or A and D to move, space to jump, S to squeeze, R to restart, M to mute.</p>`;
}
function showRecipe(i) {
  mode = 'card'; cardLevel = i; loadLevel(i); overlay.classList.remove('hidden'); const L = LEVELS[i];
  card.innerHTML = `<div class="eyebrow">TONIGHT'S DISH · ${i + 1} / ${LEVELS.length}</div><h2>${L.dish}</h2><p class="sub">${L.sub}</p>
    <div class="chips"><span class="chip" style="opacity:.6;border:0">ARRIVE</span>${recipeChips(L)}</div>
    <div class="hint">${L.hint}</div>
    <div class="row"><button class="act" data-act="start">COOK</button><button class="act ghost" data-act="title">MENU</button></div>`;
}
function showServed() {
  overlay.classList.remove('hidden'); const L = world.L, st = stateLabel();
  card.innerHTML = `<div class="eyebrow">SERVED</div><h2>${L.dish}</h2>
    <div class="chips">${recipeChips(L)}</div>
    <p class="stats">Arrived ${st.main}${st.tags.length ? ' · ' + st.tags.join(' · ') : ''}<br>${levelTime.toFixed(1)}s · ${deaths} respawn${deaths === 1 ? '' : 's'}${best[world.idx] && best[world.idx] < +levelTime.toFixed(1) ? ` · best ${best[world.idx]}s` : ' · new best'}</p>
    <div class="row">${world.idx + 1 < LEVELS.length ? `<button class="act" data-act="next">NEXT DISH</button>` : `<button class="act" data-act="title">THAT'S THE MENU</button>`}<button class="act ghost" data-act="restart">AGAIN</button><button class="act ghost" data-act="title">MENU</button></div>`;
}
function showPaused() {
  mode = 'paused'; overlay.classList.remove('hidden'); input.press = false; stick.id = null;
  card.innerHTML = `<div class="eyebrow">PAUSED</div><h2>${world.L.dish}</h2><div class="chips">${recipeChips(world.L)}</div><div class="hint">${world.L.hint}</div>
    <div class="row"><button class="act" data-act="resume">RESUME</button><button class="act ghost" data-act="restart">RESTART</button><button class="act ghost" data-act="mute">${muted ? 'SOUND OFF' : 'SOUND ON'}</button><button class="act ghost" data-act="title">MENU</button></div>`;
}
function refreshCard() { if (mode === 'title') showTitle(); else if (mode === 'paused') showPaused(); }
function startLevel(i) { loadLevel(i); mode = 'play'; overlay.classList.add('hidden'); lastChips = lastState = lastTags = ''; el.dishName.textContent = LEVELS[i].dish; el.dishSub.textContent = 'arrive: ' + LEVELS[i].recipe.map(r => RECIPE_LABEL[r]).join(' + '); showHint(LEVELS[i].hint); }
function restartLevel() { startLevel(world.idx); }
function nextLevel() { if (world.idx + 1 < LEVELS.length) showRecipe(world.idx + 1); else showTitle(); }
function resume() { mode = 'play'; overlay.classList.add('hidden'); }
let hintTimer = 0;
function showHint(t) { hintEl.textContent = t; hintEl.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => hintEl.classList.remove('show'), 7000); }
overlay.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return; SFX.unlock();
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'pick') { if (i <= progress || DEV) showRecipe(i); }
  else if (act === 'start') startLevel(cardLevel); else if (act === 'title') showTitle(); else if (act === 'next') nextLevel();
  else if (act === 'resume') resume(); else if (act === 'restart') restartLevel(); else if (act === 'mute') { toggleMute(); refreshCard(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') showPaused(); });

// PWA: manifest.webmanifest beside the page; the service worker is network first (sw.js)
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=1').catch(() => {}); } catch (e) {}

// ───────────────────────────── LOOP ────────────────────────────────
const STEP = 1 / 120; let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  animT += dt; pollInput();
  if (mode === 'play') { acc += dt; let n = 0; while (acc >= STEP && n++ < 8) { step(STEP); acc -= STEP; } }
  updateParts(dt); draw(dt); hud();
}
addEventListener('resize', () => { resize(); if (world) layout(null); });
resize(); loadAssets();
if (qs.has('level')) { const i = clamp(+qs.get('level') || 0, 0, LEVELS.length - 1); showRecipe(i); } else showTitle();
requestAnimationFrame(frame);

// Debug / team hook: open the console and poke at TOFU.P, TOFU.CFG, TOFU.go(3)
window.TOFU = { CFG, LEVELS, P, get world() { return world; }, input, step, frame, loadLevel, startLevel, go: i => startLevel(i), get mode() { return mode; }, set mode(m) { mode = m; }, recipeCheck, stateLabel };
})();
</script>
