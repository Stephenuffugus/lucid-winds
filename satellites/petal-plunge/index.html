<style>
  :root{
    --bg:#0d100c; --bg2:#141a10; --ink:#ece3d1; --ink-dim:#9aa585; --ink-faint:#5f6a4e;
    --line:#20261a; --line2:#2e3722; --sage:#7ab356; --gold:#c8a84b; --rose:#e07a9a;
    --good:#8fd08a; --warn:#e6c766; --bad:#e07a6a; --coin:#e9c46a; --sky:#8fb6d8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Hanken Grotesk',system-ui,sans-serif; overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none;}
  #app{position:fixed; inset:0; overflow:hidden;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:auto;}

  /* ---- overlays ---- */
  .scr{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding:calc(env(safe-area-inset-top,0) + 18px) 16px calc(env(safe-area-inset-bottom,0) + 18px);
    overflow-y:auto; overscroll-behavior:contain; z-index:10; background:radial-gradient(120% 80% at 50% -10%, rgba(28,40,20,.55), rgba(8,10,7,.92) 70%);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);}
  .scr.hidden{display:none;}
  .brand{font-family:'Instrument Serif',serif; letter-spacing:.5px; line-height:.96; text-align:center;}
  .title-1{font-size:clamp(38px,13vw,72px); color:var(--ink); margin-top:6vh;
    text-shadow:0 2px 0 rgba(0,0,0,.4), 0 0 40px rgba(122,179,86,.18);}
  .title-2{font-size:clamp(38px,13vw,72px); color:var(--sage); font-style:italic; margin-top:-.16em;}
  .tag{color:var(--ink-dim); font-size:clamp(12px,3.6vw,15px); max-width:22em; text-align:center;
    margin:14px auto 0; line-height:1.4;}
  .spacer{flex:1 1 auto; min-height:10px;}

  .btn{appearance:none; border:1px solid var(--line2); background:linear-gradient(180deg,#1b2415,#141a10);
    color:var(--ink); font-family:'Hanken Grotesk',sans-serif; font-weight:700; font-size:16px;
    padding:14px 20px; border-radius:14px; min-height:52px; min-width:132px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .08s, border-color .2s, background .2s;
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);}
  .btn:active{transform:translateY(1px) scale(.985);}
  .btn.primary{background:linear-gradient(180deg,#93c96a,#5f9a3e); color:#10160c; border-color:#a6d97f;
    box-shadow:0 3px 0 #3d6a26, 0 6px 18px rgba(122,179,86,.28);}
  .btn.gold{background:linear-gradient(180deg,#e0c268,#b8943c); color:#241a06; border-color:#efd589;
    box-shadow:0 3px 0 #7d631f;}
  .btn.ghost{background:rgba(20,26,16,.5); border-color:var(--line);}
  .btn.sm{min-height:44px; min-width:44px; font-size:14px; padding:10px 14px; border-radius:11px;}
  .btn.wide{width:min(340px,86vw);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn .k{font-family:'JetBrains Mono',monospace; font-size:12px; opacity:.7;}

  .col{display:flex; flex-direction:column; align-items:center; gap:11px; width:100%;}
  .row{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .card{background:rgba(16,20,12,.72); border:1px solid var(--line2); border-radius:16px; padding:16px;
    width:min(420px,92vw);}
  .h{font-family:'Instrument Serif',serif; font-size:26px; color:var(--gold); text-align:center;}
  .sub{color:var(--ink-dim); font-size:13px; text-align:center; margin-top:2px;}

  /* wallet chip */
  .wallet{display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.35);
    border:1px solid var(--line2); border-radius:999px; padding:7px 13px; font-weight:800;
    font-family:'JetBrains Mono',monospace; font-size:15px;}
  .wallet .pico{width:16px; height:16px;}

  /* mode grid */
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:11px; width:min(420px,92vw);}
  .mode{position:relative; border:1px solid var(--line2); border-radius:16px; padding:14px 13px;
    background:linear-gradient(180deg,rgba(28,38,20,.6),rgba(14,18,11,.7)); cursor:pointer; text-align:left;
    min-height:96px; display:flex; flex-direction:column; gap:3px; overflow:hidden; transition:transform .08s,border-color .2s;}
  .mode:active{transform:scale(.98);}
  .mode .mi{font-size:24px;}
  .mode .mn{font-weight:800; font-size:16px;}
  .mode .md{font-size:11.5px; color:var(--ink-dim); line-height:1.3;}
  .mode .best{position:absolute; top:9px; right:11px; font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--gold);}
  .mode.locked{opacity:.55;}

  /* shop */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:2px 0 12px;}
  .tab{border:1px solid var(--line2); background:rgba(20,26,16,.5); color:var(--ink-dim);
    border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; min-height:44px;}
  .tab.on{background:var(--sage); color:#10160c; border-color:var(--sage);}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(460px,94vw);}
  @media(max-width:360px){ .grid{grid-template-columns:repeat(2,1fr);} }
  .item{position:relative; border:1px solid var(--line2); border-radius:14px; background:rgba(14,18,11,.7);
    padding:8px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    transition:transform .08s,border-color .2s; min-height:118px;}
  .item:active{transform:scale(.97);}
  .item.owned{border-color:#3a5a28;}
  .item.equipped{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 0 16px rgba(200,168,75,.2);}
  .item cv, .item canvas{width:64px; height:64px;}
  .item .nm{font-size:11px; font-weight:700; text-align:center; line-height:1.1;}
  .item .pr{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--coin); display:flex; align-items:center; gap:3px;}
  .item .pr.own{color:var(--good);}
  .item .pr.eq{color:var(--gold);}
  .item .lockmsg{font-size:9.5px; color:var(--ink-faint); text-align:center; line-height:1.15;}
  .item .tierdot{position:absolute; top:6px; left:6px; width:8px; height:8px; border-radius:50%;}

  /* HUD */
  #hud{position:absolute; inset:0; pointer-events:none; z-index:5; font-family:'JetBrains Mono',monospace;}
  #hud .top{position:absolute; top:calc(env(safe-area-inset-top,0) + 8px); left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start; padding:0 12px;}
  .hstat{background:rgba(8,10,7,.5); border:1px solid rgba(122,179,86,.2); border-radius:10px; padding:5px 10px;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
  .hstat .lb{font-size:9px; color:var(--ink-dim); letter-spacing:1px;}
  .hstat .vl{font-size:19px; font-weight:800; color:var(--ink); line-height:1;}
  .hstat .vl.gold{color:var(--gold);} .hstat .vl.rose{color:var(--rose);}
  #comboWrap{position:absolute; top:calc(env(safe-area-inset-top,0) + 62px); left:0; right:0; text-align:center;}
  #combo{display:inline-block; font-size:15px; font-weight:800; color:var(--gold); opacity:0; transition:opacity .2s;
    text-shadow:0 1px 3px #000;}
  #gnomebar{position:absolute; top:calc(env(safe-area-inset-top,0) + 40px); left:50%; transform:translateX(-50%);
    width:min(320px,70vw); height:0; opacity:0; transition:opacity .3s;}
  #gnomebar.show{height:auto; opacity:1;}
  #gnomebar .track{height:9px; background:rgba(0,0,0,.5); border:1px solid rgba(224,122,106,.4); border-radius:6px; overflow:hidden;}
  #gnomebar .fill{height:100%; background:linear-gradient(90deg,#e0c268,#e07a6a); width:100%; transition:width .12s linear;}
  #gnomebar .lb{font-size:9px; text-align:center; color:var(--bad); letter-spacing:1px; margin-bottom:2px;}
  #pauseBtn{position:absolute; top:calc(env(safe-area-inset-top,0) + 8px); left:50%; transform:translateX(-50%);
    pointer-events:auto;}
  .toast{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-family:'Instrument Serif',serif;
    font-size:34px; color:var(--gold); opacity:0; text-shadow:0 2px 8px #000; text-align:center; white-space:nowrap;}

  /* control hint */
  #hint{position:absolute; bottom:calc(env(safe-area-inset-bottom,0) + 20px); left:0; right:0; text-align:center;
    color:var(--ink-dim); font-size:12px; z-index:6; pointer-events:none; opacity:.9;}
  .fade{transition:opacity .5s;}

  /* result squares */
  #resSquares{font-family:'JetBrains Mono',monospace; font-size:22px; line-height:1.25; letter-spacing:2px; text-align:center; margin:8px 0;}
  .exit{position:absolute; top:calc(env(safe-area-inset-top,0) + 10px); left:12px; z-index:12;}
  .link-btn{background:none; border:none; color:var(--ink-dim); font-size:13px; cursor:pointer; padding:8px; font-family:inherit;}
  .settingrow{display:flex; align-items:center; justify-content:space-between; width:100%; padding:9px 2px; border-bottom:1px solid var(--line);}
  .settingrow:last-child{border-bottom:none;}
  .sw{width:52px; height:30px; border-radius:999px; background:#20261a; border:1px solid var(--line2); position:relative; cursor:pointer; flex:0 0 auto;}
  .sw::before{content:''; position:absolute; inset:-8px;}   /* invisible 8px hit-slop → 46px tap target, pill stays slim (44px touch floor) */
  .sw .kn{position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--ink-faint); transition:left .15s,background .15s;}
  .sw.on{background:#3a5a28; border-color:var(--sage);} .sw.on .kn{left:24px; background:var(--sage);}
  .tut{max-width:24em; color:var(--ink-dim); font-size:13.5px; line-height:1.5; text-align:left;}
  .tut b{color:var(--ink);} .tut .em{color:var(--sage);}
  .medal{font-size:40px;}
  .newbadge{display:inline-block; background:var(--rose); color:#180a10; font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; vertical-align:middle; margin-left:6px;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div class="exit"><button class="link-btn" id="exitLink">← All Sky Wolf games</button></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="top">
      <div class="hstat"><div class="lb">DEPTH</div><div class="vl" id="hDepth">0</div></div>
      <div style="text-align:right"><div class="hstat" style="display:inline-block"><div class="lb">PETALS</div><div class="vl gold" id="hCoins">0</div></div></div>
    </div>
    <div id="gnomebar"><div class="lb" id="gnomeLb">THE GNOME</div><div class="track"><div class="fill" id="gnomeFill"></div></div></div>
    <button class="btn sm ghost" id="pauseBtn">❚❚</button>
    <div id="comboWrap"><span id="combo"></span></div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="hint" class="hidden"></div>

  <!-- screens injected/toggled by JS -->
  <div id="scrTitle" class="scr"></div>
  <div id="scrModes" class="scr hidden"></div>
  <div id="scrShop" class="scr hidden"></div>
  <div id="scrDaily" class="scr hidden"></div>
  <div id="scrSettings" class="scr hidden"></div>
  <div id="scrPause" class="scr hidden"></div>
  <div id="scrOver" class="scr hidden"></div>
  <div id="scrTut" class="scr hidden"></div>
</div>

<script>
"use strict";
(function(){
/* ══════════════════════════════════════════════════════════════════════════
   PETAL PLUNGE — a botanical SkiFree.  Sky Wolf Studios / Lucid Winds.
   Single-file canvas game. All art is procedural and lives behind ART.*
   hooks so hand-painted PNGs can drop in later (see ASSET_LIST.md).
   ════════════════════════════════════════════════════════════════════════ */

/* ---------- tiny DOM helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
var TAU=Math.PI*2;

/* ══════════════════════════════════════════════════════════════════════════
   CONFIG — every tunable in one place (see DESIGN_SPEC.md for rationale)
   ════════════════════════════════════════════════════════════════════════ */
var CFG={
  baseSpeed: 168,        // world units/sec at heading straight-down, biome 0
  speedRamp: 0.020,      // +fraction of baseSpeed per 1000 depth
  speedMax: 2.35,        // cap as a multiple of baseSpeed
  maxAng: 78*Math.PI/180,// full-sideways heading angle
  turnRate: 5.2,         // heading units eased per sec while holding a side
  tuckBoost: 1.28,       // downhill speed mult while tucking
  tuckSteerCap: 1.5,     // |head| clamp while tucking (can't hard-carve tucked)
  crashStun: 0.58,       // seconds stunned after a crash
  crashSpeed: 0.34,      // fraction of speed retained right after a crash
  playerR: 16,           // collision radius (world units)
  jumpBase: 0.62,        // base airtime seconds off a ramp
  jumpSpeedK: 0.0016,    // extra airtime per unit speed
  gnomeStart: 2000,      // depth the Gnome wakes in Free/Daily
  gnomeBaseK: 0.94,      // gnome speed as fraction of clean straight speed (margin so a followed lane still outruns it)
  gnomeGapStart: 640,    // gap (world units) when the Gnome wakes
  gnomeGapMax: 940,      // rubber-band ceiling
  gnomeCrashLoss: 118,   // gap lost per crash while chase active
  gnomeEscapeMult: 2.0,  // score mult granted on an escape
  laneMinFrac: 0.33,     // guaranteed clear-lane width as frac of play width
  laneDriftMax: 0.34,    // how far (frac) the safe lane can sit off-centre
};

/* biomes — depth bands change look + hazard. Each defines palette + density. */
var BIOMES=[
  {id:"meadow",   name:"Sunny Meadow",   from:0,    sky:["#bfe0ee","#9fcf9a"], ground:"#7cae54", ground2:"#6fa049", accent:"#e6c95f", fog:0.0,  density:0.62, speed:1.00, obst:["bush","stone","daisyclump","stump"]},
  {id:"bramble",  name:"Bramblewood",    from:900,  sky:["#8fb0a6","#6e8a5f"], ground:"#5e7f43", ground2:"#547239", accent:"#c98b4b", fog:0.06, density:0.80, speed:1.06, obst:["tree","thorn","log","stone"]},
  {id:"mushroom", name:"Mushroom Hollow",from:2000, sky:["#6a5f86","#4b4368"], ground:"#4a3f63", ground2:"#413757", accent:"#d98fc4", fog:0.16, density:0.72, speed:1.02, obst:["shroom","bigshroom","stone","thorn"], bounce:"bigshroom"},
  {id:"thorn",    name:"Thornfall Ridge",from:3300, sky:["#5a4b4b","#3a2f2f"], ground:"#4d4038", ground2:"#443831", accent:"#e0a06a", fog:0.10, density:0.90, speed:1.14, obst:["boulder","tree","thorn","log","stone"]},
  {id:"night",    name:"Nightgarden",    from:4800, sky:["#171b30","#0d1020"], ground:"#1b2438", ground2:"#161d2e", accent:"#7fd0c0", fog:0.22, density:0.86, speed:1.10, obst:["glowtree","thorn","boulder","glowstone"], glow:true}
];
function biomeAt(depth){var b=BIOMES[0]; for(var i=0;i<BIOMES.length;i++){ if(depth>=BIOMES[i].from) b=BIOMES[i]; } return b;}
function biomeIndexAt(depth){var k=0; for(var i=0;i<BIOMES.length;i++){ if(depth>=BIOMES[i].from) k=i; } return k;}

/* ══════════════════════════════════════════════════════════════════════════
   COSMETIC CATALOG — riders, sleds, trails, skies.
   cost 0 = default (owned). unlock:"m:<id>" = milestone-locked (not buyable).
   Every draw lives in ART.rider/sled/trail/sky hooks (below).
   ════════════════════════════════════════════════════════════════════════ */
var TIERS={common:"#8a9178",uncommon:"#7ab356",rare:"#5aa9d0",epic:"#b07ad0",legend:"#e0b23c"};
var CATALOG={
  rider:[
    {id:"sprout",  name:"Sprout",     cost:0,   tier:"common"},
    {id:"acorn",   name:"Acorn Kid",  cost:0,   tier:"common"},
    {id:"ladybug", name:"Ladybug",    cost:120, tier:"common"},
    {id:"bee",     name:"Bumblebee",  cost:160, tier:"uncommon"},
    {id:"snail",   name:"Snail",      cost:200, tier:"uncommon"},
    {id:"frog",    name:"Tree Frog",  cost:260, tier:"uncommon"},
    {id:"mouse",   name:"Field Mouse",cost:320, tier:"rare"},
    {id:"robin",   name:"Robin",      cost:380, tier:"rare"},
    {id:"foxkit",  name:"Fox Kit",    cost:520, tier:"rare"},
    {id:"firefly", name:"Firefly",    cost:640, tier:"epic"},
    {id:"mantis",  name:"Mantis",     cost:820, tier:"epic"},
    {id:"lumin",   name:"Luminমoth",  cost:0, unlock:"m:night1", tier:"legend"},
    {id:"gnomelet",name:"Gnomeling",  cost:0, unlock:"m:escape3", tier:"legend"}
  ],
  sled:[
    {id:"leaf",    name:"Leaf",       cost:0,   tier:"common"},
    {id:"petal",   name:"Rose Petal", cost:110, tier:"common"},
    {id:"bark",    name:"Bark Board", cost:150, tier:"uncommon"},
    {id:"lily",    name:"Lily Pad",   cost:210, tier:"uncommon"},
    {id:"cap",     name:"Mushroom Cap",cost:290,tier:"rare"},
    {id:"birch",   name:"Birch Curl", cost:360, tier:"rare"},
    {id:"husk",    name:"Seed Husk",  cost:470, tier:"epic"},
    {id:"shell",   name:"Snail Shell",cost:600, tier:"epic"},
    {id:"aurora",  name:"Auroraleaf", cost:0, unlock:"m:depth5k", tier:"legend"}
  ],
  trail:[
    {id:"dew",     name:"Dew Spray",  cost:0,   tier:"common"},
    {id:"pollen",  name:"Pollen Dust",cost:90,  tier:"common"},
    {id:"petals",  name:"Petal Fall", cost:170, tier:"uncommon"},
    {id:"frost",   name:"Frost Curl", cost:240, tier:"uncommon"},
    {id:"rainbow", name:"Rainbow Mist",cost:400,tier:"rare"},
    {id:"ember",   name:"Emberglow",  cost:520, tier:"epic"},
    {id:"star",    name:"Stardust",   cost:0, unlock:"m:style5k", tier:"legend"}
  ],
  sky:[
    {id:"auto",    name:"Biome (auto)",cost:0,  tier:"common"},
    {id:"dawn",    name:"Dawn",       cost:130, tier:"common"},
    {id:"dusk",    name:"Dusk",       cost:190, tier:"uncommon"},
    {id:"storm",   name:"Rainfall",   cost:260, tier:"uncommon"},
    {id:"aurora",  name:"Aurora",     cost:420, tier:"rare"},
    {id:"starry",  name:"Starfield",  cost:0, unlock:"m:daily7", tier:"legend"}
  ]
};
// fix a stray unicode gremlin defensively (name typed above must be clean ascii)
CATALOG.rider[11].name="Luminmoth";
function catItem(kind,id){var a=CATALOG[kind]; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return a[0];}

/* milestone labels for locked-item hints */
var MILE={
  night1:"Reach the Nightgarden",
  escape3:"Escape the Gnome 3×",
  depth5k:"Plunge 5000 deep",
  style5k:"Bank 5000 style in a run",
  daily7:"7-day Daily streak"
};

/* ══════════════════════════════════════════════════════════════════════════
   STORAGE — one JSON blob under pp_profile (game-local; never Sunbeams here)
   ════════════════════════════════════════════════════════════════════════ */
var PKEY="pp_profile_v1";
var DEF_PROFILE={
  coins:0,
  owned:{rider:{sprout:1,acorn:1}, sled:{leaf:1}, trail:{dew:1}, sky:{auto:1}},
  equip:{rider:"sprout", sled:"leaf", trail:"dew", sky:"auto"},
  records:{free:0, slalomBest:0, freestyle:0, freeCoins:0},
  daily:{date:"", best:0, streak:0, lastStreakDate:""},
  stats:{runs:0, escapes:0, deepestBiome:0, bestStyleRun:0, gates:0, tricks:0, crashes:0},
  ms:{},          // milestones achieved
  set:{sound:1, haptics:1, reduced:0},
  seenTut:0
};
var P;
function loadProfile(){
  try{ var raw=localStorage.getItem(PKEY); if(raw){ P=merge(clone(DEF_PROFILE), JSON.parse(raw)); return; } }catch(e){}
  P=clone(DEF_PROFILE);
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function merge(base,ext){ // shallow-deep merge so new default keys survive old saves
  for(var k in ext){ if(ext[k]&&typeof ext[k]==="object"&&!Array.isArray(ext[k])&&base[k]&&typeof base[k]==="object"){ merge(base[k],ext[k]); } else { base[k]=ext[k]; } }
  return base;
}
var _saveT=0;
function saveProfile(now){
  if(now){ try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){} return; }
  if(_saveT) return; _saveT=setTimeout(function(){_saveT=0; try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}},350);
}
function owns(kind,id){ var it=catItem(kind,id); if(it.cost===0&&!it.unlock) return true; return !!(P.owned[kind]&&P.owned[kind][id]); }
function grant(kind,id){ if(!P.owned[kind])P.owned[kind]={}; P.owned[kind][id]=1; }
function achieve(id){ if(P.ms[id])return false; P.ms[id]=1; saveProfile(); return true; }

/* ══════════════════════════════════════════════════════════════════════════
   RNG — mulberry32, seedable for the deterministic Daily Descent
   ════════════════════════════════════════════════════════════════════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dailySeed(){ var d=new Date(); var s=d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate(); return s>>>0; }
function dailyKey(){ var d=new Date(); return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate(); }

/* ══════════════════════════════════════════════════════════════════════════
   AUDIO — WebAudio synth SFX (no assets). Guarded; respects set.sound.
   ════════════════════════════════════════════════════════════════════════ */
var AC=null;
function actx(){ if(!P.set.sound) return null; if(AC) return AC; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } return AC; }
function beep(freq,dur,type,gain,slideTo){
  var c=actx(); if(!c) return; try{
    var o=c.createOscillator(), g=c.createGain(); o.type=type||"sine"; o.frequency.value=freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), c.currentTime+dur);
    g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(gain||0.14, c.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.02);
  }catch(e){}
}
function noise(dur,gain,filtF){
  var c=actx(); if(!c) return; try{
    var n=c.createBufferSource(), b=c.createBuffer(1, Math.floor(c.sampleRate*dur), c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    n.buffer=b; var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filtF||900;
    var g=c.createGain(); g.gain.value=gain||0.12; g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    n.connect(f); f.connect(g); g.connect(c.destination); n.start(); n.stop(c.currentTime+dur+0.02);
  }catch(e){}
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1, 2.5);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.floor(VW*DPR); cv.height=Math.floor(VH*DPR);
  cv.style.width=VW+"px"; cv.style.height=VH+"px";
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){ setTimeout(resize,120); });

    shield:0, boostT:0, magnetT:0, flashT:0,
    coins:0, style:0, gates:0, gateStreak:0, tricks:0, crashes:0,
    combo:0, comboT:0, bestCombo:0,
    obs:[], pk:[], gt:[], part:[], floats:[], laneHist:[],
    genY:0, laneC:0, laneTarget:0, laneW:0,
    rng:mulberry32(seed), seed:seed,
    gnomeActive:false, gnomeGap:CFG.gnomeGapMax, gnomeEscapes:0, gnomeWarned:false, gnomeSpeedK:CFG.gnomeBaseK,
    scoreMult:1, biomeIdx:0, tHud:0,
    startMs:0, gameT:0, timeMs:0, penaltyMs:0, gatesTotal:0, gatesHit:0,
    hintT:4
  };
  S.laneW = Math.max(CFG.laneMinFrac*VW, CFG.playerR*4.2);
  generateUntil(VH*1.4);
  P.stats.runs++; saveProfile();
  showGame();
  S.startMs = perfNow();
  lastT=0; if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}
function perfNow(){ return (window.performance&&performance.now)?performance.now():(+new Date()); }

/* ══════════════════════════════════════════════════════════════════════════
   WORLD GENERATION — the safe-lane guarantee.
   A clear corridor of width laneW always exists; obstacles only spawn OUTSIDE
   it. The lane centre drifts slowly enough that a player can always follow it
   (max required |dx/dy| ≪ tan(maxAng)). => every slope is provably passable.
   ════════════════════════════════════════════════════════════════════════ */
var SEG=44;
function generateUntil(targetY){
  var mc=S.mc, hw=halfW();
  while(S.genY < targetY){
    var y0=S.genY, y1=S.genY+SEG;
    // stop generating obstacles past a finite course finish line (leave a clean run-out)
    var pastFinish = (mc.len!==Infinity && y0 > mc.len);
    // drift the safe lane
    var laneRange=hw*0.62;
    if(S.laneTarget===0 && S.genY===0){ S.laneC=0; S.laneTarget=0; }
    // re-pick a target every ~4 segments
    if(((S.genY/SEG)|0)%4===0){ S.laneTarget = (S.rng()*2-1)*laneRange; }
    var laneStep = clamp((S.laneTarget - S.laneC), -SEG*0.22, SEG*0.22); // bounded slope: following it stays above gnome speed (cos(atan .22)=.976 > gnomeBaseK)
    S.laneC = clamp(S.laneC + laneStep, -laneRange, laneRange);
    var midY=(y0+y1)/2;
    var b=biomeAt(midY);
    var laneHalf=S.laneW/2;
    S.laneHist.push({y0:y0,y1:y1,c:S.laneC,w:S.laneW});

    if(!pastFinish){
      // obstacles
      var dens = b.density * mc.density * (1 + midY/12000); // slowly denser with depth
      var tries = Math.round(dens*2.4);
      for(var i=0;i<tries;i++){
        if(S.rng() > dens) continue;
        var ox=(S.rng()*2-1)*hw;
        if(Math.abs(ox - S.laneC) < laneHalf + 26) continue;      // keep the corridor clear
        var oy=y0 + S.rng()*SEG;
        var kind=b.obst[(S.rng()*b.obst.length)|0];
        var r=obsRadius(kind);
        // don't stack obstacles too tightly (readability)
        if(tooClose(ox,oy,r+10)) continue;
        var type = (b.bounce&&kind===b.bounce)?"bounce":"solid";
        S.obs.push({x:ox,y:oy,r:r,kind:kind,type:type,spin:S.rng()*TAU});
      }
      // ramps (launch pads) near-ish the lane so they're catchable
      if(S.rng() < mc.ramp*SEG){
        var rx=S.laneC + (S.rng()*2-1)*(laneHalf+40);
        rx=clamp(rx,-hw,hw);
        S.obs.push({x:rx,y:y0+S.rng()*SEG,r:24,kind:"ramp",type:"ramp",spin:0});
      }
      // gates
      if(S.rng() < mc.gate*SEG){
        var gh=Math.max(30, laneHalf*0.9);
        S.gatesTotal++;
        S.gt.push({x:S.laneC,y:y0+SEG*0.5,half:gh,got:false,missed:false});
      }
      // coins — a little string along the lane
      if(S.rng() < 0.5){
        var n=1+((S.rng()*3)|0);
        for(var c=0;c<n;c++){
          S.pk.push({x:S.laneC+(S.rng()*2-1)*laneHalf*0.7, y:y0+ (c+0.5)/n*SEG, r:11, kind:"coin", got:false});
        }
      }
      // powerups (rare). Lantern only surfaces once the chase is on.
      if(S.rng() < 0.020){
        var pk = powerupRoll(midY);
        if(pk) S.pk.push({x:clamp(S.laneC+(S.rng()*2-1)*80,-hw,hw), y:y0+S.rng()*SEG, r:15, kind:pk, got:false});
      }
      // mercy lantern — when the Gnome is genuinely closing, guarantee an escape
      // valve appears on the lane ahead so a clean player is never slow-killed.
      if(S.gnomeActive && S.gnomeGap<270 && S.rng()<0.11){
        S.pk.push({x:clamp(S.laneC+(S.rng()*2-1)*40,-hw,hw), y:y0+S.rng()*SEG, r:15, kind:"lantern", got:false, mercy:true});
      }
    }
    S.genY = y1;
  }
}
function powerupRoll(y){
  var r=S.rng();
  if(S.gnomeActive){ if(r<0.42) return "lantern"; if(r<0.6) return "boost"; if(r<0.78) return "shield"; return "magnet"; }
  if(r<0.34) return "boost"; if(r<0.6) return "shield"; if(r<0.85) return "magnet"; return "boost";
}
function obsRadius(kind){
  switch(kind){ case "bigshroom":return 30; case "boulder":return 30; case "tree":case "glowtree":return 22;
    case "log":return 24; case "shroom":return 16; case "thorn":return 17; case "stump":return 15;
    case "daisyclump":return 13; case "stone":case "glowstone":return 14; case "bush":return 18; default:return 16; }
}
function tooClose(x,y,d){
  for(var i=S.obs.length-1;i>=0 && i>S.obs.length-14;i--){ var o=S.obs[i]; if(Math.abs(o.y-y)<d && Math.abs(o.x-x)<d) return true; }
  return false;
}

/* ══════════════════════════════════════════════════════════════════════════
   UPDATE
   ════════════════════════════════════════════════════════════════════════ */
function speedScale(){ return Math.min(CFG.speedMax, 1 + S.depth/4500); }
function cleanSpeed(){ var b=biomeAt(S.depth); return CFG.baseSpeed*b.speed*speedScale(); }

function update(dt){
  if(S.paused||S.over) return;
  var b=biomeAt(S.depth); S.biomeIdx=biomeIndexAt(S.depth);
  if(S.biomeIdx>P.stats.deepestBiome){ P.stats.deepestBiome=S.biomeIdx; if(S.biomeIdx>=4) achieve("night1"); }
  S.tHud+=dt; S.gameT+=dt;
  if(S.hintT>0) S.hintT-=dt;

  // timers
  if(S.boostT>0)S.boostT-=dt; if(S.magnetT>0)S.magnetT-=dt; if(S.flashT>0)S.flashT-=dt;
  if(S.comboT>0){ S.comboT-=dt; if(S.comboT<=0){ S.combo=0; } }

  var spd=cleanSpeed();

  if(S.stun>0){
    S.stun-=dt; S.tumble+=dt*14;
    S.head+=(0-S.head)*Math.min(1,dt*8); S.headTarget=0;
    S.vy=spd*CFG.crashSpeed; S.vx*=0.86;
  } else if(S.airborne){
    S.airT+=dt;
    // gentle air steering
    if(S.steer!==0){ S.headTarget=clamp(S.headTarget+S.steer*CFG.turnRate*0.5*dt,-3,3); }
    S.head+=(S.headTarget-S.head)*Math.min(1,dt*7);
    S.vy=S.launchVy;
    S.vx=spd*Math.sin(S.head/3*CFG.maxAng)*0.7;
    if(S.airT>=S.airDur){ landing(); }
  } else {
    // steering
    if(S.steer!==0){
      var cap = S.tuck? CFG.tuckSteerCap : 3;
      S.headTarget=clamp(S.headTarget+S.steer*CFG.turnRate*dt, -cap, cap);
    }
    if(S.tuck) S.headTarget=clamp(S.headTarget,-CFG.tuckSteerCap,CFG.tuckSteerCap);
    S.head+=(S.headTarget-S.head)*Math.min(1,dt*10);
    var a=S.head/3*CFG.maxAng;
    var boost=(S.boostT>0?1.35:1)*(S.tuck?CFG.tuckBoost:1);
    S.vy=spd*Math.cos(a)*boost;
    S.vx=spd*Math.sin(a)*(S.boostT>0?1.2:1);
  }

  // integrate
  S.depth+=S.vy*dt; S.x+=S.vx*dt;
  var hw=halfW();
  if(S.x<-hw){ S.x=-hw; S.vx=0; S.headTarget*=0.3; }
  if(S.x> hw){ S.x= hw; S.vx=0; S.headTarget*=0.3; }
  cam.y=S.depth - VH*PLAYER_ANCHOR;

  // extend world
  generateUntil(cam.y+VH*1.5);
  pruneBehind();

  // trail particles — painted swoosh streams the whole descent; the procedural circle spray only on a hard carve/boost
  if(!S.airborne && S.stun<=0){ spawnTrail(Math.abs(S.vx)>spd*0.3 || S.boostT>0); }
  updateParticles(dt);
  updateFloats(dt);

  // collisions & pickups
  collide();

  // gnome
  updateGnome(dt,spd);

  // combo timeout housekeeping already above; track best
  if(S.combo>S.bestCombo)S.bestCombo=S.combo;

  // finite-course finish
  if(S.mc.len!==Infinity && S.depth>=S.mc.len && !S.finished){ finishCourse(); }
}

function landing(){
  S.airborne=false; SFX.land();
  if(S.trickCount>0){
    var pts=Math.round(60*S.airDur*(1+0.6*S.trickCount)*(1+0.08*S.combo));
    S.style+=pts; S.tricks+=S.trickCount; P.stats.tricks+=S.trickCount;
    addCombo(1);
    var word=S.trickCount>=4?"HUGE!":S.trickCount>=2?"SWEET!":"NICE!";
    floater(word+" +"+pts, "#c8a84b", true);
    if(S.style>=5000) achieve("style5k");
    if(S.style>P.stats.bestStyleRun){P.stats.bestStyleRun=S.style;}
  }
  // landing on an obstacle = crash
  var o=obstacleAt(S.x,S.depth, CFG.playerR*0.8);
  if(o && o.type==="solid"){ crash(o); }
  S.spin=0; S.trickCount=0;
}
function doTrick(){
  if(!S.airborne) return;
  S.trickCount++; S.spin+=1; SFX.trick(); haptic(6);
}
function obstacleAt(x,y,pad){
  for(var i=0;i<S.obs.length;i++){ var o=S.obs[i]; if(Math.abs(o.y-y)>o.r+pad) continue; var dx=o.x-x,dy=(o.y-y); if(dx*dx+dy*dy < (o.r+pad)*(o.r+pad)) return o; }
  return null;
}
function collide(){
  var px=S.x, py=S.depth, pr=CFG.playerR;
  for(var i=0;i<S.obs.length;i++){
    var o=S.obs[i]; if(o.dead) continue;
    if(Math.abs(o.y-py)>o.r+pr+4) continue;
    var dx=o.x-px, dy=o.y-py, d2=dx*dx+dy*dy, rs=o.r+pr;
    if(d2 < rs*rs*0.82){
      if(o.type==="ramp"){ if(!S.airborne&&S.stun<=0){ launch(0.10); o.dead=true; } }
      else if(o.type==="bounce"){ if(!S.airborne&&S.stun<=0){ launch(0.34); SFX.power(); o.hit=0.2; } }
      else { // solid
        if(!S.airborne && S.stun<=0){ crash(o); }
      }
    }
  }
  // pickups
  for(var j=0;j<S.pk.length;j++){
    var p=S.pk[j]; if(p.got) continue;
    var mx=p.x-px, my=p.y-py;
    // magnet pull for coins
    if(p.kind==="coin" && S.magnetT>0){ var md=Math.sqrt(mx*mx+my*my); if(md<170){ p.x-=mx*0.16; p.y-=my*0.16; } }
    if(Math.abs(p.y-py)>p.r+pr+2) continue;
    if(mx*mx+my*my < (p.r+pr)*(p.r+pr)){ collect(p); }
  }
  // gates
  for(var k=0;k<S.gt.length;k++){
    var gt=S.gt[k]; if(gt.got||gt.missed) continue;
    if(py > gt.y){ // just passed this gate's line
      if(Math.abs(px-gt.x) < gt.half){ gt.got=true; onGate(); }
      else { gt.missed=true; onGateMiss(); }
    }
  }
}
function launch(power){
  S.airborne=true; S.airT=0; S.airDur=CFG.jumpBase + cleanSpeed()*CFG.jumpSpeedK + power*1.4;
  S.launchVy=S.vy; S.trickCount=0; SFX.jump(); haptic(8);
}
function crash(o){
  if(S.shield>0){ S.shield--; S.flashT=0.3; SFX.power(); floater("SHIELD!","#8fd08a",false); if(o)o.dead=true; return; }
  SFX.crash(); haptic(24);
  S.stun=CFG.crashStun; S.tumble=0; S.crashes++; P.stats.crashes++;
  S.combo=0; S.gateStreak=0;
  if(S.gnomeActive){ S.gnomeGap=Math.max(0,S.gnomeGap-CFG.gnomeCrashLoss); }
  for(var i=0;i<10;i++){ S.part.push({x:S.x,y:S.depth,vx:(Math.random()*2-1)*120,vy:(Math.random()*2-1)*120-40,life:0.5,max:0.5,c:"#e8dcc8",r:3+Math.random()*3}); }
}
function collect(p){
  p.got=true;
  if(p.kind==="coin"){ var v=1; S.coins+=v; SFX.coin(); floaterAt(p.x,p.y,"+"+v,"#e9c46a"); }
  else if(p.kind==="boost"){ S.boostT=3.2; SFX.power(); floaterAt(p.x,p.y,"DEW BOOST","#8fd08a"); }
  else if(p.kind==="shield"){ S.shield=Math.min(2,S.shield+1); SFX.power(); floaterAt(p.x,p.y,"POLLEN SHIELD","#8fd08a"); }
  else if(p.kind==="magnet"){ S.magnetT=6; SFX.power(); floaterAt(p.x,p.y,"NECTAR MAGNET","#e6c95f"); }
  else if(p.kind==="lantern"){ escapeGnome(); floaterAt(p.x,p.y,"FIREFLY LANTERN","#fff4c0"); }
}
function onGate(){
  S.gates++; S.gatesHit++; P.stats.gates++; S.gateStreak++;
  var pts=8+S.gateStreak*2; S.style+=pts; S.coins+=1;
  addCombo(1); SFX.gate();
  if(S.gateStreak>0 && S.gateStreak%5===0) floater("GATE ×"+S.gateStreak,"#7ab356",false);
}
function onGateMiss(){ S.gateStreak=0; if(S.mode==="slalom"){ S.penaltyMs+=1500; floater("MISS +1.5s","#e07a6a",false); } }
function addCombo(n){ S.combo+=n; S.comboT=3.0; }

/* ---------- the Gnome ---------- */
function updateGnome(dt,spd){
  if(!S.mc.gnome) return;
  if(!S.gnomeActive){
    if(S.depth>=CFG.gnomeStart){ S.gnomeActive=true; S.gnomeGap=CFG.gnomeGapStart; SFX.gnome(); haptic(40);
      floater("THE GARDEN STIRS…","#e07a6a",false); }
    return;
  }
  var gs=spd*S.gnomeSpeedK;            // gnome runs at a fraction of clean straight-line speed
  S.gnomeGap += (S.vy - gs)*dt;
  S.gnomeGap = Math.min(CFG.gnomeGapMax, S.gnomeGap);
  if(S.gnomeGap<=0){ gobbled(); }
}
function escapeGnome(){
  if(!S.gnomeActive){ S.boostT=Math.max(S.boostT,3.2); SFX.power(); return; }
  S.gnomeGap=CFG.gnomeGapMax; S.gnomeEscapes++; P.stats.escapes++;
  S.gnomeSpeedK=Math.min(1.08, S.gnomeSpeedK+0.02);   // it comes back angrier — eventually outpaces even a clean line
  S.scoreMult=Math.min(4, +(S.scoreMult+0.5).toFixed(2));
  S.boostT=Math.max(S.boostT,2.4); S.flashT=0.4;
  SFX.escape(); haptic([12,30,12]);
  floater("ESCAPED! ×"+S.scoreMult.toFixed(1),"#7ab356",true);
  if(P.stats.escapes>=3) achieve("escape3");
}
function gobbled(){ endRun(true); }

/* ---------- particles & floaters ---------- */
function spawnTrail(spray){
  var tid=P.equip.trail;
  if(ART.get('trail_'+tid)){
    // painted swoosh ribbon: leave a fading world-space stamp every ~16px of descent; successive
    // stamps trace the carve and overlap into a continuous streak. Aligned to travel direction
    // (art's long axis is a ~-45° diagonal, so +PI/4 makes a straight-down run render vertical).
    if(S._lastStampY==null || S._lastStampY>S.depth) S._lastStampY=S.depth-999;
    if(S.depth - S._lastStampY >= 16){
      S._lastStampY=S.depth;
      S.part.push({x:S.x, y:S.depth-16, vx:0, vy:0, life:0.62, max:0.62, rot:Math.atan2(S.vy,S.vx)+Math.PI/4, stamp:true, tk:tid});
    }
    return;
  }
  if(!spray) return;   // no painted trail → keep the original circle spray, gated on carve/boost
  var cols=ART.trailColors(tid); var c=cols[(Math.random()*cols.length)|0];
  S.part.push({x:S.x-S.vx*0.02,y:S.depth-14,vx:-S.vx*0.15+(Math.random()*2-1)*20,vy:-30-Math.random()*30,life:0.5,max:0.5,c:c,r:2.5+Math.random()*2.5,trail:true});
}
function updateParticles(dt){
  for(var i=S.part.length-1;i>=0;i--){ var p=S.part[i]; p.life-=dt; if(p.life<=0){ S.part.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; if(!p.stamp) p.vy+=60*dt; }
}
function floater(text,color,big){ floaterAt(S.x,S.depth-30,text,color,big); }
function floaterAt(x,y,text,color,big){ S.floats.push({x:x,y:y,text:text,color:color,life:1.1,max:1.1,big:big}); }
function updateFloats(dt){ for(var i=S.floats.length-1;i>=0;i--){ var f=S.floats[i]; f.life-=dt; f.y-=26*dt; if(f.life<=0)S.floats.splice(i,1); } }

function pruneBehind(){
  var cut=cam.y-80;
  var a=S.obs; for(var i=a.length-1;i>=0;i--){ if(a[i].y<cut) a.splice(i,1); }
  var p=S.pk; for(var j=p.length-1;j>=0;j--){ if(p[j].y<cut) p.splice(j,1); }
  var t=S.gt; for(var k=t.length-1;k>=0;k--){ if(t[k].y<cut-40) t.splice(k,1); }
  var lh=S.laneHist; for(var q=lh.length-1;q>=0;q--){ if(lh[q].y1<cut-120) lh.splice(q,1); }
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════════ */
function hashCell(ix,iy){ var h=(ix*73856093 ^ iy*19349663)>>>0; h=(h^(h>>>13))*1274126177>>>0; return (h>>>0)/4294967296; }

function drawBackground(depth){
  var b=biomeAt(depth), sky;
  var skyId=(S? P.equip.sky : "auto");
  // painted biome backdrop (only when the player hasn't equipped a custom sky theme)
  var bgIm = (skyId==="auto") ? ART.get('bg_'+b.id) : null;
  if(bgIm){
    var s2=Math.max(VW/bgIm.width, VH/bgIm.height), dw=bgIm.width*s2, dh=bgIm.height*s2;
    g.drawImage(bgIm,(VW-dw)/2,(VH-dh)/2,dw,dh);   // cover-fit static backdrop; motion comes from the scrolling grooves/flora/obstacles over it
  } else {
    if(skyId&&skyId!=="auto"){ sky=ART.sky(skyId)||b.sky; } else { sky=b.sky; }
    var gr=g.createLinearGradient(0,0,0,VH);
    gr.addColorStop(0,sky[0]); gr.addColorStop(1,b.ground);
    g.fillStyle=gr; g.fillRect(0,0,VW,VH);
    g.fillStyle=b.ground; g.fillRect(0,VH*0.16,VW,VH);   // flat slope surface (procedural path only)
  }
  // corduroy grooves scrolling with camera (lighter over a painted ground)
  var scroll=(S?cam.y:menuScroll);
  g.strokeStyle="rgba(0,0,0,"+(bgIm?0.04:0.05)+")"; g.lineWidth=2;
  var spacing=46, off=((scroll*0.9)%spacing+spacing)%spacing;
  for(var yy=VH*0.16-off; yy<VH; yy+=spacing){ g.beginPath(); g.moveTo(0,yy); g.lineTo(VW,yy+10); g.stroke(); }
  // subtle biome lighter band overlay
  g.fillStyle="rgba(255,255,255,0.03)"; g.fillRect(0,VH*0.16,VW,VH);
  // decorative flora (non-colliding), stable per world cell
  var cell=70, y0=Math.floor((scroll-40)/cell), y1=Math.floor((scroll+VH+40)/cell);
  for(var cy=y0;cy<=y1;cy++){
    for(var cx=-1;cx<=Math.ceil(VW/cell)+1;cx++){
      var r=hashCell(cx,cy); if(r>0.34) continue;
      var wx=cx*cell + (hashCell(cx+11,cy)*cell); var wy=cy*cell + (hashCell(cx,cy+7)*cell);
      var sx=wx, sy=wy-scroll; if(sy<VH*0.12||sy>VH+20) continue;
      var kind=hashCell(cx+3,cy+3);
      g.save(); g.translate(sx,sy); g.globalAlpha=0.5;
      if(kind<0.5){ g.fillStyle=b.accent; ART.circle(g,0,0,2.4); g.fillStyle="#ffffff"; ART.circle(g,0,0,1); }
      else { g.fillStyle="rgba(255,255,255,0.14)"; ART.circle(g,0,0,3); }
      g.restore();
    }
  }
  // side hedges (soft walls) if field narrower than screen — always draw faint edge vignette
  var eg=g.createLinearGradient(0,0,VW,0);
  eg.addColorStop(0,"rgba(0,0,0,0.16)"); eg.addColorStop(0.12,"rgba(0,0,0,0)"); eg.addColorStop(0.88,"rgba(0,0,0,0)"); eg.addColorStop(1,"rgba(0,0,0,0.16)");
  g.fillStyle=eg; g.fillRect(0,0,VW,VH);
  if(b.fog>0){ g.fillStyle="rgba("+(b.glow?"20,30,50":"200,200,210")+","+b.fog+")"; g.fillRect(0,0,VW,VH); }
}
var menuScroll=0;

function shadow(sx,sy,r,lift){ g.fillStyle="rgba(0,0,0,0.18)"; ART.ell(g,sx,sy+ (lift||0),r*0.9,r*0.42); }

function drawObstacle(o){
  var sx=VW/2+o.x, sy=o.y-cam.y;
  if(sy<-40||sy>VH+40) return;
  shadow(sx,sy+o.r*0.3,o.r);
  g.save(); g.translate(sx,sy);
  var b=biomeAt(o.y);

function render(){

    for(i=0;i<S.pk.length;i++) drawPickup(S.pk[i]);

    S.obs.sort(function(a,b){return a.y-b.y;});

/* ══════════════════════════════════════════════════════════════════════════
   INPUT — left/right thirds carve, middle holds a tuck, any tap in air = trick
   ════════════════════════════════════════════════════════════════════════ */
var pointers={};
function zoneOf(x){ if(x<VW*0.34)return "L"; if(x>VW*0.66)return "R"; return "M"; }
function recompute(){
  if(!S){ return; }
  var l=false,r=false,m=false;
  for(var id in pointers){ var z=pointers[id]; if(z==="L")l=true; else if(z==="R")r=true; else m=true; }
  S.steer = (l&&!r)?-1:(r&&!l)?1:0;
  S.tuck = m && !l && !r;
}
function onDown(e){
  if(!S||S.paused||S.over) return;
  if(AC&&AC.state==="suspended"){ try{AC.resume();}catch(_){}}
  var rect=cv.getBoundingClientRect();
  var pts=e.changedTouches||[e];
  for(var i=0;i<pts.length;i++){ var p=pts[i]; var id=p.identifier!=null?p.identifier:"m";
    var x=p.clientX-rect.left, y=p.clientY-rect.top;
    if(S.airborne){ doTrick(); }
    pointers[id]=zoneOf(x);
  }
  recompute();
  if(e.cancelable)e.preventDefault();
}
function onUp(e){ var pts=e.changedTouches||[e]; for(var i=0;i<pts.length;i++){ var id=pts[i].identifier!=null?pts[i].identifier:"m"; delete pointers[id]; } recompute(); }
function onMove(e){ if(!S)return; var rect=cv.getBoundingClientRect(); var pts=e.changedTouches||[e];
  for(var i=0;i<pts.length;i++){ var p=pts[i]; var id=p.identifier!=null?p.identifier:"m"; if(pointers[id]!=null){ pointers[id]=zoneOf(p.clientX-rect.left); } }
  recompute(); if(e.cancelable&&e.touches)e.preventDefault();
}
cv.addEventListener("touchstart",onDown,{passive:false});
cv.addEventListener("touchend",onUp,{passive:false});
cv.addEventListener("touchcancel",onUp,{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
cv.addEventListener("mousedown",onDown);
window.addEventListener("mouseup",onUp);
cv.addEventListener("mousemove",function(e){ if(e.buttons) onMove(e); });

var keys={};
window.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(k==="p"){ if(S&&S.running&&!S.over) pauseGame(!S.paused); return; }
  if(keys[k])return; keys[k]=1;
  if(!S||S.paused||S.over)return;
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(_){}}
  if(k==="arrowleft"||k==="a"){ S.steer=-1; }
  else if(k==="arrowright"||k==="d"){ S.steer=1; }
  else if(k==="arrowdown"||k==="s"){ S.tuck=true; }
  else if(k===" "||k==="arrowup"||k==="w"){ if(S.airborne)doTrick(); e.preventDefault(); }
});
window.addEventListener("keyup",function(e){ var k=e.key.toLowerCase(); keys[k]=0;
  if(!S)return;
  if(k==="arrowleft"||k==="a"){ if(S.steer===-1)S.steer=0; }
  else if(k==="arrowright"||k==="d"){ if(S.steer===1)S.steer=0; }
  else if(k==="arrowdown"||k==="s"){ S.tuck=false; }
  // keyboard steer combined
  if((keys["arrowleft"]||keys["a"])&&!(keys["arrowright"]||keys["d"]))S.steer=-1;
  else if((keys["arrowright"]||keys["d"])&&!(keys["arrowleft"]||keys["a"]))S.steer=1;
});

/* ══════════════════════════════════════════════════════════════════════════
   RUN END + ECONOMY
   ════════════════════════════════════════════════════════════════════════ */
function finishCourse(){
  S.finished=true; S.timeMs=S.gameT*1000+S.penaltyMs;   // game-time, frame-rate independent
  endRun(false);
}
function endRun(gobbled){
  if(S.over) return;
  if(gobbled) SFX.gobble();
  bankRun();
  S._gobbled=gobbled;
  setTimeout(function(){ buildOver(); show("scrOver"); }, gobbled? 700:280);
}
// Grant a run's Petals + Sunbeams + records EXACTLY ONCE. Called by endRun (death/finish)
// and by a voluntary Quit/Restart, so an in-progress run is never silently forfeited.
function bankRun(){
  if(!S || S._banked) return; S._banked=true;
  S.over=true; S.running=false;
  var depth=Math.floor(S.depth), mode=S.mode;

  // ---- Petals (game-local cosmetic currency) ----
  var bonus=Math.round((Math.floor(depth/25) + S.gates*2 + Math.floor(S.style/12) + S.gnomeEscapes*15) * (S.scoreMult||1));   // Gnome-escape multiplier actually boosts the Petal payout now (was dead)
  var earnedCoins=S.coins + bonus;
  P.coins += earnedCoins;

  // ---- records / milestones ----
  var rec={depth:false,time:false,style:false};
  if(mode==="free"){ if(depth>P.records.free){P.records.free=depth; rec.depth=true;} if(S.coins>P.records.freeCoins)P.records.freeCoins=S.coins; }
  if(mode==="freestyle"){ if(S.style>P.records.freestyle){P.records.freestyle=S.style; rec.style=true;} }
  if(mode==="slalom" && S.finished){ if(P.records.slalomBest===0||S.timeMs<P.records.slalomBest){P.records.slalomBest=S.timeMs; rec.time=true;} }
  if(mode==="daily"){
    var dk=dailyKey();
    if(P.daily.date!==dk){ // new day → reset today's best, advance streak if consecutive
      var prev=P.daily.date;
      P.daily.date=dk; P.daily.best=0;
      // streak: increment if last played was yesterday, else reset to 1
      P.daily.streak = (P.daily.lastStreakDate===yesterdayKey())? P.daily.streak+1 : 1;
      P.daily.lastStreakDate=dk;
    }
    if(depth>P.daily.best){P.daily.best=depth; rec.depth=true;}
    if(P.daily.streak>=7) achieve("daily7");
  }
  if(depth>=5000) achieve("depth5k");
  saveProfile(true);

  // ---- Sunbeams (cross-game; capped 30/day via the fleet helper) ----
  var sb=0, sbGranted=0;
  if(depth>10){
    sb=clamp(1 + Math.floor(depth/500) + Math.floor(S.style/300) + Math.floor(S.gates/6) + S.gnomeEscapes, 1, 12);
    if(window._sbCapEarn) sbGranted=window._sbCapEarn(sb, "petalplunge:"+mode)||0;
  }
  S._earnedCoins=earnedCoins; S._earnedSb=sbGranted; S._rec=rec;   // show what was actually credited (post 30/day cap), not the pre-cap request
}
function yesterdayKey(){ var d=new Date(Date.now()-864e5); return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate(); }

function quitRun(){ if(S && !S.over) bankRun(); if(S){ S.running=false; S.over=true; } gotoModes(); }   // bank the run before leaving — don't silently forfeit an endless run's earnings

/* ---- pause ---- */
function pauseGame(on){ if(!S||S.over)return; S.paused=on; if(on){ buildPause(); show("scrPause"); } else { hideAllScreens(); $("hud").classList.remove("hidden"); S.startMs+=0; lastT=0; } }

function show(id){ hideAllScreens(); $("hud").classList.add("hidden"); $("hint").classList.add("hidden"); $(id).classList.remove("hidden"); }
function showGame(){ hideAllScreens(); $("hud").classList.remove("hidden");
  if(!P.seenTut){ /* handled by tutorial gate before start */ }
  var h=$("hint");
  h.textContent = (matchMedia&&matchMedia("(pointer:coarse)").matches)? "◀ carve  ·  hold middle to tuck  ·  tap in the air for tricks ▶" : "← → carve  ·  ↓ tuck  ·  space = trick  ·  P = pause";
  h.classList.remove("hidden"); h.style.opacity="0.9";
  setTimeout(function(){ h.style.opacity="0"; },4200);
}
function wallet(){ return '<span class="wallet"><svg class="pico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="#e9c46a"/><circle cx="7.5" cy="7.5" r="2.5" fill="#f6dc98"/></svg>'+P.coins+'</span>'; }

/* ---------- MODES ---------- */
function fmtTime(ms){ if(!ms)return "—"; var s=ms/1000; return s.toFixed(2)+"s"; }
function gotoModes(){ buildModes(); show("scrModes"); }
function buildModes(){
  S=null;
  var m=MODES;
  function best(mode){ if(mode==="free")return P.records.free?("Best "+P.records.free):""; if(mode==="daily")return P.daily.best?("Today "+P.daily.best):""; if(mode==="slalom")return P.records.slalomBest?("Best "+fmtTime(P.records.slalomBest)):""; if(mode==="freestyle")return P.records.freestyle?("Best "+P.records.freestyle):""; return ""; }
  var html='<div style="width:100%;display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:6px auto 4px">'+
      '<button class="btn sm ghost" id="mBack">←</button>'+wallet()+'</div>'+
    '<div class="h" style="margin-top:6px">Choose a Descent</div>'+
    '<div class="modes" style="margin-top:12px">';
  ["free","slalom","freestyle","daily"].forEach(function(k){
    html+='<div class="mode" data-m="'+k+'"><div class="best">'+best(k)+'</div>'+
      '<div class="mi">'+m[k].icon+'</div><div class="mn">'+m[k].name+'</div><div class="md">'+m[k].desc+'</div></div>';
  });
  html+='</div>'+
    '<div class="row" style="margin-top:16px"><button class="btn ghost" id="mShop">🛍️ Shop</button><button class="btn ghost" id="mSet">⚙︎</button></div>';
  $("scrModes").innerHTML=html;
  $("mBack").onclick=function(){ SFX.ui(); gotoTitle(); };
  $("mShop").onclick=function(){ SFX.ui(); openShop(); };
  $("mSet").onclick=function(){ SFX.ui(); buildSettings(); show("scrSettings"); };
  var nodes=$("scrModes").querySelectorAll(".mode");
  [].forEach.call(nodes,function(n){ n.onclick=function(){ var mk=n.getAttribute("data-m"); SFX.ui();
    if(mk==="daily"){ openDaily(); } else startRun(mk); }; });
}

/* ---------- DAILY ---------- */
function openDaily(){ buildDaily(); show("scrDaily"); }
function buildDaily(){
  S=null;
  var dk=dailyKey(), playedToday=(P.daily.date===dk);
  var html='<div style="width:100%;display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:6px auto 4px">'+
      '<button class="btn sm ghost" id="dBack">←</button>'+wallet()+'</div>'+
    '<div class="h" style="margin-top:6px">Daily Descent</div>'+
    '<div class="sub">One seeded slope for everyone. New slope at 00:00 UTC.</div>'+
    '<div class="card" style="margin-top:14px;text-align:center">'+
      '<div style="font-size:13px;color:var(--ink-dim)">'+dk+'</div>'+
      '<div style="font-size:44px;font-weight:800;color:var(--gold);margin:6px 0">'+(playedToday?P.daily.best:"—")+'</div>'+
      '<div style="font-size:12px;color:var(--ink-dim)">today\'s best depth</div>'+
      '<div style="margin-top:8px;font-family:JetBrains Mono;font-size:13px;color:var(--sage)">🔥 '+P.daily.streak+'-day streak</div>'+
    '</div>'+
    '<div class="spacer"></div><button class="btn primary wide" id="dPlay">'+(playedToday?"Replay today":"▶ Plunge the Daily")+'</button>'+
    (playedToday?'<button class="btn ghost wide" id="dShare" style="margin-top:8px">Share result</button>':'');
  $("scrDaily").innerHTML=html;
  $("dBack").onclick=function(){ SFX.ui(); gotoModes(); };
  $("dPlay").onclick=function(){ SFX.ui(); startRun("daily"); };
  if($("dShare"))$("dShare").onclick=function(){ shareDaily(); };
}
function dailySquares(){ var emo=["🌱","🌿","🍄","⛰️","🌙"]; var reached=biomeIndexAt(P.daily.best); var s=""; for(var i=0;i<=reached&&i<5;i++)s+=emo[i]; return s||"🌱"; }
function shareDaily(){
  var txt="Petal Plunge — Daily "+dailyKey()+"\n"+dailySquares()+"  "+P.daily.best+" deep\nlucidwinds.com/portal";
  if(navigator.share){ navigator.share({text:txt}).catch(function(){}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ toastMsg("Copied!"); },function(){}); }
  else toastMsg(txt);
}
function toastMsg(m){ var t=$("toast"); $("hud").classList.remove("hidden"); t.textContent=m; t.style.transition="none"; t.style.opacity="1";
  setTimeout(function(){ t.style.transition="opacity .6s"; t.style.opacity="0"; setTimeout(function(){ if(!S)$("hud").classList.add("hidden"); },700); },900); }

/* ---------- SHOP ---------- */
var shopTab="rider";
function openShop(){ buildShop(); show("scrShop"); }
function buildShop(){
  S=null;
  var kinds=[["rider","Riders"],["sled","Sleds"],["trail","Trails"],["sky","Skies"]];
  var html='<div style="width:100%;display:flex;justify-content:space-between;align-items:center;max-width:460px;margin:6px auto 8px">'+
      '<button class="btn sm ghost" id="sBack">←</button>'+wallet()+'</div>'+
    '<div class="h">Potting Shed</div>'+
    '<div class="tabs" id="sTabs">';
  kinds.forEach(function(k){ html+='<div class="tab'+(shopTab===k[0]?" on":"")+'" data-k="'+k[0]+'">'+k[1]+'</div>'; });
  html+='</div><div class="grid" id="sGrid"></div><div class="spacer"></div>';
  $("scrShop").innerHTML=html;
  $("sBack").onclick=function(){ SFX.ui(); gotoModes(); };
  [].forEach.call($("sTabs").children,function(t){ t.onclick=function(){ shopTab=t.getAttribute("data-k"); SFX.ui(); buildShop(); }; });
  fillShopGrid();
}
function fillShopGrid(){
  var grid=$("sGrid"); grid.innerHTML=""; var list=CATALOG[shopTab];
  list.forEach(function(it){
    var owned=owns(shopTab,it.id), equipped=P.equip[shopTab]===it.id, locked=!!it.unlock&&!owned;
    var d=el("div","item"+(owned?" owned":"")+(equipped?" equipped":""));
    var dot=el("div","tierdot"); dot.style.background=TIERS[it.tier]||"#888"; d.appendChild(dot);
    var c=el("canvas"); c.width=128; c.height=128; c.style.width="64px"; c.style.height="64px"; d.appendChild(c);
    renderItemPreview(shopTab,it.id,c);
    d.appendChild(el("div","nm",it.name));
    var pr;
    if(equipped)pr=el("div","pr eq","✓ Equipped");
    else if(owned)pr=el("div","pr own","Tap to wear");
    else if(locked)pr=el("div","lockmsg","🔒 "+(MILE[it.unlock.split(":")[1]]||"Locked"));
    else pr=el("div","pr",coinIcon()+it.cost);
    d.appendChild(pr);
    d.onclick=function(){ onShopItem(shopTab,it,owned,locked); };
    grid.appendChild(d);
  });
}
function coinIcon(){ return '🌸 '; }
function onShopItem(kind,it,owned,locked){
  if(locked){ SFX.ui(); toastMsg(MILE[it.unlock.split(":")[1]]||"Locked"); return; }
  if(owned){ P.equip[kind]=it.id; SFX.ui(); saveProfile(); buildShop(); return; }
  if(P.coins>=it.cost){ P.coins-=it.cost; grant(kind,it.id); P.equip[kind]=it.id; SFX.buy(); haptic(12); saveProfile(true); buildShop(); }
  else { SFX.crash(); toastMsg("Need "+(it.cost-P.coins)+" more Petals"); }
}
function renderItemPreview(kind,id,c){
  var gg=c.getContext("2d"); gg.setTransform(2,0,0,2,0,0); gg.clearRect(0,0,64,64); gg.save(); gg.translate(32,32);
  if(kind==="rider"){ ART.rider(gg,id,44,0); }
  else if(kind==="sled"){ ART.sled(gg,id,40,0); }
  else if(kind==="trail"){ var tim=ART.get('trail_'+id);
    if(tim){ var sc=54/(Math.max(tim.width,tim.height)||1); gg.drawImage(tim,-tim.width*sc/2,-tim.height*sc/2,tim.width*sc,tim.height*sc); }
    else { var cols=ART.trailColors(id); for(var i=0;i<10;i++){ gg.globalAlpha=1-i/12; gg.fillStyle=cols[i%cols.length]; var a=i*0.5; ART.circle(gg,-i*2.2, Math.sin(a)*6, 4-i*0.25);} gg.globalAlpha=1; } }
  else if(kind==="sky"){ var sky=id==="auto"?BIOMES[0].sky:(ART.sky(id)||BIOMES[0].sky); var gr=gg.createLinearGradient(0,-24,0,24); gr.addColorStop(0,sky[0]); gr.addColorStop(1,sky[1]); gg.fillStyle=gr; gg.fillRect(-26,-26,52,52); gg.fillStyle="rgba(255,255,255,.5)"; ART.circle(gg,10,-10,5); }
  gg.restore();
}

    '<div class="card" style="margin-top:14px">'+

      '<div class="settingrow"><span>Haptics</span><span id="setHap">'+sw(P.set.haptics)+'</span></div>'+
      '<div class="settingrow"><span>Reduced motion</span><span id="setRed">'+sw(P.set.reduced)+'</span></div>'+
    '</div>'+
    '<div class="card" style="margin-top:12px"><div class="sub" style="text-align:left;line-height:1.6">'+
      'Deepest plunge: <b>'+P.records.free+'</b><br>Best slalom: <b>'+fmtTime(P.records.slalomBest)+'</b><br>Best freestyle: <b>'+P.records.freestyle+'</b><br>'+
      'Runs: <b>'+P.stats.runs+'</b> · Escapes: <b>'+P.stats.escapes+'</b> · Tricks: <b>'+P.stats.tricks+'</b></div></div>'+
    '<button class="btn ghost" id="setReset" style="margin-top:14px;color:var(--bad)">Reset progress</button>'+
    '<div class="spacer"></div>';
  $("setBack").onclick=function(){ SFX.ui(); gotoTitle(); };
  $("setSound").onclick=function(){ P.set.sound=P.set.sound?0:1; saveProfile(true); buildSettings(); if(P.set.sound)SFX.ui(); };
  $("setHap").onclick=function(){ P.set.haptics=P.set.haptics?0:1; saveProfile(true); buildSettings(); haptic(12); };
  $("setRed").onclick=function(){ P.set.reduced=P.set.reduced?0:1; saveProfile(true); buildSettings(); };
  $("setReset").onclick=function(){ if(confirm("Reset all Petal Plunge progress and cosmetics?")){ localStorage.removeItem(PKEY); loadProfile(); gotoTitle(); } };
}

/* ---------- PAUSE ---------- */
function buildPause(){
  $("scrPause").innerHTML=
    '<div class="h" style="margin-top:16vh">Paused</div>'+
    '<div class="sub">Depth '+Math.floor(S.depth)+' · '+wallet().replace("wallet","wallet")+'</div>'+
    '<div class="spacer"></div>'+
    '<button class="btn primary wide" id="pResume">Resume</button>'+

$("pauseBtn").onclick=function(){ if(S&&S.running&&!S.over) pauseGame(!S.paused); };

/* ---------- GAME OVER ---------- */
function starStr(n){ var s=""; for(var i=0;i<3;i++)s+= i<n?"★":"☆"; return s; }
function slalomStars(ms){ if(ms<=0)return 0; var s=ms/1000; return s<20?3:s<30?2:1; }
function freestyleStars(v){ return v>=2600?3:v>=1300?2:v>0?1:0; }
function buildOver(){
  var mode=S.mode, gob=S._gobbled, rec=S._rec||{};
  var title, big, sub, stars=-1, medal="";
  if(mode==="free"||mode==="daily"){ title=gob?"The Gnome got you":"Run over"; big=Math.floor(S.depth); sub="deep"; medal=gob?"😱":"🌰"; }
  else if(mode==="slalom"){ title=S.finished?"Finished!":"Run over"; big=fmtTime(S.timeMs); sub=S.gatesHit+"/"+S.gatesTotal+" gates"; stars=S.finished?slalomStars(S.timeMs):0; medal="🚩"; }
  else if(mode==="freestyle"){ title=S.finished?"Finished!":"Run over"; big=S.style; sub="style"; stars=freestyleStars(S.style); medal="✨"; }

  var recBadge=(rec.depth||rec.time||rec.style)?'<span class="newbadge">NEW BEST</span>':'';
  var html='<div class="medal" style="margin-top:8vh">'+medal+'</div>'+
    '<div class="h">'+title+recBadge+'</div>'+
    '<div style="font-size:clamp(44px,16vw,80px);font-weight:800;color:var(--gold);line-height:1;margin:6px 0">'+big+'</div>'+
    '<div class="sub">'+sub+'</div>'+
    (stars>=0?'<div style="font-size:30px;color:var(--gold);margin-top:6px;letter-spacing:4px">'+starStr(stars)+'</div>':'');
  // scoreline
  html+='<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-around;text-align:center">'+
    '<div><div style="font-size:12px;color:var(--ink-dim)">PETALS</div><div style="font-size:22px;font-weight:800;color:var(--coin)">+'+S._earnedCoins+'</div></div>'+
    '<div><div style="font-size:12px;color:var(--ink-dim)">SUNBEAMS</div><div style="font-size:22px;font-weight:800;color:var(--sage)">+'+S._earnedSb+'</div></div>'+
    (S.gnomeEscapes>0?'<div><div style="font-size:12px;color:var(--ink-dim)">ESCAPES</div><div style="font-size:22px;font-weight:800;color:var(--rose)">'+S.gnomeEscapes+'</div></div>':'')+
    '</div>'+
    (S.tricks>0||S.gates>0?'<div class="sub" style="margin-top:8px">'+(S.gates>0?S.gates+" gates · ":"")+(S.tricks>0?S.tricks+" tricks · ":"")+"best combo ×"+S.bestCombo+'</div>':'')+
    '</div>';
  html+='<div class="spacer"></div>'+
    '<button class="btn primary wide" id="oRetry">↻ Again</button>'+
    '<div class="row" style="margin-top:8px">'+
      (mode==="daily"?'<button class="btn ghost" id="oShare">Share</button>':'')+
      '<button class="btn ghost" id="oShop">🛍️ Shop</button>'+
      '<button class="btn ghost" id="oModes">Modes</button>'+
    '</div><div class="spacer"></div>';
  $("scrOver").innerHTML=html;
  var m=mode;
  $("oRetry").onclick=function(){ SFX.ui(); startRun(m); };
  $("oShop").onclick=function(){ SFX.ui(); openShop(); };
  $("oModes").onclick=function(){ SFX.ui(); gotoModes(); };
  if($("oShare"))$("oShare").onclick=function(){ shareDaily(); };
}

/* ══════════════════════════════════════════════════════════════════════════
   SUNBEAM CAP HELPER (fleet standard — 30/day/game) + portal embed exit
   ════════════════════════════════════════════════════════════════════════ */
window._sbCapEarn=function(n,tag){
  var d=Math.floor(Date.now()/864e5), used=0;
  var k='sw_sb_petalplunge';
  try{ var s=JSON.parse(localStorage.getItem(k)||'{}'); if(s.d===d)used=s.n||0; }
  catch(e){ if(window.__ppSb&&window.__ppSb.d===d)used=window.__ppSb.n||0; }
  n=Math.min(n, Math.max(0, 30-used)); if(n<=0)return 0;
  try{ localStorage.setItem(k, JSON.stringify({d:d,n:used+n})); }catch(e){ window.__ppSb={d:d,n:used+n}; }
  if(window.Sunbeam&&Sunbeam.earn) Sunbeam.earn(n,tag).catch(function(){});
  return n;   // actual credited amount (post 30/day cap) so callers can show the truth
};
var SWS_EMBED=/[?&]embed=1(&|$)/.test(location.search);
window.SWS_EMBED=SWS_EMBED;
window.SWS_EXIT=function(){
  if(SWS_EMBED&&parent!==window){ try{parent.postMessage({sws:'close'},'*');}catch(e){} return; }
  location.href='https://lucidwinds.com/portal/';
};
if(SWS_EMBED&&parent!==window){ try{parent.postMessage({sws:'ready'},'*');}catch(e){} }
$("exitLink").onclick=function(){ SWS_EXIT(); };

   BOOT
   ════════════════════════════════════════════════════════════════════════ */

buildTitle();
show("scrTitle");

window.PP={ startRun:startRun, get S(){return S;}, CFG:CFG, MODES:MODES, CATALOG:CATALOG, ART:ART, BIOMES:BIOMES, SEG:SEG,

  setInput:function(steer,tuck){ if(S){ S.steer=steer; S.tuck=!!tuck; } },
  trick:function(){ doTrick(); },
  cam:function(){return cam;}, halfW:halfW };

/*__APPEND__*/
})();
