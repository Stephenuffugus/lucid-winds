<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2416"/><stop offset="1" stop-color="#0d100c"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cae54"/><stop offset="1" stop-color="#4a7d30"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M0 300 Q 180 260 360 360 T 512 420 L512 512 L0 512 Z" fill="url(#slope)" opacity="0.85"/>
  <!-- dew gate flags -->
  <g stroke="#c8a84b" stroke-width="10" stroke-linecap="round">
    <line x1="150" y1="360" x2="150" y2="300"/><line x1="250" y1="390" x2="250" y2="330"/>
  </g>
  <path d="M150 300 l34 14 l-34 14 z" fill="#e6c95f"/>
  <path d="M250 330 l34 14 l-34 14 z" fill="#7ab356"/>
  <!-- leaf sled + sprout rider -->
  <g transform="translate(300 210) rotate(20)">
    <path d="M0 -70 Q 46 -10 0 78 Q -46 -10 0 -70 Z" fill="#5c9a3c"/>
    <line x1="0" y1="-66" x2="0" y2="74" stroke="#3f7028" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="34" ry="38" fill="#6fae4a"/>
    <ellipse cx="0" cy="-6" rx="26" ry="22" fill="#5c9a3c"/>
    <ellipse cx="0" cy="-58" rx="12" ry="8" fill="#8fd06a" transform="rotate(-24)"/>
  </g>
  <!-- gnome peeking, red hat -->
  <g transform="translate(150 150)">
    <path d="M-30 6 L0 -60 L30 6 Z" fill="#c94b4b"/>
    <ellipse cx="0" cy="30" rx="30" ry="24" fill="#e8e2d2"/>
    <circle cx="0" cy="4" r="20" fill="#d8b48c"/>
    <circle cx="-7" cy="2" r="3.6" fill="#1c1208"/><circle cx="7" cy="2" r="3.6" fill="#1c1208"/>
  </g>
</svg>
