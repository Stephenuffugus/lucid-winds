<script>
// ---- SIM_EXPORT_START ----
/* ============================ 1. CONFIG ============================ */
/* Frozen on purpose. sim.js --over=KEY=VALUE substitutes the literal in a COPY
   of this source, so a tuning sweep can never leak into a shipped run. */
var CONFIG = {
  GAME_ID: 'gerplunk', SAVE_KEY: 'lw_gerplunk_v1', SAVE_V: 1,

  SIM_HZ: 120, G: 9.81, FLIGHT_MAX_S: 25,

  /* Bocquet's magic attack angle, and the window a bounce can happen in at all.
     The window is scaled per stone by its roundness and per day by the water. */
  MAGIC_DEG: 20, WINDOW_LO_DEG: 8, WINDOW_HI_DEG: 34,
  V_MIN: 2.5, V_MAX_FLICK: 14,

  /* the collision. E0 is the impulse coefficient, LOSS0 the speed lost per skip
     at the magic angle, LOSS1 the extra loss per squared decade of miss. */
  /* ⛔ LOSS0 AND SPIN_DECAY ARE MEASURED, NOT CHOSEN. The plan proposed 0.12 and
     0.06; at those a perfect throw reached ten skips and the P0 gate asks for
     fifteen. A 768 point sweep over SPIN_DECAY, LOSS0, the two mass exponents
     and IRREG on 2026-09-06 found 30 combinations that satisfy every P0
     assertion at once, and this is the one with the clearest Heavy Flat
     tradeoff: a perfect skimmer gets 17 skips over 27.5 m, no spin dies in 3,
     Heavy Flat trades down to 13 skips for leaps 13 percent longer, the granite
     chunk tops out at 4, and chop costs a skip. The sweep is in
     docs/DECISIONS.md and reruns as `node sim.js --sweep`. */
  E0: 0.55, LOSS0: 0.08, LOSS1: 0.10,
  /* the tumble. Without spin the plate pitches the same way every skip, which is
     why a stone with no spin dies in three and not in thirty. */
  DRIFT0_DEG: 4, DRIFT_NOISE_DEG: 0.5, SPIN_DECAY: 0.015,
  /* ⛔ IRREGULARITY IS WHY THE JOKE STONE IS A JOKE, and it is not the same thing
     as flatness. A granite chunk does not fail to skip only because it presents
     little plate; it fails because it presents a DIFFERENT plate every time it
     touches. There is no consistent face for the spin to hold steady, so the
     attack angle jumps on every contact. Roundness is regularity, so the angle
     noise scales with how far from regular the stone is. Without this term the
     chunk skipped ten times in the sweep, because the mass lift exponent that
     Heavy Flat needs was handing the chunk back the impulse its flatness had
     taken away. Measured 2026-09-06. */
  IRREG: 28,

  /* the ranges the eight stones live inside */
  FLAT_LIFT_LO: 0.6, FLAT_LIFT_HI: 1.0,
  ROUND_STAB_LO: 0.2, ROUND_STAB_HI: 1.0,
  MASS_LO: 0.03, MASS_HI: 0.12, MASS_REF: 0.06,
  /* ⛔ MASS_LOSS_P IS ZERO AND THAT IS A RESULT, NOT AN OVERSIGHT. The plan gave
     the heavy stone both a slower release AND a smaller loss per skip; the sweep
     showed the two cancel, so Heavy Flat tied the Perfect Skimmer on count and
     the choice between them stopped being a choice. With the loss bonus off, the
     slower release and the deeper immersion carry the whole tradeoff: fewer
     skips, longer leaps, which is the finding the design cites. Kept as a live
     constant rather than deleted so a tuning pass can put it back with --over. */
  MASS_LOSS_P: 0.0, MASS_SPEED_P: 0.4,
  /* ⛔ AND THE HEAVY STONE HAS TO ACTUALLY LEAP FURTHER, or the 2023 finding is
     a line in a document rather than a choice on the shore. A leap is
     2 * vx * vz / g and vz scales with vx, so leap goes as vx squared, and the
     heavy stone starts SLOWER: with lift alone it would leap shorter, not
     longer, and Heavy Flat would be strictly worse than Perfect Skimmer at
     everything. The physical answer is in Bocquet too: a heavier stone sinks
     deeper before the lift balances its weight, so more of its edge is wetted
     and the collision hands back more impulse. That is this exponent. */
  MASS_LIFT_P: 1.05,

  /* the hand */
  RELEASE_WINDOW_MS: 60, HOOK_WINDOW: 0.4, SPIN_MAX: 1.0,
  /* ⛔ the stone leaves the hand a little above the water. Not in the plan's
     CONFIG and the model needs it, so it is here and it is in DECISIONS.md. */
  RELEASE_Z: 0.35,
  /* the least vertical speed that counts as leaving the water at all */
  VZ_MIN: 0.22,

  /* ⛔⛔ A CSS PIXEL IS REAL GLASS, AND THAT IS THE WHOLE WEBXR SEAM. 0.264 mm,
     the fleet's number from satellites/keepsies/src/input/knuckle.js. Thumb
     speed converted through it is metres per second of actual hand movement,
     which is the SAME unit a 6DoF controller reports natively, so a phone and a
     headset hand the model the identical quantity and the model cannot tell
     which produced it.
     ⛔ and this is why the flick must NOT divide by PX_PER_M the way the plan
     says. PX_PER_M is how big the lake is DRAWN. Dividing thumb speed by it ties
     how hard you threw to how zoomed the camera is, so retuning the art would
     silently retune every throw in the game. Two different quantities that
     happen to share a unit. */
  METRES_PER_CSS_PX: 0.000264,
  /* stone speed per metre per second of hand. A hard thumb flick crosses the
     glass at about 0.9 m/s and should saturate; a gentle push at 0.05 m/s
     should not reach V_MIN and should sink. */
  SPEED_GAIN: 19,
  /* the curl of the last part of the path, in 1/m of glass, that means full spin */
  CURL_REF: 26,
  /* how far off the centre line the shore lets you aim */
  YAW_MAX_DEG: 25,

  PX_PER_M: 9, CAM_LEAD_M: 6,
  WIND_MAX: 1.2,
  WATER_GLASS: 1.0, WATER_RIPPLE: 0.85, WATER_CHOP: 0.6,
  BED_OFFERS: 3, DAILY_THROWS: 5
};

/* ============================ 2. RNG ============================ */
function makeRNG(seed) {
  var a = seed >>> 0;
  var r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = function (n) { return Math.floor(r() * n); };
  r.range = function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); };
  r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
  r.shuffle = function (arr) {
    var a2 = arr.slice(), i, j, tmp;
    for (i = a2.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); tmp = a2[i]; a2[i] = a2[j]; a2[j] = tmp; }
    return a2;
  };
  r.seed = seed >>> 0;
  return r;
}
function seedFromString(s) {
  var h = 2166136261 >>> 0, i;
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
/* stream splitter: the cave of seed S is the same cave whatever the lurkers
   later roll, because they roll on a different stream. */
function mixSeed(seed, salt) {
  var h = (seed ^ 0x9E3779B9) >>> 0;
  h = Math.imul(h ^ (salt + 0x85EBCA6B), 0x27D4EB2D) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x165667B1) >>> 0; h ^= h >>> 13;
  return h >>> 0;
}
function dailySeedFor(dateStr) { return seedFromString(dateStr + CONFIG.GAME_ID); }
function seedFromString(s) {
  var h = 2166136261 >>> 0, i;
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
/* stream splitter: the lake of a day is the same lake whatever the throws later
   roll, because they roll on a different stream. */
function mixSeed(seed, salt) {
  var h = (seed ^ 0x9E3779B9) >>> 0;
  h = Math.imul(h ^ (salt + 0x85EBCA6B), 0x27D4EB2D) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x165667B1) >>> 0; h ^= h >>> 13;
  return h >>> 0;
}
function dailySeedFor(dateStr) { return seedFromString(dateStr + CONFIG.GAME_ID); }
var STREAM_LAKE = 1, STREAM_THROW = 2, STREAM_BED = 3, STREAM_AMBIENT = 4;

/* ============================ 3. STONES ============================ */
/* ⛔ EIGHT STONES AND THEY ARE DATA, NOT CODE. mass in kg, flat 0 to 1 (how much
   plate it presents, which becomes lift), round 0 to 1 (how regular it is, which
   is what the spin has to work with and so how wide its angle window is).
   `line` is the one wistful sentence the stone carries in the shore view; it is
   never a stat readout, because the design says teach by feel, never by sliders. */
var STONES = [
  { id: 'sandstone', name: 'Sandstone', rarity: 'common', mass: 0.055, flat: 0.62, round: 0.55,
    line: 'Warm from the sun even after the sun has gone.' },
  { id: 'shale', name: 'Shale', rarity: 'common', mass: 0.042, flat: 0.86, round: 0.62,
    line: 'It came off the bank in a sheet, like a page.' },
  { id: 'granite', name: 'Granite Chunk', rarity: 'common', mass: 0.098, flat: 0.22, round: 0.20,
    line: 'Nobody has ever skipped this. Somebody always tries.' },
  { id: 'skimmer', name: 'Perfect Skimmer', rarity: 'uncommon', mass: 0.048, flat: 0.98, round: 0.95,
    line: 'You knew what it was before you picked it up.' },
  { id: 'heavyflat', name: 'Heavy Flat', rarity: 'uncommon', mass: 0.115, flat: 0.94, round: 0.80,
    line: 'Fewer skips, but each one crosses a lot of water.' },
  { id: 'seaglass', name: 'Sea Glass', rarity: 'rare', mass: 0.033, flat: 0.90, round: 0.88,
    line: 'Green as a bottle, and the lake spent years taking the edges off.' },
  { id: 'fossil', name: 'Fossil Stone', rarity: 'rare', mass: 0.061, flat: 0.92, round: 0.86,
    line: 'A crinoid, coiled, from when all of this was a warm shallow sea.' },
  { id: 'quartz', name: 'Lucky Quartz', rarity: 'rare', mass: 0.052, flat: 0.95, round: 0.92,
    line: 'Grandpa kept one of these in his coat pocket for thirty years.' }
];
function stoneById(id) {
  var i;
  for (i = 0; i < STONES.length; i++) if (STONES[i].id === id) return STONES[i];
  return null;
}
/* the two derived numbers, kept in one place so the model and the shore view can
   never disagree about what a stone is */
function liftOf(s) { return CONFIG.FLAT_LIFT_LO + s.flat * (CONFIG.FLAT_LIFT_HI - CONFIG.FLAT_LIFT_LO); }
function stabOf(s) { return CONFIG.ROUND_STAB_LO + s.round * (CONFIG.ROUND_STAB_HI - CONFIG.ROUND_STAB_LO); }

/* ============================ 4. MODEL ============================ */
/* ⛔ x is DOWNRANGE in metres, z is HEIGHT, y is LATERAL and only the wind moves
   it. Every function here says which it means, because a canvas layout that
   returns world units and is drawn as pixels puts the subject outside the frame,
   and that scar cost this fleet a night already.
   ⛔ THETA IS THE ATTACK ANGLE OF THE PLATE, NOT THE ANGLE OF THE VELOCITY. They
   are different quantities in Bocquet and the whole game lives on the difference:
   the stone can be travelling almost flat while its face is tilted 20 degrees to
   the water, and it is the FACE angle that spin holds steady. */
function waterFactor(water) {
  if (water === 'chop') return CONFIG.WATER_CHOP;
  if (water === 'ripple') return CONFIG.WATER_RIPPLE;
  return CONFIG.WATER_GLASS;
}
/* the angle window this stone has on this water, in degrees */
function windowFor(stone, water) {
  var k = stabOf(stone) * waterFactor(water);
  return {
    lo: CONFIG.MAGIC_DEG - (CONFIG.MAGIC_DEG - CONFIG.WINDOW_LO_DEG) * k,
    hi: CONFIG.MAGIC_DEG + (CONFIG.WINDOW_HI_DEG - CONFIG.MAGIC_DEG) * k
  };
}
/* A THROW is the device independent tuple. Nothing in it is a pixel, nothing in
   it is a screen, and that is deliberate: a thumb path on a phone and a 6DoF
   controller pose in a headset both have to be able to produce one of these.
   v m/s, theta degrees, spin -1 to 1, yaw degrees off the centre line. */
function newThrow(o) {
  return {
    v: o.v, theta: o.theta, spin: o.spin,
    yaw: o.yaw || 0,
    stone: o.stone, seed: (o.seed || 0) >>> 0
  };
}
/* Run one throw to its gerplunk. Returns the skip events and why it ended.
   Deterministic in (throw, env): the same tuple and seed give the same events. */
function runThrow(th, env) {
  env = env || {};
  var stone = stoneById(th.stone);
  if (!stone) throw new Error('no such stone: ' + th.stone);
  var water = env.water || 'glass';
  var wind = env.wind === undefined ? 0 : env.wind;
  var rng = makeRNG(mixSeed(th.seed, STREAM_THROW));
  var win = windowFor(stone, water);
  var lift = liftOf(stone);

  /* ⛔ THE 2023 FINDING, AS A STRATEGY AND NOT AS A FOOTNOTE. A heavier stone
     leaves the hand slower for the same flick and loses less of what it has per
     skip: fewer, longer leaps. Both exponents are in CONFIG. */
  var massSpeed = Math.pow(CONFIG.MASS_REF / stone.mass, CONFIG.MASS_SPEED_P);
  var massLoss = Math.pow(CONFIG.MASS_REF / stone.mass, CONFIG.MASS_LOSS_P);
  var loss0 = CONFIG.LOSS0 * massLoss;
  /* ⛔⛔ AND THE DEPTH BONUS IS GATED BY THE FACE. Heavy Flat and the Granite
     Chunk are BOTH heavy, so a mass exponent alone cannot tell them apart, and
     every setting that gave Heavy Flat the long leaps the 2023 finding asks for
     also handed the joke stone thirteen skips. Measured across a 432 point
     sweep on 2026-09-06: A4 was the only assertion no combination could pass.
     The physics says why. A heavy stone rides further because it sinks deeper
     before the lift balances its weight and so wets more of its edge, but a rock
     with no face has nothing for that deeper water to push on. It just sinks.
     So the exponent is scaled by flatness: Heavy Flat gets the whole bonus, the
     chunk gets almost none of it. */
  var massLift = Math.pow(stone.mass / CONFIG.MASS_REF, CONFIG.MASS_LIFT_P * stone.flat);

  /* ⛔ THE TUMBLE SIGN IS DRAWN ONCE PER THROW, NOT ONCE PER SKIP. Drawn per skip
     it is a random walk and a stone with no spin still gets eight skips; drawn
     once it is a tumble, the plate pitches the same way every time it touches,
     and no spin dies in three the way it does at a real lake. */
  var drum = rng() < 0.5 ? -1 : 1;

  var st = {
    x: 0, y: 0, z: CONFIG.RELEASE_Z,
    vx: th.v * massSpeed, vy: 0, vz: 0,
    theta: th.theta, spin: th.spin,
    t: 0
  };
  var dt = 1 / CONFIG.SIM_HZ;
  var events = [], lastT = 0, guard = Math.ceil(CONFIG.FLIGHT_MAX_S / dt);
  var ended = '';
  var steps = 0;
  while (steps++ < guard) {
    st.vz -= CONFIG.G * dt;
    st.vy += wind * dt;
    st.x += st.vx * dt; st.y += st.vy * dt; st.z += st.vz * dt;
    st.t += dt;
    if (st.z <= 0 && st.vz < 0) {
      st.z = 0;
      var speed = st.vx;
      var inWindow = st.theta >= win.lo && st.theta <= win.hi;
      if (!inWindow || speed < CONFIG.V_MIN) { ended = inWindow ? 'slow' : 'tumbled'; break; }
      var miss = (st.theta - CONFIG.MAGIC_DEG) / 10;
      /* ⛔⛔ THE IMPULSE COMES FROM LIFT, NOT FROM RESTITUTION, and this is the
         one place the build plan's section 4 is wrong. Written as
         `vz = -vz * E0 * lift * flat` the bounce height decays on its OWN
         geometric ladder, independent of how fast the stone is still going, and
         it collapses far faster than the speed does. Measured 2026-09-06 with
         the plan's exact constants: a perfect skimmer at 12 m/s and the magic
         angle put skips one and two 6.7 m apart and then spent skips six
         through ten inside three hundredths of a second covering fourteen
         centimetres, every interval pinned to the 1/120 s timestep floor. That
         is not the pitty pat trill, that is the stone falling through the
         simulation. Bocquet, whom the design note cites by name, has the
         vertical impulse coming from LIFT on the immersed edge and so scaling
         with the speed the stone still has and the angle it presents. Written
         that way the leaps shorten gradually, the intervals stay above the
         timestep for the whole run, and the trill emerges on its own exactly as
         the design note says it will. Recorded in docs/DECISIONS.md. */
      st.vz = CONFIG.E0 * st.vx * Math.sin(st.theta * Math.PI / 180) * lift * stone.flat * massLift;
      /* ⛔ and a stone that cannot lift itself clear of the water is not
         skipping, it is plowing. This is what kills the granite chunk: it is not
         a narrow angle window that stops it, it is that a rock with almost no
         plate cannot generate the impulse to leave the surface. */
      if (st.vz < CONFIG.VZ_MIN) { ended = 'plowed'; break; }
      st.vx = st.vx * (1 - loss0 - CONFIG.LOSS1 * miss * miss);
      st.spin = st.spin * (1 - CONFIG.SPIN_DECAY);
      st.theta = st.theta + CONFIG.DRIFT0_DEG * (1 - Math.abs(st.spin)) * drum
        + (rng() * 2 - 1) * CONFIG.DRIFT_NOISE_DEG * (1 + CONFIG.IRREG * (1 - stone.round));
      events.push({ t: st.t, x: st.x, y: st.y, interval: st.t - lastT, vx: st.vx, theta: st.theta });
      lastT = st.t;
      if (st.vx < CONFIG.V_MIN) { ended = 'slow'; break; }
    }
  }
  if (!ended) ended = 'timeout';
  return {
    skips: events.length, events: events, ended: ended,
    distance: events.length ? events[events.length - 1].x : st.x,
    time: st.t, stone: stone.id
  };
}

/* ============================ 5. FLICK ============================ */
/* ⛔⛔ THE SEAM IS `MOTION`, AND IT IS THE ONLY THING THAT CROSSES IT. A device
   produces a MOTION; `throwFromMotion` turns a MOTION into a THROW; the model
   only ever sees a THROW. Nothing below this comment knows what a stone is, and
   nothing in the model knows what a pixel is. That is the whole WebXR
   preparation: `motionFromSamples` is the phone's implementation and
   `motionFromPose` is the headset's, they return the same four numbers in the
   same units, and the game between them is untouched.

   ⛔⛔ AND A SINGLE STROKE ONLY CARRIES THREE NUMBERS. This is the real
   constraint and it is worth writing down before someone tries to read a fourth
   axis out of the same path. A stroke on a piece of glass has a speed, a
   direction and a curvature: three independent quantities. The throw needs four.
   The fourth has to come from somewhere that is not the shape of the stroke, and
   here it comes from WHERE THE STROKE STARTS. You put your thumb on the line you
   want and you throw along it. Read yaw from the stroke's direction instead and
   it steals the angle: a throw aimed hard left is mostly across the screen, so
   its rise collapses and every aimed throw comes out flat. Start position is
   free, it is already a decision the player is making, and it decouples. */

/* A MOTION is device independent. Every field is a physical quantity of the
   hand, never of the screen.
     speed  metres per second of hand travel at release
     rise   0 to 1, how much of the throw went away from the thrower rather
            than across them. 0 is a sidearm skim, 1 is a lob straight out.
     curl   signed curvature of the last part of the path, 1/m, the wrist snap
     aim    -1 to 1, the line the throw was set up on, left to right */
function newMotion(o) {
  return { speed: o.speed || 0, rise: o.rise || 0, curl: o.curl || 0, aim: o.aim || 0 };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* THE PHONE. Pointer samples in CSS pixels and milliseconds, plus the viewport
   width so the start position reads as a line rather than as a pixel. */
function motionFromSamples(samples, viewW) {
  var n = samples.length;
  if (n < 3) return newMotion({});
  var last = samples[n - 1], i;
  /* ⛔ RELEASE SPEED IS THE LAST 60 ms, NOT THE WHOLE STROKE. A player who
     wanders to the line they want and then snaps has a slow average and a fast
     release, and it is the release that throws the stone. */
  var cut = last.t - CONFIG.RELEASE_WINDOW_MS, first = 0;
  for (i = n - 1; i >= 0; i--) { if (samples[i].t <= cut) { first = i; break; } }
  var a = samples[first], dt = (last.t - a.t) / 1000;
  /* ⛔ SPEED IS ARC LENGTH, NOT NET DISPLACEMENT. Measured as endpoint minus
     endpoint, a hooked release reads SLOWER than a straight one of the same hand
     speed, because the curve doubles back on itself. The hand did not slow down.
     Arc length is what the hand actually travelled. */
  var arc = 0;
  for (i = first + 1; i < n; i++) {
    var px = samples[i].x - samples[i - 1].x, py = samples[i].y - samples[i - 1].y;
    arc += Math.sqrt(px * px + py * py);
  }
  var speed = dt > 0 ? (arc * CONFIG.METRES_PER_CSS_PX) / dt : 0;

  /* ⛔⛔ THE ARM SETS THE ANGLE AND THE WRIST ADDS THE SPIN, so the rise is read
     from the part of the stroke BEFORE the hook window and the curl from the
     part after it. Read over the whole path instead, the two fight: a hard hook
     drags the endpoint sideways, which changes the overall rise, so curling your
     wrist harder also flattened your throw and there was no way to ask for spin
     without giving up angle. Measured 2026-09-06: the same stroke hooked one way
     came out at 17.6 degrees and hooked the other way at 31.1, from an arm that
     did the identical thing. Split at HOOK_WINDOW they are independent. */
  var s0 = samples[0];
  var armEnd = samples[Math.max(1, Math.floor((n - 1) * (1 - CONFIG.HOOK_WINDOW)))];
  var tx = armEnd.x - s0.x, ty = armEnd.y - s0.y;
  var tlen = Math.sqrt(tx * tx + ty * ty);
  var rise = tlen > 0 ? clamp(Math.max(0, -ty) / tlen, 0, 1) : 0;

  /* the curl of the last HOOK_WINDOW of the path, as a signed curvature in 1/m
     of glass. Three points define a circle; its signed reciprocal radius is the
     curvature and the sign is which way the wrist rolled. */
  /* ⛔ TOTAL SIGNED TURNING OVER ARC LENGTH, not an average of three point
     circle curvatures. The three point estimate is dominated by whichever
     samples happen to be closest together, so it is a sampling rate measurement
     as much as a shape one, and it was not even monotonic: a harder hook came
     back with LESS spin than a soft one. Turning per metre of path is the
     textbook mean curvature and it is monotonic in how hard the wrist rolled. */
  var k0 = Math.max(0, Math.floor((n - 1) * (1 - CONFIG.HOOK_WINDOW)));
  var turn = 0, hookArc = 0;
  for (i = k0 + 2; i < n; i++) {
    var p = samples[i - 2], q = samples[i - 1], r = samples[i];
    var ax = q.x - p.x, ay = q.y - p.y, bx = r.x - q.x, by = r.y - q.y;
    var la = Math.sqrt(ax * ax + ay * ay), lb = Math.sqrt(bx * bx + by * by);
    if (la < 1e-6 || lb < 1e-6) continue;
    /* the signed angle from segment a to segment b */
    turn += Math.atan2(ax * by - ay * bx, ax * bx + ay * by);
    hookArc += lb;
  }
  var curl = hookArc > 1e-6 ? turn / (hookArc * CONFIG.METRES_PER_CSS_PX) : 0;

  /* ⛔ AIM IS A FRACTION OF THE WIDTH, NEVER A PIXEL, so a 320 wide phone and a

    pm.speed, 8.333, 0.02);
  T.assert('and a pose stream needs no pixels to say so', pm.aim === 0 && pm.curl === 0);
  var turning = [], j;
  for (j = 0; j <= 6; j++) turning.push({ x: 0, y: 0, z: -0.1 * j, roll: 0.4 * j, yaw: 0, t: j * 10 });
  T.assert('a rolling wrist in a headset produces spin', motionFromPose(turning).curl > 0);

  /* the folk wisdom, which is copy and therefore under the studio laws */
  /* ⛔ each of these isolates ONE fault, which means every OTHER axis has to be
     good. Written with the default hook of zero, a steep throw came back with
     "more spin" and the assertion looked like a bug in the advice when it was a
     bug in the throw being asked about. */
  var lines = [adviceFor(flickOf({ rise: 0.95, hook: 0.5 })), adviceFor(flickOf({ arc: 70, ms: 320, hook: 0.5 })),
    adviceFor(flickOf({ hook: 0 })), adviceFor(flickOf({ rise: 0.1, hook: 0.5 }))];
  var bad = [];
  for (i = 0; i < lines.length; i++) {
    if (/[-‐-―]/.test(lines[i])) bad.push(lines[i]);
    if (lines[i].indexOf('!') >= 0) bad.push(lines[i]);
    if (/[0-9]/.test(lines[i])) bad.push(lines[i]);
  }
  T.assert('the advice never uses a dash, an exclamation point or a number', bad.length === 0, bad.join(' | '));
  T.assert('a steep throw with everything else right is told to go flatter',
    adviceFor(flickOf({ rise: 0.95, hook: 0.5 })).indexOf('Flatter') === 0);
  T.assert('a weak throw with everything else right is told to go faster',
    adviceFor(flickOf({ arc: 70, ms: 320, rise: 0.55, hook: 0.5 })).indexOf('Faster') === 0);
  T.assert('and a throw with no wrist in it is told about the wrist',
    adviceFor(flickOf({ hook: 0 })).indexOf('More spin') === 0);
}

function suiteCopy(T) {
  /* the studio laws, checked against the strings this file actually ships */
  var i, bad = [];
  for (i = 0; i < STONES.length; i++) {
    var L = STONES[i].line;
    if (/[-‐-―]/.test(L)) bad.push(STONES[i].id + ' has a dash');
    if (L.indexOf('!') >= 0) bad.push(STONES[i].id + ' has an exclamation point');
  }
  T.assert('no stone line uses a dash or an exclamation point', bad.length === 0, bad.join('; '));
  T.assert('the studio is singular everywhere in the stone lines',
    STONES.every(function (s) { return s.line.indexOf('Sky Wolf Studios') < 0; }));
}
