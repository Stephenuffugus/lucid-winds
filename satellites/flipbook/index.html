<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flipbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='3' fill='%23efe6d0'/%3E%3Ccircle cx='7' cy='5' r='2' fill='%238d94a8'/%3E%3Ccircle cx='13' cy='5' r='2' fill='%238d94a8'/%3E%3Ccircle cx='19' cy='5' r='2' fill='%238d94a8'/%3E%3Ccircle cx='25' cy='5' r='2' fill='%238d94a8'/%3E%3Cpath d='M9 22 Q14 12 22 18' stroke='%232a2438' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<title>Flipbook — Sky Wolf Studios</title>
<script src="/sunbeam-sdk.js?v=4"></script>
<script>window.Sunbeam&&Sunbeam.init({gameId:"flipbook"}).catch(function(){});</script>
<style>
:root{ --bg:#141210; --panel:#1e1a16; --line:#3a332a; --ink:#efe8da; --muted:#948b7c;
  --paper:#efe6d0; --paper2:#e6dabf; --gold:#c8a84b; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
html,body{height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none}
#wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 80% at 50% 0%, #201a14 0%, #0e0b08 70%, #000 100%)}
#stage{position:relative; flex:none; width:540px; height:960px; transform-origin:center center; background:var(--bg); overflow:hidden; box-shadow:0 0 60px #000a}
.topbar{position:absolute; top:0; left:0; right:0; height:64px; display:flex; align-items:center; gap:8px; padding:8px 10px; z-index:30}
.tbtn{min-width:48px; height:48px; border-radius:12px; border:1px solid var(--line); background:rgba(20,18,16,0.8);
  color:var(--ink); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 12px; font-weight:700}
.tbtn.gold{background:linear-gradient(180deg,#e8c467,#c39a3b); color:#2a1e06; border-color:#f4dfa0}
.tbtn.on{border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,168,75,0.3)}
#pageno{margin-left:auto; font-weight:800; font-size:15px; color:var(--muted); letter-spacing:1px}
/* the notebook — spiral binding is DOWN THE LEFT SIDE (that's how you flip it) */
#book{position:absolute; left:24px; right:14px; top:74px; bottom:170px; border-radius:8px 14px 14px 8px;
  background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%);
  box-shadow:0 14px 30px rgba(0,0,0,0.55), inset 0 -3px 0 rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.5)}
#book::before{ /* spiral binding — vertical rings down the left edge */
  content:''; position:absolute; left:-11px; top:0; bottom:0; width:22px;
  background:radial-gradient(circle at 11px 10px, #8d94a8 0 5px, #565c6c 5px 7px, transparent 7px);
  background-size:22px 36px; background-repeat:repeat-y; background-position:0 12px}
#book::after{ /* stacked page edges — on the RIGHT, opposite the binding */
  content:''; position:absolute; top:4px; bottom:4px; right:-6px; width:6px; border-radius:0 12px 12px 0;
  background:repeating-linear-gradient(90deg,#d8cbaa 0 1.5px,#efe6d0 1.5px 3px); opacity:0.9}
#margin{position:absolute; left:34px; top:0; bottom:0; width:1.5px; background:rgba(212,110,110,0.35); pointer-events:none}
canvas.page{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
#onion{opacity:0.28; pointer-events:none}
#playglass{position:absolute; inset:0; display:none; align-items:flex-end; justify-content:center; padding:10px; pointer-events:none}
#playglass.on{display:flex}
#playchip{background:rgba(20,18,16,0.85); border:1px solid var(--gold); color:var(--gold); font-weight:800;
  padding:8px 18px; border-radius:20px; font-size:13px; letter-spacing:1px}
/* tools */
#tools{position:absolute; left:10px; right:10px; bottom:10px; display:flex; flex-direction:column; gap:8px; z-index:30}
.trow{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
.swatch{width:44px; height:44px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.18); cursor:pointer}
.swatch.on{border-color:#fff; box-shadow:0 0 0 3px rgba(200,168,75,0.55)}
.wdot{width:48px; height:44px; border-radius:12px; border:1px solid var(--line); background:rgba(20,18,16,0.8);
  display:flex; align-items:center; justify-content:center; cursor:pointer}
.wdot.on{border-color:var(--gold)}
.wdot i{display:block; border-radius:50%; background:var(--ink)}
#hint{text-align:center; color:var(--muted); font-size:11.5px; padding-top:2px}
#onionFirst{opacity:0.30; pointer-events:none}
/* cinema mode: chrome melts away, the book fills the stage on black */
#stage.cinema{background:#000}
#stage.cinema .topbar, #stage.cinema #tools{display:none}
#stage.cinema #book{left:0; right:0; top:0; bottom:0; border-radius:0; box-shadow:none}
#stage.cinema #book::before, #stage.cinema #book::after, #stage.cinema #margin{display:none}
#stage.cinema canvas.page{object-fit:contain}
#stage.cinema #playglass{display:none!important}
#cinemachip{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(20,18,16,0.7);
  border:1px solid var(--line); color:var(--muted); font-size:12px; padding:6px 14px; border-radius:16px;
  display:none; z-index:40; pointer-events:none}
#stage.cinema #cinemachip{display:block}
/* voice panel */
#voicepanel{position:absolute; left:14px; right:14px; bottom:170px; z-index:45; display:none;
  background:rgba(24,21,17,0.97); border:1px solid var(--gold); border-radius:16px; padding:14px}
#voicepanel.on{display:block}
.vslot{display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line)}
.vslot:last-of-type{border-bottom:none}
.vlab{font-weight:800; font-size:14px; width:70px}
.vbtn{min-width:48px; height:44px; border-radius:10px; border:1px solid var(--line); background:rgba(20,18,16,0.85);
  color:var(--ink); font-size:15px; cursor:pointer; padding:0 10px; font-weight:700}
.vbtn.rec{border-color:#c85a5a; color:#e88}
.vbtn.rec.live{background:#7a2a2a; color:#fff; animation:recpulse 1s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 4px rgba(200,90,90,0.35)}}
.vstat{margin-left:auto; color:var(--muted); font-size:11px}
#vp-close{width:100%; margin-top:10px}
#busychip{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:60; display:none;
  background:rgba(20,18,16,0.95); border:1px solid var(--gold); color:var(--gold); font-weight:800;
  padding:14px 26px; border-radius:16px; font-size:15px; letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="topbar">
    <button class="tbtn" id="b-home" aria-label="Back to the garden">⌂</button>
    <button class="tbtn" id="b-prev" aria-label="Previous page">‹</button>
    <button class="tbtn" id="b-next" aria-label="Next page">›</button>
    <button class="tbtn" id="b-onion" aria-label="Onion skin">👻</button>
    <button class="tbtn" id="b-first" aria-label="Show page one as a ghost" title="Ghost of page 1 — line up your loop">1</button>
    <button class="tbtn" id="b-fps" aria-label="Frames per second">8fps</button>
    <button class="tbtn" id="b-cinema" aria-label="Cinema mode">⛶</button>
    <button class="tbtn gold" id="b-play" aria-label="Play the flipbook">▶</button>
    <div id="pageno">1 / 1</div>
  </div>

  <div id="book">
    <canvas class="page" id="onionFirst" width="512" height="716"></canvas>
    <canvas class="page" id="onion" width="512" height="716"></canvas>
    <canvas class="page" id="page" width="512" height="716"></canvas>
    <div id="margin"></div>
    <div id="playglass"><div id="playchip">PLAYING · tap to stop</div></div>
  </div>
  <div id="cinemachip">tap anywhere to leave the cinema</div>
  <div id="busychip">EXPORTING…</div>

  <div id="voicepanel">
    <div style="font-weight:800; color:var(--gold); font-size:15px; margin-bottom:4px">🎙 Voices <span style="color:var(--muted);font-weight:600;font-size:11px">— recording plays your flipbook so you can act along</span></div>
    <div class="vslot" id="vslot0">
      <span class="vlab">Voice 1</span>
      <button class="vbtn rec" data-v="0" data-act="rec">● Rec</button>
      <button class="vbtn" data-v="0" data-act="play">▶</button>
      <button class="vbtn" data-v="0" data-act="del">✕</button>
      <span class="vstat" id="vstat0">empty</span>
    </div>
    <div class="vslot" id="vslot1">
      <span class="vlab">Voice 2</span>
      <button class="vbtn rec" data-v="1" data-act="rec">● Rec</button>
      <button class="vbtn" data-v="1" data-act="play">▶</button>
      <button class="vbtn" data-v="1" data-act="del">✕</button>
      <span class="vstat" id="vstat1">empty</span>
    </div>
    <button class="tbtn" id="vp-close" aria-label="Close voices">Done</button>
  </div>

  <div id="tools">
    <div class="trow" id="colors"></div>
    <div class="trow">
      <div class="wdot" data-w="3" title="Fine pen"><i style="width:4px;height:4px"></i></div>
      <div class="wdot on" data-w="6" title="Pen"><i style="width:8px;height:8px"></i></div>
      <div class="wdot" data-w="12" title="Marker"><i style="width:14px;height:14px"></i></div>
      <button class="tbtn" id="b-erase" aria-label="Eraser">◻ Erase</button>
      <button class="tbtn" id="b-clear" aria-label="Clear this page">✕ Page</button>
      <button class="tbtn" id="b-newbook" aria-label="Start a new flipbook">📓 New</button>
    </div>
    <div class="trow">
      <button class="tbtn" id="b-voice" aria-label="Record voices">🎙 Voice</button>
      <button class="tbtn" id="b-export" aria-label="Export as a video">📤 Export</button>
      <button class="tbtn" id="b-share" aria-label="Share your flipbook">↗ Share</button>
      <button class="tbtn" id="b-install" aria-label="Add to home screen">📲 Install</button>
    </div>
    <div id="hint">Draw, flip to the next page, and your last page shows through faint so you can animate. Then press play.</div>
  </div>
</div></div>

<script>
(function(){
"use strict";
var BUILD="v2.1", MAXPAGES=100;
function $(id){ return document.getElementById(id); }

/* ---------- stage fit ---------- */
var VW=540, VH=960;
function fit(){ var iw=window.innerWidth||540, ih=window.innerHeight||960; var s=Math.min(iw/VW, ih/VH); $('stage').style.transform='translateZ(0) scale('+s+')'; }
window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){ setTimeout(fit,200); });
fit();

/* ---------- state ---------- */
var CW=512, CH=716;
var pages=[null];            // dataURL per page (null = blank)
var cur=0;
var fpsOptions=[4,8,12,24], fpsIdx=1;
var onionOn=true, firstOn=false;
var color='#2a2438', width=6, erasing=false;
var playing=false, playTimer=null, playFrame=0;
var drawnThisSession=false, drawTicks=0, sunTimer=null;
var cinema=false;

var pageC=$('page'), pageX=pageC.getContext('2d');
var onionC=$('onion'), onionX=onionC.getContext('2d');
var firstC=$('onionFirst'), firstX=firstC.getContext('2d');

var INKS=['#2a2438','#7a4a26','#3f6b34','#2f5fa8','#a83a5a','#c8a84b'];

/* ---------- persistence (debounced — the OLD code wrote the ENTIRE book to
   localStorage on every pen lift, which froze Penny's old tablet solid: a
   many-page book is a megabyte-plus synchronous JSON.stringify + setItem per
   stroke. Now the bitmap is encoded only after the pen rests, and the disk
   write is debounced + coalesced. Drawing stays buttery; nothing is lost
   because saveNow() runs on nav / play / export / pagehide.) ---------- */
var _dirty=false, _commitTimer=null, _saveTimer=null;
function save(){
  try{
    localStorage.setItem('fb_book', JSON.stringify({ cur:cur, fpsIdx:fpsIdx, onion:onionOn, pages:pages }));
  }catch(e){
    toastHint('The notebook is getting heavy, older pages may not save.');
  }
}
function scheduleSave(){
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){ _saveTimer=null; save(); }, 600);
}
// encode the visible page into pages[cur] (only when it actually changed)
function flushBitmap(){
  if(_commitTimer){ clearTimeout(_commitTimer); _commitTimer=null; }
  if(_dirty){ try{ pages[cur]=pageC.toDataURL('image/png'); }catch(e){} _dirty=false; scheduleSave(); }
}
// called on every pen lift — cheap: just flag + (re)arm the idle encoder
function markDirty(){
  _dirty=true; drawnThisSession=true;
  if(_commitTimer)clearTimeout(_commitTimer);
  _commitTimer=setTimeout(flushBitmap, 900);
}
// synchronous, complete flush — for leaving the page / closing the app
function saveNow(){ flushBitmap(); if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer=null; } save(); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden')saveNow(); });
function load(){
  try{
    var b=JSON.parse(localStorage.getItem('fb_book')||'null');
    if(b&&b.pages&&b.pages.length){ pages=b.pages.slice(0,MAXPAGES); cur=Math.min(b.cur||0,pages.length-1);
      if(typeof b.fpsIdx==='number')fpsIdx=Math.max(0,Math.min(fpsOptions.length-1,b.fpsIdx));
      if(typeof b.onion==='boolean')onionOn=b.onion; }
  }catch(e){}
}

/* ---------- page rendering ---------- */
function blankPage(g){
  g.clearRect(0,0,CW,CH);
}
function drawDataURL(g, url, cb){
  if(!url){ blankPage(g); if(cb)cb(); return; }
  var im=new Image();
  im.onload=function(){ blankPage(g); g.drawImage(im,0,0,CW,CH); if(cb)cb(); };
  im.onerror=function(){ blankPage(g); if(cb)cb(); };
  im.src=url;
}
function showPage(){
  drawDataURL(pageX, pages[cur]);
  if(onionOn&&cur>0)drawDataURL(onionX, pages[cur-1]);
  else blankPage(onionX);
  onionC.style.display=(onionOn&&cur>0&&!playing)?'':'none';
  // ghost of page 1 (recolored blue in-canvas) so the last page can line up a clean loop
  if(firstOn&&cur>0&&pages[0])drawDataURL(firstX, pages[0], function(){
    firstX.globalCompositeOperation='source-in';
    firstX.fillStyle='#3d6fd8'; firstX.fillRect(0,0,CW,CH);
    firstX.globalCompositeOperation='source-over';
  });
  else blankPage(firstX);
  firstC.style.display=(firstOn&&cur>0&&!playing)?'':'none';
  $('pageno').textContent=(cur+1)+' / '+pages.length;
  $('b-onion').classList.toggle('on', onionOn);
  $('b-first').classList.toggle('on', firstOn);
  $('b-fps').textContent=fpsOptions[fpsIdx]+'fps';
}
// eager commit for discrete actions (clear, dev hook) — encodes now, saves soon
function commitPage(){
  try{ pages[cur]=pageC.toDataURL('image/png'); }catch(e){}
  _dirty=false; if(_commitTimer){ clearTimeout(_commitTimer); _commitTimer=null; }
  scheduleSave();
}

/* ---------- drawing ---------- */
var drawing=false, lx=0, ly=0;
function evPos(e){
  var r=pageC.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||e;
  return { x:(t.clientX-r.left)*CW/r.width, y:(t.clientY-r.top)*CH/r.height };
}
function strokeTo(x,y){
  pageX.lineCap='round'; pageX.lineJoin='round';
  if(erasing){ pageX.globalCompositeOperation='destination-out'; pageX.lineWidth=width*3.2; }
  else { pageX.globalCompositeOperation='source-over'; pageX.strokeStyle=color; pageX.lineWidth=width; }
  pageX.beginPath(); pageX.moveTo(lx,ly); pageX.lineTo(x,y); pageX.stroke();
  pageX.globalCompositeOperation='source-over';
  lx=x; ly=y;
}
function onDown(e){ if(playing)return; e.preventDefault(); var p=evPos(e); drawing=true; lx=p.x; ly=p.y; strokeTo(p.x+0.01,p.y+0.01); drawnThisSession=true; }
function onMove(e){ if(!drawing)return; e.preventDefault(); var p=evPos(e); strokeTo(p.x,p.y); }
function onUp(){ if(!drawing)return; drawing=false; markDirty(); }   // cheap flag, no per-stroke encode/write
/* Penny's old tablet couldn't draw AT ALL (Jul 17): it predates PointerEvent.
   Bind pointer events when they exist, otherwise touch + mouse fallbacks. */
if(window.PointerEvent){
  pageC.addEventListener('pointerdown',onDown);
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
}else{
  pageC.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('touchend',onUp);
  window.addEventListener('touchcancel',onUp);
  pageC.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
}

/* ---------- navigation ---------- */
function go(n){
  if(playing)stopPlay();
  if(n<0)return;
  if(n>=MAXPAGES){ toastHint('This flipbook is full at '+MAXPAGES+' pages.'); return; }
  flushBitmap();                          // persist the page we're leaving before cur changes
  if(n>=pages.length)pages.push(null);   // flipping past the end adds a fresh page
  cur=n; showPage(); scheduleSave();
}
$('b-prev').addEventListener('click',function(){ go(cur-1); });
$('b-next').addEventListener('click',function(){ go(cur+1); });
$('b-onion').addEventListener('click',function(){ onionOn=!onionOn; showPage(); save(); });
$('b-first').addEventListener('click',function(){ firstOn=!firstOn;
  if(firstOn&&cur===0)toastHint('Page 1 ghost shows on later pages — flip ahead and line up your loop.');
  showPage(); save(); });
$('b-fps').addEventListener('click',function(){ fpsIdx=(fpsIdx+1)%fpsOptions.length; showPage(); save(); });
$('b-clear').addEventListener('click',function(){ blankPage(pageX); commitPage(); });
$('b-newbook').addEventListener('click',function(){
  if(!confirm('Start a fresh flipbook? This one will be erased.'))return;
  pages=[null]; cur=0; showPage(); save();
});
$('b-home').addEventListener('click',function(){ SWS_EXIT(); });

/* ---------- voices (up to two mic tracks that play with the animation) ---------- */
var voices=[null,null];        // {d:dataURL, s:seconds}
var voiceEls=[null,null];      // <audio> elements during playback
var recState=null;             // {i, rec, chunks, t0, stream}
(function loadVoices(){
  var i;
  for(i=0;i<2;i++){ try{ var v=JSON.parse(localStorage.getItem('fb_voice'+i)||'null'); if(v&&v.d)voices[i]=v; }catch(e){} }
})();
function voiceStat(){
  var i;
  for(i=0;i<2;i++){
    var el=$('vstat'+i);
    if(recState&&recState.i===i)el.textContent='recording…';
    else el.textContent=voices[i]?(Math.round(voices[i].s)+'s recorded'):'empty';
  }
}
function stopRec(){
  if(!recState)return;
  try{ recState.rec.stop(); }catch(e){}
  try{ var tr=recState.stream.getTracks(),i; for(i=0;i<tr.length;i++)tr[i].stop(); }catch(e){}
}
function startRec(i){
  if(recState){ stopRec(); return; }
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){
    toastHint('Voice recording needs a newer browser.'); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var rec;
    try{ rec=new MediaRecorder(stream); }catch(e){ toastHint('Voice recording is not available here.'); return; }
    recState={ i:i, rec:rec, chunks:[], t0:Date.now(), stream:stream };
    rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size)recState.chunks.push(ev.data); };
    rec.onstop=function(){
      var secs=(Date.now()-recState.t0)/1000;
      var blob=new Blob(recState.chunks,{type:rec.mimeType||'audio/webm'});
      var fr=new FileReader();
      fr.onload=function(){
        voices[i]={ d:fr.result, s:secs };
        try{ localStorage.setItem('fb_voice'+i, JSON.stringify(voices[i])); }
        catch(e){ toastHint('That voice take is too big to keep saved — it will last this visit.'); }
        recState=null; voiceStat(); paintRecBtns();
        if(playing)stopPlay();
      };
      fr.readAsDataURL(blob);
    };
    rec.start();
    voiceStat(); paintRecBtns();
    // the flipbook plays while you record, so you can act along
    if(!playing&&pages.length>1)startPlay();
    setTimeout(function(){ if(recState&&recState.i===i)stopRec(); },60000);   // 60s cap
  })['catch'](function(){ toastHint('Microphone permission was refused.'); });
}
function paintRecBtns(){
  var btns=document.querySelectorAll('#voicepanel .vbtn.rec'),k;
  for(k=0;k<btns.length;k++){
    var b=btns[k], vi=parseInt(b.getAttribute('data-v'),10);
    var live=recState&&recState.i===vi;
    b.classList.toggle('live',!!live);
    b.textContent=live?'■ Stop':'● Rec';
  }
}
$('b-voice').addEventListener('click',function(){ $('voicepanel').classList.add('on'); voiceStat(); paintRecBtns(); });
$('vp-close').addEventListener('click',function(){ if(recState)stopRec(); $('voicepanel').classList.remove('on'); });
(function wireVoiceBtns(){
  var btns=document.querySelectorAll('#voicepanel .vbtn'),k;
  for(k=0;k<btns.length;k++)(function(b){
    b.addEventListener('click',function(){
      var vi=parseInt(b.getAttribute('data-v'),10), act=b.getAttribute('data-act');
      if(act==='rec')startRec(vi);
      else if(act==='play'){ if(voices[vi]){ var a=new Audio(voices[vi].d); a.play()['catch'](function(){}); } }
      else if(act==='del'){ voices[vi]=null; try{ localStorage.removeItem('fb_voice'+vi); }catch(e){} voiceStat(); }
    });
  })(btns[k]);
})();
function startVoicePlayback(){
  var i;
  for(i=0;i<2;i++){
    if(voiceEls[i]){ try{voiceEls[i].pause();}catch(e){} voiceEls[i]=null; }
    if(voices[i]){ voiceEls[i]=new Audio(voices[i].d); voiceEls[i].play()['catch'](function(){}); }
  }
}
function stopVoicePlayback(){
  var i;
  for(i=0;i<2;i++){ if(voiceEls[i]){ try{voiceEls[i].pause();}catch(e){} voiceEls[i]=null; } }
}

/* ---------- play ---------- */
function startPlay(){
  if(pages.length<2){ toastHint('Draw at least two pages, then play.'); return; }
  flushBitmap();                          // make sure the page just drawn is in the playback
  playing=true; playFrame=0;
  $('playglass').classList.add('on');
  onionC.style.display='none';
  firstC.style.display='none';
  startVoicePlayback();
  var step=function(){
    var f=playFrame%pages.length;
    if(playFrame>0&&f===0&&!recState)startVoicePlayback();   // loop: voices restart with the pages
    drawDataURL(pageX, pages[f]);
    $('pageno').textContent=(f+1)+' / '+pages.length;
    playFrame++;
    playTimer=setTimeout(step, 1000/fpsOptions[fpsIdx]);
  };
  step();
}
function stopPlay(){
  playing=false;
  if(playTimer){ clearTimeout(playTimer); playTimer=null; }
  stopVoicePlayback();
  $('playglass').classList.remove('on');
  if(cinema)exitCinema();
  showPage();
}
$('b-play').addEventListener('click',function(){ if(playing)stopPlay(); else startPlay(); });
$('book').addEventListener('click',function(){ if(playing)stopPlay(); });

/* ---------- cinema mode ---------- */
function enterCinema(){
  if(pages.length<2){ toastHint('Draw at least two pages first.'); return; }
  cinema=true;
  $('stage').classList.add('cinema');
  try{ var el=document.documentElement; if(el.requestFullscreen)el.requestFullscreen()['catch'](function(){}); }catch(e){}
  if(!playing)startPlay();
}
function exitCinema(){
  cinema=false;
  $('stage').classList.remove('cinema');
  try{ if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()['catch'](function(){}); }catch(e){}
}
$('b-cinema').addEventListener('click',function(){ enterCinema(); });
document.addEventListener('fullscreenchange',function(){
  if(cinema&&!document.fullscreenElement)stopPlay();   // hardware back out of fullscreen leaves cinema cleanly
});

/* ---------- export (webm video with a made-with footer; voices mixed in) ---------- */
var lastExport=null;    // {blob, url}
function canExport(){ return !!(window.MediaRecorder&&pageC.captureStream); }
function exportVideo(cb){
  if(pages.length<2){ toastHint('Draw at least two pages first.'); if(cb)cb(null); return; }
  if(!canExport()){ toastHint('Export needs a newer browser.'); if(cb)cb(null); return; }
  if(playing)stopPlay();
  flushBitmap();                          // include the freshest drawing in the video
  $('busychip').style.display='block';
  // preload every page image first so frames step without async gaps
  var imgs=new Array(pages.length), left=pages.length, i;
  function ready(){
    var ec=document.createElement('canvas'); ec.width=CW; ec.height=CH+44;
    var ex=ec.getContext('2d');
    var fps=fpsOptions[fpsIdx];
    var stream=ec.captureStream(fps);
    // mix voices into the export when possible
    var acx=null;
    try{
      if((voices[0]||voices[1])&&(window.AudioContext||window.webkitAudioContext)){
        acx=new (window.AudioContext||window.webkitAudioContext)();
        var dest=acx.createMediaStreamDestination(), vi;
        for(vi=0;vi<2;vi++){ if(!voices[vi])continue;
          var ael=new Audio(voices[vi].d); ael.crossOrigin='anonymous';
          var src=acx.createMediaElementSource(ael);
          src.connect(dest);
          ael.play()['catch'](function(){});
        }
        var at=dest.stream.getAudioTracks();
        for(vi=0;vi<at.length;vi++)stream.addTrack(at[vi]);
      }
    }catch(e){}
    var rec;
    try{ rec=new MediaRecorder(stream,{mimeType:'video/webm'}); }
    catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ $('busychip').style.display='none'; toastHint('Export is not available here.'); if(cb)cb(null); return; } }
    var chunks=[];
    rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size)chunks.push(ev.data); };
    rec.onstop=function(){
      if(acx){ try{acx.close();}catch(e){} }
      var blob=new Blob(chunks,{type:'video/webm'});
      if(lastExport&&lastExport.url){ try{URL.revokeObjectURL(lastExport.url);}catch(e){} }
      lastExport={ blob:blob, url:URL.createObjectURL(blob) };
      $('busychip').style.display='none';
      if(cb)cb(lastExport);
    };
    var vsecs=Math.max(voices[0]?voices[0].s:0, voices[1]?voices[1].s:0);
    var loops=Math.max(1, Math.ceil(vsecs/(pages.length/fps)));
    var totalFrames=pages.length*loops;
    var f=0;
    rec.start();
    var t=setInterval(function(){
      ex.fillStyle='#efe6d0'; ex.fillRect(0,0,CW,CH+44);
      var im=imgs[f%pages.length];
      if(im)ex.drawImage(im,0,0,CW,CH);
      ex.fillStyle='rgba(42,36,56,0.55)'; ex.font='600 17px system-ui,sans-serif'; ex.textAlign='center';
      ex.fillText('made with FLIPBOOK · lucidwinds.com', CW/2, CH+28);
      f++;
      if(f>=totalFrames+2){ clearInterval(t); setTimeout(function(){ try{rec.stop();}catch(e){} },220); }
    },1000/fps);
  }
  for(i=0;i<pages.length;i++)(function(idx){
    if(!pages[idx]){ imgs[idx]=null; if(--left===0)ready(); return; }
    var im=new Image();
    im.onload=function(){ imgs[idx]=im; if(--left===0)ready(); };
    im.onerror=function(){ imgs[idx]=null; if(--left===0)ready(); };
    im.src=pages[idx];
  })(i);
}
$('b-export').addEventListener('click',function(){
  exportVideo(function(out){
    if(!out)return;
    var a=document.createElement('a'); a.href=out.url; a.download='flipbook.webm';
    document.body.appendChild(a); a.click(); a.remove();
    toastHint('Saved! Check your downloads for flipbook.webm.');
  });
});

/* ---------- share ---------- */
var SHARE_TXT='I made a flipbook! 📓 Made with Flipbook by Sky Wolf Studios';
var SHARE_URL='https://lucidwinds.com/satellites/flipbook/';
$('b-share').addEventListener('click',function(){
  function plainShare(){
    try{ if(navigator.share){ navigator.share({text:SHARE_TXT,url:SHARE_URL})['catch'](function(){}); return; } }catch(e){}
    try{ navigator.clipboard.writeText(SHARE_TXT+'\n'+SHARE_URL); toastHint('Link copied!'); }catch(e){}
  }
  if(canExport()&&pages.length>1&&navigator.canShare){
    exportVideo(function(out){
      if(!out){ plainShare(); return; }
      try{
        var file=new File([out.blob],'flipbook.webm',{type:'video/webm'});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],text:SHARE_TXT+' '+SHARE_URL})['catch'](function(){});
          return;
        }
      }catch(e){}
      plainShare();
    });
  } else plainShare();
});

/* ---------- add to home screen (Dewball pattern) ---------- */
(function(){
  var btn=$('b-install'); if(!btn)return;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  function standalone(){ return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||!!window.navigator.standalone; }
  if(standalone()){ btn.style.display='none'; return; }
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; });
  btn.addEventListener('click',function(){
    if(deferred){ deferred.prompt(); deferred=null; return; }
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    alert(ios ? 'To add Flipbook to your Home Screen:\n\nTap the Share button, then Add to Home Screen.'
              : 'To add Flipbook to your Home Screen:\n\nOpen the browser menu, then Add to Home Screen or Install.');
  });
})();

/* ---------- hints ---------- */
var hintT=null;
function toastHint(m){ var h=$('hint'); h.textContent=m;
  if(hintT)clearTimeout(hintT);
  hintT=setTimeout(function(){ h.textContent='Draw, flip to the next page, and your last page shows through faint so you can animate. Then press play.'; },3200); }

/* ---------- tools ui ---------- */
(function buildColors(){
  var row=$('colors');
  INKS.forEach(function(c,i){
    var d=document.createElement('div');
    d.className='swatch'+(i===0?' on':''); d.style.background=c;
    d.addEventListener('click',function(){
      color=c; erasing=false; $('b-erase').classList.remove('on');
      var all=row.querySelectorAll('.swatch'),k; for(k=0;k<all.length;k++)all[k].classList.remove('on');
      d.classList.add('on');
    });
    row.appendChild(d);
  });
})();
(function buildWidths(){
  var dots=document.querySelectorAll('.wdot'),k;
  for(k=0;k<dots.length;k++)(function(d){
    d.addEventListener('click',function(){
      width=parseInt(d.getAttribute('data-w'),10)||6;
      var all=document.querySelectorAll('.wdot'),q; for(q=0;q<all.length;q++)all[q].classList.remove('on');
      d.classList.add('on');
    });
  })(dots[k]);
})();
$('b-erase').addEventListener('click',function(){
  erasing=!erasing; $('b-erase').classList.toggle('on',erasing);
});

/* ---------- sunbeams for sustained animating (creative-tool standard) ---------- */
sunTimer=setInterval(function(){
  if(!drawnThisSession)return;
  drawTicks++; drawnThisSession=false;
  if(drawTicks%4===0){ /* about every 2 minutes of actual drawing */
    try{ if(window._sbCapEarn)window._sbCapEarn(1,'flipbook:draw'); }catch(e){}
  }
},30000);

/* ---------- portal exit (smart back) + embed handshake ---------- */
window.SWS_EXIT=function(){ if(/[?&]embed=1(&|$)/.test(location.search)&&window.parent!==window){ try{ window.parent.postMessage({sws:'close'},'*'); }catch(e){} return; }
  if(document.referrer.indexOf('/portal')>=0&&history.length>1){history.back();}else{location.replace('https://lucidwinds.com/portal/');} };
(function(){
  if(/[?&]embed=1(&|$)/.test(location.search)&&window.parent!==window){ try{ window.parent.postMessage({sws:'ready'},'*'); }catch(e){} }
})();

/* ---------- boot ---------- */
load();
showPage();

/* ---------- dev hook ---------- */
if(/[?&]fbtest=1/.test(location.search)){
  window.FB_DEV={
    state:function(){ return { cur:cur, pages:pages.length, fps:fpsOptions[fpsIdx], onion:onionOn, firstGhost:firstOn, playing:playing, cinema:cinema,
      canExport:canExport(), canRecord:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),
      voices:[!!voices[0],!!voices[1]], pointerFallback:!window.PointerEvent }; },
    stroke:function(x0,y0,x1,y1){ lx=x0; ly=y0; strokeTo(x1,y1); commitPage(); return true; },
    go:go, play:startPlay, stop:stopPlay,
    firstGhost:function(v){ firstOn=!!v; showPage(); return firstOn; },
    cinemaOn:enterCinema, cinemaOff:exitCinema,
    exportTest:function(){ return new Promise(function(res){ exportVideo(function(out){ res(out?{size:out.blob.size,type:out.blob.type}:null); }); }); },
    pageData:function(i){ return (pages[i]||'').slice(0,40); }
  };
}
})();
