<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- The arcade's workbench gate: In Development games ask for the tester key (lucid-winds dev-gate.js). -->
<script async src="/dev-gate.js?v=2"></script>
<!-- No viewport-fit=cover: with it, Chrome on Android 15 draws the page under the phone's own buttons, and on
     Stephen's Pixel the bottom row of the tray sat hidden behind them (Sep 19). Without it the browser keeps the whole
     page above the system bars. The tray still pads by the safe-area inset for any browser that reports one. -->
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<!-- Opened from the installed arcade app on Android, the page runs in the app's window, which Android draws under
     the phone's own navigation buttons while reporting no inset for them (Stephen's Pixel, Sep 19: the tray's bottom
     row sat behind back/home). There the tray keeps clear of a 48 px button bar (.navpad). ?navpad forces it (tests). -->
<script>
try {
  if (/[?&]navpad\b/.test(location.search) || (/Android/i.test(navigator.userAgent) &&
      matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches)) document.documentElement.classList.add('navpad');
} catch (e) { /* no matchMedia: a browser tab, nothing to do */ }
</script>
<title>Tiny World</title>
<link rel="icon" href="data:,">
<!-- The pixel font never holds the page up: a stalled fonts host would otherwise leave it blank (media swap). -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#1d2b1f;--panel:#2b1d14;--panel2:#3a281b;--tile:#e9d8a6;--ink:#2b1d14;--text:#f3ead2;--dim:#b9a98a;--sel:#ffd23f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#162118}}
:root[data-theme="dark"]{--bg:#162118}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* No pull-to-refresh and no swipe-back from the header or status line: either would throw the world away. */
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:"Pixelify Sans","Courier New",monospace;font-variant-ligatures:none;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);font-size:14px}
#day{font-weight:600;white-space:nowrap}
#counts{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
#counts span{display:flex;align-items:center;gap:2px;white-space:nowrap}
#counts img,.item img{image-rendering:pixelated;pointer-events:none}
#counts img{width:16px;height:16px}
button{font:inherit;color:inherit;cursor:pointer}
.ctl{background:var(--panel2);border:2px solid #5a4330;padding:3px 8px;min-width:40px}
.ctl:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
#c{position:absolute;left:0;top:0}
/* The zoom rail (design 14 §3): a vertical slider on the right edge, low enough for a thumb; + and − at its ends. */
#rail{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:4px;width:48px}
#track{position:relative;width:48px;height:clamp(96px,26vh,220px);background:rgba(16,24,16,.55);border:2px solid #5a4330;touch-action:none}
#knob{position:absolute;left:4px;right:4px;height:28px;background:var(--panel2);border:2px solid var(--sel);pointer-events:none}
/* 44×44 (bible 02 §1) without growing the header: the negative margins let it span the header's padding. */
#menu{min-width:44px;min-height:44px;margin:-6px 0;font-size:18px;position:relative}
/* The save disk (design 14 §7 T1): clear until a save lands, then one soft pulse. Never takes a tap. */
#disk{position:absolute;top:1px;right:1px;width:16px;height:16px;background-size:16px 16px;image-rendering:pixelated;opacity:0;pointer-events:none}
#disk.pulse{animation:disk 1.4s ease-out}
@keyframes disk{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
/* The header Export while saves fail (02 §10): the disk picture, never a word only (14 §1 rule 4). */
/* Header pictures (design 14 §1 rule 4): Undo (going backwards), Snapshot (its picture once taken; hold to go back to it),
   Pause / Play. 44 px, spanning the header's padding like the menu button. */
.ctl.icon{min-width:44px;min-height:44px;margin:-6px 0;padding:0;background-repeat:no-repeat;background-position:center;background-size:24px 24px;image-rendering:pixelated}
#undo.off{opacity:.35}
#snap{position:relative;overflow:hidden;background-size:32px 32px}
#snap.has{background-size:cover}
#snap.has::after{content:'';position:absolute;right:1px;bottom:1px;width:12px;height:12px;background:var(--snapIcon) center/12px 12px no-repeat;image-rendering:pixelated}
#snap.holding::before{content:'';position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(242,208,59,.6);animation:snapfill var(--hold,700ms) linear forwards}
@keyframes snapfill{to{height:100%}}
#rescue{min-width:44px;min-height:44px;margin:-6px 0;background-repeat:no-repeat;background-position:center;background-size:24px 24px;image-rendering:pixelated}
/* ?bench's result (design 14 §7 T2): stays until tapped, big enough to read or photograph on a phone. */
#benchCard{position:fixed;left:16px;right:16px;top:25%;background:var(--panel);border:3px solid #5a4330;padding:16px;z-index:4;font-size:18px;line-height:1.5;display:none}
#benchCard.on{display:block}
#benchCard b{font-size:22px}
#benchCard small{display:block;color:var(--dim);font-size:12px;margin-top:8px;word-break:break-all}
#bootfail{position:fixed;inset:0;background:#0f1510;display:none;align-items:center;justify-content:center;z-index:6;padding:16px;text-align:center}
#bootfail.on{display:flex}
#bootfail button{min-height:48px;min-width:160px;margin-top:12px;background:var(--panel2);border:2px solid #5a4330}
#sheet{position:fixed;inset:0;background:rgba(10,14,10,.72);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#sheet.on{display:flex}
#sheet .box{background:var(--panel);border:3px solid #5a4330;padding:16px;width:100%;max-width:360px;max-height:100%;overflow-y:auto;overscroll-behavior:contain}
#sheet h2{margin:0 0 12px;font-size:18px;font-weight:600}
#sheet .lbl{font-size:13px;color:var(--dim);margin:0 0 6px}
#sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
#sizes button,#sheet .row button{min-height:48px;background:var(--panel2);border:2px solid #5a4330;padding:6px;text-align:left}
#sizes button small,#days button small{display:block;color:var(--dim);font-size:11px}
#days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
#days button{min-height:48px;background:var(--panel2);border:2px solid #5a4330;padding:6px;text-align:left}
#days button.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--ink) inset}
#sizes button.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--ink) inset}
#sheet .row{display:flex;gap:8px;justify-content:flex-end}
#sheet .row button{min-width:96px;text-align:center}
#worlds{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;overscroll-behavior:none;touch-action:pan-x}
#worlds button{flex:0 0 auto;min-width:76px;min-height:76px;background:var(--panel2);border:2px solid #5a4330;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
#worlds img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
#sheet .row.files{justify-content:space-between;margin-top:4px}
#soundLbl{margin-top:14px}
#sheet .row.sound{justify-content:space-between;margin-bottom:4px}
#sheet .row.sound button{min-width:0;flex:1;font-size:13px}
#rail button{width:48px;height:48px;background:var(--panel2);border:2px solid #5a4330;font-size:24px;line-height:1;padding:0}
/* The words at the bottom (15 A3): a window the sentences travel across, an answer that never crawls, and the
   Today sheet a tap opens. */
#info{position:relative;background:#111a13;font-size:13px;height:30px;overflow:hidden;touch-action:none}
#newsStrip{position:absolute;left:0;top:0;height:30px;display:flex;align-items:center;gap:48px;white-space:nowrap;will-change:transform}
#newsStrip .newsItem{display:inline-flex;align-items:center;gap:6px;padding:0 10px}
#newsStrip img,#answer img,#today img{width:16px;height:16px;image-rendering:pixelated}
#answer{position:absolute;inset:0;background:#1d2a20;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
#answer[hidden]{display:none}
#answer .newsItem{display:inline-flex;align-items:center;gap:6px}
#today{position:absolute;left:8px;right:8px;bottom:8px;max-height:60%;overflow-y:auto;z-index:7;background:var(--panel2);border:3px solid #9c8a5c;padding:8px;display:flex;flex-direction:column;gap:8px}
#today[hidden]{display:none}
#today .todayRow{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;line-height:1.3;min-height:32px}
#tray{background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
.navpad #tray{padding-bottom:max(env(safe-area-inset-bottom,0px),48px)}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none;overscroll-behavior:none;touch-action:pan-x}
.tab{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-size:14px;color:var(--dim)}
.tab.on{color:var(--text);border-bottom-color:var(--sel)}
#items{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:62px;gap:6px;overflow-x:auto;padding:8px;overscroll-behavior:none;touch-action:pan-x}
.item{background:var(--tile);color:var(--ink);border:3px solid #9c8a5c;padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:1;min-height:56px;overflow:hidden}
.item img{width:28px;height:28px}
/* The pinned column (design 14 §3): the tool state on top (a big picture; tap: back to the Hand), Erase under it. */
.item.tool{position:sticky;left:0;z-index:1;background:#3a2a1c;color:#f3e9cf;border-color:var(--sel);box-shadow:none}
.item.tool.hand{border-color:#9c8a5c}
.item.tool img{width:32px;height:32px}
.item.tool img.badge{position:absolute;left:2px;top:2px;width:16px;height:16px}
/* ★ on an item the player starred; the Everything / Fewer tile; the ★ tab (design 14 §7 T7). */
.item{position:relative}
.item.fav::after{content:'★';position:absolute;right:3px;top:1px;color:#e0a800;font-size:13px;line-height:1}
.item.more{background:#efe3c0}
.tab.star{color:#e0a800}
.item.erase{background:#f0b0a8;border-color:#a8453a;position:sticky;left:0;z-index:1}
.item.erase.on{background:#f0b0a8}
/* Spray chip (14 §3): bottom-left of the field, 48 px, the picture shows on / off. */
#spray{position:absolute;left:8px;bottom:8px;width:48px;height:48px;background-color:var(--panel2);border:2px solid #5a4330;background-repeat:no-repeat;background-position:center;background-size:32px 32px;image-rendering:pixelated;padding:0}
#spray.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--ink) inset}
/* While a finger is pouring (15 A2) the chip lights, so what is happening has a name on screen. */
#spray.pouring{border-color:var(--sel);background-color:#fff3c4}
/* Follow-cam's big ✕ (14 §3): the top-right edge of the field. */
#unfollow{position:absolute;right:8px;top:8px;width:56px;height:56px;font-size:30px;line-height:1;background:var(--panel2);border:2px solid #5a4330;color:var(--text);padding:0}
/* Crowded-patch picker (14 §3): up to five pictures in a row above the finger. */
#picker{position:absolute;display:flex;gap:6px;z-index:2}
#picker[hidden]{display:none}
#picker button{width:48px;height:48px;background:var(--tile);border:3px solid #9c8a5c;padding:4px}
#picker img{width:32px;height:32px;image-rendering:pixelated;pointer-events:none}
/* Because card (14 §4): three enlarged pictures beside the spot, A + B -> the result. It fades on its own and
   never takes a touch, so the world keeps playing under it. */
#because{position:absolute;display:flex;align-items:center;gap:6px;z-index:2;pointer-events:none;background:var(--panel2);border:3px solid #9c8a5c;padding:6px 8px}
#because[hidden]{display:none}
/* The paper doll (14 §7 T10): whoever was poked, bigger, with the six slots beside them. Never takes a touch. */
#doll{position:absolute;left:8px;bottom:8px;z-index:2;pointer-events:none;background:var(--panel2);border:3px solid #9c8a5c;padding:2px;line-height:0}
#doll[hidden]{display:none}
#doll canvas{image-rendering:pixelated;width:196px;height:78px}
/* The one thing on the doll a finger can touch: name this creature (14 §7 T11). 48 px, as everything is. */
#doll button{position:absolute;right:-6px;top:-14px;pointer-events:auto;min-width:48px;height:48px;background:var(--panel2);border:3px solid #9c8a5c;color:var(--text);font:inherit;font-size:13px;padding:0 8px}
#doll button::before{content:"\270E"}
/* The sheet of names: big tappable cards, no reading needed to pick one. */
#namesheet{position:absolute;left:8px;right:8px;bottom:100px;z-index:4;background:var(--panel2);border:3px solid #9c8a5c;padding:8px;display:flex;flex-direction:column;gap:8px}
#namesheet[hidden]{display:none}
#namesheet>div{display:flex;flex-wrap:wrap;gap:8px}
#namesheet button{min-width:88px;min-height:48px;background:var(--tile);border:3px solid #9c8a5c;color:var(--ink);font:inherit;font-size:15px}
#namesheet button.wide{width:100%}
/* The Scrapbook (14 §4.3): three pages, nothing to read to use it. */
#scrap{position:absolute;inset:0;z-index:6;background:var(--panel2);display:flex;flex-direction:column;overflow:hidden}
#scrap[hidden]{display:none}
#scrap .tabs{display:flex;gap:6px;padding:8px;flex:0 0 auto}
#scrap .tabs button{min-height:48px;padding:0 12px;background:var(--panel);border:3px solid #9c8a5c;color:var(--text);font:inherit;font-size:15px}
#scrap .tabs button.on{background:var(--tile);color:var(--ink)}
#scrap .tabs button.done{margin-left:auto}
#scrap .body{flex:1 1 auto;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
#scrap .card{width:calc(50% - 4px);background:var(--panel);border:3px solid #9c8a5c;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
#scrap .card img.shot{width:100%;image-rendering:pixelated}
#scrap .pics{display:flex;align-items:center;gap:4px}
#scrap .pics img{width:24px;height:24px;image-rendering:pixelated}
#scrap .pics span{color:var(--text)}
#scrap .card button{min-height:48px;width:100%;background:var(--tile);border:3px solid #9c8a5c;color:var(--ink);font:inherit;font-size:15px}
#scrap .sticker{width:calc(33.33% - 6px);background:var(--panel);border:3px solid #9c8a5c;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#scrap .sticker img{width:40px;height:40px;image-rendering:pixelated}
#scrap .sticker span{color:var(--text);font-size:12px;text-align:center;line-height:1.2}
#scrap .sticker.gone{opacity:.55}
#scrap .empty{color:var(--text);padding:12px;font-size:15px}
/* The counters' card (?counts, 14 §7 T14). */
#counts-card{position:absolute;left:12px;right:12px;top:12px;z-index:7;background:var(--panel2);border:3px solid #9c8a5c;color:var(--text);padding:10px;font-size:14px;line-height:1.5}
#counts-card p{margin:0}
#counts-card b{display:block;margin-bottom:6px}
#scrapB.new{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel) inset}
#because img{width:40px;height:40px;image-rendering:pixelated}
/* A newborn is drawn at its own size, so a birth card reads sheep + sheep -> lamb (15 A5). */
#because img.baby{width:30px;height:30px;align-self:flex-end}
#because span{color:var(--text);font-size:20px;line-height:1}
.item.on{border-color:var(--sel);background:#fff3c4;box-shadow:0 0 0 2px var(--ink) inset}
</style>
</head>
<body>
<header>
  <button class="ctl" id="menu">☰<i id="disk"></i></button>
  <div id="day"></div>
  <div id="counts"></div>
  <button class="ctl icon" id="undo"></button>
  <button class="ctl icon" id="snap"></button>
  <button class="ctl" id="scrapB">★</button>
  <button class="ctl icon" id="pause"></button>
  <button class="ctl" id="speed"></button>
  <button class="ctl" id="rescue" hidden></button>
</header>
<div id="wrap"><canvas id="c"></canvas><div id="rail"><button id="zin">+</button><div id="track"><div id="knob"></div></div><button id="zout">−</button></div><button id="spray" hidden></button><button id="unfollow" hidden>✕</button><div id="picker" hidden></div><div id="because" hidden></div><div id="doll" hidden><canvas></canvas><button></button></div><div id="namesheet" hidden></div><div id="scrap" hidden></div></div>
<div id="info"><div id="newsStrip"></div><div id="answer" hidden></div></div><div id="today" hidden></div>
<div id="tray"><div id="tabs"></div><div id="items"></div></div>
<!-- Shown by main.js when the game's files cannot be loaded; plain text here because strings.json may be what failed. -->
<div id="benchCard" role="status"></div>
<div id="bootfail" role="alert"><div class="box"><h2>Tiny World did not load</h2><p>The connection went quiet while the game was opening.</p><button id="bootRetry">Try again</button></div></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="box">
  <h2 id="sheetTitle"></h2>
  <p class="lbl" id="sizeLbl"></p>
  <div id="sizes"></div>
  <p class="lbl" id="dayLbl"></p>
  <div id="days"></div>
  <div class="row"><button id="cancelNew"></button><button id="startNew"></button></div>
  <p class="lbl" id="worldsLbl" hidden></p>
  <div id="worlds"></div>
  <div class="row files"><button id="exportB"></button><button id="importB"></button></div>
  <div class="row files"><button id="clearW"></button></div>
  <p class="lbl" id="soundLbl"></p>
  <div class="row sound"><button id="sndB"></button><button id="musB"></button><button id="quietB"></button></div>
  <div class="row sound"><button id="newsB"></button></div>
  <input type="file" id="importF" accept=".tinyworld,.json,application/gzip,application/json" hidden>
</div></div>
<!-- The boot watchdog (a plain script, so it runs even where the game's modules cannot): if any game file fails to
load, parse or link, or the game has not started 30 s after the page began, it shows the Try again panel instead of
a blank page. main.js sets window.__twStarted once every module has loaded, and takes down a panel shown too early. -->
<script>
(function () {
  function show() {
    if (window.__twStarted) return;
    var b = document.getElementById('bootfail');
    if (!b) return;
    b.classList.add('on');
    document.getElementById('bootRetry').onclick = function () { location.reload(); };
  }
  window.__twBootFail = show;
  addEventListener('error', function (e) { if (e.filename && e.filename.indexOf('/src/') >= 0) show(); }, true);
  setTimeout(show, 30000); // a slow phone on a slow line can take a while; main.js also takes the panel down when it starts
})();
</script>
<script type="module" src="./20260920f/src/main.js" onerror="window.__twBootFail && window.__twBootFail()"></script>
</body>
</html>
