<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<meta name="description" content="Learn knots and put them to work, one small job at a time, then tie them with real rope.">
<title>BIGHT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIGHT">
<style>
/* ===== BIGHT styles. Tokens first; every size in rem so the text setting scales the whole app. ===== */
:root{
  --paper:#F4EFE6;--card:#FBF8F2;--ink:#2B2F36;--muted:#575C64;--line:#D8CFBF;--soft:#EAE3D6;
  --rope:#C9A46C;--navy:#2E4A6B;--accent:#E07A3F;--accent-ink:#A24E1A;--good:#2F6B43;--warn:#8A4500;
  --focus:#1F5FA8;--hi:#F2C14E;--canvas:#FBF8F2;
  --shadow:0 1px 2px rgba(43,47,54,.10),0 6px 18px rgba(43,47,54,.07);
  --r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html.hc{--paper:#FFFFFF;--card:#FFFFFF;--ink:#000000;--muted:#1E1E1E;--line:#000000;--soft:#E9E9E9;--accent-ink:#7A3200;--canvas:#FFFFFF;--shadow:none}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-text="lg"]{font-size:125%}html[data-text="xl"]{font-size:150%}html[data-text="xxl"]{font-size:200%}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:var(--app-h,100vh);max-width:760px;margin:0 auto;position:relative;overflow:hidden}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus,[data-focus]:focus{outline:none}
.icon{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* header and nav */
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:.25rem;min-height:56px;padding:calc(4px + var(--sat)) .25rem 4px 1rem;border-bottom:1px solid var(--line);background:var(--paper)}
.hdr[hidden],.nav[hidden]{display:none}
.hdr .brand{font-weight:800;letter-spacing:.16em;font-size:.9rem;color:var(--muted);padding-right:.6rem;margin-right:.1rem;border-right:2px solid var(--line)}
.hdr .brand:last-of-type+.title:empty{display:none}
.hdr .title{flex:1 1 auto;min-width:0;margin:0;font-size:1.05rem;font-weight:700;overflow-wrap:anywhere}
.hdr .back+.title{padding-left:.15rem}
.iconbtn{min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:12px;cursor:pointer;padding:0 .5rem;gap:.35rem}
.iconbtn:active{background:var(--soft)}
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:1rem 1rem 1.5rem;outline:none}
.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--paper);padding-bottom:var(--sab)}
.nav .tab{flex:1 1 0;min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;padding:.35rem .25rem}
.nav .tab[aria-current="page"]{color:var(--ink)}
.nav .tab[aria-current="page"] .icon{stroke-width:2.6}
.nav .tab span{overflow-wrap:anywhere;text-align:center;line-height:1.15}
/* type and blocks */
h1,h2,h3{line-height:1.2;margin:0}
.h1{font-size:1.6rem;font-weight:800}.h2{font-size:1.2rem;font-weight:750}.h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:1rem}.stack.tight{gap:.5rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.row.end{justify-content:flex-end}
html[data-text="xl"] .row>.btn,html[data-text="xxl"] .row>.btn{flex:1 1 100%}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem 1.05rem;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:650;cursor:pointer;text-align:center;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn{padding-left:min(1.05rem,16px);padding-right:min(1.05rem,16px);gap:min(.45rem,8px)}.btn .icon{width:min(1.5rem,26px);height:min(1.5rem,26px)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn.quiet{border-color:var(--line)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active:not([disabled]){transform:translateY(1px)}
.tag{display:inline-flex;align-items:center;min-height:1.6rem;padding:.1rem .6rem;border-radius:999px;border:1.5px dashed var(--muted);font-size:.78rem;font-weight:650;color:var(--muted);white-space:nowrap}
.tag.solid{border-style:solid}
.banner{border:2px solid var(--warn);background:#FFF4E0;color:#4A2600;border-radius:12px;padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
html.hc .banner{background:#fff;color:#000}
.banner p{flex:1 1 12rem}
.lede{font-size:1.15rem}
.hero{padding:1.5rem 0 .5rem}
.hero .h1{font-size:min(2.6rem,16vw);letter-spacing:.12em}
h1,h2,h3,p,li,legend,summary{overflow-wrap:break-word}
.foot{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.stamp{font-size:.72rem;color:var(--muted)}
/* settings controls */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:700;margin-bottom:.4rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{min-height:48px;min-width:48px;padding:.4rem .9rem;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.switch{display:flex;width:100%;align-items:center;gap:.75rem;min-height:56px;padding:.4rem 0;border:0;background:transparent;text-align:left;cursor:pointer}
.switch .lbl{flex:1 1 auto;min-width:0}
.switch .lbl small{display:block;color:var(--muted);font-size:.85rem}
.switch .knob{flex:0 0 auto;width:3.1rem;height:1.8rem;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--good)}
.switch[aria-checked="true"] .knob::after{transform:translateX(1.3rem)}
textarea,input[type="text"],input[type="search"]{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:.6rem .75rem}
textarea{min-height:7rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
details>summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:650}
ul.plain{list-style:none;margin:0;padding:0}
.kit li{margin:.35rem 0}
.toast{position:absolute;left:1rem;right:1rem;bottom:calc(76px + var(--sab));background:var(--ink);color:var(--paper);border-radius:12px;padding:.75rem 1rem;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:none}
.devlist li{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;padding:.3rem 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
/* rope stage (the canvas) */
.stage{position:relative;width:100%;background:var(--canvas);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.rtest{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1rem}
.rtest .stage{height:300px}
.sheet{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}.sheet .stage{height:auto;aspect-ratio:1}.sheet figcaption{font-size:.78rem}
.rtest figcaption{font-size:.85rem;padding:.3rem 0}
/* workbench, rope mode, outcome: full-screen flows with their own bar */
#view[data-screen="bench"],#view[data-screen="rope"],#view[data-screen="outcome"]{padding:0;overflow:hidden;display:flex;flex-direction:column}
.flow{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.flowbar{flex:0 0 auto;display:flex;align-items:center;gap:.15rem;min-height:56px;padding:calc(4px + var(--sat)) .25rem 4px .25rem;border-bottom:1px solid var(--line)}
.flowbar .bt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.2;padding:0 .25rem}
.flowbar .kicker{font-size:min(.75rem,14px);color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flowbar .kname{font-weight:750;font-size:min(1rem,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flowbar .icon{width:min(1.5rem,28px);height:min(1.5rem,28px)}
html[data-text="xl"] .benchstage{max-height:calc(var(--app-h,100vh) * 0.46)}html[data-text="xxl"] .benchstage{max-height:calc(var(--app-h,100vh) * 0.4)}
html[data-text="xl"] .ctrl .lbl,html[data-text="xxl"] .ctrl .lbl{display:none}
html[data-text="xl"] .ctrl.stackable,html[data-text="xxl"] .ctrl.stackable,html[data-text="lg"] .ctrl.stackable{flex-direction:column}
.ctrl .btn{white-space:normal}
@media (max-width:340px){.ctrl .lbl{display:none}}
.ctrl.stackable .btn,html[data-text] .ctrl.stackable .btn.next{flex:0 0 auto}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.benchstage{flex:0 0 auto;width:100%;aspect-ratio:1/1;max-height:calc(var(--app-h,100vh) * 0.58);border-radius:0;border-left:0;border-right:0;border-top:0;position:relative}
.benchstage.rope{max-height:calc(var(--app-h,100vh) * 0.6)}
.fxpill{position:absolute;left:50%;top:.6rem;transform:translateX(-50%);display:none;align-items:center;gap:.35rem;background:var(--ink);color:var(--paper);border-radius:999px;padding:.3rem .8rem;font-weight:700;font-size:.85rem;pointer-events:none}
.fxpill.show{display:inline-flex}
.altpill{position:absolute;left:.6rem;bottom:.6rem;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:.15rem .7rem;font-weight:700;font-size:.8rem;pointer-events:none}
.panel{flex:1 1 auto;min-height:0;overflow-y:auto;padding:.85rem 1rem .5rem;display:flex;flex-direction:column;gap:.7rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center}
.stagelbl{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.stepno{font-size:.85rem;color:var(--muted);font-weight:650}
.instr{font-size:1.1rem;line-height:1.4}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.choices.three{grid-template-columns:1fr}
html[data-text="xl"] .choices,html[data-text="xxl"] .choices{grid-template-columns:1fr}
.choices .btn{min-height:64px;font-size:1.05rem;border-width:2.5px}
.feedback{border-radius:12px;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.45rem}
.feedback.good{background:#E3F0E6;border:2px solid var(--good)}
.feedback.bad{background:#FBEBDD;border:2px solid var(--accent-ink)}
html.hc .feedback.good,html.hc .feedback.bad{background:#fff}
.fxline{display:flex;align-items:center;gap:.4rem;font-weight:800}
.ctrl{flex:0 0 auto;display:flex;gap:.5rem;padding:.6rem 1rem calc(.6rem + var(--sab));border-top:1px solid var(--line);background:var(--paper)}
.ctrl .btn{flex:1 1 0;min-width:0;padding-left:.5rem;padding-right:.5rem}
.ctrl .btn.next{flex:1.4 1 0}
.ctrl[hidden]{display:none}
@keyframes fx-slip{0%{transform:none}35%{transform:translateY(7%);opacity:.65}100%{transform:none;opacity:1}}
@keyframes fx-loosen{0%{transform:none}30%{transform:scale(1.06) rotate(-1.2deg)}55%{transform:scale(1.04) rotate(1deg)}100%{transform:none}}
@keyframes fx-dropOff{0%{transform:none}40%{transform:translateY(11%) rotate(4deg);opacity:.5}100%{transform:none;opacity:1}}
@keyframes fx-jam{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.benchstage canvas.fx-slip{animation:fx-slip .9s ease-in-out}.benchstage canvas.fx-loosen{animation:fx-loosen .9s ease-in-out}
.benchstage canvas.fx-dropOff{animation:fx-dropOff 1s ease-in-out}.benchstage canvas.fx-jam{animation:fx-jam .5s linear}
/* rope mode */
.ropetext{font-size:1.5rem;line-height:1.35;font-weight:600}
.countdown{font-size:.95rem;color:var(--muted);font-weight:650}
.logbtns{display:flex;flex-direction:column;gap:.5rem}
.logbtns .btn{justify-content:flex-start;text-align:left;min-height:56px}
/* postcard */
.postcard{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#EEF0E4}
.pcwrap{position:relative}
.pclabel{position:absolute;right:.5rem;top:.5rem;background:rgba(43,47,54,.85);color:#fff;border-radius:999px;padding:.1rem .6rem;font-size:.75rem;font-weight:700}
.pc-flag{display:none}.pc-flag.on{display:inline}
@keyframes pcIn{0%{opacity:0;transform:translateY(-8px)}60%{opacity:1}100%{opacity:1;transform:none}}
.pc-flag.pc-new{animation:pcIn 1.3s ease-out;transform-box:fill-box}
@keyframes pcRing{0%,100%{opacity:.35}50%{opacity:1}}
.pc-focus{animation:pcRing 1.6s ease-in-out infinite}
.dusk #pc-sky-dusk{opacity:1}
.dusk #pc-sun{opacity:0}
#pc-sky-dusk{transition:opacity 1.4s}
/* today and jobs */
.stamp-box{align-self:flex-start;display:flex;flex-direction:column;align-items:center;border:3px double var(--accent-ink);color:var(--accent-ink);border-radius:10px;padding:.35rem .9rem;transform:rotate(-3deg);font-weight:800;letter-spacing:.12em;font-size:.8rem}
.stamp-box b{font-size:1rem;letter-spacing:.04em}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dots span.on{background:var(--good);border-color:var(--good)}
.jobrow{display:flex;align-items:center;gap:.75rem;width:100%;min-height:64px;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:left;cursor:pointer;color:var(--ink)}
.jobrow[disabled]{opacity:.55;cursor:default}
.jobrow .num{flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--ink)}
.jobrow.done .num{background:var(--good);border-color:var(--good);color:#fff}
.jobrow .jt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.jobrow .jt b{overflow-wrap:anywhere}
.jobrow .jt small{color:var(--muted);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:48px;padding:.35rem .9rem;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:650;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* knot card and drawer */
.kcard dl{margin:0;display:grid;grid-template-columns:minmax(5.5rem,auto) 1fr;gap:.45rem .8rem}
.kcard dt{font-weight:750}.kcard dd{margin:0;min-width:0;overflow-wrap:anywhere}
html[data-text="xl"] .kcard dl,html[data-text="xxl"] .kcard dl{grid-template-columns:1fr;gap:.1rem}html[data-text="xl"] .kcard dd,html[data-text="xxl"] .kcard dd{margin-bottom:.5rem}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tags span{border:1.5px solid var(--ink);border-radius:999px;padding:.12rem .6rem;font-size:.82rem;font-weight:650}
.scrim{position:absolute;inset:0;background:rgba(20,22,26,.45);z-index:40;display:flex;align-items:flex-end}
.drawer{background:var(--paper);width:100%;max-height:85%;overflow-y:auto;border-radius:18px 18px 0 0;padding:1rem 1rem calc(1rem + var(--sab));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:700px){.kcard dl{grid-template-columns:8rem 1fr}}
/* editor (dev) */
#view[data-screen="editor"]{padding:0}
.ed{display:flex;flex-direction:column}
.edstage{position:relative;width:100%;aspect-ratio:1/1;max-height:52vh;border-radius:0;border-left:0;border-right:0}
.edstage canvas.ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.edtools{display:flex;flex-wrap:wrap;gap:.35rem;padding:.5rem .75rem;border-bottom:1px solid var(--line)}
.edtools .btn{min-height:48px;padding:.3rem .6rem;font-size:.85rem}
.edtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;padding:.5rem .75rem}
.edtabs button{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:650;font-size:.82rem;padding:.2rem}
.edtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.edpanel{padding:.25rem .75rem 2rem;display:flex;flex-direction:column;gap:.65rem}
.edpanel label{display:flex;flex-direction:column;gap:.25rem;font-weight:650;font-size:.85rem}
.edrow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.edrow .btn{min-height:48px;padding:.3rem .65rem;font-size:.85rem}
.edrow .val{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-width:3.5rem}
.edcard{border:1.5px solid var(--line);border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.45rem;background:var(--card)}
.edcard.sel{border-color:var(--accent-ink)}
.edmsg{font-size:.85rem;color:var(--muted)}
.ederr li{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;padding:.25rem 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
select{min-height:48px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:.3rem .5rem;font:inherit}
input[type="date"]{min-height:48px;border:2px solid var(--line);border-radius:10px;padding:.3rem .5rem;font:inherit;background:#fff}
html.rm *{transition:none!important;animation:none!important}
</style>
</head>

</div>
