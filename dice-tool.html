<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dice Crop Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#e8dcc8;font-family:system-ui;padding:20px}
h1{font-size:18px;color:#c8a84b;margin-bottom:10px}
.ref{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.ref img{width:80px;height:80px;border-radius:10px;border:2px solid #4a7c35;object-fit:cover}
.ref span{font-size:12px;color:#7ab356}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.controls button{padding:10px 16px;background:#1a1f17;border:1.5px solid #4a7c35;color:#e8dcc8;border-radius:8px;font-size:14px;cursor:pointer;min-width:48px;min-height:48px}
.controls button:active{background:#2a3a22}
.controls input{width:60px;padding:8px;background:#1a1f17;border:1px solid #4a7c35;color:#e8dcc8;border-radius:6px;font-size:14px;text-align:center}
.preview{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.die-box{text-align:center}
.die-box canvas{border:2px solid #4a7c35;border-radius:10px;background:#0d100c}
.die-box div{font-size:11px;color:#8a9178;margin-top:4px}
.info{font-family:monospace;font-size:12px;color:#7ab356;margin-bottom:12px}
.save-btn{padding:12px 24px;background:#4a7c35;border:none;color:#fff;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.save-btn:active{background:#5a8a3a}
.step-label{font-size:12px;color:#8a9178;align-self:center}
</style>
</head>
<body>
<h1>Dice Crop Tool</h1>
<p style="font-size:12px;color:#8a9178;margin-bottom:12px">Reference — dice 1 (locked). Adjust 5 and 6 independently.</p>
<div class="ref">
<img src="assets/dice/d1.png" alt="dice 1 reference">
<span>Target: match this framing</span>
</div>

<div style="display:flex;gap:12px;margin-bottom:8px">
<button id="sel5" onclick="selDie=5;updSel()" style="padding:8px 16px;background:#4a7c35;border:2px solid #7ab356;color:#fff;border-radius:8px;font-size:14px;cursor:pointer;font-weight:700">EDITING: DICE 5</button>
<button id="sel6" onclick="selDie=6;updSel()" style="padding:8px 16px;background:#1a1f17;border:2px solid #4a7c35;color:#8a9178;border-radius:8px;font-size:14px;cursor:pointer">DICE 6</button>
</div>

<div class="info" id="info"></div>

<div class="controls">
<span class="step-label">Step:</span>
<button onclick="document.getElementById('step').value='1'" style="font-size:11px">1px</button>
<button onclick="document.getElementById('step').value='2'" style="font-size:11px">2px</button>
<button onclick="document.getElementById('step').value='5'" style="font-size:11px">5px</button>
<button onclick="document.getElementById('step').value='10'" style="font-size:11px">10px</button>
<input type="number" id="step" value="1" min="1" max="50">
<span class="step-label">px</span>
</div>
<div class="controls">
<button onclick="move(0,-1)">⬆ UP</button>
<button onclick="move(0,1)">⬇ DOWN</button>
<button onclick="move(-1,0)">⬅ LEFT</button>
<button onclick="move(1,0)">➡ RIGHT</button>
<button onclick="zoom(1)">🔍+ BIGGER</button>
<button onclick="zoom(-1)">🔍− SMALLER</button>
</div>

<div class="preview" id="preview"></div>
<button class="save-btn" onclick="save()">SAVE POSITION</button>
<div id="status" style="margin-top:12px;font-size:14px;color:#c8a84b;font-weight:700;padding:12px;border:2px solid #c8a84b;border-radius:8px;display:none;word-break:break-all;user-select:all;-webkit-user-select:all"></div>

<script>
var BASE_L=107,BASE_T=107,BASE_R=403,BASE_B=403;
var SIZE=296;
var d5={ox:0,oy:0,oz:0};
var d6={ox:0,oy:0,oz:0};
var selDie=5;
var imgs={};

function loadImg(n,cb){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){imgs[n]=img;cb()};
  img.src='assets/dice/dice-'+n+'.png?t='+Date.now();
}

try{var s5=JSON.parse(localStorage.getItem('dice5_crop'));if(s5){d5=s5;}}catch(e){}
try{var s6=JSON.parse(localStorage.getItem('dice6_crop'));if(s6){d6=s6;}}catch(e){}
function updSel(){document.getElementById('sel5').style.background=selDie===5?'#4a7c35':'#1a1f17';document.getElementById('sel5').style.color=selDie===5?'#fff':'#8a9178';document.getElementById('sel5').textContent=selDie===5?'EDITING: DICE 5':'DICE 5';document.getElementById('sel6').style.background=selDie===6?'#4a7c35':'#1a1f17';document.getElementById('sel6').style.color=selDie===6?'#fff':'#8a9178';document.getElementById('sel6').textContent=selDie===6?'EDITING: DICE 6':'DICE 6';render();}
var loaded=0;
[1,5,6].forEach(function(n){
  loadImg(n,function(){loaded++;if(loaded===3)render()});
});

function cur(){return selDie===5?d5:d6}
function move(dx,dy){
  var step=parseInt(document.getElementById('step').value)||10;
  var c=cur();c.ox+=dx*step;c.oy+=dy*step;render();
}
function zoom(dir){
  var step=parseInt(document.getElementById('step').value)||10;
  cur().oz+=dir*step;render();
}

function render(){
  var c=cur();var cropSize=SIZE+c.oz*2;
  var L5=BASE_L+d5.ox-d5.oz,T5=BASE_T+d5.oy-d5.oz,S5=SIZE+d5.oz*2;
  var L6=BASE_L+d6.ox-d6.oz,T6=BASE_T+d6.oy-d6.oz,S6=SIZE+d6.oz*2;
  document.getElementById('info').textContent='Editing D'+selDie+': X='+c.ox+' Y='+c.oy+' Size:'+(SIZE+c.oz*2)+'  |  D5: ('+(L5)+','+(T5)+')-('+(L5+S5)+','+(T5+S5)+')  D6: ('+(L6)+','+(T6)+')-('+(L6+S6)+','+(T6+S6)+')';
  var wrap=document.getElementById('preview');
  wrap.innerHTML='';
  [1,5,6].forEach(function(n){
    var box=document.createElement('div');
    box.className='die-box';
    var c2=document.createElement('canvas');
    c2.width=SIZE;c2.height=SIZE;
    c2.style.width='120px';c2.style.height='120px';
    c2.style.border=n===selDie?'3px solid #c8a84b':'2px solid #4a7c35';
    var ctx=c2.getContext('2d');
    if(n===1){
      ctx.drawImage(imgs[1],BASE_L,BASE_T,SIZE,SIZE,0,0,SIZE,SIZE);
    }else{
      var dd=n===5?d5:d6;var cs=SIZE+dd.oz*2;
      ctx.drawImage(imgs[n],BASE_L+dd.ox-dd.oz,BASE_T+dd.oy-dd.oz,cs,cs,0,0,SIZE,SIZE);
    }
    box.appendChild(c2);
    var lbl=document.createElement('div');
    lbl.textContent=n===1?'Dice 1 (ref)':'Dice '+n+(n===selDie?' ← editing':'');
    if(n===selDie)lbl.style.color='#c8a84b';
    box.appendChild(lbl);
    wrap.appendChild(box);
  });
}

function save(){
  var status=document.getElementById('status');
  localStorage.setItem('dice5_crop',JSON.stringify(d5));
  localStorage.setItem('dice6_crop',JSON.stringify(d6));
  var S5=SIZE+d5.oz*2,S6=SIZE+d6.oz*2;
  var L5=BASE_L+d5.ox-d5.oz,T5=BASE_T+d5.oy-d5.oz;
  var L6=BASE_L+d6.ox-d6.oz,T6=BASE_T+d6.oy-d6.oz;
  var msg='D5: ('+L5+','+T5+')-('+( L5+S5)+','+(T5+S5)+') | D6: ('+L6+','+T6+')-('+( L6+S6)+','+(T6+S6)+')';
  status.style.display='block';
  status.textContent=msg;
  document.title=msg;
}
</script>
</body>
</html>
