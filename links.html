<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XE58S4X6RX');</script>

<style>
  :root{ --bg:#0b0f0b; --card:#121711; --line:#2a3327; --sage:#7ab356; --gold:#c8a84b;
         --cream:#e8dcc8; --muted:#8a9178; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);
       font-family:Nunito,system-ui,-apple-system,sans-serif;
       min-height:100vh;padding:34px 18px calc(46px + env(safe-area-inset-bottom,0px));
       background-image:radial-gradient(1100px 620px at 50% -12%, rgba(122,179,86,.10), transparent 68%);}
  .wrap{max-width:520px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  .mark{width:112px;height:112px;border-radius:26px;display:block;margin:0 auto 14px;
        border:1px solid rgba(200,168,75,.42);box-shadow:0 10px 34px rgba(0,0,0,.55)}
  h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.66rem;margin:0 0 6px;letter-spacing:.4px}
  .tag{color:var(--muted);font-size:.94rem;margin:0;line-height:1.5}

  /* ⛔ ART RULE: no filled button slabs. Dark card, coloured border, glowing medallion. */
  a.lnk{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
        background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:13px 15px;margin-bottom:11px;min-height:64px;
        transition:border-color .18s ease, transform .18s ease, background .18s ease}
  a.lnk:hover,a.lnk:focus-visible{border-color:rgba(122,179,86,.62);transform:translateY(-2px);background:#151b13}
  a.lnk.gold{border-color:rgba(200,168,75,.46)}
  a.lnk.gold:hover,a.lnk.gold:focus-visible{border-color:var(--gold)}
  .med{width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
       font-size:22px;background:radial-gradient(circle at 34% 28%, rgba(122,179,86,.30), rgba(0,0,0,.42));
       border:1px solid rgba(122,179,86,.36)}
  .gold .med{background:radial-gradient(circle at 34% 28%, rgba(200,168,75,.34), rgba(0,0,0,.42));
             border-color:rgba(200,168,75,.46);box-shadow:0 0 16px rgba(200,168,75,.20)}
  .med img{width:30px;height:30px;border-radius:7px;display:block}
  .txt{flex:1;min-width:0}
  .ttl{font-weight:700;font-size:1rem;line-height:1.25}
  .sub{color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
  .arw{color:var(--muted);font-size:1.1rem;flex:0 0 auto}

  h2{font-family:Fredoka,sans-serif;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;
     color:var(--sage);margin:26px 4px 10px;font-weight:600}
  .social{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
  .social a{display:grid;place-items:center;gap:6px;text-decoration:none;color:var(--cream);
            background:var(--card);border:1px solid var(--line);border-radius:14px;
            padding:13px 6px;min-height:74px;font-size:.72rem;font-weight:600;
            transition:border-color .18s ease,transform .18s ease}
  .social a:hover,.social a:focus-visible{border-color:rgba(122,179,86,.62);transform:translateY(-2px)}
  .social .ic{font-size:21px}
  footer{text-align:center;color:var(--muted);font-size:.76rem;margin-top:30px;line-height:1.6}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="mark" src="/portal-assets/icons/skywolf-512.png" alt="Sky Wolf Studios">
    <h1>Sky Wolf Studios</h1>
    <p class="tag">Free browser games from a solo studio in Ohio.<br>No ads, no sign up. Tap one and play.</p>
  </header>

  <div id="links"></div>

  <h2>Follow along</h2>
  <div class="social" id="social"></div>

  <footer>
    Made by one person, at home, in Ohio.<br>
    <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a>
  </footer>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE ONLY THING TO EDIT ON THIS PAGE.

   Instagram gives you exactly one link in a bio, so this page is that link.
   Point every profile here, then change what it leads to without ever
   editing a bio again.

   TO ADD A SOCIAL ACCOUNT: fill in its `url` below. Any entry left as an
   empty string is HIDDEN — the row does not render, so half-finished
   accounts never ship as dead links. Delete nothing, just fill in.

   Every tap fires a GA4 `outbound_link` event, so you can see which platform
   actually sends people to the games.
   ═══════════════════════════════════════════════════════════════════════ */

var LINKS = [
  { icon:'/portal-assets/icons/skywolf-192.png', gold:true,
    title:'Play the Arcade',
    sub:'159 free games. Nothing to install.',
    url:'/portal/?from=bio' },

  { emoji:'🦝',
    title:'Jimothy the Jumping Nugget',
    sub:'Get a very round raccoon across rainy Seattle.',
    url:'/jimothy/?from=bio' },

  { emoji:'🌱',
    title:'Lucid Winds',
    sub:'Grow one of one plant art that is yours alone.',
    url:'/?from=bio' },

  { emoji:'✉️',
    title:'Say hello',
    sub:'A real person reads these.',
    url:'mailto:stephenfurpahs@gmail.com' }
];

/* Fill in a url to make one appear. Empty = hidden. */
var SOCIAL = [
  { icon:'📷', name:'Instagram', url:'' },
  { icon:'🐦', name:'Twitter',   url:'' },
  /* Stephen's share link, 2026-07-25. This is a redirect, not the Page's real
     address — it works, but it is opaque and Facebook can rotate these. When
     the Page has a username (Settings > Page setup > Username), replace this
     with the clean https://www.facebook.com/skywolfstudios form. */
  { icon:'👥', name:'Facebook',  url:'https://www.facebook.com/share/1E2mytEw1j/' },
  { icon:'🎮', name:'itch.io',   url:'' },
  { icon:'📺', name:'YouTube',   url:'' },
  { icon:'👾', name:'Discord',   url:'' }
];

(function(){
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function track(label){
    if (window.gtag) gtag('event', 'outbound_link', { link_label: label, page: 'links' });
  }

  var box = document.getElementById('links'), out = '';
  for (var i = 0; i < LINKS.length; i++) { var L = LINKS[i];
    if (!L.url) continue;
    var med = L.icon ? '<img src="' + esc(L.icon) + '" alt="">' : esc(L.emoji || '✦');
    out += '<a class="lnk' + (L.gold ? ' gold' : '') + '" href="' + esc(L.url) + '"'
        +  ' data-label="' + esc(L.title) + '">'
        +  '<span class="med">' + med + '</span>'
        +  '<span class="txt"><span class="ttl">' + esc(L.title) + '</span>'
        +  '<span class="sub">' + esc(L.sub || '') + '</span></span>'
        +  '<span class="arw">&rsaquo;</span></a>';
  }
  box.innerHTML = out;

  var sbox = document.getElementById('social'), s = '', shown = 0;
  for (var j = 0; j < SOCIAL.length; j++) { var S = SOCIAL[j];
    if (!S.url) continue;                       // not made yet — never a dead link
    shown++;
    s += '<a href="' + esc(S.url) + '" target="_blank" rel="noopener me"'
      +  ' data-label="' + esc(S.name) + '">'
      +  '<span class="ic">' + esc(S.icon) + '</span>' + esc(S.name) + '</a>';
  }
  sbox.innerHTML = s;
  // Hide the whole heading until at least one account exists.
  if (!shown) { var h = sbox.previousElementSibling; if (h) h.style.display = 'none'; }

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[data-label]');
    if (a) track(a.getAttribute('data-label'));
  }, true);
})();
</script>
</body>
</html>
