function allyCardHTML(a){
  const members=a.members.map(id=>state.roster.find(o=>o.id===id)).filter(Boolean);
  return `<div class="ally-card" style="--ac:${a.color}"><div class="ah"><span class="adot"></span><span class="aname" style="color:${a.color}">${esc(a.name)}</span>
    <button class="btn xs ghost" data-act="delAlly" data-id="${a.id}" style="margin-left:auto">✕</button></div>
    <div class="ally-members">${members.length?members.map(o=>`<span class="chip">${avatarSmall(o)} ${esc(o.name)}</span>`).join(""):`<span class="mnote">No members yet.</span>`}</div></div>`;
}
function avatarSmall(o){return o.art?"🖼️":(o.emoji||(raceByKey(o.race)||{}).emoji||"❔");}
function assignRow(o){
  const cur=state.alliances.find(a=>a.members.includes(o.id));
  const opts=`<option value="">— none —</option>`+state.alliances.map(a=>`<option value="${a.id}" ${cur&&cur.id===a.id?"selected":""}>${esc(a.name)}</option>`).join("");
  const r=raceByKey(o.race)||{};
  return `<div class="mini" style="--race-color:${r.color};cursor:default"><div class="av">${avatarHTML(o)}</div>
    <div style="min-width:0;flex:1"><div class="mn">${esc(o.name)}</div>
      <select class="txt small" data-act="assignAlly" data-id="${o.id}" style="font-size:12px;padding:6px;margin-top:4px;font-family:var(--font-body)">${opts}</select></div></div>`;
}

/* ===================== RENDER LOOP ===================== */
let lastSig="";
function render(){
  renderNav();
  let html;
  switch(state.screen){
    case "create": html=screenCreate(); break;
    case "sheet": html=screenSheet(); break;
    case "battle": html=screenBattle(); break;
    case "gauntlet": html=screenGauntlet(); break;
    case "tourney": html=screenTourney(); break;
    case "alliances": html=screenAlliances(); break;
    default: html=screenHome();
  }
  const y=window.scrollY;
  const sig=state.screen+"/"+(state.screen==="sheet"?state.sheetTab:"");
  $app.innerHTML=html;
  if(sig===lastSig) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastSig=sig;
  if(state.screen==="sheet"&&state.sheetTab==="web") setupTree();
  if(state.screen==="create"&&state.draft&&state.draft.step===1&&!state.draft.rolled){/* wait for roll click */}
}
function goto(screen){ state.screen=screen; if(screen!=="sheet"){state.sheetId=null;} render(); }

/* ===================== EVENT DELEGATION ===================== */
function handleAct(act,el,e){
  const oc=currentOC();
  switch(act){
    case "home": goto("home"); break;
    case "nav": goto(el.dataset.k); break;
    case "startCreate": state.draft=newDraft(); state.screen="create"; render(); break;
    case "cancelCreate": state.draft=null; goto("home"); break;
    /* creation */
    case "spin": doSpin(); break;
    case "reroll": state.draft.spun=false; state.draft.race=null; render(); break;
    case "nextStep": state.draft.step=Math.min(3,state.draft.step+1); render(); break;
    case "prevStep": state.draft.step=Math.max(0,state.draft.step-1); render(); break;
    case "rollStats": animateRoll(); break;
    case "rerollStats": animateRoll(); break;
    case "shopCat": state.draft.shopCat=el.dataset.k; render(); break;
    case "buyPow": { const k=el.dataset.k,r=raceByKey(state.draft.race); if(ownedDraftPower(k))break;
      if(draftAether()>=buyCost(k,r)){ const pd=powerByKey(k); state.draft.powers.push({key:k,tier:"novice",effect:pd.effect,augments:[]}); render(); } else toast("Not enough Aether.","bad"); break; }
    case "masterUp": { const k=el.dataset.k,r=raceByKey(state.draft.race),p=ownedDraftPower(k); if(!p)break; const ti=tierIndex(p.tier);
      if(ti>=TIERS.length-1)break; if(draftAether()>=upgradeCost(k,r)){ p.tier=TIERS[ti+1].key; render(); } else toast("Not enough Aether.","bad"); break; }
    case "sellPow": state.draft.powers=state.draft.powers.filter(p=>p.key!==el.dataset.k); render(); break;
    case "pickStand": { const arch=el.dataset.k; let p=ownedDraftPower("stand");
      if(p){ p.arch=(p.arch===arch?p.arch:arch); } else state.draft.powers.push({key:"stand",arch,tier:"novice",effect:"stand",augments:[]}); render(); break; }
    case "enhPlus": { const k=el.dataset.k; state.draft.enhance[k]=(state.draft.enhance[k]||0); if(state.draft.enhance[k]<12&&draftAether()>=6){ state.draft.enhance[k]+=2; render(); } break; }
    case "enhMinus": { const k=el.dataset.k; if(state.draft.enhance[k]>0){ state.draft.enhance[k]-=2; if(state.draft.enhance[k]<=0)delete state.draft.enhance[k]; render(); } break; }
    case "randName": state.draft.name=randomName(); render(); break;
    case "pickEmoji": state.draft.emoji=(state.draft.emoji===el.dataset.e?null:el.dataset.e); render(); break;
    case "finalize": finalizeOC(); break;
    /* roster / sheet */
    case "openSheet": state.screen="sheet"; state.sheetId=el.dataset.id; state.sheetTab="overview"; state.treeSel=null; state.treeView={x:0,y:0,scale:1}; render(); break;
    case "delOC": { const id=el.dataset.id,o=state.roster.find(x=>x.id===id); if(o&&(typeof confirm==="undefined"||confirm(`Delete ${o.name}? This can't be undone.`))){ state.roster=state.roster.filter(x=>x.id!==id); state.alliances.forEach(a=>a.members=a.members.filter(m=>m!==id)); state.battleSel=state.battleSel.map(s=>s===id?null:s); persist(); render(); toast("Character deleted."); } break; }
    case "sheetTab": state.sheetTab=el.dataset.k; if(el.dataset.k==="web"&&!state.treeSel){/* keep */} render(); break;
    case "sendBattle": state.battle=null; state.battleSel=[el.dataset.id,null]; goto("battle"); break;
    /* skill web */
    case "allocNode": if(oc){ allocNode(oc,el.dataset.id); render(); } break;
    case "chooseAsc": { if(!oc)break; const k=el.dataset.k; if(!ASC_BY_KEY[k]||(oc.level||1)<ASC_UNLOCK_LEVEL)break; if(!oc.ascendancy) oc.ascendancy={key:null,allocated:[]}; if(oc.ascendancy.key!==k){ oc.ascendancy.key=k; oc.ascendancy.allocated=[]; } persist(); render(); toast(`Ascended: ${ASC_BY_KEY[k].name}.`,"gold"); break; }
    case "allocAsc": { if(!oc||!oc.ascendancy)break; const id=el.dataset.k,n=ASC_NODE_BY_ID[id]; if(!n||n.asc!==oc.ascendancy.key)break; if((oc.ascendancy.allocated||[]).includes(id))break; if(ascPointsAvail(oc)<=0){toast("No ascendancy points.","bad");break;} oc.ascendancy.allocated.push(id); persist(); render(); break; }
    case "refundAsc": { if(!oc||!oc.ascendancy)break; const id=el.dataset.k; oc.ascendancy.allocated=(oc.ascendancy.allocated||[]).filter(x=>x!==id); persist(); render(); break; }
    case "resetAsc": { if(!oc)break; oc.ascendancy={key:null,allocated:[]}; persist(); render(); break; }
    case "buyJewel": { const k=el.dataset.k; if(ownsJewel(k))break; if(state.glory>=jewelCost()){ state.glory-=jewelCost(); const gr=rollGrade(); state.ownedJewels.push({key:k,grade:gr}); persist(); render(); const R=rarByKey(gr); toast(`Learned jewel ${JEWEL_BY_KEY[k].name} · ${R.label}!`, gr==="common"?"good":"gold"); } else toast("Not enough Glory.","bad"); break; }
    case "reforgeJewel": { const k=el.dataset.k; const g=ownedJewelGem(k); if(!g)break; if(state.glory>=reforgeCostG()){ state.glory-=reforgeCostG(); const rolled=rollGrade(); const oi=RARITY.findIndex(r=>r.key===g.grade), ni=RARITY.findIndex(r=>r.key===rolled); const up=ni>oi; if(up) g.grade=rolled; persist(); render(); const R=rarByKey(g.grade); toast(up?`${JEWEL_BY_KEY[k].name} reforged UP → ${R.label} ▲`:`No luck — ${JEWEL_BY_KEY[k].name} holds at ${R.label}`, up?"gold":"good"); } else toast("Not enough Glory.","bad"); break; }
    case "openJewelPick": if(oc) openJewelPicker(oc, el.dataset.node); break;
    case "socketJewel": { if(!oc)break; const nid=el.dataset.node,jk=el.dataset.k,nn=TREE.byId[nid]; if(!nn||nn.type!=="jewel"){closeModal();break;} if(!(oc.tree.allocated||[]).includes(nid)){toast("Allocate this socket first.","bad");break;} if(!JEWEL_BY_KEY[jk]||!ownsJewel(jk))break; if(!oc.tree.jewels) oc.tree.jewels={}; oc.tree.jewels[nid]=jk; persist(); closeModal(); render(); break; }
    case "unsocketJewel": { if(!oc)break; const nid=el.dataset.node; if(oc.tree.jewels) delete oc.tree.jewels[nid]; persist(); closeModal(); render(); break; }
    case "refundNode": if(oc){ refundNode(oc,el.dataset.id); render(); } break;
    case "respecTree": { const o=state.roster.find(x=>x.id===el.dataset.id)||oc; if(o){ respecTree(o); render(); } break; }
    /* powers & augments */
    case "openSlot": if(oc) openSlotPicker(oc,el.dataset.k,parseInt(el.dataset.slot,10)); break;
    case "setAug": { if(!oc)break; const p=oc.powers.find(x=>x.key===el.dataset.k); if(!p)break; const slot=parseInt(el.dataset.slot,10);
      p.augments=p.augments||[]; while(p.augments.length<slot)p.augments.push(null); p.augments[slot]=el.dataset.aug; p.augments=p.augments.filter((v,i)=>i<socketCap(p)); persist(); closeModal(); render(); toast("Augment socketed.","good"); break; }
    case "clearAug": { if(!oc)break; const p=oc.powers.find(x=>x.key===el.dataset.k); if(!p)break; const slot=parseInt(el.dataset.slot,10); if(p.augments&&p.augments[slot]!=null){ p.augments[slot]=null; } persist(); closeModal(); render(); break; }
    case "buyAug": { const k=el.dataset.k; if(ownsAug(k))break; if(state.glory>=augCost()){ state.glory-=augCost(); const gr=rollGrade(); state.ownedAugments.push({key:k,grade:gr}); persist(); render(); const R=rarByKey(gr); toast(`Learned ${augByKey(k).name} · ${R.label}!`, gr==="common"?"good":"gold"); } else toast("Not enough Glory.","bad"); break; }
    case "reforgeAug": { const k=el.dataset.k; const g=ownedGem(k); if(!g)break; if(state.glory>=reforgeCostG()){ state.glory-=reforgeCostG(); const rolled=rollGrade(); const oi=RARITY.findIndex(r=>r.key===g.grade), ni=RARITY.findIndex(r=>r.key===rolled); const up=ni>oi; if(up) g.grade=rolled; persist(); render(); const R=rarByKey(g.grade); toast(up?`${augByKey(k).name} reforged UP → ${R.label} ▲`:`No luck — ${augByKey(k).name} holds at ${R.label}`, up?"gold":"good"); } else toast("Not enough Glory.","bad"); break; }
    case "masterUpG": { if(!oc)break; const p=oc.powers.find(x=>x.key===el.dataset.k); if(!p)break; const ti=tierIndex(p.tier); if(ti>=TIERS.length-1)break; const c=masteryUpCostG(p);
      if(state.glory>=c){ state.glory-=c; p.tier=TIERS[ti+1].key; persist(); render(); toast(`${powerDisplayName(p)} → ${TIERS[ti+1].label}!`,"good"); } else toast("Not enough Glory.","bad"); break; }
    case "learnPow": { if(!oc)break; const k=el.dataset.k; if(oc.powers.some(p=>p.key===k))break; const c=learnCostG(k);
      if(state.glory>=c){ state.glory-=c; const pd=powerByKey(k); oc.powers.push({key:k,tier:"novice",effect:pd.effect,augments:[]}); persist(); render(); toast(`Learned ${pd.name}.`,"good"); } else toast("Not enough Glory.","bad"); break; }
    case "montage": { const o=state.roster.find(x=>x.id===el.dataset.id)||oc; if(!o)break; const c=montageCostG(o);
      if(state.glory>=c){ state.glory-=c; const lv=grantXP(o,Math.round(xpNeeded(o.level+1)*0.7)); persist(); render(); toast(lv>0?`${o.name} reached level ${o.level}!`:`${o.name} trained hard. +XP`,"good"); } else toast("Not enough Glory.","bad"); break; }
    case "trainStat": { if(!oc)break; const k=el.dataset.k,c=trainStatCostG(oc,k); if((oc.baseStats[k]||0)>=140){toast("Stat maxed.");break;}
      if(state.glory>=c){ state.glory-=c; oc.baseStats[k]=Math.min(140,(oc.baseStats[k]||0)+2); persist(); render(); toast(`${STAT_LABEL[k]} conditioned.`,"good"); } else toast("Not enough Glory.","bad"); break; }
    case "closeModal": if(e&&e.target&&e.target.classList&&e.target.classList.contains("modal-back")) closeModal(); break;
    /* battle */
    case "pickFighter": pickFighter(el.dataset.id); break;
    case "pickChampion": state.gauntlet.champion=el.dataset.id; render(); break;
    case "fightGauntlet": runGauntlet(parseInt(el.dataset.rung,10)); break;
    case "gauntletNext": { const gf=state.gauntletFight; state.gauntletFight=null; if(gf) runGauntlet(gf.rung+1); break; }
    case "gauntletBack": state.gauntletFight=null; render(); break;
    case "runBattle": runBattle(); break;
    case "rematch": { const s=[state.battle.aId,state.battle.bId]; state.battle=null; state.battleSel=s; runBattle(); break; }
    case "newBattle": state.battle=null; render(); break;
    /* tourney */
    case "runTourney": runTournament(parseInt(el.dataset.size,10)||4); break;
    case "newTourney": state.tourney=null; render(); break;
    /* alliances */
    case "createAlly": { const nm=(tmp.allyName||"").trim(); if(!nm){toast("Name your alliance.","bad");break;} state.alliances.push({id:"al_"+Date.now().toString(36),name:nm,color:tmp.allyColor||"#4FE3C1",members:[]}); tmp.allyName=""; persist(); render(); toast("Alliance forged.","good"); break; }
    case "delAlly": state.alliances=state.alliances.filter(a=>a.id!==el.dataset.id); persist(); render(); break;
    default: break;
  }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(el.tagName==="SELECT") return; // handled on change
  handleAct(act,el,e);
});
document.addEventListener("input",e=>{
  const t=e.target; const f=t.dataset&&t.dataset.field; if(!f) return;
  if(f==="name"&&state.draft){ state.draft.name=t.value; const btn=document.querySelector('[data-act="finalize"]'); if(btn){ if(t.value.trim())btn.removeAttribute("disabled"); else btn.setAttribute("disabled",""); } }
  else if(f==="art"&&state.draft){ state.draft.art=t.value; }
  else if(f==="allyName"){ tmp.allyName=t.value; }
  else if(f==="allyColor"){ tmp.allyColor=t.value; }
});
document.addEventListener("change",e=>{
  const t=e.target; const act=t.dataset&&t.dataset.act;
  if(act==="assignAlly"){ const id=t.dataset.id,target=t.value;
    state.alliances.forEach(a=>a.members=a.members.filter(m=>m!==id));
    if(target){ const a=state.alliances.find(x=>x.id===target); if(a&&!a.members.includes(id)) a.members.push(id); }
    persist(); render(); return; }
  if(t.dataset&&t.dataset.field==="allyColor"){ tmp.allyColor=t.value; }
});

/* ===================== BOOT ===================== */
async function boot(){
  try{ await loadState(); }catch(e){ state.ownedAugments=normalizeOwned(state.ownedAugments||STARTER_AUGMENTS); state.ownedJewels=normalizeOwnedJewels(state.ownedJewels||STARTER_JEWELS); }
  render();
}
boot();
</script>
</body>
