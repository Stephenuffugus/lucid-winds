<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Lucid Winds — OC Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0A14; --void-2:#13111F; --panel:#181524; --panel-2:#1F1B30;
    --line:rgba(160,150,210,.14); --line-2:rgba(160,150,210,.28);
    --mist:#A9A4C7; --mist-dim:#726d90; --ghost:#ECEAF7;
    --aur-teal:#4FE3C1; --aur-violet:#8B6CF0; --aur-magenta:#F05C9E; --aur-gold:#F5C451;
    --hp:#FF5A6E; --ok:#4FE3C1;
    --font-display:"Arial Narrow Bold","Franklin Gothic Bold","Haettenschweiler",Impact,system-ui,sans-serif;
    --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono","Consolas",ui-monospace,monospace;
    --r:16px; --r-sm:10px;
    /* arm theme colors */
    --might:#FF7A5C; --aegis:#5C9BFF; --tempo:#4FE3C1; --psyche:#B57CFF; --ruin:#F5C451; --vitality:#7FE04A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--void);color:var(--ghost);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.5}
  .aurora::before,.aurora::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
  .aurora::before{background:radial-gradient(circle,var(--aur-violet),transparent 62%);top:-25vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite}
  .aurora::after{background:radial-gradient(circle,var(--aur-teal),transparent 62%);bottom:-28vmax;right:-18vmax;animation:drift2 32s ease-in-out infinite}
  .aurora .m{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(90px);opacity:.3;mix-blend-mode:screen;background:radial-gradient(circle,var(--aur-magenta),transparent 60%);top:30%;left:35%;animation:drift3 40s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(14vmax,10vmax) scale(1.1)}}
  @keyframes drift2{50%{transform:translate(-12vmax,-8vmax) scale(1.15)}}
  @keyframes drift3{50%{transform:translate(-16vmax,12vmax) scale(1.2)}}

  #app{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:0 16px 130px;min-height:100dvh}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 4px 12px;margin-bottom:8px;background:linear-gradient(var(--void) 62%,transparent)}
  .brand{display:flex;flex-direction:column;line-height:.9;cursor:pointer;user-select:none}
  .brand .k{font-family:var(--font-display);letter-spacing:.14em;font-size:20px;background:linear-gradient(100deg,var(--aur-teal),var(--aur-violet) 55%,var(--aur-magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .s{font-family:var(--font-mono);font-size:9px;letter-spacing:.34em;color:var(--mist-dim);text-transform:uppercase;margin-top:3px}
  .spacer{flex:1}
  .wallet{display:flex;gap:8px}
  .coin{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-family:var(--font-mono);font-size:13px}
  .coin .sym{color:var(--aur-gold)}

  button{font-family:inherit;cursor:pointer;color:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ghost);padding:12px 18px;border-radius:var(--r-sm);font-size:15px;font-weight:600;transition:transform .12s,border-color .2s,background .2s}
  .btn:hover{transform:translateY(-1px);border-color:var(--aur-violet)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{border:none;color:#0B0A14;font-weight:800;background:linear-gradient(100deg,var(--aur-teal),var(--aur-violet));box-shadow:0 6px 26px -8px var(--aur-violet)}
  .btn.gold{border:none;color:#1a1405;font-weight:800;background:linear-gradient(100deg,var(--aur-gold),#ff9d4d);box-shadow:0 6px 26px -10px var(--aur-gold)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
  .btn.xs{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn.block{width:100%}
  .btn.danger:hover{border-color:var(--hp)}

  .hero{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:26px 22px;margin-bottom:16px;background:radial-gradient(120% 140% at 12% 0%,rgba(139,108,240,.28),transparent 55%),radial-gradient(120% 140% at 90% 20%,rgba(79,227,193,.2),transparent 55%),var(--void-2)}
  .hero h1{font-family:var(--font-display);font-size:clamp(30px,8vw,52px);line-height:.92;margin:0 0 10px;letter-spacing:.01em}
  .hero h1 .glow{background:linear-gradient(100deg,var(--aur-teal),var(--aur-magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--mist);max-width:60ch;margin:0 0 18px;font-size:15px}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap}

  .section-h{display:flex;align-items:baseline;gap:10px;margin:22px 2px 12px}
  .section-h .n{font-family:var(--font-mono);font-size:11px;color:var(--aur-teal);letter-spacing:.2em}
  .section-h h2{font-family:var(--font-display);font-size:22px;letter-spacing:.06em;margin:0;text-transform:uppercase}
  .section-h .c{font-family:var(--font-mono);font-size:11px;color:var(--mist-dim);margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,var(--panel-2),var(--panel));--race-color:#8B6CF0;cursor:pointer}
  .card .rim{position:absolute;inset:0;border-radius:var(--r);pointer-events:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--race-color) 55%,transparent),inset 0 26px 60px -40px color-mix(in srgb,var(--race-color) 90%,transparent)}
  .card .holo{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--race-color) 30%,transparent) 46%,transparent 60%)}
  .card:hover .holo{opacity:.7}
  .oc-top{display:flex;gap:12px;padding:14px 14px 10px;align-items:center}
  .avatar{width:58px;height:58px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--race-color) 40%,var(--void-2)),var(--void));border:1px solid color-mix(in srgb,var(--race-color) 50%,transparent);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .oc-id{min-width:0;flex:1}
  .oc-name{font-family:var(--font-display);font-size:22px;line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .oc-sub{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
  .race-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--race-color);border:1px solid color-mix(in srgb,var(--race-color) 45%,transparent);padding:2px 7px;border-radius:6px}
  .lvl-badge{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);color:var(--aur-gold)}
  .rec{font-family:var(--font-mono);font-size:11px;color:var(--mist-dim)}
  .rec .w{color:var(--ok)} .rec .l{color:var(--hp)}
  .ally-badge{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--mist)}

  .stats{padding:4px 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .stat{display:flex;align-items:center;gap:8px}
  .stat .lab{font-family:var(--font-mono);font-size:10px;color:var(--mist-dim);width:34px;letter-spacing:.06em}
  .stat .bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
  .stat .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--race-color),color-mix(in srgb,var(--race-color) 40%,#fff))}
  .stat .val{font-family:var(--font-mono);font-size:12px;width:26px;text-align:right}
  .grade{font-family:var(--font-display);font-weight:800;font-size:12px;width:24px;text-align:center;border-radius:5px;padding:1px 0}

  .powerchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
  .chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--void-2);color:var(--mist);display:inline-flex;gap:5px;align-items:center}
  .chip .m{font-family:var(--font-mono);font-size:9px;color:var(--aur-gold);letter-spacing:.05em}
  .chip.passive{border-style:dashed;color:var(--race-color)}
  .chip.key{border-color:var(--aur-gold);color:var(--aur-gold)}
  .xpbar-wrap{padding:0 14px 12px}
  .xpbar{height:5px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
  .xpbar .xpf{height:100%;background:linear-gradient(90deg,var(--aur-violet),var(--aur-magenta))}
  .card .kill{position:absolute;top:10px;right:10px;z-index:5;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--mist-dim);font-size:14px;display:grid;place-items:center}
  .card .kill:hover{color:var(--hp);border-color:var(--hp)}
  .pts-flag{position:absolute;top:10px;left:10px;z-index:5;font-family:var(--font-mono);font-size:10px;padding:3px 7px;border-radius:999px;background:linear-gradient(100deg,var(--aur-teal),var(--aur-violet));color:#08110f;font-weight:700}

  .empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--mist)}
  .empty .big{font-size:40px;margin-bottom:10px}
  .hint{font-size:12px;color:var(--mist-dim);margin-top:8px}
  .center{text-align:center}

  /* creation flow */
  .creator{border:1px solid var(--line);border-radius:var(--r);background:var(--void-2);overflow:hidden;margin-top:8px}
  .steps{display:flex;gap:2px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .step{flex:1;text-align:center}
  .step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--mist-dim)}
  .step .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--mist-dim);text-transform:uppercase}
  .step.done .dot{background:var(--aur-teal);border-color:var(--aur-teal);color:#08110f}
  .step.active .dot{border-color:var(--aur-violet);color:var(--ghost);box-shadow:0 0 0 3px rgba(139,108,240,.25)}
  .step.active .t{color:var(--ghost)}
  .step-body{padding:20px 18px}
  .step-title{font-family:var(--font-display);font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
  .step-desc{color:var(--mist);font-size:14px;margin:0 0 18px;max-width:62ch}
  .flow-nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}

  .wheel-wrap{position:relative;width:min(340px,82vw);aspect-ratio:1;margin:6px auto 8px}
  .wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:6;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ghost);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
  .wheel{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.12);transition:transform 4.4s cubic-bezier(.12,.66,.12,1);will-change:transform;box-shadow:0 0 60px -20px var(--aur-violet),inset 0 0 40px rgba(0,0,0,.5)}
  .wheel .seg-label{position:absolute;left:50%;top:50%;transform-origin:0 0;font-family:var(--font-display);font-size:12px;letter-spacing:.04em;color:#0b0a14;white-space:nowrap;pointer-events:none}
  .wheel-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:60px;height:60px;border-radius:50%;background:var(--void);border:2px solid var(--line-2);display:grid;place-items:center;font-family:var(--font-display);font-size:18px;color:var(--aur-teal);box-shadow:0 0 30px -6px var(--aur-teal)}
  .wheel-hub.spin{animation:hubpulse 1s infinite}
  @keyframes hubpulse{50%{color:var(--aur-magenta);box-shadow:0 0 40px -4px var(--aur-magenta)}}
  .race-reveal{text-align:center;margin-top:8px}
  .race-reveal .rr-name{font-family:var(--font-display);font-size:34px;letter-spacing:.03em;text-transform:uppercase}
  .race-reveal .rr-blurb{color:var(--mist);max-width:52ch;margin:8px auto 0;font-size:14px}
  .race-mods{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .mod{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
  .mod.pos{color:var(--ok)} .mod.neg{color:var(--hp)}
  .race-passive{margin-top:12px;font-size:13px;color:var(--mist)}
  .race-passive b{color:var(--race-color,#8B6CF0)}

  .rollboard{display:grid;gap:10px;max-width:520px;margin:0 auto}
  .roll-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
  .roll-row .name{font-size:14px;flex:1}
  .roll-row .sub{font-family:var(--font-mono);font-size:10px;color:var(--mist-dim);display:block;margin-top:2px}
  .roll-row .bar{width:130px;height:8px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
  .roll-row .fill{height:100%;width:0;background:linear-gradient(90deg,var(--aur-teal),var(--aur-violet));transition:width .5s}
  .roll-row .num{font-family:var(--font-mono);font-size:20px;width:44px;text-align:right}
  .roll-total{text-align:center;margin-top:14px;font-family:var(--font-mono);color:var(--mist)}
  .roll-total b{color:var(--ghost);font-size:16px}

  .aether-hud{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);margin-bottom:14px;position:sticky;top:64px;z-index:12}
  .aether-hud .big{font-family:var(--font-display);font-size:26px;color:var(--aur-teal)}
  .aether-hud .lab{font-family:var(--font-mono);font-size:10px;color:var(--mist-dim);letter-spacing:.1em;text-transform:uppercase}
  .aether-hud .prev{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--mist);text-align:right}
  .shop-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .shop-tab{font-family:var(--font-mono);font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mist);letter-spacing:.06em}
  .shop-tab.on{color:#0b0a14;background:var(--aur-teal);border-color:var(--aur-teal)}
  .pow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .pow{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:12px;position:relative;overflow:hidden}
  .pow.owned{border-color:var(--aur-teal);background:linear-gradient(160deg,rgba(79,227,193,.08),var(--panel))}
  .pow.aff::after{content:"AFFINITY";position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:.12em;color:var(--aur-gold);border:1px solid color-mix(in srgb,var(--aur-gold) 40%,transparent);padding:1px 5px;border-radius:5px}
  .pow .ph{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .pow .pe{font-size:20px} .pow .pn{font-weight:700;font-size:14px}
  .pow .pt{font-family:var(--font-mono);font-size:9px;color:var(--mist-dim);letter-spacing:.1em;text-transform:uppercase}
  .pow .pd{font-size:12px;color:var(--mist);min-height:32px;line-height:1.35}
  .tagrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
  .tag{font-family:var(--font-mono);font-size:9px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--mist-dim);text-transform:uppercase;letter-spacing:.06em}
  .pow .prow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .pow .cost{font-family:var(--font-mono);font-size:12px;color:var(--aur-teal)}
  .mastery{margin-top:10px}
  .mastery .mlab{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--mist);margin-bottom:5px}
  .mbar{height:7px;border-radius:5px;background:rgba(255,255,255,.06);display:flex;gap:2px;overflow:hidden}
  .mbar i{flex:1;background:rgba(255,255,255,.08);border-radius:2px}
  .mbar i.on{background:linear-gradient(90deg,var(--aur-gold),#ff9d4d)}
  .mnote{font-size:11px;color:var(--mist-dim);margin-top:6px;font-style:italic}
  .stand-picker{border:1px solid var(--aur-gold);border-radius:var(--r-sm);background:linear-gradient(160deg,rgba(245,196,81,.08),var(--panel));padding:14px;margin-bottom:14px}
  .stand-picker h4{font-family:var(--font-display);letter-spacing:.06em;margin:0 0 4px;font-size:18px;color:var(--aur-gold)}
  .stand-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
  .stand-opt{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--void-2);cursor:pointer;transition:border-color .2s}
  .stand-opt.on{border-color:var(--aur-gold);background:rgba(245,196,81,.12)}
  .stand-opt .so-n{font-family:var(--font-display);letter-spacing:.04em;font-size:15px}
  .stand-opt .so-d{font-size:11px;color:var(--mist);margin-top:3px}
  .enhance{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:14px;background:var(--panel)}
  .enhance h4{margin:0 0 8px;font-size:13px;font-family:var(--font-mono);letter-spacing:.08em;color:var(--mist);text-transform:uppercase}
  .enh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .enh-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:var(--font-mono);font-size:12px}
  .enh-pill button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-2);background:var(--void-2);color:var(--ghost);font-size:14px;line-height:1}

  .name-stage{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
  @media(min-width:640px){.name-stage{grid-template-columns:300px 1fr}}
  .name-input-wrap{display:flex;flex-direction:column;gap:12px}
  .txt{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--ghost);font-family:var(--font-display);font-size:24px;letter-spacing:.02em;padding:14px}
  .txt:focus{outline:none;border-color:var(--aur-violet);box-shadow:0 0 0 3px rgba(139,108,240,.2)}
  .txt::placeholder{color:var(--mist-dim);font-family:var(--font-body);font-size:16px;letter-spacing:0}
  .txt.small{font-family:var(--font-body);font-size:15px}
  .art-hint{font-size:12px;color:var(--mist-dim);line-height:1.5}
  .emoji-row{display:flex;gap:6px;flex-wrap:wrap}
  .emoji-pick{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:20px;display:grid;place-items:center}
  .emoji-pick.on{border-color:var(--aur-violet);box-shadow:0 0 0 2px rgba(139,108,240,.3)}

  /* character sheet */
  .sheet-head{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--panel-2),var(--panel));--race-color:#8B6CF0;position:relative;overflow:hidden}
  .sheet-head .rim{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 30px 70px -50px color-mix(in srgb,var(--race-color) 90%,transparent)}
  .sheet-head .sav{width:72px;height:72px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--race-color) 40%,var(--void-2)),var(--void));border:1px solid color-mix(in srgb,var(--race-color) 50%,transparent);overflow:hidden}
  .sheet-head .sav img{width:100%;height:100%;object-fit:cover}
  .sheet-head .sn{font-family:var(--font-display);font-size:30px;line-height:1;letter-spacing:.02em}

  .train-opt .tt{flex:1} .train-opt .tt .th{font-weight:700;font-size:14px}
  .train-opt .tt .ts{font-size:12px;color:var(--mist);margin-top:2px}
  .train-opt .tc{font-family:var(--font-mono);font-size:13px;color:var(--aur-gold)}

  .fighter-head .fr{font-family:var(--font-mono);font-size:9px;color:var(--mist-dim);text-transform:uppercase;margin-top:3px}

  .hpbar{height:12px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin:8px 6px 0;border:1px solid var(--line)}

  .log{padding:14px 16px;max-height:46vh;overflow-y:auto;border-top:1px solid var(--line);font-size:14px}

  .log .dodge{color:var(--mist)} .log .power{color:var(--aur-violet)}
  .log .heal{color:var(--ok)} .log .ko{color:var(--hp);font-weight:800;font-family:var(--font-display);font-size:18px;letter-spacing:.04em}
  .log .sys{color:var(--mist-dim);font-style:italic}
  .result-panel{padding:18px 16px;border-top:1px solid var(--line);text-align:center}

  .result-panel .win-name{font-family:var(--font-display);font-size:40px;letter-spacing:.03em;margin:4px 0 6px}
  .reward{display:inline-flex;gap:14px;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--aur-gold);margin-bottom:14px;flex-wrap:wrap;justify-content:center}

  .bracket{display:flex;gap:18px;overflow-x:auto;padding:10px 2px 16px}

  .champion{text-align:center;padding:18px;border:1px solid var(--aur-gold);border-radius:var(--r);margin-top:8px;background:radial-gradient(120% 120% at 50% 0%,rgba(245,196,81,.18),transparent 60%),var(--void-2)}

  .ally-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;background:linear-gradient(transparent,var(--void) 40%);padding:10px 12px calc(12px + env(safe-area-inset-bottom))}

<body>
<div class="aurora"><div class="m"></div></div>
<div id="app"></div>
<div class="nav"><div class="nav-inner" id="nav"></div></div>
<div class="toast-wrap" id="toasts"></div>
<div id="modal-root"></div>
<script>
"use strict";
/* ===================== DATA ===================== */
const STAT_KEYS=["str","dur","sta","int","spd","cmb"];
const STAT_LABEL={str:"Strength",dur:"Durability",sta:"Stamina",int:"Intelligence",spd:"Speed",cmb:"Combat"};
const STAT_ABBR={str:"STR",dur:"DUR",sta:"STA",int:"INT",spd:"SPD",cmb:"CMB"};
const BASE_AETHER=130;
const TIERS=[{key:"novice",label:"Novice",mult:0.30},{key:"adept",label:"Adept",mult:0.55},{key:"expert",label:"Expert",mult:0.80},{key:"master",label:"Master",mult:1.05}];
const tierIndex=k=>TIERS.findIndex(t=>t.key===k);
const tierMult=k=>(TIERS.find(t=>t.key===k)||TIERS[0]).mult;

// arms: 0 MIGHT,1 PSYCHE,2 RUIN,3 VITALITY,4 TEMPO,5 AEGIS
const ARMS=[
  {key:"might",name:"Might",color:"#FF7A5C",angle:-90},

/* scale a node-effect object's numbers by a grade multiplier */
function scaleEffect(m,gm){ const e={}; for(const k in m){ const v=m[k];
  if(k==="stat"){ e.stat={}; for(const kk in v) e.stat[kk]=Math.round(v[kk]*gm); }
  else if(k==="incTag"){ e.incTag={}; for(const kk in v) e.incTag[kk]=v[kk]*gm; }
  else if(typeof v==="number") e[k]=v*gm; else e[k]=v; } return e; }

const RING_SLOTS=[0,3,5,5,3,1]; // index by ring (1..5); ring0 unused
const RING_RADIUS=[0,150,275,395,505,595];
const RING_WIDTH=[0,26,42,46,32,0]; // angular spread deg
const CENTER_SLOT={1:1,2:2,3:2,4:1,5:0};

function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}

function buildTree(){
  const nodes=[]; const byId={}; const edges=[];
  const cx=0, cy=0;
  const hub={id:"hub",arm:"hub",ring:0,type:"hub",name:"Nexus",desc:"The crossroads of the web.",effect:{},x:cx,y:cy,neighbors:[]};
  nodes.push(hub); byId.hub=hub;
  ARMS.forEach((arm,ai)=>{
    const notablesByRing={}; (NOTABLES[arm.key]||[]).forEach(n=>notablesByRing[n.ring]=n);
    const perRing={};
    for(let ring=1;ring<=5;ring++){
      const S=RING_SLOTS[ring]; const W=RING_WIDTH[ring]; const R=RING_RADIUS[ring];
      perRing[ring]=[];
      for(let s=0;s<S;s++){
        const off = S>1 ? (s-(S-1)/2)*(W/(S-1)) : 0;
        const deg = arm.angle + off;
        const [x,y]=polar(cx,cy,R,deg);
        const id=`a${ai}_r${ring}_${s}`;
        let node={id,arm:arm.key,ring,type:"minor",x,y,neighbors:[]};
        // assign minor effect
        const pool=MINOR_POOLS[arm.key]; const eff=pool[(ring+s)%pool.length];
        node.effect=JSON.parse(JSON.stringify(eff));
        node.name="Minor Passive"; node.desc=describeEffect(node.effect);
        // notable at center slot
        if(notablesByRing[ring] && s===CENTER_SLOT[ring]){
          const nb=notablesByRing[ring];
          node.type="notable"; node.name=nb.name; node.effect=nb.effect; node.desc=nb.desc;
        }
        // keystone at rim
        if(ring===5){
          const ks=KEYSTONES[arm.key];
          node.type="keystone"; node.name=ks.name; node.keystone=ks.keystone; node.effect={keystone:ks.keystone}; node.desc=ks.desc;
        }
        // jewel socket (replaces a minor; grants no base effect, holds a jewel)
        if(node.type==="minor" && JEWEL_SOCKET_IDS.has(id)){
          node.type="jewel"; node.name="Jewel Socket"; node.effect={}; node.desc="Socket a jewel here to gain its modifiers, scaled by the jewel's rarity.";
        }
        nodes.push(node); byId[id]=node; perRing[ring].push(node);
      }
    }
    arm._perRing=perRing;
    // connect within arm
    for(let ring=1;ring<=5;ring++){
      const cur=perRing[ring];
      for(let i=0;i<cur.length-1;i++) addEdge(edges,byId,cur[i].id,cur[i+1].id);
      if(ring<5){
        const nxt=perRing[ring+1];
        nxt.forEach(n=>{ // connect each outer node to nearest inner by angle position
          let best=null,bd=1e9;
          cur.forEach(c=>{const d=Math.hypot(c.x-n.x,c.y-n.y); if(d<bd){bd=d;best=c;}});
          if(best) addEdge(edges,byId,best.id,n.id);
        });
      }
    }
    // ring1 center to hub
    const r1=perRing[1]; const r1c=r1[Math.floor(r1.length/2)];
    addEdge(edges,byId,"hub",r1c.id);
    arm._start=r1c.id;
  });
  // outer connecting loop at ring3 centers
  ARMS.forEach((arm,ai)=>{
    const a=arm._perRing[3], b=ARMS[(ai+1)%ARMS.length]._perRing[3];
    if(a.length&&b.length){
      const ac=a[a.length-1], bc=b[0];
      addEdge(edges,byId,ac.id,bc.id);
    }
  });
  // hybrid keystones
  HYBRID_KEYS.forEach(hk=>{
    const [x,y]=polar(0,0,hk.radius,hk.angle);
    const node={id:hk.id,arm:"hybrid",ring:5,type:"keystone",name:hk.name,keystone:hk.keystone,effect:{keystone:hk.keystone},desc:hk.desc,x,y,neighbors:[]};
    nodes.push(node); byId[hk.id]=node;
    hk.arms.forEach(armKey=>{
      const arm=ARMS.find(a=>a.key===armKey);
      const r4=arm._perRing[4]; const r4c=r4[Math.floor(r4.length/2)];
      addEdge(edges,byId,r4c.id,node.id);
    });
  });
  // start-by-race
  const startByRace={};
  RACES.forEach(r=>{
    if(r.startArm==="hub") startByRace[r.key]="hub";
    else{ const arm=ARMS.find(a=>a.key===r.startArm); startByRace[r.key]=arm?arm._start:"hub"; }
  });
  return {nodes,byId,edges,startByRace};
}
function addEdge(edges,byId,a,b){
  if(a===b) return;
  if(byId[a].neighbors.includes(b)) return;
  byId[a].neighbors.push(b); byId[b].neighbors.push(a);
  edges.push([a,b]);
}
function describeEffect(e){
  const parts=[];
  if(e.stat) for(const k in e.stat) parts.push(`+${e.stat[k]} ${STAT_ABBR[k]}`);
  if(e.incTag) for(const t in e.incTag) parts.push(`+${Math.round(e.incTag[t]*100)}% ${t} dmg`);
  if(e.critChanceAdd) parts.push(`+${Math.round(e.critChanceAdd*100)}% crit chance`);
  if(e.critMultAdd) parts.push(`+${Math.round(e.critMultAdd*100)}% crit mult`);
  if(e.accuracyAdd) parts.push(`+${Math.round(e.accuracyAdd*100)}% accuracy`);
  if(e.evasionAdd) parts.push(`+${Math.round(e.evasionAdd*100)}% evasion`);
  if(e.atkSpeedAdd) parts.push(`+${Math.round(e.atkSpeedAdd*100)}% attack speed`);
  if(e.armorFlat) parts.push(`+${e.armorFlat} flat DR`);
  if(e.lifePct) parts.push(`+${Math.round(e.lifePct*100)}% max life`);
  if(e.regenAdd) parts.push(`+${(e.regenAdd*100).toFixed(1)}% life regen/turn`);
  if(e.leechPct) parts.push(`+${Math.round(e.leechPct*100)}% life leech`);
  if(e.blockChance) parts.push(`+${Math.round(e.blockChance*100)}% block`);
  if(e.dotMore) parts.push(`+${Math.round(e.dotMore*100)}% damage over time`);
  if(e.abilityMore) parts.push(`+${Math.round(e.abilityMore*100)}% ability damage`);
  if(e.abilityProc) parts.push(`+${Math.round(e.abilityProc*100)}% ability trigger`);
  if(e.execBonus) parts.push(`+${Math.round(e.execBonus*100)}% dmg vs low-life foes`);
  return parts.join(", ")||"Minor bonus";
}

/* persistence: artifact storage -> localStorage -> memory. never throws. */
const Store=(()=>{
  const mem={};
  const hasWin=()=>typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function";
  const hasLocal=()=>{try{return typeof localStorage!=="undefined"&&!!localStorage;}catch(e){return false;}};
  async function load(key){
    if(hasWin()){try{const r=await window.storage.get(key);if(r&&r.value!=null)return JSON.parse(r.value);}catch(e){}}
    if(hasLocal()){try{const v=localStorage.getItem(key);if(v!=null)return JSON.parse(v);}catch(e){}}
    return mem[key]!==undefined?mem[key]:null;
  }
  async function save(key,val){
    mem[key]=val;
    if(hasWin()){try{await window.storage.set(key,JSON.stringify(val));return;}catch(e){}}
    if(hasLocal()){try{localStorage.setItem(key,JSON.stringify(val));return;}catch(e){}}
  }
  return{load,save};
})();

function migrateOC(oc){
  if(oc.level==null) oc.level=1;

  if(!oc.record) oc.record={w:0,l:0};
  if(!oc.tree) oc.tree={allocated:[]};
  if(!Array.isArray(oc.tree.allocated)) oc.tree.allocated=[];
  const start=TREE.startByRace[oc.race]||"hub";
  if(!oc.tree.allocated.includes(start)) oc.tree.allocated.unshift(start);

  oc.tree.allocated=oc.tree.allocated.filter(id=>TREE.byId[id]);
  if(!oc.tree.jewels||typeof oc.tree.jewels!=="object") oc.tree.jewels={};
  for(const nid in oc.tree.jewels){ const n=TREE.byId[nid]; const e=oc.tree.jewels[nid]; const jk=(e&&e.key)?e.key:e; if(!n||n.type!=="jewel"||!JEWEL_BY_KEY[jk]) delete oc.tree.jewels[nid]; }
  (oc.powers||[]).forEach(p=>{ if(!Array.isArray(p.augments)) p.augments=[]; });
  if(!oc.ascendancy||typeof oc.ascendancy!=="object") oc.ascendancy={key:null,allocated:[]};
  if(!Array.isArray(oc.ascendancy.allocated)) oc.ascendancy.allocated=[];

/* ---- augment ownership + loot grades (Phase 2a) ----
   ownedAugments is [{key,grade}]. The grade lives on the OWNED gem (one per key);
   sockets store just the key and resolve their grade from the owned gem at combat
   + render time, so a Reforge upgrades a gem everywhere it's socketed at once. */
function normalizeOwned(arr){
  return (Array.isArray(arr)?arr:[]).map(x=> (x&&x.key)?{key:x.key,grade:x.grade||"common"}:{key:x,grade:"common"})
    .filter(a=>a.key && augByKey(a.key));
}
function ownsAug(k){ return (state.ownedAugments||[]).some(a=>a.key===k); }
function ownedGem(k){ return (state.ownedAugments||[]).find(a=>a.key===k); }
function augGradeOf(k){ const g=ownedGem(k); return g?(g.grade||"common"):"common"; }
function sockets(p){ return (p.augments||[]).map(x=>{ const k=(x&&x.key)?x.key:x; return {key:k,grade:(x&&x.grade)?x.grade:augGradeOf(k)}; }); }
function rollGrade(){ let t=0; for(const r of RARITY) t+=r.weight; let x=Math.random()*t; for(const r of RARITY){ x-=r.weight; if(x<=0) return r.key; } return "common"; }
function reforgeCostG(){ return 90; }
/* jewels — owned like gems, rarity-graded */
function normalizeOwnedJewels(arr){ return (Array.isArray(arr)?arr:[]).map(x=>(x&&x.key)?{key:x.key,grade:x.grade||"common"}:{key:x,grade:"common"}).filter(a=>a.key&&JEWEL_BY_KEY[a.key]); }
function ownsJewel(k){ return (state.ownedJewels||[]).some(a=>a.key===k); }
function ownedJewelGem(k){ return (state.ownedJewels||[]).find(a=>a.key===k); }
function jewelGradeOf(k){ const g=ownedJewelGem(k); return g?(g.grade||"common"):"common"; }

function gradeLegendHTML(){ return `<div class="grade-legend">${RARITY.map(r=>`<span class="gl" style="color:${r.color};border-color:${r.color}66;background:${r.color}14">${r.label}</span>`).join("")}</div>`; }
/* OC overall grade (Phase 2b): a readout of build investment + socketed loot
   rarity on the same 7-tier ladder. Rare gems literally raise a character's grade.
   Thresholds are tunable (OC_GRADE_CUT). */
const OC_GRADE_CUT=[0,14,26,42,62,86,112];
function ocGradeScore(oc){
  if(!oc) return 0;
  const start=TREE.startByRace[oc.race]||"hub";
  const alloc=(oc.tree&&oc.tree.allocated)||[];
  let keyN=0,notN=0,pts=0;
  for(const id of alloc){ if(id===start) continue; const n=TREE.byId[id]; if(!n) continue; pts++; if(n.type==="keystone") keyN++; else if(n.type==="notable") notN++; }
  let statTotal=0; for(const k of STAT_KEYS) statTotal+=(oc.baseStats&&oc.baseStats[k])||0;
  let gem=0; (oc.powers||[]).forEach(p=>(p.augments||[]).forEach(x=>{ const gk=(x&&x.key)?x.key:x; const gr=(x&&x.grade)?x.grade:augGradeOf(gk); const idx=RARITY.findIndex(r=>r.key===gr); if(idx>0) gem+=idx; }));
  // socketed jewels in allocated sockets feed the grade too
  const jmap=(oc.tree&&oc.tree.jewels)||{}, allocSet=new Set(alloc);
  for(const nid in jmap){ if(!allocSet.has(nid)) continue; const e=jmap[nid],jk=(e&&e.key)?e.key:e; const gr=(e&&e.grade)?e.grade:jewelGradeOf(jk); const idx=RARITY.findIndex(r=>r.key===gr); if(idx>0) gem+=idx; }
  return keyN*7 + notN*2.5 + pts*0.5 + statTotal/40 + gem*1.6 + (oc.level||1)*0.35;
}
function ocGrade(oc){ const s=ocGradeScore(oc); let gi=0; for(let i=0;i<OC_GRADE_CUT.length;i++){ if(s>=OC_GRADE_CUT[i]) gi=i; } return RARITY[gi].key; }
function ocGradeBadge(oc){ const R=rarByKey(ocGrade(oc)); return `<span class="ocgrade" style="color:${R.color};border-color:${R.color};background:${R.color}1a" title="Overall grade — keystones, stats, tree and socketed gem rarity">${R.label}</span>`; }

/* level / xp */
function xpNeeded(level){return Math.round(60*Math.pow(level,1.5));}
function pointsTotal(oc){return 3+(oc.level-1)+Math.floor(oc.level/10)*2;}
function pointsSpent(oc){const start=TREE.startByRace[oc.race]||"hub";return oc.tree.allocated.filter(id=>id!==start).length;}
function pointsAvail(oc){return pointsTotal(oc)-pointsSpent(oc);}
/* ascendancy points: unlock at ASC_UNLOCK_LEVEL, +1 every 6 levels, cap 5 */
function ascPointsTotal(oc){ if(!oc||(oc.level||1)<ASC_UNLOCK_LEVEL) return 0; return Math.min(5,1+Math.floor(((oc.level||1)-ASC_UNLOCK_LEVEL)/6)); }
function ascPointsSpent(oc){ return ((oc.ascendancy&&oc.ascendancy.allocated)||[]).length; }
function ascPointsAvail(oc){ return Math.max(0,ascPointsTotal(oc)-ascPointsSpent(oc)); }
function grantXP(oc,amount){
  oc.xp+=amount; let leveled=0;
  while(oc.xp>=xpNeeded(oc.level+1)){ oc.xp-=xpNeeded(oc.level+1); oc.level++; leveled++; }
  return leveled;
}

    case "asc_elementalist": M.dotMore+=0.5; M.abilityMore+=0.2; M.dmgTakenInc+=0.10; break;
    case "asc_warlord": M.abilityProc+=0.10; M.moreGlobal*=1.15; M.dmgTakenInc+=0.08; break;
    case "asc_trickster": M.evaAdd+=0.18; M.atkSpeedAdd+=0.10; M.lifeMult*=0.9; break;
  }
}
function applyNodeEffect(M,e){
  if(e.stat) for(const k in e.stat) M.statAdd[k]=(M.statAdd[k]||0)+e.stat[k];
  if(e.incTag) for(const t in e.incTag) M.incTag[t]=(M.incTag[t]||0)+e.incTag[t];
  if(e.incGeneric) M.incGeneric+=e.incGeneric;
  if(e.critChanceAdd) M.critChanceAdd+=e.critChanceAdd;
  if(e.critMultAdd) M.critMultAdd+=e.critMultAdd;
  if(e.accuracyAdd) M.accAdd+=e.accuracyAdd;
  if(e.evasionAdd) M.evaAdd+=e.evasionAdd;
  if(e.armorFlat) M.armorFlat+=e.armorFlat;
  if(e.lifePct) M.lifePct+=e.lifePct;
  if(e.regenAdd) M.regenAdd+=e.regenAdd;
  if(e.leechPct) M.leechPct+=e.leechPct;
  if(e.blockChance) M.blockChance+=e.blockChance;
  if(e.atkSpeedAdd) M.atkSpeedAdd+=e.atkSpeedAdd;
  if(e.dotMore) M.dotMore+=e.dotMore;
  if(e.abilityMore) M.abilityMore+=e.abilityMore;
  if(e.abilityProc) M.abilityProc+=e.abilityProc;
  if(e.execBonus) M.execBonus+=e.execBonus;
  if(e.keystone) applyKeystone(M,e.keystone);
}
function aggregateMods(oc){
  const M=freshM();
  for(const id of (oc.tree&&oc.tree.allocated||[])){ const n=TREE.byId[id]; if(n&&n.effect) applyNodeEffect(M,n.effect); }
  for(const id of (oc.ascendancy&&oc.ascendancy.allocated||[])){ const n=ASC_NODE_BY_ID[id]; if(n&&n.effect) applyNodeEffect(M,n.effect); }
  // jewels socketed into ALLOCATED jewel-socket nodes (grade-scaled)
  const jmap=(oc.tree&&oc.tree.jewels)||{};
  const allocSet=new Set((oc.tree&&oc.tree.allocated)||[]);
  const nodeCount=((oc.tree&&oc.tree.allocated)||[]).length;
  for(const nid in jmap){
    if(!allocSet.has(nid)) continue;
    const entry=jmap[nid]; const jk=(entry&&entry.key)?entry.key:entry; const j=JEWEL_BY_KEY[jk]; if(!j) continue;
    const gm=rarByKey((entry&&entry.grade)?entry.grade:jewelGradeOf(jk)).mult;
    applyNodeEffect(M,scaleEffect(j.mods,gm));
    if(j.scalePerNodes) M.incGeneric += j.scalePerNodes.pct*Math.floor(nodeCount/j.scalePerNodes.per)*gm;
  }
  return M;
}
function computeFinal(oc){
  const base={...oc.baseStats};
  const buffAdd={str:0,dur:0,sta:0,int:0,spd:0,cmb:0};
  for(const p of oc.powers||[]){
    if(p.effect&&p.effect.startsWith("buff_")){ const st=p.effect.slice(5); buffAdd[st]+=Math.round(BUFF_BASE[p.key]*tierMult(p.tier)); }
  }
  const M=aggregateMods(oc); const treeAdd=M.statAdd;
  const final={};
  for(const k of STAT_KEYS) final[k]=clamp(Math.round((base[k]||0)+(buffAdd[k]||0)+(treeAdd[k]||0)),1,160);
  return {final,base,buffAdd,treeAdd,M};
}
function ocStats(oc){return computeFinal(oc).final;}
function statTotal(s){return STAT_KEYS.reduce((a,k)=>a+s[k],0);}

/* ===================== COMBAT ===================== */
function applyRacePassive(F,raceKey){
  switch(raceKey){
    case "vampire": F.lifesteal=Math.max(F.lifesteal,0.15); break;
    case "vultramite": F.negate=Math.min(0.8,F.negate+0.14); break;
    case "stand_user": F.extraAtk+=0.15; break;
    case "xenomorph": F.acid=Math.max(F.acid,0.22); break;
    case "cyborg": F.flatDR+=6; break;
    case "esper": F.negate=Math.min(0.8,F.negate+clamp(F.int*0.0016,0,0.2)); break;
    case "draconid": F.dracFury=Math.max(F.dracFury,0.30); break;
    case "eldritch": F.madden=Math.min(0.4,F.madden+0.14); break;
    case "revenant": F.revivesLeft+=1; break;
    case "human": F.gloryBonus=0.25; F.xpBonus=0.25; break;
  }
}
const PROC_BASE={blast:0.35,fire:0.28,tk:0.32,warp:0.10,time:0.14,srange:0.42};
function baseFnFor(kind){
  switch(kind){
    case "blast": return (a,d)=>a.atk*1.35+a.int*0.5;
    case "fire": return (a,d)=>a.atk*1.5;
    case "tk": return (a,d)=>a.int*0.9+a.atk*0.4;
    case "warp": return (a,d)=>d.maxHp*0.22;
    default: return (a,d)=>a.atk;
  }
}
function enrichProc(name,emoji,kind,tags,m,augKeys,F){
  const A={extraHits:0,localInc:0,localMore:0,localCrit:0,localCritMult:0,procMult:0,addDots:[],leechThis:0,noMiss:false,noAilment:false,secondary:0,knockback:0,cull:0,ruthless:false};
  const powerTags=tags||[];
  for(const entry of (augKeys||[])){
    const k=(entry&&entry.key)?entry.key:entry;       // entry is a key string OR {key,grade}
    const a=augByKey(k); if(!a) continue;
    if(a.req && !powerTags.includes(a.req)) continue; // req not met -> inert
    const R=rarByKey((entry&&entry.grade)?entry.grade:"common");
    const gm=R.mult;
    const sc=v=> v>=0 ? v*gm : v/gm;                  // grade: scale upsides up, shrink downsides
    const md=a.mods;
    if(md.extraHits) A.extraHits+=md.extraHits+R.hits;
    if(md.localInc) A.localInc+=sc(md.localInc);
    if(md.localMore) A.localMore+=sc(md.localMore);
    if(md.localCrit) A.localCrit+=sc(md.localCrit);
    if(md.localCritMult) A.localCritMult+=sc(md.localCritMult);
    if(md.procMult) A.procMult+=sc(md.procMult);
    if(md.leechThis) A.leechThis=Math.max(A.leechThis,md.leechThis*gm);
    if(md.noMiss) A.noMiss=true;
    if(md.noAilment) A.noAilment=true;
    if(md.secondary) A.secondary+=md.secondary*gm;
    if(md.knockback) A.knockback=Math.max(A.knockback,md.knockback*gm);
    if(md.cull) A.cull=Math.max(A.cull,md.cull*gm);
    if(md.ruthless) A.ruthless=true;
    if(md.addDot) A.addDots.push(gm>1?Object.assign({},md.addDot,{pctOfHit:md.addDot.pctOfHit*gm}):md.addDot);
  }
  // default fire dot
  if(kind==="fire") A.addDots.unshift({type:"fire",pctOfHit:0.25,turns:3});
  if(A.noAilment) A.addDots=[];
  const pierce = kind==="tk"?0.5:kind==="blast"?0.4:kind==="warp"?0.5:0;
  const baseCh = PROC_BASE[kind==="srange"?"srange":kind]||0.3;
  const chance = clamp(baseCh*m*(1+A.procMult)+(kind==="blast"?0.05:0)+F.abilityProc, 0, 0.9);
  return {name,emoji,kind,tags:powerTags,chance,extraHits:Math.min(A.extraHits,5),
    localInc:A.localInc,localMore:A.localMore,localCrit:A.localCrit,localCritMult:A.localCritMult,
    addDots:A.addDots,leechThis:A.leechThis,noMiss:A.noMiss,secondary:Math.min(A.secondary,1),
    knockback:A.knockback,cull:A.cull,ruthless:A.ruthless,pierceDR:pierce,baseFn:baseFnFor(kind)};
}
function deriveCombat(oc){
  const cf=computeFinal(oc); const s=cf.final; const M=cf.M;
  const F={name:oc.name,color:(raceByKey(oc.race)||{}).color||"#8B6CF0",race:oc.race,level:oc.level||1,
    str:s.str,dur:s.dur,sta:s.sta,int:s.int,spd:clamp(Math.round(s.spd*M.spdMult),1,200),cmb:s.cmb,
    incGeneric:M.incGeneric,incTag:M.incTag,moreGlobal:M.moreGlobal,dmgTakenInc:M.dmgTakenInc,
    dotMore:M.dotMore,execBonus:M.execBonus,abilityMore:M.abilityMore,abilityProc:M.abilityProc,
    resolute:M.resolute,aetherOverflow:M.aetherOverflow,berserkersPact:M.berserkersPact,cannotBeCrit:M.cannotBeCrit,
    lifesteal:0,acid:0,madden:0,dracFury:0,negate:clamp(M.blockChance,0,0.8),dodgeCounter:0,invisTurns:0,flying:false,
    extraAtk:Math.max(0,M.atkSpeedAdd),regenPct:M.regenAdd,leechGlobal:M.leechPct,
    procs:[],dots:[],dotOnHit:null,revivesLeft:0,warpMax:3,warpUses:0,timeMax:5,timeUses:0,stun:0,
    gloryBonus:0,xpBonus:0,shield:0};
  F.maxHp=Math.max(40,Math.round((180+F.dur*3.5+F.sta*3.0)*(1+M.lifePct)*M.lifeMult));
  F.hp=F.maxHp;
  F.atk=Math.round(14+F.str*0.9+F.cmb*0.35);
  F.crit=M.resolute?0:clamp(0.05+F.cmb*0.0022+F.int*0.0011+M.critChanceAdd,0,0.85);
  F.critMult=Math.max(1.2,1.85+M.critMultAdd);
  F.acc=M.resolute?0.999:clamp(0.72+F.cmb*0.0018+F.int*0.0009+M.accAdd,0.45,0.995);
  F.eva=clamp(0.02+F.spd*0.0016+M.evaAdd,0,0.75);
  F.flatDR=F.dur*0.5+M.armorFlat;

  for(const p of oc.powers||[]){
    if(p.effect.startsWith("buff_")) continue;
    const m=tierMult(p.tier);
    switch(p.effect){
      case "flight": F.eva=clamp(F.eva+0.10*m,0,0.8); F.flying=true; break;
      case "regen": F.regenPct+=0.05*m; break;
      case "lifesteal": F.lifesteal=Math.max(F.lifesteal,0.30*m); break;
      case "shield": F.shield+=F.maxHp*0.25*m; break;
      case "teleport": F.eva=clamp(F.eva+0.09*m,0,0.8); F.dodgeCounter+=0.15*m; break;
      case "precog": F.eva=clamp(F.eva+0.14*m,0,0.8); break;
      case "crit_up": F.crit=M.resolute?0:clamp(F.crit+0.14*m,0,0.85); F.acc=clamp(F.acc+0.08*m,0,0.999); break;
      case "invis": F.invisTurns=Math.max(F.invisTurns,2+(m>0.5?1:0)); break;
      case "shapeshift": F.acc=clamp(F.acc+0.06*m,0,0.999); F.eva=clamp(F.eva+0.05*m,0,0.8); break;
      case "berserk": F.berserk=Math.max(F.berserk||0,0.55*m); break;
      case "necrotic": F.dotOnHit={type:"void",pct:0.03*m,turns:3}; break;
      case "venom": F.dotOnHit={type:"void",pct:0.025*m,turns:4}; break;
      case "proc": {
        const pd=powerByKey(p.key);
        F.procs.push(enrichProc(pd.name,pd.emoji,pd.kind,pd.tags,m,sockets(p),F));
        break;
      }
      case "stand": {
        const arch=standByKey(p.arch)||STAND_ARCHETYPES[0];
        if(arch.effect==="barrage"){ F.extraAtk+=0.55*m; F.atk=Math.round(F.atk*(1+0.10*m)); }
        else if(arch.effect==="guard"){ F.shield+=F.maxHp*0.30*m; F.dodgeCounter+=0.15*m; }
        else if(arch.effect==="ranged"){ F.procs.push(enrichProc("Stand Barrage","🏹","srange",["force","projectile"],m,sockets(p),F)); }
        else if(arch.effect==="time"){ F.procs.push(enrichProc("Time Stop","⏱️","time",[],m,sockets(p),F)); }
        break;
      }
    }
  }
  applyRacePassive(F,oc.race);
  if(M.secondWind) F.revivesLeft+=1;
  F.negate=clamp(F.negate,0,0.85);
  F.hp=F.maxHp;
  return F;
}

function hitDamage(att,def,base,tags,opts){
  opts=opts||{};
  let inc=att.incGeneric+(opts.localInc||0);
  if(tags) for(const t of tags) inc+=att.incTag[t]||0;
  let more=att.moreGlobal*(1+(opts.localMore||0));
  if(att.berserk>0) more*=1+(1-att.hp/att.maxHp)*att.berserk;
  if(att.dracFury>0 && att.hp>att.maxHp*0.5) more*=1+att.dracFury;
  if(att.berserkersPact && att.hp<att.maxHp*0.5) more*=1.3;
  if(opts.isAbility){ if(att.abilityMore>0) more*=(1+att.abilityMore); if(att.aetherOverflow) more*=1.3; }
  if(opts.isBasic && att.aetherOverflow) more*=0.75;
  if(att.execBonus>0 && def.hp<def.maxHp*0.5) more*=1+att.execBonus;
  let dmg=base*(1+Math.max(-0.9,inc))*more;
  if(opts.crit) dmg*=att.critMult*(1+(opts.localCritMult||0));
  dmg-=def.flatDR*(1-(opts.pierceDR||0));
  dmg=Math.max(1,dmg);
  dmg*=(1+(def.dmgTakenInc||0));
  return Math.round(dmg);
}

function simulate(ocA,ocB){
  const A=deriveCombat(ocA),B=deriveCombat(ocB);
  const log=[]; const L=(type,round,text)=>log.push({type,round,text});
  L("sys",0,`${A.name} Lv${A.level} (${(raceByKey(A.race)||{}).name}) faces ${B.name} Lv${B.level} (${(raceByKey(B.race)||{}).name}).`);
  const iA=A.spd+(A.flying?20:0), iB=B.spd+(B.flying?20:0);
  let order=iA===iB?(A.cmb>=B.cmb?[A,B]:[B,A]):(iA>iB?[A,B]:[B,A]);
  L("sys",0,`${order[0].name} is faster and moves first.`);
  const foeOf=f=>f===A?B:A;
  const hpTimeline=[{a:1,b:1}];

  function applyDamage(def,dmg){ if(def.shield>0){const ab=Math.min(def.shield,dmg);def.shield-=ab;dmg-=ab;} def.hp-=dmg; }
  function checkRevive(f,round){
    if(f.hp<=0 && f.revivesLeft>0){ f.revivesLeft--; f.hp=Math.round(f.maxHp*0.35);
      L("power",round,`✦ ${f.name} refuses to fall — rising again at ${f.hp} HP!`); return true; }
    return false;
  }
  function tickDots(f,round){
    if(!f.dots.length) return;
    let total=0; const keep=[];
    for(const d of f.dots){ total+=d.dmg; d.turns--; if(d.turns>0) keep.push(d); }
    f.dots=keep;
    if(total>0){ f.hp-=Math.round(total); L("heal",round,`${f.name} takes ${Math.round(total)} from lingering wounds.`); }
  }
  function pushDot(target,att,type,amount,turns){
    const dmg=Math.max(1,Math.round(amount*(1+att.dotMore)));
    target.dots.push({dmg,turns,type});
  }
  function basic(att,def,round,tag){
    let eva=def.eva;
    if(def.invisTurns>0) eva=clamp(eva+0.35,0,0.9);
    if(def.flying&&!att.flying) eva=clamp(eva+0.12,0,0.9);
    if(!att.resolute){
      if(def.madden>0 && Math.random()<def.madden){ L("dodge",round,`${att.name} lunges but ${def.name}'s presence warps the strike — miss.`); return; }
      if(Math.random()>(att.acc-eva)){
        if(def.dodgeCounter>0 && Math.random()<def.dodgeCounter){
          const cd=Math.max(1,Math.round(def.atk*0.7-att.flatDR));
          att.hp-=cd; L("dodge",round,`${def.name} slips the blow and counters for ${cd}!`); checkRevive(att,round);
        } else L("dodge",round,`${def.name} evades ${att.name}'s attack.`);
        return;
      }
    }
    const crit = !att.resolute && !def.cannotBeCrit && Math.random()<att.crit;
    const dmg=hitDamage(att,def,att.atk,["physical","melee"],{crit,isBasic:true});
    if(def.negate>0 && Math.random()<def.negate){ L("dodge",round,`${def.name} nullifies the hit — no damage.`); return; }
    applyDamage(def,dmg);
    if(crit) L("crit",round,`💥 CRIT! ${att.name}${tag} smashes ${def.name} for ${dmg}!`);
    else L("hit",round,`${att.name}${tag} strikes ${def.name} for ${dmg}.`);
    const leech=Math.max(att.lifesteal,att.leechGlobal);
    if(leech>0){ const h=Math.round(dmg*leech); if(h>0){ att.hp=Math.min(att.maxHp,att.hp+h); L("heal",round,`${att.name} drains ${h} vitality.`);} }
    if(def.acid>0){ const ad=Math.max(1,Math.round(att.atk*0.25*(def.acid/0.22))); att.hp-=ad; L("heal",round,`${att.name} is burned by acid blood for ${ad}!`); checkRevive(att,round); }
    if(att.dotOnHit) pushDot(def,att,att.dotOnHit.type,def.maxHp*att.dotOnHit.pct,att.dotOnHit.turns);
    checkRevive(def,round);
  }
  function firePower(att,def,pe,round){
    if(pe.kind==="warp" && att.warpUses>=att.warpMax) return false;
    if(pe.kind==="time"){
      if(att.timeUses>=att.timeMax) return false;
      att.timeUses++; L("power",round,`⏱️ ${att.name} freezes the moment and acts again!`); return "extra";
    }
    if(pe.kind==="warp") att.warpUses++;
    const hits=1+(pe.extraHits||0);
    let dealt=0;
    for(let h=0;h<hits;h++){
      if(def.hp<=0) break;
      const base=pe.baseFn(att,def);
      const critCh=clamp(att.crit+(pe.localCrit||0),0,0.9);
      const crit=!att.resolute && !def.cannotBeCrit && Math.random()<critCh;
      let extraMore=pe.localMore||0;
      if(pe.ruthless && Math.random()<0.34) extraMore+=0.6;
      let dmg=hitDamage(att,def,base,pe.tags,{crit,isAbility:true,localInc:pe.localInc,localMore:extraMore,localCritMult:pe.localCritMult,pierceDR:pe.pierceDR});
      if(def.negate>0 && Math.random()<def.negate*0.6){ L("dodge",round,`${def.name} disperses part of ${att.name}'s ${pe.name}.`); continue; }
      applyDamage(def,dmg); dealt+=dmg;
      for(const d of pe.addDots) pushDot(def,att,d.type,dmg*d.pctOfHit,d.turns);
      if(checkRevive(def,round)){} 
      if(def.hp<=0) break;
    }
    if(pe.secondary>0 && def.hp>0){
      const base=pe.baseFn(att,def)*pe.secondary;
      const dmg=hitDamage(att,def,base,pe.tags,{isAbility:true,localInc:pe.localInc,localMore:pe.localMore,pierceDR:pe.pierceDR});
      applyDamage(def,dmg); dealt+=dmg;
    }
    if(dealt>0){
      if(pe.leechThis>0){ const h=Math.round(dealt*pe.leechThis); att.hp=Math.min(att.maxHp,att.hp+h); }
      const extra = pe.leechThis>0?` (leeched ${Math.round(dealt*pe.leechThis)})`:"";
      L("power",round,`${pe.emoji} ${att.name}'s ${pe.name} hits ${def.name} for ${dealt}${hits>1?" ("+hits+" hits)":""}${extra}!`);
    }
    if(pe.knockback>0 && Math.random()<pe.knockback && def.hp>0){ def.stun=Math.min(1,def.stun+1); L("sys",round,`${def.name} is staggered!`); }
    if(pe.cull>0 && def.hp>0 && def.hp<=def.maxHp*pe.cull){ def.hp=0; L("crit",round,`🔪 ${att.name} culls the weakened ${def.name}!`); }
    checkRevive(def,round);
    return true;
  }
  function act(att,def,round,tag){
    for(const pe of att.procs){
      if(Math.random()<pe.chance){
        const r=firePower(att,def,pe,round);
        if(r==="extra"){ if(def.hp>0&&att.hp>0) act(att,def,round," again"); return; }
        if(r) return;
      }
    }
    basic(att,def,round,tag||"");
  }

  let round=0; const MAX=200;
  while(A.hp>0 && B.hp>0 && round<MAX){
    round++;
    for(const actor of order){
      if(actor.hp<=0) continue;
      const target=foeOf(actor);
      tickDots(actor,round);
      if(actor.hp<=0){ if(!checkRevive(actor,round)) break; }
      if(actor.stun>0){ actor.stun--; L("sys",round,`${actor.name} is staggered and loses the turn.`); continue; }
      if(actor.regenPct>0 && actor.hp<actor.maxHp){ const h=Math.round(actor.maxHp*actor.regenPct); if(h>0){ actor.hp=Math.min(actor.maxHp,actor.hp+h); L("heal",round,`${actor.name} regenerates ${h} HP.`);} }
      if(actor.invisTurns>0) actor.invisTurns--;
      act(actor,target,round);
      let extras=0, ch=clamp((actor.spd-target.spd)/220,0,0.5)+actor.extraAtk;
      while(target.hp>0 && actor.hp>0 && extras<2 && Math.random()<ch){ extras++; ch*=0.5; act(actor,target,round," in a flurry"); }
      if(target.hp<=0){ if(!checkRevive(target,round)) break; }
    }
    hpTimeline.push({a:clamp(A.hp/A.maxHp,0,1),b:clamp(B.hp/B.maxHp,0,1)});
  }
  let winner,loser;
  if(A.hp>0&&B.hp<=0){winner=A;loser=B;}
  else if(B.hp>0&&A.hp<=0){winner=B;loser=A;}
  else{ const ra=A.hp/A.maxHp,rb=B.hp/B.maxHp; if(ra>=rb){winner=A;loser=B;}else{winner=B;loser=A;} L("sys",round,`The clash reaches its limit — judged on who stands stronger.`); }
  L("ko",round,`${winner.name} stands victorious!`);
  return {winnerName:winner.name,loserName:loser.name,winnerIsA:winner===A,log,rounds:round,hpTimeline,
    gloryBonus:winner.gloryBonus||0,xpBonus:winner.xpBonus||0,aName:A.name,bName:B.name};
}

const $app=document.getElementById("app");
const $nav=document.getElementById("nav");
const $toasts=document.getElementById("toasts");
const $modal=document.getElementById("modal-root");

function toast(msg,kind){
  const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:""); t.textContent=msg;
  $toasts.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),300);},2400);

function newDraft(){return {step:0,race:null,spun:false,baseStats:null,rolled:false,powers:[],name:"",art:"",emoji:null,standArch:null,shopCat:"buff",enhance:{}};}
function draftAetherMax(){const r=raceByKey(state.draft.race);return BASE_AETHER+(r?r.aetherBonus:0);}
function buyCost(key,race){const p=powerByKey(key);if(!p)return 999;let c=p.base;if(race&&race.affinity.includes(key))c*=0.7;return Math.round(c);}
function upgradeCost(key,race){const p=powerByKey(key);if(!p)return 999;let c=p.base*0.55;if(race&&race.affinity.includes(key))c*=0.7;if(race&&race.key==="vultramite")c*=0.85;return Math.round(c);}
function draftSpent(){const d=state.draft,r=raceByKey(d.race);let sp=0;
  for(const p of d.powers){ if(p.key==="stand")continue; sp+=buyCost(p.key,r); const ti=tierIndex(p.tier); for(let i=1;i<=ti;i++)sp+=upgradeCost(p.key,r); }
  for(const k in d.enhance) sp+=(d.enhance[k]/2)*6; return Math.round(sp);}
function draftAether(){return draftAetherMax()-draftSpent();}
function ownedDraftPower(key){return state.draft.powers.find(p=>p.key===key);}
function applyEnhance(base,enh){const o={...base};for(const k in enh)o[k]=(o[k]||0)+enh[k];return o;}

function screenCreate(){

}
function wheelGradient(){const n=RACES.length,seg=360/n;return `conic-gradient(from 0deg,${RACES.map((r,i)=>`${r.color} ${i*seg}deg ${(i+1)*seg}deg`).join(",")})`;}
function wheelLabels(){const n=RACES.length,seg=360/n;return RACES.map((r,i)=>{const ang=i*seg+seg/2;return `<div class="seg-label" style="transform:rotate(${ang}deg) translate(0,-42%) rotate(90deg)">${r.name}</div>`;}).join("");}
function stepRace(){

const SHEET_TABS=[{k:"overview",n:"Overview"},{k:"web",n:"Skill Web"},{k:"powers",n:"Powers"},{k:"ascend",n:"Class"},{k:"train",n:"Train"}];

let _treeBounds=null;
function treeBounds(){
  if(_treeBounds) return _treeBounds;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const n of TREE.nodes){ if(n.x<minX)minX=n.x; if(n.y<minY)minY=n.y; if(n.x>maxX)maxX=n.x; if(n.y>maxY)maxY=n.y; }
  const pad=90; _treeBounds={x:minX-pad,y:minY-pad,w:(maxX-minX)+pad*2,h:(maxY-minY)+pad*2};
  return _treeBounds;
}
function nodeRadius(t){return t==="keystone"?21:t==="notable"?15:t==="jewel"?12:t==="hub"?18:9;}
function armColor(arm){const a=ARMS.find(x=>x.key===arm);return a?a.color:"#B57CFF";}
function allocState(oc){
  const alloc=new Set(oc.tree.allocated); const avail=new Set();
  for(const id of alloc){ const nn=TREE.byId[id]; if(!nn)continue; for(const nb of nn.neighbors){ if(!alloc.has(nb)) avail.add(nb); } }
  return {alloc,avail};
}
function treeSVG(oc){
  const {alloc,avail}=allocState(oc); const b=treeBounds(); const tv=state.treeView;
  let edgeStr="";
  for(const [a,c] of TREE.edges){ const na=TREE.byId[a],nc=TREE.byId[c]; const on=alloc.has(a)&&alloc.has(c);
    edgeStr+=`<line class="tedge ${on?"on":""}" x1="${na.x.toFixed(1)}" y1="${na.y.toFixed(1)}" x2="${nc.x.toFixed(1)}" y2="${nc.y.toFixed(1)}"/>`; }
  let nodeStr="",labelStr="";
  for(const n of TREE.nodes){
    const isAlloc=alloc.has(n.id), isAvail=avail.has(n.id), sel=state.treeSel===n.id;
    const col=(n.type==="keystone")?"#F5C451":(n.type==="jewel")?"#43e8d8":armColor(n.arm);
    const r=nodeRadius(n.type);
    let fill,stroke,sw,op;
    if(isAlloc){fill=col;stroke="#fff";sw=sel?4:2;op=1;}
    else if(isAvail){fill="rgba(20,18,32,.9)";stroke=col;sw=sel?4:2.5;op=1;}
    else{fill="rgba(20,18,32,.7)";stroke="rgba(160,150,210,.28)";sw=sel?3:1.5;op=.6;}
    const shape = (n.type==="keystone"||n.type==="jewel")
      ? `<rect class="tnode ${sel?"sel":""}" data-node="${n.id}" x="${(n.x-r).toFixed(1)}" y="${(n.y-r).toFixed(1)}" width="${(r*2).toFixed(1)}" height="${(r*2).toFixed(1)}" rx="5" transform="rotate(45 ${n.x.toFixed(1)} ${n.y.toFixed(1)})" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`
      : `<circle class="tnode ${sel?"sel":""}" data-node="${n.id}" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`;
    nodeStr+=shape;
    if(n.type==="keystone"||n.type==="notable"){
      const fs=n.type==="keystone"?15:12; const dy=r+fs+2;
      labelStr+=`<text x="${n.x.toFixed(1)}" y="${(n.y+dy).toFixed(1)}" text-anchor="middle" font-family="Arial Narrow,sans-serif" font-weight="bold" font-size="${fs}" fill="${isAlloc||isAvail?"#ECEAF7":"rgba(180,175,205,.55)"}" style="pointer-events:none">${esc(n.name)}</text>`;
    }
  }

    <g id="treeG" transform="translate(${tv.x} ${tv.y}) scale(${tv.scale})">${edgeStr}${nodeStr}${labelStr}</g></svg>`;
}

/* allocation logic */
function canRefund(oc,id){
  const start=TREE.startByRace[oc.race]||"hub"; if(id===start) return false;
  if(!oc.tree.allocated.includes(id)) return false;
  const remain=new Set(oc.tree.allocated.filter(x=>x!==id));
  if(remain.size===0) return true;
  // BFS from start over remain
  const seen=new Set([start]); const q=[start];
  while(q.length){ const c=q.shift(); const nn=TREE.byId[c]; if(!nn)continue; for(const nb of nn.neighbors){ if(remain.has(nb)&&!seen.has(nb)){ seen.add(nb); q.push(nb); } } }
  for(const r of remain){ if(!seen.has(r)) return false; }
  return true;
}
function allocNode(oc,id){
  const {avail}=allocState(oc);
  if(!avail.has(id)){toast("Path to an adjacent node first.","bad");return;}
  if(pointsAvail(oc)<=0){toast("No skill points available.","bad");return;}
  oc.tree.allocated.push(id); state.treeSel=id; persist();
}
function refundNode(oc,id){
  if(!canRefund(oc,id)){toast("Can't refund — would break the web.","bad");return;}
  oc.tree.allocated=oc.tree.allocated.filter(x=>x!==id); persist();
}
function respecTree(oc){
  const cost=respecCost(oc);
  if(pointsSpent(oc)===0){toast("Nothing to respec.");return;}
  if(state.glory<cost){toast(`Need ◈${cost} Glory to respec.`,"bad");return;}
  state.glory-=cost; const start=TREE.startByRace[oc.race]||"hub"; oc.tree.allocated=[start]; state.treeSel=null; persist();
  toast("Skill web reset.","good");
}
/* interactions bound after render when web tab active */
function setupTree(){
  const frame=document.getElementById("treeFrame"); if(!frame) return;
  const svg=frame.querySelector("svg"); const g=svg.querySelector("#treeG"); if(!svg||!g) return;
  const vb=svg.viewBox.baseVal;
  function apply(){ g.setAttribute("transform",`translate(${state.treeView.x} ${state.treeView.y}) scale(${state.treeView.scale})`); }
  function zoomAt(px,py,factor){ const r=svg.getBoundingClientRect(); const sx=(px-r.left)*(vb.width/r.width), sy=(py-r.top)*(vb.height/r.height);
    const s0=state.treeView.scale; const s1=clamp(s0*factor,0.5,3.4); const cx=(sx-state.treeView.x)/s0, cy=(sy-state.treeView.y)/s0;
    state.treeView.x=sx-s1*cx; state.treeView.y=sy-s1*cy; state.treeView.scale=s1; apply(); }
  let dragging=false,moved=0,lastX=0,lastY=0;
  svg.addEventListener("pointerdown",e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;try{svg.setPointerCapture(e.pointerId);}catch(_){}});
  svg.addEventListener("pointermove",e=>{ if(!dragging)return; const dx=e.clientX-lastX,dy=e.clientY-lastY; lastX=e.clientX;lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    const r=svg.getBoundingClientRect(); state.treeView.x+=dx*(vb.width/r.width); state.treeView.y+=dy*(vb.height/r.height); apply(); });
  svg.addEventListener("pointerup",e=>{ dragging=false; if(moved<6){ const t=e.target.closest("[data-node]"); if(t) selectNode(t.getAttribute("data-node")); } });
  svg.addEventListener("pointercancel",()=>{dragging=false;});
  svg.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:0.87); },{passive:false});

function runTournament(size){
  const pool=state.roster.slice(); for(let i=pool.length-1;i>0;i--){const j=randInt(0,i);[pool[i],pool[j]]=[pool[j],pool[i]];}
  let contenders=pool.slice(0,size);
  const rounds=[]; let totalG=0;
  while(contenders.length>1){
    const matches=[]; const next=[];
    for(let i=0;i<contenders.length;i+=2){
      const A=contenders[i],B=contenders[i+1];
      const res=simulate(A,B); const winnerOC=res.winnerIsA?A:B,loserOC=res.winnerIsA?B:A;
      const rew=battleRewards(winnerOC,loserOC,res);
      winnerOC.record.w++; loserOC.record.l++;
      totalG+=rew.winG+rew.loseG; grantXP(winnerOC,rew.winXP); grantXP(loserOC,rew.loseXP);
      matches.push({aId:A.id,bId:B.id,winnerId:winnerOC.id}); next.push(winnerOC);
    }
    rounds.push(matches); contenders=next;
  }
  const champ=contenders[0]; const champBonus=80; totalG+=champBonus; grantXP(champ,60);
  state.glory+=totalG; persist();
  state.tourney={rounds,champId:champ.id,totalG,champBonus}; render();
  toast(`${champ.name} is the champion! +◈${totalG} Glory`,"good");
}

function prepEnemy(e){ const c=JSON.parse(JSON.stringify(e)); c.record=c.record||{w:0,l:0}; c.xp=c.xp||0; return migrateOC(c); }
function gauntletCleared(){ return (state.gauntlet&&typeof state.gauntlet.cleared==="number")?state.gauntlet.cleared:-1; }
function screenGauntlet(){
  if(state.gauntletFight) return gauntletStage();
  if(state.roster.length<1) return `${topbar()}<div class="section-h"><span class="n">🐉</span><h2>Gauntlet</h2></div><div class="empty"><div class="big">🐉</div><div>Create a character to challenge the gauntlet.</div><div style="margin-top:14px"><button class="btn primary" data-act="startCreate">✦ Create OC</button></div></div>`;
  const cleared=gauntletCleared();
  let champ=state.roster.find(o=>o.id===state.gauntlet.champion)||state.roster[0];
  state.gauntlet.champion=champ.id;
  const champCards=state.roster.map(o=>miniOC(o,o.id===champ.id?"sel":"","pickChampion")).join("");
  const rungs=ENEMIES.map((e,i)=>{
    const done=i<=cleared, cur=i===cleared+1; const st=done?"done":cur?"cur":"locked";
    const r=raceByKey(e.race)||{}; const asc=e.ascendancy?(ASC_BY_KEY[e.ascendancy.key]||{}).name:"";
    return `<div class="grung ${st}"><div class="grung-i" style="--race-color:${r.color}">${done?"✓":cur?e.emoji:"🔒"}</div>
      <div class="grung-b"><div class="grung-n">${i+1}. ${esc(e.name)}</div><div class="grung-s">Lv ${e.level} · ${esc(r.name)}${asc?` · ${esc(asc)}`:""}</div></div>
      <div class="grung-a">${cur?`<button class="btn sm primary" data-act="fightGauntlet" data-rung="${i}">⚔ Fight</button>`:done?`<button class="btn sm ghost" data-act="fightGauntlet" data-rung="${i}">↺ Replay</button>`:`<span class="mnote" style="margin:0">locked</span>`}</div></div>`;
  }).join("");
  const beaten=cleared+1>=ENEMIES.length;
  return `${topbar()}
    <div class="section-h"><span class="n">🐉</span><h2>Gauntlet</h2><span class="c">${Math.max(0,cleared+1)}/${ENEMIES.length} cleared</span></div>
    <div style="color:var(--mist);font-size:13px;margin-bottom:10px">Send a champion up an escalating ladder of authored foes. Clear a rung to unlock the next; wins pay Glory and XP.${beaten?" <b style='color:#43e8d8'>You've conquered the gauntlet — replay any rung for Glory.</b>":""}</div>
    <div class="art-hint" style="margin-bottom:6px">Your champion</div>
    <div class="picker-grid" style="margin-bottom:14px">${champCards}</div>
    <div class="grung-list">${rungs}</div>`;
}
function runGauntlet(rung){
  let champ=state.roster.find(o=>o.id===state.gauntlet.champion)||state.roster[0]; if(!champ) return;
  const e=ENEMIES[rung]; if(!e) return; const cleared=gauntletCleared(); if(rung>cleared+1) return;
  const res=simulate(champ, prepEnemy(e)); const win=res.winnerIsA; const newClear=win&&rung>cleared;
  const glory= win ? Math.round((25+e.level*4)*(newClear?1.6:0.5)) : 6;
  const xp= win ? Math.round((30+e.level*6)*(newClear?1.4:0.4)) : 12;
  if(win) champ.record.w++; else champ.record.l++;
  state.glory+=glory; const lv=grantXP(champ, xp);
  if(newClear) state.gauntlet.cleared=rung;
  persist();
  state.gauntletFight={rung,res,enemy:e,championId:champ.id,win,glory,xp,lv,newClear};
  render();
  if(lv>0) toast(`${champ.name} reached level ${champ.level}!`,"good");
  else if(newClear) toast(`Rung ${rung+1} cleared!`,"gold");
}
function gauntletStage(){
  const b=state.gauntletFight; const A=state.roster.find(o=>o.id===b.championId); if(!A){ state.gauntletFight=null; return screenGauntlet(); }
  const B=prepEnemy(b.enemy); const rA=raceByKey(A.race)||{}, rB=raceByKey(B.race)||{};
  const last=b.res.hpTimeline[b.res.hpTimeline.length-1]||{a:0,b:0};
  const logHtml=b.res.log.map((l,i)=>`<div class="ln" style="animation-delay:${Math.min(i*0.05,3)}s"><span class="rn">${l.round?"R"+l.round:"◈"}</span><span class="${l.type}">${esc(l.text)}</span></div>`).join("");
  const nextRung=b.win&&b.rung+1<ENEMIES.length;
  return `${topbar()}
    <div class="section-h"><span class="n">🐉</span><h2>Gauntlet · Rung ${b.rung+1}</h2><span class="c">${b.res.rounds} rounds</span></div>
    <div class="vs-stage"><div class="vs-head">
      <div class="fighter-head" style="--race-color:${rA.color}"><div class="fav" style="--race-color:${rA.color}">${avatarHTML(A)}</div><div class="fn">${esc(A.name)}</div><div class="fr">${esc(rA.name)} · Lv${A.level}</div><div class="hpbar"><div class="hpf" style="width:${Math.round(last.a*100)}%"></div></div></div>
      <div class="vs-badge">VS</div>
      <div class="fighter-head right" style="--race-color:${rB.color}"><div class="fav" style="--race-color:${rB.color}">${b.enemy.emoji}</div><div class="fn">${esc(B.name)}</div><div class="fr">${esc(rB.name)} · Lv${B.level}</div><div class="hpbar"><div class="hpf" style="width:${Math.round(last.b*100)}%"></div></div></div></div>
      <div class="log">${logHtml}</div>
      <div class="result-panel"><div class="win-label">${b.win?"Victory":"Defeat"}</div><div class="win-name" style="color:${b.win?rA.color:rB.color}">${esc(b.win?A.name:B.name)}</div>
        <div class="reward"><span>✦ +${b.glory} Glory</span><span class="xp">${esc(A.name)} +${b.xp} XP${b.lv>0?` · LV+${b.lv}`:""}</span>${b.newClear?`<span class="xp" style="color:#43e8d8">◈ Rung ${b.rung+1} cleared!</span>`:""}</div><br>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${nextRung?`<button class="btn primary" data-act="gauntletNext">⚔ Next rung</button>`:""}<button class="btn" data-act="gauntletBack">← Ladder</button></div></div></div>`;
}
