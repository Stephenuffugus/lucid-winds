<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<script src="/dev-gate.js?v=2"></script>
<meta name="robots" content="noindex">
<title>Whack Box</title>
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<script>
/* ===== Sky Wolf Studios embed protocol =====
   The portal frames this page; posting ready keeps its black-screen
   watchdog quiet, and the portal's own back control posts close. */
(function(){
  var SWS_EMBED=/[?&]embed=1(&|$)/.test(location.search);
  window.SWS_EMBED=SWS_EMBED;
  window.SWS_EXIT=function(){
    if(SWS_EMBED&&parent!==window){try{parent.postMessage({sws:'close'},'*');}catch(e){} return;}
    if(document.referrer.indexOf('/portal')>=0&&history.length>1){history.back();}else{location.replace('https://lucidwinds.com/portal/');}
  };
  if(SWS_EMBED&&parent!==window){try{parent.postMessage({sws:'ready'},'*');}catch(e){}}
})();
</script>
<!-- The TV menu. Skipped when a slug is already on the URL (tests, deep links). -->
<div class="screen on" id="ps-pick">
  <div class="ps-title">WHACK BOX</div>
  <div class="ps-sub">pick tonight's game</div>
  <div class="ps-grid" id="ps-pick-grid"></div>
</div>
<div class="screen" id="ps-lobby">
  <div class="ps-title">WHACK BOX</div>
  <div class="ps-sub" id="ps-lobby-sub">Sky Wolf Studios party night</div>
  <div class="ps-codebox"><div id="ps-code">....</div></div>
  <div class="ps-joinline">Phones: open <b id="ps-join-url"></b> and enter the code</div>
  <div id="ps-roster"></div>
  <button class="ps-btn" id="ps-start" disabled>Start</button>
  <!-- A lobby whose only control is a disabled button is a trap: a title that
       needs four players and a fourth phone that will not connect leaves the
       television with no way out but a reload, which loses the room code. -->
  <button class="ps-btn ghost" id="ps-lobby-back">Pick another game</button>
  <div class="ps-note" id="ps-transport-note">Practice room: every player joins from a tab in this same
  browser. Cloud rooms for real phones arrive with the server switch-on.</div>
</div>
<!-- shell owned. Somebody will be playing this at eleven at night with a baby
     upstairs, so muting is a real control and the choice persists. -->
<button class="ps-mute" id="ps-mute" type="button" aria-label="Sound on or off"></button>
<div id="game-root"></div>
<!-- shell owned: a transport that cannot connect says so here. Silence would
     look identical to "nobody has joined yet", which is the wrong story. -->
<div class="ps-tx-err" id="ps-tx-err"></div>
<script>
document.addEventListener('party-transport-error',function(e){
  var el=document.getElementById('ps-tx-err');
  if(el){ el.textContent=(e.detail&&e.detail.message)||'The room could not connect.'; el.classList.add('on'); }
});
</script>
<script src="catalogue.js"></script>
<script src="shell/audio.js"></script>
<script src="shell/firebase-config.js"></script>
<script src="shell/transport.js"></script>
<script src="shell/host.js"></script>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var CAT=window.WHACKBOX_CATALOGUE||[];

  /* audio cannot start without a gesture, so the first real click on the page
     is what wakes it: picking a game, or pressing start */
  function paintMute(){
    var b=$('ps-mute'); if(!b) return;
    var on=window.PartySound?PartySound.isOn():false;
    b.textContent=on?'\u266A':'\u2715';
    b.classList.toggle('off',!on);
    b.title=on?'Sound on':'Sound off';
  }
  document.addEventListener('click',function(){ if(window.PartySound) PartySound.wake(); },{once:true});

  /* ⛔ KEEP THE BIG SCREEN AWAKE. A laptop plugged into a television dims and
     then sleeps after a few minutes of nobody touching it, and nobody touches
     the host: the whole point is that the phones are the controllers. So the
     screen everybody is looking at is the one most likely to go dark mid round.
     Re-requested on visibility change because the lock is dropped whenever the
     tab is hidden, and it never comes back on its own. */
  (function(){
    var lock=null;
    function hold(){
      if(!navigator.wakeLock||document.visibilityState!=='visible') return;
      navigator.wakeLock.request('screen').then(function(l){
        lock=l;
        l.addEventListener('release',function(){ lock=null; });
      })['catch'](function(){ /* refused or unsupported; the party still runs */ });
    }
    document.addEventListener('visibilitychange',function(){ if(!lock) hold(); });
    document.addEventListener('click',hold,{once:true});
    hold();
  })();
  var mb=$('ps-mute');
  if(mb) mb.addEventListener('click',function(){ if(window.PartySound){ PartySound.toggle(); paintMute(); } });
  paintMute();
  function entry(slug){ for(var i=0;i<CAT.length;i++) if(CAT[i].slug===slug) return CAT[i]; return null; }

  function launch(slug){
    var e=entry(slug);
    $('ps-pick').classList.remove('on');
    /* the lobby said "Sky Wolf Studios party night" whatever you had picked, so
       anybody wandering over had no idea what they were about to play, and the
       person who picked had no confirmation they had picked the right thing */
    if(e){
      var sub=$('ps-lobby-sub');
      if(sub) sub.innerHTML='<span class="ps-lobby-game">'+e.glyph+' '+e.name+'</span>'+
        '<span class="ps-lobby-blurb">'+e.blurb+'</span>';
    }
    if(e&&e.min) PartyShell.setMinPlayers(e.min);
    var css=document.createElement('link'); css.rel='stylesheet'; css.href='games/'+slug+'/game.css'; document.head.appendChild(css);
    var s1=document.createElement('script'); s1.src='games/'+slug+'/content.js';
    var s2=document.createElement('script'); s2.src='games/'+slug+'/host.js';
    s1.onload=function(){ document.body.appendChild(s2); };
    /* a module with no bank must still boot, so a missing content.js is not fatal */
    s1.onerror=function(){ document.body.appendChild(s2); };
    document.body.appendChild(s1);
    PartyShell.createRoom(slug);
  }

  function renderPicker(){
    var g=$('ps-pick-grid'), html='';
    for(var i=0;i<CAT.length;i++){ var c=CAT[i];
      html+='<button class="ps-card" data-slug="'+c.slug+'">'+
        '<span class="g">'+c.glyph+'</span><span class="txt"><span class="nm">'+c.name+'</span>'+
        '<span class="bl">'+c.blurb+'</span>'+
        '<span class="mt">'+c.min+' to '+c.max+' players &middot; about '+c.mins+' minutes</span></span></button>';
    }
    g.innerHTML=html;
    var btns=g.querySelectorAll('.ps-card');
    for(var j=0;j<btns.length;j++) btns[j].addEventListener('click',function(){ launch(this.getAttribute('data-slug')); });
  }

  var slug=(location.search.match(/[?&]game=([a-z0-9-]+)/)||[])[1];
  if(slug) launch(slug); else renderPicker();
})();
</script>
</body>
</html>
