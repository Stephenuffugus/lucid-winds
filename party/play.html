<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="robots" content="noindex">
<title>Join the party</title>
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<div class="screen on" id="ps-join">
  <div class="ps-title" style="font-size:34px">Join the party</div>
  <div class="ps-sub">eyes up on the big screen</div>
  <input class="ps-input" id="pj-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <input class="ps-input" id="pj-name" maxlength="12" placeholder="your name" autocomplete="off">
  <button class="ps-btn" id="pj-go">Join</button>
  <div class="ps-err" id="pj-err"></div>
</div>
<div id="game-root"></div>
<script src="shell/transport.js"></script>
<script src="shell/player.js"></script>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var qCode=(location.search.match(/[?&]r=([A-Za-z0-9]{4})/)||[])[1];
  if(qCode) $('pj-code').value=qCode.toUpperCase();
  try{ var last=localStorage.getItem('party_name'); if(last) $('pj-name').value=last; }catch(e){}
  $('pj-go').addEventListener('click',function(){
    var code=($('pj-code').value||'').trim().toUpperCase();
    var name=($('pj-name').value||'').trim();
    if(code.length!==4){ $('pj-err').textContent='The code is the four big letters on the screen.'; return; }
    if(!name){ $('pj-err').textContent='Tell the room who you are.'; return; }
    try{ localStorage.setItem('party_name',name); }catch(e){}
    $('pj-go').disabled=true; $('pj-err').textContent='';
    PartyShell.joinRoom(code,name).then(function(){
      $('ps-join').classList.remove('on');
      /* the game slug rides in on the first phase payload; until then load the
         default module, which every phone in v1 shares */
      var css=document.createElement('link'); css.rel='stylesheet'; css.href='games/mothlight/game.css'; document.head.appendChild(css);
      var s=document.createElement('script'); s.src='games/mothlight/player.js'; document.body.appendChild(s);
    })['catch'](function(err){
      $('pj-go').disabled=false;
      $('pj-err').textContent='No room answered to '+code+'. Same wifi, same browser for practice rooms.';
    });
  });
})();
</script>
</body>
</html>
