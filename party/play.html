<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="robots" content="noindex">
<title>Join the party</title>
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<div class="screen on" id="ps-join">
  <div class="ps-title" style="font-size:34px">Join the party</div>
  <div class="ps-sub">eyes up on the big screen</div>
  <input class="ps-input" id="pj-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <input class="ps-input" id="pj-name" maxlength="12" placeholder="your name" autocomplete="off">
  <button class="ps-btn" id="pj-go">Join</button>
  <div class="ps-err" id="pj-err"></div>
</div>
<div id="game-root"></div>
<!-- shell owned: a transport that cannot connect says so here. Silence would
     look identical to "nobody has joined yet", which is the wrong story. -->
<div class="ps-tx-err" id="ps-tx-err"></div>
<script>
document.addEventListener('party-transport-error',function(e){
  var el=document.getElementById('ps-tx-err');
  if(el){ el.textContent=(e.detail&&e.detail.message)||'The room could not connect.'; el.classList.add('on'); }
});
</script>
<!-- shell owned: shown when the big screen stops answering, hidden the moment
     it comes back. The phone rejoins by itself, so there is nothing to tap. -->
<div class="screen" id="ps-lost">
  <div class="ps-lost-mark">...</div>
  <div class="ps-lost-t">Lost the big screen</div>
  <div class="ps-lost-s">Waiting for it to come back. You do not need to do anything, and you will not lose your place.</div>
</div>
<script src="shell/firebase-config.js"></script>
<script src="shell/transport.js"></script>
<script src="shell/player.js"></script>
<script>
(function(){
  function $(id){return document.getElementById(id);}

  /* ONE PHONE PAGE, WHOLE CATALOGUE. The host announces its slug on join and on
     every phase; this loads that module and swaps if the room changes games.
     A module is an IIFE that owns #game-root and registers the shell callbacks,
     so loading a second one takes over the DOM and the handlers cleanly. */
  var loaded={};
  function loadGame(slug){
    if(!slug||loaded[slug]) return;
    loaded[slug]=1;
    var root=$('game-root'); if(root) root.innerHTML='';
    var css=document.createElement('link'); css.rel='stylesheet';
    css.href='games/'+slug+'/game.css'; document.head.appendChild(css);
    var s=document.createElement('script'); s.src='games/'+slug+'/player.js';
    document.body.appendChild(s);
  }
  document.addEventListener('party-game',function(ev){ loadGame(ev.detail.slug); });

  var qCode=(location.search.match(/[?&]r=([A-Za-z0-9]{4})/)||[])[1];
  if(qCode) $('pj-code').value=qCode.toUpperCase();
  try{ var last=localStorage.getItem('party_name'); if(last) $('pj-name').value=last; }catch(e){}
  $('pj-go').addEventListener('click',function(){
    var code=($('pj-code').value||'').trim().toUpperCase();
    var name=($('pj-name').value||'').trim();
    if(code.length!==4){ $('pj-err').textContent='The code is the four big letters on the screen.'; return; }
    if(!name){ $('pj-err').textContent='Tell the room who you are.'; return; }
    try{ localStorage.setItem('party_name',name); }catch(e){}
    $('pj-go').disabled=true; $('pj-err').textContent='';
    PartyShell.joinRoom(code,name).then(function(){
      $('ps-join').classList.remove('on');
      loadGame(PartyShell.gameSlug||'mothlight');
    })['catch'](function(err){
      $('pj-go').disabled=false;
      $('pj-err').textContent='No room answered to '+code+'. Same wifi, same browser for practice rooms.';
    });
  });
})();
</script>
</body>
</html>
