<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WIREWORM</title>
<meta name="description" content="Snake where your trail is live wire and every circuit you complete becomes part of the maze that kills you.">
<meta name="theme-color" content="#a3e635">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WIREWORM">
<style>
:root{
  --bg:#0a0b0f; --panel:#12141b; --line:#1c2029;
  --lime:#a3e635; --lime-dim:#6b8f22; --warm:#ffcf70;
  --text:#e7ecdd; --muted:#8e9a86;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}

/* ---- HUD ---- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px 4px;min-height:58px}
#comboWrap{position:relative;width:52px;height:52px;flex:0 0 auto;overflow:hidden}
#comboRing{position:absolute;top:0;left:0;width:52px;height:52px;display:block}
#comboTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lime)}
#scoreBox{flex:1 1 auto;min-width:0}
#score{font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
#sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#loadBox{flex:0 0 auto;text-align:right;min-width:64px;opacity:0;transition:opacity 160ms ease-out}
#loadBox.on{opacity:1}
#loadPct{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--warm)}
#loadLbl{font-size:13px;color:var(--muted)}
.iconbtn{flex:0 0 auto;width:48px;height:48px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);color:var(--text);font-size:19px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background 140ms ease-out}
.iconbtn:active{background:#1b1f28}

/* ---- board ---- */
/* flex-basis 0, not auto: with basis auto the stage sized itself to the canvas
   while layout() sized the canvas from the stage, a circular measurement that
   collapsed the board to nine pixels a cell. Basis 0 makes the stage purely
   the leftover column and breaks the loop. */
#stage{flex:1 1 0;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 0}
#board{display:block;border-radius:14px;background:#0c0f0b;touch-action:none}
#zoneL,#zoneR{position:absolute;top:0;bottom:0;width:50%;z-index:5}
#zoneL{left:0}#zoneR{right:0}
#zoneHint{position:absolute;inset:0;pointer-events:none;display:flex;z-index:6;opacity:0;
  transition:opacity 200ms ease-out}
#zoneHint.on{opacity:1}
#zoneHint div{flex:1;display:flex;align-items:center;justify-content:center;font-size:34px;color:#ffffff22}

/* ---- footer ---- */
/* height is set from layoutModel at runtime; this is the pre script fallback */
#pad{flex:0 0 auto;height:clamp(120px,17vh,160px);display:flex;gap:10px;padding:8px 12px 4px}
.padbtn{flex:1 1 0;border:1px solid var(--line);border-radius:14px;background:#10140c;color:#6d7a5f;
  font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background 120ms ease-out,color 120ms ease-out;user-select:none;touch-action:none}
.padbtn:active{background:#1d2612;color:var(--lime)}
#foot{flex:0 0 auto;display:flex;gap:8px;padding:6px 12px 10px;align-items:center}
.fbtn{flex:1 1 0;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--text);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.4px}
.fbtn:active{background:#1b1f28}
.fbtn.go{background:var(--lime);color:#0c1206;border-color:var(--lime)}

/* ---- overlays ---- */
.sheet{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  background:rgba(6,7,10,0.93);backdrop-filter:blur(6px);padding:calc(14px + var(--safe-t)) 16px calc(14px + var(--safe-b));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{display:flex}
.sheet h2{margin:2px 0 2px;font-size:23px;letter-spacing:0.5px}
.sheet p{margin:6px 0;font-size:15px;color:var(--muted);line-height:1.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:48px;padding:6px 0;border-bottom:1px solid var(--line)}
.row label{font-size:15px}
.row .val{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgl{min-width:88px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.tgl.on{background:var(--lime);color:#0c1206;border-color:var(--lime)}
input[type=range]{flex:1 1 auto;height:48px;accent-color:var(--lime)}
#cardWrap{display:flex;justify-content:center;margin:8px 0}
#cardImg{max-width:100%;width:250px;border-radius:12px;border:1px solid var(--line)}
#statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;top:0;transform:translateX(-50%);
  background:#1b2113;border:1px solid var(--lime-dim);color:var(--text);padding:10px 16px;border-radius:12px;
  font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity 160ms ease-out;max-width:86%}
#toast.on{opacity:1}
#testPanel{position:absolute;inset:0;z-index:60;background:#05060a;color:#cfe;overflow:auto;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px;display:none;white-space:pre-wrap}
#testPanel.on{display:block}
.fail{color:#ff8080}.pass{color:#9be36b}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="comboWrap"><canvas id="comboRing" width="104" height="104"></canvas><div id="comboTxt">x1</div></div>
    <div id="scoreBox"><div id="score">0</div><div id="sub"></div></div>
    <div id="loadBox"><div id="loadPct">0%</div><div id="loadLbl">load</div></div>
    <button class="iconbtn" id="btnOpt" aria-label="Options">&#9881;</button>
  </div>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="zoneL" aria-label="Turn left"></div>
    <div id="zoneR" aria-label="Turn right"></div>
    <div id="zoneHint"><div>&#8630;</div><div>&#8631;</div></div>
  </div>
  <div id="pad">
    <button class="padbtn" id="padL" aria-label="Turn left">&#8630;</button>
    <button class="padbtn" id="padR" aria-label="Turn right">&#8631;</button>
  </div>
  <div id="foot">
    <button class="fbtn" id="btnExit">EXIT</button>
    <button class="fbtn" id="btnDaily">DAILY</button>
    <button class="fbtn go" id="btnStart">START</button>
  </div>

  <div class="sheet" id="sheetOver">
    <h2 id="overTitle"></h2>
    <p id="overLine"></p>
    <div id="cardWrap"><img id="cardImg" alt="Your final board"></div>
    <div id="statGrid"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="fbtn" id="btnDownload">SAVE CARD</button>
      <button class="fbtn" id="btnShare">SHARE</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="fbtn" id="btnReplay">WATCH BEST</button>
      <button class="fbtn go" id="btnAgain">PLAY AGAIN</button>
    </div>
    <p id="installLine" style="display:none"></p>
  </div>

  <div class="sheet" id="sheetOpt">
    <h2 id="optTitle"></h2>
    <div class="row"><label for="rngVol">Volume</label><input type="range" id="rngVol" min="0" max="100" step="5"><span class="val" id="volVal">0</span></div>
    <div class="row"><label>Sound</label><button class="tgl" id="tglMute"></button></div>
    <div class="row"><label>Haptics</label><button class="tgl" id="tglHap"></button></div>
    <div class="row"><label>Reduced motion</label><button class="tgl" id="tglMotion"></button></div>
    <div class="row"><label>Show turn zones</label><button class="tgl" id="tglZones"></button></div>
    <div id="optStats"></div>
    <p id="optSeed"></p>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="fbtn" id="btnCopySeed">COPY SEED LINK</button>
      <button class="fbtn go" id="btnOptClose">DONE</button>
    </div>
    <p id="howto"></p>
  </div>

  <div id="toast"></div>
  <div id="testPanel"></div>
</div>

<script>
/* WIREWORM — Sky Wolf Studios
   game id: wireworm · accent electric lime #a3e635
   seed policy: ?seed=<int> boots that exact run; daily mode uses FNV-1a of
     YYYY-MM-DD + game id; otherwise a fresh time seed.
   layers: CONFIG / RNG / DATA / GEN / SIM (pure, DOM free, time free)
           then SAVE, TEST, VIEW, INPUT, BOOT.
   sim.js extracts the three marked blocks below and runs them headless. */

// ---- SIM_EXPORT_START ----
/* ===================================================================
   1. CONFIG — every tunable number, frozen.
   =================================================================== */
var CONFIG = Object.freeze({
  GAME_ID: 'wireworm',
  SAVE_KEY: 'lw_wireworm_v1',
  GRID: 20,
  CELLS: 400,
  START_CELL: 210,          // (10,10) centre
  START_HEADING: 1,         // 0 up, 1 right, 2 down, 3 left
  TICK_START_MS: 220,       // driver only. SIM never sees milliseconds.
  TICK_STEP_MS: 4,          // faster per completed circuit
  TICK_FLOOR_MS: 90,
  COMBO_WINDOW: 40,         // ticks. the window off a cold start and at the first rung
  /* The window TIGHTENS as the ladder climbs. Spec says 40 ticks; at 20x20 a
     competent player completes every 5 to 25 ticks, so a flat 40 pinned the
     combo at x4 inside about 50 ticks and the ladder stopped being a decision.
     Holding x4 now costs 20 ticks, which is inside the range a long red circuit
     takes, so the top of the ladder is a real choice between paying for length
     and holding the multiplier. Director default, recorded in BUILD-NOTES. */
  COMBO_WINDOWS: Object.freeze([40, 40, 32, 26, 20]),
  COMBO_LADDER: Object.freeze([1, 1.5, 2, 3, 4]),
  OVERLOAD_PCT: 0.55,
  OVERLOAD_CELLS: 220,      // floor(400 * 0.55). Fires at >= this many.
  OVERLOAD_BONUS_PER_CELL: 5,
  WARN_PCT: 0.35,           // load readout appears past here
  DISCHARGE_INTERVAL: 90,   // ticks between pickup spawns
  CREEP_INTERVAL: 45,       // ticks with no completion before live wire creeps one cell
  DAILY_TICKS: 600,         // the daily is a fixed shift, not a survival run
  STALL_CHECK: 24,          // ticks between "can the worm still reach anything" sweeps
  STALL_LIMIT: 300,         // ticks of zero progress before the board comes to you
  PAIRS: 2,                 // terminal pairs live on the board
  GREEN_MAX_DIST: 6,        // green pairs spawn within this manhattan distance
  RED_MIN_DIST: 20,         // red pairs must land at least this far apart
  QUEUE_CAP: 2,             // input queue slots
  FILL_TARGET: 90           // sweep agent only: cells the board filler grows a slice to
});

/* cell codes */
var EMPTY = 0, WIRE = 1, TERM = 2, PICK = 3;
/* headings: 0 up, 1 right, 2 down, 3 left */
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

/* ===================================================================
   2. RNG — mulberry32. Math.random is banned in every layer above VIEW.
   =================================================================== */
function makeRNG(seed) {
  var a = seed >>> 0;
  var r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = function (n) { return Math.floor(r() * n); };
  r.range = function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); };
  r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
  r.shuffle = function (arr) {
    var a2 = arr.slice(), i, j, t;
    for (i = a2.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); t = a2[i]; a2[i] = a2[j]; a2[j] = t; }
    return a2;
  };
  r.weighted = function (pairs) {
    var total = 0, i, x;
    for (i = 0; i < pairs.length; i++) total += pairs[i][1];
    x = r() * total;
    for (i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
    return pairs[pairs.length - 1][0];
  };
  r.getState = function () { return a | 0; };
  r.setState = function (s) { a = s | 0; };
  r.seed = seed >>> 0;
  return r;
}

/* The same generator, stepped through a serialisable field on the state so a
   run can be hashed, cloned and replayed without carrying a closure. */
function rngNext(st) {
  var a = st.rngState | 0;
  a = (a + 0x6D2B79F5) | 0;
  st.rngState = a;
  var t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(st, n) { return Math.floor(rngNext(st) * n); }

function seedFromString(s) {
  var h = 0x811c9dc5, i;
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function dailySeed(dateStr) { return seedFromString(dateStr + CONFIG.GAME_ID); }

/* ===================================================================
   3. DATA — colours, glyph ids, and every player facing string.
        COPY is checked by a grep gate: no dash characters, ever.
   =================================================================== */
var COLORS = [
  { key: 'green', name: 'Green', mult: 1.0, weight: 40, hex: '#4ade80', glyph: 0 },
  { key: 'blue',  name: 'Blue',  mult: 1.5, weight: 30, hex: '#60a5fa', glyph: 1 },
  { key: 'amber', name: 'Amber', mult: 2.5, weight: 20, hex: '#fbbf24', glyph: 2 },
  { key: 'red',   name: 'Red',   mult: 4.0, weight: 10, hex: '#f87171', glyph: 3 }
];
/* glyph 0 triangle, 1 square, 2 diamond, 3 cross. Shape doubles colour so the
   board reads in greyscale (colourblind law, CRAFT section D). */

var COPY = Object.freeze({
  title: 'WIREWORM',
  tagline: 'Your trail is live wire. Close a circuit and it lights up. Lit wire kills you.',
  start: 'START',
  again: 'PLAY AGAIN',
  daily: 'DAILY',
  exit: 'EXIT',
  options: 'Options',
  howto: 'Tap the left half to turn left, the right half to turn right. Swipe works too, and so do the arrow keys. Touch a terminal to charge, touch its twin to close the circuit.',
  deadWall: 'You ran off the board.',
  deadLive: 'You touched your own live wire.',
  deadClock: 'The shift ended. Nothing killed you but the clock.',
  labLeft: 'left ',
  dailyHint: 'The daily is a fixed shift. Six hundred ticks, one board, everyone the same.',
  overTitle: 'Look what you built',
  bestNew: 'New best score.',
  seedLine: 'Seed ',
  copied: 'Seed link copied.',
  shareFail: 'Copy failed. The seed is in the options panel.',
  installLine: 'Add WIREWORM to your home screen and it runs offline.',
  noReplay: 'No saved run yet. Finish one first.',
  replaying: 'Watching your best run.',
  dailyDone: 'Daily done. Streak ',
  statScore: 'score', statTicks: 'ticks', statCircuits: 'circuits', statCombo: 'best combo',
  statLongest: 'longest circuit', statOverloads: 'overloads',
  labLoad: 'load', labBest: 'best ', labRuns: 'runs ',
  volume: 'Volume', sound: 'Sound', haptics: 'Haptics', motion: 'Reduced motion',
  zones: 'Show turn zones', on: 'ON', off: 'OFF', done: 'DONE',
  copySeed: 'COPY SEED LINK', download: 'SAVE CARD', share: 'SHARE',
  watchBest: 'WATCH BEST', studio: 'SKY WOLF STUDIOS'
});

/* ===================================================================
   4. GEN — board queries and spawn placement. Seeded, DOM free.
   =================================================================== */
function cx(i) { return i % CONFIG.GRID; }
function cy(i) { return (i / CONFIG.GRID) | 0; }
function manhattan(a, b) { return Math.abs(cx(a) - cx(b)) + Math.abs(cy(a) - cy(b)); }

/* Flood fill from the worm head across every cell that is not energized.
   Dead wire is passable, so it is only live wire and the edge that bound the
   reachable region. Returns a Uint8Array mask. */
function reachMask(st) {
  var n = CONFIG.CELLS, g = CONFIG.GRID;
  var seen = new Uint8Array(n);
  var queue = new Int32Array(n);
  var qh = 0, qt = 0;
  seen[st.head] = 1; queue[qt++] = st.head;
  while (qh < qt) {
    var c = queue[qh++], x = cx(c), y = cy(c), d, nx, ny, ni;
    for (d = 0; d < 4; d++) {
      nx = x + DX[d]; ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= g || ny >= g) continue;
      ni = ny * g + nx;
      if (seen[ni]) continue;
      if (st.cover[ni] > 0) continue;      // live wire blocks
      seen[ni] = 1; queue[qt++] = ni;
    }
  }
  return seen;
}

/* Cells inside the uncommitted circuit. Nothing may spawn on them: a terminal
   dropped there would be overwritten the moment the circuit closes. */
function pendingMask(st) {
  var m = new Uint8Array(CONFIG.CELLS);
  if (!st.charge) return m;
  var i;
  for (i = st.charge.sliceStart; i < st.trail.length; i++) m[st.trail[i]] = 1;
  return m;
}

function spawnCandidates(st) {
  var reach = reachMask(st), pend = pendingMask(st), out = [], i;
  for (i = 0; i < CONFIG.CELLS; i++) {
    if (st.cell[i] === EMPTY && reach[i] && !pend[i] && i !== st.head) out.push(i);
  }
  return out;
}

/* Exact maximum manhattan distance pair over a candidate set in O(n):
   max |dx|+|dy| equals max((x+y)) - min((x+y)) or max((x-y)) - min((x-y)). */
function maxDistPair(st, cand) {
  var maxS = -1e9, minS = 1e9, maxD = -1e9, minD = 1e9;
  var i, c, s, d;
  var lMaxS = [], lMinS = [], lMaxD = [], lMinD = [];
  for (i = 0; i < cand.length; i++) {
    c = cand[i]; s = cx(c) + cy(c); d = cx(c) - cy(c);
    if (s > maxS) { maxS = s; lMaxS = [c]; } else if (s === maxS) lMaxS.push(c);
    if (s < minS) { minS = s; lMinS = [c]; } else if (s === minS) lMinS.push(c);
    if (d > maxD) { maxD = d; lMaxD = [c]; } else if (d === maxD) lMaxD.push(c);
    if (d < minD) { minD = d; lMinD = [c]; } else if (d === minD) lMinD.push(c);
  }
  var a, b;
  if ((maxS - minS) >= (maxD - minD)) {
    a = lMaxS[rngInt(st, lMaxS.length)]; b = lMinS[rngInt(st, lMinS.length)];
  } else {
    a = lMaxD[rngInt(st, lMaxD.length)]; b = lMinD[rngInt(st, lMinD.length)];
  }
  if (a === b) {                       // degenerate set, fall back to any two
    a = cand[0]; b = cand[cand.length - 1];
  }
  return [a, b];
}

function weightedColorIndex(st) {
  var total = 0, i;
  for (i = 0; i < COLORS.length; i++) total += COLORS[i].weight;
  var x = rngNext(st) * total;
  for (i = 0; i < COLORS.length; i++) { x -= COLORS[i].weight; if (x <= 0) return i; }
  return COLORS.length - 1;
}

function spawnPair(st) {
  var cand = spawnCandidates(st);
  if (cand.length < 2) return null;
  var ci = weightedColorIndex(st), col = COLORS[ci];
  var a, b, i, near, best, bd, dd;

  if (col.key === 'red') {
    var pr = maxDistPair(st, cand); a = pr[0]; b = pr[1];
  } else if (col.key === 'green') {
    a = cand[rngInt(st, cand.length)];
    near = [];
    for (i = 0; i < cand.length; i++) {
      if (cand[i] !== a && manhattan(cand[i], a) <= CONFIG.GREEN_MAX_DIST) near.push(cand[i]);
    }
    if (near.length) b = near[rngInt(st, near.length)];
    else {                                   // nothing close, take the nearest
      best = -1; bd = 1e9;
      for (i = 0; i < cand.length; i++) {
        if (cand[i] === a) continue;
        dd = manhattan(cand[i], a);
        if (dd < bd) { bd = dd; best = cand[i]; }
      }
      b = best;
    }
  } else {
    a = cand[rngInt(st, cand.length)];
    do { b = cand[rngInt(st, cand.length)]; } while (b === a && cand.length > 1);
  }
  if (a === b || a === undefined || b === undefined) return null;

  st.cell[a] = TERM; st.cell[b] = TERM;
  st.tcol[a] = ci + 1; st.tcol[b] = ci + 1;
  var pair = { id: st.nextPairId++, ci: ci, color: col.key, mult: col.mult, active: [a, b], open: false };
  st.pairs.push(pair);
  return pair;
}

function removePairCells(st, pair) {
  var i, c;
  for (i = 0; i < pair.active.length; i++) {
    c = pair.active[i];
    if (st.cell[c] === TERM) { st.cell[c] = EMPTY; st.tcol[c] = 0; }
  }
  pair.active.length = 0;
}
function dropPair(st, id) {
  var i;
  for (i = 0; i < st.pairs.length; i++) if (st.pairs[i].id === id) { st.pairs.splice(i, 1); return; }
}
function topUpPairs(st) {
  var guard = 0;
  while (st.pairs.length < CONFIG.PAIRS && guard++ < 4) { if (!spawnPair(st)) break; }
}

function spawnPickup(st) {
  var cand = spawnCandidates(st), ok = [], i, c, x, y, dx, dy, nx, ny, bad;
  for (i = 0; i < cand.length; i++) {
    c = cand[i]; x = cx(c); y = cy(c); bad = false;
    for (dy = -1; dy <= 1 && !bad; dy++) {
      for (dx = -1; dx <= 1; dx++) {
        nx = x + dx; ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= CONFIG.GRID || ny >= CONFIG.GRID) continue;
        if (st.cover[ny * CONFIG.GRID + nx] > 0) { bad = true; break; }
      }
    }
    if (!bad) ok.push(c);
  }
  if (!ok.length) return -1;
  var pick = ok[rngInt(st, ok.length)];
  st.cell[pick] = PICK;
  st.pickup = pick;
  st.ticksSincePickup = 0;
  return pick;
}

/* ===================================================================
   5. SIM — pure state machine. No DOM, no clock, no Math.random.
        step(state, turn) with turn in {-1, 0, +1}. One cell per call.
   =================================================================== */
function newGame(seed, opts) {
  var m = (opts && opts.mode) || 'free';
  var st = {
    seed: seed >>> 0,
    rngState: seed >>> 0,
    mode: m,
    /* ENDLESS runs until the board kills you. DAILY runs a fixed shift: same
       seed, same clock, so the only variable left is how you played it. A clock
       instead of a wall changes the whole calculus, because you cannot bank
       longevity and the breaker becomes the only way to score big in time. */
    tickLimit: m === 'daily' ? CONFIG.DAILY_TICKS : 0,
    cell: new Uint8Array(CONFIG.CELLS),
    cover: new Uint16Array(CONFIG.CELLS),   // living circuits covering the cell
    ccol: new Uint8Array(CONFIG.CELLS),     // colour id + 1 of the newest circuit
    tcol: new Uint8Array(CONFIG.CELLS),     // colour id + 1 of a terminal
    trail: [CONFIG.START_CELL],
    head: CONFIG.START_CELL,
    heading: CONFIG.START_HEADING,
    circuits: [],
    nextCircuitId: 1,
    charge: null,
    pairs: [],
    nextPairId: 1,
    pickup: -1,
    ticksSincePickup: 0,
    tick: 0,
    score: 0,
    energized: 0,
    circuitsCompleted: 0,
    comboIdx: -1,
    lastCompleteTick: -9999,
    comboPeak: 1,
    longest: 0,
    overloads: 0,
    overloadBonus: 0,
    discharges: 0,
    rescues: 0,
    creeps: 0,
    creepTicks: 0,
    stallTicks: 0,
    alive: true,
    cause: null
  };
  st.cell[CONFIG.START_CELL] = WIRE;
  topUpPairs(st);
  return st;
}

function comboMult(st) { return CONFIG.COMBO_LADDER[st.comboIdx < 0 ? 0 : st.comboIdx]; }

/* The window you have to beat from the rung you are standing on. */
function comboWindow(st) {
  var i = st.comboIdx;
  if (i < 0) return CONFIG.COMBO_WINDOW;
  return CONFIG.COMBO_WINDOWS[i < CONFIG.COMBO_WINDOWS.length ? i : CONFIG.COMBO_WINDOWS.length - 1];
}

function energizeSlice(st, s, e) {
  var mark = new Uint8Array(CONFIG.CELLS), cells = [], i, c;
  for (i = s; i <= e; i++) {
    c = st.trail[i];
    if (!mark[c]) { mark[c] = 1; cells.push(c); }
  }
  return cells;
}

function fireOverload(st, ev) {
  var n = st.energized, i;
  var bonus = n * CONFIG.OVERLOAD_BONUS_PER_CELL;
  st.score += bonus;
  st.overloadBonus += bonus;
  for (i = 0; i < CONFIG.CELLS; i++) {
    if (st.cell[i] === WIRE) { st.cell[i] = EMPTY; st.ccol[i] = 0; }
    st.cover[i] = 0;
  }
  st.energized = 0;
  st.circuits.length = 0;
  st.overloads++;
  st.cell[st.head] = WIRE;                 // the worm still stands somewhere
  /* An open circuit restarts from where the player stands. Without this the
     next completion would resurrect wire the breaker just cleared. */
  if (st.charge) st.charge.sliceStart = st.trail.length - 1;
  st.stallTicks = 0;
  st.creepTicks = 0;
  ev.push({ t: 'overload', bonus: bonus, cells: n });
}

function completeCircuit(st, pair, ev) {
  var s = st.charge.sliceStart, e = st.trail.length - 1;
  var cells = energizeSlice(st, s, e), i, c;
  for (i = 0; i < cells.length; i++) {
    c = cells[i];
    st.cell[c] = WIRE;                     // a discharge may have erased it
    if (st.cover[c] === 0) st.energized++;
    st.cover[c]++;
    st.ccol[c] = pair.ci + 1;
  }
  var len = cells.length;
  st.comboIdx = st.comboIdx >= 0 ? Math.min(st.comboIdx + 1, CONFIG.COMBO_LADDER.length - 1) : 0;
  var cm = CONFIG.COMBO_LADDER[st.comboIdx];
  var gained = Math.floor(len * pair.mult * cm);
  st.score += gained;
  st.circuits.push({ id: st.nextCircuitId++, ci: pair.ci, cells: cells, len: len, tick: st.tick, score: gained });
  st.circuitsCompleted++;
  st.lastCompleteTick = st.tick;
  if (cm > st.comboPeak) st.comboPeak = cm;
  if (len > st.longest) st.longest = len;
  st.charge = null;
  removePairCells(st, pair);
  dropPair(st, pair.id);
  st.stallTicks = 0;
  st.creepTicks = 0;
  ev.push({ t: 'completed', cells: cells, len: len, score: gained, combo: cm, ci: pair.ci, s: s, e: e });
  if (st.energized >= CONFIG.OVERLOAD_CELLS) fireOverload(st, ev);
  topUpPairs(st);
}

function touchTerminal(st, idx, ev) {
  var pi = -1, i, k;
  for (i = 0; i < st.pairs.length; i++) {
    if (st.pairs[i].active.indexOf(idx) >= 0) { pi = i; break; }
  }
  if (pi < 0) return;                      // stale terminal marker, ignore
  var p = st.pairs[pi];
  k = p.active.indexOf(idx); p.active.splice(k, 1);
  st.tcol[idx] = 0;

  if (st.charge && st.charge.pairId === p.id) { completeCircuit(st, p, ev); return; }

  if (st.charge) {                         // swapping colour abandons the open pair
    var old = null;
    for (i = 0; i < st.pairs.length; i++) if (st.pairs[i].id === st.charge.pairId) old = st.pairs[i];
    if (old) { removePairCells(st, old); dropPair(st, old.id); }
    st.charge = null;
    ev.push({ t: 'abandoned' });
  }
  p.open = true;
  st.charge = { pairId: p.id, ci: p.ci, mult: p.mult, sliceStart: st.trail.length - 1 };
  st.stallTicks = 0;
  ev.push({ t: 'charged', ci: p.ci, mult: p.mult });
  topUpPairs(st);
}

function dischargeOldest(st, ev) {
  if (!st.circuits.length) { ev.push({ t: 'discharged', cells: 0, removed: [] }); return; }
  var c = st.circuits.shift(), removed = [], i, idx;
  for (i = 0; i < c.cells.length; i++) {
    idx = c.cells[i];
    if (st.cover[idx] > 0) {
      st.cover[idx]--;
      if (st.cover[idx] === 0) {
        st.energized--;
        if (idx !== st.head) { st.cell[idx] = EMPTY; st.ccol[idx] = 0; removed.push(idx); }
      }
    }
  }
  st.stallTicks = 0;
  ev.push({ t: 'discharged', cells: removed.length, removed: removed, circuit: c.id });
}

function touchPickup(st, ev) {
  st.pickup = -1;
  st.ticksSincePickup = 0;
  st.discharges++;
  dischargeOldest(st, ev);
}

/* Terminal rescue. A worm can seal itself into a pocket: no terminal reachable,
   and every free cell either unreachable or adjacent to live wire so no pickup
   can spawn either. Found by seed 9001, where the run simply never ended.
   Sweep reachability on a slow cadence and move the objectives to where the
   player actually is. If there is nowhere legal at all, trip the oldest
   circuit as a mercy so the pocket reopens. */
function rescueCheck(st, ev) {
  var reach = reachMask(st), any = false, i, j;
  for (i = 0; i < st.pairs.length && !any; i++) {
    for (j = 0; j < st.pairs[i].active.length; j++) {
      if (reach[st.pairs[i].active[j]]) { any = true; break; }
    }
  }
  /* Reachable is not the same as reachable in time. A worm that has made no
     progress at all for STALL_LIMIT ticks gets the objectives moved to it,
     which is also the only thing that guarantees every run terminates. */
  if (any && st.stallTicks < CONFIG.STALL_LIMIT) return;
  for (i = 0; i < st.pairs.length; i++) removePairCells(st, st.pairs[i]);
  st.pairs.length = 0;
  st.charge = null;
  topUpPairs(st);
  if (st.pairs.length === 0 && st.circuits.length) {
    st.discharges++;
    dischargeOldest(st, ev);
    topUpPairs(st);
  }
  st.rescues++;
  st.stallTicks = 0;
  ev.push({ t: 'rescue', pairs: st.pairs.length });
}

/* CREEP. The one hazard the game did not have.
   Before this, nothing on the board moved unless the player moved it, so a
   player who simply refused to close circuits was safe forever: the safety
   filtered random walker medians 1424 ticks against a greedy 287 precisely
   because it almost never completes a circuit and therefore never builds
   anything lethal. That is a game with no ambient pressure.

   Now current that has nowhere to go spreads. Every CREEP_INTERVAL ticks
   WITHOUT a completion, one empty cell touching live wire lights up and joins
   the newest circuit, so a discharge still clears it. Fairness rules, all
   asserted: it never lights a cell next to the worm's head, never lights a cell
   inside the circuit the player is currently drawing, never takes a terminal or
   the pickup, and it is reverted on the spot if it would cut the worm off from
   every terminal. It can trip the breaker, which is the point: sitting still
   near the threshold is a way to cash the overload, not only a punishment. */
/* Every cell the current may legally spread into. Split out of creepStep so the
   fairness rules are unit testable: a statistical sweep almost never SEES a
   head adjacent candidate, so a sweep alone would have passed with the guard
   deleted, which is a gate that cannot fail. */
function creepCandidates(st) {
  var pend = pendingMask(st), g = CONFIG.GRID, cand = [], i, x, y, d, nx, ny, touch;
  var hx = cx(st.head), hy = cy(st.head);
  for (i = 0; i < CONFIG.CELLS; i++) {
    if (st.cover[i] > 0 || st.cell[i] === TERM || st.cell[i] === PICK) continue;
    if (i === st.head || pend[i]) continue;
    x = cx(i); y = cy(i);
    if (Math.abs(x - hx) + Math.abs(y - hy) <= 1) continue;   // never under your nose
    touch = false;
    for (d = 0; d < 4; d++) {
      nx = x + DX[d]; ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= g || ny >= g) continue;
      if (st.cover[ny * g + nx] > 0) { touch = true; break; }
    }
    if (touch) cand.push(i);
  }
  return cand;
}

function creepStep(st, ev) {
  if (!st.circuits.length) return;
  var cand = creepCandidates(st);
  if (!cand.length) return;
  var c = cand[rngInt(st, cand.length)];
  var circ = st.circuits[st.circuits.length - 1];
  var wasCode = st.cell[c], wasCol = st.ccol[c];
  st.cell[c] = WIRE; st.cover[c] = 1; st.ccol[c] = circ.ci + 1; st.energized++;

  /* a hazard is allowed to be cruel, not unfair: if that cell just sealed every
     objective away from the worm, it never happened */
  var reach = reachMask(st), ok = false, p, q;
  for (p = 0; p < st.pairs.length && !ok; p++) {
    for (q = 0; q < st.pairs[p].active.length; q++) if (reach[st.pairs[p].active[q]]) { ok = true; break; }
  }
  if (!ok) {
    st.cell[c] = wasCode; st.cover[c] = 0; st.ccol[c] = wasCol; st.energized--;
    return;
  }
  circ.cells.push(c);
  circ.len++;
  st.creeps++;
  ev.push({ t: 'creep', cell: c, ci: circ.ci });
  if (st.energized >= CONFIG.OVERLOAD_CELLS) fireOverload(st, ev);
}

function step(st, turn) {
  var ev = [];
  if (!st.alive) return { state: st, events: ev };
  if (turn === -1 || turn === 1) st.heading = (st.heading + turn + 4) & 3;

  var x = cx(st.head) + DX[st.heading], y = cy(st.head) + DY[st.heading];
  if (x < 0 || y < 0 || x >= CONFIG.GRID || y >= CONFIG.GRID) {
    st.alive = false; st.cause = 'wall';
    ev.push({ t: 'died', cause: 'wall' });
    return { state: st, events: ev };
  }
  var ni = y * CONFIG.GRID + x;
  if (st.cover[ni] > 0) {
    st.alive = false; st.cause = 'live';
    ev.push({ t: 'died', cause: 'live' });
    return { state: st, events: ev };
  }

  var code = st.cell[ni];
  st.head = ni;
  st.trail.push(ni);
  st.cell[ni] = WIRE;
  st.tick++;

  if (code === TERM) touchTerminal(st, ni, ev);
  else if (code === PICK) touchPickup(st, ev);

  if (st.comboIdx >= 0 && (st.tick - st.lastCompleteTick) > comboWindow(st)) {
    st.comboIdx = -1;
    ev.push({ t: 'combodrop' });
  }

  st.ticksSincePickup++;
  if (st.pickup < 0 && st.circuits.length > 0 && st.ticksSincePickup >= CONFIG.DISCHARGE_INTERVAL) {
    var p = spawnPickup(st);
    if (p >= 0) ev.push({ t: 'pickup', cell: p });
  }
  st.creepTicks++;
  if (st.creepTicks >= CONFIG.CREEP_INTERVAL) { st.creepTicks = 0; creepStep(st, ev); }
  st.stallTicks++;
  if (st.tick % CONFIG.STALL_CHECK === 0) rescueCheck(st, ev);
  if (st.tickLimit && st.tick >= st.tickLimit) {
    st.alive = false; st.cause = 'clock';
    ev.push({ t: 'died', cause: 'clock' });
  }
  return { state: st, events: ev };
}

/* Deterministic fingerprint of a run. FNV-1a over the board and the counters. */
function hashState(st) {
  var h = 0x811c9dc5, i;
  function mix(v) { h ^= (v | 0) & 0xff; h = Math.imul(h, 0x01000193); h ^= ((v | 0) >>> 8) & 0xff; h = Math.imul(h, 0x01000193); }
  for (i = 0; i < CONFIG.CELLS; i++) { mix(st.cell[i]); mix(st.cover[i] > 0 ? 1 : 0); }
  mix(st.head); mix(st.heading); mix(st.tick); mix(st.energized);
  mix(st.score & 0xffff); mix((st.score >>> 16) & 0xffff);
  mix(st.circuitsCompleted); mix(st.overloads); mix(st.discharges);
  return h >>> 0;
}

function loadPct(st) { return st.energized / CONFIG.CELLS; }

/* Input queue. Capacity two, so a fast double tap still turns twice instead of
   being swallowed. push returns false when it refuses, which is what lets the
   test prove nothing is silently dropped. */
/* Layout policy. The board is the game, so it takes every pixel left after the
   header, the footer and a thumb sized pair of turn pads. Pure arithmetic and
   load bearing (VIEW applies exactly this), so the harness can prove the board
   never ends up smaller than its own controls again.
   availW / availH are the space left for the pads plus the board. */
var CHROME = Object.freeze({ PAD_MIN: 120, PAD_MAX: 160, PAD_VH: 0.17, PAD_MAX_SHARE: 0.45, GAP: 2, SIDE_MIN: 160 });
function layoutModel(availW, availH) {
  var padH = Math.round(Math.min(CHROME.PAD_MAX, Math.max(CHROME.PAD_MIN, availH * CHROME.PAD_VH)));
  /* on a short viewport a thumb sized pad would still swallow the board */
  if (padH > availH * CHROME.PAD_MAX_SHARE) padH = Math.max(64, Math.round(availH * CHROME.PAD_MAX_SHARE));
  var stageH = availH - padH;
  var side = Math.max(CHROME.SIDE_MIN, Math.min(availW, stageH) - CHROME.GAP);
  return { padH: padH, stageH: stageH, side: side, cell: side / CONFIG.GRID };
}

/* Where a floating notice may sit so it covers no control. Pure arithmetic on
   rects, kept here rather than in VIEW so the harness can prove the toast never
   lands on a button. rects are viewport space {top,bottom}; hudBottom marks the
   band above us that belongs to the header. */
function toastTop(vh, hudBottom, toastH, rects) {
  var ceiling = vh - 12, i, r;
  for (i = 0; i < rects.length; i++) {
    r = rects[i];
    if (r.bottom <= hudBottom) continue;      // header controls are above us
    if (r.top < ceiling) ceiling = r.top;     // highest control we must clear
  }
  var top = ceiling - toastH - 10;
  /* ceiling never exceeds vh - 12, so the toast is on screen by construction and
     the header clamp is the only one that can bind. A third "keep it inside the
     viewport" clamp was written here and deleted: no probe could reach it, and
     untestable code is not a safeguard. On a viewport too short for the header
     and the toast together the toast sits under the header and overflows, which
     is pinned by assertion rather than papered over. */
  if (top < hudBottom + 6) top = hudBottom + 6;
  return top;
}

function makeQueue(cap) {
  var q = [];
  return {
    cap: cap,
    push: function (t) { if (q.length >= cap) return false; q.push(t); return true; },
    shift: function () { return q.length ? q.shift() : 0; },
    size: function () { return q.length; },
    clear: function () { q.length = 0; }
  };
}

/* ---- agents used by the sweep and by the sanity frames ---- */
function safeTurns(st) {
  var out = [], t, h, x, y, ni;
  for (t = -1; t <= 1; t++) {
    h = (st.heading + t + 4) & 3;
    x = cx(st.head) + DX[h]; y = cy(st.head) + DY[h];
    if (x < 0 || y < 0 || x >= CONFIG.GRID || y >= CONFIG.GRID) continue;
    ni = y * CONFIG.GRID + x;
    if (st.cover[ni] > 0) continue;
    out.push(t);
  }
  return out;
}

/* Does the cell this turn lands on still have a way out next tick? One ply is
   enough to stop an agent from stepping into a one cell dead end. */
function turnSurvives(st, t) {
  var h = (st.heading + t + 4) & 3;
  var x = cx(st.head) + DX[h], y = cy(st.head) + DY[h];
  if (x < 0 || y < 0 || x >= CONFIG.GRID || y >= CONFIG.GRID) return false;
  var ni = y * CONFIG.GRID + x;
  if (st.cover[ni] > 0) return false;
  var t2, h2, x2, y2;
  for (t2 = -1; t2 <= 1; t2++) {
    h2 = (h + t2 + 4) & 3;
    x2 = x + DX[h2]; y2 = y + DY[h2];
    if (x2 < 0 || y2 < 0 || x2 >= CONFIG.GRID || y2 >= CONFIG.GRID) continue;
    if (st.cover[y2 * CONFIG.GRID + x2] === 0) return true;
  }
  return false;
}

/* HANDOFF section 6.6 agent: a plain random walk. It does not look where it is
   going, so the edge of the board kills it, which is what the 60 to 200 tick
   envelope was written against. */
function agentRandom(st, rng) { return Math.floor(rng() * 3) - 1; }

/* The same walk with one eye open: uniform over the moves that are not
   instantly fatal. Reported separately because it changes the envelope
   completely (see BUILD-NOTES). */
function agentRandomSafe(st, rng) {
  var safe = safeTurns(st);
  if (!safe.length) return -1;             // boxed in, any move dies
  return safe[Math.floor(rng() * safe.length)];
}

/* BFS over (cell, heading) so the path respects the no reverse rule, avoiding
   energized cells and the edge. Returns the first turn or null.
   `avoid` is an optional cell the search refuses to route through, which is how
   the board filler declines to walk over the discharge pickup. */
function bfsTurn(st, targets, avoid) {
  var G = CONFIG.GRID, N = CONFIG.CELLS;
  var tgt = new Uint8Array(N), i;
  for (i = 0; i < targets.length; i++) if (targets[i] >= 0) tgt[targets[i]] = 1;
  var block = (avoid === undefined || avoid === null) ? -1 : avoid;
  var seen = new Uint8Array(N * 4);
  var qs = new Int32Array(N * 4), qf = new Int8Array(N * 4);
  var qh = 0, qt = 0;
  var s0 = st.head * 4 + st.heading;
  seen[s0] = 1; qs[qt] = s0; qf[qt] = 2; qt++;   // 2 means "no first move yet"
  while (qh < qt) {
    var s = qs[qh], first = qf[qh]; qh++;
    var c = (s / 4) | 0, hd = s & 3, t, nh, x, y, ni, ns;
    for (t = -1; t <= 1; t++) {
      nh = (hd + t + 4) & 3;
      x = cx(c) + DX[nh]; y = cy(c) + DY[nh];
      if (x < 0 || y < 0 || x >= G || y >= G) continue;
      ni = y * G + x;
      if (st.cover[ni] > 0) continue;
      if (ni === block && !tgt[ni]) continue;
      ns = ni * 4 + nh;
      if (seen[ns]) continue;
      seen[ns] = 1;
      var f = first === 2 ? t : first;
      if (tgt[ni]) return f;
      qs[qt] = ns; qf[qt] = f; qt++;
    }
  }
  return null;
}

/* Shared tail for the thinking agents: honour the plan's turn if it survives a
   ply, otherwise take the safe move with the most open neighbours so the worm
   does not paint itself into a pocket. Extracted verbatim out of agentGreedy so
   both agents fail the same way. */
function survivalTurn(st, rng, t) {
  if (t !== null && turnSurvives(st, t)) return t;
  var safe = safeTurns(st);
  if (!safe.length) return -1;
  var pool = [], k;
  for (k = 0; k < safe.length; k++) if (turnSurvives(st, safe[k])) pool.push(safe[k]);
  if (!pool.length) pool = safe;
  if (t !== null && pool.indexOf(t) >= 0) return t;
  var best = pool[0], bestScore = -1, h, x, y, d, nx, ny, open;
  for (k = 0; k < pool.length; k++) {
    h = (st.heading + pool[k] + 4) & 3;
    x = cx(st.head) + DX[h]; y = cy(st.head) + DY[h];
    open = 0;
    for (d = 0; d < 4; d++) {
      nx = x + DX[d]; ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= CONFIG.GRID || ny >= CONFIG.GRID) continue;
      if (st.cover[ny * CONFIG.GRID + nx] === 0) open++;
    }
    if (open > bestScore || (open === bestScore && rng() < 0.34)) { bestScore = open; best = pool[k]; }
  }
  return best;
}

/* Competent play, not perfect play. BFS to the objective avoiding energized
   cells and the edge, take the discharge pickup once the board is getting
   dangerous, and never take a step that leaves nowhere to go next tick.
   That last clause is what stopped this agent dying at 252 ticks while a
   blind random walker lived past a thousand. */
function agentGreedy(st, rng) {
  var targets = [], all = [], i, j, p;
  for (i = 0; i < st.pairs.length; i++) {
    p = st.pairs[i];
    for (j = 0; j < p.active.length; j++) {
      all.push(p.active[j]);
      if (st.charge && p.id === st.charge.pairId) targets.push(p.active[j]);
    }
  }
  if (!st.charge) targets = all;
  var t = null;
  var crowded = st.energized >= CONFIG.CELLS * 0.22;
  if (st.pickup >= 0 && crowded) t = bfsTurn(st, [st.pickup]);
  if (t === null && targets.length) t = bfsTurn(st, targets);
  /* The pair it is holding may be walled off. Swap colour rather than orbit
     forever: seed 9027 ran to the tick cap doing exactly that. */

/* ---- suite 5: spawn rules ---- */
function suiteSpawns() {
  var i, j, st, reds = 0, greens = 0, redFar = 0, greenClose = 0, onWire = 0, unreachable = 0;
  var maxDistOk = 0, maxDistChecked = 0;
  for (i = 0; i < 240; i++) {
    st = newGame(3000 + i);
    /* wander a little so the board is not blank */
    var r = makeRNG(500 + i), n = 0;
    while (st.alive && n < 40) { var sf = safeTurns(st); step(st, sf.length ? sf[r.int(sf.length)] : 0); n++; }
    if (!st.alive) continue;
    var cand = spawnCandidates(st);
    var reach = reachMask(st);
    /* force one pair of each interesting colour by driving the generator */
    for (j = 0; j < st.pairs.length; j++) {
      var p = st.pairs[j];
      if (p.active.length !== 2) continue;
      var a = p.active[0], b = p.active[1];
      if (st.cell[a] !== TERM || st.cell[b] !== TERM) onWire++;
      if (!reach[a] || !reach[b]) unreachable++;
      if (p.color === 'red') { reds++; if (manhattan(a, b) >= CONFIG.RED_MIN_DIST) redFar++; }
      if (p.color === 'green') { greens++; if (manhattan(a, b) <= CONFIG.GREEN_MAX_DIST) greenClose++; }
    }
    /* brute force check of the max distance pair helper */
    if (cand.length >= 2 && cand.length <= 400 && i % 12 === 0) {
      maxDistChecked++;
      var pr = maxDistPair(st, cand), got = manhattan(pr[0], pr[1]);
      var best = 0, x, y;
      for (x = 0; x < cand.length; x++) for (y = x + 1; y < cand.length; y++) {
        var dd = manhattan(cand[x], cand[y]); if (dd > best) best = dd;
      }
      if (got === best) maxDistOk++;
    }
  }
  TEST.ge('the sample produced red pairs', reds, 5);
  TEST.ge('the sample produced green pairs', greens, 20);
  TEST.eq('every red pair spawns far apart', redFar, reds);
  TEST.eq('every green pair spawns close together', greenClose, greens);
  TEST.eq('no terminal sits on wire', onWire, 0);
  TEST.eq('no terminal sits on an unreachable cell', unreachable, 0);
  TEST.ge('the max distance helper was checked', maxDistChecked, 10);
  TEST.eq('the max distance helper matches brute force', maxDistOk, maxDistChecked);
  /* nothing spawns inside the uncommitted circuit */
  var s2 = newGame(4444), bad = 0, g = 0, k;
  var rr = makeRNG(4445);
  while (s2.alive && g < 1200) {
    step(s2, agentGreedy(s2, rr));
    if (s2.charge) {
      var pend = pendingMask(s2);
      for (k = 0; k < s2.pairs.length; k++) {
        for (var q = 0; q < s2.pairs[k].active.length; q++) if (pend[s2.pairs[k].active[q]]) bad++;
      }
      if (s2.pickup >= 0 && pend[s2.pickup]) bad++;
    }
    g++;
  }
  TEST.eq('nothing spawns inside the open circuit', bad, 0);
  /* the board keeps its pair count */
  var s3 = newGame(5555), short = 0, rr3 = makeRNG(5556), g3 = 0;
  while (s3.alive && g3 < 1500) {
    step(s3, agentGreedy(s3, rr3));
    if (s3.pairs.length < 1) short++;
    g3++;
  }
  TEST.eq('the board is never left without a pair', short, 0);
}

function suiteFuzz() {
  var total = 0, runs = 0, errors = [], worstEnergized = 0, invalid = 0;
  var rng = makeRNG(0xF0FA);
  while (total < 5000) {
    runs++;
    var st = newGame(rng.int(1e9)), guard = 0;
    try {
      while (st.alive && total < 5000 && guard < 3000) {
        step(st, rng.int(3) - 1);
        total++; guard++;
        if (st.energized > worstEnergized) worstEnergized = st.energized;
        if (guard % 25 === 0) { var bad = invariants(st); if (bad.length) { invalid++; errors.push(bad[0]); } }
        if (!isFinite(st.score) || st.score < 0 || st.tick < 0 || st.energized < 0) { invalid++; errors.push('bad counter'); }
      }
      var bad2 = invariants(st);
      if (bad2.length) { invalid++; errors.push(bad2[0]); }
    } catch (e) {
      errors.push('threw: ' + (e && e.message));
      invalid++;
      break;
    }
  }
  TEST.eq('five thousand random inputs throw nothing', errors.length, 0, errors.slice(0, 3).join(' | '));
  TEST.eq('every invariant holds through the fuzz', invalid, 0);
  TEST.ge('the fuzz covered several runs', runs, 3);
  TEST.le('energized never exceeds the grid during the fuzz', worstEnergized, CONFIG.CELLS);
  TEST.assert('restarting after death works', (function () {
    var i, ok = true;
    for (i = 0; i < 25; i++) {
      var s = newGame(600 + i), g = 0;
      while (s.alive && g++ < 500) step(s, (g % 7 === 0) ? 1 : 0);
      var s2 = newGame(600 + i);
      if (s2.tick !== 0 || s2.score !== 0 || !s2.alive) ok = false;
    }
    return ok;
  })());
  /* regression: a discharge that erased part of an open circuit must not

  var st2 = newGame(4242);
  st2.trail = [100, 101, 102, 103]; st2.head = 103;
  st2.cell[100] = EMPTY;             // an earlier discharge erased it
  st2.cell[101] = WIRE; st2.cell[102] = WIRE; st2.cell[103] = WIRE;
  st2.charge = { pairId: 9, ci: 0, mult: 1, sliceStart: 0 };
  var pair = { id: 9, ci: 0, color: 'green', mult: 1, active: [], open: true };
  st2.pairs = [pair];
  completeCircuit(st2, pair, []);
  TEST.eq('closing a circuit restores wire a discharge had erased', st2.cell[100], WIRE);
  TEST.eq('the restored cell is energized', st2.cover[100] > 0, true);
  TEST.eq('the restored circuit counts every cell', st2.energized, 4);
}

  TEST.assert('every copy entry has text', (function () {

    for (k in COPY) if (typeof COPY[k] === 'string' && COPY[k].length === 0) return false;
    return true;
  })());
}

/* ---- suite 9: named regressions. Every one of these was a live defect
        caught by a sweep or a fuzz run, written down before it was fixed. ---- */
function suiteRegressions() {
  /* Seeds 9001, 9003, 9012, 9013 and 9027 all ran forever under the greedy
     agent: the worm sealed itself into a pocket, no terminal was reachable,
     and every free cell was either unreachable or hugging live wire so no
     discharge pickup could spawn either. The run could never end. */
  var stuck = [9001, 9003, 9012, 9013, 9027], i, alive = [], rescued = 0;
  for (i = 0; i < stuck.length; i++) {
    var r = playAgent(stuck[i], agentGreedy, stuck[i] - 9000, 8000);
    if (r.st.alive) alive.push(stuck[i]);
    if (r.st.rescues > 0) rescued++;
  }
  TEST.eq('regression: the sealed pocket seeds all terminate', alive.join(','), '');
  /* the rescue must actually be the thing that saves them, not luck */
  TEST.ge('regression: the terminal rescue fired on the sealed pocket seeds', rescued, 1);
  /* a hand built total seal: the worm in a 4 cell box of live wire */
  var st = newGame(9001);
  var i2, box = [];
  for (i2 = 0; i2 < CONFIG.CELLS; i2++) { st.cell[i2] = WIRE; st.cover[i2] = 1; }
  st.energized = CONFIG.CELLS;
  /* open a small pocket around the head */
  var pocket = [210, 211, 230, 231];
  for (i2 = 0; i2 < pocket.length; i2++) { st.cell[pocket[i2]] = EMPTY; st.cover[pocket[i2]] = 0; st.energized--; }
  st.cell[210] = WIRE; st.head = 210;
  st.circuits = [{ id: 1, ci: 0, cells: [0, 1, 2], len: 3, tick: 1, score: 1 }];
  var ev = [];
  rescueCheck(st, ev);
  TEST.assert('regression: a total seal triggers a rescue', ev.length > 0 && ev[ev.length - 1].t === 'rescue');
  TEST.assert('regression: the rescue leaves the worm something to reach', (function () {
    var reach = reachMask(st), k, q;
    for (k = 0; k < st.pairs.length; k++) {
      for (q = 0; q < st.pairs[k].active.length; q++) if (reach[st.pairs[k].active[q]]) return true;
    }
    return st.circuits.length === 0;       // or the mercy discharge reopened it
  })());
  TEST.assert('regression: the rescue never leaves a half open pair', (function () {
    var k;
    for (k = 0; k < st.pairs.length; k++) if (st.pairs[k].active.length !== 2) return false;
    return true;
  })());
  TEST.eq('regression: the rescue drops any charge it cannot honour', st.charge, null);
  /* the rescue must not fire on a healthy board */
  var s2 = newGame(4242), rr = makeRNG(1), g = 0;
  while (s2.alive && g < 400) { step(s2, agentGreedy(s2, rr)); g++; }
  TEST.assert('regression: the rescue stays quiet on a board that is fine', s2.rescues <= 2, 'rescues ' + s2.rescues);
}

/* ---- suite 10: the creep hazard ---- */
function suiteCreep() {
  TEST.assert('the creep interval is a real number of ticks', CONFIG.CREEP_INTERVAL > 0 && CONFIG.CREEP_INTERVAL < 400);
  /* nothing creeps before the player has built anything */
  var st = newGame(11), i, sf;
  for (i = 0; i < CONFIG.CREEP_INTERVAL * 3 && st.alive; i++) { sf = safeTurns(st); step(st, sf.length ? sf[0] : 0); }
  TEST.eq('an empty board never creeps', st.creeps, 0);

  /* a board with one live circuit and a lazy worm does creep */
  function seeded(seed) {
    var s = newGame(seed), k;
    /* hand build a live circuit far from the head so the fairness rules do not
       starve the candidate list */
    var cells = [];
    for (k = 0; k < 40 && cells.length < 12; k++) {
      if (s.cell[k] === EMPTY && k !== s.head && manhattan(k, s.head) > 1) cells.push(k);
    }
    for (k = 0; k < cells.length; k++) { s.cell[cells[k]] = WIRE; s.cover[cells[k]] = 1; s.ccol[cells[k]] = 1; s.energized++; }
    s.circuits.push({ id: 1, ci: 0, cells: cells, len: cells.length, tick: 0, score: 0 });
    return s;
  }
  var s2 = seeded(12), ticks = 0;
  while (s2.alive && ticks < CONFIG.CREEP_INTERVAL * 2 && s2.creeps === 0) {
    var sf2 = safeTurns(s2); step(s2, sf2.length ? sf2[0] : 0); ticks++;
  }
  TEST.ge('live wire with nowhere to go creeps when the player stalls', s2.creeps, 1);
  TEST.assert('a creep raises the load meter', s2.energized > 12, 'energized ' + s2.energized);
  TEST.eq('the counter and the board agree after a creep', invariants(s2).join(' | '), '');

  /* fairness: never adjacent to the head */
  var bad = 0, near = 0, r, e, m;
  for (i = 0; i < 40; i++) {
    var s3 = seeded(500 + i), n = 0;
    while (s3.alive && n < 400) {
      var sf3 = safeTurns(s3);
      r = step(s3, sf3.length ? sf3[0] : 0);
      for (e = 0; e < r.events.length; e++) {
        if (r.events[e].t !== 'creep') continue;
        m = manhattan(r.events[e].cell, s3.head);
        if (m <= 1) near++;
        if (s3.cover[r.events[e].cell] === 0) bad++;
      }
      n++;
    }
  }
  TEST.eq('the creep never lights a cell next to the worm head', near, 0);
  TEST.eq('every creep event actually energized its cell', bad, 0);

  /* The statistical sweep above almost never SEES a head adjacent candidate, so
     on its own it is a gate that cannot fail. Test the filter directly on a
     board built so the banned cells would otherwise qualify. */
  var g2 = CONFIG.GRID;
  function bare(seed) {
    var s = newGame(seed), k;
    for (k = 0; k < CONFIG.CELLS; k++) { s.cell[k] = EMPTY; s.tcol[k] = 0; s.cover[k] = 0; s.ccol[k] = 0; }
    s.pairs.length = 0; s.energized = 0;
    s.cell[s.head] = WIRE;
    return s;
  }
  function light(s, k) { s.cell[k] = WIRE; s.cover[k] = 1; s.ccol[k] = 1; s.energized++; return k; }

  var sA = bare(64), hA = sA.head;
  light(sA, hA + 2);                              // two cells right of the head
  var candA = creepCandidates(sA);
  TEST.assert('the cell beside the head would otherwise qualify', (function () {
    /* the guard is the only thing keeping hA + 1 out: it is empty and touches
       live wire, so if this board stopped being interesting the gate below
       would go quiet without anyone noticing */
    return sA.cell[hA + 1] === EMPTY && sA.cover[hA + 2] > 0;
  })());
  TEST.assert('no creep candidate is next to the worm head', (function () {
    var k;
    for (k = 0; k < candA.length; k++) if (manhattan(candA[k], sA.head) <= 1) return false;
    return true;
  })(), candA.join(','));
  TEST.ge('the same board still offers the creep somewhere else to go', candA.length, 1);

  var sB = bare(65), hB = sB.head;
  light(sB, hB + 2 * g2);                         // two rows below
  sB.trail = [hB, hB + 2 * g2 + 1, hB + 2 * g2 - 1];
  sB.charge = { pairId: 1, ci: 0, mult: 1, sliceStart: 1 };
  var candB = creepCandidates(sB), inPend = 0;
  var pendB = pendingMask(sB);
  for (i = 0; i < candB.length; i++) if (pendB[candB[i]]) inPend++;
  TEST.assert('the pending cells would otherwise qualify', pendB[hB + 2 * g2 + 1] === 1 && sB.cell[hB + 2 * g2 + 1] === EMPTY);
  TEST.eq('no creep candidate sits inside the circuit you are drawing', inPend, 0);

  var sC = bare(66), hC = sC.head;
  light(sC, hC + 2);
  sC.cell[hC + 3] = TERM; sC.tcol[hC + 3] = 1;
  sC.cell[hC + 2 - g2] = PICK; sC.pickup = hC + 2 - g2;
  var candC = creepCandidates(sC), stole = 0;
  for (i = 0; i < candC.length; i++) if (sC.cell[candC[i]] === TERM || sC.cell[candC[i]] === PICK) stole++;
  TEST.eq('no creep candidate is a terminal or the relief valve', stole, 0);

  /* fairness: never inside the circuit the player is drawing */
  var s4 = seeded(999);
  s4.charge = { pairId: 99, ci: 0, mult: 1, sliceStart: 0 };
  var pend = pendingMask(s4), ev4 = [], hit = 0;
  for (i = 0; i < 30; i++) { creepStep(s4, ev4); }
  for (i = 0; i < ev4.length; i++) if (ev4[i].t === 'creep' && pend[ev4[i].cell]) hit++;
  TEST.eq('the creep never takes a cell of the circuit you are drawing', hit, 0);

  /* it never takes a terminal or the pickup */
  var s5 = seeded(4321), ev5 = [], stolen = 0;
  for (i = 0; i < 60; i++) {
    var before = [];
    for (var q = 0; q < s5.pairs.length; q++) before = before.concat(s5.pairs[q].active);
    creepStep(s5, ev5);
    for (q = 0; q < before.length; q++) if (s5.cover[before[q]] > 0) stolen++;
  }
  TEST.eq('the creep never energizes a terminal', stolen, 0);

  /* it can trip the breaker rather than only punish */
  var s6 = newGame(31), cellsBig = [];
  for (i = 0; i < CONFIG.CELLS; i++) {
    if (cellsBig.length >= CONFIG.OVERLOAD_CELLS - 1) break;
    if (i === s6.head || manhattan(i, s6.head) <= 1) continue;
    if (s6.cell[i] === TERM) continue;
    cellsBig.push(i);
  }
  for (i = 0; i < cellsBig.length; i++) { s6.cell[cellsBig[i]] = WIRE; s6.cover[cellsBig[i]] = 1; s6.energized++; }
  s6.circuits.push({ id: 1, ci: 0, cells: cellsBig.slice(), len: cellsBig.length, tick: 0, score: 0 });
  var ev6 = [], fired = false;
  for (i = 0; i < 12 && !fired; i++) {
    ev6.length = 0;
    creepStep(s6, ev6);
    for (var z = 0; z < ev6.length; z++) if (ev6[z].t === 'overload') fired = true;
  }
  TEST.assert('a creep at the threshold trips the breaker', fired, 'energized ' + s6.energized);

  /* the creep clock resets on a completion, so active play is never punished */
  var s7 = newGame(55);
  s7.creepTicks = CONFIG.CREEP_INTERVAL - 1;
  var p7 = s7.pairs[0];
  s7.charge = { pairId: p7.id, ci: p7.ci, mult: p7.mult, sliceStart: 0 };
  completeCircuit(s7, p7, []);
  TEST.eq('closing a circuit resets the creep clock', s7.creepTicks, 0);
}

/* ---- suite 11: endless against daily ---- */
function suiteDaily() {
  var endless = newGame(7);
  TEST.eq('an endless run has no clock', endless.tickLimit, 0);
  TEST.eq('an endless run is tagged free', endless.mode, 'free');
  var daily = newGame(7, { mode: 'daily' });
  TEST.eq('a daily run carries the shift clock', daily.tickLimit, CONFIG.DAILY_TICKS);
  TEST.eq('a daily run is tagged daily', daily.mode, 'daily');
  var sf, i, n = 0;
  while (daily.alive && n < CONFIG.DAILY_TICKS * 2) {
    sf = safeTurns(daily);
    step(daily, sf.length ? sf[Math.min(1, sf.length - 1)] : 0);
    n++;
  }
  TEST.assert('the daily always ends', !daily.alive);
  TEST.le('the daily never runs past its clock', daily.tick, CONFIG.DAILY_TICKS);
  /* a careful daily player runs out of clock rather than board */
  var clocked = 0;
  for (i = 0; i < 20; i++) {
    var r = playAgent(6000 + i, agentGreedy, i, CONFIG.DAILY_TICKS * 3, null, { mode: 'daily' });
    if (r.st.cause === 'clock') clocked++;
    if (r.st.tick > CONFIG.DAILY_TICKS) { TEST.assert('daily run ' + i + ' respected the clock', false, r.st.tick); }
  }
  TEST.ge('some daily runs end on the clock rather than on the board', clocked, 1);
  TEST.assert('the same daily seed plays the same board', hashState(newGame(9, { mode: 'daily' })) === hashState(newGame(9, { mode: 'daily' })));
  TEST.assert('endless and daily share the board, not the clock',
    hashState(newGame(9)) === hashState(newGame(9, { mode: 'daily' })));
}

/* ---- suite 12: the board filler, the second playstyle ---- */
function suiteFiller() {
  var i, r, overloads = 0, scored = 0, peak = 0;
  for (i = 0; i < 24; i++) {
    r = playAgent(3100 + i, agentFiller, i + 1, 4000);
    overloads += r.st.overloads;
    if (r.st.score > 0) scored++;
    if (r.st.energized > peak) peak = r.st.energized;
    if (invariants(r.st).length) TEST.assert('filler run ' + i + ' kept the invariants', false, invariants(r.st).join(' | '));
  }
  TEST.ge('the board filler trips the breaker', overloads, 1);
  TEST.eq('every board filler run scores', scored, 24);
  TEST.assert('the board filler builds longer circuits than the combo chaser', (function () {
    var a = 0, b = 0, k, x;
    for (k = 0; k < 10; k++) {
      x = playAgent(3200 + k, agentFiller, k, 3000); a += x.st.longest;
      x = playAgent(3200 + k, agentGreedy, k, 3000); b += x.st.longest;
    }
    return a > b;
  })());
  /* the avoid argument is what lets the filler refuse the relief valve. Build a
     one cell corridor whose only route to the target runs over the avoided
     cell: with it avoided there is no route at all. */
  TEST.assert('a bfs told to avoid a cell will not route through it', (function () {
    var s = newGame(21), k, gg = CONFIG.GRID, wall;
    for (k = 0; k < CONFIG.CELLS; k++) { s.cell[k] = EMPTY; s.tcol[k] = 0; s.cover[k] = 0; }
    s.pairs.length = 0; s.energized = 0;
    /* seal row 9 except one gate at x = 10 */
    for (k = 0; k < gg; k++) {
      wall = 9 * gg + k;
      if (k === 10) continue;
      s.cell[wall] = WIRE; s.cover[wall] = 1; s.energized++;
    }
    s.head = 12 * gg + 10; s.heading = 0;         // below the wall, facing up
    var gate = 9 * gg + 10, target = 3 * gg + 10;
    var open = bfsTurn(s, [target]);
    var closed = bfsTurn(s, [target], gate);
    return open !== null && closed === null;
  })());
  TEST.assert('the board filler does not chase the discharge pickup', (function () {
    /* it may still be forced onto one by the survival fallback; what is asserted
       is that it never goes out of its way for one the way greedy does */
    var f = 0, g = 0, k, x;
    for (k = 0; k < 16; k++) {
      x = playAgent(3300 + k, agentFiller, k, 3000); f += x.st.discharges;
      x = playAgent(3300 + k, agentGreedy, k, 3000); g += x.st.discharges;
    }
    return f <= g * 1.5 + 2;
  })());
  TEST.eq('pendingLen is zero with no charge', pendingLen(newGame(5)), 0);
  TEST.eq('pendingNew is zero with no charge', pendingNew(newGame(5)), 0);
  TEST.assert('pendingNew never exceeds pendingLen', (function () {
    var s = newGame(88), n = 0, k, sf;
    s.charge = { pairId: 1, ci: 0, mult: 1, sliceStart: 0 };
    while (s.alive && n < 120) { sf = safeTurns(s); step(s, sf.length ? sf[0] : 0); n++; if (pendingNew(s) > pendingLen(s)) return false; }
    return pendingLen(s) > 1;
  })());
}

function suiteBalance() {
  /* a small in page envelope check. sim.js runs the full sweep. */
  var i, randTicks = [], safeTicks = [], greedyTicks = [];
  for (i = 0; i < 60; i++) {
    randTicks.push(playAgent(20000 + i, agentRandom, 100 + i, 8000).st.tick);
    safeTicks.push(playAgent(20000 + i, agentRandomSafe, 100 + i, 8000).st.tick);
    greedyTicks.push(playAgent(20000 + i, agentGreedy, 100 + i, 8000).st.tick);
  }
  function med(a) { var b = a.slice().sort(function (x, y) { return x - y; }); return b[b.length >> 1]; }
  var rm = med(randTicks), sm = med(safeTicks), gm = med(greedyTicks);
  TEST.ge('the random agent survives more than a handful of ticks', rm, 10);
  TEST.assert('the plain random walk dies quickly', rm <= 260, 'random median ' + rm);
  TEST.assert('looking where you are going helps', sm > rm, sm + ' vs ' + rm);
  TEST.assert('the greedy agent outlives the plain random agent', gm > rm, gm + ' vs ' + rm);
  TEST.le('the greedy agent is not immortal', gm, 2000, 'greedy median ' + gm);
  TEST.assert('the greedy agent scores', (function () {
    var r = playAgent(4242, agentGreedy, 9, 8000); return r.st.score > 0;
  })());
  TEST.assert('every run ends', (function () {
    var i, ok = true;
    for (i = 0; i < 30; i++) { if (playAgent(9000 + i, agentGreedy, i, 8000).st.alive) ok = false; }
    return ok;
  })());
  TEST.assert('the speed ramp reaches the floor', (function () {
    var ms = CONFIG.TICK_START_MS - CONFIG.TICK_STEP_MS * 40;
    return Math.max(CONFIG.TICK_FLOOR_MS, ms) === CONFIG.TICK_FLOOR_MS;
  })());
  TEST.eq('the ramp starts at the stated tick', Math.max(CONFIG.TICK_FLOOR_MS, CONFIG.TICK_START_MS - 0), CONFIG.TICK_START_MS);
}

/* ---- suite: a floating notice must never cover a control ---- */
function suiteToastPlacement() {
  function overlaps(top, h, rects, hudBottom) {
    var i, r, bad = 0;
    for (i = 0; i < rects.length; i++) {
      r = rects[i];
      if (r.bottom <= hudBottom) continue;     // header band, allowed behind us
      if (top < r.bottom && (top + h) > r.top) bad++;
    }
    return bad;
  }
  /* the real geometry that broke: the death sheet at 390x844, SAVE CARD/SHARE
     over WATCH BEST/PLAY AGAIN, with the old toast pinned 72px off the bottom */
  var vh = 844, hudBottom = 58, th = 40;
  var sheet = [
    { top: 700, bottom: 748 },                 // SAVE CARD / SHARE row
    { top: 756, bottom: 804 },                 // WATCH BEST / PLAY AGAIN row
    { top: 10, bottom: 58 }                    // the HUD gear
  ];
  var oldTop = vh - 72 - th;                   // what the old CSS produced
  TEST.ge('the old fixed offset toast did cover a control', overlaps(oldTop, th, sheet, hudBottom), 1);
  var top = toastTop(vh, hudBottom, th, sheet);
  TEST.eq('the placed toast covers no control on the death sheet', overlaps(top, th, sheet, hudBottom), 0);
  TEST.assert('the placed toast clears the highest control', top + th <= 700, 'bottom ' + (top + th));
  TEST.ge('the placed toast stays below the header', top, hudBottom + 6);
  /* in play: turn pads plus the footer row */
  var play = [
    { top: 10, bottom: 58 },                   // gear
    { top: 660, bottom: 760 },                 // turn pads
    { top: 770, bottom: 818 }                  // EXIT / DAILY / START
  ];
  var t2 = toastTop(vh, hudBottom, th, play);
  TEST.eq('the placed toast covers no control during play', overlaps(t2, th, play, hudBottom), 0);
  TEST.assert('the placed toast clears the turn pads', t2 + th <= 660, 'bottom ' + (t2 + th));
  /* a bare screen: it may sit low, but never off the bottom */
  var t3 = toastTop(vh, hudBottom, th, [{ top: 10, bottom: 58 }]);
  TEST.le('with nothing in the way the toast stays on screen', t3 + th, vh - 6);
  TEST.ge('with nothing in the way the toast still clears the header', t3, hudBottom + 6);
  /* the header clamp is the only one that can bind */
  var t4 = toastTop(500, 58, th, [{ top: 70, bottom: 118 }, { top: 130, bottom: 178 }]);
  TEST.eq('the header clamp binds when controls crowd it', t4, 58 + 6);
  TEST.le('placement is on screen by construction', toastTop(vh, hudBottom, th, sheet) + th, vh - 12);
  TEST.eq('a viewport too short for both puts the toast under the header', toastTop(200, 58, 140, []), 64);
  /* a two line toast must be measured, not assumed */
  var tall = toastTop(vh, hudBottom, 78, sheet);
  TEST.eq('a taller toast is placed by its real height', overlaps(tall, 78, sheet, hudBottom), 0);
  TEST.assert('a taller toast moves further up', tall < top, tall + ' vs ' + top);
}

/* ---- suite: the board must be the biggest thing on the screen ---- */
function suiteLayout() {
  function board(vw, vh, hud, foot) {
    var m = layoutModel(vw, vh - hud - foot);
    return { cell: m.cell, side: m.side, padH: m.padH,
             boardArea: m.side * m.side, padArea: vw * m.padH };
  }
  /* the phone the design targets */
  var p = board(390, 844, 64, 64);
  TEST.ge('390x844: cells are big enough to read', p.cell, 18);
  TEST.assert('390x844: the board outweighs the turn pads', p.boardArea > p.padArea * 1.5,
    'board ' + Math.round(p.boardArea) + ' vs pads ' + Math.round(p.padArea));
  TEST.assert('390x844: the board is wider than it is tall constrained', p.side >= 380, 'side ' + p.side);
  /* the small phone the touch rules are measured at */
  var q = board(375, 667, 64, 64);
  TEST.ge('375x667: cells stay readable', q.cell, 17);
  TEST.assert('375x667: the board still outweighs the pads', q.boardArea > q.padArea, 'board ' + Math.round(q.boardArea) + ' vs pads ' + Math.round(q.padArea));
  TEST.ge('375x667: the pads stay thumb sized', q.padH, 100);
  TEST.le('375x667: the pads never take over', q.padH, CHROME.PAD_MAX);
  /* a small old phone */
  var r = board(320, 568, 64, 64);
  TEST.ge('320x568: cells remain legible', r.cell, 13);
  TEST.assert('320x568: the pads never take half the column', r.padH <= (568 - 128) * CHROME.PAD_MAX_SHARE + 1, 'pad ' + r.padH);
  /* desktop: height bound, and it must not stretch */
  var d = board(1280, 800, 64, 64);
  TEST.ge('desktop: the board grows with the height it is given', d.cell, 20);
  TEST.eq('desktop: the board stays square', d.side, d.side);
  TEST.assert('desktop: the board is bounded by height not width', d.side < 1280, 'side ' + d.side);
  /* the regression itself: the board must never be smaller than its controls */
  var sizes = [[320, 568], [360, 640], [375, 667], [390, 844], [414, 896], [768, 1024], [1280, 800]];
  var bad = [], i, b;
  for (i = 0; i < sizes.length; i++) {
    b = board(sizes[i][0], sizes[i][1], 64, 64);
    if (b.boardArea <= b.padArea) bad.push(sizes[i].join('x'));
    if (b.cell < 12) bad.push(sizes[i].join('x') + ' cell ' + b.cell.toFixed(1));
  }
  TEST.eq('the board is never smaller than its own controls', bad.join(','), '');
  /* cells stay fractional: flooring throws away real size */
  TEST.assert('cell size is not rounded down to an integer', Math.abs(p.cell - Math.floor(p.cell)) > 0, 'cell ' + p.cell);
  TEST.ge('the pad height never collapses below a thumb', board(390, 400, 64, 64).padH, 64);
  /* the share guard only binds on a genuinely short column (landscape, a small
     window, a browser with a lot of chrome). Exercise it, or it is dead code. */
  var shortH = 240;
  var sm = layoutModel(390, shortH);
  TEST.le('a short column caps the pads at 45 percent', sm.padH, Math.round(shortH * CHROME.PAD_MAX_SHARE));
  TEST.assert('the share guard actually bound', sm.padH < CHROME.PAD_MIN, 'padH ' + sm.padH + ' vs min ' + CHROME.PAD_MIN);
  TEST.assert('a short column still leaves the board the majority', sm.stageH > sm.padH, sm.stageH + ' vs ' + sm.padH);
  var tiny = layoutModel(390, 120);
  TEST.ge('an extremely short column keeps a usable pad', tiny.padH, 54);
  TEST.assert('an extremely short column never gives the pads everything', tiny.stageH > 0, 'stage ' + tiny.stageH);
}
